<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Daily Spin - Reward Platform</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}


/* =====================================================
   TOP NAVIGATION
===================================================== */

.top-nav {
    background: #182848;
    padding: 12px 10px;
    display: flex;
    align-items: center;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button {
    width: auto;
    margin: 0;

    padding: 11px 16px;

    background: rgba(255,255,255,0.12);

    color: white;

    border: none;

    border-radius: 10px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.back-button:hover {
    background: rgba(255,255,255,0.22);
}


/* =====================================================
   HEADER
===================================================== */

header {
    background: #182848;

    color: white;

    padding: 25px 15px;

    text-align: center;
}

header h1 {
    margin: 0;

    animation:
        headerHeadingInvert
        3s
        infinite
        alternate;
}

header p {
    margin: 8px 0 0;
}


@keyframes headerHeadingInvert {

    0% {
        color: white;
    }

    100% {
        color: #00bfff;
    }

}


/* =====================================================
   CONTENT
===================================================== */

.container {
    max-width: 700px;

    margin: auto;

    padding: 15px;
}


/* =====================================================
   POINTS CARD
===================================================== */

.points-card {
    background: white;

    border-radius: 14px;

    padding: 20px;

    margin: 15px 0;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

    text-align: center;
}

.points-card h2 {
    animation:
        cardHeadingInvert
        3s
        infinite
        alternate;
}


@keyframes cardHeadingInvert {

    0% {
        color: #182848;
    }

    100% {
        color: #00bfff;
    }

}


.points-number {
    font-size: 42px;

    font-weight: bold;

    margin: 10px 0;
}


/* =====================================================
   DAY
===================================================== */

.day {
    text-align: center;

    font-weight: bold;

    margin: 20px 0;
}


/* =====================================================
   SPIN CARD
===================================================== */

.spin-card {
    background: white;

    border-radius: 14px;

    padding: 25px 20px;

    margin: 15px 0;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

    text-align: center;
}

.spin-card h2 {
    animation:
        cardHeadingInvert
        3s
        infinite
        alternate;
}


/* =====================================================
   WHEEL
===================================================== */

.wheel-container {
    position: relative;

    width: 300px;

    height: 300px;

    margin: 25px auto;
}


#wheel {
    width: 300px;

    height: 300px;

    border-radius: 50%;

    border: 8px solid #182848;

    background:
        conic-gradient(
            #ff7675 0deg 45deg,
            #74b9ff 45deg 90deg,
            #55efc4 90deg 135deg,
            #ffeaa7 135deg 180deg,
            #a29bfe 180deg 225deg,
            #fd79a8 225deg 270deg,
            #81ecec 270deg 315deg,
            #fab1a0 315deg 360deg
        );

    position: relative;

    transition:
        transform 5s
        cubic-bezier(
            0.17,
            0.67,
            0.12,
            0.99
        );

    box-shadow:
        0 5px 15px
        rgba(0,0,0,0.20);
}


/* =====================================================
   WHEEL LABELS
===================================================== */

.wheel-label {
    position: absolute;

    width: 100%;

    height: 100%;

    top: 0;

    left: 0;

    pointer-events: none;
}

.wheel-label span {
    position: absolute;

    left: 50%;

    top: 50%;

    transform-origin: 0 0;

    font-size: 17px;

    font-weight: bold;

    color: #182848;

    text-shadow:
        0 1px 2px
        rgba(255,255,255,0.8);
}


/* =====================================================
   POINTER
===================================================== */

.pointer {
    position: absolute;

    top: -12px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 0;

    height: 0;

    border-left: 18px solid transparent;

    border-right: 18px solid transparent;

    border-top: 35px solid #182848;

    z-index: 5;
}


/* =====================================================
   CENTER
===================================================== */

.wheel-center {
    position: absolute;

    top: 50%;

    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 65px;

    height: 65px;

    border-radius: 50%;

    background: white;

    border: 6px solid #182848;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 28px;

    z-index: 4;
}


/* =====================================================
   SPIN BUTTON
===================================================== */

.spin-button {
    max-width: 350px;

    margin: 20px auto 10px;

    display: block;

    background: #182848;

    color: white;

    border: none;

    border-radius: 12px;

    padding: 16px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;
}

.spin-button:hover {
    opacity: 0.9;
}

.spin-button:disabled {
    background: #999;

    cursor: not-allowed;
}


/* =====================================================
   RESULT
===================================================== */

.result {
    text-align: center;

    font-size: 22px;

    font-weight: bold;

    min-height: 32px;

    margin-top: 15px;
}


/* =====================================================
   MESSAGE
===================================================== */

.message {
    text-align: center;

    font-weight: bold;

    margin-top: 12px;
}


/* =====================================================
   FOOTER
===================================================== */

footer {
    text-align: center;

    padding: 25px;

    color: #666;

    font-size: 14px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    .wheel-container {
        width: 270px;
        height: 270px;
    }

    #wheel {
        width: 270px;
        height: 270px;
    }

    .wheel-label span {
        font-size: 15px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN PROTECTION
===================================================== -->

<script>

if (
    localStorage.getItem("loggedIn")
    !==
    "true"
) {

    window.location.href =
        "login.html";

}

</script>


<!-- =====================================================
     TOP NAVIGATION
===================================================== -->

<nav class="top-nav">

    <button
        class="back-button"
        onclick="goBack()"
    >

        ← Back

    </button>

</nav>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <h1>
        🎡 Daily Spin
    </h1>

    <p>
        Spin once every day and win points!
    </p>

</header>


<div class="container">


<!-- =====================================================
     POINTS
===================================================== -->

<div class="points-card">

    <h2>
        💰 Your Points
    </h2>

    <div
        class="points-number"
        id="points"
    >
        0
    </div>

    <p>
        points available
    </p>

</div>


<!-- =====================================================
     DAY
===================================================== -->

<div
    class="day"
    id="dayDisplay"
>
</div>


<!-- =====================================================
     SPIN
===================================================== -->

<div class="spin-card">

    <h2>
        🎁 Spin the Wheel
    </h2>

    <p>
        You can spin the wheel
        <strong>once per day</strong>.
    </p>


    <div class="wheel-container">

        <div class="pointer"></div>


        <div id="wheel">

            <div class="wheel-label">

                <span
                    style="
                    transform:
                    rotate(22.5deg)
                    translate(95px)
                    rotate(-22.5deg);
                    "
                >
                    5
                </span>

                <span
                    style="
                    transform:
                    rotate(67.5deg)
                    translate(95px)
                    rotate(-67.5deg);
                    "
                >
                    10
                </span>

                <span
                    style="
                    transform:
                    rotate(112.5deg)
                    translate(95px)
                    rotate(-112.5deg);
                    "
                >
                    15
                </span>

                <span
                    style="
                    transform:
                    rotate(157.5deg)
                    translate(95px)
                    rotate(-157.5deg);
                    "
                >
                    20
                </span>

                <span
                    style="
                    transform:
                    rotate(202.5deg)
                    translate(95px)
                    rotate(-202.5deg);
                    "
                >
                    25
                </span>

                <span
                    style="
                    transform:
                    rotate(247.5deg)
                    translate(95px)
                    rotate(-247.5deg);
                    "
                >
                    30
                </span>

                <span
                    style="
                    transform:
                    rotate(292.5deg)
                    translate(95px)
                    rotate(-292.5deg);
                    "
                >
                    40
                </span>

                <span
                    style="
                    transform:
                    rotate(337.5deg)
                    translate(95px)
                    rotate(-337.5deg);
                    "
                >
                    50
                </span>

            </div>


            <div class="wheel-center">
                🎡
            </div>

        </div>

    </div>


    <button
        class="spin-button"
        id="spinButton"
        onclick="spinWheel()"
    >

        🎡 SPIN NOW

    </button>


    <div
        class="result"
        id="result"
    >
    </div>


    <div
        class="message"
        id="message"
    >
    </div>

</div>


</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    Reward Platform — Prototype

</footer>


<script>

/* =====================================================
   DATE
===================================================== */

const today =
    new Date().toDateString();


document.getElementById(
    "dayDisplay"
).textContent =
    "Today's Spin — " + today;


/* =====================================================
   POINTS DISPLAY
===================================================== */

function updateDisplay() {

    const points =
        Number(
            localStorage.getItem(
                "rewardPoints"
            )
        ) || 0;


    document.getElementById(
        "points"
    ).textContent =
        points;

}


/* =====================================================
   ADD POINTS
===================================================== */

function addPoints(
    amount,
    activity
) {

    let points =
        Number(
            localStorage.getItem(
                "rewardPoints"
            )
        ) || 0;


    points += amount;


    localStorage.setItem(
        "rewardPoints",
        points
    );


    let history;

    try {

        history =
            JSON.parse(
                localStorage.getItem(
                    "rewardHistory"
                )
            ) || [];

        if (!Array.isArray(history)) {
            history = [];
        }

    } catch (error) {

        history = [];

    }


    history.push({

        activity:
            activity,

        points:
            amount,

        date:
            new Date().toLocaleString()

    });


    localStorage.setItem(
        "rewardHistory",
        JSON.stringify(history)
    );


    updateDisplay();

}


/* =====================================================
   REWARDS
===================================================== */

const rewards = [

    5,
    10,
    15,
    20,
    25,
    30,
    40,
    50

];


/* =====================================================
   SPIN
===================================================== */

let spinning = false;


function spinWheel() {

    if (spinning) {
        return;
    }


    const lastSpin =
        localStorage.getItem(
            "lastSpin"
        );


    /* Check daily limit */

    if (
        lastSpin === today
    ) {

        document.getElementById(
            "message"
        ).textContent =
            "You already used today's spin.";

        document.getElementById(
            "spinButton"
        ).disabled = true;

        return;

    }


    spinning = true;


    const button =
        document.getElementById(
            "spinButton"
        );


    const result =
        document.getElementById(
            "result"
        );


    const message =
        document.getElementById(
            "message"
        );


    button.disabled = true;

    button.textContent =
        "⏳ Spinning...";


    result.textContent = "";

    message.textContent = "";


    /* =================================================
       SELECT REWARD
    ================================================= */

    const rewardIndex =
        Math.floor(
            Math.random()
            *
            rewards.length
        );


    const reward =
        rewards[rewardIndex];


    /* =================================================
       WHEEL ROTATION
    ================================================= */

    const wheel =
        document.getElementById(
            "wheel"
        );


    const segmentSize =
        360 / rewards.length;


    const targetAngle =
        360
        -
        (
            rewardIndex
            *
            segmentSize
        )
        -
        (
            segmentSize / 2
        );


    const extraSpins =
        360 * 6;


    const finalRotation =
        extraSpins
        +
        targetAngle;


    wheel.style.transform =
        "rotate("
        +
        finalRotation
        +
        "deg)";


    /* =================================================
       COMPLETE AFTER ANIMATION
    ================================================= */

    setTimeout(
        function() {

            spinning = false;


            /* Save today's spin */

            localStorage.setItem(
                "lastSpin",
                today
            );


            /* Award points */

            addPoints(
                reward,
                "Daily Spin"
            );


            /* Display result */

            result.textContent =
                "🎉 You won "
                +
                reward
                +
                " points!";


            message.textContent =
                "Your points have been added to your balance.";


            button.textContent =
                "✅ Spin Completed Today";


            button.disabled = true;


        },
        5000
    );

}


/* =====================================================
   CHECK TODAY'S STATUS
===================================================== */

function checkSpinStatus() {

    const lastSpin =
        localStorage.getItem(
            "lastSpin"
        );


    if (
        lastSpin === today
    ) {

        const button =
            document.getElementById(
                "spinButton"
            );


        button.disabled = true;


        button.textContent =
            "✅ Spin Completed Today";


        document.getElementById(
            "message"
        ).textContent =
            "You already used today's spin.";

    }

}


/* =====================================================
   BACK BUTTON
===================================================== */

function goBack() {

    window.history.back();

}


/* =====================================================
   INITIALIZE
===================================================== */

updateDisplay();

checkSpinStatus();

</script>


</body>

</html>
