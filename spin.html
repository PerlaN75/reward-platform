<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Daily Spin - Reward Platform</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}


/* =====================================================
   TOP NAVIGATION
===================================================== */

.top-nav {
    background: #182848;
    padding: 12px 10px;
    display: flex;
    align-items: center;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button {
    width: auto;
    margin: 0;

    padding: 11px 16px;

    background: rgba(255,255,255,0.12);

    color: white;

    border: none;

    border-radius: 10px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.back-button:hover {
    background: rgba(255,255,255,0.22);
}


/* =====================================================
   HEADER
===================================================== */

header {
    background: #182848;

    color: white;

    padding: 25px 15px;

    text-align: center;
}

header h1 {
    margin: 0;

    animation:
        headerHeadingInvert
        3s infinite alternate;
}

header p {
    margin: 8px 0 0;
}


/* =====================================================
   HEADER ANIMATION
===================================================== */

@keyframes headerHeadingInvert {

    0% {
        color: white;
    }

    100% {
        color: #00bfff;
    }

}


/* =====================================================
   CONTENT
===================================================== */

.container {
    max-width: 700px;

    margin: auto;

    padding: 15px;
}


/* =====================================================
   CARD
===================================================== */

.card {
    background: white;

    border-radius: 14px;

    padding: 20px;

    margin: 15px 0;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);
}

.card h2 {
    animation:
        cardHeadingInvert
        3s infinite alternate;
}


/* =====================================================
   CARD HEADING ANIMATION
===================================================== */

@keyframes cardHeadingInvert {

    0% {
        color: #182848;
    }

    100% {
        color: #00bfff;
    }

}


/* =====================================================
   POINTS
===================================================== */

.points {
    text-align: center;
}

.points-number {
    font-size: 42px;

    font-weight: bold;

    margin: 10px 0;
}


/* =====================================================
   SPIN AREA
===================================================== */

.spin-area {
    text-align: center;

    padding: 10px 0 20px;
}


/* =====================================================
   WHEEL
===================================================== */

.wheel-container {
    position: relative;

    width: 300px;

    height: 300px;

    margin: 20px auto;
}


/* =====================================================
   POINTER
===================================================== */

.pointer {
    position: absolute;

    top: -8px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 0;

    height: 0;

    border-left:
        14px solid transparent;

    border-right:
        14px solid transparent;

    border-top:
        30px solid #182848;

    z-index: 10;
}


/* =====================================================
   WHEEL
===================================================== */

#wheel {
    width: 300px;

    height: 300px;

    border-radius: 50%;

    border: 8px solid #182848;

    background:
        conic-gradient(

            #ff7675 0deg 45deg,

            #74b9ff 45deg 90deg,

            #55efc4 90deg 135deg,

            #ffeaa7 135deg 180deg,

            #a29bfe 180deg 225deg,

            #fd79a8 225deg 270deg,

            #81ecec 270deg 315deg,

            #fab1a0 315deg 360deg

        );

    position: relative;

    transition:
        transform 4s
        cubic-bezier(
            0.17,
            0.67,
            0.12,
            0.99
        );
}


/* =====================================================
   WHEEL LABELS
===================================================== */

.wheel-label {
    position: absolute;

    left: 50%;

    top: 50%;

    width: 70px;

    height: 30px;

    margin-left: -35px;

    margin-top: -15px;

    text-align: center;

    font-weight: bold;

    font-size: 18px;

    color: #182848;

    transform-origin: center;
}


/* =====================================================
   CENTER
===================================================== */

.wheel-center {
    position: absolute;

    top: 50%;

    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 60px;

    height: 60px;

    border-radius: 50%;

    background: #182848;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: bold;

    z-index: 5;

    border: 4px solid white;
}


/* =====================================================
   SPIN BUTTON
===================================================== */

button.spin-button {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #182848;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 10px;
}

button.spin-button:hover {
    opacity: 0.9;
}

button.spin-button:disabled {
    background: #999;

    cursor: not-allowed;
}


/* =====================================================
   MESSAGE
===================================================== */

.message {
    text-align: center;

    font-weight: bold;

    margin-top: 15px;

    min-height: 24px;
}


/* =====================================================
   DAY
===================================================== */

.day {
    text-align: center;

    font-weight: bold;

    margin-bottom: 20px;
}


/* =====================================================
   FOOTER
===================================================== */

footer {
    text-align: center;

    padding: 25px;

    color: #666;

    font-size: 14px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 400px) {

    .wheel-container {
        width: 270px;
        height: 270px;
    }

    #wheel {
        width: 270px;
        height: 270px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     TOP NAVIGATION
===================================================== -->

<nav class="top-nav">

    <button
        class="back-button"
        onclick="goBack()">

        ← Back

    </button>

</nav>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <h1>🎡 Daily Spin</h1>

    <p>
        Spin the wheel once every day and win points!
    </p>

</header>


<div class="container">


<!-- =====================================================
     POINTS
===================================================== -->

<div class="card points">

    <h2>💰 Your Points</h2>

    <div
        class="points-number"
        id="points">

        0

    </div>

    <p>
        points available
    </p>

</div>


<!-- =====================================================
     DAY
===================================================== -->

<div
    class="day"
    id="dayDisplay">
</div>


<!-- =====================================================
     SPIN CARD
===================================================== -->

<div class="card spin-area">

    <h2>🎡 Spin & Win</h2>

    <p>
        You can spin the wheel
        <strong>once per day.</strong>
    </p>


    <!-- POINTER -->

    <div class="wheel-container">

        <div class="pointer"></div>


        <!-- WHEEL -->

        <div id="wheel">

            <div
                class="wheel-label"
                style="
                    transform:
                    rotate(22.5deg)
                    translateY(-105px)
                    rotate(-22.5deg);
                ">

                10

            </div>


            <div
                class="wheel-label"
                style="
                    transform:
                    rotate(67.5deg)
                    translateY(-105px)
                    rotate(-67.5deg);
                ">

                20

            </div>


            <div
                class="wheel-label"
                style="
                    transform:
                    rotate(112.5deg)
                    translateY(-105px)
                    rotate(-112.5deg);
                ">

                30

            </div>


            <div
                class="wheel-label"
                style="
                    transform:
                    rotate(157.5deg)
                    translateY(-105px)
                    rotate(-157.5deg);
                ">

                40

            </div>


            <div
                class="wheel-label"
                style="
                    transform:
                    rotate(202.5deg)
                    translateY(-105px)
                    rotate(-202.5deg);
                ">

                50

            </div>


            <div
                class="wheel-label"
                style="
                    transform:
                    rotate(247.5deg)
                    translateY(-105px)
                    rotate(-247.5deg);
                ">

                20

            </div>


            <div
                class="wheel-label"
                style="
                    transform:
                    rotate(292.5deg)
                    translateY(-105px)
                    rotate(-292.5deg);
                ">

                30

            </div>


            <div
                class="wheel-label"
                style="
                    transform:
                    rotate(337.5deg)
                    translateY(-105px)
                    rotate(-337.5deg);
                ">

                10

            </div>


            <div class="wheel-center">
                SPIN
            </div>

        </div>

    </div>


    <!-- SPIN BUTTON -->

    <button
        class="spin-button"
        id="spinButton"
        onclick="spinWheel()">

        🎡 SPIN NOW

    </button>


    <!-- MESSAGE -->

    <div
        id="spinMessage"
        class="message">
    </div>

</div>

</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    Reward Platform — Prototype

</footer>


<script>

/* =====================================================
   LOGIN PROTECTION
===================================================== */

if (
    localStorage.getItem("loggedIn")
    !==
    "true"
) {

    window.location.href =
        "login.html";

}


/* =====================================================
   DATE
===================================================== */

const today =
    new Date().toDateString();


document.getElementById(
    "dayDisplay"
).textContent =
    "Today's Spin — " + today;


/* =====================================================
   POINTS
===================================================== */

function updateDisplay() {

    const points =
        Number(
            localStorage.getItem(
                "rewardPoints"
            )
        ) || 0;


    document.getElementById(
        "points"
    ).textContent = points;

}


/* =====================================================
   ADD POINTS
===================================================== */

function addPoints(
    amount,
    activity
) {

    let points =
        Number(
            localStorage.getItem(
                "rewardPoints"
            )
        ) || 0;


    points += amount;


    let history;

    try {

        history =
            JSON.parse(
                localStorage.getItem(
                    "rewardHistory"
                )
            ) || [];

        if (!Array.isArray(history)) {
            history = [];
        }

    } catch (error) {

        history = [];

    }


    history.push({

        activity: activity,

        points: amount,

        date:
            new Date().toLocaleString()

    });


    localStorage.setItem(
        "rewardPoints",
        points
    );


    localStorage.setItem(
        "rewardHistory",
        JSON.stringify(history)
    );


    updateDisplay();

}


/* =====================================================
   WHEEL
===================================================== */

const wheel =
    document.getElementById(
        "wheel"
    );


const spinButton =
    document.getElementById(
        "spinButton"
    );


const spinMessage =
    document.getElementById(
        "spinMessage"
    );


/* =====================================================
   REWARDS
===================================================== */

/*
   These values correspond exactly
   to the 8 wheel sections.
*/

const rewards = [

    10,
    20,
    30,
    40,
    50,
    20,
    30,
    10

];


/* =====================================================
   CURRENT ROTATION
===================================================== */

let currentRotation = 0;


/* =====================================================
   SPIN
===================================================== */

function spinWheel() {

    const lastSpin =
        localStorage.getItem(
            "lastSpin"
        );


    /* Already used today */

    if (
        lastSpin === today
    ) {

        spinMessage.textContent =
            "You already spun the wheel today.";

        spinButton.disabled = true;

        return;

    }


    /*
       Choose the winning section.

       IMPORTANT:
       The random section is selected FIRST.
       The wheel is then rotated to that exact
       section.
    */

    const winningIndex =
        Math.floor(
            Math.random()
            *
            rewards.length
        );


    const reward =
        rewards[winningIndex];


    /*
       Each section is 45 degrees.
    */

    const sectionAngle = 45;


    /*
       We want the CENTER of the winning
       section to stop underneath the pointer.

       Pointer is at 0 degrees.
       Section centers are:

       22.5
       67.5
       112.5
       etc.
    */

    const targetAngle =
        winningIndex
        *
        sectionAngle
        +
        sectionAngle / 2;


    /*
       Add several complete rotations
       to make the animation exciting.
    */

    const extraSpins =
        5 * 360;


    /*
       Calculate final rotation.

       The negative sign makes the wheel
       rotate toward the selected section.
    */

    const finalRotation =
        currentRotation
        +
        extraSpins
        +
        (360 - targetAngle);


    currentRotation =
        finalRotation;


    /* Disable button during spin */

    spinButton.disabled = true;

    spinMessage.textContent =
        "🎡 Spinning...";


    /* Animate */

    wheel.style.transform =
        "rotate(" +
        finalRotation +
        "deg)";


    /*
       Wait until animation finishes.
    */

    setTimeout(
        function() {

            /*
               Award EXACTLY the reward
               belonging to the selected
               wheel section.
            */

            addPoints(
                reward,
                "Daily Spin"
            );


            /*
               Save today's spin.
            */

            localStorage.setItem(
                "lastSpin",
                today
            );


            /*
               Show the exact reward.
            */

            spinMessage.textContent =
                "🎉 You won " +
                reward +
                " points!";


            /*
               Keep button disabled.
            */

            spinButton.disabled = true;

            spinButton.textContent =
                "✅ Spin Completed Today";

        },
        4100
    );

}


/* =====================================================
   CHECK TODAY'S STATUS
===================================================== */

if (
    localStorage.getItem(
        "lastSpin"
    ) === today
) {

    spinButton.disabled = true;

    spinButton.textContent =
        "✅ Spin Completed Today";

    spinMessage.textContent =
        "You already spun the wheel today.";

}


/* =====================================================
   INITIAL DISPLAY
===================================================== */

updateDisplay();


/* =====================================================
   BACK BUTTON
===================================================== */

function goBack() {

    window.history.back();

}

</script>


</body>

</html>
