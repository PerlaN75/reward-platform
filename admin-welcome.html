<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Reward Platform - Administration</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% 35%,
            #174f63 0%,
            #102d46 38%,
            #071421 75%
        );

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =====================================================
   ADMIN HOME
===================================================== */

.home {

    width: 100%;

    max-width: 850px;

    padding: 30px 20px;

    text-align: center;

}


/* =====================================================
   WELCOME LABEL
===================================================== */

.welcome-label {

    display: inline-block;

    padding: 9px 20px;

    margin-bottom: 25px;

    border:
        1px solid
        rgba(255,255,255,0.25);

    border-radius: 30px;

    background:
        rgba(255,255,255,0.08);

    color: #5ee7d2;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 1px;

}


/* =====================================================
   MAIN HEADING
===================================================== */

h1 {

    margin: 0;

    font-size:
        clamp(42px, 9vw, 76px);

    line-height: 1.05;

}


h1 span {

    background:
        linear-gradient(
            90deg,
            #5ee7d2,
            #42b8ff,
            #7c83ff,
            #d66cff
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

}


/* =====================================================
   DESCRIPTION
===================================================== */

.description {

    max-width: 600px;

    margin:
        25px auto 35px;

    color: #d5e2e8;

    font-size:
        clamp(17px, 4vw, 21px);

    line-height: 1.6;

}


/* =====================================================
   ADMIN LOGIN BUTTON
===================================================== */

.admin-button {

    display: inline-block;

    padding: 17px 32px;

    border-radius: 15px;

    background:
        linear-gradient(
            90deg,
            #087f8c,
            #2864d7
        );

    color: white;

    text-decoration: none;

    font-size: 18px;

    font-weight: bold;

    box-shadow:
        0 10px 35px
        rgba(30,130,210,0.40);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

}


.admin-button:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 14px 40px
        rgba(30,150,230,0.60);

}


/* =====================================================
   ADMIN SYMBOLS
===================================================== */

.admin-symbols {

    margin-top: 55px;

    display: flex;

    justify-content: center;

    gap: 25px;

    font-size: 34px;

    opacity: 0.9;

}


.admin-symbols span {

    width: 65px;

    height: 65px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 18px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid
        rgba(255,255,255,0.12);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.25);

}


/* =====================================================
   ADMIN NOTE
===================================================== */

.admin-note {

    margin-top: 28px;

    color: #aebfc8;

    font-size: 13px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    .home {

        padding:
            25px 18px;

    }


    .welcome-label {

        font-size: 12px;

    }


    .description {

        margin-top: 20px;

        margin-bottom: 30px;

    }


    .admin-button {

        width: 100%;

        max-width: 330px;

    }


    .admin-symbols {

        gap: 12px;

        margin-top: 45px;

    }


    .admin-symbols span {

        width: 55px;

        height: 55px;

        font-size: 27px;

    }

}

</style>

</head>


<body>


<main class="home">


    <!-- =================================================
         WELCOME LABEL
    ================================================== -->

    <div class="welcome-label">

        🛠️ ADMINISTRATION

    </div>


    <!-- =================================================
         MAIN HEADING
    ================================================== -->

    <h1>

        Welcome to<br>

        <span>Admin Panel</span>

    </h1>


    <!-- =================================================
         DESCRIPTION
    ================================================== -->

    <p class="description">

        Manage the Reward Platform,
        monitor activity, and control
        the platform from one place.

    </p>


    <!-- =================================================
         ADMIN LOGIN
    ================================================== -->

    <a
        class="admin-button"
        href="admin-login.html">

        🔐 Admin Login

    </a>


    <!-- =================================================
         ADMIN SYMBOLS
    ================================================== -->

    <div class="admin-symbols">

        <span>👥</span>

        <span>💰</span>

        <span>📊</span>

        <span>⚙️</span>

    </div>


    <!-- =================================================
         NOTE
    ================================================== -->

    <div class="admin-note">

        Reward Platform — Administration

    </div>


</main>


</body>

</html>
