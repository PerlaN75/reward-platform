firebase.initializeApp(cfg); const db=firebase.firestore();
const q=new URLSearchParams(location.search);
const uid=q.get('user_id'); let pts=parseInt(q.get('amount_local'))||0;

if(uid && q.get('status')!=='canceled'){
 db.collection('users').doc(uid).set({balance:firebase.firestore.FieldValue.increment(pts),surveys_today:firebase.firestore.FieldValue.increment(1),last_survey:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).then(()=>{document.body.innerHTML='✅ '+pts+' pts to '+uid;});
}else{document.body.innerHTML='no credit';}
