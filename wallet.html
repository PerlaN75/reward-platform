<!DOCTYPE html>
<html>
<head>
  <title>Wallet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; padding: 20px; color: white; text-align: center; }
    h1 { font-size: 26px; margin-bottom: 20px; color: #fbbf24; }
    .card { background: #1a2410; padding: 25px; border-radius: 15px; margin-bottom: 15px; }
    .card h3 { font-size: 14px; color: #ccc; margin-bottom: 10px; }
    .points { font-size: 48px; color: #f59e0b; font-weight: bold; }
    .withdraw-btn { width: 100%; padding: 16px; margin-top: 15px; background: linear-gradient(90deg, #22c55e, #16a34a); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; }
    .back-btn { width: 40%; padding: 14px; margin-top: 20px; background: #fbbf24; color: #000; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h1>💰 My Wallet</h1>
  
  <div class="card">
    <h3>YOUR POINTS</h3>
    <div class="points" id="balance">0</div>
    <button class="withdraw-btn" onclick="alert('Withdraw coming soon!')">Withdraw</button>
  </div>

  <button class="back-btn" onclick="window.location.href='home.html'">Back Home</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d" };
  const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

  onAuthStateChanged(auth, async (user) => {
    if(!user) return window.location.href = "log.html";
    const snap = await getDoc(doc(db, "users", user.uid));
    if(snap.exists()){
      document.getElementById('balance').innerText = snap.data().balance || 0;
    }
  });
</script>
</body>
</html>
