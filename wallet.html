<!DOCTYPE html>
<html>
<head>
  <title>My Wallet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; padding: 20px; color: white; }
    
    .header { text-align: center; margin-bottom: 20px; padding-top: 50px; }
    .header h1 { font-size: 32px; background: linear-gradient(90deg, #fbbf24, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .header p { color: #d1fae5; font-size: 14px; margin-top: 5px; }
    
    .balance-card { background: linear-gradient(135deg, #fbbf24, #ec4899); padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(251,191,36,0.3); }
    .balance-card h3 { color: #1a1a1a; font-size: 14px; margin-bottom: 5px; font-weight: bold; }
    .balance-card h2 { color: #000; font-size: 48px; font-weight: bold; }
    .balance-card p { color: #1a1a1a; font-size: 14px; margin-top: 5px; font-weight: bold; }
    
    .stats { display: flex; gap: 10px; margin-bottom: 20px; }
    .stat-box { flex: 1; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; text-align: center; }
    .stat-box h4 { font-size: 12px; color: #aaa; }
    .stat-box p { font-size: 20px; font-weight: bold; margin-top: 5px; }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 30px; }
    .action-card { 
      background: linear-gradient(180deg, #ffffff, #e5e5e5); 
      padding: 18px 10px; border-radius: 18px; text-align: center; cursor: pointer;
      box-shadow: 0 8px 0 #b3b3b3, 0 15px 25px rgba(0,0,0,0.3);
      transition: all 0.1s ease;
    }
    .action-card:active { transform: translateY(6px); box-shadow: 0 2px 0 #b3b3b3, 0 5px 10px rgba(0,0,0,0.2); }
    .action-icon { font-size: 30px; margin-bottom: 6px; }
    .action-text { font-size: 12px; font-weight: bold; color: #2f3e1a; }

    .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .popup-content { background: #1a2410; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; animation: pop 0.3s; }
    @keyframes pop { from {transform: scale(0.8); opacity: 0;} to {transform: scale(1); opacity: 1;} }
    .popup-content h3 { margin-bottom: 15px; color: #fbbf24; }
    .popup-content input, .popup-content select { 
      width: 100%; padding: 14px; margin-bottom: 12px; border: none; border-radius: 10px; 
      background: #2f3e1a; color: white; font-size: 15px; outline: none;
    }
    .popup-btn { width: 100%; padding: 15px; background: linear-gradient(90deg, #22c55e, #16a34a); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .popup-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .close-btn { background: #ef4444; margin-top: 10px; }
    
    .back-btn { 
      width: 40%;
      margin: 50px auto 0 auto;
      display: block;
      padding: 15px; 
      background: linear-gradient(90deg, #fbbf24, #f97316); 
      color: #000; border: none; border-radius: 12px; 
      font-weight: bold; cursor: pointer; font-size: 16px; 
    }
    .loading { color: #aaa; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>💰 My Wallet</h1>
    <p>Manage your points & crypto</p>
  </div>

  <div class="balance-card">
    <h3>WALLET BALANCE</h3>
    <h2 id="balance">0</h2>
    <p>= $<span id="usdValue">0.00</span> USD</p>
    <small style="color:#1a1a1a;">1000 points = $0.50 USD</small>
  </div>

  <div class="stats">
    <div class="stat-box">
      <h4>Total Earned</h4>
      <p id="totalEarned">0</p>
    </div>
    <div class="stat-box">
      <h4>Withdrawn</h4>
      <p id="totalWithdrawn">0</p>
    </div>
  </div>

  <div class="action-grid">
    <div class="action-card" onclick="openPopup('convert')">
      <div class="action-icon">🔄</div>
      <div class="action-text">Convert</div>
    </div>
    <div class="action-card" onclick="openPopup('buy')">
      <div class="action-icon">🛒</div>
      <div class="action-text">Buy Points</div>
    </div>
    <div class="action-card" onclick="openPopup('withdraw')">
      <div class="action-icon">💸</div>
      <div class="action-text">Withdraw</div>
    </div>
  </div>

  <button class="back-btn" onclick="window.location.href='home.html'">Back Home</button>

  <!-- WITHDRAW POPUP - NOW CONNECTED TO FIREBASE -->
  <div class="popup" id="withdrawPopup">
    <div class="popup-content">
      <h3>Withdraw Crypto</h3>
      <select id="withdrawCoin">
        <option>SOL</option><option>USDT</option><option>USDC</option>
        <option>BNB</option><option>XRP</option><option>BTC</option>
      </select>
      <input type="text" id="walletAddress" placeholder="Your Wallet Address">
      <input type="number" id="withdrawAmount" placeholder="Amount in Points - Min 1000">
      <input type="email" id="withdrawEmail" placeholder="Email for confirmation">
      <button class="popup-btn" id="withdrawSubmitBtn" onclick="doWithdraw()">Request Withdrawal</button>
      <button class="popup-btn close-btn" onclick="closePopup('withdraw')">Cancel</button>
    </div>
  </div>

  <!-- Other popups still demo for now -->
  <div class="popup" id="convertPopup">
    <div class="popup-content">
      <h3>Convert Points To Crypto</h3>
      <select id="convertCoin"><option>BNB</option><option>USDT</option><option>USDC</option></select>
      <input type="number" id="convertAmount" placeholder="Amount in Points">
      <button class="popup-btn" onclick="alert('Coming Soon')">Convert Now</button>
      <button class="popup-btn close-btn" onclick="closePopup('convert')">Cancel</button>
    </div>
  </div>

  <div class="popup" id="buyPopup">
    <div class="popup-content">
      <h3>Buy Points</h3>
      <p style="color:#aaa; font-size:13px; margin-bottom:10px;">1000 Points = $0.50 USD</p>
      <input type="number" id="buyAmount" placeholder="How many points?">
      <button class="popup-btn" onclick="alert('Coming Soon')">Pay with Card/MoMo</button>
      <button class="popup-btn close-btn" onclick="closePopup('buy')">Cancel</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc, addDoc, collection, serverTimestamp, runTransaction, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const RATE = 0.0005; // 1000 pts = $0.50

  let currentUser = null;
  let userBalance = 0;

  // LOAD USER DATA
  onAuthStateChanged(auth, async (user) => {
    if (!user) return window.location.href = "log.html";
    currentUser = user;
    loadUserData();
  });

  async function loadUserData() {
    const userRef = doc(db, "users", currentUser.uid);
    const snap = await getDoc(userRef);
    if (snap.exists()) {
      const data = snap.data();
      userBalance = data.balance || 0;
      document.getElementById('balance').innerText = userBalance;
      document.getElementById('usdValue').innerText = (userBalance * RATE).toFixed(2);
      document.getElementById('totalEarned').innerText = data.totalEarned || 0;
      document.getElementById('totalWithdrawn').innerText = data.totalWithdrawn || 0;
    }
  }

  // POPUP CONTROL
  function openPopup(type) { document.getElementById(type + 'Popup').style.display = 'flex'; }
  window.openPopup = openPopup;
  function closePopup(type) { document.getElementById(type + 'Popup').style.display = 'none'; }
  window.closePopup = closePopup;

  // WITHDRAW TO FIREBASE
  window.doWithdraw = async function() {
    const coin = document.getElementById('withdrawCoin').value;
    const address = document.getElementById('walletAddress').value.trim();
    const amount = parseInt(document.getElementById('withdrawAmount').value);
    const email = document.getElementById('withdrawEmail').value.trim();
    const btn = document.getElementById('withdrawSubmitBtn');

    if(!address || !amount || !email) return alert("Please fill all fields");
    if(amount < 1000) return alert("Minimum withdrawal is 1000 points");
    if(amount > userBalance) return alert("Not enough balance");

    btn.disabled = true;
    btn.innerText = "Processing...";

    try {
      const userRef = doc(db, "users", currentUser.uid);
      
      // TRANSACTION: Deduct balance safely
      await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(userRef);
        const currentBal = snap.data().balance || 0;
        if (currentBal < amount) throw "Not enough balance";
        
        transaction.update(userRef, { 
          balance: currentBal - amount,
          totalWithdrawn: increment(amount)
        });
      });

      // SAVE WITHDRAWAL REQUEST
      await addDoc(collection(db, "users", currentUser.uid, "withdrawals"), {
        coin,
        address,
        amount,
        email,
        status: "Pending",
        usdValue: (amount * RATE).toFixed(2),
        timestamp: serverTimestamp()
      });

      alert(`Withdrawal request sent!\n${amount} points to ${coin}\nWe will process in 24-48 hours`);
      
      // Reset form and reload
      document.getElementById('walletAddress').value = '';
      document.getElementById('withdrawAmount').value = '';
      document.getElementById('withdrawEmail').value = '';
      closePopup('withdraw');
      loadUserData(); // refresh balance

    } catch (e) {
      alert("Error: " + e);
    }
    btn.disabled = false;
    btn.innerText = "Request Withdrawal";
  }
</script>
</body>
</html>
