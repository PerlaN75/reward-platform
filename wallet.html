(function initWalletAd(){

const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};

const POINT_RATE=0.0005;
let BNB_PRICE=1150, XLM_PRICE=0.38;
async function loadPrices(){ try{ const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=binancecoin,stellar&vs_currencies=usd'); const j=await r.json(); if(j.binancecoin?.usd) BNB_PRICE=j.binancecoin.usd; if(j.stellar?.usd) XLM_PRICE=j.stellar.usd; calcConvert(); updateWithdrawNote(); }catch(e){} }

const MIN_WITHDRAW_USD=1.5;
let currentUser=null,userData={},pendingAction=null,gateTimerInt=null,convertTarget='USDT';
function convertValue(coins, target){
  const usd=coins*POINT_RATE;
  if(target==='USDT') return {val:usd, unit:'USDT'};
  if(target==='BNB') return {val:usd/BNB_PRICE, unit:'BNB'};
  if(target==='XLM') return {val:usd/XLM_PRICE, unit:'XLM'};
  return {val:usd, unit:'USDT'};
}
function setConvert(t){
  convertTarget=t;
  ['USDT','BNB','XLM'].forEach(x=> document.getElementById('c-'+x).classList.toggle('active', x===t));
  calcConvert();
}
function loadData(d){
  if(!d) return; userData=d;
  if(d.usdtBalance==null) d.usdtBalance=0; if(d.bnbBalance==null) d.bnbBalance=0; if(d.xlmBalance==null) d.xlmBalance=0; if(d.balance==null) d.balance=d.coins||d.points||0;
  document.getElementById('coinBal').innerText=(d.balance||0)+' coins';
  document.getElementById('usdEq').innerText=`≈ $${((d.balance||0)*POINT_RATE).toFixed(4)}`;
  document.getElementById('usdtBal').innerText=Number(d.usdtBalance||0).toFixed(4)+' USDT';
  document.getElementById('bnbBal').innerText=Number(d.bnbBalance||0).toFixed(6)+' BNB';
  document.getElementById('xlmBal').innerText=Number(d.xlmBalance||0).toFixed(2)+' XLM';
  updateWithdrawNote();
  localStorage.setItem('userData', JSON.stringify(d));
}
function calcConvert(){
  const pts=parseFloat(document.getElementById('convertAmount').value)||0;
  const r=convertValue(pts, convertTarget);
  const dec = convertTarget==='BNB'?6: convertTarget==='XLM'?2:4;
  document.getElementById('convertResult').innerText=`You will receive: ${r.val.toFixed(dec)} ${r.unit}`;
  document.getElementById('convertRateNote').innerText = convertTarget==='USDT' ? `Rate: 1 coin = $0.0005 USDT • No minimum` : convertTarget==='BNB' ? `Rate: 1 coin = $${POINT_RATE} • 1 BNB ≈ $${BNB_PRICE.toFixed(2)} • No minimum` : `Rate: 1 coin = $${POINT_RATE} • 1 XLM ≈ $${XLM_PRICE.toFixed(4)} • No minimum`;
}

  else if(c==='BNB'){ addr.placeholder='BNB Address (0x...) / Pay ID / Email / UID'; memo.style.display='none'; amt.placeholder='Amount BNB - Min $1.5 equivalent'; }
  else { addr.placeholder='BNB Wallet Address / Pay ID / Email / UID'; memo.style.display='none'; amt.placeholder='Amount USDT - Min $1.5'; }

}
function updateWithdrawNote(){
  const c=document.getElementById('withdrawCrypto')?.value||'USDT';
  let bal=0, unit=c;
  if(c==='USDT') bal=Number(userData.usdtBalance||0);
  if(c==='BNB') bal=Number(userData.bnbBalance||0);
  if(c==='XLM') bal=Number(userData.xlmBalance||0);
  let usd = c==='USDT'?bal : c==='BNB'?bal*BNB_PRICE : bal*XLM_PRICE;
  const el=document.getElementById('withdrawNote');
  if(el) el.innerText=`Available: ${bal.toFixed(c==='BNB'?6:c==='XLM'?2:4)} ${unit} (≈ $${usd.toFixed(2)}) • Min $1.5`;
}
function openSafeGate(title, sub, action, adMode){
  pendingAction=action; window._adMode = adMode;
  document.getElementById('adGate').style.display='flex';
  document.getElementById('gateTitle').innerText=title;
  document.getElementById('gateSub').innerText=sub;

function startConvertGate(){
  const pts=parseFloat(document.getElementById('convertAmount').value);
  if(!pts||pts<=0) return showToast('Enter coins amount');
  if(pts > (userData.balance||0)) return showToast('Not enough coins');

function startWithdrawGate(){
  const amt=parseFloat(document.getElementById('withdrawAmount').value);
  const payId=document.getElementById('walletAddress').value.trim();
  const crypto=document.getElementById('withdrawCrypto').value;
  const memo=document.getElementById('walletMemo').value.trim();

async function convertPoints(){

  if(!pts) return;
  const r=convertValue(pts, convertTarget); showToast('Converting...');
  try{
    const userRef=db.collection('users').doc(currentUser.uid);
    const field = convertTarget==='USDT'?'usdtBalance': convertTarget==='BNB'?'bnbBalance':'xlmBalance';
    const update={}; update[field]=firebase.firestore.FieldValue.increment(r.val);
    await db.runTransaction(async (tx)=>{const snap=await tx.get(userRef);if(!snap.exists) throw "No user";const data=snap.data();const bal=data.balance ?? data.coins ?? 0;if(bal < pts) throw `Not enough coins`;tx.update(userRef,{balance: firebase.firestore.FieldValue.increment(-pts),coins: firebase.firestore.FieldValue.increment(-pts),points: firebase.firestore.FieldValue.increment(-pts),[field]: firebase.firestore.FieldValue.increment(r.val),lastConvertAt: firebase.firestore.FieldValue.serverTimestamp()});});
    try{ await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({action:'Convert - '+convertTarget, type:'Wallet', coins:pts, desc: pts+' coins → '+r.val.toFixed(4)+' '+convertTarget, timestamp: firebase.firestore.FieldValue.serverTimestamp()}); }catch(e){}

    showToast(`✓ ${pts} coins → ${r.val.toFixed(dec)} ${convertTarget}`);document.getElementById('convertAmount').value=''; calcConvert();
  }catch(e){showToast('Failed: '+(e.message||e));}
}
async function requestWithdraw(){
  const amt=parseFloat(document.getElementById('withdrawAmount').value);
  const payId=document.getElementById('walletAddress').value.trim();
  const crypto=document.getElementById('withdrawCrypto').value;
  const memo=document.getElementById('walletMemo').value.trim();
  const method=document.getElementById('payMethod').value;
  if(!payId||!amt) return; showToast('Requesting...');
  const field = crypto==='USDT'?'usdtBalance': crypto==='BNB'?'bnbBalance':'xlmBalance';

    const userRef=db.collection('users').doc(currentUser.uid);
    await db.runTransaction(async (tx)=>{const snap=await tx.get(userRef);const bal=snap.data()[field]||0;if(bal < amt) throw "Not enough "+crypto;tx.update(userRef,{[field]: firebase.firestore.FieldValue.increment(-amt)});});
    await db.collection('withdrawals').add({uid:currentUser.uid,userId:currentUser.uid,username:userData.username||'',email:userData.email||currentUser.email||'',method:method,crypto:crypto,network: crypto==='XLM'?'Stellar':'BNB',payId:payId,memo:memo||'',amount:amt,usdValue:usd,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    showToast(`Withdraw ${amt} ${crypto} requested!`);document.getElementById('withdrawAmount').value='';document.getElementById('walletAddress').value='';document.getElementById('walletMemo').value='';
  }catch(e){try{await db.collection('users').doc(currentUser.uid).update({[field]: firebase.firestore.FieldValue.increment(amt)});}catch(_){}showToast('Failed: '+(e.message||e));}
}
auth.onAuthStateChanged(u=>{if(u){currentUser=u;db.collection('users').doc(u.uid).onSnapshot(doc=>{if(doc.exists) loadData(doc.data());});}else{location.href='./index.html';}});
</script></body></html>
