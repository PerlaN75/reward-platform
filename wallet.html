<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet</title>
<!-- SINGLE SAFE TAG - LOADS ONCE -->
<script>
(function(){
  const s=document.createElement('script');
  s.dataset.zone='12211613';
  s.src='https://al5sm.com/tag.min.js';
  s.async=true;
  document.body.appendChild(s);
})();
</script>
<style>
/* keep your same style */
.back-btn{font-size:24px; text-decoration:none; color:#000;}
#safeAdAfterConvert{min-height:90px; background:#f8f8f8; border-radius:12px; padding:8px; margin-top:12px; display:none;}
</style>
</head>
<body>

<a href="home.html" class="back-btn">‹</a>

<h2>Wallet</h2>
<div id="points">Points: 0</div>

<input type="number" id="convertAmount" placeholder="Amount to convert">
<button id="convertBtn" onclick="openConvertGate()">Convert</button>

<input type="number" id="withdrawAmount" placeholder="Amount to withdraw">
<button id="withdrawBtn" onclick="openWithdrawGate()">Withdraw</button>

<!-- GATE OVERLAY -->
<div id="gate" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:999; align-items:center; justify-content:center;">
  <div style="background:#fff; padding:20px; border-radius:16px; text-align:center; width:85%; max-width:320px;">
    <div id="gateTimer" style="font-size:18px; font-weight:bold;">⏳ Please wait 10s...<br><small>Ads loading</small></div>
    <button id="gateContinue" style="display:none; margin-top:15px; background:#FF6B00; color:#fff; border:none; padding:12px 20px; border-radius:10px; width:100%;" onclick="closeGateAndConvert()">✅ Continue</button>
  </div>
</div>

<!-- SUCCESS BOX WITH SAFE AD INSIDE -->
<div id="successBox" style="display:none; margin-top:20px; background:#e8f5e9; padding:15px; border-radius:12px;">
  <div id="successText"></div>
  <div id="safeAdAfterConvert">
    <small style="color:#888;">Sponsored</small>
    <div style="margin-top:6px;">Ad banner loads here</div>
  </div>
</div>

<script>
let pendingAction = null;
let gateInterval = null;

function openConvertGate(){
  const amt = document.getElementById('convertAmount').value;
  if(!amt || amt<=0){ alert('Enter amount'); return; }
  pendingAction='convert';
  startGate();
}
function openWithdrawGate(){
  const amt = document.getElementById('withdrawAmount').value;
  if(!amt || amt<=0){ alert('Enter amount'); return; }
  pendingAction='withdraw';
  startGate();
}

function startGate(){
  document.getElementById('gate').style.display='flex';
  document.getElementById('gateTimer').innerHTML='⏳ Please wait 10s...<br><small>Ads loading</small>';
  document.getElementById('gateContinue').style.display='none';
  let sec=10;
  gateInterval=setInterval(()=>{
    sec--;
    document.getElementById('gateTimer').innerHTML=`⏳ Please wait ${sec}s...<br><small>Ads loading</small>`;
    if(sec<=0){
      clearInterval(gateInterval);
      document.getElementById('gateTimer').innerHTML='✅ Ready!';
      document.getElementById('gateContinue').style.display='block';
    }
  },1000);
}

function closeGateAndConvert(){
  document.getElementById('gate').style.display='none';
  clearInterval(gateInterval);
  
  // YOUR REAL CONVERT / WITHDRAW LOGIC HERE
  if(pendingAction==='convert'){
    const amt=document.getElementById('convertAmount').value;
    document.getElementById('successBox').style.display='block';
    document.getElementById('successText').innerHTML=`✅ Converted! ${amt} Points = ${amt} RWF`;
    document.getElementById('safeAdAfterConvert').style.display='block';
    // In-page ad will auto-fill in background from the single tag
  } else {
    const amt=document.getElementById('withdrawAmount').value;
    document.getElementById('successBox').style.display='block';
    document.getElementById('successText').innerHTML=`✅ Withdraw request ${amt} RWF sent`;
    document.getElementById('safeAdAfterConvert').style.display='block';
  }
}
</script>

</body>
</html>
