<!DOCTYPE html>
<html>
<head>
  <title>Wallet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; padding: 20px; color: white; text-align: center; }
    
    h1 { font-size: 26px; margin-bottom: 20px; color: #fbbf24; font-weight: bold; }
    
    .card { 
      background: #1a2410; 
      padding: 25px 20px; 
      border-radius: 15px; 
      margin-bottom: 15px; 
    }
    .card h3 { font-size: 13px; color: #ccc; margin-bottom: 10px; font-weight: bold; letter-spacing: 1px; }
    .points { font-size: 52px; color: #f59e0b; font-weight: bold; margin-bottom: 15px; }
    
    .withdraw-btn { 
      width: 100%; 
      padding: 16px; 
      background: linear-gradient(180deg, #22c55e, #16a34a); 
      color: white; 
      border: none; 
      border-radius: 12px; 
      font-weight: bold; 
      font-size: 17px; 
      cursor: pointer; 
      box-shadow: 0 4px 0 #15803d;
      transition: 0.1s;
    }
    .withdraw-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #15803d; }

    .back-btn { 
      width: 50%; 
      padding: 14px; 
      margin-top: 15px; 
      background: linear-gradient(180deg, #fbbf24, #f59e0b); 
      color: #000; 
      border: none; 
      border-radius: 12px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 15px;
      box-shadow: 0 4px 0 #d97706;
      transition: 0.1s;
    }
    .back-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #d97706; }
  </style>
</head>
<body>
  <h1>💰 My Wallet</h1>
  
  <div class="card">
    <h3>YOUR POINTS</h3>
    <div class="points" id="balance">0</div>
    <button class="withdraw-btn" onclick="alert('Withdraw coming soon!')">Withdraw</button>
  </div>

  <button class="back-btn" onclick="window.location.href='home.html'">Back Home</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { 
    apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", 
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com", 
    projectId: "reward-platform-rw-2e13d" 
  };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app); 
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});

  const balanceEl = document.getElementById('balance');

  onAuthStateChanged(auth, async (user) => {
    if(!user) return window.location.href = "log.html";
    loadWallet(user.uid);
  });

  async function loadWallet(uid) {
    const cacheKey = 'wallet_' + uid;
    const cached = localStorage.getItem(cacheKey);
    
    // Instant cache
    if(cached){
      try {
        const data = JSON.parse(cached);
        balanceEl.innerText = data.balance || 0;
      } catch(e){}
    }
    
    // Update from Firebase
    try {
      const snap = await getDoc(doc(db, "users", uid));
      if(snap.exists()){
        const data = snap.data();
        balanceEl.innerText = data.balance || 0;
        localStorage.setItem(cacheKey, JSON.stringify({
          balance: data.balance || 0
        }));
      }
    } catch(e) {
      console.log(e);
    }
  }
</script>
</body>
</html>
