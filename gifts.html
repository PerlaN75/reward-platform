<!DOCTYPE html><html><head>
<title>Daily Gifts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade" />
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f5f3ff;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;width:100%}
.back-btn-checkin{width:45px;height:30px;background:#fff;border:2px solid #fecaca;border-radius:10px;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.back-btn-checkin .lines{display:flex;flex-direction:column;gap:3px}
.back-btn-checkin .lines i{display:block;width:18px;height:2.5px;background:#000;border-radius:2px}
.center-pill{background:#fff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%)}
.card{width:100%;max-width:380px;background:#fff;border:2px solid #ede9fe;border-radius:24px;padding:16px 14px;text-align:center;position:relative;overflow:hidden;min-height:460px;margin:14px 10px}
.gift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.gift{aspect-ratio:1;background:linear-gradient(180deg,#fdf4ff,#f5d0fe);border:2px solid #e879f9;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:32px;transition:.15s}
.gift:active{transform:scale(.95)}
.gift.opened{background:#f0fdf4;border-color:#22c55e;cursor:default}
.gift.opened .gift-emoji{font-size:20px}
.gift-label{font-size:10px;font-weight:900;color:#a21caf;margin-top:4px}
.gift-value{font-size:12px;font-weight:900;color:#15803d}
.btn{width:100%;background:linear-gradient(90deg,#ec4899,#d946ef);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:900;font-size:15px;cursor:pointer;margin-top:14px;box-shadow:0 4px 0 #a21caf}.btn:disabled{background:#e5e7eb;color:#9ca3af;box-shadow:none}
#adGate{position:fixed;inset:0;background:rgba(17,12,34,.65);backdrop-filter:blur(8px);z-index:10001;display:none;align-items:center;justify-content:center;padding:20px}
.gate-box{background:linear-gradient(180deg,#fdf4ff,#fae8ff);border:2px solid #e879f9;border-radius:24px;padding:22px 20px;width:100%;max-width:320px;text-align:center;box-shadow:0 20px 40px rgba(168,85,247,.30);position:relative}
.gate-icon{width:64px;height:64px;margin:0 auto 10px;background:linear-gradient(180deg,#fdf4ff,#f0abfc);border:4px solid #d946ef;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 10px 25px rgba(0,0,0,0.15)}
.gate-title{font-weight:900;font-size:18px;color:#701a75}
.gate-sub{font-size:12px;color:#a21caf;margin:8px 0 16px;line-height:1.4;font-weight:700}
.gate-btn{width:100%;height:50px;border-radius:14px;border:2px solid #f0abfc;font-weight:900;font-size:14px;cursor:pointer}
.gate-btn.watch{background:#f3f4f6;color:#9ca3af;box-shadow:none;border-color:#e5e7eb}
.gate-btn.watch:disabled{background:#f3f4f6;color:#9ca3af;box-shadow:none;border-color:#e5e7eb}
.gate-btn.open{background:linear-gradient(180deg,#ec4899,#d946ef);color:#fff;border-color:#a21caf;box-shadow:0 4px 0 #a21caf,0 8px 20px rgba(217,70,239,0.3);display:none;margin-top:10px}
#gateTimer2{font-size:13px;font-weight:900;color:#701a75;margin-top:12px;background:#fdf4ff;border:1.5px solid #f0abfc;padding:8px 12px;border-radius:999px;display:inline-block;min-width:140px}
#gateTimer2:empty{display:none}
#gateBarWrap{height:6px;background:#fae8ff;border-radius:10px;overflow:hidden;margin-top:12px}
#gateBar{height:100%;background:linear-gradient(90deg,#ec4899,#a855f7);width:0%;transition:width 1s linear}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #ede9fe;color:#111827;padding:12px 18px;border-radius:12px;font-weight:900;z-index:10000;display:none;max-width:90%;text-align:center}
</style></head><body>
<div class="top-bar"><a href="home.html" class="back-btn-checkin"><span class="lines"><i></i><i></i><i></i></span></a><div class="center-pill">🎁 Daily Gifts</div><div style="width:45px"></div></div>

<div class="card">
  <div style="font-size:12px;color:#8b5cf6;font-weight:700">Pick 5 gifts — Reveal coins inside</div>
  <div style="font-size:13px;font-weight:900;margin-top:10px">Total: <span id="totalCoins">0</span> coins • Picked: <span id="pickedCount">0</span>/5</div>
  <div class="gift-grid" id="giftGrid"></div>
  <div id="statusText" style="font-size:12px;color:#6b7280;font-weight:700;margin-top:6px">Tap a gift to unwrap it</div>
  <button class="btn" id="claimBtn" disabled>Claim 0 Coins</button>
  <div style="font-size:11px;color:#9ca3af;margin-top:8px;font-weight:700">Pick all 5 to claim • Gifts reset daily</div>
</div>

<div style="max-width:380px;margin:0 auto;padding:0 14px 30px;width:100%">
  <div style="font-size:10px;color:#9ca3af;font-weight:700;text-align:center;margin-bottom:6px;letter-spacing:0.5px">Advertisement</div>
  <a id="giftAdLink" href="https://uplcm.com/4/12320757" target="_blank" rel="sponsored noopener" style="text-decoration:none;display:flex;align-items:center;gap:8px;background:#FFD700;border-radius:12px;padding:12px">
    <div style="flex:1"><div id="giftAdTitle" style="font-weight:900;color:#000;font-size:13px">🎁 Claim Your $100 Bonus</div><div id="giftAdSub" style="font-size:11px;color:#333">Limited offer • Sponsored</div></div>
    <div id="giftAdBtn" style="background:#000;color:#fff;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap">Visit →</div>
  </a>
</div>

<div id="adGate"><div class="gate-box"><button onclick="document.getElementById('adGate').style.display='none'" style="position:absolute;top:10px;right:12px;border:none;background:none;font-size:18px;font-weight:900;cursor:pointer;color:#9ca3af">✕</button><div class="gate-icon">🎁</div><div class="gate-title">Unwrapping your gift...</div><div id="gateSub" class="gate-sub">Please wait, your gift is loading</div><button id="watchAdBtn" class="gate-btn watch" disabled>Loading... 10s</button><div id="gateBarWrap"><div id="gateBar"></div></div><div id="gateTimer2"></div><button id="openBtn" class="gate-btn open">Tap to Reveal 🎁</button><div style="font-size:9px;color:#9ca3af;margin-top:12px;font-weight:700">Advertisement</div></div></div>
<div id="toast"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try{firebase.appCheck().activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);}catch(e){}
const auth=firebase.auth(),db=firebase.firestore();

const GIFT_ZONE='12273869';
const GIFT_PUSH_ZONE='12350692';
let currentUser=null, totalCoins=0, pickedCount=0, pendingGift=null, giftValues=[], isClaiming=false;

const GIFT_ADS=[
  {title:"🎁 Claim Your $100 Bonus",sub:"Limited offer • Sponsored",btn:"Visit →",bg:"#FFD700",link:"https://uplcm.com/4/12320757"},
  {title:"💰 Earn $50 Daily - Easy Tasks",sub:"New users • Sponsored",btn:"Visit →",bg:"#7CFC00",link:"https://uplcm.com/4/12320757"},
  {title:"📱 Win Free Airtime Today",sub:"MTN • Airtel • Sponsored",btn:"Visit →",bg:"#00D4FF",link:"https://uplcm.com/4/12320757"},
  {title:"🔥 Hot Offer - Double Your Coins",sub:"Today only • Sponsored",btn:"Visit →",bg:"#FF9F43",link:"https://uplcm.com/4/12320757"}
];
const GIFT_AD_TIME=2*60*1000, GIFT_AD_KEY='giftAd_state_v1';
let giftAdIndex=0;
function saveGiftAd(){ try{ localStorage.setItem(GIFT_AD_KEY, JSON.stringify({index:giftAdIndex, changedAt:Date.now()})); }catch(e){} }
function showGiftAd(i){
  const a=GIFT_ADS[i]; const link=document.getElementById('giftAdLink'); if(!link) return;
  link.href=a.link; link.style.background=a.bg;
  document.getElementById('giftAdTitle').textContent=a.title;
  document.getElementById('giftAdSub').textContent=a.sub;
  document.getElementById('giftAdBtn').textContent=a.btn;
}
function nextGiftAd(){ giftAdIndex=(giftAdIndex+1)%GIFT_ADS.length; showGiftAd(giftAdIndex); saveGiftAd(); }
(function initGiftAd(){
  try{
    const raw=localStorage.getItem(GIFT_AD_KEY);
    if(!raw){ showGiftAd(0); saveGiftAd(); setTimeout(function(){ nextGiftAd(); setInterval(nextGiftAd, GIFT_AD_TIME); }, GIFT_AD_TIME); return; }
    const saved=JSON.parse(raw); const elapsed=Date.now()-(saved.changedAt||Date.now());
    const steps=Math.floor(elapsed/GIFT_AD_TIME); giftAdIndex=((saved.index||0)+steps)%GIFT_ADS.length;
    const remain=GIFT_AD_TIME-(elapsed%GIFT_AD_TIME); showGiftAd(giftAdIndex);
    try{ localStorage.setItem(GIFT_AD_KEY, JSON.stringify({index:giftAdIndex, changedAt:Date.now()-(elapsed%GIFT_AD_TIME)})); }catch(e){}
    setTimeout(function(){ nextGiftAd(); setInterval(nextGiftAd, GIFT_AD_TIME); }, remain);
  }catch(e){ showGiftAd(0); saveGiftAd(); setInterval(nextGiftAd, GIFT_AD_TIME); }
})();

function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function localDayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}

let vignetteLoaded=false;
function loadVignette(){
  if(vignetteLoaded) return; vignetteLoaded=true;
  const old=document.querySelector('script[src*="vignette.min.js"]'); if(old) old.remove();
  (function(s){s.dataset.zone=GIFT_ZONE,s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
  setTimeout(()=>{vignetteLoaded=false;}, 60*1000);
}
let giftPushLoaded=false;
function loadGiftPush(){
  if(giftPushLoaded) return; giftPushLoaded=true;
  const old=document.querySelector('script[src*="tag.min.js"][data-zone="12350692"]'); if(old) old.remove();
  (function(s){s.dataset.zone='12350692',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
  setTimeout(()=>{giftPushLoaded=false;}, 60*1000);
}

function buildGrid(){
  const grid=document.getElementById('giftGrid'); grid.innerHTML='';
  // Seeded values for today + user so same user gets same gifts all day, different users different
  const day=localDayKey();
  const uid=(currentUser && currentUser.uid) || 'guest';
  let seed=0; const str=day+'-'+uid; for(let i=0;i<str.length;i++) seed=(seed*31+str.charCodeAt(i))>>>0;
  const pool=[1,1,2,2,3];
  giftValues=[];
  for(let i=0;i<5;i++){ seed=(seed*9301+49297)%233280; let j=seed%pool.length; giftValues.push(pool.splice(j,1)[0]); }
  giftValues.push(0); // 6th cell = empty / decoy, keep grid 3x2
  for(let i=0;i<6;i++){
    const d=document.createElement('div'); d.className='gift'; d.dataset.idx=i;
    if(i===5){ d.innerHTML='<div>🎁</div><div class="gift-label">Bonus Box</div>'; d.style.opacity='0.5'; d.onclick=()=>showToast('This is decoration — pick the other 5'); }
    else { d.innerHTML='<div class="gift-emoji">🎁</div><div class="gift-label">Gift '+(i+1)+'</div>'; d.onclick=()=>onGiftClick(d,i); }
    grid.appendChild(d);
  }
}
function onGiftClick(el, idx){
  if(el.classList.contains('opened')) return;
  if(pendingGift!==null) return;
  pendingGift={el, idx};
  openGate();
}
let gateIv=null;
function openGate(){
  document.getElementById('adGate').style.display='flex';
  document.getElementById('watchAdBtn').style.display='block';
  document.getElementById('watchAdBtn').disabled=true;
  document.getElementById('watchAdBtn').innerText='Loading... 10s';
  document.getElementById('openBtn').style.display='none';
  document.getElementById('gateBar').style.width='0%';
  document.getElementById('gateTimer2').innerText='Loading... 10s';
  let sec=10; const bar=document.getElementById('gateBar'); const te=document.getElementById('gateTimer2'); const btn=document.getElementById('watchAdBtn');
  if(gateIv) clearInterval(gateIv);
  gateIv=setInterval(()=>{sec--; bar.style.width=((10-sec)/10*100)+'%'; if(sec>0){te.innerText='Loading... '+sec+'s'; btn.innerText='Loading... '+sec+'s';} else {clearInterval(gateIv); bar.style.width='100%'; document.getElementById('watchAdBtn').style.display='none'; te.innerText='Ready!'; document.getElementById('openBtn').style.display='block';}},1000);
}
document.getElementById('openBtn').onclick=function(){
  document.getElementById('adGate').style.display='none';
  loadVignette();
  const g=pendingGift; pendingGift=null;
  if(!g) return;
  const val=giftValues[g.idx];
  totalCoins+=val; pickedCount++;
  g.el.classList.add('opened');
  g.el.innerHTML='<div class="gift-emoji">🪙</div><div class="gift-value">+'+val+' coins</div>';
  document.getElementById('totalCoins').innerText=totalCoins;
  document.getElementById('pickedCount').innerText=pickedCount;
  document.getElementById('statusText').innerText=pickedCount>=5 ? 'All gifts opened — Claim now!' : 'Nice! +'+val+' coins — Pick next gift';
  showToast('🎁 +'+val+' coins!');
  const claimBtn=document.getElementById('claimBtn');
  claimBtn.innerText='Claim '+totalCoins+' Coins';
  if(pickedCount>=5){ claimBtn.disabled=false; }
  saveGiftSession();
};
function saveGiftSession(){
  try{ localStorage.setItem('gift_session_'+localDayKey(), JSON.stringify({totalCoins, pickedCount, opened:[...document.querySelectorAll('.gift.opened')].map(e=>Number(e.dataset.idx)), values:giftValues})); }catch(e){}
}
function loadGiftSession(){
  try{
    const s=JSON.parse(localStorage.getItem('gift_session_'+localDayKey())||'null');
    if(!s) return false;
    totalCoins=s.totalCoins||0; pickedCount=s.pickedCount||0; if(s.values) giftValues=s.values;
    document.getElementById('totalCoins').innerText=totalCoins;
    document.getElementById('pickedCount').innerText=pickedCount;
    (s.opened||[]).forEach(idx=>{
      const el=document.querySelector('.gift[data-idx="'+idx+'"]'); if(!el) return;
      const val=giftValues[idx]||0; el.classList.add('opened'); el.innerHTML='<div class="gift-emoji">🪙</div><div class="gift-value">+'+val+' coins</div>';
    });
    const claimBtn=document.getElementById('claimBtn'); claimBtn.innerText='Claim '+totalCoins+' Coins';
    if(pickedCount>=5) claimBtn.disabled=false;
    return true;
  }catch(e){ return false; }
}
document.getElementById('claimBtn').onclick=async()=>{
  if(isClaiming) return; if(pickedCount<5) return;
  isClaiming=true;
  const btn=document.getElementById('claimBtn'); btn.disabled=true; btn.innerText='Claiming...';
  try{
    if(!currentUser) throw new Error('Login required');
    await db.collection('users').doc(currentUser.uid).set({
      balance:firebase.firestore.FieldValue.increment(totalCoins),
      coins:firebase.firestore.FieldValue.increment(totalCoins),
      points:firebase.firestore.FieldValue.increment(totalCoins),
      lastEarnAt:firebase.firestore.FieldValue.serverTimestamp(),
      giftEarn_date:localDayKey(),
      giftEarn_total:totalCoins
    },{merge:true});
    loadGiftPush();
    showToast('✓ +'+totalCoins+' coins claimed!');
    localStorage.removeItem('gift_session_'+localDayKey());
    setTimeout(()=>{location.href='home.html';},1500);
  }catch(e){ showToast(e.message); isClaiming=false; btn.disabled=false; btn.innerText='Claim '+totalCoins+' Coins'; }
};
auth.onAuthStateChanged(async(u)=>{
  if(!u){location.href='./index.html';return;}
  currentUser=u;
  buildGrid();
  loadGiftSession();
  try{
    const doc=await db.collection('users').doc(u.uid).get();
    if(doc.exists && doc.data().giftEarn_date===localDayKey()){
      document.getElementById('statusText').innerText='Already claimed today — Come back tomorrow';
      document.querySelectorAll('.gift').forEach(g=>{g.style.pointerEvents='none'; g.style.opacity='0.6';});
      document.getElementById('claimBtn').disabled=true; document.getElementById('claimBtn').innerText='Already Claimed Today';
    }
  }catch(e){}
});
</script></body></html>
