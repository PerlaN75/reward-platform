<!DOCTYPE html>
<html>
<head>
  <title>More - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; }
    .container { max-width: 500px; margin: 0 auto; }
    .header { text-align: center; margin: 20px 0 30px 0; color: #fbbf24; font-size: 28px; font-weight: bold; }
    
    .menu-list button {
      width: 100%;
      background: #1a2410;
      border: 1px solid #fbbf24;
      border-radius: 12px;
      padding: 18px;
      margin: 10px 0;
      color: white;
      text-align: left;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .menu-list button:hover { background: #222e15; border-color: #fcd34d; }
    .menu-list button span {
      display: block;
      font-size: 12px;
      color: #aaa;
      font-weight: normal;
      margin-top: 4px;
    }
    .icon { font-size: 20px; margin-right: 8px; }

    .back-btn { width: 100%; margin: 30px 0 0 0; padding: 14px; background: #f59e0b; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
    .back-btn:hover { background: #fbbf24; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">⚙️ More</div>
    
    <div class="menu-list">
      <button onclick="window.location.href='./profile.html'">
        <span class="icon">👤</span> Profile
        <span>View name, email, stats</span>
      </button>

      <button onclick="window.location.href='./history.html'">
        <span class="icon">📜</span> Earn History
        <span>All points from Watch, Daily, Refer</span>
      </button>

      <button onclick="window.location.href='./settings.html'">
        <span class="icon">⚙️</span> Settings
        <span>Notifications, Sound, Language</span>
      </button>

      <button onclick="window.location.href='./help.html'">
        <span class="icon">❓</span> Help & FAQ
        <span>How to earn, Withdraw rules</span>
      </button>

      <button onclick="window.location.href='./about.html'">
        <span class="icon">ℹ️</span> About Us
        <span>Version 1.0.0 | Contact</span>
      </button>
    </div>

    <button class="back-btn" onclick="window.location.href='./home.html'">Back to Home</button>
  </div>
</body>
</html>
