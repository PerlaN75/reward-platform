<!DOCTYPE html>
<html>
<head>
  <title>More - Coins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#f5f3ff;min-height:100vh;color:#111827;transition:0.2s}
    body.dark{background:#111827;color:#f9fafb}
    body.dark .card{background:#1f2937;border-color:#374151}
    body.dark .modal-box{background:#1f2937;color:#fff}
    body.dark .item{background:#111827;border-color:#374151}
    .top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100}
    .back-btn-checkin{width:45px;height:30px;border-radius:10px;background:#fff;border:2px solid #fecaca;display:flex;align-items:center;justify-content:center;text-decoration:none}
    .back-btn-checkin .lines{display:flex;flex-direction:column;gap:3px}
    .back-btn-checkin .lines i{display:block;width:18px;height:2.5px;background:#000;border-radius:2px}
    .center-pill{background:#fff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%)}
    .container{max-width:500px;margin:0 auto;padding:12px 14px 20px 14px}
    .card{background:#fff;border:2px solid #ede9fe;border-radius:20px;padding:4px 8px;position:relative;overflow:hidden}
    .menu-list a{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;color:inherit;text-decoration:none;font-size:15px;font-weight:800;border-radius:14px;cursor:pointer}
    .menu-list a:not(:last-child){border-bottom:1px solid #f5f3ff}
    .modal{display:none;position:fixed;z-index:9999;left:0;top:0;width:100%;height:100%;background:rgba(76,29,149,0.45);justify-content:center;align-items:center;padding:15px}
    .modal-box{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:20px;max-height:85vh;overflow-y:auto;position:relative}
    .close{position:absolute;top:12px;right:15px;font-size:22px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#f5f3ff;border-radius:50%;color:#6d28d9}
    .item{background:#f9fafb;border:1.5px solid #ede9fe;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
    .lang-option{display:flex;justify-content:space-between;padding:14px;border:2px solid #ede9fe;border-radius:12px;margin-bottom:8px;cursor:pointer}
    .lang-option.active{border-color:#fbbf24;background:#fffbeb}
    .mode-btn{flex:1;padding:12px;border-radius:12px;border:2px solid #ede9fe;background:#fff;cursor:pointer;text-align:center;font-weight:800}
    .mode-btn.active{border-color:#fbbf24;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000}
    #moreBannerBox{min-height:90px}
  </style>
</head>
<body>
<div class="top-bar">
  <a href="home.html" class="back-btn-checkin"><span class="lines"><i></i><i></i><i></i></span></a>
  <div class="center-pill">⚙️ More</div>
  <div style="width:45px"></div>
</div>
<div class="container">
  <div class="card" id="mainCard">
    <div class="menu-list">
      <a onclick="openModal('notifModal')"><div>🔔 Notifications</div><span>›</span></a>
      <a onclick="openModal('historyModal')"><div>📜 History</div><span>›</span></a>
      <a onclick="openModal('settingsModal')"><div>⚙️ Settings</div><span>›</span></a>
    </div>
  </div>
</div>
<div style="max-width:500px;margin:0 auto;padding:0 14px 30px;width:100%">
  <div style="font-size:10px;color:#9ca3af;font-weight:700;text-align:center;margin-bottom:6px">Advertisement</div>
  <div id="moreBannerBox"></div>
</div>
<div id="notifModal" class="modal" onclick="closeModal('notifModal')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('notifModal')">×</span><h3 style="text-align:center">🔔 Notifications</h3><div id="notifList" style="margin-top:12px">Loading...</div></div></div>
<div id="historyModal" class="modal" onclick="closeModal('historyModal')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('historyModal')">×</span><h3 style="text-align:center">📜 History</h3><div style="display:flex;gap:6px;margin:12px 0;flex-wrap:wrap"><button onclick="filterHistory('ALL')" id="f-ALL" style="padding:7px 10px;border:none;border-radius:20px;background:#6d28d9;color:#fff;font-weight:800;font-size:11px">All</button><button onclick="filterHistory('Watch')" id="f-Watch" style="padding:7px 10px;border:1px solid #ede9fe;border-radius:20px;background:#fff;font-weight:800;font-size:11px">Watch</button><button onclick="filterHistory('Quiz')" id="f-Quiz" style="padding:7px 10px;border:1px solid #ede9fe;border-radius:20px;background:#fff;font-weight:800;font-size:11px">Quiz</button><button onclick="filterHistory('Gifts')" id="f-Gifts" style="padding:7px 10px;border:1px solid #ede9fe;border-radius:20px;background:#fff;font-weight:800;font-size:11px">Gifts</button><button onclick="filterHistory('Bonus')" id="f-Bonus" style="padding:7px 10px;border:1px solid #ede9fe;border-radius:20px;background:#fff;font-weight:800;font-size:11px">Bonus</button><button onclick="filterHistory('Wallet')" id="f-Wallet" style="padding:7px 10px;border:1px solid #ede9fe;border-radius:20px;background:#fff;font-weight:800;font-size:11px">Wallet</button><button onclick="filterHistory('Refer')" id="f-Refer" style="padding:7px 10px;border:1px solid #ede9fe;border-radius:20px;background:#fff;font-weight:800;font-size:11px">Refer</button></div><div style="display:flex;gap:10px;margin:0 0 12px"><button onclick="loadHistory()" style="flex:1;padding:10px;border:none;border-radius:10px;background:#fbbf24;font-weight:800">Refresh</button><button onclick="clearHistorySafe()" style="flex:1;padding:10px;border:none;border-radius:10px;background:#ef4444;color:#fff;font-weight:800">Clear All</button></div><div id="historyList" style="max-height:50vh;overflow-y:auto">Loading...</div></div></div>
<div id="settingsModal" class="modal" onclick="closeModal('settingsModal')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('settingsModal')">×</span><h3 style="text-align:center;margin-bottom:14px">⚙️ Settings</h3><div><span style="font-size:13px;font-weight:800">Language</span><div class="lang-option active" id="lang-en" onclick="setLang('en',this)"><span>English 🇺🇸</span><span>✓</span></div></div><div style="margin:16px 0"><span style="font-size:13px;font-weight:800">Appearance</span><div style="display:flex;gap:10px;margin-top:8px"><div class="mode-btn" id="modeLight" onclick="setMode('light')">☀️ Light</div><div class="mode-btn" id="modeDark" onclick="setMode('dark')">🌙 Dark</div></div></div><button onclick="saveSettings()" style="width:70%;margin:18px auto 0;display:block;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:none;padding:12px;border-radius:12px;font-weight:800">Save & Close</button></div></div>
<script>
(function loadMoreBanner(){
  const box=document.getElementById('moreBannerBox');
  if(!box) return;
  const s=document.createElement('script');
  s.dataset.zone='12360849';
  s.src='https://nap5k.com/tag.min.js';
  box.appendChild(s);
})();
</script>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
try{ firebase.appCheck().activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', true); }catch(e){}
const auth=firebase.auth(), db=firebase.firestore(); let cachedUser=null, allData=[], currentFilter='ALL';
function showVignetteOnce(){
  var KEY='vignette_more_last';
  var now=Date.now();
  var last=Number(localStorage.getItem(KEY)||0);
  if(now-last < 2*60*1000) return;
  localStorage.setItem(KEY, String(now));
  var s=document.createElement('script');
  s.dataset.zone='12083688';
  s.src='https://n6wxm.com/vignette.min.js';
  document.body.appendChild(s);
}
function openModal(id){ doOpenModal(id); showVignetteOnce(); }
function doOpenModal(id){ document.getElementById(id).style.display='flex'; if(id==='historyModal') loadHistory(); if(id==='notifModal') loadNotifs(); }
function closeModal(id){ document.getElementById(id).style.display='none'; }
function setLang(c,el){ localStorage.setItem('app_lang',c); document.querySelectorAll('.lang-option').forEach(o=>o.classList.remove('active')); el.classList.add('active'); }
function setMode(m){ localStorage.setItem('app_mode',m); document.getElementById('modeLight').classList.toggle('active',m==='light'); document.getElementById('modeDark').classList.toggle('active',m==='dark'); if(m==='dark') document.body.classList.add('dark'); else document.body.classList.remove('dark'); }
function saveSettings(){ closeModal('settingsModal'); }
(function(){ const m=localStorage.getItem('app_mode')||'light'; setMode(m); })();
async function loadNotifs(){ const el=document.getElementById('notifList'); el.innerHTML='Loading...'; try{ const snap=await db.collection('notifications').orderBy('createdAt','desc').limit(20).get(); if(snap.empty){ el.innerHTML='<p style="text-align:center;padding:20px;color:#9ca3af">No notifications</p>'; return; } let h=''; snap.forEach(d=>{ const n=d.data(); const date=n.createdAt?.toDate?n.createdAt.toDate().toLocaleString():''; h+=`<div class="item"><div><div style="font-size:12px;font-weight:800">${n.message||n.title}</div><div style="font-size:10px;color:#9ca3af">${date}</div></div></div>`; }); el.innerHTML=h; }catch(e){ el.innerHTML='Error'; } }
function getHiddenIds(){ try{ return JSON.parse(localStorage.getItem('hiddenHistoryIds')||'[]'); }catch{return [];} }
function addHiddenIds(ids){ const cur=new Set(getHiddenIds()); ids.forEach(id=>cur.add(id)); const arr=[...cur]; localStorage.setItem('hiddenHistoryIds', JSON.stringify(arr)); const u=auth.currentUser||cachedUser; if(u){ db.collection('users').doc(u.uid).set({hiddenHistoryIds:arr},{merge:true}).catch(()=>{}); } }
function normalizeType(raw, desc){
  const s=((raw||'')+' '+(desc||'')).toLowerCase();
  if(s.includes('withdraw')||s.includes('payout')||s.includes('cashout')||s.includes('wallet')||s.includes('redeem')) return 'Wallet';
  if(s.includes('refer')||s.includes('invite')||s.includes('friend')) return 'Refer';
  if(s.includes('quiz')||s.includes('trivia')||s.includes('question')) return 'Quiz';
  if(s.includes('gift')||s.includes('box')||s.includes('present')) return 'Gifts';
  if(s.includes('bonus')||s.includes('hourly')||s.includes('daily')||s.includes('check')) return 'Bonus';
  if(s.includes('watch')||s.includes('video')||s.includes('ad')||s.includes('faucet')||s.includes('offer')||s.includes('task')||s.includes('earn')) return 'Watch';
  return 'Watch';
}
function typeIcon(t){ return t==='Quiz'?'🧠':t==='Gifts'?'🎁':t==='Refer'?'👥':t==='Bonus'?'🎁':t==='Wallet'?'💰':'👁️'; }
function toDate(v){ if(!v) return new Date(); if(v.toDate) return v.toDate(); if(v.seconds) return new Date(v.seconds*1000); if(typeof v==='number') return new Date(v); const d=new Date(v); return isNaN(d)?new Date():d; }
function renderHistory(){
  const list=document.getElementById('historyList');
  ['ALL','Watch','Quiz','Gifts','Bonus','Wallet','Refer'].forEach(f=>{
    const b=document.getElementById('f-'+f); if(!b) return;
    const active = f===currentFilter;
    b.style.background=active?'#6d28d9':'#fff'; b.style.color=active?'#fff':'#111'; b.style.border=active?'none':'1px solid #ede9fe';
  });
  const groups={};
  allData.forEach(v=>{
    if(currentFilter!=='ALL' && v.type!==currentFilter) return;
    if(!groups[v.type]) groups[v.type]={type:v.type, coins:0, count:0, date:v.date};
    groups[v.type].coins += Number(v.coins)||0;
    groups[v.type].count += 1;
    if(v.date > groups[v.type].date) groups[v.type].date=v.date;
  });
  const rows=Object.values(groups).sort((a,b)=>b.date-a.date);
  if(!rows.length){ list.innerHTML='<p style="text-align:center;padding:20px">No history for '+currentFilter+' ✅<br><span style="font-size:11px;color:#9ca3af">Do Watch / Quiz / Gifts / Bonus / Refer and come back</span></p>'; return; }
  let html='';
  rows.forEach(v=>{
    const isNeg=v.coins<0;
    html+=`<div class="item"><div><div style="font-weight:bold;font-size:13px">${typeIcon(v.type)} ${v.type}</div><div style="font-size:11px;color:#9ca3af">${v.date.toLocaleString()} • ${v.count} time${v.count>1?'s':''}</div></div><div style="color:${isNeg?'#ef4444':'#22c55e'};font-weight:900;white-space:nowrap">${isNeg?v.coins:'+'+v.coins} 🪙</div></div>`;
  });
  list.innerHTML=html;
}
function filterHistory(f){ currentFilter=f; renderHistory(); }
async function loadHistory(){
  const user=auth.currentUser||cachedUser; if(!user) return;
  const list=document.getElementById('historyList'); list.innerHTML='Loading...'; allData=[];
  const hidden=new Set(getHiddenIds());
  const pushItem=(id, raw, coins, dateVal, desc, source)=>{
    if(!id || hidden.has(id)) return;
    const type=normalizeType(raw, desc);
    allData.push({ id, type, action: raw||type, coins: Number(coins)||0, date: toDate(dateVal), desc: desc||'', source });
  };
  try{
    const keys=['appHistory','history','earnHistory','userHistory','transactions'];
    keys.forEach(k=>{
      try{ const arr=JSON.parse(localStorage.getItem(k)||'[]'); if(Array.isArray(arr)) arr.forEach((v,i)=> pushItem('local_'+k+'_'+(v.id||i), v.action||v.type||v.title||'Earn', v.coins??v.points??v.amount??0, v.timestamp||v.createdAt||v.date||v.time, v.desc||v.description||'', 'local')); }catch(e){}
    });
    try{ const ud=JSON.parse(localStorage.getItem('userData')||'{}'); if(Array.isArray(ud.history)) ud.history.forEach((v,i)=> pushItem('local_userData_'+i, v.action||v.type||'Earn', v.coins??v.points??v.amount??0, v.timestamp||v.createdAt||v.date, v.desc||v.description||'', 'local')); }catch(e){}
  }catch(e){}
  let uData={};
  try{ const userDoc=await db.collection('users').doc(user.uid).get(); if(userDoc.exists){ uData=userDoc.data()||{}; if(Array.isArray(uData.hiddenHistoryIds)) uData.hiddenHistoryIds.forEach(id=>hidden.add(id)); if(Array.isArray(uData.history)) uData.history.forEach((v,i)=> pushItem('userfield_'+i, v.action||v.type||'Earn', v.coins??v.points??v.amount??0, v.timestamp||v.createdAt||v.date, v.desc||v.description||'', 'userfield')); } }catch(e){}
  const tryCol=async(col, prefix)=>{
    try{ const snap=await db.collection('users').doc(user.uid).collection(col).limit(100).get(); snap.forEach(d=>{ const v=d.data(); if(v.hidden===true) return; pushItem(prefix+d.id, v.action||v.type||v.title||'Earn', v.coins??v.points??v.amount??0, v.timestamp||v.createdAt||v.date||v.time, v.desc||v.description||'', col); }); }catch(e){}
  };
  await tryCol('earnHistory','earn_'); await tryCol('transactions','tx_'); await tryCol('history','hist_'); await tryCol('withdrawals','wd_');
  try{ const snap=await db.collection('withdrawals').limit(100).get(); snap.forEach(d=>{ const v=d.data(); if(v.userId!==user.uid && v.uid!==user.uid) return; const amt=-(Math.abs(Number(v.coins??v.amount??0))); pushItem('wdtop_'+d.id, 'Withdraw - '+(v.method||v.status||'Wallet'), amt, v.createdAt||v.timestamp||v.date, (v.status||'')+' '+(v.method||''), 'withdrawals-top'); }); }catch(e){}
  if(allData.length===0){
    const now=new Date();
    const add=(id,action,coins,date,desc)=>{ if(coins>0) pushItem(id,action,coins,date,desc,'fallback'); };
    add('fb_bonus','Bonus - Hourly Bonus', Number(uData.bonusTotal||uData.totalBonusEarned||uData.bonusClaimsToday||0), uData.lastBonusTimestamp||uData.lastBonusAt||now, 'Bonus total');
    add('fb_refer','Refer - Invite Friends', Number(uData.referralEarned||uData.totalReferralEarned||(uData.referralCount||uData.referrals||0)*5||0), uData.lastReferralAt||now, 'Referrals: '+(uData.referralCount||uData.referrals||0));
    add('fb_quiz','Quiz - Quiz Earned', Number(uData.totalQuizEarned||uData.quizEarned||0), uData.lastQuizAt||now, 'Quizzes: '+(uData.quizCount||''));
    add('fb_watch','Watch - Watch Earned', Number(uData.totalWatchEarned||uData.watchEarned||0), uData.lastWatchAt||now, 'Watches: '+(uData.watchCount||''));
    add('fb_gifts','Gifts - Gifts Earned', Number(uData.totalGiftsEarned||uData.giftsEarned||uData.giftTotal||0), uData.lastGiftAt||now, 'Gifts');
    if(allData.length===0 && Number(uData.balance||0)>0) pushItem('fb_balance','Watch - Total Balance', Number(uData.balance), uData.updatedAt||now, 'Total balance', 'fallback');
  }
  const seen=new Set(); allData=allData.filter(x=>{ if(seen.has(x.id)) return false; seen.add(x.id); return true; });
  allData.sort((a,b)=>b.date - a.date);
  renderHistory();
}
async function clearHistorySafe(){ if(allData.length===0){ document.getElementById('historyList').innerHTML='<p style="text-align:center;padding:20px">No history</p>'; return; } if(!confirm('Clear all history?')) return; const list=document.getElementById('historyList'); list.innerHTML='Clearing...'; const ids=allData.map(x=>x.id); addHiddenIds(ids); const user=auth.currentUser||cachedUser; for(const it of allData){ try{ if(it.source==='earnHistory'){ const realId=it.id.replace('earn_',''); await db.collection('users').doc(user.uid).collection('earnHistory').doc(realId).set({hidden:true},{merge:true}); } }catch(e){} } allData=[]; renderHistory(); }
auth.onAuthStateChanged(u=>{ if(!u){ location.href='./index.html'; return; } cachedUser=u; });
</script>
</body>
</html>
