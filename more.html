<!DOCTYPE html>
<html>
<head>
  <title>More - Coins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#f5f3ff;min-height:100vh;color:#111827;transition:0.2s}
    body.dark{background:#111827;color:#f9fafb}
    body.dark .card{background:#1f2937;border-color:#374151}
    body.dark .modal-box{background:#1f2937;color:#fff}
    body.dark .item{background:#111827;border-color:#374151}
    .top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100}
    .back-btn-checkin{width:45px;height:30px;border-radius:10px;background:#fff;border:2px solid #fecaca;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#991b1b;font-weight:900;font-size:22px}
    .center-pill{background:#fff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%)}
    .container{max-width:500px;margin:0 auto;padding:16px 14px 90px 14px}
    .card{background:#fff;border:2px solid #ede9fe;border-radius:20px;padding:8px;position:relative;overflow:hidden;min-height:340px}
    .menu-list a{display:flex;align-items:center;justify-content:space-between;padding:19px 16px;color:inherit;text-decoration:none;font-size:15px;font-weight:800;border-radius:14px;cursor:pointer}
    .menu-list a:not(:last-child){border-bottom:1px solid #f5f3ff}
    #moreGate{position:absolute;inset:0;background:#fff;z-index:20;border-radius:20px;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;border:3px solid #fbbf24}
    #moreGate.show{display:flex}
    #moreTimerBox{width:88px;height:88px;border-radius:50%;background:linear-gradient(180deg,#fef3c7,#fbbf24);border:4px solid #f59e0b;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#92400e;margin:14px auto}
    #moreProgress{width:100%;height:8px;background:#fef3c7;border-radius:99px;margin-top:16px;overflow:hidden}
    #moreProgressBar{height:100%;width:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);transition:width 1s linear}
    .modal{display:none;position:fixed;z-index:9999;left:0;top:0;width:100%;height:100%;background:rgba(76,29,149,0.45);justify-content:center;align-items:center;padding:15px}
    .modal-box{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:20px;max-height:85vh;overflow-y:auto;position:relative}
    .close{position:absolute;top:12px;right:15px;font-size:22px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#f5f3ff;border-radius:50%;color:#6d28d9}
    .item{background:#f9fafb;border:1.5px solid #ede9fe;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
    .avatar-letter{width:78px;height:78px;background:linear-gradient(180deg,#ede9fe,#ddd6fe);border:3px solid #a78bfa;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#6d28d9;margin:8px auto}
    .lang-option{display:flex;justify-content:space-between;padding:14px;border:2px solid #ede9fe;border-radius:12px;margin-bottom:8px;cursor:pointer}
    .lang-option.active{border-color:#fbbf24;background:#fffbeb}
    .mode-btn{flex:1;padding:12px;border-radius:12px;border:2px solid #ede9fe;background:#fff;cursor:pointer;text-align:center;font-weight:800}
    .mode-btn.active{border-color:#fbbf24;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000}
  </style>
</head>
<body>
<div class="top-bar">
  <a href="home.html" class="back-btn-checkin">‹</a>
  <div class="center-pill">⚙️ More</div>
  <div style="width:45px"></div>
</div>
<div class="container">
  <div class="card" id="mainCard">
    <div id="moreGate">
      <div style="font-size:42px">🪙</div>
      <div style="font-weight:900;font-size:18px;color:#92400e;margin-top:8px">Loading More</div>
      <div id="moreTimerBox">10</div>
      <div style="font-size:11px;color:#d97706;font-weight:800">Clean ads loading...</div>
      <div id="moreProgress"><div id="moreProgressBar"></div></div>
    </div>
    <div class="menu-list">
      <a onclick="openModal('notifModal')"><div>🔔 Notifications</div><span>›</span></a>
      <a onclick="openModal('historyModal')"><div>📜 History</div><span>›</span></a>
      <a onclick="openModal('settingsModal')"><div>⚙️ Settings</div><span>›</span></a>
    </div>
  </div>
</div>

<div id="notifModal" class="modal" onclick="closeModal('notifModal')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('notifModal')">×</span><h3 style="text-align:center">🔔 Notifications</h3><div id="notifList" style="margin-top:12px">Loading...</div></div></div>
<div id="historyModal" class="modal" onclick="closeModal('historyModal')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('historyModal')">×</span><h3 style="text-align:center">📜 History</h3><div style="display:flex;gap:10px;margin:12px 0"><button onclick="loadHistory()" style="flex:1;padding:10px;border:none;border-radius:10px;background:#fbbf24;font-weight:800">Refresh</button><button onclick="clearHistorySafe()" style="flex:1;padding:10px;border:none;border-radius:10px;background:#ef4444;color:#fff;font-weight:800">Clear All</button></div><div id="historyList" style="max-height:50vh;overflow-y:auto">Loading...</div></div></div>
<div id="settingsModal" class="modal" onclick="closeModal('settingsModal')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('settingsModal')">×</span><h3 style="text-align:center;margin-bottom:14px">⚙️ Settings</h3><div><span style="font-size:13px;font-weight:800">Language</span><div class="lang-option active" id="lang-en" onclick="setLang('en',this)"><span>English 🇺🇸</span><span>✓</span></div></div><div style="margin:16px 0"><span style="font-size:13px;font-weight:800">Appearance</span><div style="display:flex;gap:10px;margin-top:8px"><div class="mode-btn" id="modeLight" onclick="setMode('light')">☀️ Light</div><div class="mode-btn" id="modeDark" onclick="setMode('dark')">🌙 Dark</div></div></div><button onclick="saveSettings()" style="width:70%;margin:18px auto 0;display:block;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:none;padding:12px;border-radius:12px;font-weight:800">Save & Close</button></div></div>

<script>
function loadVignette(){
  const old = document.querySelector('script[src*="vignette.min.js"]');
  if(old) old.remove();
  (function(s){s.dataset.zone='12268552',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
}
function initMoreGate(){
  const gate=document.getElementById('moreGate');
  const timerBox=document.getElementById('moreTimerBox');
  const progressBar=document.getElementById('moreProgressBar');
  const COOLDOWN=3*60*1000;
  const last=parseInt(localStorage.getItem('moreGateLastShown')||'0');
  if(last && (Date.now()-last)<COOLDOWN){
    gate.style.display='none';
    gate.classList.remove('show');
    return;
  }
  gate.classList.add('show');
  gate.style.display='flex';
  let sec=10; timerBox.innerText=sec; progressBar.style.width='100%';
  const int=setInterval(()=>{
    sec--; timerBox.innerText=sec; progressBar.style.width=(sec*10)+'%';
    if(sec<=0){
      clearInterval(int);
      gate.style.display='none';
      gate.classList.remove('show');
      localStorage.setItem('moreGateLastShown', String(Date.now()));
      loadVignette();
    }
  },1000);
}
initMoreGate();
</script>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
try{ firebase.appCheck().activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', true); }catch(e){}
const auth=firebase.auth(), db=firebase.firestore(); let cachedUser=null, allData=[];
function openModal(id){ document.getElementById(id).style.display='flex'; if(id==='historyModal') loadHistory(); if(id==='notifModal') loadNotifs(); }
function closeModal(id){ document.getElementById(id).style.display='none'; }
function setLang(c,el){ localStorage.setItem('app_lang',c); document.querySelectorAll('.lang-option').forEach(o=>o.classList.remove('active')); el.classList.add('active'); }
function setMode(m){ localStorage.setItem('app_mode',m); document.getElementById('modeLight').classList.toggle('active',m==='light'); document.getElementById('modeDark').classList.toggle('active',m==='dark'); if(m==='dark') document.body.classList.add('dark'); else document.body.classList.remove('dark'); }
function saveSettings(){ closeModal('settingsModal'); }
(function(){ const m=localStorage.getItem('app_mode')||'light'; setMode(m); })();
async function loadNotifs(){ const el=document.getElementById('notifList'); el.innerHTML='Loading...'; try{ const snap=await db.collection('notifications').orderBy('createdAt','desc').limit(20).get(); if(snap.empty){ el.innerHTML='<p style="text-align:center;padding:20px;color:#9ca3af">No notifications</p>'; return; } let h=''; snap.forEach(d=>{ const n=d.data(); const date=n.createdAt?.toDate?n.createdAt.toDate().toLocaleString():''; h+=`<div class="item"><div><div style="font-size:12px;font-weight:800">${n.message||n.title}</div><div style="font-size:10px;color:#9ca3af">${date}</div></div></div>`; }); el.innerHTML=h; }catch(e){ el.innerHTML='Error'; } }
function getHiddenIds(){ try{ return JSON.parse(localStorage.getItem('hiddenHistoryIds')||'[]'); }catch{return [];} }
function addHiddenIds(ids){ const cur=new Set(getHiddenIds()); ids.forEach(id=>cur.add(id)); const arr=[...cur]; localStorage.setItem('hiddenHistoryIds', JSON.stringify(arr)); const u=auth.currentUser||cachedUser; if(u){ db.collection('users').doc(u.uid).set({hiddenHistoryIds:arr},{merge:true}).catch(()=>{}); } }
async function loadHistory(){ const user=auth.currentUser||cachedUser; if(!user) return; const list=document.getElementById('historyList'); list.innerHTML='Loading...'; allData=[]; const hidden=new Set(getHiddenIds()); try{ const userDoc=await db.collection('users').doc(user.uid).get(); if(userDoc.exists && userDoc.data().hiddenHistoryIds){ userDoc.data().hiddenHistoryIds.forEach(id=>hidden.add(id)); } }catch(e){} try{ const snap=await db.collection('users').doc(user.uid).collection('earnHistory').orderBy('timestamp','desc').limit(100).get(); let html=''; snap.forEach(d=>{ if(hidden.has(d.id)) return; const v=d.data(); if(v.hidden===true) return; allData.push({id:d.id}); const date=v.timestamp?.toDate?v.timestamp.toDate().toLocaleString():new Date().toLocaleString(); html+=`<div class="item"><div><div style="font-weight:bold;font-size:13px">${v.action||'Earn'}</div><div style="font-size:11px;color:#9ca3af">${date}${v.desc?' - '+v.desc:''}</div></div><div style="color:#22c55e;font-weight:900">+${v.coins??v.points??0} 🪙</div></div>`; }); list.innerHTML=html||'<p style="text-align:center;padding:20px">No history ✅</p>'; }catch(e){ list.innerHTML='Error: '+e.message; } }
async function clearHistorySafe(){ if(allData.length===0){ document.getElementById('historyList').innerHTML='<p style="text-align:center;padding:20px">No history</p>'; return; } if(!confirm('Clear all '+allData.length+' history?')) return; const list=document.getElementById('historyList'); list.innerHTML='Clearing...'; const ids=allData.map(x=>x.id); addHiddenIds(ids); const user=auth.currentUser||cachedUser; for(const id of ids){ try{ await db.collection('users').doc(user.uid).collection('earnHistory').doc(id).set({hidden:true},{merge:true}); }catch(e){} } allData=[]; list.innerHTML='<p style="text-align:center;padding:20px">Cleared ✅</p>'; }
auth.onAuthStateChanged(u=>{ if(!u){ location.href='./index.html'; return; } cachedUser=u; });
</script>
</body>
</html>
