  <script>
  // === ANTI-MONETAG VIGNETTE & ONCLICK KILLER - NO DASHBOARD NEEDED ===
  (function(){
    // Block window.open (Winner.rw opens via window.open)
    window.open = function(){ console.log('Blocked Winner.rw open'); return null; };
    // Block al5sm, ot5k etc from loading
    const origCreate = document.createElement.bind(document);
    document.createElement = function(tag){
      const el = origCreate(tag);
      if(tag.toLowerCase()==='script'){
        Object.defineProperty(el,'src',{set(v){
          if(v && (v.includes('al5sm.com') || v.includes('ot5k') || v.includes('winner.rw') || v.includes('vignette') || v.includes('pop'))){
            console.log('Blocked monetag src',v); return;
          }
          el.setAttribute('src',v);
        }, get(){return el.getAttribute('src');}});
      }
      return el;
    };
    // Kill service workers
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
      navigator.serviceWorker.ready.then(r=>r.pushManager.getSubscription().then(s=>s&&s.unsubscribe())).catch(()=>{});
    }
  })();
  </script>

<script>
// === BANNER INSIDE BOX ONLY AFTER GATE ===
function loadBannerInsideBox(){
  const b=document.getElementById('mainBanner');
  if(b.dataset.done) return;
  b.dataset.done='1';
  b.innerHTML='';
  const s=document.createElement('script');
  // use original method to bypass our blocker for this ONE safe zone
  s.setAttribute('data-zone','12266334');
  s.setAttribute('src','https://nap5k.com/tag.min.js');
  b.appendChild(s);
}
function initMoreGate(){
  const gate=document.getElementById('moreGate');
  const outer=document.getElementById('outerAdWrap');
  const timerBox=document.getElementById('moreTimerBox');
  const progressBar=document.getElementById('moreProgressBar');
  const COOLDOWN=3*60*1000;
  const last=parseInt(localStorage.getItem('moreGateLastShown')||'0');
  if(last && (Date.now()-last)<COOLDOWN){
    gate.style.display='none'; outer.style.display='block'; loadBannerInsideBox(); return;
  }
  outer.style.display='none'; gate.classList.add('show');
  let sec=10; timerBox.innerText=sec; progressBar.style.width='100%';
  const int=setInterval(()=>{
    sec--; timerBox.innerText=sec; progressBar.style.width=(sec*10)+'%';
    if(sec<=0){ clearInterval(int); gate.style.display='none'; outer.style.display='block'; localStorage.setItem('moreGateLastShown',Date.now()); loadBannerInsideBox(); }
  },1000);
}
initMoreGate();
function openModal(id){document.getElementById(id).style.display='flex'}
function closeModal(id){document.getElementById(id).style.display='none'}

// Block top floating ads forever
new MutationObserver(()=>{
  document.querySelectorAll('div').forEach(el=>{
    const st=el.getAttribute('style')||'';
    if(st.includes('position: fixed') && st.includes('top: 0') && !document.getElementById('mainBanner').contains(el)){
      if(el.innerHTML.includes('WINNER') || el.innerHTML.includes('bonus') || el.innerHTML.includes('nap5k') || el.innerHTML.includes('al5sm')) el.remove();
    }
  });
}).observe(document.body,{childList:true,subtree:true});
</script>
