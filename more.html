<script>
// === BANNER INSIDE BOX ONLY - AFTER GATE ===
function loadBannerInsideBox(){
  const banner = document.getElementById('mainBanner');
  if(banner.dataset.done) return;
  banner.dataset.done='1';
  banner.innerHTML='';
  const s=document.createElement('script');
  s.dataset.zone='12266334';
  s.src='https://nap5k.com/tag.min.js';
  // IMPORTANT: append inside the box, not body
  banner.appendChild(s);
  
  // Force any floating push ads back into box (block top)
  const observer = new MutationObserver(()=>{
    document.querySelectorAll('div[style*="position: fixed"], div[style*="position:fixed"]').forEach(el=>{
      if(el.innerText && el.innerText.toLowerCase().includes('winner')){ el.remove(); return; }
      // if it's monetag push outside box, move inside
      if(!banner.contains(el) && el.innerHTML.length>20){
        if(el.getBoundingClientRect().top < 100){ // top floating
          // don't show top ads, keep only box
          if(el.textContent.includes('WINNER') || el.textContent.includes('bonus')){ el.style.display='none'; }
        }
      }
    });
  });
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(()=>observer.disconnect(),15000);
}

// === 3 MIN COOLDOWN GATE ===
function initMoreGate(){
  const gate=document.getElementById('moreGate');
  const outer=document.getElementById('outerAdWrap');
  const timerBox=document.getElementById('moreTimerBox');
  const progressBar=document.getElementById('moreProgressBar');
  const COOLDOWN=3*60*1000;
  const last=parseInt(localStorage.getItem('moreGateLastShown')||'0');
  
  if(last && (Date.now()-last)<COOLDOWN){
    gate.style.display='none';
    outer.style.display='block';
    loadBannerInsideBox();
    return;
  }
  
  outer.style.display='none';
  gate.classList.add('show');
  let sec=10; timerBox.innerText=sec; progressBar.style.width='100%';
  const int=setInterval(()=>{
    sec--; timerBox.innerText=sec; progressBar.style.width=(sec*10)+'%';
    if(sec<=0){
      clearInterval(int);
      gate.style.display='none';
      outer.style.display='block';
      localStorage.setItem('moreGateLastShown',String(Date.now()));
      loadBannerInsideBox();
    }
  },1000);
}
initMoreGate();

function openModal(id){document.getElementById(id).style.display='flex'}
function closeModal(id){document.getElementById(id).style.display='none'}
</script>
