<!DOCTYPE html>
<html>
<head>
  <title>More - Coins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#f5f3ff;min-height:100vh;color:#111827}
    .top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100}
    .back-btn-checkin{width:45px;height:30px;border-radius:10px;background:#fff;border:2px solid #fecaca;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#991b1b;font-weight:900;font-size:22px}
    .center-pill{background:#fff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%)}
    .container{max-width:500px;margin:0 auto;padding:16px 14px 90px 14px}
    .card{background:#fff;border:2px solid #ede9fe;border-radius:20px;padding:8px;box-shadow:0 8px 30px rgba(109,40,217,0.08);position:relative;overflow:hidden;min-height:280px}
    .menu-list a{display:flex;align-items:center;justify-content:space-between;width:100%;padding:19px 16px;color:#111827;text-decoration:none;font-size:15px;font-weight:800;border-radius:14px}
    .menu-list a:not(:last-child){border-bottom:1px solid #f5f3ff}
    .arrow{color:#a78bfa;font-size:20px}
    .ad-label{font-size:9px;color:#8b5cf6;text-align:center;letter-spacing:0.8px;font-weight:900;margin:18px 0 6px 0}
    .ad-box{min-height:90px;display:flex;justify-content:center;align-items:center;background:#fff;border:2px solid #ede9fe;border-radius:16px;padding:8px}
    #moreGate{position:absolute;inset:0;background:#fff;z-index:20;border-radius:20px;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;border:3px solid #fbbf24}
    #moreGate.show{display:flex}
    #moreTimerBox{width:88px;height:88px;border-radius:50%;background:linear-gradient(180deg,#fef3c7,#fbbf24);border:4px solid #f59e0b;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#92400e;margin:14px auto}
    #moreProgress{width:100%;height:8px;background:#fef3c7;border-radius:99px;margin-top:16px;overflow:hidden}
    #moreProgressBar{height:100%;width:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);transition:width 1s linear}
    .modal{display:none;position:fixed;z-index:9999;left:0;top:0;width:100%;height:100%;background:rgba(76,29,149,0.45);backdrop-filter:blur(2px);justify-content:center;align-items:center;padding:15px}
    .modal-box{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:20px;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(109,40,217,0.25);border:2px solid #ede9fe}
    .close{position:absolute;top:12px;right:15px;font-size:22px;font-weight:bold;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#f5f3ff;border-radius:50%;color:#6d28d9}
    .avatar-letter{width:78px;height:78px;background:linear-gradient(180deg,#ede9fe,#ddd6fe);border:3px solid #a78bfa;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#6d28d9;margin:8px auto}
  </style>
</head>
<body>

<div class="top-bar">
  <a href="home.html" class="back-btn-checkin">‹</a>
  <div class="center-pill">⚙️ More</div>
  <div style="width:45px"></div>
</div>

<div class="container">
  <div class="card" id="mainCard">
    <div id="moreGate">
      <div style="font-size:42px">🪙</div>
      <div style="font-weight:900;font-size:18px;color:#92400e;margin-top:8px">Loading More</div>
      <div id="moreTimerBox">10</div>
      <div style="font-size:11px;color:#d97706;font-weight:800">Please wait</div>
      <div id="moreProgress"><div id="moreProgressBar"></div></div>
    </div>

    <div class="menu-list">
      <a onclick="openModal('notifModal')"><div>🔔 Notifications</div><span class="arrow">›</span></a>
      <a onclick="openModal('profileModal')"><div>👤 Profile</div><span class="arrow">›</span></a>
      <a onclick="openModal('historyModal')"><div>📜 History</div><span class="arrow">›</span></a>
      <a onclick="openModal('settingsModal')"><div>⚙️ Settings</div><span class="arrow">›</span></a>
      <a href="help.html"><div>💬 Help/Support</div><span class="arrow">›</span></a>
    </div>
  </div>

  <div id="outerAdWrap" style="display:none">
    <div class="ad-label">ADVERTISEMENT</div>
    <div id="mainBanner" class="ad-box"></div>
  </div>
</div>

<!-- MODALS - kept simple -->
<div id="profileModal" class="modal" onclick="closeModal('profileModal')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('profileModal')">×</span><div style="text-align:center"><div id="avatarLetter" class="avatar-letter">I</div><h3 id="pUsername">--</h3></div><div id="pEmail" style="text-align:center;color:#6b7280;font-size:13px;margin-top:8px">...</div><div id="pBalCard" style="text-align:center;font-weight:900;color:#d97706;margin-top:10px">-- coins</div></div></div>
<div id="notifModal" class="modal" onclick="closeModal('notifModal')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('notifModal')">×</span><h3 style="text-align:center">🔔 Notifications</h3><div id="notifList" style="margin-top:12px">Loading...</div></div></div>
<div id="historyModal" class="modal" onclick="closeModal('historyModal')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('historyModal')">×</span><h3 style="text-align:center">📜 History</h3><div id="historyList" style="margin-top:12px">Loading...</div></div></div>
<div id="settingsModal" class="modal" onclick="closeModal('settingsModal')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('settingsModal')">×</span><h3 style="text-align:center">⚙️ Settings</h3><p style="text-align:center;margin-top:14px;color:#6b7280;font-size:13px">Language & Theme saved locally</p></div></div>

<script>
// === NEW SAFE BANNER 12266334 ===
function loadSafeBanner(){
  const el = document.getElementById('mainBanner');
  if(el.dataset.loaded) return;
  el.dataset.loaded = '1';
  const s = document.createElement('script');
  s.dataset.zone = '12266334';
  s.src = 'https://nap5k.com/tag.min.js';
  document.body.appendChild(s);
}

// === 3 MINUTE COOLDOWN GATE ===
function initGate(){
  const gate = document.getElementById('moreGate');
  const outer = document.getElementById('outerAdWrap');
  const timerBox = document.getElementById('moreTimerBox');
  const progressBar = document.getElementById('moreProgressBar');

  const COOLDOWN = 3 * 60 * 1000; // 3 minutes
  const last = parseInt(localStorage.getItem('moreGateLastShown')||'0');
  const now = Date.now();

  if(last && (now - last) < COOLDOWN){
    // Within 3 min -> skip gate
    gate.classList.remove('show');
    outer.style.display='block';
    loadSafeBanner();
    return;
  }

  // Show 10 sec gate
  outer.style.display='none';
  gate.classList.add('show');
  let sec = 10;
  timerBox.innerText = sec;
  progressBar.style.width='100%';
  const iv = setInterval(()=>{
    sec--;
    timerBox.innerText = sec;
    progressBar.style.width = (sec*10)+'%';
    if(sec<=0){
      clearInterval(iv);
      gate.classList.remove('show');
      outer.style.display='block';
      localStorage.setItem('moreGateLastShown', String(Date.now()));
      loadSafeBanner();
    }
  },1000);
}
initGate();

function openModal(id){ document.getElementById(id).style.display='flex'; if(id==='profileModal') loadProfile(); }
function closeModal(id){ document.getElementById(id).style.display='none'; }
</script>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
auth.onAuthStateChanged(u=>{ if(!u){ location.href='./index.html'; return; } });
async function loadProfile(){
  const u=auth.currentUser; if(!u) return;
  const snap=await db.collection('users').doc(u.uid).get();
  if(!snap.exists) return;
  const d=snap.data();
  document.getElementById('pUsername').innerText=d.username||u.email.split('@')[0];
  document.getElementById('avatarLetter').innerText=(d.username||'I').charAt(0).toUpperCase();
  document.getElementById('pEmail').innerText=d.email||u.email;
  document.getElementById('pBalCard').innerText=(d.balance||0)+' coins';
}
</script>
</body>
</html>
