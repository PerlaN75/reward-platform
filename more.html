<!DOCTYPE html>
<html>
<head>
  <title>More</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; padding: 20px 16px; color: white; }
   .header { text-align: center; margin-bottom: 25px; }
   .header h1 { font-size: 26px; color: #fbbf24; margin-bottom: 4px; font-weight: 900; }
   .header p { font-size: 13px; color: #ccc; }

   .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 25px; }
   .menu-card { background: #4a6128; border: 2px solid #fbbf24; border-radius: 18px; padding: 25px 12px; text-align: center; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #3d4f21; }
   .menu-card:active { transform: translateY(3px); box-shadow: 0 1px 0 #3d4f21; background: #3d4f21; }
   .menu-icon { font-size: 36px; margin-bottom: 10px; }
   .menu-title { font-size: 15px; font-weight: bold; color: #fbbf24; }
   .menu-desc { font-size: 11px; color: #ccc; margin-top: 5px; }

   .back-btn { width: 40%; padding: 14px; background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 0 #d97706; display: block; margin: 0 auto; }
   .back-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #d97706; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚙️ More</h1>
    <p>Manage your account</p>
  </div>

  <div class="menu-grid">
    <div class="menu-card" onclick="goTo('profile.html')">
      <div class="menu-icon">👤</div>
      <div class="menu-title">Profile</div>
      <div class="menu-desc">View your info</div>
    </div>

    <div class="menu-card" onclick="goTo('settings.html')">
      <div class="menu-icon">⚙️</div>
      <div class="menu-title">Settings</div>
      <div class="menu-desc">Password & Account</div>
    </div>

    <div class="menu-card" onclick="goTo('notifications.html')">
      <div class="menu-icon">🔔</div>
      <div class="menu-title">Notifications</div>
      <div class="menu-desc">Alerts & Updates</div>
    </div>

    <div class="menu-card" onclick="goTo('support.html')">
      <div class="menu-icon">💬</div>
      <div class="menu-title">Help/Support</div>
      <div class="menu-desc">FAQ & Contact</div>
    </div>
  </div>

  <button class="back-btn" onclick="goTo('home.html')">Back Home</button>

<script>
  function goTo(page) { window.location.href = page; }
</script>
</body>
</html>
