<!DOCTYPE html><html><head>
<title>Quiz Earn</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade" />
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<!-- SOCIAL BAR -->
<script data-cfasync="false" src="https://bicea.org/14/d77b1388ce099539f64c8509ea58804e"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f5f3ff;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;width:100%}
.back-square{width:45px;height:34px;background:#fff;border:2px solid #fecaca;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#991b1b;font-weight:900;font-size:22px;cursor:pointer}
.center-pill{background:#fff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%)}
.card{width:100%;max-width:380px;background:#fff;border:2px solid #ede9fe;border-radius:24px;padding:16px 14px;text-align:center;position:relative;overflow:hidden;min-height:600px;margin:14px 10px}
#entryGate{position:absolute;inset:0;background:linear-gradient(180deg,#fff,#f5f3ff);z-index:90;border-radius:24px;display:flex;flex-direction:column;align-items:center;padding:16px 14px;overflow-y:auto;border:2px solid #ede9fe}
#gateTimer{width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid #a78bfa;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#f59e0b;margin:8px auto}
.sponsored{font-size:8px;color:#8b5cf6;font-weight:900;text-align:center;margin:8px 0 3px;letter-spacing:.8px}
.ad-box{display:flex;justify-content:center;align-items:center;background:#fff;border:2px solid #ede9fe;border-radius:12px;width:100%;overflow:hidden}
.q-box{background:#ede9fe;border-radius:16px;padding:16px;text-align:left;margin:10px 0}
.opt{background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;font-weight:700}
.opt.selected{border-color:#6d28d9;background:#f5f3ff;color:#4c1d95}
.btn{width:100%;background:linear-gradient(90deg,#8b5cf6,#6d28d9);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:900;font-size:15px;cursor:pointer;margin-top:12px}.btn:disabled{background:#e5e7eb;color:#9ca3af}
.progress{height:6px;background:#ede9fe;border-radius:999px;overflow:hidden;margin:8px 0}.progress-bar{height:100%;background:#6d28d9;width:0%;transition:.3s}
</style></head><body>
<div class="top-bar"><div class="back-square" onclick="location.href='home.html'">‹</div><div class="center-pill">🧠 Quiz Earn</div><div style="width:45px"></div></div>

<div class="card">
<div id="entryGate">
<div style="font-size:28px">🧠</div><h3 style="margin:6px 0 2px;font-size:16px;color:#4c1d95">Loading quiz...</h3>
<div id="gateTimer">10</div><div style="font-size:11px;color:#8b5cf6;font-weight:700;margin-bottom:10px">Wait 10s - Sponsored</div>
<div style="width:100%"><div class="sponsored">ADVERTISEMENT</div>
<div id="container-23e1e60b5d9d8473949f8c3ca250759b" class="ad-box" style="min-height:120px"></div>
<script async="async" data-cfasync="false" src="https://bicea.org/21/23e1e60b5d9d8473949f8c3ca250759b"></script>
</div></div>

<div class="progress"><div class="progress-bar" id="pBar"></div></div>
<div id="qCount" style="font-size:12px;color:#8b5cf6;font-weight:700">Question 1/5</div>
<div id="questionArea" class="q-box"><div id="qText" style="font-weight:900;font-size:15px">Loading...</div><div id="opts"></div></div>
<button class="btn" id="nextBtn" disabled>Select answer</button>

<div id="topWrap" style="width:100%;margin-top:14px"><div class="sponsored">ADVERTISEMENT</div><div id="topBanner" class="ad-box" style="min-height:260px"></div></div>
<div id="botWrap" style="width:100%;margin-top:10px"><div class="sponsored">ADVERTISEMENT</div><div id="botBanner" class="ad-box" style="min-height:70px"></div></div>
</div>

<script>
function injectBanner(tId,key,w,h,wrapId){
 const c=document.getElementById(tId); if(!c) return; c.innerHTML='';
 const s1=document.createElement('script'); s1.innerHTML=`atOptions={'key':'${key}','format':'iframe','height':${h},'width':${w},'params':{}};`; c.appendChild(s1);
 const s2=document.createElement('script'); s2.src=`https://bicea.org/22/${key}`; c.appendChild(s2);
 setTimeout(()=>{ if(!c.querySelector('iframe')){ const wr=document.getElementById(wrapId); if(wr) wr.style.display='none'; } },4500);
}
function loadMainAds(){
 document.getElementById('entryGate')?.remove();
 injectBanner('topBanner','bf10cacdbe9f50d0c5d66a94e0785f29',300,250,'topWrap');
 setTimeout(()=>injectBanner('botBanner','fe25c5bd01f4bc5e60243e36cd83277c',468,60,'botWrap'),800);
}

const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try{firebase.appCheck().activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);}catch(e){}
const auth=firebase.auth(),db=firebase.firestore();

const QUESTIONS=[
 {q:"What is 2+2?",a:["3","4","5"],c:1},{q:"Capital of Rwanda?",a:["Kigali","Lagos","Nairobi"],c:0},{q:"Which color is sky?",a:["Blue","Red","Green"],c:0},{q:"100 coins = ?",a:["$0.05","$1","$10"],c:0},{q:"Best way to earn?",a:["Daily tasks","Spam","Hack"],c:0}
];
let idx=0,score=0,selected=null,currentUser=null;

let gateSec=10; const gT=document.getElementById('gateTimer');
const gI=setInterval(()=>{ gateSec--; if(gT) gT.innerText=gateSec; if(gateSec<=0){ clearInterval(gI); startQuiz(); } },1000);

function startQuiz(){
 loadMainAds();
 auth.onAuthStateChanged(u=>{ if(!u){location.href='./index.html';return;} currentUser=u; showQ(); });
}

function showQ(){
 const q=QUESTIONS[idx];
 document.getElementById('qCount').textContent=`Question ${idx+1}/${QUESTIONS.length}`;
 document.getElementById('qText').textContent=q.q;
 document.getElementById('pBar').style.width=`${(idx/QUESTIONS.length)*100}%`;
 const optsDiv=document.getElementById('opts'); optsDiv.innerHTML=''; selected=null;
 document.getElementById('nextBtn').disabled=true; document.getElementById('nextBtn').textContent='Select answer';
 q.a.forEach((txt,i)=>{
  const d=document.createElement('div'); d.className='opt'; d.textContent=txt;
  d.onclick=()=>{ document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected')); d.classList.add('selected'); selected=i; document.getElementById('nextBtn').disabled=false; document.getElementById('nextBtn').textContent=(idx==QUESTIONS.length-1?'Finish & Claim':'Next'); };
  optsDiv.appendChild(d);
 });
}

document.getElementById('nextBtn').onclick=async()=>{
 if(selected===null) return;
 if(selected===QUESTIONS[idx].c) score++;
 idx++;
 if(idx<QUESTIONS.length){ showQ(); }else{ finish(); }
};

async function finish(){
 document.getElementById('questionArea').innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:48px">🎉</div><div style="font-size:20px;font-weight:900;color:#4c1d95">Score ${score}/${QUESTIONS.length}</div><div style="font-size:14px;color:#6b7280;margin-top:6px">Adding ${score*2} coins...</div></div>`;
 document.getElementById('nextBtn').disabled=true; document.getElementById('nextBtn').textContent='Saving...';
 try{
  const ref=db.collection('users').doc(currentUser.uid);
  await ref.set({balance:firebase.firestore.FieldValue.increment(score*2),coins:firebase.firestore.FieldValue.increment(score*2),points:firebase.firestore.FieldValue.increment(score*2)},{merge:true});
  document.getElementById('pBar').style.width='100%';
  document.getElementById('nextBtn').disabled=false; document.getElementById('nextBtn').textContent='Go Home';
  document.getElementById('nextBtn').onclick=()=>location.href='./home.html';
 }catch(e){ alert(e.message); }
}
</script></body></html>
