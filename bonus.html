<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial;-webkit-tap-highlight-color:transparent}

h1{color:#111827;font-size:22px;font-weight:900;flex:1}

.ad-hint{font-size:10px;color:#9ca3af;margin-top:6px;font-style:italic}
.tip-box{background:#f0fdf4;border:1px solid #bbf7d0;border-left:4px solid #22c55e;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#166534;line-height:1.4;text-align:left}
.btn{width:100%;background:#f59e0b;color:#000;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:14px;box-shadow:0 4px 0 #d97706}

.btn:disabled{background:#9ca3af;color:#fff;cursor:not-allowed;box-shadow:none}
.sponsored{font-size:9px;color:#9ca3af;font-weight:bold;text-align:center;margin:10px 0 4px}
.ad-box{min-height:250px;display:flex;justify-content:center;align-items:center;background:#fafafa;border-radius:12px;border:1px dashed #e5e7eb}

<body>
<canvas id="confetti" style="position:fixed;inset:0;pointer-events:none;z-index:9999;display:none"></canvas>
<div class="card">
<div class="top-header"><div class="back-square" onclick="location.href='home.html'">‹</div><h1>🎁 Daily Bonus</h1></div>
<div class="sub">Claim once every 24h - 3000 Coins = $1.5</div>
<div class="sponsored">SPONSORED - TOP</div>
<div class="ad-box" id="adTop"></div>
<div class="tip-box">💡 <i>Claim daily bonus, but also check those offers - might be useful to You</i></div>
<div class="bonus-box">
<div class="big">🪙</div>
<div class="points">+3 Coins</div>
<div class="timer" id="timer">Checking...</div>
<div class="ad-hint" id="adHint">⏳ Checking...</div>
</div>
<button class="btn" id="claimBtn" disabled>Loading...</button>
<div class="info" id="info">Daily reward - 1000 Coins = $0.5</div>
<div class="sponsored">SPONSORED - BOTTOM</div>
<div class="ad-box" id="adBottom" style="margin-bottom:8px"></div>
<div id="container-23e1e60b5d9d8473949f8c3ca250759b"></div>
<script async data-cfasync="false" src="https://bicea.org/21/23e1e60b5d9d8473949f8c3ca250759b"></script>
<div style="font-size:9px;color:#9ca3af;margin-top:10px">Protected + Min withdraw 3000 Coins = $1.5</div>
</div>
<script>
function BLAST(){const c=document.getElementById('confetti');c.style.display='block';const ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let pieces=[];const colors=['#f59e0b','#22c55e','#ef4444','#fbbf24','#3b82f6'];for(let i=0;i<150;i++)pieces.push({x:c.width/2,y:c.height/3,vx:(Math.random()-0.5)*22,vy:(Math.random()-0.5)*22-8,r:Math.random()*9+4,color:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*360,vr:(Math.random()-0.5)*20});let f=0;(function anim(){ctx.clearRect(0,0,c.width,c.height);pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.35;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);ctx.restore();});if(++f<220)requestAnimationFrame(anim);else c.style.display='none';})();}
function loadAdsterra(containerId, key){
  var c=document.getElementById(containerId); if(!c) return;
  var s1=document.createElement('script'); s1.innerHTML="atOptions={'key':'"+key+"','format':'iframe','height':250,'width':300,'params':{}};"; c.appendChild(s1);
  var s2=document.createElement('script'); s2.src='https://bicea.org/22/'+key; c.appendChild(s2);
}
loadAdsterra('adTop','bf10cacdbe9f50d0c5d66a94e0785f29');
setTimeout(function(){loadAdsterra('adBottom','bf10cacdbe9f50d0c5d66a94e0785f29');},1500);
function canShowV(){var l=localStorage.getItem('v_last');return !l||Date.now()-parseInt(l)>30*60*1000}
function canShowP(){var l=localStorage.getItem('p_last');return !l||Date.now()-parseInt(l)>60*60*1000}
function loadV(){if(!canShowV())return; if(document.querySelector('script[data-zone="12083688"]'))return; var s=document.createElement('script');s.dataset.zone='12083688';s.src='https://n6wxm.com/vignette.min.js';document.body.appendChild(s);localStorage.setItem('v_last',Date.now())}
function loadP(){if(!canShowP())return; if(document.querySelector('script[data-zone="12083693"]'))return; var s=document.createElement('script');s.dataset.zone='12083693';s.src='https://al5sm.com/tag.min.js';document.body.appendChild(s);localStorage.setItem('p_last',Date.now())}
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try{firebase.appCheck().activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', true);}catch(e){}
const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null,bal=0,canClaim=false,waitTimer=null;
const claimBtn=document.getElementById('claimBtn');
const timerEl=document.getElementById('timer');
const adHintEl=document.getElementById('adHint');
const infoEl=document.getElementById('info');
function getCoins(d){ return d.coins ?? d.balance ?? d.points ?? 0; }
auth.onAuthStateChanged(async(u)=>{
if(!u){location.href='./index.html';return;}
currentUser=u;
try{
const snap=await db.collection('users').doc(u.uid).get();
if(snap.exists){
const d=snap.data();
bal=getCoins(d);
let lastTs = d.lastBonusTimestamp;
if(lastTs){
  let lastMs = lastTs.toMillis ? lastTs.toMillis() : lastTs;
  let diffHours = (Date.now() - lastMs) / (1000*60*60);
  if(diffHours < 24){
    let remain = Math.ceil(24 - diffHours);
    timerEl.textContent=`✅ Claimed. Wait ${remain}h`;
    adHintEl.style.display='none';
    claimBtn.textContent=`Come back in ${remain}h`;
    claimBtn.disabled=true;
    infoEl.textContent=`Next bonus in ${remain} hours`;
    return;
  }
}
}
}catch(e){console.log(e);}
startWait();
});
function startWait(){
let sec=10;
canClaim=false;
claimBtn.disabled=true;
claimBtn.textContent=`Wait ${sec}s...`;
timerEl.textContent=`Please wait ${sec} seconds`;
adHintEl.textContent='⏳ Verifying...';
adHintEl.style.display='block';
clearInterval(waitTimer);
waitTimer=setInterval(()=>{
sec--;
if(sec>0){
claimBtn.textContent=`Wait ${sec}s...`;
timerEl.textContent=`Please wait ${sec} seconds`;
if(sec==5) loadV();
}else{
clearInterval(waitTimer);
canClaim=true;
claimBtn.disabled=false;
claimBtn.textContent='🎉 Claim 3 Coins Free';
timerEl.textContent='Ready to claim!';
adHintEl.style.display='none';
}
},1000);
}
claimBtn.onclick=async()=>{
if(!canClaim||!currentUser) return;
loadP();
claimBtn.disabled=true;
claimBtn.textContent='Claiming...';
try{
const ref=db.collection('users').doc(currentUser.uid);
// MAIN CLAIM - USE INCREMENT - WILL NEVER FAIL
await ref.set({
balance: firebase.firestore.FieldValue.increment(3),
coins: firebase.firestore.FieldValue.increment(3),
points: firebase.firestore.FieldValue.increment(3),
lastBonusTimestamp: firebase.firestore.FieldValue.serverTimestamp(),
lastBonusDate: new Date().toDateString(),
lastEarnAt: firebase.firestore.FieldValue.serverTimestamp()
},{merge:true});

timerEl.textContent='✅ Claimed! +3 🪙 added';
claimBtn.textContent='✅ Claimed! Go Home';
claimBtn.onclick=function(){location.href='./home.html';};
claimBtn.disabled=false;
infoEl.textContent='Bonus added! Check home balance';
adHintEl.style.display='none';
BLAST();

// HISTORY - TRY BUT DON'T BLOCK IF FAILS
try{
await ref.collection('earnHistory').add({
action:'Daily Bonus',type:'bonus',coins:3,points:3,
desc:'Daily Bonus +3',timestamp:firebase.firestore.FieldValue.serverTimestamp()
});
}catch(e2){console.log("history skip",e2);}

}catch(e){
console.error(e);
alert("Error: "+e.message+" - Check Firestore Rules");
claimBtn.disabled=false;
claimBtn.textContent='🎉 Try Again - Claim 3 Coins';
}
};
</script>
