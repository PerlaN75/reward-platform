<!DOCTYPE html>
<html>
<head>
<title>Daily Bonus - Coins</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.google.com/recaptcha/enterprise.js?render=6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial;-webkit-tap-highlight-color:transparent}
*:focus{outline:none !important}
body{background:#f3f4f6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:#111827}
.card{width:100%;max-width:380px;background:#ffffff;border:2px solid #e5e7eb;border-radius:24px;padding:22px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.06)}
h1{color:#111827;font-size:26px;font-weight:900;margin-bottom:6px}
.sub{color:#6b7280;font-size:13px;margin-bottom:16px}
.bonus-box{background:#f9fafb;border:2px dashed #f59e0b;border-radius:16px;padding:18px;margin:14px 0}
.big{font-size:48px;margin-bottom:8px}
.points{font-size:24px;color:#d97706;font-weight:900}
.timer{font-size:13px;color:#6b7280;margin-top:10px;font-weight:600}
.ad-hint{font-size:10px;color:#9ca3af;margin-top:6px;font-style:italic}
.btn{width:100%;background:#f59e0b;color:#000;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:14px;box-shadow:0 4px 0 #d97706}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d97706}
.btn:disabled{background:#9ca3af;color:#fff;cursor:not-allowed;box-shadow:none}
.back{width:42%;height:44px;margin:16px auto 0;background:#fff;color:#111827;border:1.5px solid #e5e7eb;border-radius:999px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 #e5e7eb}
.back:active{transform:scale(0.98)}
.info{font-size:12px;color:#6b7280;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h1>🎁 Daily Bonus</h1>
<div class="sub">Claim once every 24h - 3000 Coins = $1.5</div>
<div class="bonus-box">
<div class="big">🪙</div>
<div class="points">+3 Coins</div>
<div class="timer" id="timer">Checking...</div>
<div class="ad-hint" id="adHint">⏳ Checking...</div>
</div>

<button class="btn" id="claimBtn" disabled>Loading...</button>
<div class="info" id="info">Daily reward - 1000 Coins = $0.5</div>
<button class="back" onclick="location.href='./home.html'">Back Home</button>
<div style="font-size:9px;color:#9ca3af;margin-top:10px">Protected + Min withdraw 3000 Coins = $1.5</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try {
  const appCheck = firebase.appCheck();
  appCheck.activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', true);
} catch(e) {}
const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null,bal=0,canClaim=false,waitTimer=null;
const claimBtn=document.getElementById('claimBtn');
const timerEl=document.getElementById('timer');
const adHintEl=document.getElementById('adHint');
const infoEl=document.getElementById('info');
function getCoins(d){ return d.coins ?? d.balance ?? d.points ?? 0; }
auth.onAuthStateChanged(async(u)=>{
if(!u){location.href='./index.html';return;}
currentUser=u;
try{
const snap=await db.collection('users').doc(u.uid).get();
if(snap.exists){
const d=snap.data();
bal=getCoins(d);
let lastTs = d.lastBonusTimestamp;
if(lastTs){
  let lastMs = lastTs.toMillis ? lastTs.toMillis() : lastTs;
  let diffHours = (Date.now() - lastMs) / (1000*60*60);
  if(diffHours < 24){
    let remain = Math.ceil(24 - diffHours);
    timerEl.textContent=`✅ Claimed. Wait ${remain}h`;
    adHintEl.style.display='none';
    claimBtn.textContent=`Come back in ${remain}h`;
    claimBtn.disabled=true;
    infoEl.textContent=`Next bonus in ${remain} hours - 3000 Coins = $1.5`;
    return;
  }
}
}
}catch(e){}
startWait();
});
function startWait(){
let sec=10;
canClaim=false;
claimBtn.disabled=true;
claimBtn.textContent=`Wait ${sec}s...`;
timerEl.textContent=`Please wait ${sec} seconds`;
adHintEl.textContent='⏳ Verifying, please wait...';
adHintEl.style.display='block';
clearInterval(waitTimer);
waitTimer=setInterval(()=>{
sec--;
if(sec>0){
claimBtn.textContent=`Wait ${sec}s...`;
timerEl.textContent=`Please wait ${sec} seconds`;
if(sec<=5) adHintEl.textContent='✅ Verified - almost ready...';
}else{
clearInterval(waitTimer);
canClaim=true;
claimBtn.disabled=false;
claimBtn.textContent='🎉 Claim 3 Coins Free';
timerEl.textContent='Ready to claim!';
adHintEl.style.display='none';
}
},1000);
}
claimBtn.onclick=async()=>{
if(!canClaim||!currentUser) return;
claimBtn.disabled=true;
claimBtn.textContent='Claiming...';
bal+=3;
try{
await db.collection('users').doc(currentUser.uid).set({
balance:bal, coins:bal, points:bal,
lastEarnAt: firebase.firestore.FieldValue.serverTimestamp(),
lastBonusTimestamp: firebase.firestore.FieldValue.serverTimestamp(),
lastBonusDate: new Date().toDateString()
},{merge:true});
await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({
action:'Daily Bonus',type:'bonus',coins:3, points:3,
desc:'Daily Bonus Claimed +3 coins',timestamp:firebase.firestore.FieldValue.serverTimestamp()
});
timerEl.textContent='✅ Claimed! +3 🪙 added';
claimBtn.textContent='✅ Claimed! Go Home';
claimBtn.onclick=function(){location.href='./home.html';};
claimBtn.disabled=false;
infoEl.textContent='Thanks! Bonus added to your balance';
adHintEl.style.display='none';
}catch(e){
claimBtn.disabled=false;
claimBtn.textContent='🎉 Claim 3 Coins Free';
}
};
</script>
</body>
</html>
