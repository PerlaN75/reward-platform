<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f5f3ff;min-height:100vh;display:flex;flex-direction:column;align-items:center}

<div class="top-bar"><div class="back-square" onclick="location.href='home.html'">‹</div><div class="center-pill">🎁 Daily Bonus</div><div style="width:45px"></div></div>

</div>
<script>
function injectBanner(targetId,key,w,h,wrapId){
 const c=document.getElementById(targetId); if(!c) return; c.innerHTML='';
 const s1=document.createElement('script'); s1.innerHTML=`atOptions={'key':'${key}','format':'iframe','height':${h},'width':${w},'params':{}};`; c.appendChild(s1);
 const s2=document.createElement('script'); s2.src=`https://bicea.org/22/${key}`; c.appendChild(s2);
 setTimeout(()=>{ if(!c.querySelector('iframe')){ const wr=document.getElementById(wrapId); if(wr) wr.style.display='none'; } },4500);
}
function loadMainAds(){
 document.getElementById('entryGate')?.remove();
 injectBanner('topBanner','bf10cacdbe9f50d0c5d66a94e0785f29',300,250,'topWrap');
 setTimeout(()=>injectBanner('botBanner','fe25c5bd01f4bc5e60243e36cd83277c',468,60,'botWrap'),800);
}
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try{firebase.appCheck().activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);}catch(e){}
const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null,canClaim=false,hasClaimed=false;
const claimBtn=document.getElementById('claimBtn'),timerEl=document.getElementById('timer'),infoEl=document.getElementById('info');
let gateSec=10; const gT=document.getElementById('gateTimer');
const gI=setInterval(()=>{gateSec--; if(gT) gT.innerText=gateSec; if(gateSec<=0){clearInterval(gI); init();}},1000);
function init(){
 loadMainAds();
 auth.onAuthStateChanged(async(u)=>{ if(!u){location.href='./index.html';return;} currentUser=u;
  try{ const snap=await db.collection('users').doc(u.uid).get(); if(snap.exists&&snap.data().lastBonusTimestamp){ let last=snap.data().lastBonusTimestamp; let ms=last.toMillis?last.toMillis():last; let diff=(Date.now()-ms)/3600000; if(diff<24){ hasClaimed=true; let r=Math.ceil(24-diff); timerEl.textContent=`✅ Claimed. Wait ${r}h`; claimBtn.textContent=`Come back in ${r}h`; claimBtn.disabled=true; return; } } }catch(e){} startWait();
 });
}
function startWait(){ if(hasClaimed) return; let s=5; canClaim=false; claimBtn.disabled=true; claimBtn.textContent=`Wait ${s}s...`; timerEl.textContent=`Please wait ${s} seconds`; let i=setInterval(()=>{ s--; if(s>0){claimBtn.textContent=`Wait ${s}s...`; timerEl.textContent=`Please wait ${s} seconds`;}else{clearInterval(i);canClaim=true;claimBtn.disabled=false;claimBtn.textContent='Claim 3 Coins Free';timerEl.textContent='Ready to claim!';}},1000); }
claimBtn.onclick=async()=>{ if(hasClaimed||!canClaim||!currentUser) return; canClaim=false; hasClaimed=true; claimBtn.disabled=true; claimBtn.textContent='Claiming...';
 try{ const ref=db.collection('users').doc(currentUser.uid); const snap=await ref.get(); if(snap.exists&&snap.data().lastBonusTimestamp){ let last=snap.data().lastBonusTimestamp; let ms=last.toMillis?last.toMillis():last; if((Date.now()-ms)/3600000<24){ timerEl.textContent='Already claimed'; return; } }
  await ref.set({balance:firebase.firestore.FieldValue.increment(3),coins:firebase.firestore.FieldValue.increment(3),points:firebase.firestore.FieldValue.increment(3),lastBonusTimestamp:firebase.firestore.FieldValue.serverTimestamp(),lastBonusDate:new Date().toDateString()},{merge:true});
  timerEl.textContent='✅ Claimed! +3 added'; claimBtn.textContent='Go Home'; claimBtn.onclick=()=>location.href='./home.html'; claimBtn.disabled=false; infoEl.textContent='Bonus added! Come back in 24h';
 }catch(e){ hasClaimed=false; canClaim=true; alert(e.message); claimBtn.disabled=false; claimBtn.textContent='Try Again'; }
};
