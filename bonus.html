<!DOCTYPE html>
<html>
<head>
<title>Daily Bonus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade" />
<script src="https://www.google.com/recaptcha/enterprise.js?render=6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial;-webkit-tap-highlight-color:transparent} *:focus{outline:none !important}
body{background:#f5f3ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#111827}
.top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;width:100%;box-shadow:0 4px 12px rgba(109,40,217,0.3)}
.back-square{width:45px;height:30px;background:#ffffff;border:2px solid #fecaca;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#991b1b;font-weight:900;font-size:22px;cursor:pointer;box-shadow:0 2px 0 #fca5a5}
.center-pill{background:#ffffff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.card{width:100%;max-width:380px;background:#fff;border:2px solid #ede9fe;border-radius:24px;padding:16px 14px;text-align:center;position:relative;overflow:hidden;min-height:680px;margin:14px 10px 90px;box-shadow:0 8px 30px rgba(109,40,217,0.08)}
#entryGate{position:absolute;inset:0;background:linear-gradient(180deg,#ffffff,#f5f3ff);z-index:90;border-radius:24px;display:flex;flex-direction:column;align-items:center;padding:20px 14px;text-align:center;overflow-y:auto;border:2px solid #ede9fe}
#gateTimer{width:64px;height:64px;border-radius:50%;background:linear-gradient(180deg,#ffffff,#ede9fe);border:3px solid #a78bfa;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#f59e0b;margin:8px auto;box-shadow:0 3px 10px rgba(109,40,217,0.12)}
.sponsored{font-size:8px;color:#8b5cf6;font-weight:900;text-align:center;margin:8px 0 3px;letter-spacing:0.8px;text-transform:uppercase}
.ad-box{min-height:270px;display:flex;justify-content:center;align-items:center;background:#fff;border:2px solid #ede9fe;border-radius:12px;width:100%;overflow:hidden}
.bonus-box{background:#fffbeb;border:2px dashed #f59e0b;border-radius:16px;padding:18px;margin:10px 0}
.btn{width:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:none;border-radius:12px;padding:14px;font-weight:900;font-size:15px;cursor:pointer;margin-top:14px;box-shadow:0 4px 0 #d97706}
.btn:disabled{background:#e5e7eb;color:#9ca3af;box-shadow:none}
</style>
</head>
<body>
<div class="top-bar">
  <div class="back-square" onclick="location.href='home.html'">‹</div>
  <div class="center-pill">🎁 Daily Bonus</div>
  <div style="width:45px"></div>
</div>

<div class="card">
<div id="entryGate">
  <div style="font-size:28px">🎁</div><h3 style="margin:6px 0 2px;font-size:16px;font-weight:900;color:#4c1d95">Loading daily bonus...</h3>
  <div id="gateTimer">10</div>
  <div style="font-size:11px;color:#8b5cf6;font-weight:700;margin-bottom:12px">Please wait 10s - ads loading</div>
  <div style="width:100%">
    <div class="sponsored">ADVERTISEMENT</div>
    <div id="gateTopBanner" class="ad-box" style="min-height:280px"></div>
    <div style="height:12px"></div>
    <div class="sponsored">ADVERTISEMENT</div>
    <div id="gateSecondBanner" class="ad-box" style="min-height:70px"></div>
  </div>
</div>

<div style="font-size:12px;color:#8b5cf6;margin-bottom:10px;font-weight:700">Claim once every 24h - 3000 Coins = $1.5</div>
<div class="bonus-box"><div style="font-size:48px">🪙</div><div style="font-size:24px;color:#d97706;font-weight:900">+3 Coins</div><div id="timer" style="font-size:13px;color:#6b7280;margin-top:10px;font-weight:600">Checking...</div></div>
<button class="btn" id="claimBtn" disabled>Loading...</button>
<div id="info" style="font-size:12px;color:#6b7280;margin-top:12px">Daily reward</div>
<div style="width:100%;margin-top:14px"><div class="sponsored">ADVERTISEMENT</div><div id="topBanner" class="ad-box"></div></div>
<div style="width:100%;margin-top:10px"><div class="sponsored">ADVERTISEMENT</div><div id="adBottom" class="ad-box" style="min-height:70px"></div></div>
</div>

<script>
// ADSTERRA ONLY - 10 SEC GATE - NO BLANK - NO MONETAG
function injectBanner(id,key,w,h){
  const c=document.getElementById(id); if(!c) return;
  c.innerHTML='';
  const s1=document.createElement('script');
  s1.innerHTML=`atOptions={'key':'${key}','format':'iframe','height':${h},'width':${w},'params':{}};`;
  c.appendChild(s1);
  const s2=document.createElement('script');
  s2.src=`https://www.highperformanceformat.com/${key}/invoke.js`;
  s2.async=true;
  c.appendChild(s2);
}

function loadGateAds(){
  // Both load at 0 sec - 10 sec gate gives full time to render, no blank
  injectBanner('gateTopBanner','bf10cacdbe9f50d0c5d66a94e0785f29',300,250);
  injectBanner('gateSecondBanner','fe25c5bd01f4bc5e60243e36cd83277c',320,50);
}

function loadMainAds(){
  const gate=document.getElementById('entryGate');
  if(gate) gate.remove();
  injectBanner('topBanner','bf10cacdbe9f50d0c5d66a94e0785f29',300,250);
  setTimeout(()=>{
    injectBanner('adBottom','fe25c5bd01f4bc5e60243e36cd83277c',320,50);
  },400);
}

const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try{firebase.appCheck().activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', true);}catch(e){}
const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null,canClaim=false,hasClaimedToday=false;
const claimBtn=document.getElementById('claimBtn'); const timerEl=document.getElementById('timer'); const infoEl=document.getElementById('info');
let gateSec=10; const gateTimerEl=document.getElementById('gateTimer'); const gateEl=document.getElementById('entryGate');
loadGateAds();
const gateInt=setInterval(()=>{ gateSec--; if(gateTimerEl) gateTimerEl.innerText=gateSec; if(gateSec<=0){ clearInterval(gateInt); if(gateEl) gateEl.style.display='none'; initAfterGate(); } },1000);
function initAfterGate(){
  loadMainAds();
  auth.onAuthStateChanged(async(u)=>{
    if(!u){location.href='./index.html';return;} currentUser=u;
    try{
      const snap=await db.collection('users').doc(u.uid).get();
      if(snap.exists && snap.data().lastBonusTimestamp){
        let last=snap.data().lastBonusTimestamp; let lastMs=last.toMillis?last.toMillis():last;
        let diff=(Date.now()-lastMs)/(1000*60*60);
        if(diff<24){ hasClaimedToday=true; let remain=Math.ceil(24-diff); timerEl.textContent=`✅ Claimed. Wait ${remain}h`; claimBtn.textContent=`Come back in ${remain}h`; claimBtn.disabled=true; infoEl.textContent=`Next bonus in ${remain} hours`; return; }
      }
    }catch(e){}
    startWait();
  });
}
function startWait(){
 if(hasClaimedToday) return;
 let sec=5; canClaim=false; claimBtn.disabled=true; claimBtn.textContent=`Wait ${sec}s...`; timerEl.textContent=`Please wait ${sec} seconds`; 
 let int=setInterval(()=>{ sec--; if(sec>0){ claimBtn.textContent=`Wait ${sec}s...`; timerEl.textContent=`Please wait ${sec} seconds`; }else{ clearInterval(int); canClaim=true; claimBtn.disabled=false; claimBtn.textContent='Claim 3 Coins Free'; timerEl.textContent='Ready to claim!'; } },1000);
}
claimBtn.onclick=async()=>{
 if(hasClaimedToday || !canClaim || !currentUser) return;
 canClaim=false; hasClaimedToday=true; claimBtn.disabled=true; claimBtn.textContent='Claiming...';
 try{
  const ref=db.collection('users').doc(currentUser.uid);
  const snap=await ref.get();
  if(snap.exists && snap.data().lastBonusTimestamp){ let last=snap.data().lastBonusTimestamp; let lastMs=last.toMillis?last.toMillis():last; if((Date.now()-lastMs)/(1000*60*60) < 24){ timerEl.textContent='Already claimed today'; claimBtn.textContent='Come back tomorrow'; return; } }
  await ref.set({balance:firebase.firestore.FieldValue.increment(3),coins:firebase.firestore.FieldValue.increment(3),points:firebase.firestore.FieldValue.increment(3),lastBonusTimestamp:firebase.firestore.FieldValue.serverTimestamp(),lastBonusDate:new Date().toDateString()},{merge:true});
  timerEl.textContent='✅ Claimed! +3 added'; claimBtn.textContent='Go Home'; claimBtn.onclick=()=>location.href='./home.html'; claimBtn.disabled=false; infoEl.textContent='Bonus added! Come back in 24h';
 }catch(e){ hasClaimedToday=false; canClaim=true; alert("Error: "+e.message); claimBtn.disabled=false; claimBtn.textContent='Try Again'; }
};
</script>
</body>
</html>
