<!DOCTYPE html><html><head>
<title>Daily Bonus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade" />
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f5f3ff;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;width:100%}
.back-square{width:45px;height:30px;background:#fff;border:2px solid #fecaca;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#991b1b;font-weight:900;font-size:22px;cursor:pointer}
.center-pill{background:#fff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%)}
.card{width:100%;max-width:380px;background:#fff;border:2px solid #ede9fe;border-radius:24px;padding:16px 14px;text-align:center;position:relative;overflow:hidden;min-height:460px;margin:14px 10px}
#entryGate{position:absolute;inset:0;background:#fff;z-index:90;border-radius:24px;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;border:3px solid #fbbf24}
#entryGate.show{display:flex}
#gateTimer{width:88px;height:88px;border-radius:50%;background:linear-gradient(180deg,#fef3c7,#fbbf24);border:4px solid #f59e0b;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#92400e;margin:14px auto}
#gateProgress{width:100%;height:8px;background:#fef3c7;border-radius:99px;margin-top:16px;overflow:hidden}
#gateProgressBar{height:100%;width:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);transition:width 1s linear}
.bonus-box{background:#fffbeb;border:2px dashed #f59e0b;border-radius:16px;padding:18px;margin:10px 0}
.btn{width:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:none;border-radius:12px;padding:14px;font-weight:900;font-size:15px;cursor:pointer;margin-top:14px;box-shadow:0 4px 0 #d97706}.btn:disabled{background:#e5e7eb;color:#9ca3af;box-shadow:none}
</style></head><body>
<div class="top-bar"><div class="back-square" onclick="location.href='home.html'">‹</div><div class="center-pill">🎁 Daily Bonus</div><div style="width:45px"></div></div>

<div class="card">
  <div id="entryGate">
    <div style="font-size:42px">🎁</div>
    <div style="font-weight:900;font-size:18px;color:#92400e;margin-top:8px">Loading daily bonus...</div>
    <div id="gateTimer">10</div>
    <div style="font-size:11px;color:#d97706;font-weight:800">Verifying...</div>
    <div id="gateProgress"><div id="gateProgressBar"></div></div>
  </div>

  <div style="font-size:12px;color:#8b5cf6;margin-bottom:10px;font-weight:700">Claim once every 24h - 3000 Coins = $1.5</div>
  <div class="bonus-box"><div style="font-size:48px">🪙</div><div style="font-size:24px;color:#d97706;font-weight:900">+3 Coins</div><div id="timer" style="font-size:13px;color:#6b7280;margin-top:10px;font-weight:600">Checking...</div></div>
  <button class="btn" id="claimBtn" disabled>Loading...</button>
  <div id="info" style="font-size:12px;color:#6b7280;margin-top:12px">Daily reward</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try{firebase.appCheck().activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);}catch(e){}
const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null,canClaim=false,hasClaimed=false;
const claimBtn=document.getElementById('claimBtn'),timerEl=document.getElementById('timer'),infoEl=document.getElementById('info');

const BONUS_ZONE='12272570';

function initAuth(){
 auth.onAuthStateChanged(async(u)=>{
  if(!u){location.href='./index.html';return;}
  currentUser=u;
  try{
   const snap=await db.collection('users').doc(u.uid).get();
   if(snap.exists&&snap.data().lastBonusTimestamp){
    let last=snap.data().lastBonusTimestamp; let ms=last.toMillis?last.toMillis():last;
    let diff=(Date.now()-ms)/3600000;
    if(diff<24){
     hasClaimed=true; let r=Math.ceil(24-diff);
     timerEl.textContent=`✅ Claimed. Wait ${r}h`; claimBtn.textContent=`Come back in ${r}h`; claimBtn.disabled=true; return;
    }
   }
  }catch(e){}
  startWait();
 });
}
function startWait(){
 if(hasClaimed) return;
 let s=3; canClaim=false; claimBtn.disabled=true;
 claimBtn.textContent=`Wait ${s}s...`; timerEl.textContent=`Please wait ${s} seconds`;
 let i=setInterval(()=>{
  s--; if(s>0){claimBtn.textContent=`Wait ${s}s...`; timerEl.textContent=`Please wait ${s} seconds`;}
  else{clearInterval(i);canClaim=true;claimBtn.disabled=false;claimBtn.textContent='Claim 3 Coins Free';timerEl.textContent='Ready to claim!';}
 },1000);
}
claimBtn.onclick=async()=>{
 if(hasClaimed||!canClaim||!currentUser) return;
 canClaim=false; hasClaimed=true; claimBtn.disabled=true; claimBtn.textContent='Claiming...';
 try{
  const ref=db.collection('users').doc(currentUser.uid);
  const snap=await ref.get();
  if(snap.exists&&snap.data().lastBonusTimestamp){
   let last=snap.data().lastBonusTimestamp; let ms=last.toMillis?last.toMillis():last;
   if((Date.now()-ms)/3600000<24){ timerEl.textContent='Already claimed'; return; }
  }
  await ref.set({balance:firebase.firestore.FieldValue.increment(3),coins:firebase.firestore.FieldValue.increment(3),points:firebase.firestore.FieldValue.increment(3),lastBonusTimestamp:firebase.firestore.FieldValue.serverTimestamp(),lastBonusDate:new Date().toDateString()},{merge:true});
  timerEl.textContent='✅ Claimed! +3 added'; claimBtn.textContent='Go Home'; claimBtn.onclick=()=>location.href='./home.html'; claimBtn.disabled=false; infoEl.textContent='Bonus added! Come back in 24h';
 }catch(e){ hasClaimed=false; canClaim=true; alert(e.message); claimBtn.disabled=false; claimBtn.textContent='Try Again'; }
};

function initBonusGate(){
  const gate=document.getElementById('entryGate');
  const timerBox=document.getElementById('gateTimer');
  const progressBar=document.getElementById('gateProgressBar');
  const COOLDOWN=3*60*1000;
  const last=parseInt(localStorage.getItem('bonusGateLastShown')||'0');
  
  function proceed(){
    gate.style.display='none';
    initAuth();
  }

  if(last && (Date.now()-last)<COOLDOWN){
    proceed();
    return;
  }
  
  gate.classList.add('show');
  gate.style.display='flex';
  let sec=10; timerBox.innerText=sec; progressBar.style.width='100%';
  const int=setInterval(()=>{
    sec--; timerBox.innerText=sec; progressBar.style.width=(sec*10)+'%';
    if(sec<=0){
      clearInterval(int);
      localStorage.setItem('bonusGateLastShown', String(Date.now()));
      // FIRE VIGNETTE 12272570
      (function(s){s.dataset.zone=BONUS_ZONE,s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
      setTimeout(proceed, 600);
    }
  },1000);
}

initBonusGate();
</script></body></html>
