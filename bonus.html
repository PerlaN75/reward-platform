<body>
<div class="card">

<script>
const DIRECT_LINK="https://asiafilm.org/4/fea14e9f802d182828ceef74e57a3a5b";
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try {
  const appCheck = firebase.appCheck();
  appCheck.activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', true);
} catch(e) {}
const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null,bal=0,canClaim=false,waitTimer=null;
const claimBtn=document.getElementById('claimBtn');
const timerEl=document.getElementById('timer');
const adHintEl=document.getElementById('adHint');
const infoEl=document.getElementById('info');
auth.onAuthStateChanged(async(u)=>{
if(!u){location.href='./index.html';return;}
currentUser=u;
try{
const snap=await db.collection('users').doc(u.uid).get();
if(snap.exists){
const d=snap.data();
bal=d.balance||d.points||0;
let lastTs = d.lastBonusTimestamp;
if(lastTs){
  let lastMs = lastTs.toMillis ? lastTs.toMillis() : lastTs;
  let diffHours = (Date.now() - lastMs) / (1000*60*60);
  if(diffHours < 24){
    let remain = Math.ceil(24 - diffHours);
    timerEl.textContent=`✅ Already claimed. Wait ${remain}h`;
    adHintEl.style.display='none';
    claimBtn.textContent=`Come back in ${remain}h`;
    claimBtn.disabled=true;
    infoEl.textContent=`Next bonus in ${remain} hours`;
    return;
  }
}
}
}catch(e){}
startWait();
});
function startWait(){
let sec=10;
canClaim=false;
claimBtn.disabled=true;
claimBtn.textContent=`Wait ${sec}s...`;
timerEl.textContent=`Please wait ${sec} seconds`;
adHintEl.textContent='⏳ Ad loading, please wait...';
adHintEl.style.display='block';
clearInterval(waitTimer);
waitTimer=setInterval(()=>{
sec--;
if(sec>0){
claimBtn.textContent=`Wait ${sec}s...`;
timerEl.textContent=`Please wait ${sec} seconds`;
if(sec<=5) adHintEl.textContent='✅ Ad loaded - almost ready...';
}else{
clearInterval(waitTimer);
canClaim=true;
claimBtn.disabled=false;
claimBtn.textContent='🎉 Claim 10 pts Free';
timerEl.textContent='Ready to claim!';
adHintEl.style.display='none';
}
},1000);
}
claimBtn.onclick=async()=>{
if(!canClaim||!currentUser) return;
claimBtn.disabled=true;
claimBtn.textContent='Claiming...';
bal+=10;
try{
await db.collection('users').doc(currentUser.uid).set({
balance:bal,points:bal,
lastEarnAt: firebase.firestore.FieldValue.serverTimestamp(),
lastBonusTimestamp: firebase.firestore.FieldValue.serverTimestamp(),
lastBonusDate: new Date().toDateString()
},{merge:true});
await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({
action:'Daily Bonus',type:'bonus',points:10,
desc:'Daily Bonus Claimed +10 pts',timestamp:firebase.firestore.FieldValue.serverTimestamp()
});
timerEl.textContent='✅ Claimed! +10 pts added';
claimBtn.style.display='none';
infoEl.textContent='Thanks! You can support us below (optional)';
document.getElementById('supportBox').style.display='block';
adHintEl.style.display='none';
}catch(e){
claimBtn.disabled=false;
claimBtn.textContent='🎉 Claim 10 pts Free';
}
};
function openSupport(){
window.open(DIRECT_LINK,'_blank');
document.getElementById('supportBox').innerHTML='<p style="color:#111827;font-size:13px;font-weight:bold">Thanks for supporting! ❤️</p><button class="back" style="width:80%;margin-top:10px" onclick="goHome()">Go Home</button>';
}
function goHome(){location.href='./home.html';}
</script>
