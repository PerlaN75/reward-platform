<!DOCTYPE html>
<html>
<head>
<title>Daily Bonus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="monetag" content="b671b8351bfc48ed0161f6bd0b6a5340">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#0f1508;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:#fff}
.card{width:100%;max-width:380px;background:#1d331d;border:3px solid #fbbf24;border-radius:24px;padding:22px;text-align:center}
h1{color:#facc15;font-size:28px;margin-bottom:10px}
.sub{color:#ccc;font-size:14px;margin-bottom:16px}
.bonus-box{background:#0a120a;border:2px dashed #fbbf24;border-radius:16px;padding:18px;margin:14px 0}
.big{font-size:48px;margin-bottom:8px}
.points{font-size:26px;color:#fbbf24;font-weight:800}
.timer{font-size:15px;color:#aaa;margin-top:10px}
.btn{width:100%;background:#fbbf24;color:#000;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:14px}
.btn:disabled{background:#5a4a1a;color:#aaa;cursor:not-allowed}
.back{width:40%;height:44px;margin:16px auto 0;background:#f59e0b;border:0;border-radius:999px;font-weight:700}
.info{font-size:12px;color:#aaa;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h1>🎁 Daily Bonus</h1>
<div class="sub">Claim once every 24h & support us</div>
<div class="bonus-box">
<div class="big">💰</div>
<div class="points">+20 Points</div>
<div class="timer" id="timer">Checking...</div>
</div>
<button class="btn" id="claimBtn" disabled>Loading...</button>
<div class="info" id="info">Watch a short sponsored ad to claim</div>
<button class="back" onclick="location.href='./home.html'">Back</button>
</div>
<script>
const DIRECT_LINK="https://omg10.com/4/11905870";
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null,bal=0,canClaim=false,waitTimer=null;

const claimBtn=document.getElementById('claimBtn');
const timerEl=document.getElementById('timer');
const infoEl=document.getElementById('info');

function todayStr(){return new Date().toDateString();}

auth.onAuthStateChanged(async(u)=>{
if(!u){location.href='./index.html';return;}
currentUser=u;
const snap=await db.collection('users').doc(u.uid).get();
if(snap.exists){
const d=snap.data();
bal=d.balance||d.points||0;
const last=d.lastBonusDate||'';
if(last===todayStr()){
timerEl.textContent='✅ Already claimed today';
claimBtn.textContent='Come back tomorrow';
claimBtn.disabled=true;
infoEl.textContent='Next bonus in 24 hours';
return;
}
}
startWait();
});

function startWait(){
let sec=5;
canClaim=false;
claimBtn.disabled=true;
claimBtn.textContent=`Wait ${sec}s...`;
timerEl.textContent=`Please wait ${sec} seconds`;
waitTimer=setInterval(()=>{
sec--;
if(sec>0){
claimBtn.textContent=`Wait ${sec}s...`;
timerEl.textContent=`Please wait ${sec} seconds`;
}else{
clearInterval(waitTimer);
canClaim=true;
claimBtn.disabled=false;
claimBtn.textContent='🎉 Claim 20 pts + Support Us';
timerEl.textContent='Ready to claim!';
}
},1000);
}

claimBtn.onclick=async()=>{
if(!canClaim||!currentUser) return;
claimBtn.disabled=true;
claimBtn.textContent='Claiming...';

// 1. Open ad - YOU EARN HERE
window.open(DIRECT_LINK,'_blank');

// 2. Give points - USER EARNS
bal+=20;
try{
await db.collection('users').doc(currentUser.uid).set({
balance:bal,points:bal,lastBonusDate:todayStr()
},{merge:true});
await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({
action:'Daily Bonus',type:'bonus',points:20,
desc:'Daily Bonus Claimed',timestamp:firebase.firestore.FieldValue.serverTimestamp()
});
timerEl.textContent='✅ Claimed! +20 pts added';
claimBtn.textContent='✅ Claimed Today';
infoEl.textContent='Thanks for supporting us! Come back tomorrow.';
setTimeout(()=>location.href='./home.html',1500);
}catch(e){
alert('Error, try again');
claimBtn.disabled=false;
claimBtn.textContent='🎉 Claim 20 pts';
}
};
</script>
</body>
</html>
