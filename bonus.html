<!DOCTYPE html>
<html>
<head>
<title>Daily Bonus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="monetag" content="b671b8351bfc48ed0161f6bd0b6a5340">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#0f1508;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:#fff}
.card{width:100%;max-width:380px;background:#1d331d;border:3px solid #fbbf24;border-radius:24px;padding:22px;text-align:center}
h1{color:#facc15;font-size:28px;margin-bottom:10px}
.sub{color:#ccc;font-size:14px;margin-bottom:16px}
.bonus-box{background:#0a120a;border:2px dashed #fbbf24;border-radius:16px;padding:18px;margin:14px 0}
.big{font-size:48px;margin-bottom:8px}
.points{font-size:26px;color:#fbbf24;font-weight:800}
.timer{font-size:15px;color:#aaa;margin-top:10px}
.btn{width:100%;background:#fbbf24;color:#000;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:14px}
.btn:disabled{background:#5a4a1a;color:#aaa;cursor:not-allowed}
.back{width:40%;height:44px;margin:16px auto 0;background:#f59e0b;border:0;border-radius:999px;font-weight:700;cursor:pointer}
.info{font-size:12px;color:#aaa;margin-top:12px}
.support-box{display:none;background:#fff8e1;border:2px dashed #fbbf24;border-radius:12px;padding:12px;margin-top:14px}
.support-btn{background:#f59e0b;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer;color:#000}
.skip-btn{background:none;border:none;color:#666;font-size:12px;margin-left:10px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>🎁 Daily Bonus</h1>
<div class="sub">Claim once every 24h - Free!</div>
<div class="bonus-box">
<div class="big">💰</div>
<div class="points">+20 Points</div>
<div class="timer" id="timer">Checking...</div>
</div>
<button class="btn" id="claimBtn" disabled>Loading...</button>
<div class="info" id="info">Daily reward - no ad required</div>

<div id="supportBox" class="support-box">
<p style="color:#000;font-size:12px;font-weight:bold;margin-bottom:8px;">❤️ Support us? (Optional)</p>
<button class="support-btn" onclick="openSupport()">Watch Sponsored</button>
<button class="skip-btn" onclick="goHome()">Skip & Go Home</button>
</div>

<button class="back" onclick="location.href='./home.html'">Back</button>
</div>
<script>
// FIXED: USE NEW PAYING SMARTLINK - PAYS MORE IN RW
const DIRECT_LINK="https://asiafilm.org/4/fea14e9f802d182828ceef74e57a3a5b";
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null,bal=0,canClaim=false,waitTimer=null;

const claimBtn=document.getElementById('claimBtn');
const timerEl=document.getElementById('timer');
const infoEl=document.getElementById('info');

auth.onAuthStateChanged(async(u)=>{
if(!u){location.href='./index.html';return;}
currentUser=u;
try{
const snap=await db.collection('users').doc(u.uid).get();
if(snap.exists){
const d=snap.data();
bal=d.balance||d.points||0;
// SECURE: CHECK 24H USING SERVER TIMESTAMP - NO PHONE DATE CHEAT
let lastTs = d.lastBonusTimestamp;
if(lastTs){
  let lastMs = lastTs.toMillis ? lastTs.toMillis() : lastTs;
  let nowMs = Date.now();
  let diffHours = (nowMs - lastMs) / (1000*60*60);
  if(diffHours < 24){
    let remain = Math.ceil(24 - diffHours);
    timerEl.textContent=`✅ Already claimed. Wait ${remain}h`;
    claimBtn.textContent=`Come back in ${remain}h`;
    claimBtn.disabled=true;
    infoEl.textContent=`Next bonus in ${remain} hours`;
    return;
  }
} else if(d.lastBonusDate){
  // Fallback for old users using date string
  if(d.lastBonusDate === new Date().toDateString()){
    timerEl.textContent='✅ Already claimed today';
    claimBtn.textContent='Come back tomorrow';
    claimBtn.disabled=true;
    return;
  }
}
}
}catch(e){console.log(e);}
startWait();
});

function startWait(){
let sec=5;
canClaim=false;
claimBtn.disabled=true;
claimBtn.textContent=`Wait ${sec}s...`;
timerEl.textContent=`Please wait ${sec} seconds`;
clearInterval(waitTimer);
waitTimer=setInterval(()=>{
sec--;
if(sec>0){
claimBtn.textContent=`Wait ${sec}s...`;
timerEl.textContent=`Please wait ${sec} seconds`;
}else{
clearInterval(waitTimer);
canClaim=true;
claimBtn.disabled=false;
claimBtn.textContent='🎉 Claim 20 pts Free';
timerEl.textContent='Ready to claim!';
}
},1000);
}

claimBtn.onclick=async()=>{
if(!canClaim||!currentUser) return;
claimBtn.disabled=true;
claimBtn.textContent='Claiming...';
bal+=20;
try{
await db.collection('users').doc(currentUser.uid).set({
balance:bal,
points:bal,
lastBonusTimestamp: firebase.firestore.FieldValue.serverTimestamp(),
lastBonusDate: new Date().toDateString()
},{merge:true});
await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({
action:'Daily Bonus',type:'bonus',points:20,
desc:'Daily Bonus Claimed +20 pts',timestamp:firebase.firestore.FieldValue.serverTimestamp()
});
timerEl.textContent='✅ Claimed! +20 pts added';
claimBtn.style.display='none';
infoEl.textContent='Thanks! You can support us below (optional)';
document.getElementById('supportBox').style.display='block';
}catch(e){
alert('Error: '+e.message);
claimBtn.disabled=false;
claimBtn.textContent='🎉 Claim 20 pts Free';
}
};

function openSupport(){
window.open(DIRECT_LINK,'_blank');
document.getElementById('supportBox').innerHTML='<p style="color:#000;font-size:13px;font-weight:bold">Thanks for supporting! ❤️</p><button class="back" style="width:80%;margin-top:10px;background:#1d331d;color:#fff" onclick="goHome()">Go Home</button>';
}
function goHome(){location.href='./home.html';}
</script>
</body>
</html>
