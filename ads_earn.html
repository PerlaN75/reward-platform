<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch Ads - Earn</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#0f172a;color:#fff;padding:10px;padding-bottom:40px}
.header{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #fbbf24;border-radius:20px;padding:16px;text-align:center;margin-bottom:12px}
.btn-home{background:#fff;color:#000;border:none;padding:8px 20px;border-radius:20px;font-weight:800;margin-top:10px}
.card{background:#fff;color:#000;border-radius:16px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:10px}
.icon{width:40px;height:40px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.btn{margin-left:auto;padding:8px 18px;border:none;border-radius:20px;font-weight:800;color:#fff;cursor:pointer}
.btn.start{background:linear-gradient(135deg,#22c55e,#16a34a)}
.btn.done{background:#ccc;color:#888}
#modal{display:none;position:fixed;inset:0;background:#f1f5f9;z-index:9999;padding:12px;text-align:center;color:#000;overflow:auto}
.ad-wrap{background:#fff;max-width:360px;margin:15px auto;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:15px}
.timer{background:#22c55e;color:#fff;padding:6px 18px;border-radius:20px;display:inline-block;font-weight:800}
#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:10000}
.label{font-size:9px;color:#888;text-align:center;padding:5px;text-transform:uppercase;letter-spacing:1px}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head><body>
<div id="toast"></div>
<div class="header">
<h2 style="margin:0">📺 Watch Ads Earn</h2>
<div style="color:#fbbf24;margin-top:6px;font-size:13px">Total: <b id="totalPts">0</b>/20 pts today</div>
<div style="font-size:10px;color:#94a3b8;margin-top:4px" id="pText">0/10 watched</div>
<button class="btn-home" onclick="location.href='./home.html'">Back Home</button>
</div>

<div id="list"></div>

<div id="modal">
<div class="timer" id="timer">00:15</div>
<div class="ad-wrap">
<div class="label">Advertisement</div>
<!-- ONLY 1 BANNER - CLEAN, NO SPAM -->
<div id="adBox"></div>
<p style="font-size:12px;color:#555;margin-top:12px">Watch this ad for 15 seconds to unlock reward.<br>Below Sponsored will open after 10s.</p>
</div>
<button id="claimBtn" style="width:100%;max-width:360px;padding:16px;border:none;border-radius:14px;font-weight:800;font-size:16px;background:#ccc;color:#fff;margin-top:15px" disabled>Wait 15s...</button>
<br><br><button onclick="closeModal()" style="background:none;border:none;text-decoration:underline">Close</button>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}

// YOUR PAYING LINKS
const SMARTLINK = "https://asiafilm.org/4/fea14e9f802d182828ceef74e57a3a5b";
const DIRECTLINK = "https://omg10.com/4/11905870";

const tasks = 10;
let done=[],total=0,sec=15,tmr,cur=0,userData=JSON.parse(localStorage.getItem('userData')||'{}'),currentUser=null;

function getToday(){return new Date().toISOString().split('T')[0];}

auth.onAuthStateChanged(async u=>{
 if(!u){location.href='./index.html';return;}
 currentUser=u;
 const ref=db.collection('users').doc(u.uid);
 const doc=await ref.get();
 if(doc.exists){ userData=doc.data(); localStorage.setItem('userData',JSON.stringify(userData)); }
 const today=getToday();
 if(userData.ads_date===today){ done=userData.ads_done||[]; }
 else{ done=[]; await ref.set({ads_date:today,ads_done:[],ads_total:0},{merge:true}); }
 total=done.length*2;
 render();
});

function render(){
 document.getElementById('totalPts').textContent=total;
 document.getElementById('pText').textContent=done.length+'/'+tasks+' watched - Resets midnight';
 let h='';
 for(let i=0;i<tasks;i++){
  let d=done.includes(i);
  h+=`<div class="card"><div class="icon">📺</div><div><b>Ad ${i+1}</b><br><span style="background:#dcfce7;color:#16a34a;padding:2px 6px;border-radius:8px;font-size:11px;font-weight:800">+2 pts</span></div><button class="btn ${d?'done':'start'}" onclick="startAd(${i})">${d?'Done ✓':'Watch'}</button></div>`;
 }
 document.getElementById('list').innerHTML=h;
}

function startAd(i){
 if(done.includes(i)) return;
 cur=i; sec=15;
 document.getElementById('modal').style.display='block';
 // LOAD ONLY 1 BANNER - 300x250
 document.getElementById('adBox').innerHTML = `
   <div id="banner-300"></div>
   <div id="sponsor-area" style="margin-top:12px;display:none">
     <button onclick="window.open(SMARTLINK,'_blank')" style="background:#0f172a;color:#fbbf24;border:1px solid #fbbf24;padding:10px 18px;border-radius:20px;font-weight:800;width:100%">🔥 Open Sponsored Offer (+bonus)</button>
   </div>
 `;
 // Inject Adsterra 300x250 - bf10cacd...
 let s=document.createElement('script'); s.innerHTML=`atOptions={'key':'bf10cacdbe9f50d0c5d66a94e0785f29','format':'iframe','height':250,'width':300,'params':{}};`;
 document.getElementById('banner-300').appendChild(s);
 let s2=document.createElement('script'); s2.src='https://www.highperformanceformat.com/bf10cacdbe9f50d0c5d66a94e0785f29/invoke.js'; document.getElementById('banner-300').appendChild(s2);

 let btn=document.getElementById('claimBtn'); btn.disabled=true; btn.style.background='#ccc'; btn.textContent=`Wait ${sec}s...`;
 document.getElementById('timer').textContent=`00:${sec<10?'0'+sec:sec}`;
 clearInterval(tmr);
 tmr=setInterval(()=>{
   sec--;
   document.getElementById('timer').textContent=`00:${sec<10?'0'+sec:sec}`;
   btn.textContent=`Wait ${sec}s...`;
   if(sec==5){ document.getElementById('sponsor-area').style.display='block'; }
   if(sec<=0){ clearInterval(tmr); btn.disabled=false; btn.style.background='#22c55e'; btn.textContent='Claim +2 pts'; }
 },1000);
}

document.getElementById('claimBtn').onclick=async ()=>{
 if(sec>0||done.includes(cur)) return;
 done.push(cur); total+=2;
 if(currentUser){
  try{
   let newBal=(userData.balance||0)+2;
   userData.balance=newBal; userData.ads_date=getToday(); userData.ads_done=done; userData.ads_total=total;
   localStorage.setItem('userData',JSON.stringify(userData));
   await db.collection('users').doc(currentUser.uid).set({balance:newBal,ads_date:getToday(),ads_done:done,ads_total:total},{merge:true});
   await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({action:'Watch Ad',points:2,desc:`Ad ${cur+1} +2 pts`,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
   toast('✓ +2 pts added!');
  }catch(e){toast(e.message);}
 }
 closeModal(); render();
};

function closeModal(){document.getElementById('modal').style.display='none';clearInterval(tmr);}
render();
</script>
</body>
</html>
