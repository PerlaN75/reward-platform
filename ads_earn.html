<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ads Earn</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7ff;font-family:Arial,sans-serif}
.header{padding:16px;text-align:center;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.header h2{margin:0;font-size:20px}
.task{background:#fff;margin:10px 12px;padding:14px;border-radius:16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.icon{width:48px;height:48px;background:linear-gradient(135deg,#2196f3,#00c853);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.info{flex:1;text-align:left}
.info b{font-size:15px}
.info span{color:#00c853;font-size:13px;font-weight:700}
.btn{padding:10px 18px;border:none;border-radius:22px;font-weight:800;color:#fff;cursor:pointer;min-width:85px}
.btn.start{background:#2196f3}
.btn.claim{background:#00c853;animation:pulse 1s infinite}
.btn.done{background:#eee;color:#888}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
#modal{display:none;position:fixed;inset:0;background:#e8f5e9;z-index:99;text-align:center;padding:12px;overflow:auto}
.timer{background:#4caf50;color:#fff;padding:6px 16px;border-radius:20px;display:inline-block;font-weight:800;margin-top:12px}
.ad-card{background:#fff;width:100%;max-width:360px;margin:18px auto;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15)}
#adBox{min-height:260px;background:#f0f0f0;display:flex;align-items:center;justify-content:center}
.continue{width:100%;max-width:360px;padding:16px;border:none;border-radius:14px;font-size:18px;font-weight:800;margin-top:18px;color:#fff}
</style>
</head>
<body>

<div class="header">
<h2>📢 Ads Earn</h2>
<div style="font-size:13px;margin-top:6px">Total: <b id="totalPts">0</b>/15 pts | 1000pts = $0.5</div>
<div style="font-size:11px;color:#666;margin-top:4px" id="progressText">0/10 ads done</div>
</div>

<div id="list"></div>

<!-- MODAL - looks like your Telegram screenshot -->
<div id="modal">
<div class="timer" id="timer">00:10</div>
<div class="ad-card">
<div id="adBox">
<!-- === PASTE YOUR ADSTERRA 300x250 CODE HERE === -->
<div style="color:#999">Adsterra Ad Here</div>
</div>
<div style="padding:14px;text-align:left">
<b>🔥 Your Prize Awaits!</b><br>
<small>Watch 10s to unlock points</small>
</div>
</div>
<div style="background:#0f2b1d;color:#fff;padding:10px 18px;border-radius:20px;display:inline-block;font-size:13px">↓ Click to get the reward!</div>
<br>
<button class="continue" id="mainBtn" style="background:#ccc">Wait 10s...</button>
<br><br><small onclick="closeModal()" style="color:#666;text-decoration:underline;cursor:pointer">Close</small>
</div>

<script>
const points = [2,1,2,1,2,1,2,1,2,1]; // TOTAL 15 pts
let done = JSON.parse(localStorage.getItem('adsEarn_done')||'[]');
let total = parseInt(localStorage.getItem('adsEarn_total')||'0');
let cur = 0, sec = 10, t;

function render(){
 document.getElementById('totalPts').textContent = total;
 document.getElementById('progressText').textContent = done.length + '/10 ads done';
 let html = '';
 for(let i=0;i<10;i++){
   let isDone = done.includes(i);
   let label = isDone? 'Done ✓' : 'Start';
   let cls = isDone? 'done' : 'start';
   html += `<div class="task"><div class="icon">📢</div><div class="info"><b>Ad ${i+1}</b><br><span>+${points[i]} pts</span></div><button class="btn ${cls}" id="b${i}" onclick="startAd(${i})">${label}</button></div>`;
 }
 document.getElementById('list').innerHTML = html;
}

function startAd(i){
 if(done.includes(i)) return;
 cur = i; sec = 10;
 document.getElementById('modal').style.display='block';
 let btn = document.getElementById('mainBtn');
 btn.disabled = true;
 btn.style.background = '#ccc';
 btn.textContent = `Wait ${sec}s...`;
 document.getElementById('timer').textContent = `00:${sec<10?'0'+sec:sec}`;
 clearInterval(t);
 t = setInterval(()=>{
   sec--;
   document.getElementById('timer').textContent = `00:${sec<10?'0'+sec:sec}`;
   btn.textContent = `Wait ${sec}s...`;
   if(sec<=0){
     clearInterval(t);
     btn.disabled = false;
     btn.style.background = '#00c853';
     btn.textContent = `Claim +${points[cur]} pts`;
   }
 },1000);
}

document.getElementById('mainBtn').onclick = ()=>{
 if(sec>0) return;
 if(done.includes(cur)) return;
 done.push(cur);
 total += points[cur];
 localStorage.setItem('adsEarn_done', JSON.stringify(done));
 localStorage.setItem('adsEarn_total', total);
 // TODO: connect to your real points system
 // addPoints(points[cur])
 closeModal();
 render();
 if(done.length===10){
   alert('Completed! You earned 15 pts today. Come back tomorrow.');
 }
};

function closeModal(){ document.getElementById('modal').style.display='none'; clearInterval(t); }
render();
</script>
</body>
</html>
