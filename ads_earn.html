<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ads Earn</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#0f1508;color:#fff;padding:12px}
.header{background:#2f3e1a;border:2px solid #fbbf24;border-radius:20px;padding:14px;text-align:center;margin-bottom:14px}
.task{background:#fff;color:#000;margin:10px 0;padding:14px;border-radius:16px;display:flex;align-items:center;gap:12px}
.icon{width:48px;height:48px;background:linear-gradient(135deg,#2196f3,#00c853);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.info{flex:1}.info b{font-size:15px}.info span{color:#00c853;font-size:13px;font-weight:700}
.btn{padding:10px 18px;border:none;border-radius:22px;font-weight:800;color:#fff;cursor:pointer;min-width:85px}
.btn.start{background:#2196f3}.btn.claim{background:#00c853}.btn.done{background:#eee;color:#888}
#modal{display:none;position:fixed;inset:0;background:#e8f5e9;z-index:9999;text-align:center;padding:12px;color:#000;overflow:auto}
.timer{background:#4caf50;color:#fff;padding:6px 16px;border-radius:20px;display:inline-block;font-weight:800;margin-top:12px}
.ad-card{background:#fff;width:100%;max-width:360px;margin:18px auto;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#adBox{min-height:260px;background:#f0f0f0;display:flex;align-items:center;justify-content:center}
.continue{width:100%;max-width:360px;padding:16px;border:none;border-radius:14px;font-size:18px;font-weight:800;margin-top:18px;color:#fff}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2f3e1a;border:2px solid #fbbf24;color:#fff;padding:12px 20px;border-radius:12px;display:none;z-index:10000}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head><body>
<div id="toast"></div>
<div class="header">
<h2 style="margin:0">📢 Ads Earn</h2>
<div style="font-size:13px;margin-top:6px;color:#fbbf24">Total Today: <b id="totalPts">0</b>/15 pts | 1000pts = $0.5</div>
<div style="font-size:11px;color:#aaa" id="progressText">0/10 done</div>
<button onclick="location.href='./home.html'" style="margin-top:10px;background:#fff;color:#000;border:none;padding:8px 16px;border-radius:20px;font-weight:bold">← Back Home</button>
</div>
<div id="list"></div>

<div id="modal">
<div class="timer" id="timer">00:10</div>
<div class="ad-card">
<div id="adBox"><!-- PASTE ADSTERRA 300x250 HERE --><div style="color:#999">Adsterra Ad Here</div></div>
<div style="padding:14px;text-align:left"><b>🔥 Your Prize Awaits!</b><br><small>Watch 10s to unlock</small></div>
</div>
<div style="background:#0f2b1d;color:#fff;padding:10px 18px;border-radius:20px;display:inline-block;font-size:13px">↓ Click to get the reward!</div>
<br><button class="continue" id="mainBtn" style="background:#ccc">Wait 10s...</button>
<br><br><small onclick="closeModal()" style="text-decoration:underline;cursor:pointer">Close</small>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
const points=[2,1,2,1,2,1]; // TOTAL 15

// DAILY RESET LOGIC
function getToday(){return new Date().toISOString().split('T')[0];}
let savedDate=localStorage.getItem('adsEarn_date');
let today=getToday();
if(savedDate!==today){
// new day -> reset
localStorage.setItem('adsEarn_date', today);
localStorage.setItem('adsEarn_done', '[]');
localStorage.setItem('adsEarn_total', '0');
}
let done=JSON.parse(localStorage.getItem('adsEarn_done')||'[]');
let total=parseInt(localStorage.getItem('adsEarn_total')||'0');
let cur=0, sec=10, tmr;
let currentUser=null, userData=JSON.parse(localStorage.getItem('userData')||'{}');

auth.onAuthStateChanged(async u=>{
 if(u){currentUser=u;
   const doc=await db.collection('users').doc(u.uid).get();
   if(doc.exists){userData=doc.data(); localStorage.setItem('userData',JSON.stringify(userData));}
   render();
 } else { location.href='./index.html'; }
});

function render(){
 document.getElementById('totalPts').textContent=total;
 document.getElementById('progressText').textContent=done.length+'/10 done - Resets midnight';
 let html='';
 for(let i=0;i<10;i++){
   let isDone=done.includes(i);
   let label=isDone?'Done ✓':'Start';
   let cls=isDone?'done':'start';
   html+=`<div class="task"><div class="icon">📢</div><div class="info"><b>Ad ${i+1}</b><br><span>+${points[i]} pts</span></div><button class="btn ${cls}" onclick="startAd(${i})">${label}</button></div>`;
 }
 document.getElementById('list').innerHTML=html;
}

function startAd(i){
 if(done.includes(i)) return;
 // check if date changed while app open
 if(localStorage.getItem('adsEarn_date')!==getToday()){
   localStorage.setItem('adsEarn_date', getToday());
   localStorage.setItem('adsEarn_done','[]');
   localStorage.setItem('adsEarn_total','0');
   done=[]; total=0;
 }
 cur=i; sec=10;
 document.getElementById('modal').style.display='block';
 let btn=document.getElementById('mainBtn');
 btn.disabled=true; btn.style.background='#ccc';
 btn.textContent=`Wait ${sec}s...`;
 document.getElementById('timer').textContent=`00:${sec}`;
 clearInterval(tmr);
 tmr=setInterval(()=>{
   sec--;
   document.getElementById('timer').textContent=`00:0${sec}`;
   btn.textContent=`Wait ${sec}s...`;
   if(sec<=0){
     clearInterval(tmr);
     btn.disabled=false;
     btn.style.background='#00c853';
     btn.textContent=`Claim +${points[cur]} pts`;
   }
 },1000);
}

document.getElementById('mainBtn').onclick=async ()=>{
 if(sec>0) return;
 if(done.includes(cur)) return;
 done.push(cur);
 total+=points[cur];
 localStorage.setItem('adsEarn_done', JSON.stringify(done));
 localStorage.setItem('adsEarn_total', total);
 localStorage.setItem('adsEarn_date', getToday());

 if(currentUser){
   try{
     let newBal=(userData.balance||0)+points[cur];
     userData.balance=newBal;
     localStorage.setItem('userData', JSON.stringify(userData));
     await db.collection('users').doc(currentUser.uid).update({balance:newBal});
     await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({
       action:'Ads Earn',
       points: points[cur],
       desc:`Watched Ad ${cur+1} +${points[cur]} pts`,
       timestamp: firebase.firestore.FieldValue.serverTimestamp()
     });
     showToast(`✓ +${points[cur]} pts added!`);
   }catch(e){ showToast(e.message); }
 }
 closeModal(); render();
 if(done.length===10) showToast('All 10 done today! Come back tomorrow midnight.');
};

function closeModal(){document.getElementById('modal').style.display='none'; clearInterval(tmr);}
render();
</script>
</body></html>
