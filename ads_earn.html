<style>
*{ -webkit-tap-highlight-color:transparent }
*:focus{outline:none !important}
body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:12px 10px 80px 10px;box-sizing:border-box;min-height:100vh}
.card{background:#ffffff;border:2px solid #e5e7eb;border-radius:22px;padding:16px 14px 18px 14px;width:100%;max-width:340px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.06);margin:10px auto 30px;height:auto}
h2{margin:8px 0 6px 0;color:#111827;font-size:22px;font-weight:900}
.badge{border:1.5px solid #2563eb;border-radius:20px;padding:6px 12px;display:inline-block;margin:8px 0;color:#2563eb;background:#eff6ff;font-weight:bold;font-size:13px}
.bar{height:7px;background:#e5e7eb;border-radius:10px;margin:10px 0;overflow:hidden}
.fill{height:100%;background:#2563eb;width:0%;transition:0.3s}
.task{display:flex;align-items:center;gap:10px;background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px 0;text-align:left}
.btn{padding:8px 14px;border-radius:20px;border:none;font-weight:bold;font-size:12px;cursor:pointer;min-width:68px}
.btn.start{background:#2563eb;color:#fff;box-shadow:0 2px 0 #1d4ed8}
.btn.start:active{transform:translateY(1px);box-shadow:0 1px 0 #1d4ed8}
.btn.done{background:#e5e7eb;color:#9ca3af}
#countText{font-size:12px;color:#6b7280;margin:4px 0}
.back{background:#fff;color:#111827;padding:10px 24px;border-radius:20px;display:inline-block;margin-top:14px;text-decoration:none;font-weight:bold;font-size:14px;border:1.5px solid #e5e7eb;box-shadow:0 2px 0 #e5e7eb}
.modal{display:none;position:fixed;z-index:999;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.45);justify-content:center;align-items:center;padding:8px;box-sizing:border-box}
.modal-content{background:#ffffff;border:2px solid #e5e7eb;border-radius:14px;padding:14px 12px;width:88%;max-width:280px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,0.12)}
.modal-content h3{margin:6px 0 4px 0;font-size:16px;color:#111827;font-weight:900}
.modal-content p{margin:2px 0;font-size:11px;color:#6b7280}
.timer{font-size:32px;color:#2563eb;font-weight:bold;margin:6px 0}
.ad-hint{font-size:11px;color:#9ca3af;margin-top:6px;font-style:italic}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#ffffff;border:2px solid #e5e7eb;color:#111827;padding:12px 18px;border-radius:12px;font-weight:bold;z-index:9999;display:none;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.1)}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<body>
<div id="toast"></div>
<div class="card">
<h2>📢 Ads Earn</h2>
<div class="badge" id="totalPtsBadge">Total Today: 0 pts</div>
<div class="bar"><div class="fill" id="progBar"></div></div>
<div id="countText">0/10 done - Resets midnight</div>
<div id="list" style="margin-top:10px"></div>
<a class="back" href="home.html">Back Home</a>
<div style="font-size:9px;color:#9ca3af;margin-top:10px">Protected by App Check + 15s cooldown</div>
</div>
<div id="timerModal" class="modal"><div class="modal-content">
<div style="font-size:26px">⏳</div>
<h3 id="modalTitle">Verifying Ad...</h3>
<p id="modalDesc">Keep ad tab open for 12 seconds</p>
<div class="timer" id="timerNum">12</div>
<div class="ad-hint" id="adHint">⏳ Ad loading... Please keep ad tab open</div>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try {
  const appCheck = firebase.appCheck();
  appCheck.activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', true);
} catch(e) {}
const auth=firebase.auth(), db=firebase.firestore();
const DIRECT_LINK = "https://asiafilm.org/4/fea14e9f802d182828ceef74e57a3a5b";
const points=[2,2,1,2,1,2,1,2,1,1]; // ✅ 10 items - FIXED
const WAIT_SEC = 12;
const EARN_COOLDOWN = 15;
function getToday(){return new Date().toISOString().split('T')[0];}
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
let done=[], total=0, cur=0, sec=WAIT_SEC, tmr=null, currentUser=null, userData={}, lastEarnTime=0;
function render(){
  document.getElementById('totalPtsBadge').innerText=`Total Today: ${total} pts`;
  document.getElementById('countText').innerText=`${done.length}/10 done - Resets midnight`;
  document.getElementById('progBar').style.width=(done.length*10)+'%';
  let html=''; for(let i=0;i<10;i++){
    let isDone=done.includes(i);
    html+=`<div class="task"><div style="font-size:20px">📢</div><div style="flex:1;font-size:13px;text-align:left;color:#111827"><b>Ad ${i+1}</b><br><span style="color:#2563eb;font-size:11px;font-weight:700">+${points[i]} pts</span></div><button class="btn ${isDone?'done':'start'}" onclick="startAd(${i})" ${isDone?'disabled':''}>${isDone?'Done ✓':'Start'}</button></div>`;
  } document.getElementById('list').innerHTML=html;
}
function startAd(i){
  if(done.includes(i)) return;
  if(document.getElementById('timerModal').style.display==='flex') return;
  const now = Date.now()/1000;
  if(now - lastEarnTime < EARN_COOLDOWN){
    showToast(`Wait ${Math.ceil(EARN_COOLDOWN - (now-lastEarnTime))}s before next earn`);
    return;
  }
  cur=i; window.open(DIRECT_LINK, "_blank");
  sec=WAIT_SEC; 
  document.getElementById('timerNum').innerText=sec;
  document.getElementById('modalTitle').innerText='Verifying Ad...';
  document.getElementById('modalDesc').innerText='Keep ad tab open for 12 seconds';
  document.getElementById('adHint').innerText='⏳ Ad loading... Please keep ad tab open';
  document.getElementById('timerModal').style.display='flex';
  tmr=setInterval(async ()=>{
    sec--; 
    document.getElementById('timerNum').innerText=sec;
    if(sec==8){
      document.getElementById('adHint').innerText='📡 Ad loaded - verifying view...';
    }
    if(sec==4){
      document.getElementById('adHint').innerText='✅ Ad verified - almost done...';
      document.getElementById('modalTitle').innerText='Almost Ready...';
    }
    if(sec<=0){ clearInterval(tmr); document.getElementById('timerModal').style.display='none'; await claimAd(); }
  },1000);
}
async function claimAd(){
  if(done.includes(cur)) return;
  const now = Date.now()/1000;
  if(now - lastEarnTime < EARN_COOLDOWN){
    showToast(`Too fast! Wait ${EARN_COOLDOWN}s`);
    return;
  }
  done.push(cur); total+=points[cur]; render();
  localStorage.setItem('adsEarn_done',JSON.stringify(done));
  localStorage.setItem('adsEarn_total',total);
  localStorage.setItem('adsEarn_date',getToday());
  if(currentUser){
    try{
      let newBal=(userData.balance||0)+points[cur];
      userData.balance=newBal;
      userData.adsEarn_date=getToday();
      userData.adsEarn_done=done;
      userData.adsEarn_total=total;
      localStorage.setItem('userData',JSON.stringify(userData));
      await db.collection('users').doc(currentUser.uid).update({
        balance:newBal,
        points:newBal,
        lastEarnAt: firebase.firestore.FieldValue.serverTimestamp(),
        adsEarn_date:getToday(),
        adsEarn_done:done,
        adsEarn_total:total
      });
      await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({
        action:'Ads Earn',
        points:points[cur],
        desc:`Ad ${cur+1} +${points[cur]} pts`,
        timestamp:firebase.firestore.FieldValue.serverTimestamp()
      });
      lastEarnTime = Date.now()/1000;
      showToast(`✓ +${points[cur]} pts added!`);
    }catch(e){
      if(e.message.includes("permissions") || e.code === "permission-denied"){
        showToast(`Wait ${EARN_COOLDOWN}s between earns - anti-hack protection`);
        done = done.filter(x=>x!==cur);
        total-=points[cur];
        render();
      } else {
        showToast(e.message);
      }
    }
  }
}
auth.onAuthStateChanged(async u=>{
  if(!u){ location.href='./index.html'; return; }
  currentUser=u; const doc=await db.collection('users').doc(u.uid).get();
  if(doc.exists){
    userData=doc.data(); localStorage.setItem('userData', JSON.stringify(userData));
    if(userData.lastEarnAt && userData.lastEarnAt.toMillis){
      lastEarnTime = userData.lastEarnAt.toMillis()/1000;
    }
    const today=getToday(); const fbDate=userData.adsEarn_date||'';
    if(fbDate===today){ done=userData.adsEarn_done||[]; total=userData.adsEarn_total||0; }
    else{ done=[]; total=0; await db.collection('users').doc(u.uid).update({adsEarn_date:today,adsEarn_done:[],adsEarn_total:0}); }
  } render();
}); render();
</script>
</body>
