<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ads Earn</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:12px 10px 80px 10px;box-sizing:border-box;min-height:100vh}
.card{background:radial-gradient(circle at top,#1a4d1a,#051405);border:2px solid #FFD700;border-radius:22px;padding:16px 14px 18px 14px;width:100%;max-width:340px;text-align:center;box-shadow:0 0 20px rgba(255,215,0,0.3);margin:10px auto 30px;height:auto}
h2{margin:8px 0 6px 0;color:#FFD700;font-size:20px}
.badge{border:1.5px solid #FFD700;border-radius:20px;padding:5px 12px;display:inline-block;margin:8px 0;color:#FFD700;font-weight:bold;font-size:13px}
.bar{height:7px;background:#333;border-radius:10px;margin:10px 0;overflow:hidden}
.fill{height:100%;background:#FFD700;width:0%;transition:0.3s}
.task{display:flex;align-items:center;gap:10px;background:#111;border:1px solid #333;border-radius:12px;padding:10px;margin:8px 0;text-align:left}
.btn{padding:8px 14px;border-radius:20px;border:none;font-weight:bold;font-size:12px;cursor:pointer;min-width:68px}
.btn.start{background:linear-gradient(#FFD700,#FFA500);color:#000}
.btn.done{background:#333;color:#888}
.back{background:#fff;color:#000;padding:10px 24px;border-radius:20px;display:inline-block;margin-top:14px;text-decoration:none;font-weight:bold;font-size:14px}
#countText{font-size:12px;color:#8f8;margin:4px 0}
.modal{display:none;position:fixed;z-index:999;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.85);justify-content:center;align-items:center;padding:8px;box-sizing:border-box}
.modal-content{background:#112911;border:1.5px solid #FFD700;border-radius:14px;padding:10px 12px;width:88%;max-width:280px;text-align:center}
.modal-content h3{margin:6px 0 4px 0;font-size:16px}
.modal-content p{margin:2px 0;font-size:11px}
.timer{font-size:32px;color:#FFD700;font-weight:bold;margin:6px 0}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a2e1a;border:2px solid #FFD700;color:#fff;padding:12px 18px;border-radius:10px;font-weight:bold;z-index:9999;display:none;max-width:90%;text-align:center}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div id="toast"></div>
<div class="card">
<h2>📢 Ads Earn</h2>
<div class="badge" id="totalPtsBadge">Total Today: 0 pts</div>
<div class="bar"><div class="fill" id="progBar"></div></div>
<div id="countText">0/10 done - Resets midnight</div>
<div id="list" style="margin-top:10px"></div>
<a class="back" href="home.html">Back Home</a>
</div>
<div id="timerModal" class="modal"><div class="modal-content">
<div style="font-size:30px">⏳</div>
<h3 style="color:#FFD700">Verifying Ad...</h3>
<div class="timer" id="timerNum">12</div>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
const DIRECT_LINK = "https://asiafilm.org/4/fea14e9f802d182828ceef74e57a3a5b";
const points=[2,2,1,2,1,2,1,2,1,1]; // FIXED: 10 ads
const WAIT_SEC = 12;
function getToday(){return new Date().toISOString().split('T')[0];}
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
let done=[], total=0, cur=0, sec=WAIT_SEC, tmr=null, currentUser=null, userData={};
function render(){
  document.getElementById('totalPtsBadge').innerText=`Total Today: ${total} pts`;
  document.getElementById('countText').innerText=`${done.length}/10 done - Resets midnight`;
  document.getElementById('progBar').style.width=(done.length*10)+'%';
  let html='';
  for(let i=0;i<10;i++){
    let isDone=done.includes(i);
    html+=`<div class="task"><div style="font-size:20px">📢</div><div style="flex:1;font-size:13px;text-align:left"><b>Ad ${i+1}</b><br><span style="color:#FFD700;font-size:11px">+${points[i]} pts</span></div><button class="btn ${isDone?'done':'start'}" onclick="startAd(${i})" ${isDone?'disabled':''}>${isDone?'Done ✓':'Start'}</button></div>`;
  }
  document.getElementById('list').innerHTML=html;
}
function startAd(i){
  if(done.includes(i)) return;
  if(document.getElementById('timerModal').style.display==='flex') return;
  cur=i; window.open(DIRECT_LINK, "_blank");
  sec=WAIT_SEC; document.getElementById('timerNum').innerText=sec;
  document.getElementById('timerModal').style.display='flex';
  tmr=setInterval(async ()=>{
    sec--; document.getElementById('timerNum').innerText=sec;
    if(sec<=0){ clearInterval(tmr); document.getElementById('timerModal').style.display='none'; await claimAd(); }
  },1000);
}
async function claimAd(){
  if(done.includes(cur)) return;
  done.push(cur); total+=points[cur]; render();
  localStorage.setItem('adsEarn_done',JSON.stringify(done));
  localStorage.setItem('adsEarn_total',total);
  localStorage.setItem('adsEarn_date',getToday());
  if(currentUser){
    try{
      let newBal=(userData.balance||0)+points[cur];
      userData.balance=newBal; userData.adsEarn_date=getToday(); userData.adsEarn_done=done; userData.adsEarn_total=total;
      localStorage.setItem('userData',JSON.stringify(userData));
      await db.collection('users').doc(currentUser.uid).update({balance:newBal,adsEarn_date:getToday(),adsEarn_done:done,adsEarn_total:total});
      await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({action:'Ads Earn', points:points[cur], desc:`Ad ${cur+1} +${points[cur]} pts`, timestamp:firebase.firestore.FieldValue.serverTimestamp()});
      showToast(`✓ +${points[cur]} pts added!`);
    }catch(e){ showToast(e.message); }
  }
}
auth.onAuthStateChanged(async u=>{
  if(!u){ location.href='./index.html'; return; }
  currentUser=u;
  const doc=await db.collection('users').doc(u.uid).get();
  if(doc.exists){
    userData=doc.data(); localStorage.setItem('userData', JSON.stringify(userData));
    const today=getToday(); const fbDate=userData.adsEarn_date||'';
    if(fbDate===today){ done=userData.adsEarn_done||[]; total=userData.adsEarn_total||0; }
    else{ done=[]; total=0; await db.collection('users').doc(u.uid).update({adsEarn_date:today,adsEarn_done:[],adsEarn_total:0}); }
  }
  render();
});
render();
</script>
</body>
</html>
