<!DOCTYPE html>
<html><head><title>Daily Checkin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer-when-downgrade" />
<script data-cfasync="false" src="https://bicea.org/14/d77b1388ce099539f64c8509ea58804e"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;-webkit-tap-highlight-color:transparent} *:focus{outline:none !important}
html,body{overflow-x:hidden;max-width:100vw}
body{background:#f5f3ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#111827}
.top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;width:100%;box-shadow:0 4px 12px rgba(109,40,217,0.3)}
.back{width:45px;height:30px;background:#ffffff;border:2px solid #fecaca;color:#991b1b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 2px 0 #fca5a5}
.center-pill{background:#ffffff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.box{max-width:420px;margin:14px auto;width:100%;position:relative;padding:0 10px}
.card{background:#2f3e1a;border:3px solid #fbbf24;border-radius:20px;padding:20px;text-align:center;color:#fff;margin-top:20px;position:relative;overflow:hidden;min-height:520px}
.reward{font-size:50px;margin-bottom:8px}
.action-btn{width:100%;padding:16px;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;margin-top:12px;box-shadow:0 3px 0 #d97706}
.action-btn:disabled{background:#555;color:#999;cursor:not-allowed;box-shadow:none}
.success{background:#1a2e1a;border:1px solid #22c55e;color:#22c55e;padding:10px;border-radius:8px;margin-top:12px;display:none}
#customToast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#ffffff;border:2px solid #ede9fe;color:#111827;padding:14px 22px;border-radius:12px;font-weight:900;z-index:99999;display:none;text-align:center;box-shadow:0 8px 24px rgba(109,40,217,0.15)}
.ad-label{font-size:8px;color:#8b5cf6;margin:10px 0 4px 0;letter-spacing:0.8px;font-weight:900;text-align:center;text-transform:uppercase}
#entryGate{position:absolute;inset:0;background:linear-gradient(180deg,#ffffff,#f5f3ff);z-index:90;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:18px 14px;text-align:center;overflow-y:auto;border:2px solid #fbbf24}
#gateTimer{
  width:66px;height:66px;min-width:66px;min-height:66px;
  border-radius:9999px;background:linear-gradient(180deg,#ffffff,#ede9fe);
  border:3px solid #a78bfa;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:#f59e0b;margin:10px auto;
  box-shadow:0 3px 10px rgba(109,40,217,0.12);
  line-height:1;box-sizing:border-box;aspect-ratio:1/1;flex-shrink:0
}
.ad-box{display:flex;justify-content:center;align-items:center;background:#fff;border:2px solid #ede9fe;border-radius:12px;width:100%;overflow:hidden;min-height:80px}
</style>
</head><body>
<div class="top-bar">
  <div class="back" onclick="location.href='./home.html'">‹</div>
  <div class="center-pill">📅 Daily Checkin</div>
  <div style="width:45px"></div>
</div>
<div id="customToast"></div>
<div class="box">
<div class="ad-label">ADVERTISEMENT</div>
<div id="topBanner" class="ad-box" style="min-height:70px;margin:6px auto"></div>
<div class="card">
<div id="entryGate">
  <div style="font-size:32px">⏳</div>
  <h3 style="margin:8px 0 6px;font-size:16px;color:#4c1d95;font-weight:900">Loading daily reward...</h3>
  <div id="gateTimer">10</div>
  <div style="font-size:11px;color:#8b5cf6;font-weight:700;margin-bottom:12px">Please wait 10s - ads loading</div>
  <div style="width:100%">
    <div class="ad-label">ADVERTISEMENT</div>
    <div id="container-23e1e60b5d9d8473949f8c3ca250759b" class="ad-box" style="min-height:120px"></div>
    <script async="async" data-cfasync="false" src="https://bicea.org/21/23e1e60b5d9d8473949f8c3ca250759b"></script>
    <div style="height:14px"></div>
    <div class="ad-label">ADVERTISEMENT</div>
    <div id="gateMidBanner" class="ad-box" style="min-height:270px"></div>
  </div>
</div>
<div class="reward">🎁</div>
<h3 style="color:#fbbf24">Daily Reward</h3>
<p style="color:#ccc;font-size:14px;margin:6px 0">Claim 5 coins every 24h</p>
<button class="action-btn" id="claimBtn" onclick="claimDaily()">Claim 5 Coins</button>
<div class="success" id="successMsg">✓ 5 Coins Added!</div>
<p id="checkinNote" style="font-size:12px;color:#aaa;margin-top:8px">Tap to claim</p>
<div style="margin-top:18px;background:#000;border-radius:12px;padding:12px;border:1px dashed #fbbf24">
<div style="font-size:11px;color:#aaa">Your Balance</div>
<div id="bal" style="font-size:20px;color:#fbbf24;font-weight:bold;margin-top:4px">-- coins</div>
</div>
</div>
<div class="ad-label" style="margin-top:16px">ADVERTISEMENT</div>
<div id="midBanner" class="ad-box" style="min-height:260px;margin:6px auto"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script>
function injectBanner(id,key,w,h){
  const c=document.getElementById(id); if(!c) return;
  c.innerHTML='';
  const s1=document.createElement('script');
  s1.innerHTML=`atOptions={'key':'${key}','format':'iframe','height':${h},'width':${w},'params':{}};`;
  c.appendChild(s1);
  const s2=document.createElement('script');
  s2.src=`https://bicea.org/22/${key}`;
  c.appendChild(s2);
  setTimeout(()=>{
    const hasIframe=c.querySelector('iframe');
    if(!hasIframe){
      if(h==250){
        const fb1=document.createElement('script');
        fb1.innerHTML=`atOptions={'key':'fe25c5bd01f4bc5e60243e36cd83277c','format':'iframe','height':50,'width':320,'params':{}};`;
        c.innerHTML=''; c.appendChild(fb1);
        const fb2=document.createElement('script');
        fb2.src=`https://bicea.org/22/fe25c5bd01f4bc5e60243e36cd83277c`;
        c.appendChild(fb2);
        setTimeout(()=>{
          if(!c.querySelector('iframe')){
            const adSet=c.closest('.ad-box'); if(adSet) adSet.style.display='none';
            const label=c.previousElementSibling;
            if(label && label.classList.contains('ad-label')) label.style.display='none';
          }
        },3500);
      }else{
        c.style.display='none';
        const label=c.previousElementSibling;
        if(label && label.classList.contains('ad-label')) label.style.display='none';
      }
    }
  },4000);
}
function loadGateBanners(){
  injectBanner('gateMidBanner','bf10cacdbe9f50d0c5d66a94e0785f29',300,250);
}
function loadMainBanners(){
  const gate=document.getElementById('entryGate');
  if(gate) gate.remove();
  injectBanner('topBanner','fe25c5bd01f4bc5e60243e36cd83277c',468,60);
  setTimeout(()=>{ injectBanner('midBanner','bf10cacdbe9f50d0c5d66a94e0785f29',300,250); },300);
}
loadGateBanners();
let gateSec=10;
const gateTimerEl=document.getElementById('gateTimer');
const gateInt=setInterval(()=>{
  gateSec--;
  if(gateTimerEl) gateTimerEl.innerText=gateSec;
  if(gateSec<=0){
    clearInterval(gateInt);
    loadMainBanners();
  }
},1000);
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
function showToast(m){const t=document.getElementById('customToast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
let currentUser=null,userData={},isClaiming=false;
function getToday(){return new Date().toISOString().split('T')[0];}
function loadData(d){
  if(!d) return; userData=d;
  document.getElementById('bal').innerText=(d.balance ?? d.coins ?? 0)+' 🪙 coins';
  if(d.lastCheckin) localStorage.setItem('lastCheckin', d.lastCheckin);
  checkStatus();
}
function checkStatus(){
  const today=getToday();
  const btn=document.getElementById('claimBtn');
  const note=document.getElementById('checkinNote');
  const success=document.getElementById('successMsg');
  if(userData.lastCheckin===today){
    btn.disabled=true; btn.innerText='Already Claimed Today ✓';
    note.innerText='Come back tomorrow';
    success.style.display='block';
  }else{
    btn.disabled=false; btn.innerText='Claim 5 Coins';
    note.innerText='Tap to claim';
    success.style.display='none';
  }
}
async function claimDaily(){
  if(isClaiming) return;
  const today=getToday();
  if(userData.lastCheckin===today){showToast('Already claimed today'); return;}
  isClaiming=true;
  const btn=document.getElementById('claimBtn');
  btn.disabled=true; btn.innerText='Claiming...';
  try{
    await db.collection('users').doc(currentUser.uid).update({
      balance: firebase.firestore.FieldValue.increment(5),
      coins: firebase.firestore.FieldValue.increment(5),
      points: firebase.firestore.FieldValue.increment(5),
      lastCheckin: today,
      lastEarnAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastWatchDate: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({
      action:'Daily Checkin',type:'checkin',coins:5,points:5,desc:'Daily Bonus',timestamp:firebase.firestore.FieldValue.serverTimestamp()
    });
    localStorage.setItem('lastCheckin', today);
    showToast('✓ 5 Coins Added!');
  }catch(e){
    showToast('Failed: '+e.message);
    const doc=await db.collection('users').doc(currentUser.uid).get();
    if(doc.exists) loadData(doc.data());
    btn.disabled=false;
  }
  isClaiming=false;
}
auth.onAuthStateChanged(u=>{
  if(u){
    currentUser=u;
    db.collection('users').doc(u.uid).onSnapshot(doc=>{
      if(doc.exists) loadData(doc.data());
    });
  }else{location.href='./index.html';}
});
</script></body></html>
