<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Check-in</title>
<style>
body{font-family:Arial;background:#f5f7fb;margin:0;padding:20px;text-align:center}
.card{background:#fff;max-width:400px;margin:40px auto;padding:25px;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,0.08)}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#3b82f6;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{background:#9ca3af;cursor:not-allowed}
.coin{font-size:42px;font-weight:800;color:#f59e0b}
.msg{margin-top:15px;font-size:14px;color:#16a34a}
</style>
</head>
<body>
<div class="card">
  <h2>Daily Check-in</h2>
  <p>Claim every 24h</p>
  <div class="coin" id="coins">--</div>
  <p id="status">Checking...</p>
  <button id="checkinBtn" disabled>Loading...</button>
  <div class="msg" id="msg"></div>
  <br><a href="./home.html">← Back Home</a>
</div>

<!-- Firebase v9 Compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSy...YOUR_KEY",
  authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
  projectId: "reward-platform-rw-2e13d",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let userId = null;
let userData = null;

auth.onAuthStateChanged(async (user)=>{
  if(!user){ window.location.href="./index.html"; return; }
  userId = user.uid;
  const doc = await db.collection("users").doc(userId).get();
  userData = doc.data() || {coins:0};
  document.getElementById("coins").innerText = (userData.coins||0)+" Coins";
  
  const today = new Date().toISOString().split('T')[0];
  const last = userData.lastCheckin || "";
  
  if(last === today){
    document.getElementById("status").innerText = "Already checked in today ✅ Come back tomorrow";
    document.getElementById("checkinBtn").innerText = "Checked ✓";
    document.getElementById("checkinBtn").disabled = true;
  } else {
    document.getElementById("status").innerText = "Ready to claim 5 coins!";
    document.getElementById("checkinBtn").innerText = "Claim 5 Coins";
    document.getElementById("checkinBtn").disabled = false;
  }
});

document.getElementById("checkinBtn").onclick = async ()=>{
  const btn = document.getElementById("checkinBtn");
  btn.disabled = true;
  btn.innerText = "Claiming...";
  
  try{
    const today = new Date().toISOString().split('T')[0];
    // Re-check from server to prevent double claim
    const freshDoc = await db.collection("users").doc(userId).get();
    const fresh = freshDoc.data();
    if(fresh.lastCheckin === today){
      throw new Error("Already claimed today");
    }
    
    // SECURE LOGIC - same as wallet - never overwrite, use increment
    await db.collection("users").doc(userId).update({
      coins: firebase.firestore.FieldValue.increment(5),
      lastCheckin: today,
      streak: firebase.firestore.FieldValue.increment(1),
      totalCheckins: firebase.firestore.FieldValue.increment(1)
    });
    
    const newDoc = await db.collection("users").doc(userId).get();
    const newCoins = newDoc.data().coins;
    document.getElementById("coins").innerText = newCoins+" Coins";
    document.getElementById("msg").innerText = "✅ +5 Coins added! Stays after refresh.";
    document.getElementById("status").innerText = "Checked in for "+today;
    btn.innerText = "Checked ✓";
    
  }catch(e){
    document.getElementById("msg").innerText = "❌ "+e.message;
    btn.disabled = false;
    btn.innerText = "Try Again";
  }
};
</script>
</body>
</html>
