<!DOCTYPE html>
<html><head><title>Daily Checkin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#ffffff;min-height:100vh;padding:16px 14px;color:#000}
.header{display:flex;align-items:center;gap:12px;margin:20px 0 10px}
.back{width:42px;height:38px;background:linear-gradient(180deg,#fef2f2,#ffe4e6);border:2px solid #ef4444;color:#991b1b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 2px 0 #fca5a5}
.back:active{transform:scale(0.96);box-shadow:0 1px 0 #fca5a5}
.box{max-width:420px;margin:0 auto}
.card{background:#2f3e1a;border:3px solid #fbbf24;border-radius:20px;padding:20px;text-align:center;color:#fff;margin-top:20px}
.reward{font-size:50px;margin-bottom:8px}
.action-btn{width:100%;padding:16px;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:12px;box-shadow:0 3px 0 #d97706}
.action-btn:active{transform:scale(0.98)}
.action-btn:disabled{background:#555;color:#999;cursor:not-allowed;box-shadow:none}
.success{background:#1a2e1a;border:1px solid #22c55e;color:#22c55e;padding:10px;border-radius:8px;margin-top:12px;display:none}
#customToast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2f3e1a;border:2px solid #fbbf24;color:#fff;padding:14px 22px;border-radius:12px;font-weight:bold;z-index:99999;display:none;text-align:center}
</style>
</head><body>
<div id="customToast"></div>
<div class="box">
<div class="header"><div class="back" onclick="location.href='./home.html'">‹</div><h2>📅 Daily Checkin</h2></div>

<div class="card">
<div class="reward">🎁</div>
<h3 style="color:#fbbf24">Daily Reward</h3>
<p style="color:#ccc;font-size:14px;margin:6px 0">Claim 5 coins every 24h</p>

<button class="action-btn" id="claimBtn" onclick="claimDaily()">Claim 5 Coins</button>
<div class="success" id="successMsg">✓ 5 Coins Added!</div>
<p id="checkinNote" style="font-size:12px;color:#aaa;margin-top:8px">Tap to claim</p>

<div style="margin-top:18px;background:#000;border-radius:12px;padding:12px;border:1px dashed #fbbf24">
<div style="font-size:11px;color:#aaa">Your Balance</div>
<div id="bal" style="font-size:20px;color:#fbbf24;font-weight:bold;margin-top:4px">-- coins</div>
</div>
</div>
</div>

<!-- ULTRA INSTANT - SHOWS YOUR SCREENSHOT IN 0.01s -->
<script>
(function(){
  try{
    var c = JSON.parse(localStorage.getItem('userData')||'{}');
    var today = new Date().toISOString().split('T')[0];
    if(c){
      // instant balance
      if(c.balance!=null || c.points!=null){
        document.getElementById('bal').textContent = (c.balance ?? c.points ?? 0) + ' coins';
      }
      // instant claimed status - like your screenshot
      if(c.lastCheckin === today){
        var btn = document.getElementById('claimBtn');
        btn.disabled = true;
        btn.innerText = 'Already Claimed Today ✓';
        document.getElementById('successMsg').style.display = 'block';
        document.getElementById('checkinNote').innerText = 'Come back tomorrow';
      }
    }
  }catch(e){}
})();
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
function showToast(m){const t=document.getElementById('customToast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
let currentUser=null,userData={},isClaiming=false;
function getToday(){return new Date().toISOString().split('T')[0];}

function loadData(d){
  if(!d) return;
  userData=d;
  if(d.balance==null) d.balance=d.points||0;
  document.getElementById('bal').innerText=(d.balance||0)+' coins';
  localStorage.setItem('userData', JSON.stringify(d));
  checkStatus();
}
function checkStatus(){
  const today=getToday();
  const btn=document.getElementById('claimBtn');
  const note=document.getElementById('checkinNote');
  const success=document.getElementById('successMsg');
  if(userData.lastCheckin===today){
    btn.disabled=true; btn.innerText='Already Claimed Today ✓';
    note.innerText='Come back tomorrow';
    success.style.display='block';
  }else{
    btn.disabled=false; btn.innerText='Claim 5 Coins';
    note.innerText='Tap to claim';
    success.style.display='none';
  }
}

async function claimDaily(){
  if(isClaiming) return;
  isClaiming=true;
  const today=getToday();
  if(userData.lastCheckin===today){showToast('Already claimed today'); isClaiming=false; return;}

  // INSTANT UI
  const btn=document.getElementById('claimBtn');
  btn.disabled=true; btn.innerText='Already Claimed Today ✓';
  document.getElementById('bal').innerText=((userData.balance||0)+5)+' coins';
  document.getElementById('successMsg').style.display='block';
  document.getElementById('checkinNote').innerText='Come back tomorrow';
  showToast('✓ 5 Coins Added!');

  try{
    var cached = JSON.parse(localStorage.getItem('userData')||'{}');
    cached.balance = (cached.balance||userData.balance||0)+5;
    cached.points = (cached.points||userData.balance||0)+5;
    cached.lastCheckin = today;
    localStorage.setItem('userData', JSON.stringify(cached));
  }catch(e){}

  try{
    await db.runTransaction(async (tr)=>{
      const ref=db.collection('users').doc(currentUser.uid);
      const snap=await tr.get(ref);
      if(snap.data().lastCheckin===today) throw "already";
      tr.update(ref,{ balance: firebase.firestore.FieldValue.increment(5), lastCheckin: today });
    });
    await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({action:'Daily Checkin',points:5,desc:'Daily Bonus',timestamp:firebase.firestore.FieldValue.serverTimestamp()});
  }catch(e){
    if(e==="already") checkStatus();
    else{
      const doc=await db.collection('users').doc(currentUser.uid).get(); 
      if(doc.exists) loadData(doc.data());
    }
  }
  isClaiming=false;
}

auth.onAuthStateChanged(u=>{
  if(u){
    currentUser=u;
    db.collection('users').doc(u.uid).onSnapshot(doc=>{
      if(doc.exists) loadData(doc.data());
    });
  }else{location.href='./index.html';}
});
</script></body></html>
