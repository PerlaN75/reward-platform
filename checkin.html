<!DOCTYPE html>
<html><head><title>Daily Checkin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="monetag" content="b671b8351bfc48ed0161f6bd0b6a5340">
<meta name="referrer" content="no-referrer-when-downgrade" />
<script src="https://quge5.com/88/tag.min.js" data-zone="286869" async data-cfasync="false"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
html,body{overflow-x:hidden;max-width:100vw}
body{background:#ffffff;min-height:100vh;padding:16px 14px;color:#000}
.header{display:flex;align-items:center;gap:12px;margin:20px 0 10px}
.back{width:45px;height:30px;background:linear-gradient(180deg,#fef2f2,#ffe4e6);border:2px solid #ef4444;color:#991b1b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 2px 0 #fca5a5}
.box{max-width:420px;margin:0 auto;position:relative}
.card{background:#2f3e1a;border:3px solid #fbbf24;border-radius:20px;padding:20px;text-align:center;color:#fff;margin-top:20px;position:relative;overflow:hidden}
.reward{font-size:50px;margin-bottom:8px}
.action-btn{width:100%;padding:16px;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:12px;box-shadow:0 3px 0 #d97706}
.action-btn:disabled{background:#555;color:#999;cursor:not-allowed;box-shadow:none}
.success{background:#1a2e1a;border:1px solid #22c55e;color:#22c55e;padding:10px;border-radius:8px;margin-top:12px;display:none}
#customToast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2f3e1a;border:2px solid #fbbf24;color:#fff;padding:14px 22px;border-radius:12px;font-weight:bold;z-index:99999;display:none;text-align:center}
.ad-label{font-size:8px;color:#9ca3af;margin:10px 0 4px 0;letter-spacing:0.8px;font-weight:800;text-align:center;text-transform:uppercase}
#entryGate{position:absolute;inset:0;background:#ffffff;z-index:90;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:18px 14px;text-align:center;overflow-y:auto}
#gateTimer{font-size:42px;font-weight:900;color:#f59e0b;margin:10px 0}
.ad-box{display:flex;justify-content:center;align-items:center;background:#fff;border:1px solid #eee;border-radius:12px;width:100%;overflow:hidden}
</style>
</head><body>
<div id="customToast"></div>
<div class="box">
<div class="header"><div class="back" onclick="location.href='./home.html'">‹</div><h2>📅 Daily Checkin</h2></div>

<div class="ad-label">ADVERTISEMENT</div>
<div id="topBanner" class="ad-box" style="min-height:70px;margin:6px auto"></div>

<div class="card">
<div id="entryGate">
  <div style="font-size:32px">⏳</div>
  <h3 style="margin:8px 0 6px;font-size:16px;color:#111827;font-weight:900">Loading daily reward...</h3>
  <div id="gateTimer">5</div>
  <div style="font-size:11px;color:#6b7280;font-weight:700;margin-bottom:12px">Please wait...</div>
  <div style="width:100%">
    <div class="ad-label">ADVERTISEMENT</div>
    <div id="gateTopBanner" class="ad-box" style="min-height:70px"></div>
    <div style="height:14px"></div>
    <div class="ad-label">ADVERTISEMENT</div>
    <div id="gateMidBanner" class="ad-box" style="min-height:260px"></div>
  </div>
</div>

<div class="reward">🎁</div>
<h3 style="color:#fbbf24">Daily Reward</h3>
<p style="color:#ccc;font-size:14px;margin:6px 0">Claim 5 coins every 24h</p>
<button class="action-btn" id="claimBtn" onclick="claimDaily()">Claim 5 Coins</button>
<div class="success" id="successMsg">✓ 5 Coins Added!</div>
<p id="checkinNote" style="font-size:12px;color:#aaa;margin-top:8px">Tap to claim</p>
<div style="margin-top:18px;background:#000;border-radius:12px;padding:12px;border:1px dashed #fbbf24">
<div style="font-size:11px;color:#aaa">Your Balance</div>
<div id="bal" style="font-size:20px;color:#fbbf24;font-weight:bold;margin-top:4px">-- coins</div>
</div>
</div>

<div class="ad-label" style="margin-top:16px">ADVERTISEMENT</div>
<div id="midBanner" class="ad-box" style="min-height:260px;margin:6px auto"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script>
function injectBanner(id,key,w,h){
  const c=document.getElementById(id); if(!c) return; c.innerHTML='';
  const at=document.createElement('script'); at.innerHTML=`atOptions={'key':'${key}','format':'iframe','height':${h},'width':${w},'params':{}};`; c.appendChild(at);
  const s=document.createElement('script'); s.src=`https://www.highperformanceformat.com/${key}/invoke.js`; s.async=true; c.appendChild(s);
}
function loadGateBanners(){
  injectBanner('gateTopBanner','fe25c5bd01f4bc5e60243e36cd83277c',320,50);
  setTimeout(()=>{ injectBanner('gateMidBanner','bf10cacdbe9f50d0c5d66a94e0785f29',300,250); },1500);
}
function loadMainBanners(){
  const gate=document.getElementById('entryGate');
  if(gate) gate.remove();
  injectBanner('topBanner','fe25c5bd01f4bc5e60243e36cd83277c',320,50);
  setTimeout(()=>{ injectBanner('midBanner','bf10cacdbe9f50d0c5d66a94e0785f29',300,250); },1500);
}
loadGateBanners();

let gateSec=5;
const gateTimerEl=document.getElementById('gateTimer');
const gateEl=document.getElementById('entryGate');
const gateInt=setInterval(()=>{
  gateSec--;
  if(gateTimerEl) gateTimerEl.innerText=gateSec;
  if(gateSec<=0){
    clearInterval(gateInt);
    loadMainBanners();
  }
},1000);

const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
function showToast(m){const t=document.getElementById('customToast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
let currentUser=null,userData={},isClaiming=false;
function getToday(){return new Date().toISOString().split('T')[0];}
function loadData(d){
  if(!d) return; userData=d;
  document.getElementById('bal').innerText=(d.balance ?? d.coins ?? 0)+' 🪙 coins';
  if(d.lastCheckin) localStorage.setItem('lastCheckin', d.lastCheckin);
  checkStatus();
}
function checkStatus(){
  const today=getToday();
  const btn=document.getElementById('claimBtn');
  const note=document.getElementById('checkinNote');
  const success=document.getElementById('successMsg');
  if(userData.lastCheckin===today){
    btn.disabled=true; btn.innerText='Already Claimed Today ✓';
    note.innerText='Come back tomorrow';
    success.style.display='block';
  }else{
    btn.disabled=false; btn.innerText='Claim 5 Coins';
    note.innerText='Tap to claim';
    success.style.display='none';
  }
}
async function claimDaily(){
  if(isClaiming) return;
  const today=getToday();
  if(userData.lastCheckin===today){showToast('Already claimed today'); return;}
  isClaiming=true;
  const btn=document.getElementById('claimBtn');
  btn.disabled=true; btn.innerText='Claiming...';
  try{
    await db.collection('users').doc(currentUser.uid).update({
      balance: firebase.firestore.FieldValue.increment(5),
      coins: firebase.firestore.FieldValue.increment(5),
      points: firebase.firestore.FieldValue.increment(5),
      lastCheckin: today,
      lastEarnAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastWatchDate: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({
      action:'Daily Checkin',type:'checkin',coins:5,points:5,desc:'Daily Bonus',timestamp:firebase.firestore.FieldValue.serverTimestamp()
    });
    localStorage.setItem('lastCheckin', today);
    showToast('✓ 5 Coins Added!');
    loadMainBanners();
  }catch(e){
    showToast('Failed: '+e.message);
    const doc=await db.collection('users').doc(currentUser.uid).get();
    if(doc.exists) loadData(doc.data());
    btn.disabled=false;
  }
  isClaiming=false;
}
auth.onAuthStateChanged(u=>{
  if(u){
    currentUser=u;
    db.collection('users').doc(u.uid).onSnapshot(doc=>{
      if(doc.exists) loadData(doc.data());
    });
  }else{location.href='./index.html';}
});
</script></body></html>
