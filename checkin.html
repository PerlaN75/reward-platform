<!DOCTYPE html>
<html>
<head>
  <title>Daily Checkin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; padding: 20px; color: white; text-align: center; }
    
    .header { padding-top: 30px; margin-bottom: 20px; }
    .header h1 { font-size: 28px; color: #fbbf24; font-weight: bold; }
    .header p { color: #d1fae5; font-size: 14px; margin-top: 5px; }
    
    .streak-box { background: #1a2410; padding: 20px; border-radius: 15px; margin-bottom: 25px; }
    .streak-box h3 { font-size: 14px; color: #aaa; }
    .streak-box h2 { font-size: 40px; color: #f97316; font-weight: bold; margin: 5px 0; }
    
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 25px; }
    .day { 
      background: #1a2410; padding: 15px 5px; border-radius: 12px; font-size: 12px;
      border: 2px solid #2f3e1a; font-weight: bold;
    }
    .day.done { background: linear-gradient(180deg, #22c55e, #16a34a); border-color: #22c55e; color: white; }
    .day.today { border-color: #fbbf24; box-shadow: 0 0 10px #fbbf24; }
    
    .checkin-btn { 
      width: 100%; padding: 18px; background: linear-gradient(90deg, #fbbf24, #f97316); 
      color: #000; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; 
      font-size: 18px; margin-bottom: 15px; box-shadow: 0 6px 0 #b45309;
    }
    .checkin-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #b45309; }
    .checkin-btn:disabled { background: #555; color: #aaa; box-shadow: 0 6px 0 #333; cursor: not-allowed; }
    
    .back-btn { 
      width: 40%; padding: 14px; background: #555; color: white; 
      border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; 
    }

    .popup-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .popup-box { background: #1a2410; padding: 25px; border-radius: 20px; text-align: center; width: 85%; max-width: 320px; border: 2px solid #fbbf24; }
    .popup-box h2 { color: #fbbf24; font-size: 20px; margin-bottom: 10px; }
    .popup-box p { color: #ddd; font-size: 14px; margin-bottom: 20px; }
    .popup-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #fbbf24, #f97316); color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="popup-overlay" id="popup">
    <div class="popup-box">
      <h2>✓ Checkin Success!</h2>
      <p id="popupText">+15 Points Added to Your Balance</p>
      <button class="popup-btn" onclick="closePopup()">OK</button>
    </div>
  </div>

  <div class="header">
    <h1>📅 Daily Checkin</h1>
    <p>Come back every day for bonus points</p>
  </div>

  <div class="streak-box">
    <h3>CURRENT STREAK</h3>
    <h2 id="streak">0 Days</h2>
  </div>

  <div class="calendar" id="calendar"></div>

  <button class="checkin-btn" id="checkinBtn" onclick="doCheckin()">Check In Now +15</button>
  <button class="back-btn" onclick="window.location.href='home.html'">Back Home</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc, increment, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d" };
  const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});
  
  let currentUser = null;
  let userData = {};

  onAuthStateChanged(auth, async (user) => {
    if (!user) return window.location.href = "log.html";
    currentUser = user;
    loadData();
  });

  function getTodayString() {
    const now = new Date();
    return now.getFullYear() + "-" + (now.getMonth()+1) + "-" + now.getDate();
  }

  function showPopup(points) {
    document.getElementById('popupText').innerText = `+${points} Points Added to Your Balance`;
    document.getElementById('popup').style.display = 'flex';
  }
  window.closePopup = function() {
    document.getElementById('popup').style.display = 'none';
    loadData();
  }
  
  function renderUI(data) { // NEW: Separate render
    document.getElementById('streak').innerText = data.streak + ' Days';
    
    const cal = document.getElementById('calendar');
    cal.innerHTML = '';
    for(let i = 1; i <= 7; i++){
      const div = document.createElement('div');
      div.className = 'day';
      div.innerText = 'Day ' + i;
      if(i <= data.streak) div.classList.add('done');
      if(i === data.streak + 1 && data.lastCheckinDate !== getTodayString()) div.classList.add('today');
      cal.appendChild(div);
    }
    
    const btn = document.getElementById('checkinBtn');
    if(data.lastCheckinDate === getTodayString()){
      btn.innerText = 'Already Checked In Today';
      btn.disabled = true;
    } else {
      btn.innerText = `Check In Now +15`;
      btn.disabled = false;
    }
  }

  async function loadData() {
    const cacheKey = 'checkin_' + currentUser.uid;
    const cached = localStorage.getItem(cacheKey);
    
    // STEP 1: Show from cache instantly
    if(cached){
      try {
        const data = JSON.parse(cached);
        userData = data;
        renderUI(userData);
      } catch(e){}
    }
    
    // STEP 2: Get real data from Firebase
    const snap = await getDoc(doc(db, "users", currentUser.uid));
    if(!snap.exists()) return;
    userData = snap.data();
    renderUI(userData);
    
    // STEP 3: Save to cache
    localStorage.setItem(cacheKey, JSON.stringify(userData));
  }

  window.doCheckin = async function() {
    const today = getTodayString();
    const lastCheckin = userData.lastCheckinDate;
    let newStreak = userData.streak || 0;
    
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
    const yestStr = yesterday.getFullYear() + "-" + (yesterday.getMonth()+1) + "-" + yesterday.getDate();
    
    if(lastCheckin === yestStr) newStreak++;
    else newStreak = 1;
    
    // INSTANT: Update cache + UI first
    userData.streak = newStreak;
    userData.lastCheckinDate = today;
    const cacheKey = 'checkin_' + currentUser.uid;
    localStorage.setItem(cacheKey, JSON.stringify(userData));
    renderUI(userData);
    
    // Then update Firebase
    await updateDoc(doc(db, "users", currentUser.uid), {
      balance: increment(15),
      streak: newStreak,
      lastCheckinDate: today
    });
    
    showPopup(15);
  }
</script>
</body>
</html>
