<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Reward Platform</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  
  body {
    background: #3a3f2a; /* MILITARY GREEN */
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .card {
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 30px 25px;
    border-radius: 20px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 15px;
  }

  h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 25px;
  }

  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border-radius: 10px;
    border: none;
    background: #000;
    color: #fff;
    font-size: 15px;
    outline: none;
  }

  input::placeholder {
    color: #888;
  }

  input:focus {
    box-shadow: 0 0 0 2px #FFD700;
  }

  .btn-login {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #8B5CF6, #3B82F6); /* purple to blue */
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 15px;
  }

  .forgot {
    text-align: center;
    font-size: 14px;
    margin-bottom: 15px;
    color: #cbd5e1;
  }

  .forgot a {
    color: #FFD700; /* gold */
    text-decoration: none;
    font-weight: bold;
  }

  .btn-back {
    padding: 14px 40px;
    border-radius: 12px;
    border: none;
    background: #F59E0B; /* orange */
    color: #000;
    font-weight: bold;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 4px 0 #D97706;
    transition: all 0.2s;
  }

  .btn-back:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #D97706;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Login</h1>
    
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      
      <button type="submit" class="btn-login">LOGIN</button>
    </form>

    <p class="forgot">Forgot Password? <a href="#">Reset</a></p>
  </div>

  <a href="index.html" class="btn-back">← Back</a>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    console.log("Logging in:", {username, password});
    alert(`Logging in: ${username}`);
  });
</script>

</body>
</html>
