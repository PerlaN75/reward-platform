<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding: 60px 20px 20px 20px; }
.login-card { background: #4a6128; padding: 30px 25px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; border: 3px solid #fbbf24; }
.logo { font-size: 60px; margin-bottom: 10px; filter: drop-shadow(0 0 8px #fbbf24); }
    h1 { color: #fbbf24; font-size: 28px; margin-bottom: 8px; }
.tagline { color: #fff; font-size: 13px; margin-bottom: 25px; }
    input { width: 100%; padding: 15px; margin: 10px 0; background: #1a2410; border: 1px solid #333; border-radius: 10px; color: white; font-size: 15px; }
    input::placeholder { color: #888; }
.btn-login { width: 100%; padding: 16px; background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 0 #d97706; }
.btn-login:active { transform: translateY(2px); box-shadow: 0 2px 0 #d97706; }
.link-register { color: #fbbf24; margin-top: 15px; font-size: 14px; cursor: pointer; }
.link-reset { color: #60a5fa; margin-top: 8px; font-size: 13px; cursor: pointer; text-decoration: underline; }
.error { color: #ef4444; font-size: 13px; margin-top: 10px; }
.success { color: #22c55e; font-size: 14px; margin-top: 10px; font-weight: bold; }
.btn-back-outside { width: 40%; padding: 14px; background: white; color: black; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 40px; box-shadow: 0 3px 0 #ccc; }
.hidden { display: none; }
  </style>
</head>
<body>
  <div class="login-card">
   <div class="logo">🔑</div>
    <h1 id="cardTitle">Login</h1>
    <div class="tagline">From Nothing to Something</div>
    <div id="loginForm">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button class="btn-login" id="loginBtn" onclick="login()">Login</button>
      <div class="link-reset" onclick="showReset()">Forgot Password?</div>
      <div class="link-register" onclick="window.location.href='./reg.html'">Don't have an account? Register</div>
    </div>
    <div id="resetStep1" class="hidden">
      <input type="text" id="resetUsername" placeholder="Registered Username" oninput="formatResetUsername()">
      <input type="email" id="resetEmail" placeholder="Registered Email">
      <button class="btn-login" onclick="verifyUser()">Verify</button>
      <div class="link-reset" onclick="showLogin()">Back to Login</div>
    </div>
    <div id="resetStep2" class="hidden">
      <input type="password" id="newPassword" placeholder="New Password">
      <input type="password" id="confirmPassword" placeholder="Confirm Password">
      <button class="btn-login" onclick="resetPassword()">Reset</button>
      <div class="link-reset" onclick="showLogin()">Back to Login</div>
    </div>
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
  </div>
  <button class="btn-back-outside" onclick="window.location.href='./index.html'">Back</button>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d",
    storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
    messagingSenderId: "787550951987",
    appId: "1:787550951987:web:724b1463e821b99c90a146"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let resetUserData = null;
  let isLogging = false;

  window.formatResetUsername = function(){
    let val = document.getElementById('resetUsername').value;
    val = val.replace(/[^a-zA-Z]/g, '');
    val = val.charAt(0).toUpperCase() + val.slice(1).toLowerCase();
    document.getElementById('resetUsername').value = val;
  }

  window.login = async function() {
    if(isLogging) return;
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('loginBtn');
    errorEl.innerText = "";
    document.getElementById('success').innerText = "";
    if(!email ||!password){ errorEl.innerText = "Fill all fields"; return; }
    isLogging = true;
    btn.disabled = true;
    btn.innerText = "Logging in...";
    btn.style.opacity = "0.7";
    try {
      await signInWithEmailAndPassword(auth, email, password);
      // 0 SEC INSTANT - home.html will verify and load data
      window.location.replace("./home.html");
    } catch(e) {
      if(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-login-credentials'){
        errorEl.innerText = "Invalid email or password";
      } else if(e.code === 'auth/user-not-found'){
        errorEl.innerText = "User not found";
      } else {
        errorEl.innerText = e.message;
      }
      isLogging = false;
      btn.disabled = false;
      btn.innerText = "Login";
      btn.style.opacity = "1";
    }
  }

  window.showReset = function(){
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('resetStep1').classList.remove('hidden');
    document.getElementById('cardTitle').innerText = "Reset Password";
    clearMessages();
  }
  window.showLogin = function(){
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('resetStep1').classList.add('hidden');
    document.getElementById('resetStep2').classList.add('hidden');
    document.getElementById('cardTitle').innerText = "Login";
    clearMessages();
  }
  function clearMessages(){
    document.getElementById('error').innerText = "";
    document.getElementById('success').innerText = "";
  }
  function validatePassword(password){
    if(password.length < 5 || password.length > 10) return "Password must be 5-10 characters";
    if(!/[A-Z]/.test(password)) return "Password needs at least 1 capital letter";
    if(!/[0-9]/.test(password)) return "Password needs at least 1 number";
    if(!/[!@#$%^&*(),.?":{}|<>]/.test(password)) return "Password needs at least 1 special character";
    return null;
  }
  window.verifyUser = async function(){
    const username = document.getElementById('resetUsername').value.trim();
    const email = document.getElementById('resetEmail').value.trim();
    const errorEl = document.getElementById('error');
    errorEl.innerText = "";
    if(!username ||!email){ errorEl.innerText = "Enter username and email"; return; }
    try {
      const q = query(collection(db, "users"), where("username", "==", username), where("email", "==", email));
      const snap = await getDocs(q);
      if(snap.empty){
        errorEl.innerText = "Username and Email do not match";
        return;
      }
      resetUserData = { uid: snap.docs[0].id,...snap.docs[0].data() };
      document.getElementById('resetStep1').classList.add('hidden');
      document.getElementById('resetStep2').classList.remove('hidden');
    } catch(e){
      errorEl.innerText = "Error: "+e.message;
    }
  }
  window.resetPassword = async function(){
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    errorEl.innerText = "";
    successEl.innerText = "";
    const passError = validatePassword(newPass);
    if(passError){ errorEl.innerText = passError; return; }
    if(newPass!== confirmPass){ errorEl.innerText = "Passwords do not match"; return; }
    successEl.innerText = "Password rule passed - Contact admin to reset";
    setTimeout(() => { showLogin(); }, 1500);
  }
</script>
</body>
</html>
