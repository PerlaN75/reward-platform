<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; flex-direction: column; }
    .container { background: #3a4a22; padding: 40px 25px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; }
    h2 { color: white; font-size: 32px; margin-bottom: 25px; font-weight: bold; }
    input { width: 100%; padding: 12px 14px; background: #000; border: 2px solid transparent; border-radius: 10px; color: white; font-size: 15px; outline: none; margin-bottom: 15px; }
    input:focus { border: 2px solid #f59e0b; }
    .login-btn { width: 100%; padding: 13px; background: linear-gradient(90deg, #a855f7, #3b82f6); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; margin-bottom: 15px; }
    .reset-link { color: #fbbf24; font-size: 14px; margin-bottom: 20px; }
    .reset-link a { color: #fbbf24; text-decoration: none; font-weight: bold; }
    .back-btn { width: 60%; padding: 11px; background: #f59e0b; color: black; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: bold; }
    .error { color: #ef4444; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
<div class="container">
  <h2>Login</h2>
  
  <input id="email" type="email" placeholder="Email" value="priyamwiza25@gmail.com">
  <input id="password" type="password" placeholder="Password">
  
  <button class="login-btn" onclick="login()">LOGIN</button>
  
  <div class="reset-link">Forgot Password? <a href="#" onclick="resetPass()">Reset</a></div>
  
  <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
  <div id="errorMsg" class="error"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = { 
    apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", 
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com", 
    projectId: "reward-platform-rw-2e13d"
  };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app);

  window.login = async function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMsg');
    errorDiv.innerText = "";

    try {
      await signInWithEmailAndPassword(auth, email, password);
      alert("Login Success! Welcome back 🐒");
      window.location.href = "home.html"; // go to 6 menu buttons
    } catch (e) {
      errorDiv.innerText = "Error: " + e.message;
    }
  }

  window.resetPass = function() {
    const email = document.getElementById('email').value;
    if(!email) { alert("Enter your email first"); return; }
    sendPasswordResetEmail(auth, email)
    .then(() => alert("Password reset email sent to " + email))
    .catch(e => alert(e.message));
  }
</script>
</body>
</html>
