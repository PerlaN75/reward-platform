<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; flex-direction: column; }
    
    .container { background: #3a4a22; padding: 60px 20px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; margin-bottom: 15px; }
    
    h2 { color: white; font-size: 28px; margin-bottom: 5px; font-weight: bold; }
    .tagline { color: #fbbf24; font-size: 13px; margin-bottom: 20px; }
    
    label { display: block; text-align: left; color: #ddd; margin: 12px 0 4px 4px; font-size: 14px; }
    input { width: 100%; padding: 11px 14px; background: #000; border: 2px solid transparent; border-radius: 10px; color: white; font-size: 15px; outline: none; }
    input::placeholder { color: #666; }
    input:focus { border: 2px solid #f59e0b; }
    
    .login-btn { width: 100%; padding: 13px; margin: 16px 0 10px 0; background: linear-gradient(90deg, #fbbf24, #f59e0b, #ec4899); color: black; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; }
    
    .back-btn { width: 40%; max-width: 140px; padding: 11px; background: #f59e0b; color: black; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: bold; }
    
    .register-link { color: #ccc; font-size: 13px; margin-top: 12px; }
    .register-link a { color: #3b82f6; text-decoration: none; font-weight: bold; }
    .error { color: #ef4444; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
<div class="container">
  <h2>Login</h2>
  <div class="tagline">🐒 From Nothing to Something 🍇</div>
  
  <label>Email</label>
  <input id="email" type="email" placeholder="you@gmail.com">
  
  <label>Password</label>
  <input id="password" type="password" placeholder="Password">
  
  <button class="login-btn" onclick="login()">LOGIN</button>
  
  <div class="register-link">Don't have account? <a href="register.html">Register Here</a></div>
  <div id="errorMsg" class="error"></div>
</div>

<button class="back-btn" onclick="window.location.href='index.html'">← Back</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"; // ADDED

  const firebaseConfig = { apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d" };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app);
  const db = getFirestore(app); // ADDED
  
  window.login = async function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.innerText = "";
    
    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password); // CHANGED
      const user = userCredential.user;

      // NEW: Fetch name and save it instantly so home.html loads fast
      const docSnap = await getDoc(doc(db, "users", user.uid));
      if(docSnap.exists()) {
        localStorage.setItem('username', docSnap.data().username);
      }

      window.location.href = "home.html";
    } catch (e) {
      errorMsg.innerText = e.message;
    }
  }
</script>
</body>
</html>
