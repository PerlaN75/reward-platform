<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  
  body {
    background: #3a3f1e; /* dark green */
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .login-box {
    background: #2d3018; /* darker green box */
    padding: 40px 30px;
    border-radius: 24px;
    width: 100%;
    max-width: 380px;
  }

  h2 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 30px;
    font-weight: bold;
  }

  input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 16px;
    border-radius: 12px;
    border: 2px solid #444a2a;
    background: #3a3f1e;
    color: #fff;
    font-size: 15px;
    outline: none;
  }

  input::placeholder {
    color: #aaa;
  }

  .btn-login {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg, #8B5CF6 0%, #3B82F6 100%); /* purple to blue */
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 10px 0 15px 0;
  }

  .forgot {
    text-align: center;
    color: #FFC107; /* yellow */
    font-size: 14px;
    margin-bottom: 20px;
  }

  .forgot a {
    color: #FFC107;
    text-decoration: none;
    font-weight: bold;
  }

  .btn-back {
    display: block;
    width: 140px;
    margin: 0 auto;
    padding: 12px;
    border-radius: 14px;
    background: #FFA000; /* orange */
    color: #000;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
  }
</style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    
    <button class="btn-login">LOGIN</button>
    
    <div class="forgot">
      Forgot Password? <a href="#">Reset</a>
    </div>
    
    <a href="index.html" class="btn-back">← Back</a>
  </div>
</body>
</html>
