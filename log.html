<!DOCTYPE html>
<html>
<head>
  <title>Login - Coins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1"></script>
  <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; -webkit-tap-highlight-color:transparent }
        *:focus{ outline:none !important }
        a,button{ -webkit-tap-highlight-color:transparent; outline:none; user-select:none }
    body { background: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding: 40px 16px 20px 16px; }
.login-card { background: #ffffff; padding: 28px 22px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; border: 2px solid #e5e7eb; box-shadow:0 8px 24px rgba(0,0,0,0.06); }
.logo { font-size: 52px; margin-bottom: 8px; background:#fffbeb; width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 10px auto }
    h1 { color: #111827; font-size: 26px; margin-bottom: 6px; font-weight:900 }
.tagline { color: #6b7280; font-size: 12.5px; margin-bottom: 22px; }
    input { width: 100%; padding: 14px 16px; margin: 8px 0; background: #f9fafb; border: 1.5px solid #e5e7eb; border-radius: 12px; color: #111827; font-size: 14.5px; -webkit-tap-highlight-color:transparent; outline:none }
    input:focus{ border-color:#f59e0b; background:#fff }
    input::placeholder { color: #9ca3af; }
.btn-login { width: 100%; padding: 15px; background: #f59e0b; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 14px; box-shadow: 0 4px 0 #d97706; -webkit-tap-highlight-color:transparent; outline:none; user-select:none }
.btn-login:active { transform: translateY(2px); box-shadow: 0 2px 0 #d97706; filter:brightness(0.95) }
.btn-login:disabled{opacity:0.6;cursor:not-allowed}
.link-register { color: #111827; margin-top: 14px; font-size: 13.5px; cursor: pointer; font-weight:600 }
.link-register span{ color:#d97706 }
.link-reset { color: #d97706; margin-top: 12px; font-size: 13px; cursor: pointer; text-decoration: underline; font-weight:600 }
.error { color: #ef4444; font-size: 13px; margin-top: 10px; background:#fef2f2; padding:8px; border-radius:8px; display:none }
.error:not(:empty){ display:block }
.success { color: #16a34a; font-size: 13px; margin-top: 10px; font-weight: bold; background:#f0fdf4; padding:8px; border-radius:8px; display:none }
.success:not(:empty){ display:block }
.btn-back-outside { width: 40%; padding: 13px; background: white; color: #111827; border: 1.5px solid #e5e7eb; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 22px; box-shadow: 0 2px 0 #e5e7eb; -webkit-tap-highlight-color:transparent; outline:none; user-select:none }
.btn-back-outside:active{ filter:brightness(0.95); transform:scale(0.98) }
.hidden { display: none; }
.recaptcha-note{font-size:10px;color:#9ca3af;margin-top:14px}
  </style>
</head>
<body>
  <div class="login-card">
   <div class="logo">🪙</div>
    <h1 id="cardTitle">Login</h1>
    <div class="tagline">3000 Coins = $1.5 • Earn Coins</div>
    <div id="loginForm">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button class="btn-login" id="loginBtn" onclick="login()">Login</button>
      <div class="link-reset" onclick="showReset()">Forgot Password?</div>
      <div class="link-register" onclick="window.location.href='./reg.html'">Don't have an account? <span>Register</span></div>
      <div class="recaptcha-note">Protected by reCAPTCHA + App Check<br>Min withdraw 3000 Coins = $1.5</div>
    </div>
    <div id="resetStep1" class="hidden">
      <input type="text" id="resetUsername" placeholder="Registered Username" oninput="formatResetUsername()">
      <input type="email" id="resetEmail" placeholder="Registered Email">
      <button class="btn-login" onclick="verifyUser()">Verify</button>
      <div class="link-reset" onclick="showLogin()">Back to Login</div>
    </div>
    <div id="resetStep2" class="hidden">
      <input type="password" id="newPassword" placeholder="New Password">
      <input type="password" id="confirmPassword" placeholder="Confirm Password">
      <button class="btn-login" onclick="resetPassword()">Reset</button>
      <div class="link-reset" onclick="showLogin()">Back to Login</div>
    </div>
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
  </div>
  <button class="btn-back-outside" onclick="window.location.href='./index.html'">Back</button>

<script>
async function getRecaptchaToken(action){
  return new Promise((resolve,reject)=>{
    if(!window.grecaptcha ||!grecaptcha.enterprise){ resolve(null); return; }
    grecaptcha.enterprise.ready(async ()=>{
      try{
        const token = await grecaptcha.enterprise.execute('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', {action: action});
        resolve(token);
      }catch(e){ resolve(null); }
    });
  });
}
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js";
  import { getAuth, signInWithEmailAndPassword, signOut, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d",
    storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
    messagingSenderId: "787550951987",
    appId: "1:787550951987:web:724b1463e821b99c90a146"
  };
  const app = initializeApp(firebaseConfig);
  const appCheck = initializeAppCheck(app, {
    provider: new ReCaptchaEnterpriseProvider('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1'),
    isTokenAutoRefreshEnabled: true
  });
  const auth = getAuth(app);
  const db = getFirestore(app);
  let resetUserData = null;
  let isLogging = false;
  const WHITELIST = ['admin@reward.rw','priyamwiza25@gmail.com','inezarose25@gmail.com'].map(e=>e.toLowerCase());
  function getDeviceId(){
    let id = localStorage.getItem('deviceId');
    if(!id){ id = Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('deviceId', id); }
    return id;
  }
  window.formatResetUsername = function(){
    let val = document.getElementById('resetUsername').value;
    val = val.replace(/[^a-zA-Z]/g, '');
    val = val.charAt(0).toUpperCase() + val.slice(1).toLowerCase();
    document.getElementById('resetUsername').value = val;
  }
  window.login = async function() {
    if(isLogging) return;
    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');
    const email = emailEl.value.trim();
    const emailLow = email.toLowerCase();
    const password = passEl.value;
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    const btn = document.getElementById('loginBtn');
    errorEl.innerText = ""; successEl.innerText = "";
    if(!email ||!password){ errorEl.innerText = "Fill all fields"; return; }
    isLogging = true;
    btn.disabled = true;
    btn.innerText = "Checking security...";
    const token = await window.getRecaptchaToken('LOGIN');
    if(!token){
      errorEl.innerText = "Security check failed. Reload page.";
      isLogging = false; btn.disabled = false; btn.innerText = "Login";
      return;
    }
    btn.innerText = "Logging in...";
    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      let curUser = cred.user;
      if(!curUser.emailVerified){
        try{ await curUser.reload(); curUser = auth.currentUser; }catch(e){}
      }
      if(!curUser.emailVerified){
        const lastSent = parseInt(localStorage.getItem('lastVerifSent')||'0');
        if(Date.now() - lastSent > 60000){
          try{ await sendEmailVerification(curUser); localStorage.setItem('lastVerifSent', Date.now().toString()); }catch(e){}
        }
        await signOut(auth);
        throw new Error("📧 Email not verified. We resent link to "+email+". Verify then login again.");
      }
      const isWhite = WHITELIST.includes(emailLow);
      const myDeviceId = getDeviceId();
      if(!isWhite){
        (async()=>{
          try{
            const q = query(collection(db, "users"), where("emailLower", "==", emailLow));
            const snap = await getDocs(q);
            if(!snap.empty){
              const ref = snap.docs[0].ref;
              const data = snap.docs[0].data();
              const updates = { emailVerified: true };
              if(!data.deviceId || data.deviceId!== myDeviceId){ updates.deviceId = myDeviceId; }
              updateDoc(ref, updates).catch(()=>{});
            }
          }catch(e){}
        })();
      } else {
        (async()=>{
          try{
            const q = query(collection(db, "users"), where("emailLower", "==", emailLow));
            const snap = await getDocs(q);
            if(!snap.empty) updateDoc(snap.docs[0].ref, { emailVerified: true }).catch(()=>{});
          }catch(e){}
        })();
      }
      window.location.replace("./home.html");
      return;
    } catch(e) {
      if(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-login-credentials'){
        errorEl.innerText = "Invalid email or password";
      } else if(e.code === 'auth/user-not-found'){
        errorEl.innerText = "User not found";
      } else if(e.code === 'auth/too-many-requests'){
        errorEl.innerText = "Too many attempts. Wait a minute and try again.";
      } else {
        errorEl.innerText = e.message;
      }
    } finally {
      isLogging = false;
      btn.disabled = false;
      btn.innerText = "Login";
    }
  }
  window.showReset = function(){
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('resetStep1').classList.remove('hidden');
    document.getElementById('cardTitle').innerText = "Reset Password";
    clearMessages();
  }
  window.showLogin = function(){
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('resetStep1').classList.add('hidden');
    document.getElementById('resetStep2').classList.add('hidden');
    document.getElementById('cardTitle').innerText = "Login";
    clearMessages();
  }
  function clearMessages(){
    document.getElementById('error').innerText = "";
    document.getElementById('success').innerText = "";
  }
  function validatePassword(password){
    if(password.length < 5 || password.length > 10) return "Password must be 5-10 characters";
    if(!/[A-Z]/.test(password)) return "Password needs at least 1 capital letter";
    if(!/[0-9]/.test(password)) return "Password needs at least 1 number";
    if(!/[!@#$%^&*(),.?":{}|<>]/.test(password)) return "Password needs at least 1 special character";
    return null;
  }
  window.verifyUser = async function(){
    const token = await window.getRecaptchaToken('VERIFY');
    const username = document.getElementById('resetUsername').value.trim();
    const email = document.getElementById('resetEmail').value.trim();
    const errorEl = document.getElementById('error');
    errorEl.innerText = "";
    if(!username ||!email){ errorEl.innerText = "Enter username and email"; return; }
    try {
      const q = query(collection(db, "users"), where("username", "==", username), where("email", "==", email));
      const snap = await getDocs(q);
      if(snap.empty){
        errorEl.innerText = "Username and Email do not match";
        return;
      }
      resetUserData = { uid: snap.docs[0].id,...snap.docs[0].data() };
      document.getElementById('resetStep1').classList.add('hidden');
      document.getElementById('resetStep2').classList.remove('hidden');
    } catch(e){
      errorEl.innerText = "Error: "+e.message;
    }
  }
  window.resetPassword = async function(){
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    errorEl.innerText = "";
    successEl.innerText = "";
    const passError = validatePassword(newPass);
    if(passError){ errorEl.innerText = passError; return; }
    if(newPass!== confirmPass){ errorEl.innerText = "Passwords do not match"; return; }
    successEl.innerText = "Password rule passed - Contact admin to reset";
    setTimeout(() => { showLogin(); }, 1500);
  }
</script>
</body>
</html>
