<!DOCTYPE html>
<html>
<head><title>Login</title></head>
<body>
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d",
    storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abc123"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      alert("Logged in!");
      window.location.href = "referrals.html";
    } catch (e) {
      alert(e.message);
    }
  }
</script>
</body>
</html>
