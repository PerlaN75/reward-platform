<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Reward Platform</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body {
    background: linear-gradient(135deg, #1a0033 0%, #330066 50%, #1a0033 100%);
    color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-box {
    background: rgba(255,255,255,0.08); padding: 30px; border-radius: 20px;
    backdrop-filter: blur(10px); width: 100%; max-width: 400px;
  }
  .login-box h1 { text-align: center; margin-bottom: 10px; }
  .login-box p { text-align: center; color: #cbd5e1; font-size: 14px; margin-bottom: 25px; }
  
  .input-group { margin-bottom: 15px; }
  .input-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #cbd5e1; }
  .input-group input {
    width: 100%; padding: 12px; background: #000; border: 1px solid #444;
    border-radius: 10px; color: #fff; font-size: 14px; outline: none;
  }
  .input-group input:focus { border-color: #FFD700; }

  .login-btn {
    width: 100%; background: #FFD700; color: #000; border: none; padding: 14px;
    border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
  }
  .login-btn:hover { opacity: 0.9; }

  .footer-link { text-align: center; margin-top: 20px; font-size: 14px; }
  .footer-link a { color: #FFD700; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>

<div class="login-box">
  <h1>Welcome Back</h1>
  <p>Login to continue earning</p>

  <form id="loginForm">
    <div class="input-group">
      <label>Username or Email</label>
      <input type="text" id="username" placeholder="Enter your username" required>
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="login-btn">Login</button>
  </form>

  <div class="footer-link">
    Don't have an account? <a href="reg.html">Register</a>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if(username === '' || password === ''){
    alert('Please fill all fields');
    return;
  }

  // TODO: REPLACE THIS WITH YOUR REAL API LOGIN CHECK
  // Example: fetch('/api/login', {method: 'POST', body: JSON.stringify({username, password})})
  
  // FOR NOW: We simulate successful login
  // 1. SAVE USERNAME TO LOCALSTORAGE - THIS IS CRITICAL FOR REFERRALS
  localStorage.setItem('username', username);
  localStorage.setItem('isLoggedIn', 'true');

  alert('Login Successful! Redirecting...');
  
  // 2. REDIRECT TO DASHBOARD
  window.location.href = 'dashboard.html';
});
</script>

</body>
</html>
