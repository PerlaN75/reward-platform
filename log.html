<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Reward Platform</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  
  body {
    background: #3a3f2a; /* MILITARY GREEN */
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .card {
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 30px 25px;
    border-radius: 20px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 15px;
  }

  h1 { text-align: center; font-size: 28px; margin-bottom: 25px; }

  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border-radius: 10px;
    border: none;
    background: #000;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  input::placeholder { color: #888; }
  input:focus { box-shadow: 0 0 0 2px #FFD700; }

  .btn-login {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #8B5CF6, #3B82F6);
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 15px;
  }

  .forgot { text-align: center; font-size: 14px; margin-bottom: 15px; color: #cbd5e1; }
  .forgot a { color: #FFD700; text-decoration: none; font-weight: bold; }

  .btn-back {
    padding: 14px 40px;
    border-radius: 12px;
    border: none;
    background: #F59E0B;
    color: #000;
    font-weight: bold;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 4px 0 #D97706;
    margin-top: 10px;
  }

  /* CUSTOM POPUP */
  .popup-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  .popup {
    background: #3a3f2a;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    border: 2px solid #FFD700;
    box-shadow: 0 0 20px rgba(255,215,0,0.3);
    max-width: 320px;
  }
  .popup h2 { color: #EF4444; margin-bottom: 10px; font-size: 20px; }
  .popup.success h2 { color: #22c55e; } /* Green for success */
  .popup p { color: #fff; margin-bottom: 20px; white-space: pre-line; }
  .popup-btn {
    background: #FFD700;
    color: #000;
    border: none;
    padding: 10px 30px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Login</h1>
    
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      
      <button type="submit" class="btn-login">LOGIN</button>
    </form>

    <p class="forgot">Forgot Password? <a href="#">Reset</a></p>
  </div>

  <a href="index.html" class="btn-back">← Back</a>

  <!-- CUSTOM POPUP HTML -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup" id="popupBox">
      <h2 id="popupTitle">Error!</h2>
      <p id="popupMessage"></p>
      <button class="popup-btn" onclick="closePopup()">OK</button>
    </div>
  </div>

<script>
  // POPUP FUNCTIONS
  function showPopup(title, message, type = 'error') {
    document.getElementById('popupTitle').innerText = title;
    document.getElementById('popupMessage').innerText = message;
    document.getElementById('popupBox').className = 'popup ' + type;
    document.getElementById('popupOverlay').style.display = 'flex';
  }
  function closePopup() {
    document.getElementById('popupOverlay').style.display = 'none';
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    
    const usernameInput = document.getElementById('username').value.trim();
    const passwordInput = document.getElementById('password').value;

    if(usernameInput === "" || passwordInput === ""){
      showPopup("Missing Info", "Please fill all fields");
      return;
    }

    // 1. GET USERS FROM "DATABASE" - SAME KEY AS REG.HTML
    let users = JSON.parse(localStorage.getItem("users")) || [];

    // 2. DEBUG: If no users at all, tell them
    if(users.length === 0){
      showPopup("No Accounts Found", "No accounts registered yet. Please go register first.");
      return;
    }

    // 3. CHECK IF USER EXISTS + PASSWORD MATCHES - CASE SENSITIVE
    const user = users.find(u => u.username === usernameInput && u.password === passwordInput);

    if(!user){
      // Show what usernames exist to help debug
      let existingNames = users.map(u => u.username).join(", ");
      showPopup("Login Failed", `User not found or wrong password.\n\nRegistered users: ${existingNames}`);
      return;
    }

    // 4. SAVE CURRENT USER + POINTS FOR HOME PAGE
    localStorage.setItem("currentUser", user.username); // use "currentUser" to avoid conflict
    localStorage.setItem("points", user.points);
    
    showPopup("Success", `Welcome back, ${user.username}!`, 'success');
    
    // 5. REDIRECT AFTER 1.5s
    setTimeout(() => {
      window.location.href = "home.html";
    }, 1500);
  });
</script>

</body>
</html>
