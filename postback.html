<!DOCTYPE html>
<html><head><title>Postback</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>Postback processing...
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
async function run(){
  const p=new URLSearchParams(location.search);
  const subid=p.get('subid'); // OGAds sends subid=USERID_OFFERID_TIMESTAMP
  const secret=p.get('secret');
  if(secret!=='REWARD2026'){ document.body.innerHTML='Invalid secret'; return; }
  if(!subid){ document.body.innerHTML='No subid'; return; }
  try{
    const parts=subid.split('_');
    const uid=parts[0];
    const clickRef=db.collection('users').doc(uid).collection('offerClicks').doc(subid);
    const snap=await clickRef.get();
    if(!snap.exists){ document.body.innerHTML='Click not found: '+subid; return; }
    const data=snap.data();
    if(data.status==='completed'){ document.body.innerHTML='Already completed'; return; }
    // Add coins
    const userRef=db.collection('users').doc(uid);
    await db.runTransaction(async t=>{
      const u=await t.get(userRef);
      const newBal=(u.data().balance||0)+data.coins;
      t.update(userRef,{balance:newBal});
      t.update(clickRef,{status:'completed', completedAt:firebase.firestore.FieldValue.serverTimestamp()});
      const histRef=userRef.collection('earnHistory').doc();
      t.set(histRef,{action:'Offers Earn (Postback)', desc:data.offerId, coins:data.coins, timestamp:firebase.firestore.FieldValue.serverTimestamp()});
    });
    document.body.innerHTML='OK - Paid '+data.coins+' to '+uid;
  }catch(e){ document.body.innerHTML='Error: '+e.message; }
}
run();
</script>
</body>
</html>
