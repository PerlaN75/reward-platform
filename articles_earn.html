<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Articles Earn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
html, body {
  overscroll-behavior-y: contain;
  overscroll-behavior: none;
  overscroll-behavior-y: none;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
}
body{background:#fff;min-height:100vh;padding:0 0 100px 0;color:#000;overflow-x:hidden}
.header{background:#2f3e1a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header b{color:#fbbf24;font-size:16px}
.header .x{color:#fff;font-size:22px;cursor:pointer;background:none;border:none}
.balance-bar{background:#fffbeb;border:2px solid #fbbf24;border-radius:12px;margin:10px 14px;padding:8px 12px;display:flex;justify-content:space-between}
.ad-box{background:#f3f4f6;border:1px dashed #bbb;border-radius:8px;margin:10px 14px;min-height:70px;display:flex;align-items:center;justify-content:center;text-align:center}
.article-card{background:#fff;border:2px solid #e5e7eb;border-radius:14px;margin:10px 14px;padding:12px;display:flex;gap:10px;cursor:pointer}
.article-card.done{opacity:0.5;pointer-events:none;border-color:#22c55e}
.article-thumb{width:80px;height:60px;background:#ddd;border-radius:8px;flex-shrink:0;object-fit:cover}
.article-info{flex:1}
.article-info b{font-size:13px;display:block;margin-bottom:4px}
.article-info span{font-size:11px;color:#666}
.read-btn{background:#a855f7;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:bold;margin-top:4px}
.progress-bar{background:#e5e7eb;height:6px;border-radius:99px;margin:8px 14px;overflow:hidden}
.progress-fill{background:#22c55e;height:100%;width:0%;transition:0.3s}
#timerModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999;justify-content:center;align-items:center;padding:14px}
.modal-box{background:#2f3e1a;border:3px solid #fbbf24;border-radius:20px;padding:18px;width:100%;max-width:420px;color:#fff;max-height:95vh;overflow-y:auto}
#customToast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2f3e1a;border:2px solid #fbbf24;color:#fff;padding:12px 20px;border-radius:12px;font-weight:bold;z-index:99999;display:none}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>

<div class="header">
  <b>📰 Articles Earn</b>
  <button class="x" onclick="location.href='./home.html'">✕</button>
</div>

<div class="balance-bar">
  <span>💰 <b id="coinBal">0</b> coins</span>
  <span>📖 <b id="doneCount">0</b>/10 today</span>
</div>

<div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>

<!-- TOP AD 468x60 -->
<div id="topAdBox" class="ad-box">Top Ad 468x60</div>

<div id="articlesList"></div>

<!-- MID AD 300x250 -->
<div id="midAdBox" class="ad-box" style="min-height:260px">Mid Ad 300x250</div>

<div id="customToast"></div>

<!-- TIMER MODAL -->
<div id="timerModal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between"><h3 id="modalTitle">Reading...</h3><span onclick="closeModal()" style="font-size:22px;cursor:pointer">✕</span></div>
    <div id="modalAd1" class="ad-box" style="background:#000;margin:10px 0;min-height:60px">Ad 468x60</div>
    <div id="articleContent" style="background:#000;padding:12px;border-radius:10px;font-size:13px;line-height:1.5;margin:10px 0;max-height:200px;overflow-y:auto"></div>
    <div id="modalAd2" class="ad-box" style="background:#000;margin:10px 0;min-height:250px">Ad 300x250</div>
    <div style="text-align:center;margin:10px 0">
      <div id="timerText" style="font-size:28px;color:#fbbf24;font-weight:bold">12s</div>
      <div style="font-size:11px;color:#aaa">Keep reading to earn 2 coins</div>
    </div>
    <div class="progress-bar"><div id="timerFill" class="progress-fill"></div></div>
  </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();

const ARTICLES=[
{t:"Rwanda launches new tech hub in Kigali",c:"Rwanda has launched a new innovation hub to support young entrepreneurs..."},
{t:"How to earn money online in 2026",c:"There are many ways to earn money online, reading articles is one of the easiest..."},
{t:"1win bonuses for new players",c:"1win offers great bonuses for new players in Rwanda..."},
{t:"Crypto market update today",c:"Bitcoin reaches new high as investors..."},
{t:"Best phones under $200 in Rwanda",c:"Looking for affordable phones? Here are best options..."},
{t:"Health tips: Drink more water",c:"Water is essential for your body, health experts say..."},
{t:"Football: Rwanda vs Kenya match",c:"The national team prepares for upcoming match..."},
{t:"How to save money daily",c:"Small savings can become big money over time..."},
{t:"New movie coming this week",c:"Hollywood releases new action movie..."},
{t:"Education: Online courses free",c:"Free online courses available for Rwandan students..."},
{t:"Weather forecast Kigali",c:"Kigali weather this week will be sunny..."},
{t:"Business ideas 2026",c:"Top business ideas for 2026 in Africa..."}
];

let currentUser=null,userData={},currentArticle=null,timer=null,timeLeft=12;
let todayStr=new Date().toISOString().split('T')[0];

function showToast(m){const t=document.getElementById('customToast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function loadLocal(){try{return JSON.parse(localStorage.getItem('userData')||'{}')}catch(e){return{}}}
function getDone(){const k='articlesEarn_'+todayStr;return parseInt(localStorage.getItem(k)||'0')}
function setDone(n){const k='articlesEarn_'+todayStr;localStorage.setItem(k,n)}

function renderArticles(){
  const done=getDone();
  const list=document.getElementById('articlesList');
  list.innerHTML='';
  ARTICLES.slice(0,10).forEach((a,i)=>{
    const isDone=i<done;
    const div=document.createElement('div');
    div.className='article-card'+(isDone?' done':'');
    div.innerHTML=`<div class="article-thumb" style="background:#a855f7;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px">📰</div>
    <div class="article-info"><b>${a.t}</b><span>2 coins • 12s read</span><br><button class="read-btn">${isDone?'✓ Done':'Read'}</button></div>`;
    div.onclick=()=>{if(!isDone) openArticle(a,i)};
    list.appendChild(div);
  });
  document.getElementById('doneCount').innerText=done;
  document.getElementById('progressFill').style.width=(done/10*100)+'%';
  if(done>=10){showToast('Come back tomorrow +5 bonus');}
}

function openArticle(a,idx){
  if(getDone()>=10) return showToast('Limit 10/day');
  currentArticle={...a,idx};
  document.getElementById('modalTitle').innerText=a.t;
  document.getElementById('articleContent').innerText=a.c+'\n\n'+a.c+'\n\n'+a.c;
  document.getElementById('timerModal').style.display='flex';
  timeLeft=12;
  document.getElementById('timerText').innerText=timeLeft+'s';
  document.getElementById('timerFill').style.width='0%';
  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft--;
    document.getElementById('timerText').innerText=timeLeft+'s';
    document.getElementById('timerFill').style.width=((12-timeLeft)/12*100)+'%';
    if(timeLeft<=0){clearInterval(timer); finishArticle();}
  },1000);
}
function closeModal(){clearInterval(timer);document.getElementById('timerModal').style.display='none';}
async function finishArticle(){
  closeModal();
  // Monetag Pop - after reading
  if(canShowPop()){
    try{/* your monetag pop code here */ localStorage.setItem('lastPop',Date.now())}catch(e){}
  }
  const newDone=getDone()+1;
  setDone(newDone);
  // update coins
  const pts=2;
  let data=loadLocal();
  data.balance=(data.balance||0)+pts;
  localStorage.setItem('userData',JSON.stringify(data));
  document.getElementById('coinBal').innerText=data.balance;
  // Firestore
  if(currentUser){
    try{
      const ref=db.collection('users').doc(currentUser.uid);
      await ref.update({balance: firebase.firestore.FieldValue.increment(pts), ['articlesEarn_'+todayStr]: newDone, articlesEarn_date: todayStr});
      await ref.collection('earnHistory').add({action:'Articles Earn',points:pts,desc:currentArticle.t,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
    }catch(e){}
  }
  showToast('+2 coins added!');
  renderArticles();
  // bonus 5 coins at 10
  if(newDone===10){
    let d=loadLocal(); d.balance=(d.balance||0)+5; localStorage.setItem('userData',JSON.stringify(d));
    if(currentUser){ try{ await db.collection('users').doc(currentUser.uid).update({balance:firebase.firestore.FieldValue.increment(5)}); }catch(e){} }
    showToast('Bonus +5 coins!');
  }
}

// Ads refresh every 30s - NOT page refresh
setInterval(()=>{
  if(document.getElementById('timerModal').style.display==='flex') return;
  // reload banners here - your Adsterra code
  // document.getElementById('topAdBox').innerHTML = ... new ad
},30000);

function canShowPop(){const last=parseInt(localStorage.getItem('lastPop')||'0');return Date.now()-last>60*60*1000;}
function canShowVignette(){const last=parseInt(localStorage.getItem('lastVig')||'0');return Date.now()-last>30*60*1000;}

auth.onAuthStateChanged(async u=>{
  if(u){currentUser=u; const doc=await db.collection('users').doc(u.uid).get(); if(doc.exists){const d=doc.data(); localStorage.setItem('userData',JSON.stringify(d)); userData=d; document.getElementById('coinBal').innerText=d.balance||0;} }
  else{const d=loadLocal(); document.getElementById('coinBal').innerText=d.balance||0;}
});
renderArticles();

// BLOCK PULL-TO-REFRESH - FIX FOR YOUR QUESTION
let startY=0;
document.addEventListener('touchstart', e=>{
  startY=e.touches[0].pageY;
},{passive:false});
document.addEventListener('touchmove', e=>{
  const y=e.touches[0].pageY;
  const isTop=window.scrollY<=0;
  if(isTop && y>startY){
    e.preventDefault();
  }
},{passive:false});
document.addEventListener('touchend', ()=>{startY=0;});
window.addEventListener('beforeunload', ()=>{clearInterval(timer);});
</script>
</body>
</html>
