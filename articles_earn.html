function hashString(str){let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}return Math.abs(h);}
function mulberry32(a){return function(){var t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;}}
function getDailyArticles(){
  const today=new Date().toISOString().split('T')[0];
  const seed=hashString(today);
  const rand=mulberry32(seed);
  let arr=[...ARTICLES_POOL];
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  const selected=arr.slice(0,10);
  const poolEl=document.getElementById('poolInfo');
  if(poolEl) poolEl.innerText=`📅 ${today} • ${selected.length}/10 • Shuffle daily`;
  return selected;
}

  if(done.length<10){ showToast(`Complete ${10-done.length} more articles`); return; }
  if(document.getElementById('timerModal').style.display==='flex')return;
  const now=Date.now()/1000;
  if(now-lastEarnTime<EARN_COOLDOWN){showToast(`Wait ${Math.ceil(EARN_COOLDOWN-(now-lastEarnTime))}s`);return;}
  sec=BONUS_SEC;
  document.getElementById('timerNum').innerText=sec;
  document.getElementById('modalTitle').innerText='🎁 Bonus 5 Coins';
  document.getElementById('modalIcon').innerText='🎁';
  document.getElementById('articleBox').innerText='Keep this open for 12 seconds to claim your bonus. Verifying...';
  document.getElementById('articleBox').scrollTop=0;
  document.getElementById('modalDesc').innerText='Bonus verification...';
  document.getElementById('adHint').innerText='Loading bonus...';
  document.getElementById('distractPhase').style.display='block';
  document.getElementById('distractPhase').innerText='🎁 DAILY BONUS';
  document.getElementById('adGateInside').style.display='none';
  document.getElementById('timerModal').style.display='flex';
  loadVignette();
  setTimeout(()=>{
    document.getElementById('distractPhase').style.display='none';
    document.getElementById('adGateInside').style.display='block';
    document.getElementById('modalTitle').innerText='Bonus Verifying...';
    document.getElementById('modalDesc').innerText='Keep open 12s to claim 5 coins';
    document.getElementById('adHint').innerText='🔒 Verifying bonus...';
    tmr=setInterval(async()=>{
      sec--;document.getElementById('timerNum').innerText=sec;
      if(sec<=0){clearInterval(tmr);document.getElementById('timerModal').style.display='none';await claimBonus();}
    },1000);
  },2200);
}
async function claimAd(){
  if(isClaiming) return; isClaiming=true;
  if(done.includes(cur)){ isClaiming=false; return showToast('Already claimed'); }
  let cfg=tasksConfig[cur];
  if(cfg.tier==='premium') loadPop();
  if(done.length>=10){ isClaiming=false; return; }
  done=[...new Set([...done, cur])];
  total+=cfg.reward;
  saveLocal();
  render();
  if(currentUser){
    try{
      await db.collection('users').doc(currentUser.uid).set({
        balance: firebase.firestore.FieldValue.increment(cfg.reward),
        coins: firebase.firestore.FieldValue.increment(cfg.reward),
        lastEarnAt: firebase.firestore.FieldValue.serverTimestamp(),
        articlesEarn_date:getToday(),
        articlesEarn_done:done,
        articlesEarn_total:total
      },{merge:true});
      await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({
        action:'Articles Earn',coins:cfg.reward,
        desc:`${cfg.title} +${cfg.reward} coins - ${getToday()}`,
        timestamp:firebase.firestore.FieldValue.serverTimestamp(),
        taskId:cur, date:getToday()
      });
      lastEarnTime=Date.now()/1000;
      showToast(`✓ +${cfg.reward} 🪙 added! ${done.length}/10`);
    }catch(e){ 
      showToast(e.message);
      done=done.filter(x=>x!==cur); total-=cfg.reward; saveLocal(); render();
    }
  } else {
    lastEarnTime=Date.now()/1000;
    showToast(`✓ +${cfg.reward} 🪙 added! ${done.length}/10`);
  }
  isClaiming=false;
}
async function claimBonus(){
  if(isClaiming) return; isClaiming=true;
  if(bonusClaimed){ isClaiming=false; return showToast('Already claimed'); }
  if(done.length<10){ isClaiming=false; return showToast(`Need ${10-done.length} more`); }
  loadPop();
  bonusClaimed=true;
  total+=BONUS_REWARD;
  saveLocal();
  render();
  if(currentUser){
    try{
      await db.collection('users').doc(currentUser.uid).set({
        balance: firebase.firestore.FieldValue.increment(BONUS_REWARD),
        coins: firebase.firestore.FieldValue.increment(BONUS_REWARD),
        lastEarnAt: firebase.firestore.FieldValue.serverTimestamp(),
        articlesEarn_bonus:getToday(),
        articlesEarn_date:getToday(),
        articlesEarn_done:done,
        articlesEarn_total:total
      },{merge:true});
      await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({
        action:'Articles Earn Bonus',coins:BONUS_REWARD,
        desc:`Bonus +${BONUS_REWARD} coins for 10 articles - ${getToday()}`,
        timestamp:firebase.firestore.FieldValue.serverTimestamp(),
        date:getToday()
      });
      lastEarnTime=Date.now()/1000;
      showToast(`🎁 Bonus +${BONUS_REWARD} 🪙 added!`);
    }catch(e){ showToast(e.message); bonusClaimed=false; total-=BONUS_REWARD; saveLocal(); render(); }
  }
  isClaiming=false;
}
auth.onAuthStateChanged(async u=>{
  if(!u){location.href='./index.html';return;}
  currentUser=u;
  try{
    const doc=await db.collection('users').doc(u.uid).get();
    if(doc.exists){
      userData=doc.data();
      const today=getToday();
      const fbDate=userData.articlesEarn_date||'';
      if(fbDate!==today && fbDate!==''){
        done=[]; total=0; bonusClaimed=false;
        saveLocal();
        await db.collection('users').doc(u.uid).set({
          articlesEarn_date: today,
          articlesEarn_done: [],
          articlesEarn_total: 0,
          articlesEarn_bonus: firebase.firestore.FieldValue.delete()
        },{merge:true});
      } else if(fbDate===today){
        const fbDone=userData.articlesEarn_done||[];
        done=[...new Set(fbDone)].filter(x=>x>=0 && x<=9);
        total=userData.articlesEarn_total||0;
        bonusClaimed=(userData.articlesEarn_bonus===today);
        let realTotal=0;
        done.forEach(id=>{ const c=tasksConfig.find(t=>t.id===id); if(c) realTotal+=c.reward; });
        if(bonusClaimed) realTotal+=BONUS_REWARD;
        if(total!==realTotal) total=realTotal;
        saveLocal();
      }
      if(userData.lastEarnAt && userData.lastEarnAt.toMillis) lastEarnTime=userData.lastEarnAt.toMillis()/1000;
    }
  }catch(e){ console.error(e); }
  render();
});
render();
</script>
