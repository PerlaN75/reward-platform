<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>Articles & Earn</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f3ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 14px;color:#111827}
.top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;width:100%;max-width:500px;border-radius:0 0 16px 16px}
.back-btn{width:45px;height:30px;border-radius:10px;background:#fff;border:2px solid #fecaca;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#991b1b;font-weight:900;font-size:22px}
.center-pill{background:#fff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%)}
.main-card{width:100%;max-width:500px;background:#fff;border:2px solid #ede9fe;border-radius:20px;padding:12px;margin-top:14px}
.balance-box{background:linear-gradient(180deg,#1a2e0a,#12230a);border:2px solid #fbbf24;border-radius:16px;padding:10px;text-align:center;color:#fff}
.balance-value{color:#fbbf24;font-size:20px;font-weight:900}
.status{font-size:11px;color:#facc15;margin-top:4px}
.article-box{border:2px solid #ede9fe;border-radius:16px;padding:14px;margin-top:12px;background:#fff}
.article-title{font-weight:900;font-size:15px;color:#111827}
.article-text{font-size:13px;color:#374151;margin-top:8px;line-height:1.6;max-height:300px;overflow:auto}
.btn{width:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:0;border-radius:12px;padding:12px;font-weight:900;font-size:14px;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.5}
.lock-box{background:#fef3c7;border:2px solid #fbbf24;border-radius:14px;padding:14px;text-align:center;margin-top:10px}
.bubble{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fbbf24;color:#000;padding:10px 18px;border-radius:999px;font-weight:900;z-index:10000;display:none}
</style>
</head>
<body>
<div id="bubble" class="bubble"></div>
<div class="top-bar"><a href="home.html" class="back-btn">‹</a><div class="center-pill">📰 Articles & Earn</div><div style="width:45px"></div></div>
<main class="main-card">
<section class="balance-box">
<div style="color:#d1d5db;font-size:11px">Your Balance</div>
<div class="balance-value" id="bal">-- 🪙</div>
<div style="font-size:12px;color:#e5e7eb;margin-top:3px">Articles today: <strong id="today">0/5</strong></div>
<div class="status" id="status">Checking...</div>
</section>

<div id="lockPanel" class="lock-box" style="display:none">
<div style="font-size:15px;font-weight:900;color:#92400e">🔒 Articles locked</div>
<div id="lockMsg" style="font-size:13px;margin-top:6px;font-weight:800">Opens after Quiz</div>
</div>

<section id="contentBox">
<div id="articlesList"></div>
</section>
</main>

<script>
(() => {
"use strict";
const ARTICLES = [
{id:"a1",title:"How to Save Money Daily",text:"Saving money starts with small habits. Track your expenses, set a daily limit, and avoid impulse buying. Even 500 RWF a day becomes 15,000 RWF a month. Consistency is the key to financial freedom.",reward:2},
{id:"a2",title:"Benefits of Reading",text:"Reading improves focus, vocabulary, and mental health. Just 10 minutes a day can reduce stress by 60%. Make reading part of your daily routine.",reward:2},
{id:"a3",title:"Healthy Living Tips",text:"Drink 2L water, walk 30 minutes, sleep 7-8 hours. Small healthy choices compound over time into a strong body and clear mind.",reward:2},
{id:"a4",title:"How to Stay Focused",text:"Remove distractions, set a timer for 25 minutes, work, then take 5 min break. This Pomodoro technique boosts productivity.",reward:2},
{id:"a5",title:"Why Learn New Skills",text:"The world changes fast. Learning a new skill every month keeps you relevant and opens new income opportunities.",reward:2}
];
const DAILY_LIMIT=5, WINDOW_MS=30*60*1000, DAY_MS=24*60*60*1000;
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
const el=id=>document.getElementById(id);
const balEl=el("bal"), todayEl=el("today"), statusEl=el("status"), lockPanel=el("lockPanel"), lockMsg=el("lockMsg"), listEl=el("articlesList"), contentBox=el("contentBox");
let currentUser=null, balance=0, todayCount=0, readIds=[], unsubscribe=null, timer=null;

function showBubble(m){const b=el("bubble");b.textContent=m;b.style.display="block";clearTimeout(showBubble.t);showBubble.t=setTimeout(()=>b.style.display="none",2200);}
function localDayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function getChain(){try{return JSON.parse(localStorage.getItem('chain_v2')||'{}');}catch(e){return {};}}
function saveChain(c){localStorage.setItem('chain_v2',JSON.stringify(c));}
function formatRemaining(ms){if(ms<=0)return"0m";const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);if(h>0)return `${h}h ${m}m`;if(m>0)return `${m}m ${s}s`;return `${s}s`;}

// ADS REMOVED - will reset later
// const ADS_BLOCK = ``;

function checkArticlesState(){
  const c=getChain(), now=Date.now();
  // not yet unlocked? Watch or Quiz still active
  if(!c.articles_open && !c.quiz_skippedToday && !c.quiz_doneToday){
    // if quiz still live, articles locked
    if(c.quiz_open && c.quiz_expiry && now < c.quiz_expiry){
      lockPanel.style.display="block"; contentBox.style.display="none";
      lockMsg.textContent=`Opens after Quiz - ${formatRemaining(c.quiz_expiry - now)}`;
      return true; // locked
    }
    if(!c.quiz_open){
      lockPanel.style.display="block"; contentBox.style.display="none";
      lockMsg.textContent=`Complete Watch & Quiz first`;
      return true;
    }
  }
  // Articles live window
  if(c.articles_open && c.articles_expiry){
    const diff = c.articles_expiry - now;
    if(diff > 0){
      lockPanel.style.display="none"; contentBox.style.display="block";
      statusEl.textContent=`Live ${formatRemaining(diff)} • ${todayCount}/${DAILY_LIMIT}`;
      if(timer) clearInterval(timer);
      timer=setInterval(()=>{
        const d=c.articles_expiry - Date.now();
        if(d<=0){clearInterval(timer); onArticlesExpired(); checkArticlesState();}
        else statusEl.textContent=`Live ${formatRemaining(d)} • ${todayCount}/${DAILY_LIMIT}`;
      },1000);
      return false; // open
    } else {
      onArticlesExpired();
      return true;
    }
  }
  // 24h lock
  if(c.articles_nextAvail && now < c.articles_nextAvail){
    lockPanel.style.display="block"; contentBox.style.display="none";
    const diff=c.articles_nextAvail - now;
    lockMsg.textContent=`Opens in ${formatRemaining(diff)}`;
    if(timer) clearInterval(timer);
    timer=setInterval(()=>{const d=c.articles_nextAvail - Date.now(); if(d<=0){clearInterval(timer); lockPanel.style.display="none"; contentBox.style.display="block";} else lockMsg.textContent=`Opens in ${formatRemaining(d)}`;},1000);
    return true;
  }
  // first time open logic - if quiz done/skipped, open articles
  if((c.quiz_doneToday || c.quiz_skippedToday) && !c.articles_open){
    openArticlesNow();
    return false;
  }
  return false;
}

function openArticlesNow(){
  const now=Date.now(), c=getChain();
  if(c.articles_open) return;
  c.articles_open=now;
  c.articles_expiry=now+WINDOW_MS;
  c.articles_nextAvail=now+DAY_MS;
  c.articles_doneToday=false;
  saveChain(c);
  if(currentUser) db.collection("users").doc(currentUser.uid).set({chain:{articles_open:now,articles_expiry:c.articles_expiry,updated:firebase.firestore.FieldValue.serverTimestamp()}},{merge:true});
}

function onArticlesExpired(){
  const now=Date.now(), c=getChain();
  if(c.articles_doneToday) return;
  c.articles_open=null;
  c.articles_expiry=null;
  c.articles_nextAvail=now+DAY_MS;
  c.articles_doneToday=true;
  c.watch_nextAvail=now+DAY_MS;
  c.quiz_nextAvail=now+DAY_MS;
  c.watch_finishedToday=localDayKey();
  saveChain(c);
  lockPanel.style.display="block"; contentBox.style.display="none";
  lockMsg.textContent=`Closed - Opens tomorrow`;
  showBubble("Articles closed for today");
}

function renderArticles(){
  listEl.innerHTML="";
  const available=ARTICLES.filter(a=>!readIds.includes(a.id));
  if(available.length===0 || todayCount>=DAILY_LIMIT){
    listEl.innerHTML=`<div class="article-box"><div class="article-title">🎉 All done for today</div><div class="article-text">Come back tomorrow for new articles.</div></div>`;
    return;
  }
  available.forEach(a=>{
    const div=document.createElement("div");
    div.className="article-box";
    div.innerHTML=`<div class="article-title">${a.title}</div><div class="article-text">${a.text}</div><button class="btn" data-id="${a.id}">Read & Earn +${a.reward}</button>`;
    listEl.appendChild(div);
  });
  listEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click",()=>claimArticle(btn.dataset.id, btn));
  });
}

async function claimArticle(id, btnEl){
  if(!currentUser) return;
  const article=ARTICLES.find(a=>a.id===id);
  if(!article || readIds.includes(id)) return;
  if(btnEl) btnEl.disabled=true;
  const userRef=db.collection("users").doc(currentUser.uid), todayKey=localDayKey();
  try{
    await db.runTransaction(async t=>{
      const snap=await t.get(userRef); if(!snap.exists) throw new Error("No account");
      const data=snap.data()||{}, savedDay=data.articleDay||todayKey;
      let count=Number(data.articleCount||0), ids=Array.isArray(data.articleIds)?data.articleIds.slice():[];
      if(savedDay!==todayKey){count=0;ids=[];}
      if(count>=DAILY_LIMIT||ids.includes(id)) throw new Error("Done");
      const oldBal=Number(data.balance??data.coins??0);
      t.update(userRef,{balance:oldBal+article.reward,coins:oldBal+article.reward,articleCount:count+1,articleIds:ids.concat(id),articleDay:todayKey,lastArticleDate:firebase.firestore.FieldValue.serverTimestamp()});
    });
    showBubble(`+${article.reward} coins`);
  }catch(e){showBubble("Already collected"); if(btnEl) btnEl.disabled=false;}
}

async function refreshDailyIfNeeded(data){
  const todayKey=localDayKey();
  if(data.articleDay===todayKey) return;
  const userRef=db.collection("users").doc(currentUser.uid);
  try{
    await db.runTransaction(async t=>{
      const snap=await t.get(userRef); if(!snap.exists) return;
      const latest=snap.data()||{}; if(latest.articleDay===todayKey) return;
      t.update(userRef,{articleCount:0,articleIds:[],articleDay:todayKey});
    });
  }catch(e){}
}

auth.onAuthStateChanged(user=>{
  if(!user){location.href="./index.html";return;}
  currentUser=user;
  if(unsubscribe) unsubscribe();
  unsubscribe=db.collection("users").doc(user.uid).onSnapshot(async snap=>{
    if(!snap.exists){statusEl.textContent="No account";return;}
    const data=snap.data()||{};
    if(data.articleDay!==localDayKey()) await refreshDailyIfNeeded(data);
    balance=Number(data.balance??data.coins??0);
    todayCount=Number(data.articleCount||0);
    readIds=Array.isArray(data.articleIds)?data.articleIds:[];
    if(data.chain){const local=getChain();let ch=false;for(let k in data.chain){if(data.chain[k]&&!local[k]){local[k]=data.chain[k];ch=true;}} if(ch) saveChain(local);}
    balEl.textContent=`${balance} 🪙 coins`;
    todayEl.textContent=`${Math.min(todayCount,DAILY_LIMIT)}/${DAILY_LIMIT}`;
    if(!checkArticlesState()){
      renderArticles();
    }
  });
});
})();
</script>
</body>
</html>
