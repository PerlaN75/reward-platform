{title:"What is Bitcoin? Beginner Guide 2026",cat:"CRYPTO",icon:"₿",excerpt:"Learn how Bitcoin started in 2009 and why world calls it digital gold today.",text:`WHAT IS BITCOIN? BEGINNER GUIDE 2026 - WIDE READ

Bitcoin was created in 2009 by Satoshi Nakamoto, an anonymous person or group. The whitepaper was titled Bitcoin: A Peer-to-Peer Electronic Cash System.

2. HOW IT WORKS:
It works on blockchain. Imagine a public notebook that every computer in world holds a copy of. When you send 0.001 BTC to friend, everyone writes it. No one can erase. That's why it's secure.

3. WHY CALLED DIGITAL GOLD?
Like gold, it's rare. You must mine it using computers solving math. Mining uses electricity. In Rwanda, mining not profitable due to power cost, but holding is.

4. HOW PRICE MOVES?
In 2010, 1 BTC = $0.003. In 2021, 1 BTC = $69,000. In 2026, around $60k-$100k. Volatile but long term up.

5. HOW TO USE IN RWANDA?
You can't pay in shop yet, but you can: Save as investment, Receive from abroad, Convert to USDT then to MoMo via Binance P2P.

6. KEY TERMS TO KNOW:
Wallet = App that holds keys. Seed phrase = 12 words = your password to everything. Never share. Private key = secret code. If someone gets it, they take money.

Takeaway: Bitcoin is not get-rich-quick. It's long term savings technology. Learn, hold small amount, keep safe. Don't invest more than you can lose. Scroll up to re-read and stay full time to earn.

Never give up learning.`},
{title:"USDT Explained: Why $1 = 1 USDT?",cat:"CRYPTO",icon:"💵",excerpt:"Stablecoin that never moves - why platforms pay you in USDT.",text:`USDT EXPLAINED: WHY $1 = 1 USDT? - WIDE READ

{title:"How Blockchain Works - Simple Notebook Example",cat:"TECH",icon:"⛓️",excerpt:"Imagine a notebook everyone can see but no one can erase - that's blockchain.",text:`HOW BLOCKCHAIN WORKS - SIMPLE NOTEBOOK EXAMPLE - WIDE READ

Blockchain is not magic. It's just a notebook system.

CHAPTER 1: OLD SYSTEM (Bank)
You have bank account. Bank has private notebook. They write: Jean has 10k RWF. If bank wants to cheat, they can change. You can't see. You must trust bank.

CHAPTER 2: NEW SYSTEM (Blockchain)
Imagine class of 100 students. Each has same notebook. When Jean sends 500 to Ali, teacher shouts: Everyone write: Jean -> Ali 500. Everyone writes. If one student tries to cheat and writes Jean -> Himself 5000, other 99 notebooks disagree, his page rejected.

That's blockchain.

TECHNICAL BREAKDOWN:
Block = page of notebook containing ~2000 transactions. Chain = pages glued together with special code (hash). Each block contains hash of previous block. If you try to change old transaction in block 5, hash changes, then block 6 hash invalid, then 7, etc. Must redo all. Impossible if many computers watching.

3 TYPES:
1. Bitcoin blockchain: only does money transfers.
2. Ethereum blockchain: can run programs (smart contracts).
3. Private blockchain: used by banks.

WHY SLOW?
Because every computer must agree. Bitcoin does 7 transactions per second. Visa does 65,000. So blockchain trades speed for security and decentralization.

MINING / VALIDATORS:
Who writes pages? Miners or validators. They use electricity/computer to solve puzzle. Winner gets to write page and earns reward (6.25 BTC). This competition secures network.

IN RWANDA CONTEXT:
We can use blockchain for: Land titles (no more fake titles), Coffee traceability (Musanze coffee from farm to cup), Voting.

You are earning by learning blockchain. Stay, scroll, re-read to complete timer.`},

{title:"How to Keep Crypto Wallet Safe - Seed Phrase",cat:"SECURITY",icon:"🔒",excerpt:"Your 12 words = your bank. Lose it = lose money forever.",text:`HOW TO KEEP CRYPTO WALLET SAFE - SEED PHRASE - WIDE READ

{title:"Binance Guide for Rwandans - P2P Explained",cat:"CRYPTO",icon:"🟡",excerpt:"How to receive USDT and convert to MoMo RWF safely.",text:`BINANCE GUIDE FOR RWANDANS - P2P EXPLAINED - WIDE READ

{title:"Inflation - Why Bread Price Goes Up",cat:"FINANCE",icon:"📈",excerpt:"1000 RWF bread becomes 1200 next year - why your money loses power.",text:`INFLATION - WHY BREAD PRICE GOES UP - WIDE READ

Remember 2018: Bread 500 RWF. Today same bread 800-1000. Why? Inflation.

DEFINITION: Inflation = general rise in prices of goods and services over time. Means your money buys less.

TWO CAUSES:
1. Cost-push: Fuel price up (we import fuel). Transport cost up, so bread delivery cost up, so bakery raises price.
2. Demand-pull: Too much money chasing few goods. Government prints money to pay debts, more RWF in circulation, each RWF worth less.

IN RWANDA SPECIFIC:
We import fuel, wheat, oil, clothes. When dollar strengthens, importing costs more RWF, prices rise. Also population grows faster than food production.

HOW MEASURED?
NISR measures basket: bread, rice, transport, rent. If basket cost 100k last year, 108k this year, inflation = 8%.

EFFECT ON SAVINGS:
If bank gives you 5% interest but inflation 8%, you actually lost 3% purchasing power. That's why MoMo savings loses.

HOW TO BEAT INFLATION?
- Don't keep large cash in RWF long term.
- Convert some to dollars (USDT), which inflates slower (dollar inflation 3% vs RWF 8%).
- Invest in skills that increase your income faster than inflation.
- Buy assets that go up: land in Kigali outskirts, small business.

EXAMPLE:

{title:"What is Ethereum and Smart Contracts?",cat:"CRYPTO",icon:"Ξ",excerpt:"Not just money, but computer that runs apps without owner.",text:`WHAT IS ETHEREUM AND SMART CONTRACTS? - WIDE READ

{title:"How P2P Scams Work and How to Avoid",cat:"SECURITY",icon:"⚠️",excerpt:"Buyer says 'I sent MoMo' but you didn't receive - classic scam.",text:`HOW P2P SCAMS WORK AND HOW TO AVOID - WIDE READ - VERY IMPORTANT

P2P is safe if you follow rules, but scammers try daily.

COMMON SCAMS IN RWANDA P2P:

1. FAKE MOMO SMS SCAM (MOST COMMON)
Buyer sends you SMS that looks like MoMo: You have received 10,000 RWF from... But real MoMo code is *182* or from MTNMoMo. Fake SMS from personal number 078... Always check balance via *182*7*1# or MoMo app balance, not SMS.

2. OVERPAY SCAM
You sell 10 USDT (13,500 RWF). Buyer sends 15,000 RWF and says oops sent extra, send back 1,500. You send 1,500, then buyer cancels trade, appeals, says didn't get USDT. You lose 1,500.

3. FAKE PROOF
Buyer shows screenshot of MoMo sent. Screenshot can be edited. Only trust your own MoMo balance.

4. CHARGEBACK SCAM
Buyer pays MoMo, you release USDT, then buyer calls MTN saying transaction was fraud, MTN reverses. How to avoid? Use Binance P2P only, not direct MoMo to stranger without escrow.

5. THIRD PARTY PAYMENT
You expect payment from Jean, but payment comes from Marie. Could be stolen MoMo account. Binance rule: Payment must come from account name matching Binance name. If not, don't release, appeal.

SAFE P2P RULES:
- Trade with verified merchants (yellow badge), 95%+ rate, 500+ trades.
- Always check MoMo balance inside app, not SMS.
- Never release before confirming.
- Take screen recording of balance.
- Trade daytime, when you can call MTN quickly.
- For large amounts >$100, split into $20 trades.

IF SCAMMED:
Click Appeal in Binance immediately, within 10 mins. Provide MoMo statement video, chat screenshots. Binance freezes seller USDT.

Your earnings here will go via P2P. Learn these now to protect future earnings.

Keep reading full timer, this knowledge saves you money.`},
{title:"Trust Wallet vs Binance Wallet - Difference",cat:"CRYPTO",icon:"👛",excerpt:"One you control keys, one exchange controls - which is safer?",text:`TRUST WALLET VS BINANCE WALLET - DIFFERENCE - WIDE READ

{title:"What is KYC and Why Binance Asks ID?",cat:"SECURITY",icon:"🪪",excerpt:"Know Your Customer - why you must send ID photo.",text:`WHAT IS KYC AND WHY BINANCE ASKS ID? - WIDE READ

KYC = Know Your Customer. Means exchange must know who you are.

WHY REQUIRED?
Due to laws against money laundering, terrorist financing, tax evasion. Governments tell Binance: You must verify users, or we ban you.

WHAT BINANCE ASKS:
- Level 1: Name, address, ID number.
- Level 2: Photo of National ID (Indangamuntu) front/back, selfie holding ID, liveness check (blink).
- Level 3: Proof of address (electricity bill, bank statement) for higher limits.

IS IT SAFE TO SEND ID?
Binance is regulated in many countries, uses encryption. Risk low but not zero - data breach possible. However without KYC, you cannot P2P, cannot withdraw >$500. For Rwandans, must do KYC to convert USDT to MoMo.

TIPS FOR RWANDAN ID VERIFICATION:
- Use good lighting, no flash glare.
- ID must not be expired.
- Name must match exactly: If ID says NIZEYIMANA Jean Bosco, write same, not Bosco Jean.
- Selfie: No glasses, no hat, plain background.
- If fails first time, try again with back camera.

WHAT HAPPENS AFTER KYC?
Binance knows your identity. If you do fraud, they can report to authorities. Also tax authority could ask Binance about your volume (though Rwanda not yet taxing crypto small amounts).

ALTERNATIVES WITHOUT KYC?
- Trust Wallet: No KYC for holding.
- Decentralized exchanges like PancakeSwap: No KYC but need crypto already.
- But to get RWF, eventually need KYC somewhere.

HOW LONG KYC TAKES?
Usually 10 mins to 2 hours. Sometimes 1 day if manual review.

AFTER APPROVED:
Enable 2FA (Google Authenticator), anti-phishing code, withdrawal whitelist.

Your ID is valuable. Don't send ID to random Telegram bots claiming free crypto. Only to big exchanges.

Keep reading, timer running.`},
{title:"Understanding Candlestick Charts",cat:"CRYPTO",icon:"📊",excerpt:"Green candle = price up, red = down - basic trading view.",text:`UNDERSTANDING CANDLESTICK CHARTS - WIDE READ

Candlestick chart = price history visual. Invented in Japan 1700s for rice trading.

EACH CANDLE SHOWS 4 PRICES IN ONE TIME PERIOD:

If you look at 1-hour chart, each candle = 1 hour activity.

Candle has body and wicks:
- Body: From open price to close price.
- Upper wick: Highest price reached that hour.
- Lower wick: Lowest price.

COLOR:
- Green (or white) candle: Price went UP during that hour. Open low, close high. Bullish.
- Red (or black) candle: Price went DOWN. Open high, close low. Bearish.

EXAMPLE:
1-hour BTC candle: Open $65,000, goes up to $66,000 (upper wick), down to $64,500 (lower wick), closes at $65,800. That's green candle with small wicks.

PATTERNS BEGINNERS SHOULD KNOW:
- Doji: Open = Close, body tiny, wicks long. Means indecision. Market confused.
- Hammer: Small body top, long lower wick. Means buyers pushed up after drop. Possible reversal up.
- Shooting star: Small body bottom, long upper wick. Means sellers pushed down. Possible reversal down.

DON'T TRADE BASED ONLY ON ONE CANDLE. Need trend.

TREND:
Uptrend = Higher highs, higher lows, many green candles.
Downtrend = Lower lows, many red candles.
Sideways = Green/red mix, no clear direction.

FOR EARNERS, WHY LEARN?
Not to day trade (risky). But to know when to convert USDT? No need, USDT stable. But if you hold Bitcoin, chart helps decide when to sell.

RULE: For beginners, don't day trade. 90% lose. Instead, buy and hold (DCA). But understanding candles helps you not panic when you see red candle - it's normal.

PRACTICE: Open Binance > Markets > BTC/USDT > Chart, switch to 1D (daily). Look at last year. See green years?

Stay reading, keep scrolling article box.`},

{title:"What is DeFi? Bank Without Bank",cat:"TECH",icon:"🏦",excerpt:"Lend, borrow, earn interest without any bank building.",text:`WHAT IS DEFI? BANK WITHOUT BANK - WIDE READ

DeFi = Decentralized Finance. Finance without banks, using smart contracts.

TRADITIONAL FINANCE:
You want to borrow money: Go to Bank of Kigali, fill forms, provide collateral (house), wait 2 weeks, interest 18% yearly. Bank decides.

DEFI FINANCE:
You want to borrow: Go to app Aave on phone, deposit $100 USDT as collateral, borrow $70 instantly, no forms, no ID (just wallet). Interest maybe 5% variable, code decides.

HOW IT WORKS:
Smart contracts hold pools of money. Example: Lending pool has $10M USDT deposited by lenders earning interest. Borrowers borrow from pool, pay interest, interest goes to lenders.

KEY DEFI SERVICES:

1. LENDING/BORROWING: Aave, Compound. Deposit USDT, earn 3-8% APY. Better than bank 5%? But risk higher (smart contract bug).

2. SWAPPING: Uniswap. Exchange USDT to ETH without Binance, directly wallet to wallet.

3. STAKING: Lock coins to secure network, earn rewards. E.g., Stake ETH earn 4% yearly.

4. YIELD FARMING: Move money between pools to chase highest interest. Complex.

RISKS OF DEFI - VERY IMPORTANT:
- Smart contract bug: Hacker can drain pool. Happened many times: $100M+ stolen.
- No insurance like bank. If you lose, no one refunds.
- Scam tokens: Anyone can create fake token named RWANDA, you buy worthless.

FOR BEGINNERS IN RWANDA:
Don't put large money in DeFi yet. Understand first. Use only well-audited apps: Aave, Uniswap, MakerDAO. Start with $5 test.

WHY DEFI MATTERS FOR FUTURE?
In Rwanda, many have no bank account but have phone. DeFi could give them access to savings interest, loans using phone, without bank building. Could help farmers get loan using tokenized cows as collateral? Future.

For now, your earnings are simple: Read, earn coins, convert to USDT, hold. DeFi is next level after you have $100+ and understand risks.

Stay reading for full verification time.`},
{title:"How Internet Works - Why Data Expensive?",cat:"TECH",icon:"🌐",excerpt:"Your phone → tower → undersea cable → Google server - why costs.",text:`HOW INTERNET WORKS - WHY DATA EXPENSIVE? - WIDE READ

You buy 1GB for 1000 RWF, finishes quickly. Why expensive in Rwanda vs USA?

JOURNEY OF YOUR WHATSAPP MESSAGE:

1. YOUR PHONE TO TOWER:
You type Hi in WhatsApp, phone converts to radio waves, sends to nearest MTN tower (BTS) maybe 500m away. Tower has antennas.

2. TOWER TO DATA CENTER:
Tower sends via fiber or microwave to MTN data center in Kigali. MTN checks you have bundle.

3. KIGALI TO COAST:
Rwanda is landlocked. No sea. So data must go via fiber cables through Tanzania or Kenya to Mombasa/Dar es Salaam coast. Rwanda rents capacity on these cables. That's cost #1: Transit fees to Tanzania.

4. UNDERSEA CABLE:
From Mombasa, data enters undersea cable EASSy or SEACOM, fiber optic cable lying on ocean floor, goes thousands km to Europe (Marseille) or Middle East. These cables cost billions to lay, maintenance expensive. Cost #2.

5. TO GOOGLE SERVER:
From Europe, via internet backbone to Google server in Belgium/Ireland where WhatsApp message stored, then to friend's phone reverse journey.

WHY EXPENSIVE IN RWANDA?
- Landlocked: Pay Tanzania + undersea.
- Small market: 13M people vs 300M USA, so cost per user higher.
- Taxes: Government adds 18% VAT on data.
- No local content: If you watch YouTube video hosted in USA, data travels all way. If hosted in Kigali data center, cheaper. But few Kigali data centers.

HOW TO SAVE DATA:
- Use Lite apps: Facebook Lite, YouTube Go.
- Download videos on WiFi to watch later offline.
- Turn off auto-play videos in Facebook settings.
- Use 2G mode when just WhatsApp text.

FUTURE: Rwanda building own data center, plus Starlink satellite internet may reduce costs long term.

Understanding this helps you appreciate why offline earning reading is good - uses little data vs watching videos.

Keep reading timer.`},

{title:"What is NFT? Digital Art That Sells for Millions",cat:"TECH",icon:"🖼️",excerpt:"Picture that proves you own original - like Mona Lisa certificate.",text:`WHAT IS NFT? DIGITAL ART THAT SELLS FOR MILLIONS - WIDE READ

NFT = Non-Fungible Token. Fungible = replaceable. RWF 1000 is fungible: Your 1000 = my 1000, same. Non-fungible = unique. Like your ID, house title, Mona Lisa.

TECHNICAL:
NFT is token on blockchain (usually Ethereum) that says: Wallet 0x123 owns item #456. Item can be image, music, video. Blockchain proves ownership and history.

EXAMPLE:
Artist in Kigali draws lion art. He mints NFT: Creates token on Ethereum that points to image IPFS link. First buyer buys for 0.1 ETH ($250). Now blockchain says buyer owns. Artist can code royalty: Every future resale, artist gets 10%. If buyer resells for $1000, artist gets $100 automatically via smart contract.

WHY WOULD ANYONE PAY MILLIONS FOR JPEG?
- Speculation: Hope to sell higher to next person (greater fool).
- Status: Like owning Rolex, show off on Twitter profile.
- Utility: Some NFTs give access: Bored Ape NFT gives entry to exclusive club, parties.
- Support artist: Like patron.

FAMOUS SALES:
Beeple NFT sold $69M. But 99% NFTs now worth $0.

RISKS FOR RWANDANS:
- Many NFTs are scams: Creator mints, hypes on Twitter, you buy, creator disappears (rug pull).
- Fees high to mint on Ethereum ($20).
- Copyright issues: Anyone can mint your photo as NFT without permission.

USEFUL USES BEYOND ART:
- Land title as NFT: Government could issue land NFT, easy transfer, no fake papers.
- University degree as NFT: Can't fake.
- Concert ticket as NFT: Can't duplicate.

SHOULD YOU BUY NFT?
As beginner with small money, no. Focus on learning, saving USDT. NFT is advanced and risky. Understand concept but don't invest until you have $500+ you can afford to lose completely.

For now, your articles reading is more valuable than NFT flipping.

Stay full timer reading.`},
{title:"Why You Should Learn English for Online Earning",cat:"FINANCE",icon:"🗣️",excerpt:"English = double income online - how to learn free.",text:`WHY YOU SHOULD LEARN ENGLISH FOR ONLINE EARNING - WIDE READ

{title:"What is Web3? Next Internet",cat:"TECH",icon:"🌍",excerpt:"Web1 read, Web2 read+write, Web3 read+write+own.",text:`WHAT IS WEB3? NEXT INTERNET - WIDE READ

Internet evolution in simple terms.

WEB1 (1990-2004): READ ONLY
Websites were static pages. Like newspaper online. You could read but not comment, not post. Example: Early government site listing info. Only experts could create site via HTML. Users = readers.

WEB2 (2004-NOW): READ + WRITE
Facebook, YouTube, TikTok. You can read and write (post, comment, upload video). But problem: Platform owns your data. Facebook owns your photos, can ban you, sells your data to advertisers. You create content, Facebook earns money, you get likes. Centralized.

WEB3 (2020-FUTURE): READ + WRITE + OWN
Blockchain based. You own your data and assets via wallet. Example: Instead of Facebook, you use Lens Protocol (social on blockchain). Your posts are NFTs owned by you. If platform bans you, you take followers to another app because data on blockchain, not their server. You earn tokens for posting.

KEY CONCEPTS OF WEB3:
- Wallet login: Instead of email/password, connect wallet (like Trust Wallet). No company holds your password.
- Tokens: Users get tokens for using app, like shares. If app grows, token value up.
- Decentralized storage: Photos stored on IPFS/Arweave, not one company's server, so can't be deleted.

EXAMPLES:
- Web2: YouTube: You upload video, YouTube decides if monetized, takes 45% ad revenue.
- Web3: Odysee: You upload video on blockchain, you get 90% via tips, no central censor.

IS WEB3 REAL OR HYPE?
Currently Web3 apps are slower, harder to use than Web2. Most people still prefer Facebook because easy. But idea powerful for Rwanda: Artists could own their music directly, not via record label.

For now, you are in Web2 earning. Web3 future may allow you to own your earning history as NFT, take to other platforms.

Don't need to deep dive now, but understand direction: Internet moving from platforms owning to users owning.

Keep reading timer full.`},
{title:"How to Create Strong Password",cat:"SECURITY",icon:"🔑",excerpt:"123456 = hacked in 1 second. How to make unhackable password.",text:`HOW TO CREATE STRONG PASSWORD - WIDE READ

Your password is like house key. Weak password = open door.

HOW HACKERS CRACK:

Method 1: Dictionary attack: Try common passwords: 123456, password, qwerty, 078... Works because many use same.

Method 2: Brute force: Try all combos: aaa, aab... With fast computer, 6-char password cracked in minutes.

Method 3: Phishing: Fake login page looks like Binance, you type password, they steal.

Method 4: Data breach: You use same password on many sites. One site hacked, hackers try same password on Binance.

WHAT IS STRONG PASSWORD?
- At least 12 characters
- Mix uppercase, lowercase, numbers, symbols
- Not personal info like birth year, name
- Unique for each important site

EXAMPLES:
Weak: 123456, jean123, password, momo2024
Medium: Jean@2024 (still weak, contains name)
Strong: k8$Mv2!pL9@qR4z# (random, hard to remember)
Strong and memorable: Use phrase: I love eating Isombe on Sunday! -> Take first letters + numbers: IleIoS!2024#Rw -> 12+ chars, memorable.

HOW TO MANAGE MANY PASSWORDS?
Don't write in phone notes (if phone stolen). Use password manager: Bitwarden (free), or 1Password. One master password unlocks all. Or write in paper notebook hidden at home (better than phone).

2FA - SECOND LAYER:
Even if password stolen, hacker needs second code. Enable Google Authenticator or SMS 2FA on Binance, email. Very important.

FOR YOUR EARN PLATFORM:
Use strong unique password, not same as Facebook. Enable if 2FA available.

TEST YOUR PASSWORD: Search haveibeenpwned.com - check if your email leaked.

Rwandan common mistake: Use phone number as password. Very easy to guess.

Action after reading: Change 2 important passwords today to strong ones.

Stay full time reading to secure account.`},

{title:"What is Stablecoin and Why Need?",cat:"CRYPTO",icon:"⚖️",excerpt:"Crypto that doesn't go up/down - why world needs it.",text:`WHAT IS STABLECOIN AND WHY NEED? - WIDE READ

Crypto like Bitcoin goes up and down 10% daily. Hard to use for shop price. Stablecoin solves.

WHAT IS STABLECOIN?
Cryptocurrency pegged to stable asset like dollar, so price stable. Goal $1 always.

3 TYPES OF STABLECOIN:

1. FIAT-BACKED (USDT, USDC) - MOST COMMON
Company holds dollars in bank, issues coins. Example: Tether holds $120B in bank, issues 120B USDT. Each USDT backed by $1. Centralized, need trust company. Used in Rwanda P2P.

2. CRYPTO-BACKED (DAI)
No bank, backed by other crypto locked in smart contract. Example: Lock $150 worth ETH to create $100 DAI. If ETH price drops, contract sells ETH to keep DAI at $1. Decentralized but complex.

3. ALGORITHMIC (FAILED EXAMPLE LUNA UST)
No backing, uses code to keep price $1 via supply/demand tricks. Failed spectacularly in 2022, UST went from $1 to $0.02, $40B lost. Lesson: Avoid algorithmic stablecoins.

WHY WORLD NEEDS STABLECOIN?

1. TRADERS NEED STABLE: When Bitcoin crashing, trader sells BTC to USDT to protect value without going to bank.

2. REMITTANCE: Send $100 from USA to Rwanda via USDT TRC20 fee $1, arrives 2 mins, vs Western Union $10 fee + 1 day.

3. SAVINGS IN COUNTRIES WITH HIGH INFLATION: In Venezuela, Lebanon, local currency collapses. People save in USDT to preserve value. Similar to Rwanda where RWF slowly devalues.

4. DEFI: Lending pools need stable asset to lend.

WHICH STABLECOIN TO USE IN RWANDA?
- USDT TRC20: Most liquid, accepted everywhere, low fee, best for P2P.
- USDC: More transparent, backed by Circle + Coinbase, slightly safer for large holding $1000+.
- Avoid unknown stablecoins promising high yield 20%.

HOW TO KEEP STABLE?
Stablecoin still risk: Company could freeze, depeg. Don't keep life savings in one stablecoin. Split 50% USDT, 50% USDC if large amount.

For your earnings here, stablecoin concept explains why we convert coins to USDT - to give you stable dollar value you can use globally.

{title:"How Mobile Money Charges Work",cat:"FINANCE",icon:"💸",excerpt:"Why sending 10k MoMo costs 250 RWF - breakdown.",text:`HOW MOBILE MONEY CHARGES WORK - WIDE READ

You send 10,000 RWF via MoMo, they charge 250. Why? Where does money go?

MTN MOMO FEE STRUCTURE (2026 approximate, may change):

SENDING TIERS:
- 1 - 5,000 RWF: Fee ~100-200 RWF
- 5,001 - 10,000: ~250 RWF
- 10,001 - 50,000: ~500-800 RWF
- 50,001 - 100,000: ~1000-1500 RWF
- Above 100k: ~2000+ RWF

WITHDRAWAL FEES (from MoMo to cash via agent):
Often higher than sending. Withdrawing 10k costs ~250-400.

WHY CHARGES?
1. Agent commission: MoMo agent who gives you cash earns ~30% of fee.
2. MTN profit: MTN makes money from service.
3. Government taxes: 18% VAT on fees + 10% excise?
4. System maintenance: Servers, security, staff.

COMPARISON WITH USDT:
Sending 10,000 RWF equivalent (~7 USDT) via TRC20 costs $1 = ~1350 RWF flat, regardless if you send $10 or $1000. So for large amounts, USDT cheaper. For small 2k, MoMo cheaper.

HOW TO REDUCE MOMO FEES:

1. BUNDLE MO MO? No bundle for sending, but use MoMo Pay (paying merchant) is often free. If buying in shop, use MoMo Pay not send.

2. SEND LARGER LESS OFTEN: Instead of sending 5k twice (250x2=500 fee), send 10k once (250 fee). Save 250.

3. USE BANK TO MOMO? Bank push to MoMo sometimes cheaper for large.

4. USE USDT FOR LARGE TRANSFERS: If you need send 200k to friend in other district, consider USDT: You sell USDT for MoMo via P2P, friend receives MoMo - but still MoMo fee? Actually P2P buyer sends MoMo to you, fee on buyer.

HIDDEN FEES:
- Reversing wrong transaction costs time and sometimes fee.
- Keeping money in MoMo no interest, inflation eats.

For your earnings conversion: When you sell 5 USDT via P2P, buyer pays MoMo sending fee to you, not you. So you receive full RWF amount. Good.

Understanding fees helps you save.

{title:"What is Halving? Why Bitcoin Price Up Every 4 Years",cat:"CRYPTO",icon:"✂️",excerpt:"Every 4 years, Bitcoin new supply cuts in half - why price history repeats.",text:`WHAT IS HALVING? WHY BITCOIN PRICE UP EVERY 4 YEARS - WIDE READ

Bitcoin halving is most important event in crypto calendar. Happens every 4 years.

WHAT IS HALVING?
Bitcoin miners get reward for mining blocks. At start 2009, reward = 50 BTC per block. Every 210,000 blocks (~4 years), reward cuts in half.

HISTORY:
- 2009-2012: 50 BTC per block
- 2012 Halving: 25 BTC
- 2016 Halving: 12.5 BTC
- 2020 Halving: 6.25 BTC
- 2024 Halving: 3.125 BTC (last one)
- 2028 Halving: Will be 1.5625 BTC

WHY HALVING MATTERS?
Supply and demand. If demand same but new supply halves, price tends to go up over time (if demand holds).

EXAMPLE: Imagine Rwamagana produces 1000 tomatoes daily, price 200 RWF each. If suddenly production cut to 500 daily, but same buyers want 1000, price goes up.

BITCOIN PRICE HISTORY AROUND HALVING:
- After 2012 halving: Price $12 -> $1000 next year (80x)
- After 2016 halving: $650 -> $20,000 (30x)
- After 2020 halving: $8,000 -> $69,000 (8.5x)
- After 2024 halving: $60k -> maybe $100k+? History suggests up but not guarantee, each cycle smaller multiplier.

WHY NOT GUARANTEED UP?
Because demand matters too. If no one wants Bitcoin, halving doesn't help. Also other factors: Regulation, interest rates.

WHAT TO DO AS BEGINNER?
Don't try to trade halving. Instead, understand long term scarcity. Bitcoin becomes scarcer every 4 years. 21 million max ever. 19.5M already mined. Only 1.5M left to mine over next 100 years. Scarce like land in Kigali.

DCA STRATEGY: Instead of buying once, buy small $5 monthly regardless of price. Over years, averages out.

For your earning, halving explains why saving small Bitcoin or USDT long term could be smart: Supply limited, demand growing globally.

Keep reading full time, scroll slowly.`}

    }catch(e){ 
      showToast(e.message);
      done=done.filter(x=>x!==cur); total-=cfg.reward; saveLocal(); render();
    }
  } else {
    lastEarnTime=Date.now()/1000;
    showToast(`✓ +${cfg.reward} 🪙 added! ${done.length}/10`);
  }
  isClaiming=false;
}
async function claimBonus(){
  if(isClaiming) return; isClaiming=true;
  if(bonusClaimed){ isClaiming=false; return showToast('Already claimed'); }
  if(done.length<10){ isClaiming=false; return showToast(`Need ${10-done.length} more`); }
  loadPop();
  bonusClaimed=true;
  total+=BONUS_REWARD;
  saveLocal();
  render();
  if(currentUser){
    try{
      await db.collection('users').doc(currentUser.uid).set({
        balance: firebase.firestore.FieldValue.increment(BONUS_REWARD),
        coins: firebase.firestore.FieldValue.increment(BONUS_REWARD),
        lastEarnAt: firebase.firestore.FieldValue.serverTimestamp(),
        articlesEarn_bonus:getToday(),
        articlesEarn_date:getToday(),
        articlesEarn_done:done,
        articlesEarn_total:total
      },{merge:true});
      await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({
        action:'Articles Earn Bonus',coins:BONUS_REWARD,
        desc:`Bonus +${BONUS_REWARD} coins for 10 articles - ${getToday()}`,
        timestamp:firebase.firestore.FieldValue.serverTimestamp(),
        date:getToday()
      });
      lastEarnTime=Date.now()/1000;
      showToast(`🎁 Bonus +${BONUS_REWARD} 🪙 added!`);
    }catch(e){ showToast(e.message); bonusClaimed=false; total-=BONUS_REWARD; saveLocal(); render(); }
  }
  isClaiming=false;
}
auth.onAuthStateChanged(async u=>{
  if(!u){location.href='./index.html';return;}
  currentUser=u;
  try{
    const doc=await db.collection('users').doc(u.uid).get();
    if(doc.exists){
      userData=doc.data();
      const today=getToday();
      const fbDate=userData.articlesEarn_date||'';
      if(fbDate!==today && fbDate!==''){
        done=[]; total=0; bonusClaimed=false;
        saveLocal();
        await db.collection('users').doc(u.uid).set({
          articlesEarn_date: today,
          articlesEarn_done: [],
          articlesEarn_total: 0,
          articlesEarn_bonus: firebase.firestore.FieldValue.delete()
        },{merge:true});
      } else if(fbDate===today){
        const fbDone=userData.articlesEarn_done||[];
        done=[...new Set(fbDone)].filter(x=>x>=0 && x<=9);
        total=userData.articlesEarn_total||0;
        bonusClaimed=(userData.articlesEarn_bonus===today);
        let realTotal=0;
        done.forEach(id=>{ const c=tasksConfig.find(t=>t.id===id); if(c) realTotal+=c.reward; });
        if(bonusClaimed) realTotal+=BONUS_REWARD;
        if(total!==realTotal) total=realTotal;
        saveLocal();
      }
      if(userData.lastEarnAt && userData.lastEarnAt.toMillis) lastEarnTime=userData.lastEarnAt.toMillis()/1000;
    }
  }catch(e){ console.error(e); }
  render();
});
render();
</script>
