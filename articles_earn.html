<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>Articles & Earn</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f3ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 14px;color:#111827}
.top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;width:100%;max-width:500px;border-radius:0 0 16px 16px}
.back-btn{width:45px;height:30px;border-radius:10px;background:#fff;border:2px solid #fecaca;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#991b1b;font-weight:900;font-size:22px}
.center-pill{background:#fff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%)}
.main-card{width:100%;max-width:500px;background:#fff;border:2px solid #ede9fe;border-radius:20px;padding:12px;margin-top:14px}
.balance-box{background:linear-gradient(180deg,#1a2e0a,#12230a);border:2px solid #fbbf24;border-radius:16px;padding:10px;text-align:center;color:#fff}
.balance-value{color:#fbbf24;font-size:20px;font-weight:900}
.status{font-size:11px;color:#facc15;margin-top:4px}
.article-box{border:2px solid #ede9fe;border-radius:16px;padding:14px;margin-top:12px;background:#fff}
.article-title{font-weight:900;font-size:15px;color:#111827}
.article-text{font-size:13px;color:#374151;margin-top:8px;line-height:1.6;max-height:300px;overflow:auto}
.btn{width:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:0;border-radius:12px;padding:12px;font-weight:900;font-size:14px;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.5}
.lock-box{background:#fef3c7;border:2px solid #fbbf24;border-radius:14px;padding:14px;text-align:center;margin-top:10px}
.bubble{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fbbf24;color:#000;padding:10px 18px;border-radius:999px;font-weight:900;z-index:10000;display:none}
#fullLock{position:fixed;inset:0;background:#f5f3ff;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;text-align:center}
#adGate{position:fixed;inset:0;background:rgba(17,12,34,0.65);backdrop-filter:blur(8px);z-index:10001;display:none;align-items:center;justify-content:center;padding:20px}.gate-box{background:linear-gradient(180deg,#ffffff,#fbf7ff);border:2px solid #fbbf24;border-radius:24px;padding:22px 20px 18px;text-align:center;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(109,40,217,0.35), 0 0 0 6px rgba(251,191,36,0.12);position:relative;overflow:hidden}.gate-box:before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#fbbf24,#f59e0b,#a78bfa)}.gate-icon{width:64px;height:64px;margin:0 auto 10px;background:linear-gradient(180deg,#fef3c7,#fbbf24);border:3px solid #f59e0b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px}.gate-title{font-weight:900;font-size:18px;color:#4c1d95}.gate-sub{font-size:12px;color:#6b7280;margin:8px 0 16px;line-height:1.4;font-weight:600}.gate-btn{width:100%;height:50px;border-radius:14px;border:2px solid #ede9fe;font-weight:900;font-size:14px;cursor:pointer}.gate-btn.watch{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;box-shadow:0 4px 0 #d97706, 0 8px 20px rgba(245,158,11,0.25);border-color:#f59e0b}.gate-btn.watch:disabled{background:#f3f4f6;color:#9ca3af;box-shadow:none;border-color:#e5e7eb;cursor:not-allowed}.gate-btn.continue{background:linear-gradient(180deg,#dcfce7,#22c55e);color:#fff;border-color:#16a34a;box-shadow:0 4px 0 #15803d, 0 8px 20px rgba(34,197,94,0.3);display:none;margin-top:10px}#gateTimer2{font-size:13px;font-weight:900;color:#92400e;margin-top:12px;background:#fffbeb;border:1.5px solid #fde68a;padding:8px 12px;border-radius:999px;display:inline-block;min-width:140px}
</style>
</head>
<body>
<div id="bubble" class="bubble"></div>
<div class="top-bar"><a href="home.html" class="back-btn">‹</a><div class="center-pill">📰 Articles & Earn</div><div style="width:45px"></div></div>
<div id="fullLock"><div><div style="font-size:42px">🔒</div><h2 style="color:#4c1d95;margin:10px 0">Articles Locked</h2><div id="fullLockMsg" style="font-weight:800;color:#6b7280">Finish Quiz first</div><button onclick="location.href='home.html'" style="margin-top:14px;padding:10px 18px;border-radius:10px;border:none;background:#8b5cf6;color:#fff;font-weight:900">Go Home</button></div></div>

<main class="main-card">
<section class="balance-box">
<div style="color:#d1d5db;font-size:11px">Your Balance</div>
<div class="balance-value" id="bal">-- 🪙</div>
<div style="font-size:12px;color:#e5e7eb;margin-top:3px">Articles today: <strong id="today">0/5</strong></div>
<div class="status" id="status">Checking...</div>
</section>

<div id="lockPanel" class="lock-box" style="display:none">
<div style="font-size:15px;font-weight:900;color:#92400e">🔒 Articles locked</div>
<div id="lockMsg" style="font-size:13px;margin-top:6px;font-weight:800">Opens after Quiz</div>
</div>

<section id="contentBox">
<div id="articlesList"></div>
</section>
</main>

<div id="adGate"><div class="gate-box"><div class="gate-icon">📰</div><div class="gate-title">Unlock Coins</div><div id="gateSub" class="gate-sub">Watch clean ad 10s to collect</div><button id="watchAdBtn" class="gate-btn watch">▶️ Watch Ad (10s)</button><div id="gateTimer2"></div><button id="continueBtn" class="gate-btn continue">✅ Collect Coins</button><div style="font-size:9px;color:#9ca3af;margin-top:10px;font-weight:700">12273869 • Clean & safe • Better Ads</div></div></div>

<script>
(() => {
"use strict";
// ===== ARTICLES ZONE 12273869 CLEAN - 1 AD PER READ = SAFE =====
let vignetteLoaded=false;
function loadCleanVignette(){
  if(vignetteLoaded) return;
  vignetteLoaded=true;
  const old=document.querySelector('script[src*="vignette.min.js"]');
  if(old) old.remove();
  (function(s){s.dataset.zone='12273869',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
  setTimeout(()=>{vignetteLoaded=false;}, 60*1000);
}
let pendingClaim=null;
function openArticleAdGate(afterFn, reward){
  const COOLDOWN=30*1000;
  const last=parseInt(localStorage.getItem('articles_claim_last')||'0');
  if(last && (Date.now()-last)<COOLDOWN){
    if(afterFn) afterFn();
    return;
  }
  pendingClaim=afterFn;
  document.getElementById('gateSub').innerText='Watch clean ad 10s to collect +'+reward+' coins';
  document.getElementById('adGate').style.display='flex';
  document.getElementById('watchAdBtn').style.display='block';
  document.getElementById('continueBtn').style.display='none';
  document.getElementById('watchAdBtn').disabled=false;
  document.getElementById('gateTimer2').innerText='';
  document.getElementById('watchAdBtn').innerText='▶️ Watch Ad (10s)';
}
document.getElementById('watchAdBtn').onclick=function(){
  this.innerText='⏳ Please wait...';this.disabled=true;
  let sec=10; const timerEl=document.getElementById('gateTimer2');
  timerEl.innerText='⏳ Wait '+sec+'s...';
  const interval=setInterval(()=>{
    sec--;
    if(sec>0){timerEl.innerText='⏳ Wait '+sec+'s...';}
    else{clearInterval(interval);
      document.getElementById('watchAdBtn').style.display='none';
      timerEl.innerText='✅ Unlocked!';
      document.getElementById('continueBtn').style.display='block';
    }
  },1000);
};
document.getElementById('continueBtn').onclick=function(){
  document.getElementById('adGate').style.display='none';
  localStorage.setItem('articles_claim_last', String(Date.now()));
  loadCleanVignette();
  const fn=pendingClaim; pendingClaim=null;
  if(fn) fn();
};

const ARTICLES = [
{id:"a1",title:"How to Save Money Daily",text:"Saving money starts with small habits. Track your expenses, set a daily limit, and avoid impulse buying. Even 500 RWF a day becomes 15,000 RWF a month. Consistency is the key to financial freedom.",reward:2},
{id:"a2",title:"Benefits of Reading",text:"Reading improves focus, vocabulary, and mental health. Just 10 minutes a day can reduce stress by 60%. Make reading part of your daily routine.",reward:2},
{id:"a3",title:"Healthy Living Tips",text:"Drink 2L water, walk 30 minutes, sleep 7-8 hours. Small healthy choices compound over time into a strong body and clear mind.",reward:2},
{id:"a4",title:"How to Stay Focused",text:"Remove distractions, set a timer for 25 minutes, work, then take 5 min break. This Pomodoro technique boosts productivity.",reward:2},
{id:"a5",title:"Why Learn New Skills",text:"The world changes fast. Learning a new skill every month keeps you relevant and opens new income opportunities.",reward:2}
];
const DAILY_LIMIT=5, WINDOW_MS=30*60*1000, DAY_MS=24*60*60*1000;
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
const el=id=>document.getElementById(id);
const balEl=el("bal"), todayEl=el("today"), statusEl=el("status"), lockPanel=el("lockPanel"), lockMsg=el("lockMsg"), listEl=el("articlesList"), contentBox=el("contentBox"), fullLock=el("fullLock"), fullLockMsg=el("fullLockMsg");
let currentUser=null, balance=0, todayCount=0, readIds=[], unsubscribe=null, timer=null;

function showBubble(m){const b=el("bubble");b.textContent=m;b.style.display="block";clearTimeout(showBubble.t);showBubble.t=setTimeout(()=>b.style.display="none",2200);}
function localDayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function getChain(){try{return JSON.parse(localStorage.getItem('chain_v2')||'{}');}catch(e){return {};}}
function saveChain(c){localStorage.setItem('chain_v2',JSON.stringify(c));}
function formatRemaining(ms){if(ms<=0)return"0m";const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);if(h>0)return `${h}h ${m}m`;if(m>0)return `${m}m ${s}s`;return `${s}s`;}

function onArticlesFinishedChain(){
  const now=Date.now(), c=getChain(), today=localDayKey();
  if(c.articles_finishedToday===today) return;
  c.articles_finishedToday=today;
  c.articles_doneToday=today;
  c.watch_nextAvail=now+DAY_MS;
  c.quiz_nextAvail=now+DAY_MS;
  c.articles_nextAvail=now+DAY_MS;
  saveChain(c);
  if(currentUser) db.collection("users").doc(currentUser.uid).set({chain:{articles_finishedToday:today,articles_doneToday:today,watch_nextAvail:c.watch_nextAvail,quiz_nextAvail:c.quiz_nextAvail,articles_nextAvail:c.articles_nextAvail,updated:firebase.firestore.FieldValue.serverTimestamp()}},{merge:true});
}

function checkArticlesState(){
  const c=getChain(), now=Date.now(), today=localDayKey();
  if(c.quiz_finishedToday!==today && c.quiz_doneToday!==today){
    fullLock.style.display="flex";
    fullLockMsg.textContent="Finish Quiz first - Watch → Quiz → Articles";
    lockPanel.style.display="none"; contentBox.style.display="none";
    return true;
  }
  if(c.articles_finishedToday===today){
    fullLock.style.display="flex";
    fullLockMsg.textContent="All done today ✅ Come back tomorrow";
    lockPanel.style.display="none"; contentBox.style.display="none";
    return true;
  }
  if(!c.articles_open){
    fullLock.style.display="flex";
    fullLockMsg.textContent="Articles not ready yet";
    lockPanel.style.display="none"; contentBox.style.display="none";
    return true;
  }
  if(now < c.articles_open){
    fullLock.style.display="flex";
    fullLockMsg.textContent="Articles opens in "+formatRemaining(c.articles_open-now);
    lockPanel.style.display="none"; contentBox.style.display="none";
    return true;
  }
  if(now > c.articles_expiry){
    onArticlesExpired();
    return true;
  }
  fullLock.style.display="none";
  lockPanel.style.display="none"; contentBox.style.display="block";
  const diff=c.articles_expiry-now;
  statusEl.textContent=`Live ${formatRemaining(diff)} • ${todayCount}/${DAILY_LIMIT}`;
  if(timer) clearInterval(timer);
  timer=setInterval(()=>{
    const d=c.articles_expiry - Date.now();
    if(d<=0){clearInterval(timer); onArticlesExpired();}
    else statusEl.textContent=`Live ${formatRemaining(d)} • ${todayCount}/${DAILY_LIMIT}`;
  },1000);
  return false;
}

function onArticlesExpired(){
  const now=Date.now(), c=getChain(), today=localDayKey();
  if(c.articles_finishedToday===today) return;
  c.articles_open=null; c.articles_expiry=null;
  c.articles_nextAvail=now+DAY_MS;
  c.watch_nextAvail=now+DAY_MS;
  c.quiz_nextAvail=now+DAY_MS;
  c.articles_finishedToday=today;
  saveChain(c);
  fullLock.style.display="flex";
  fullLockMsg.textContent="Closed - Opens tomorrow";
  lockPanel.style.display="none"; contentBox.style.display="none";
}

function renderArticles(){
  listEl.innerHTML="";
  if(todayCount>=DAILY_LIMIT || readIds.length>=DAILY_LIMIT){
    listEl.innerHTML=`<div class="article-box"><div class="article-title">🎉 All done for today</div><div class="article-text">You finished all articles. Come back tomorrow.</div></div>`;
    if(todayCount>=DAILY_LIMIT) onArticlesFinishedChain();
    return;
  }
  const available=ARTICLES.filter(a=>!readIds.includes(a.id));
  if(available.length===0){
    listEl.innerHTML=`<div class="article-box"><div class="article-title">🎉 All done</div></div>`;
    onArticlesFinishedChain();
    return;
  }
  available.forEach(a=>{
    const div=document.createElement("div");
    div.className="article-box";
    div.innerHTML=`<div class="article-title">${a.title}</div><div class="article-text">${a.text}</div><button class="btn" data-id="${a.id}">Read & Earn +${a.reward}</button>`;
    listEl.appendChild(div);
  });
  listEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click",()=>handleReadClick(btn.dataset.id, btn));
  });
}

function handleReadClick(id, btnEl){
  const art=ARTICLES.find(a=>a.id===id);
  if(!art) return;
  openArticleAdGate(()=>{ claimArticle(id, btnEl); }, art.reward);
}

async function claimArticle(id, btnEl){
  if(!currentUser) return;
  const article=ARTICLES.find(a=>a.id===id);
  if(!article || readIds.includes(id)) return;
  if(btnEl) btnEl.disabled=true;
  const userRef=db.collection("users").doc(currentUser.uid), todayKey=localDayKey();
  try{
    await db.runTransaction(async t=>{
      const snap=await t.get(userRef); if(!snap.exists) throw new Error("No account");
      const data=snap.data()||{}, savedDay=data.articleDay||todayKey;
      let count=Number(data.articleCount||0), ids=Array.isArray(data.articleIds)?data.articleIds.slice():[];
      if(savedDay!==todayKey){count=0;ids=[];}
      if(count>=DAILY_LIMIT||ids.includes(id)) throw new Error("Done");
      const oldBal=Number(data.balance??data.coins??0);
      t.update(userRef,{balance:oldBal+article.reward,coins:oldBal+article.reward,articleCount:count+1,articleIds:ids.concat(id),articleDay:todayKey,lastArticleDate:firebase.firestore.FieldValue.serverTimestamp()});
    });
    showBubble(`+${article.reward} coins`);
  }catch(e){showBubble("Already collected"); if(btnEl) btnEl.disabled=false;}
}

async function refreshDailyIfNeeded(data){
  const todayKey=localDayKey();
  if(data.articleDay===todayKey) return;
  const userRef=db.collection("users").doc(currentUser.uid);
  try{
    await db.runTransaction(async t=>{
      const snap=await t.get(userRef); if(!snap.exists) return;
      const latest=snap.data()||{}; if(latest.articleDay===todayKey) return;
      t.update(userRef,{articleCount:0,articleIds:[],articleDay:todayKey});
    });
  }catch(e){}
}

auth.onAuthStateChanged(user=>{
  if(!user){location.href="./index.html";return;}
  currentUser=user;
  if(unsubscribe) unsubscribe();
  unsubscribe=db.collection("users").doc(user.uid).onSnapshot(async snap=>{
    if(!snap.exists){statusEl.textContent="No account";return;}
    const data=snap.data()||{};
    if(data.articleDay!==localDayKey()) await refreshDailyIfNeeded(data);
    balance=Number(data.balance??data.coins??0);
    todayCount=Number(data.articleCount||0);
    readIds=Array.isArray(data.articleIds)?data.articleIds:[];
    if(data.chain){const local=getChain();let ch=false;for(let k in data.chain){if(data.chain[k]&&!local[k]){local[k]=data.chain[k];ch=true;}} if(ch) saveChain(local);}
    balEl.textContent=`${balance} 🪙 coins`;
    todayEl.textContent=`${Math.min(todayCount,DAILY_LIMIT)}/${DAILY_LIMIT}`;
    if(!checkArticlesState()){
      renderArticles();
    }
  });
  setInterval(checkArticlesState,1000);
});
})();
</script>
</body>
</html>
