<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support - Reward RW</title>
<style>
*{box-sizing:border-box;font-family:Arial} body{background:#111;color:white;padding:20px}
.card{background:#1e2f15;padding:20px;border-radius:12px;border:1px solid #333;max-width:500px;margin:20px auto}
input,textarea{width:100%;padding:12px;margin:8px 0;background:#111;border:1px solid #444;border-radius:8px;color:white}
.btn{padding:12px;width:100%;background:#fbbf24;color:black;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
.ticket{background:#2f3e1a;padding:12px;border-radius:8px;margin:10px 0;border-left:4px solid #fbbf24}
.reply{background:#1a2410;padding:10px;border-radius:8px;margin-top:8px;border-left:3px solid #22c55e}
</style>
</head>
<body>
<div class="card">
<h2 style="color:#fbbf24">Contact Support</h2>
<p style="font-size:12px;color:#aaa">No email needed - message goes directly to admin</p>
<input id="sName" placeholder="Your username">
<input id="sEmail" placeholder="Your email">
<textarea id="sMessage" rows="5" placeholder="Describe your issue..."></textarea>
<button class="btn" onclick="sendTicket()">Send Message</button>
<div id="sStatus" style="margin-top:10px;font-size:13px"></div>
</div>

<div class="card">
<h3 style="color:#fbbf24">Your Tickets & Replies</h3>
<div id="myTickets">Login to see tickets...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d", storageBucket: "reward-platform-rw-2e13d.firebasestorage.app", messagingSenderId: "787550951987", appId: "1:787550951987:web:724b1463e821b99c90a146" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
let currentUser=null;
onAuthStateChanged(auth, (u)=>{ currentUser=u; if(u){ document.getElementById('sEmail').value=u.email; document.getElementById('sName').value=u.displayName||""; loadMyTickets(u.email); } });

window.sendTicket = async ()=>{
  const name=document.getElementById('sName').value.trim();
  const email=document.getElementById('sEmail').value.trim();
  const msg=document.getElementById('sMessage').value.trim();
  const status=document.getElementById('sStatus');
  if(!email || !msg){ status.style.color="#ef4444"; status.innerText="Email and message required"; return; }
  try{
    await addDoc(collection(db,"supportTickets"),{ username:name, email:email, message:msg, status:"open", createdAt:new Date(), userId: currentUser ? currentUser.uid : null });
    status.style.color="#22c55e"; status.innerText="✅ Sent! Admin will reply here. No email needed.";
    document.getElementById('sMessage').value=""; if(currentUser) loadMyTickets(email);
  }catch(e){ status.style.color="#ef4444"; status.innerText="Failed: "+e.message; }
}
async function loadMyTickets(email){
  const el=document.getElementById('myTickets'); el.innerHTML="Loading...";
  try{
    const q=query(collection(db,"supportTickets"), where("email","==",email));
    const snap=await getDocs(q);
    if(snap.empty){ el.innerHTML="No tickets yet"; return; }
    let html=""; snap.forEach(d=>{ const t=d.data(); html+=`<div class="ticket"><p style="font-size:11px;color:#aaa">${t.createdAt ? new Date(t.createdAt.seconds*1000).toLocaleString() : ""} - <b>${t.status}</b></p><p>${t.message}</p>${t.adminReply ? `<div class="reply"><b style="color:#22c55e">Admin Reply:</b><br>${t.adminReply}</div>` : "<p style='font-size:11px;color:#fbbf24'>⏳ Waiting for admin reply</p>"}</div>`; });
    el.innerHTML=html;
  }catch(e){ el.innerHTML="Error: "+e.message; }
}
</script>
</body>
</html>
