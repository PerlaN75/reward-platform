<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support - Reward RW</title>
<style>
*{box-sizing:border-box;font-family:Arial} body{background:#0f1508;color:white;padding:20px}
.card{background:#1a2a12;padding:20px;border-radius:16px;border:1px solid #2a3d1f;max-width:500px;margin:20px auto}
input,textarea{width:100%;padding:12px;margin:8px 0;background:#0a0f06;border:1px solid #2a3d1f;border-radius:10px;color:white}
input:focus,textarea:focus{border-color:#fbbf24;outline:none}
.btn{padding:12px;width:100%;background:#fbbf24;color:black;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:0.6}
.ticket{background:#0a0f06;padding:12px;border-radius:10px;margin:10px 0;border-left:4px solid #fbbf24}
.reply{background:#1a2410;padding:10px;border-radius:8px;margin-top:8px;border-left:3px solid #22c55e}
.back-home{display:block;width:40%;max-width:200px;margin:20px auto 0 auto;background:#fbbf24;color:#000;border-radius:50px;padding:12px;font-weight:bold;font-size:14px;text-align:center;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<h2 style="color:#fbbf24">Contact Support</h2>
<p style="font-size:12px;color:#aaa">No email needed - message goes directly to admin</p>
<input id="sName" placeholder="Your username" readonly>
<input id="sEmail" placeholder="Your email" readonly>
<textarea id="sMessage" rows="5" placeholder="Describe your issue..."></textarea>
<button class="btn" onclick="sendTicket()">Send Message</button>
<div id="sStatus" style="margin-top:10px;font-size:13px"></div>
</div>

<div class="card">
<h3 style="color:#fbbf24">Your Tickets & Replies</h3>
<div id="myTickets">Login to see tickets...</div>
</div>

<a href="more.html" class="back-home">Back to More</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, getDocs, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d", storageBucket: "reward-platform-rw-2e13d.firebasestorage.app", messagingSenderId: "787550951987", appId: "1:787550951987:web:724b1463e821b99c90a146" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser=null;

onAuthStateChanged(auth, async (u)=>{
  currentUser=u;
  if(!u){ window.location.href='login.html'; return; }
  // Fill from users collection + auth
  try{
    const udoc = await getDoc(doc(db,"users",u.uid));
    const d = udoc.exists()? udoc.data() : {};
    document.getElementById('sEmail').value = d.email || u.email;
    document.getElementById('sName').value = d.username || u.displayName || u.email.split('@')[0];
    loadMyTickets();
  }catch(e){
    document.getElementById('sEmail').value = u.email;
    document.getElementById('sName').value = u.displayName || u.email.split('@')[0];
    loadMyTickets();
  }
});

window.sendTicket = async ()=>{
  const name=document.getElementById('sName').value.trim();
  const email=document.getElementById('sEmail').value.trim();
  const msg=document.getElementById('sMessage').value.trim();
  const status=document.getElementById('sStatus');
  if(!msg){ status.style.color="#ef4444"; status.innerText="Please describe your issue"; return; }
  const btn = document.querySelector('.btn');
  btn.disabled=true; btn.innerText='Sending...';
  try{
    await addDoc(collection(db,"supportTickets"),{
      username:name,
      email:email,
      message:msg,
      status:"open",
      adminReply:"",
      uid: currentUser.uid,
      userId: currentUser.uid,
      createdAt: serverTimestamp()
    });
    status.style.color="#22c55e"; status.innerText="✅ Sent! Admin will reply here.";
    document.getElementById('sMessage').value="";
    loadMyTickets();
  }catch(e){ status.style.color="#ef4444"; status.innerText="Failed: "+e.message; }
  btn.disabled=false; btn.innerText='Send Message';
}

async function loadMyTickets(){
  const el=document.getElementById('myTickets');
  if(!currentUser){ el.innerHTML="Login to see tickets..."; return; }
  el.innerHTML="Loading...";
  try{
    // Query by uid (fixes permission error)
    const q=query(collection(db,"supportTickets"), where("uid","==",currentUser.uid));
    const snap=await getDocs(q);
    if(snap.empty){
      // fallback: try userId field (your old tickets)
      const q2=query(collection(db,"supportTickets"), where("userId","==",currentUser.uid));
      const snap2=await getDocs(q2);
      if(snap2.empty){ el.innerHTML="No tickets yet"; return; }
      renderTickets(snap2, el);
      return;
    }
    renderTickets(snap, el);
  }catch(e){
    el.innerHTML="Error: "+e.message+"<br><span style='font-size:10px;color:#aaa'>If permissions error, update Firestore Rules below</span>";
  }
}

function renderTickets(snap, el){
  let html="";
  snap.forEach(d=>{
    const t=d.data();
    let dateStr="Just now";
    if(t.createdAt){
      try{
        if(t.createdAt.toDate) dateStr=t.createdAt.toDate().toLocaleString();
        else if(t.createdAt.seconds) dateStr=new Date(t.createdAt.seconds*1000).toLocaleString();
        else dateStr=new Date(t.createdAt).toLocaleString();
      }catch(e){}
    }
    html+=`<div class="ticket"><p style="font-size:11px;color:#aaa">${dateStr} - <b>${t.status||'open'}</b></p><p>${escapeHtml(t.message||'')}</p>${t.adminReply? `<div class="reply"><b style="color:#22c55e">Admin Reply:</b><br>${escapeHtml(t.adminReply)}</div>` : "<p style='font-size:11px;color:#fbbf24'>⏳ Waiting for admin reply</p>"}</div>`;
  });
  el.innerHTML=html;
}

function escapeHtml(t){ return (t||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
</script>
</body>
</html>
