<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Menu - Reward Platform</title>


<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f4f7fb;

    color: #222;

}


/* =========================
   TOP BAR
========================= */

.top-bar {

    background: #182848;

    min-height: 70px;

    padding: 10px 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

}


/* =========================
   MENU TITLE
========================= */

.menu-title {

    font-size: 30px;

    font-weight: bold;

    background: linear-gradient(
        90deg,
        #ffb300,
        #ff4d8d,
        #8a2be2,
        #2196f3,
        #00c9a7,
        #ffb300
    );

    background-size: 300% 100%;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:
        headingSlide 8s linear infinite;

}


@keyframes headingSlide {

    from {

        background-position: 0% 50%;

    }

    to {

        background-position: 300% 50%;

    }

}


/* =========================
   MORE BUTTON
========================= */

.more-button {

    position: absolute;

    right: 12px;

    top: 15px;

    border: none;

    border-radius: 8px;

    padding: 10px 13px;

    background: #36558a;

    color: white;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

}


.more-button:hover {

    opacity: 0.9;

}


/* =========================
   MORE PANEL
========================= */

.more-panel {

    display: none;

    position: absolute;

    top: 62px;

    right: 12px;

    width: 220px;

    background: white;

    border-radius: 12px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.2);

    z-index: 1000;

    overflow: hidden;

}

.more-panel.open {

    display: block;

}

.more-panel a {

    display: block;

    padding: 13px 15px;

    border-bottom:
        1px solid #eeeeee;

    font-weight: bold;

    color: #222;

    text-decoration: none;

}

.more-panel a:hover {

    background: #f4f7fb;

}

.more-panel div:last-child {

    border-bottom: none;

}
/* =========================
   MORE PANEL LINKS
========================= */

.more-link {

    display: block;

    padding: 13px 15px;

    border-bottom:
        1px solid #eeeeee;

    font-weight: bold;

    color: #222;

    text-decoration: none;

    background: white;

}


.more-link:hover {

    background: #f4f7fb;

    color: #182848;

}

/* =========================
   MAIN CONTAINER
========================= */

.container {

    max-width: 850px;

    margin: auto;

    padding: 25px 15px 35px;

}


/* =========================
   INTRODUCTION
========================= */

.intro {

    text-align: center;

    margin-bottom: 25px;

}


.intro h2 {

    margin: 0 0 8px;

    background: linear-gradient(
        90deg,
        #182848,
        #2196f3,
        #00a86b,
        #182848
    );

    background-size: 300% 100%;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:
        headingSlide 8s linear infinite;

}


.intro p {

    margin: 0;

    color: #666;

}


/* =========================
   FEATURE GRID
========================= */

.feature-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

}


/* =========================
   KEYBOARD-STYLE FEATURE
========================= */

.feature-key {

    min-height: 120px;

    background: white;

    border: 1px solid #d8dee9;

    border-radius: 12px;

    box-shadow:
        0 4px 0 #c5cad3,
        0 6px 12px rgba(0,0,0,0.08);

    text-decoration: none;

    color: #182848;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 15px;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;

}


.feature-key:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 6px 0 #b7bdc8,
        0 8px 15px rgba(0,0,0,0.12);

}


.feature-key:active {

    transform:
        translateY(3px);

    box-shadow:
        0 2px 0 #b7bdc8,
        0 3px 7px rgba(0,0,0,0.10);

}


/* =========================
   FEATURE ICON
========================= */

.feature-icon {

    font-size: 32px;

    margin-bottom: 10px;

}


/* =========================
   FEATURE NAME
========================= */

.feature-name {

    font-size: 16px;

    font-weight: bold;

}


/* =========================
   SEPARATOR
========================= */

.logout-separator {

    margin: 35px 0 25px;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #b8bec9,
            transparent
        );

}


/* =========================
   LOGOUT AREA
========================= */

.logout-area {

    text-align: center;

}


/* =========================
   LOGOUT BUTTON
========================= */

.logout-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    min-width: 220px;

    padding: 15px 25px;

    border: none;

    border-radius: 11px;

    background: #c62828;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 4px 0 #8e1b1b;

}


.logout-button:hover {

    background: #b71c1c;

}


.logout-button:active {

    transform:
        translateY(3px);

    box-shadow:
        0 1px 0 #8e1b1b;

}


/* =========================
   FOOTER
========================= */

footer {

    text-align: center;

    padding: 20px;

    color: #777;

    font-size: 14px;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .feature-grid {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;

    }


    .feature-key {

        min-height: 110px;

    }


    .menu-title {

        font-size: 26px;

    }

}


@media (max-width: 380px) {

    .feature-grid {

        grid-template-columns:
            repeat(2, 1fr);

    }


    .feature-icon {

        font-size: 28px;

    }


    .feature-name {

        font-size: 14px;

    }

}

</style>

</head>


<body>


<!-- =========================
     PAGE PROTECTION
========================= -->

<script>

if (
    localStorage.getItem("loggedIn")
    !== "true"
) {

    window.location.href =
        "login.html";

}

</script>


<!-- =========================
     TOP BAR
========================= -->

<header class="top-bar">

    <div class="menu-title">

        Menu

    </div>


    <button
        type="button"
        class="more-button"
        onclick="toggleMore()">

        More ⋮

    </button>


    <!-- MORE PANEL -->

    <div
        id="morePanel"
        class="more-panel">

        <a href="settings.html">
    ⚙️ Settings
</a>

        <a href="profile.html" class="more-link">
    👤 Profile
</a>

        <div>
            📜 History
        </div>

        <a href="notifications.html" class="more-link">
    🔔 Notifications
</a>

        <div>
            🎁 Referrals
        </div>

        <div>
            ❓ Help / Support
        </div>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


    <div class="intro">

        <h2>
            Choose an Activity
        </h2>

        <p>
            Select what you would like to do.
        </p>

    </div>


    <!-- =========================
         FEATURES
    ========================= -->

    <div class="feature-grid">


        <!-- EARN POINTS -->

        <a
            href="earn.html"
            class="feature-key">

            <span class="feature-icon">
                💰
            </span>

            <span class="feature-name">
                Earn Points
            </span>

        </a>


        <!-- WATCH & EARN -->

        <a
            href="watch.html"
            class="feature-key">

            <span class="feature-icon">
                📺
            </span>

            <span class="feature-name">
                Watch & Earn
            </span>

        </a>


        <!-- DAILY SPIN -->

        <a
            href="spin.html"
            class="feature-key">

            <span class="feature-icon">
                🎡
            </span>

            <span class="feature-name">
                Daily Spin
            </span>

        </a>


        <!-- CHALLENGES -->

        <a
            href="challenges.html"
            class="feature-key">

            <span class="feature-icon">
                🏆
            </span>

            <span class="feature-name">
                Challenges
            </span>

        </a>


        <!-- BUY POINTS -->

        <a
            href="buy-points.html"
            class="feature-key">

            <span class="feature-icon">
                💳
            </span>

            <span class="feature-name">
                Buy Points
            </span>

        </a>


        <!-- BALANCE -->

        <a
            href="balance.html"
            class="feature-key">

            <span class="feature-icon">
                💰
            </span>

            <span class="feature-name">
                My Balance
            </span>

        </a>


        <!-- WITHDRAW -->

        <a
            href="withdraw.html"
            class="feature-key">

            <span class="feature-icon">
                💸
            </span>

            <span class="feature-name">
                Withdraw
            </span>

        </a>


        <!-- REWARDS -->

        <a
            href="rewards.html"
            class="feature-key">

            <span class="feature-icon">
                🎁
            </span>

            <span class="feature-name">
                Rewards
            </span>

        </a>


    </div>


    <!-- =========================
         LOGOUT SEPARATOR
    ========================= -->

    <div class="logout-separator">
    </div>


    <!-- =========================
         LOGOUT
    ========================= -->

    <div class="logout-area">

        <button
            type="button"
            class="logout-button"
            onclick="logoutUser()">

            ⏻ Logout

        </button>

    </div>


</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    Reward Platform — Prototype

</footer>


<script>

/* =========================
   MORE PANEL
========================= */

function toggleMore() {

    const panel =
        document.getElementById(
            "morePanel"
        );

    panel.classList.toggle(
        "open"
    );

}


/* =========================
   LOGOUT
========================= */

function logoutUser() {

    localStorage.removeItem(
        "loggedIn"
    );


    window.location.href =
        "index.html";

}


/* =========================
   CLOSE MORE PANEL
   WHEN CLICKING OUTSIDE
========================= */

document.addEventListener(
    "click",
    function(event) {

        const panel =
            document.getElementById(
                "morePanel"
            );

        const button =
            document.querySelector(
                ".more-button"
            );


        if (
            panel.classList.contains("open") &&
            !panel.contains(event.target) &&
            !button.contains(event.target)
        ) {

            panel.classList.remove(
                "open"
            );

        }

    }
);

</script>


</body>

</html>
