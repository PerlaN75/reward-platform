<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Menu</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}


/* =========================
   HEADER
========================= */

header {
    position: relative;

    background: #182848;
    color: white;

    padding: 22px 15px;

    text-align: center;
}


/* =========================
   MENU HEADING
========================= */

header h1 {

    margin: 0;

    font-size: 34px;

    text-align: center;

    background: linear-gradient(
        90deg,
        #ffb300,
        #ff4d8d,
        #8a2be2,
        #2196f3,
        #ffb300
    );

    background-size: 300% 100%;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        headingSlide 8s linear infinite;
}


@keyframes headingSlide {

    from {
        background-position: 0% 50%;
    }

    to {
        background-position: 300% 50%;
    }

}


/* =========================
   MORE BUTTON
========================= */

.more-button {

    position: absolute;

    right: 12px;

    top: 50%;

    transform:
        translateY(-50%);

    background:
        rgba(255,255,255,0.12);

    color: white;

    border: none;

    border-radius: 8px;

    padding: 8px 10px;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;
}


.more-button:hover {

    background:
        rgba(255,255,255,0.22);

}


/* =========================
   MAIN CONTAINER
========================= */

.container {

    max-width: 750px;

    margin: auto;

    padding:
        20px 15px 30px;
}


/* =========================
   FEATURE GRID
========================= */

.feature-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;

}


/* =========================
   FEATURE KEYS
========================= */

.feature-button {

    min-height: 125px;

    background: white;

    border:
        2px solid #d7dce5;

    border-radius: 14px;

    box-shadow:
        0 6px 0 #c3c9d4,
        0 10px 18px
        rgba(0,0,0,0.08);

    text-decoration: none;

    color: #182848;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 8px;

    font-weight: bold;

    transition:
        transform 0.1s ease,
        box-shadow 0.1s ease;
}


/* =========================
   FEATURE ICON
========================= */

.feature-icon {

    font-size: 34px;

}


/* =========================
   FEATURE NAME
========================= */

.feature-label {

    font-size: 17px;

}


/* =========================
   PRESS EFFECT
========================= */

.feature-button:active {

    transform:
        translateY(5px);

    box-shadow:
        0 1px 0 #c3c9d4,
        0 4px 8px
        rgba(0,0,0,0.08);

}


/* =========================
   SEPARATOR
========================= */

.separator {

    margin:
        35px 0 25px;

    border: none;

    border-top:
        2px solid #d0d5df;

}


/* =========================
   LOGOUT BUTTON
========================= */

.logout-button {

    width: 100%;

    max-width: 420px;

    display: block;

    margin: auto;

    padding: 16px;

    border: none;

    border-radius: 12px;

    background: #c62828;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 0 #8e1c1c;

    transition:
        transform 0.1s ease,
        box-shadow 0.1s ease;
}


.logout-button:active {

    transform:
        translateY(4px);

    box-shadow:
        0 1px 0 #8e1c1c;

}


/* =========================
   FOOTER
========================= */

footer {

    text-align: center;

    padding: 25px;

    color: #666;

    font-size: 14px;

}


/* =========================
   MOBILE
========================= */

@media (
    max-width: 500px
) {

    header h1 {

        font-size: 30px;

    }


    .feature-grid {

        gap: 14px;

    }


    .feature-button {

        min-height: 115px;

    }


    .feature-icon {

        font-size: 30px;

    }


    .feature-label {

        font-size: 15px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>
        MENU
    </h1>


    <button
        type="button"
        class="more-button"
        onclick="showMoreMessage()">

        More ▾

    </button>

</header>


<!-- =========================
     MAIN MENU
========================= -->

<div class="container">


    <div class="feature-grid">


        <!-- EARN POINTS -->

        <a
            href="earn.html"
            class="feature-button">

            <span
                class="feature-icon">

                💰

            </span>

            <span
                class="feature-label">

                Earn Points

            </span>

        </a>


        <!-- WATCH & EARN -->

        <a
            href="watch.html"
            class="feature-button">

            <span
                class="feature-icon">

                📺

            </span>

            <span
                class="feature-label">

                Watch & Earn

            </span>

        </a>


        <!-- DAILY SPIN -->

        <a
            href="spin.html"
            class="feature-button">

            <span
                class="feature-icon">

                🎡

            </span>

            <span
                class="feature-label">

                Daily Spin

            </span>

        </a>


        <!-- CHALLENGES -->

        <a
            href="challenges.html"
            class="feature-button">

            <span
                class="feature-icon">

                🏆

            </span>

            <span
                class="feature-label">

                Challenges

            </span>

        </a>


        <!-- BUY POINTS -->

        <a
            href="buy-points.html"
            class="feature-button">

            <span
                class="feature-icon">

                💳

            </span>

            <span
                class="feature-label">

                Buy Points

            </span>

        </a>


        <!-- MY BALANCE -->

        <a
            href="balance.html"
            class="feature-button">

            <span
                class="feature-icon">

                💰

            </span>

            <span
                class="feature-label">

                My Balance

            </span>

        </a>


        <!-- WITHDRAW -->

        <a
            href="withdraw.html"
            class="feature-button">

            <span
                class="feature-icon">

                💸

            </span>

            <span
                class="feature-label">

                Withdraw

            </span>

        </a>


        <!-- REWARDS -->

        <a
            href="rewards.html"
            class="feature-button">

            <span
                class="feature-icon">

                🎁

            </span>

            <span
                class="feature-label">

                Rewards

            </span>

        </a>


    </div>


    <!-- =========================
         SEPARATOR
    ========================= -->

    <hr
        class="separator">


    <!-- =========================
         LOGOUT
    ========================= -->

    <button
        type="button"
        class="logout-button"
        onclick="logoutUser()">

        🚪 Logout

    </button>


</div>


<!-- =========================
     FOOTER
========================= -->

<footer>

    Reward Platform — Prototype

</footer>


<script>

/* =========================
   PAGE PROTECTION
========================= */

if (
    localStorage.getItem("loggedIn") !== "true"
) {

    window.location.href =
        "login.html";

}


/* =========================
   LOGOUT
========================= */

function logoutUser() {

    localStorage.removeItem(
        "loggedIn"
    );

    window.location.href =
        "index.html";

}


/* =========================
   MORE
========================= */

function showMoreMessage() {

    alert(
        "More features will be available here soon."
    );

}

</script>


</body>

</html>
