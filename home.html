<!DOCTYPE html>
<html>
<head>
  <script src="https://quge5.com/88/tag.min.js" data-zone="286869" async data-cfasync="false"></script>
  <title>Home - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="monetag" content="b671b8351bfc48ed0161f6bd0b6a5340">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; overflow-x: hidden; }
   .container { max-width: 500px; margin: 0 auto; }
   .header { text-align: center; margin: 40px 0 30px 0; }
   .header h2 { font-size: 34px; font-weight: bold; color: #fff; }
   .header h2 span { color: #fbbf24; font-weight: bold; text-transform: capitalize; }
   .balance-card { background: #2f3e1a; border: 2px solid #fbbf24; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px; }
   .balance-card.label { font-size: 14px; color: #ccc; }
   .balance-card.amount { font-size: 32px; font-weight: bold; color: #fbbf24; margin-top: 5px; }
   .balance-card.usd { font-size: 16px; color: #aaa; margin-top: 8px; }
   .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
   .menu-btn { background: linear-gradient(180deg, #ffffff, #e8e8e8); color: #000; border: none; border-radius: 15px; padding: 20px 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; box-shadow: 0 6px 0 #bbbbbb, 0 8px 15px rgba(0,0,0,0.3); transition: all 0.1s ease; display: flex; flex-direction: column; align-items: center; gap: 8px; }
   .menu-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #bbbbbb; }
   .menu-btn.emoji { font-size: 43px!important; line-height: 1!important; display: block!important; margin-bottom: 4px; }
   .logout-btn { width: 40%; height: 48px; margin: 30px auto 0 auto; display: block; padding: 0; background: #f59e0b; color: #000; border: none; border-radius: 999px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #d97706; }
   .logout-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #d97706; }
   .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
   .modal-content { background: #2f3e1a; border: 3px solid #fbbf24; border-radius: 20px; padding: 18px; width: 100%; max-width: 420px; color: white; max-height: 95vh; overflow-y: auto; position: relative; }
   .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
   .modal-header h2 { font-size: 20px; color: #fbbf24; display: flex; align-items: center; gap: 8px; }
   .close-btn { font-size: 24px; color: white; cursor: pointer; font-weight: bold; }
   .popup-balance { background: #000; border: 2px solid #fbbf24; border-radius: 15px; padding: 15px; margin: 10px 0; text-align: center; }
   .input-box { width: 100%; padding: 14px; margin: 8px 0; background: #000; border: 2px solid #444; border-radius: 12px; color: white; font-size: 15px; outline: none; }
   .input-box:focus { border-color: #fbbf24; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #000; padding: 12px 22px; border-radius: 10px; font-weight: bold; display: none; z-index: 9999; }
  </style>
</head>
<body>
<div class="container">
  <div class="header"><h2>Hello, <span id="usernameDisplay">User</span> 👋</h2></div>
  <div class="balance-card">
    <div class="label">Your Points Balance</div>
    <div class="amount" id="pointsBalance">0 pts</div>
    <div class="usd" id="usdBalance">$0.00</div>
  </div>
  <div class="menu-grid">
    <button class="menu-btn" onclick="window.location.href='./earn.html'"><span class="emoji">💰</span>Earn Points</button>
    <button class="menu-btn" onclick="window.location.href='./withdraw.html'"><span class="emoji">💸</span>Withdraw</button>
    <button class="menu-btn" onclick="window.location.href='./refer.html'"><span class="emoji">👥</span>Refer & Earn</button>
    <button class="menu-btn" onclick="window.location.href='./support.html'"><span class="emoji">🎧</span>Support</button>
  </div>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d",
    storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
    messagingSenderId: "787550951987",
    appId: "1:787550951987:web:724b1463e821b99c90a146"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  let currentUser = null;

  const WHITELIST = ['admin@reward.rw','priyamwiza25@gmail.com','inezarose25@gmail.com'].map(e=>e.toLowerCase());

  function getDeviceIdSafe(){
    let id = localStorage.getItem('deviceId');
    if(!id){ id = Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('deviceId', id); }
    return id;
  }
  function showToast(msg, color='#22c55e'){
    const t = document.getElementById('toast');
    t.style.background = color; t.innerText = msg; t.style.display='block';
    setTimeout(()=> t.style.display='none', 3000);
  }
  function loadData(data){
    document.getElementById('usernameDisplay').innerText = data.username || data.email?.split('@')[0] || 'User';
    const pts = data.balance || data.points || 0;
    document.getElementById('pointsBalance').innerText = pts + ' pts';
    // 2000 pts = $1 (from your config)
    const usd = (pts / 2000).toFixed(2);
    document.getElementById('usdBalance').innerText = '$' + usd;
  }

  // === FIXED AUTH - NO MORE KICK LOOP ===
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      localStorage.clear();
      window.location.replace('./index.html');
      return;
    }
    currentUser = user;
    try {
      const docRef = db.collection("users").doc(user.uid);
      let snap = await docRef.get();

      // FIX 1: If doc doesn't exist, create it - don't kick
      if (!snap.exists) {
        const myDev = getDeviceIdSafe();
        await docRef.set({
          email: user.email,
          emailLower: user.email.toLowerCase(),
          balance: 0,
          points: 0,
          username: user.email.split('@')[0],
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          deviceId: myDev,
          emailVerified: true
        }, {merge:true});
        snap = await docRef.get();
      }

      const data = snap.data() || {};
      const emailLower = (data.emailLower || data.email || user.email || "").toLowerCase();
      const myDeviceId = getDeviceIdSafe();
      const isWhitelisted = WHITELIST.includes(emailLower);

      // FIX 2: Don't kick on device change, just update it
      if (!isWhitelisted && data.deviceId && myDeviceId && data.deviceId!== myDeviceId) {
        console.log("Device changed, updating");
        try { await docRef.update({ deviceId: myDeviceId }); } catch(e){}
        data.deviceId = myDeviceId;
      }
      if (!data.deviceId && myDeviceId) {
        try { await docRef.update({ deviceId: myDeviceId }); } catch(e){}
      }

      // Check banned
      if(data.isBanned){
        alert("You are banned: " + (data.bannedReason||""));
        await auth.signOut();
        window.location.replace('./index.html');
        return;
      }

      localStorage.setItem('userData', JSON.stringify({...data, deviceId: myDeviceId}));
      localStorage.setItem('points', data.balance || 0);
      loadData({...data, deviceId: myDeviceId});

    } catch(e) {
      console.error("auth error", e);
      const cached = JSON.parse(localStorage.getItem('userData') || '{}');
      if(cached.username || cached.email){
        loadData(cached);
      }
    }
  });

  window.logout = async () => {
    await auth.signOut();
    localStorage.clear();
    window.location.replace('./index.html');
  };
</script>
</body>
</html>
