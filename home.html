<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Reward Platform</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#cfeaff;min-height:100vh;display:flex;flex-direction:column}
.top-bar{background:#fff;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-radius:0 0 18px 18px;box-shadow:0 4px 12px rgba(0,0,0,.08);position:sticky;top:0;z-index:100}
.welcome{font-weight:900;font-size:18px;color:#0e7490}
.welcome span{color:#6d28d9}
.content{flex:1;display:flex;justify-content:space-between;align-items:center;padding:18px 12px;gap:12px}
.balance-card{background:linear-gradient(180deg,#fffaf0,#ffe9e9);border:2px solid #fecaca;border-radius:18px;padding:18px 14px;min-width:140px;max-width:165px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.1)}
.balance-card .label{font-size:11px;font-weight:900;color:#7c3aed}
.coins{font-weight:900;font-size:18px;margin-top:6px}
.usdt{font-weight:900;color:#059669;margin-top:10px;font-size:18px}
.right-stack{display:flex;flex-direction:column;gap:10px;align-items:flex-end;width:60%}
.earn-btn{background:#fff;border-radius:999px;padding:10px 14px;font-weight:900;font-size:13px;border:2px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:220px;cursor:pointer;text-decoration:none;color:#111827;box-shadow:0 4px 10px rgba(0,0,0,.06);position:relative}
.earn-btn.locked{opacity:.95}
.badge-lock{background:#111827;color:#fbbf24;border-radius:999px;padding:3px 8px;font-size:12px}
.badge-live{background:#22c55e;color:#fff;border-radius:999px;padding:3px 8px;font-size:11px;animation:pulse 1.2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.bottom-image{height:180px;background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') center/cover;border-top:2px solid #fff}
.bottom-nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:8px 16px;display:flex;gap:14px;box-shadow:0 8px 20px rgba(0,0,0,.15);z-index:100}
.nav-item{font-weight:900;font-size:12px;display:flex;align-items:center;gap:4px;text-decoration:none;color:#111827}
.timer-small{font-size:10px;color:#6b7280;font-weight:800;margin-left:4px}
</style>
</head>
<body>
<div class="top-bar">
<div style="font-weight:900">🏠 Home</div>
<div class="welcome">Welcome <span id="userName">Ineza</span></div>
<div style="width:28px;height:28px;border-radius:50%;background:#ddd"></div>
</div>

<div class="content">
<div class="balance-card">
<div class="label">Your Balance</div>
<div style="margin-top:6px;font-size:11px;font-weight:900;color:#b45309">⭐ COINS</div>
<div class="coins" id="coinBal">112 coins</div>
<div style="font-size:10px;color:#6b7280">= $0.0560</div>
<div style="margin-top:8px;font-size:11px;font-weight:900;color:#0e7490">💎 USDT</div>
<div class="usdt" id="usdtBal">0.8815 USDT</div>
</div>

<div class="right-stack" id="rightStack">
<!-- ORDER YOU ASKED: Watch, Articles, Quiz, Daily Bonus, Survey, Refer -->
<a class="earn-btn" id="btnWatch" href="watch.html">Watch & Earn 📺 <span id="watchBadge"></span></a>
<a class="earn-btn" id="btnArticles" href="articles_earn.html">Articles Earn 📖 <span id="articlesBadge"></span></a>
<a class="earn-btn" id="btnQuiz" href="quiz_earn.html">Quiz 🧠 <span id="quizBadge"></span></a>
<a class="earn-btn" href="daily_bonus.html">Daily Bonus 🎁</a>
<a class="earn-btn" href="surveys.html">Surveys 📋</a>
<a class="earn-btn" href="refer.html">Refer & Earn 🤝</a>
</div>
</div>

<div class="bottom-image"></div>

<div class="bottom-nav">
<a class="nav-item" href="wallet.html">💰 Wallet</a>
<a class="nav-item" href="more.html">❄️ More</a>
<a class="nav-item" href="offers.html">💎 Offers</a>
</div>

<script>
(() => {
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
function getChain(){try{return JSON.parse(localStorage.getItem('chain_v2')||'{}');}catch(e){return {};}}
function saveChain(c){localStorage.setItem('chain_v2',JSON.stringify(c));}
function formatRemaining(ms){if(ms<=0)return"0m";const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);if(h>0)return `${h}h ${m}m`;return `${m}m`;}

function evaluateChain(){
  const c=getChain(), now=Date.now();
  const wBadge=document.getElementById('watchBadge'), qBadge=document.getElementById('quizBadge'), aBadge=document.getElementById('articlesBadge');
  const btnWatch=document.getElementById('btnWatch'), btnQuiz=document.getElementById('btnQuiz'), btnArticles=document.getElementById('btnArticles');
  
  // Reset
  [wBadge,qBadge,aBadge].forEach(b=>{if(b) b.innerHTML="";});
  [btnWatch,btnQuiz,btnArticles].forEach(b=>{if(b) b.classList.remove('locked');});

  // Watch logic
  if(c.watch_nextAvail && now < c.watch_nextAvail){
    wBadge.innerHTML=`<span class="badge-lock">🔒 ${formatRemaining(c.watch_nextAvail-now)}</span>`;
    btnWatch.classList.add('locked');
  } else if(c.watch_open && c.watch_expiry && now < c.watch_expiry){
    wBadge.innerHTML=`<span class="badge-live">Live ${formatRemaining(c.watch_expiry-now)}</span>`;
  } else if(!c.watch_finishedToday){
    wBadge.innerHTML=`<span class="badge-live" style="background:#fbbf24;color:#000">Open</span>`;
  }

  // Quiz logic - opens immediately after Watch finishes (even 6/10)
  if(c.quiz_open && c.quiz_expiry && now < c.quiz_expiry && !c.quiz_doneToday && !c.quiz_skippedToday){
    qBadge.innerHTML=`<span class="badge-live">Live ${formatRemaining(c.quiz_expiry-now)}</span>`;
  } else if((c.quiz_doneToday || (c.quiz_nextAvail && now < c.quiz_nextAvail))){
    const diff=c.quiz_nextAvail-now;
    if(diff>0){
      qBadge.innerHTML=`<span class="badge-lock">🔒 ${formatRemaining(diff)}</span>`;
      btnQuiz.classList.add('locked');
    }
  } else if(c.watch_finishedToday && !c.quiz_open){
    // Watch done but quiz not yet opened - should be open
    qBadge.innerHTML=`<span class="badge-live">Live</span>`;
  } else {
    qBadge.innerHTML=`<span class="badge-lock">🔒</span>`;
    if(!c.watch_finishedToday) btnQuiz.classList.add('locked');
  }

  // Articles logic
  if(c.articles_open && c.articles_expiry && now < c.articles_expiry && !c.articles_doneToday){
    aBadge.innerHTML=`<span class="badge-live">Live ${formatRemaining(c.articles_expiry-now)}</span>`;
  } else if(c.articles_nextAvail && now < c.articles_nextAvail){
    aBadge.innerHTML=`<span class="badge-lock">🔒 ${formatRemaining(c.articles_nextAvail-now)}</span>`;
    btnArticles.classList.add('locked');
  } else if(c.quiz_doneToday || c.quiz_skippedToday){
    aBadge.innerHTML=`<span class="badge-live" style="background:#fbbf24;color:#000">Open</span>`;
  } else {
    aBadge.innerHTML=`<span class="badge-lock">🔒</span>`;
    btnArticles.classList.add('locked');
  }
}

function goWatch(e){
  const c=getChain(), now=Date.now();
  if(c.watch_nextAvail && now < c.watch_nextAvail){ e.preventDefault(); alert(`Watch locked for ${formatRemaining(c.watch_nextAvail-now)}`); return; }
  if(!c.watch_open || now >= c.watch_expiry){
    const now2=Date.now();
    c.watch_open=now2;
    c.watch_expiry=now2+30*60*1000;
    c.watch_finishedToday=null;
    saveChain(c);
  }
}
function goQuiz(e){
  const c=getChain(), now=Date.now();
  if(!c.watch_finishedToday && !(c.watch_open && now >= c.watch_expiry)){ // allow if watch expired
    // if watch not finished and not expired, block
    if(!c.watch_finishedToday && c.watch_nextAvail && now < c.watch_nextAvail){
      // watch already finished and locked, so allow quiz
    } else if(!c.watch_finishedToday){
      const ch=getChain();
      if(!ch.watch_finishedToday && ch.watch_open && now < ch.watch_expiry && !ch.watch_nextAvail){
        // still in watch live
        e.preventDefault(); alert("Finish Watch first (even 6/10 counts)"); return;
      }
    }
  }
  if(c.quiz_nextAvail && now < c.quiz_nextAvail && c.quiz_doneToday){
    e.preventDefault(); alert(`Quiz locked`); return;
  }
  if(c.quiz_open && now >= c.quiz_expiry){
    // expired, open articles
    const now2=Date.now();
    c.quiz_skippedToday=localStorage.getItem('chain_v2')?JSON.parse(localStorage.getItem('chain_v2')).quiz_open:null;
    c.articles_open=now2;
    c.articles_expiry=now2+30*60*1000;
    c.articles_nextAvail=now2+24*60*60*1000;
    saveChain(c);
  }
}

document.getElementById('btnWatch').addEventListener('click', goWatch);
document.getElementById('btnQuiz').addEventListener('click', goQuiz);
document.getElementById('btnArticles').addEventListener('click', (e)=>{
  const c=getChain(), now=Date.now();
  if(c.articles_nextAvail && now < c.articles_nextAvail && c.articles_doneToday){
    e.preventDefault(); alert("Articles locked"); return;
  }
  if(!c.quiz_doneToday && !c.quiz_skippedToday){
    const cc=getChain();
    if(cc.quiz_open && cc.quiz_expiry && now < cc.quiz_expiry){ e.preventDefault(); alert("Finish Quiz first"); return; }
    if(!cc.quiz_doneToday && !cc.quiz_skippedToday && !cc.watch_finishedToday){ e.preventDefault(); alert("Complete Watch & Quiz first"); return; }
  }
});

auth.onAuthStateChanged(user=>{
  if(!user){location.href="./index.html";return;}
  db.collection("users").doc(user.uid).onSnapshot(snap=>{
    if(!snap.exists) return;
    const data=snap.data()||{};
    document.getElementById('coinBal').textContent=`${data.balance||0} coins`;
    document.getElementById('usdtBal').textContent=`${((data.balance||0)*0.0005).toFixed(4)} USDT`;
    document.getElementById('userName').textContent=data.name||"Ineza";
    if(data.chain){const local=getChain();let ch=false;for(let k in data.chain){if(data.chain[k]&&!local[k]){local[k]=data.chain[k];ch=true;}} if(ch) saveChain(local);}
    evaluateChain();
  });
});
setInterval(evaluateChain,1000);
evaluateChain();
})();
</script>
</body>
</html>
