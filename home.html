<script>
function openDrawer(){document.getElementById('sideDrawer').classList.add('open');document.getElementById('drawerOverlay').classList.add('show');}
function closeDrawer(){document.getElementById('sideDrawer').classList.remove('open');document.getElementById('drawerOverlay').classList.remove('show');}
(function(){try{var c=JSON.parse(localStorage.getItem('userData')||'{}');if(c&&(c.balance!=null||c.points!=null)){var bal=c.balance??c.points??0;var usdt=c.usdtBalance??0;document.getElementById('balance').textContent=bal+' Coins';document.getElementById('usdBalance').textContent='$'+(bal*0.0005).toFixed(4);document.getElementById('usdtBalanceDisplay').innerHTML=Number(usdt).toFixed(4)+' <span style="color:#059669">USDT</span>';}}catch(e){}})();
const WINDOW=30*60*1000, BONUS_COOLDOWN=60*60*1000;
function getChain(){try{return JSON.parse(localStorage.getItem('chain_v2')||'{}')}catch(e){return {}}}
function saveChain(c){localStorage.setItem('chain_v2',JSON.stringify(c))}
function fmtShort(ms){if(ms<=0) return "0m";const m=Math.floor(ms/60000);const h=Math.floor(m/60);const rm=m%60;if(h>0) return h+"h "+rm+"m";return m+"m";}
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200);}
window.alert=showToast;
const btnWatch=document.getElementById('btnWatch'), btnQuiz=document.getElementById('btnQuiz'), btnArticles=document.getElementById('btnArticles'), btnBonus=document.getElementById('btnBonus');
function localDayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function setBtnState(btn, state, txt){
  if(!btn) return; let old=btn.querySelector('.badge'); if(old) old.remove();
  if(state==='locked'){const b=document.createElement('span'); b.className='badge padlock'; b.textContent='🔒'; btn.appendChild(b);}
  else if(state==='open'){const b=document.createElement('span'); b.className='badge green'; b.textContent='Open'; btn.appendChild(b);}
  else if(state==='live'){const b=document.createElement('span'); b.className='badge live'; b.textContent='Live '+txt; btn.appendChild(b);}
  else if(state==='wait'){const b=document.createElement('span'); b.className='badge soon'; b.textContent='⏳ '+txt; btn.appendChild(b);}
  else if(state==='done'){const b=document.createElement('span'); b.className='badge padlock'; b.textContent='✅ Done'; btn.appendChild(b);}
}
function evaluateChain(){
  const c=getChain(); const now=Date.now(); const today=localDayKey();
  if(c.articles_finishedToday===today){setBtnState(btnWatch,'done','');setBtnState(btnQuiz,'done','');setBtnState(btnArticles,'done','');}
  else {
    if(c.watch_nextAvail && now < c.watch_nextAvail){setBtnState(btnWatch,'wait', fmtShort(c.watch_nextAvail-now));}
    else if(c.watch_finishedToday===today){setBtnState(btnWatch,'done','');}
    else if(c.watch_open && now < c.watch_expiry){setBtnState(btnWatch,'live', fmtShort(c.watch_expiry-now));}
    else {setBtnState(btnWatch,'open','');}
    if(c.quiz_finishedToday===today){setBtnState(btnQuiz,'done','');}
    else if(c.watch_finishedToday!==today){setBtnState(btnQuiz,'locked','');}
    else {setBtnState(btnQuiz,'open','');}
    if(c.articles_finishedToday===today){setBtnState(btnArticles,'done','');}
    else if(c.quiz_finishedToday!==today){setBtnState(btnArticles,'locked','');}
    else {setBtnState(btnArticles,'open','');}
  }
  try{
    const ud=JSON.parse(localStorage.getItem('userData')||'{}');let ms=0;
    if(ud.lastBonusTimestamp){const lb=ud.lastBonusTimestamp;if(lb.toMillis) ms=lb.toMillis();else if(lb.seconds) ms=lb.seconds*1000;else if(typeof lb==='number') ms=lb;}
    if(!ms){setBtnState(btnBonus,'open','');} else {const diff=now-ms;if(diff>=BONUS_COOLDOWN){setBtnState(btnBonus,'live','Ready');} else {setBtnState(btnBonus,'wait', fmtShort(BONUS_COOLDOWN-diff));}}
  }catch(e){ setBtnState(btnBonus,'open',''); }
}
window.goWatch=()=>{const c=getChain(); const now=Date.now(); const today=localDayKey();if(c.articles_finishedToday===today){showToast(`All done today ✅`); return;}if(c.watch_nextAvail && now < c.watch_nextAvail){showToast(`Watch locked - ${fmtShort(c.watch_nextAvail-now)}`); return;}if(c.watch_finishedToday===today){showToast(`Watch done today`); return;}if(!c.watch_open || now > c.watch_expiry){c.watch_open=now;c.watch_expiry=now+WINDOW;saveChain(c);}location.href='./watch.html';};
window.goQuiz=()=>{const c=getChain(); const today=localDayKey();if(c.articles_finishedToday===today){showToast(`All done today`); return;}if(c.quiz_finishedToday===today){showToast("Quiz done"); return;}if(c.watch_finishedToday!==today){showToast("Finish Watch first"); return;}location.href='./quiz_earn.html';};
window.goArticles=()=>{const c=getChain(); const today=localDayKey();if(c.articles_finishedToday===today){showToast(`All done today`); return;}if(c.quiz_finishedToday!==today){showToast("Finish Quiz first"); return;}location.href='./articles_earn.html';};
setInterval(evaluateChain,1000); evaluateChain();
(function(){
  const wrap=document.getElementById('wrap');const pullRef=document.getElementById('pullRef');let startY=0,pulling=false,threshold=80;
  wrap.addEventListener('touchstart',e=>{if(window.scrollY===0){startY=e.touches[0].clientY;pulling=false;}},{passive:true});
  wrap.addEventListener('touchmove',e=>{const diff=e.touches[0].clientY-startY;if(diff>15){pulling=true;pullRef.classList.add('show');}},{passive:true});
  wrap.addEventListener('touchend',e=>{if(pulling){const diff=e.changedTouches[0].clientY-startY;if(diff>threshold){pullRef.classList.add('loading');setTimeout(()=>location.reload(),700);}else{pullRef.classList.remove('show');}}startY=0;pulling=false;},{passive:true});
})();
</script>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};firebase.initializeApp(firebaseConfig);
try{const appCheck=firebase.appCheck();appCheck.activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);}catch(e){}
const auth=firebase.auth(),db=firebase.firestore();
function loadData(d){if(!d)return;document.getElementById('balance').innerText=(d.balance??d.points??0)+' Coins';document.getElementById('usdBalance').innerText='$'+((d.balance??d.points??0)*0.0005).toFixed(4);document.getElementById('usdtBalanceDisplay').innerHTML=Number(d.usdtBalance||0).toFixed(4)+' <span style="color:#059669">USDT</span>';localStorage.setItem('userData',JSON.stringify(d));if(d.username){document.getElementById('drawerUsername').innerText=d.username;document.getElementById('drawerAvatar').innerText=d.username.charAt(0).toUpperCase();}if(d.email){document.getElementById('drawerEmail').innerText=d.email;}if(d.uid||d.id){document.getElementById('drawerId').innerText='ID: '+String(d.uid||d.id).slice(0,12);}if(d.chain){const local=getChain();let changed=false;for(let k in d.chain){if(d.chain[k]){if(!local[k]||d.chain[k]>local[k]){local[k]=d.chain[k];changed=true;}}}if(changed) saveChain(local); evaluateChain();}}
db.collection("appConfig").doc("main").onSnapshot(s=>{if(s.exists&&s.data().maintenanceMode==="on"){document.getElementById('maint').style.display='flex';}else{document.getElementById('maint').style.display='none';}});
auth.onAuthStateChanged(u=>{if(u){if(u.email)document.getElementById('drawerEmail').innerText=u.email;if(u.uid)document.getElementById('drawerId').innerText='ID: '+u.uid.slice(0,12);db.collection('users').doc(u.uid).onSnapshot(doc=>{if(doc.exists)loadData(doc.data());});}else{location.href='./index.html';}});
</script></body></html>
