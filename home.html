<script>
function openDrawer(){document.getElementById('sideDrawer').classList.add('open');document.getElementById('drawerOverlay').classList.add('show');}
function closeDrawer(){document.getElementById('sideDrawer').classList.remove('open');document.getElementById('drawerOverlay').classList.remove('show');}
// ===== INDEPENDENT - NO CHAIN - EACH PAGE HAS OWN nextAvail =====
const BONUS_COOLDOWN=60*60*1000;
function getNextAvail(key){ return Number(localStorage.getItem(key+'_v1')||0); }
function setNextAvail(key, ts){ localStorage.setItem(key+'_v1', String(ts)); }
function fmtShort(ms){
  if(ms<=0) return "Ready";
  const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000), s=Math.floor((ms%60000)/1000);
  if(h>0) return h+"h "+m+"m";
  if(m>0) return m+"m "+s+"s";
  return s+"s";
}
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200);}
window.alert=showToast;
const btnWatch=document.getElementById('btnWatch'), btnQuiz=document.getElementById('btnQuiz'), btnArticles=document.getElementById('btnArticles'), btnBonus=document.getElementById('btnBonus');
function setBtnState(btn, state, remainingMs){
  if(!btn) return; let old=btn.querySelector('.badge'); if(old) old.remove();
  const b=document.createElement('span');
  if(state==='locked'){ b.className='badge padlock'; b.textContent='🔒 '+fmtShort(remainingMs); }
  else { b.className='badge green'; b.textContent='Open'; }
  btn.appendChild(b);
}
function getBonusRemaining(){
  try{
    const ud=JSON.parse(localStorage.getItem('userData')||'{}');let ms=0;
    if(ud.lastBonusTimestamp){const lb=ud.lastBonusTimestamp;if(lb.toMillis) ms=lb.toMillis();else if(lb.seconds) ms=lb.seconds*1000;else if(lb._seconds) ms=lb._seconds*1000;else if(typeof lb==='number') ms=lb;else if(typeof lb==='string') ms=Date.parse(lb)||0;}
    if(!ms) return 0;
    return Math.max(0, BONUS_COOLDOWN - (Date.now()-ms));
  }catch(e){ return 0; }
}
function evaluateIndependent(){
  const now=Date.now();
  const w=getNextAvail('watch_nextAvail'), q=getNextAvail('quiz_nextAvail'), a=getNextAvail('articles_nextAvail');
  setBtnState(btnWatch, (w && now<w)?'locked':'open', w-now);
  setBtnState(btnQuiz, (q && now<q)?'locked':'open', q-now);
  setBtnState(btnArticles, (a && now<a)?'locked':'open', a-now);
  const rem=getBonusRemaining();
  setBtnState(btnBonus, rem>0?'locked':'open', rem);
}
window.goWatch=()=>{
  const now=Date.now(), w=getNextAvail('watch_nextAvail');
  if(w && now<w){ showToast(`🔒 Watch locked - Opens in ${fmtShort(w-now)}`); return; }
  location.href='./watch.html';
};
window.goQuiz=()=>{
  const now=Date.now(), q=getNextAvail('quiz_nextAvail');
  if(q && now<q){ showToast(`🔒 Quiz locked - Opens in ${fmtShort(q-now)}`); return; }
  location.href='./quiz_earn.html';
};
window.goArticles=()=>{
  const now=Date.now(), a=getNextAvail('articles_nextAvail');
  if(a && now<a){ showToast(`🔒 Articles locked - Opens in ${fmtShort(a-now)}`); return; }
  location.href='./articles_earn.html';
};
window.goBonus=()=>{
  const rem=getBonusRemaining();
  if(rem>0){showToast(`⏳ Bonus locked - Ready in ${fmtShort(rem)}`); return;}
  location.href='./bonus.html';
};
setInterval(evaluateIndependent,1000); evaluateIndependent();
</script>
