<!DOCTYPE html>
<html>
<head>
  <title>Home - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; overflow-x: hidden; }
    .container { max-width: 500px; margin: 0 auto; }
    .header { text-align: center; margin: 40px 0 30px 0; }
    .header h2 { font-size: 34px; font-weight: bold; color: #fff; }
    .header h2 span { color: #fbbf24; font-weight: bold; text-transform: capitalize; }
    .balance-card { background: #2f3e1a; border: 2px solid #fbbf24; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px; }
    .balance-card .label { font-size: 14px; color: #ccc; }
    .balance-card .amount { font-size: 32px; font-weight: bold; color: #fbbf24; margin-top: 5px; }
    .balance-card .usd { font-size: 16px; color: #aaa; margin-top: 8px; }
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    .menu-btn { background: linear-gradient(180deg, #ffffff, #e8e8e8); color: #000; border: none; border-radius: 15px; padding: 20px 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; box-shadow: 0 6px 0 #bbbbbb, 0 8px 15px rgba(0,0,0,0.3); transition: all 0.1s ease; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .menu-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #bbbbbb; }
    .menu-btn .emoji { font-size: 32px; }
    .logout-btn { width: 35%; height: 60px; margin: 30px auto 0 auto; display: block; padding: 0; background: #f59e0b; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #d97706; }
    .logout-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #d97706; }
  </style>
</head>
<body>
<div class="container">
  <div class="header"><h2>Welcome <span id="usernameDisplay">...</span></h2></div>
  <div class="balance-card">
    <div class="label">Your Balance</div>
    <div class="amount" id="balanceDisplay">0 Points</div>
    <div class="usd" id="usdDisplay">≈ $0.00</div>
  </div>
  <div class="menu-grid">
    <button class="menu-btn" onclick="window.location.href='./tasks.html'"><span class="emoji">📋</span>Tasks</button>
    <button class="menu-btn" onclick="window.location.href='./refer.html'"><span class="emoji">👥</span>Referrals</button>
    <button class="menu-btn" onclick="window.location.href='./withdraw.html'"><span class="emoji">💸</span>Withdraw</button>
    <button class="menu-btn" onclick="window.location.href='./support.html'"><span class="emoji">🎧</span>Support</button>
  </div>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d",
    storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
    messagingSenderId: "787550951987",
    appId: "1:787550951987:web:724b1463e821b99c90a146"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  let currentUser = null;

  function loadData(data){
    const name = data.username || localStorage.getItem('username') || 'User';
    const bal = data.balance || data.points || localStorage.getItem('points') || 0;
    document.getElementById('usernameDisplay').innerText = name;
    document.getElementById('balanceDisplay').innerText = bal + ' Points';
    document.getElementById('usdDisplay').innerText = '≈ $' + (bal/1000).toFixed(2);
    // cache
    localStorage.setItem('username', name);
    localStorage.setItem('points', bal);
    localStorage.setItem('userData', JSON.stringify(data));
  }

  // 0 SEC INSTANT: show cached first
  const cached = localStorage.getItem('userData');
  if(cached){
    try{ loadData(JSON.parse(cached)); }catch(e){}
  } else {
    const uname = localStorage.getItem('username');
    if(uname) document.getElementById('usernameDisplay').innerText = uname;
  }

  // INSTANT Firebase verify
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      try {
        const doc = await db.collection("users").doc(user.uid).get();
        if (doc.exists) {
          const data = doc.data();
          if(data.isBanned){
            alert("⛔ Account Banned: "+(data.bannedReason||"Contact support"));
            await auth.signOut();
            localStorage.clear();
            window.location.replace('./index.html');
            return;
          }
          loadData(data);
        }
      } catch(e) {
        console.log("home fetch:", e.message);
        // don't kick, keep cache
      }
    } else {
      // INSTANT kick if no Firebase user
      localStorage.clear();
      window.location.replace('./index.html');
    }
  });

  document.getElementById('logoutBtn').onclick = async ()=>{
    await auth.signOut();
    localStorage.clear();
    window.location.replace('./index.html');
  };
</script>
</body>
</html>
