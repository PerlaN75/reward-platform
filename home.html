<!DOCTYPE html>
<html>
<head>
  <title>Home - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="monetag" content="b671b8351bfc48ed0161f6bd0b6a5340">
  <!-- NO ADS IN HEAD - clean home, ads only on Daily/Gifts/Watch -->
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#0f1508;min-height:100vh;padding:20px;color:white}
    .container{max-width:500px;margin:0 auto}
    .header{text-align:center;margin:30px 0 25px 0}
    .header h2{font-size:32px;color:#fff}
    .header h2 span{color:#fbbf24}
    .balance-card{background:#2f3e1a;border:2px solid #fbbf24;border-radius:20px;padding:20px;text-align:center;margin-bottom:25px}
    .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:25px}
    .menu-btn{background:linear-gradient(180deg,#fff,#e8e8e8);color:#000;border:none;border-radius:15px;padding:18px 10px;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 6px 0 #bbbbbb,0 8px 15px rgba(0,0,0,0.3);display:flex;flex-direction:column;align-items:center;gap:8px}
    .menu-btn:active{transform:translateY(6px);box-shadow:none}
    .menu-btn .emoji{font-size:30px}
    .logout-btn{width:40%;height:55px;margin:20px auto 0;display:block;background:#f59e0b;color:#000;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;box-shadow:0 4px 0 #d97706}
    .modal{display:none;position:fixed;z-index:999;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.85);justify-content:center;align-items:center;padding:15px}
    .modal-content{background:#2f3e1a;border:3px solid #fbbf24;border-radius:20px;padding:18px;width:100%;max-width:420px}
    .close{float:right;font-size:24px;cursor:pointer}
    .claim-btn{width:100%;padding:14px;background:#fbbf24;color:#000;border:none;border-radius:12px;font-weight:bold;margin-top:15px;cursor:pointer}
  </style>
</head>
<body>
<div class="container">
  <div class="header"><h2>Welcome, <span id="username">Priya</span></h2></div>
  <div class="balance-card">
    <div>Your Balance</div>
    <div style="font-size:28px;color:#fbbf24;font-weight:bold" id="bal">120 points</div>
    <div style="font-size:14px;color:#aaa" id="usd">≈ $0.06 USD</div>
  </div>
  <div class="menu-grid">
    <button class="menu-btn" onclick="openWallet()"><span class="emoji">💰</span>Wallet</button>
    <button class="menu-btn" onclick="openDaily()"><span class="emoji">📅</span>Daily Checkin</button>
    <button class="menu-btn" onclick="location.href='./watch.html'"><span class="emoji">📺</span>Watch & Earn</button>
    <button class="menu-btn" onclick="location.href='./refer.html'"><span class="emoji">🤝</span>Refer & Earn</button>
    <button class="menu-btn" onclick="openGifts()"><span class="emoji">🎁</span>Gifts</button>
    <button class="menu-btn" onclick="openMore()"><span class="emoji">⚙️</span>More</button>
  </div>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<!-- Modals (keep your original content inside) -->
<div id="dailyModal" class="modal"><div class="modal-content"><span class="close" onclick="closeDaily()">&times;</span><h3>📅 Daily Checkin</h3><p style="margin:10px 0;color:#ccc;font-size:13px">Watch ad to claim bonus</p><button class="claim-btn" id="dailyBtn" onclick="claimDaily()">Watch Ad & Claim 50 pts</button></div></div>
<div id="giftModal" class="modal"><div class="modal-content"><span class="close" onclick="closeGifts()">&times;</span><h3>🎁 Gifts</h3><p style="color:#ccc;font-size:13px">Pick a gift - ad required</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px"><button class="claim-btn" onclick="pickGift(10)">🎁 10 pts</button><button class="claim-btn" onclick="pickGift(20)">🎁 20 pts</button><button class="claim-btn" onclick="pickGift(30)">🎁 30 pts</button><button class="claim-btn" onclick="pickGift(50)">🎁 50 pts</button></div></div></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.firestore();
let currentUser=null, bal=0;
auth.onAuthStateChanged(async(u)=>{
  if(!u){location.href='./index.html';return;}
  currentUser=u;
  const s=await db.collection('users').doc(u.uid).get();
  if(s.exists){ bal=s.data().balance||120; document.getElementById('bal').textContent=bal+' points'; document.getElementById('usd').textContent='≈ $'+(bal*0.0005).toFixed(2)+' USD'; document.getElementById('username').textContent=s.data().username||'Priya'; }
});
function logout(){ auth.signOut().then(()=>location.href='./index.html'); }

// --- ADS ONLY ON THESE 3 ---
let adLoaded=false;
function loadMonetag(){
  if(adLoaded) return;
  adLoaded=true;
  const sc=document.createElement('script');
  sc.src='https://quge5.com/88/tag.min.js';
  sc.setAttribute('data-zone','286869');
  sc.async=true; sc.setAttribute('data-cfasync','false');
  document.head.appendChild(sc);
}
function openDaily(){ loadMonetag(); document.getElementById('dailyModal').style.display='flex'; }
function closeDaily(){ document.getElementById('dailyModal').style.display='none'; }
function openGifts(){ loadMonetag(); document.getElementById('giftModal').style.display='flex'; }
function closeGifts(){ document.getElementById('giftModal').style.display='none'; }
function openWallet(){ location.href='./wallet.html'; }
function openMore(){ location.href='./more.html'; }

async function claimDaily(){
  const b=document.getElementById('dailyBtn'); b.textContent='Verifying ad... 3s'; b.disabled=true;
  setTimeout(async()=>{
    bal+=50; await db.collection('users').doc(currentUser.uid).set({balance:bal},{merge:true});
    document.getElementById('bal').textContent=bal+' points'; b.textContent='✅ Claimed!'; setTimeout(closeDaily,1000);
  },3000);
}
async function pickGift(p){
  if(!confirm(`Watch ad to claim ${p} pts?`)) return;
  loadMonetag();
  setTimeout(async()=>{
    bal+=p; await db.collection('users').doc(currentUser.uid).set({balance:bal},{merge:true});
    document.getElementById('bal').textContent=bal+' points'; alert(`✅ Got ${p} pts!`); closeGifts();
  },3000);
}
</script>
</body>
</html>
