<!DOCTYPE html>
<html>
<head>
  <title>Home - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="monetag" content="b671b8351bfc48ed0161f6bd0b6a5340">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; overflow-x: hidden; }
    .container { max-width: 500px; margin: 0 auto; }
    .header { text-align: center; margin: 40px 0 30px 0; }
    .header h2 { font-size: 34px; font-weight: bold; color: #fff; }
    .header h2 span { color: #fbbf24; font-weight: bold; text-transform: capitalize; }
    .balance-card { background: #2f3e1a; border: 2px solid #fbbf24; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px; }
    .balance-card .label { font-size: 14px; color: #ccc; }
    .balance-card .amount { font-size: 32px; font-weight: bold; color: #fbbf24; margin-top: 5px; }
    .balance-card .usd { font-size: 16px; color: #aaa; margin-top: 8px; }
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    .menu-btn { background: linear-gradient(180deg, #ffffff, #e8e8e8); color: #000; border: none; border-radius: 15px; padding: 20px 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; box-shadow: 0 6px 0 #bbbbbb, 0 8px 15px rgba(0,0,0,0.3); transition: all 0.1s ease; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .menu-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #bbbbbb; }
    .menu-btn .emoji { font-size: 35px; }
    .logout-btn { width: 35%; height: 60px; margin: 30px auto 0 auto; display: block; padding: 0; background: #f59e0b; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #d97706; }
    .logout-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #d97706; }
    .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
    .modal-content { background: #2f3e1a; border: 3px solid #fbbf24; border-radius: 20px; padding: 18px; width: 100%; max-width: 420px; color: white; max-height: 95vh; overflow-y: auto; position: relative; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-header h2 { font-size: 20px; color: #fbbf24; display: flex; align-items: center; gap: 8px; }
    .close-btn { font-size: 24px; color: white; cursor: pointer; font-weight: bold; }
    .popup-balance { background: #000; border: 2px solid #fbbf24; border-radius: 15px; padding: 15px; margin: 10px 0; text-align: center; }
    .gift-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .gift-box { background: #000; border: 2px solid #444; border-radius: 15px; padding: 20px 10px; text-align: center; cursor: pointer; }
    .gift-box span { font-size: 30px; display: block; }
    .claim-btn { width: 100%; padding: 14px; background: #fbbf24; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header"><h2>Hello, <span id="username">User</span> 👋</h2></div>
  <div class="balance-card">
    <div class="label">Total Balance</div>
    <div class="amount" id="balance">0 pts</div>
    <div class="usd" id="usd">$0.00</div>
  </div>
  <div class="menu-grid">
    <button class="menu-btn" onclick="openDaily()"><span class="emoji">📅</span>Daily Checkin</button>
    <button class="menu-btn" onclick="openGifts()"><span class="emoji">🎁</span>Gifts</button>
    <button class="menu-btn" onclick="location.href='./watch.html'"><span class="emoji">▶️</span>Watch & Earn</button>
    <button class="menu-btn" onclick="location.href='./refer.html'"><span class="emoji">👥</span>Refer & Earn</button>
  </div>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<!-- Daily Modal -->
<div id="dailyModal" class="modal"><div class="modal-content"><div class="modal-header"><h2>📅 Daily Checkin</h2><span class="close-btn" onclick="closeDaily()">&times;</span></div><p style="font-size:14px;color:#ccc;margin:10px 0;">Watch ad to claim daily bonus</p><div class="popup-balance" id="dailyReward">50 pts</div><button class="claim-btn" id="dailyBtn" onclick="claimDaily()">Watch Ad & Claim</button></div></div>

<!-- Gifts Modal -->
<div id="giftModal" class="modal"><div class="modal-content"><div class="modal-header"><h2>🎁 Gifts</h2><span class="close-btn" onclick="closeGifts()">&times;</span></div><p style="font-size:14px;color:#ccc;">Pick a gift — ad verification required</p><div class="gift-grid">
  <div class="gift-box" onclick="pickGift(10)"><span>🎁</span>10 pts</div>
  <div class="gift-box" onclick="pickGift(20)"><span>🎁</span>20 pts</div>
  <div class="gift-box" onclick="pickGift(30)"><span>🎁</span>30 pts</div>
  <div class="gift-box" onclick="pickGift(50)"><span>🎁</span>50 pts</div>
</div></div></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script>
// --- FIREBASE SETUP (unchanged) ---
const firebaseConfig = {apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain: "reward-platform-rw-2e13d.firebaseapp.com",projectId: "reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let currentUser=null, bal=0;
auth.onAuthStateChanged(async(u)=>{
  if(!u){location.href='./index.html';return;}
  currentUser=u;
  const s=await db.collection('users').doc(u.uid).get();
  if(s.exists){ bal=s.data().balance||0; document.getElementById('balance').textContent=bal+' pts'; document.getElementById('usd').textContent='$'+(bal*0.001).toFixed(2); document.getElementById('username').textContent=s.data().username||'User'; }
});
function logout(){ auth.signOut().then(()=>location.href='./index.html'); }

// --- MONETAG AD - ONLY FOR THESE 3 ACTIONS ---
let adLoaded=false;
function loadMonetagAd(){
  if(adLoaded) return;
  adLoaded=true;
  const s=document.createElement('script');
  s.src='https://quge5.com/88/tag.min.js';
  s.setAttribute('data-zone','286869');
  s.async=true;
  s.setAttribute('data-cfasync','false');
  document.head.appendChild(s);
}
function triggerAdVerification(callback){
  loadMonetagAd();
  // The click itself triggers Popunder + In-Page Push (286869)
  // We give 3 sec for Monetag to count impression before rewarding
  const btnMsg = document.activeElement;
  setTimeout(callback, 3500);
}

// --- MODALS ---
function openDaily(){ document.getElementById('dailyModal').style.display='flex'; }
function closeDaily(){ document.getElementById('dailyModal').style.display='none'; }
function openGifts(){ document.getElementById('giftModal').style.display='flex'; }
function closeGifts(){ document.getElementById('giftModal').style.display='none'; }

// --- 1. DAILY CHECKIN (with Ad) ---
async function claimDaily(){
  const b=document.getElementById('dailyBtn');
  b.textContent='📢 Showing Ad... Wait 3s'; b.disabled=true;
  triggerAdVerification(async()=>{
    bal+=50;
    await db.collection('users').doc(currentUser.uid).set({balance:bal,points:bal},{merge:true});
    document.getElementById('balance').textContent=bal+' pts';
    b.textContent='✅ Claimed 50 pts!';
    setTimeout(closeDaily,1000);
  });
}

// --- 2. GIFTS (with Ad) ---
async function pickGift(pts){
  // Show ad first, then give gift
  if(!confirm(`Watch ad to claim ${pts} pts gift?`)) return;
  loadMonetagAd(); // trigger popunder
  // Small delay so ad counts
  setTimeout(async()=>{
    bal+=pts;
    await db.collection('users').doc(currentUser.uid).set({balance:bal,points:bal},{merge:true});
    document.getElementById('balance').textContent=bal+' pts';
    alert(`✅ You got ${pts} pts! (Ad verified)`);
    closeGifts();
  }, 3000);
}
</script>
</body>
</html>
