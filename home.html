<!DOCTYPE html>
<html>
<head>
  <title>Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <style>
    /* SAME CSS AS BEFORE */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; padding: 20px; color: white; text-align: center; }
    h1 { font-size: 26px; margin-top: 10px; color: white; }
   .tagline { color: #fbbf24; font-size: 13px; margin: 8px 0 20px 0; }
   .points-box { background: #1a2410; padding: 25px; border-radius: 20px; margin-bottom: 25px; }
   .points-box h3 { font-size: 14px; color: #ccc; margin-bottom: 8px; text-transform: uppercase; }
   .points-box h2 { font-size: 56px; color: #f59e0b; font-weight: bold; }
   .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
   .menu-btn { background: linear-gradient(180deg, #ffffff, #f0f0f0); padding: 20px 10px; border-radius: 18px; text-align: center; cursor: pointer; box-shadow: 0 8px 0 #c7c7c7; }
   .menu-icon { font-size: 40px; margin-bottom: 10px; }
   .menu-text { font-size: 14px; font-weight: bold; color: #2f3e1a; }
   .logout-btn { width: 40%; padding: 16px 12px; margin-top: 30px; background: linear-gradient(180deg, #ef4444, #dc2626); color: white; border: none; border-radius: 12px; font-weight: bold; box-shadow: 0 5px 0 #b91c1c; }
   .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
   .modal-content { background: #4a6128; border: 3px solid #fbbf24; border-radius: 20px; padding: 20px; width: 100%; max-width: 420px; color: white; }
   .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
   .modal-header h2 { font-size: 22px; color: #fbbf24; }
   .close-btn { font-size: 28px; color: white; cursor: pointer; font-weight: bold; }
   /* ... all other modal css same as before ... */
  </style>
</head>
<body>
  <h1 id="welcomeText">Welcome back User</h1> <!-- INSTANT -->
  <div class="tagline">🐒 From Nothing to Something 🍇</div>
  <div class="points-box"><h3>YOUR POINTS</h3><h2 id="points">0</h2></div>

  <div class="menu-grid">
    <div class="menu-btn" onclick="openCheckin()"><div class="menu-icon">📅</div><div class="menu-text">Daily Checkin</div></div>
    <div class="menu-btn" onclick="openWatch()"><div class="menu-icon">📺</div><div class="menu-text">Watch & Earn</div></div>
    <div class="menu-btn" onclick="goTo('quiz.html')"><div class="menu-icon">🧠</div><div class="menu-text">Daily Quiz</div></div>
    <div class="menu-btn" onclick="goTo('referrals.html')"><div class="menu-icon">👥</div><div class="menu-text">Refer & Earn</div></div>
    <div class="menu-btn" onclick="openWallet()"><div class="menu-icon">💰</div><div class="menu-text">Wallet</div></div>
    <div class="menu-btn" onclick="goTo('more.html')"><div class="menu-icon">⚙️</div><div class="menu-text">More</div></div>
  </div>

  <button class="logout-btn" onclick="logout()">Logout</button>

  <!-- ALL 3 MODALS HERE SAME AS LAST VERSION -->
  <div id="walletModal" class="modal">...</div>
  <div id="checkinModal" class="modal">...</div>
  <div id="watchModal" class="modal">...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d", storageBucket: "reward-platform-rw-2e13d.firebasestorage.app", messagingSenderId: "787550951987", appId: "1:787550951987:web:724b1463e821b99c90a146" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let userData = { points: 0, usdt: 0, bnb: 0, xrp: 0, xlm: 0, streak: 0, lastCheckin: "" };
  const POINT_VALUE = 0.0005;

  // SHOW INSTANT FROM CACHE
  welcomeText.innerText = "Welcome back " + (localStorage.getItem('username') || "User");
  points.innerText = localStorage.getItem('points') || "0";

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const docSnap = await getDoc(doc(db, "users", user.uid));
      if(docSnap.exists()) {
        userData = docSnap.data();
        welcomeText.innerText = "Welcome back " + userData.username;
        points.innerText = userData.points || 0;
        localStorage.setItem('username', userData.username);
        localStorage.setItem('points', userData.points || 0);
      }
    } else {
      // ONLY KICK TO LOGIN IF WE WAITED 2SEC AND STILL NO USER
      setTimeout(()=>{ if(!auth.currentUser) window.location.href = "./log.html"; }, 2000);
    }
  });

  // ALL YOUR OTHER FUNCTIONS: openWallet, openCheckin, openWatch, etc... SAME AS LAST CODE I SENT
  // COPY THEM FROM PREVIOUS MESSAGE. TOO LONG TO REPEAT
  
  window.goTo = function(page) { window.location.href = `./${page}`; }
  window.logout = async function() { await signOut(auth); localStorage.clear(); window.location.href = "./log.html"; }
</script>
</body>
</html>
