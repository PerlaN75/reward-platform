<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1c5b0;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow-x:hidden}
.wrap{width:100%;max-width:1000px;min-height:100vh;background:linear-gradient(180deg,#f9d8c5 0%,#f5bfae 48%,#e9a88f 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px 12px 18px}
.top{width:100%;height:52px;background:#fdf6ee;border-radius:28px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 4px 14px rgba(0,0,0,0.08)}
.back{width:96px;height:30px;border:1.5px solid #e58a8a;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#e86b6b;font-weight:900;background:#fffaf5;font-size:18px;cursor:pointer;flex-shrink:0}
.top h2{font-size:22px;color:#7a3d25;font-weight:800;flex:1;text-align:center}
.logoBox{width:28px;height:28px;border-radius:50%;border:1.5px solid #d4b36a;overflow:hidden;flex-shrink:0;background:#fff}
.logoBox img{width:100%;height:100%;object-fit:cover}
.stage{width:100%;display:flex;align-items:center;justify-content:space-between;position:relative;margin-top:36px}
.left{width:18%;display:flex;flex-direction:column;gap:12px;z-index:3}
.right{width:18%;display:flex;flex-direction:column;gap:12px;z-index:3}
.center{width:60%;position:relative;display:flex;flex-direction:column;align-items:center;z-index:2}
.ring1{position:absolute;top:50%;left:50%;transform:translate(-50%,-56%);width:88%;aspect-ratio:1;border-radius:50%;border:2px solid #e6b94d;opacity:0.85;pointer-events:none}
.ring2{position:absolute;top:50%;left:50%;transform:translate(-50%,-56%);width:83%;aspect-ratio:1;border-radius:50%;border:2px solid #f0c75e;opacity:0.75;pointer-events:none}
.pill{width:100%;height:44px;border-radius:22px;display:flex;align-items:center;padding:0 14px;gap:8px;font-size:13px;font-weight:800;color:#000;cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,0.04)}
.pill span{font-size:18px;flex-shrink:0}
.yel{background:#ffeb3b;border:1.5px solid #f5d000}
.lblue{background:#a9d8ff;border:1.5px solid #7bbcff}
.green{background:#7eff7e;border:1.5px solid #4ade4a}
.yel2{background:#ffeb3b;border:1.5px solid #f5d000}
.cyan{background:#7ef6ff;border:1.5px solid #3dd4e0}
.pink{background:#ff9aa2;border:1.5px solid #ff7b85}
.lpink{background:#ff9ec8;border:1.5px solid #ff7fb5}
.purp{background:#b18cff;border:1.5px solid #9a6cff}
.orange{background:#ffb86a;border:1.5px solid #ff9a3a}
.lpurp{background:#b9b6ff;border:1.5px solid #9b99ff}
.monitor{width:80%;max-width:380px;background:#111;border:6px solid #111;border-radius:14px;overflow:hidden;box-shadow:0 12px 24px rgba(0,0,0,0.18);position:relative}
.screen{background:#0f2e1f;padding:22px 18px 16px;text-align:center;position:relative}
.sat{position:absolute;top:-36px;right:10px;font-size:36px;z-index:5;line-height:1}
.stand{width:100%;height:22px;background:linear-gradient(#e8e8e8,#c0c0c0)}
.stand2{width:62px;height:32px;background:linear-gradient(#d5d5d5,#a8a8a8);margin:0 auto;border-radius:0 0 4px 4px;z-index:2}
.podium{width:100%;height:96px;background:#fffefc;border-radius:50% / 30%;box-shadow:0 10px 0 #f5d5c3, 0 24px 40px rgba(0,0,0,0.12);margin-top:-8px;display:flex;justify-content:center;align-items:flex-start;padding-top:16px;z-index:1}
.kb{width:62%;height:20px;background:linear-gradient(#555,#2a2a2a);border-radius:3px}
.bottom{width:52%;max-width:460px;height:46px;background:#fdf6ee;border-radius:22px;display:flex;justify-content:space-around;align-items:center;margin-top:36px;box-shadow:0 6px 16px rgba(0,0,0,0.15)}
.bottom div{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900;color:#000}
.ic{font-size:18px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2f3e1a;border:2px solid #fbbf24;color:#fff;padding:12px 18px;border-radius:10px;font-weight:bold;z-index:99999;display:none}
#maint{display:none;position:fixed;inset:0;background:#0f1508;z-index:999999;align-items:center;justify-content:center;padding:20px;text-align:center}
@media(max-width:700px){

  .top{height:34px;border-radius:18px}
  .back{width:44px;height:22px;font-size:12px}
  .top h2{font-size:13px}
  .logoBox{width:20px;height:20px}
  .stage{margin-top:16px}
  .left,.right{width:22%;gap:6px}
  .center{width:54%}
  .pill{height:26px;font-size:7.5px;padding:0 7px;gap:3px;border-radius:13px}
  .pill span{font-size:11px}
  .monitor{width:96%;border-width:4px;border-radius:10px}
  .screen{padding:12px 8px 8px}
  .ring1,.ring2{width:112%}
  .sat{font-size:24px;top:-24px}
  .stand2{width:38px;height:18px}
  .podium{height:52px}
  .kb{height:12px}
  .bottom{width:88%;height:32px;margin-top:16px}
  .bottom div{font-size:8px}
  .ic{font-size:11px}
}
</style></head><body>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try{const appCheck=firebase.appCheck();appCheck.activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);}catch(e){}
const auth=firebase.auth(),db=firebase.firestore();
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}window.alert=showToast;
const POINT_RATE=0.0005;
function loadData(d){if(!d)return;if(d.usdtBalance==null)d.usdtBalance=0;if(d.balance==null)d.balance=d.points||0;document.getElementById('headerText').innerText=d.username||'';document.getElementById('balance').innerText=(d.balance??d.points??0)+' coins';document.getElementById('usdBalance').innerText='= $'+((d.balance??d.points??0)*POINT_RATE).toFixed(4);document.getElementById('usdtBalanceDisplay').innerText=Number(d.usdtBalance||0).toFixed(4)+' USDT';localStorage.setItem('userData',JSON.stringify(d));}
db.collection("appConfig").doc("main").onSnapshot(s=>{if(s.exists&&s.data().maintenanceMode==="on"){document.getElementById('maint').style.display='flex';}else{document.getElementById('maint').style.display='none';}});
auth.onAuthStateChanged(u=>{if(u){db.collection('users').doc(u.uid).onSnapshot(doc=>{if(doc.exists)loadData(doc.data());});}else{location.href='./index.html';}});
