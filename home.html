<!DOCTYPE html>
<html>
<head>
  <title>Home - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; overflow-x: hidden; }
.container { max-width: 500px; margin: 0 auto; }
.header { text-align: center; margin: 40px 0 30px 0; }
.header h2 { font-size: 34px; font-weight: bold; color: #fff; }
.header h2 span { color: #fbbf24; font-weight: bold; text-transform: capitalize; }
.balance-card { background: #2f3e1a; border: 2px solid #fbbf24; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px; }
.balance-card.label { font-size: 14px; color: #ccc; }
.balance-card.amount { font-size: 32px; font-weight: bold; color: #fbbf24; margin-top: 5px; }
.balance-card.usd { font-size: 16px; color: #aaa; margin-top: 8px; }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
.menu-btn { background: linear-gradient(180deg, #ffffff, #e8e8e8); color: #000; border: none; border-radius: 15px; padding: 20px 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; box-shadow: 0 6px 0 #bbbbbb, 0 8px 15px rgba(0,0,0,0.3); transition: all 0.1s ease; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.menu-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #bbbbbb; }
.menu-btn.emoji { font-size: 40px; }
.logout-btn { width: 40%; height: 52px; margin: 20px auto 0 auto; display: block; padding: 0; background: #f59e0b; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #d97706; }
.logout-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #d97706; }
.modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
.modal-content { background: #2f3e1a; border: 3px solid #fbbf24; border-radius: 20px; padding: 18px; width: 100%; max-width: 420px; color: white; max-height: 95vh; overflow-y: auto; position: relative; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.modal-header h2 { font-size: 20px; color: #fbbf24; display: flex; align-items: center; gap: 8px; }
.close-btn { font-size: 24px; color: white; cursor: pointer; font-weight: bold; }
.popup-balance { background: #000; border: 2px solid #fbbf24; border-radius: 15px; padding: 15px; margin: 10px 0; text-align: center; }
.popup-balance.label { font-size: 13px; color: #ccc; margin-bottom: 6px; }
.popup-balance.amount { font-size: 28px; color: #f59e0b; font-weight: bold; }
.input-box { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 2px solid #444; border-radius: 10px; color: white; font-size: 14px; outline: none; }
.action-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #fbbf24, #f59e0b); color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top:8px; }
.action-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
.note { font-size: 12px; color: #aaa; margin-top: 6px; text-align: center; }
.tabs { display: flex; gap: 8px; margin: 10px 0; }
.tab-btn { flex: 1; padding: 10px; background: #1a2410; border: 2px solid #555; border-radius: 10px; color: #ccc; font-weight: bold; cursor: pointer; font-size: 13px; }
.tab-btn.active { background: #fbbf24; color: #000; border-color: #fbbf24; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.crypto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.crypto-item { background: #1a2410; padding: 12px; border-radius: 12px; border: 2px solid #444; text-align: center; cursor: pointer; }
.crypto-item.selected { border-color: #22c55e; background: #1a2e1a; }
.crypto-item.icon { font-size: 20px; }
.crypto-item.name { font-weight: bold; margin-top: 4px; font-size: 13px; }
.info-row { background: #1a2410; padding: 10px; border-radius: 10px; margin: 6px 0; display: flex; justify-content: space-between; font-size: 13px; }
.convert-result { background: #000; padding: 12px; border-radius: 10px; text-align: center; margin: 8px 0; border: 1px dashed #fbbf24; font-size: 13px; }
.crypto-balances { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
.crypto-balance-card { background: #000; border: 1px solid #444; padding: 10px; border-radius: 10px; text-align: center; }
.crypto-balance-card.name { font-size: 11px; color: #aaa; }
.crypto-balance-card.value { font-size: 16px; font-weight: bold; color: #fbbf24; margin-top: 3px; }
.checkin-card { background: #000; border: 2px dashed #fbbf24; border-radius: 15px; padding: 20px; text-align: center; margin: 10px 0; }
.checkin-card.big-emoji { font-size: 50px; margin-bottom: 8px; }
.checkin-card h3 { font-size: 20px; color: #fbbf24; margin-bottom: 6px; }
.checkin-card p { font-size: 14px; color: #ccc; margin-bottom: 12px; }
.countdown { font-size: 18px; color: #fbbf24; font-weight: bold; margin-top: 8px; text-align: center; }
.success-msg { background: #1a2e1a; border: 1px solid #22c55e; color: #22c55e; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 14px; display: none; text-align: center; }
.gift-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
.gift-box { background: #1a2410; border: 2px solid #fbbf24; border-radius: 15px; font-size: 55px; text-align: center; padding: 15px 0; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; }
.gift-box:hover { transform: scale(1.05); border-color: #f59e0b; }
.gift-box.disabled { opacity: 0.3; pointer-events: none; }
.gift-box.burst { animation: burst 0.6s ease; }
@keyframes burst { 0% { transform: scale(1); } 50% { transform: scale(1.3) rotate(10deg); } 100% { transform: scale(1); } /* FIXED */
.gift-history { background: #000; padding: 10px; border-radius: 10px; font-size: 13px; margin-top: 10px; text-align: center; }
.gift-result-popup {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: #000; border: 3px solid #fbbf24; border-radius: 20px; padding: 25px 30px;
  text-align: center; z-index: 1000; display: none; animation: popupIn 0.4s ease;
  box-shadow: 0 0 30px rgba(251, 191, 36, 0.5);
}
@keyframes popupIn { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
.gift-result-popup.emoji { font-size: 60px; margin-bottom: 10px; }
.gift-result-popup.text { font-size: 18px; color: #fbbf24; font-weight: bold; }
.gift-result-popup.points { font-size: 32px; color: #22c55e; font-weight: bold; margin-top: 5px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2><span id="headerText"></span></h2>
    </div>
    <div class="balance-card">
      <div class="label">Your Balance</div>
      <div class="amount" id="balance">0 points</div>
      <div class="usd" id="usdBalance">≈ $0.00 USD</div>
    </div>
    <div class="menu-grid">
      <button class="menu-btn" onclick="openWallet()"><span class="emoji">💰</span>Wallet</button>
      <button class="menu-btn" onclick="openCheckin()"><span class="emoji">📅</span>Daily Checkin</button>
      <button class="menu-btn" onclick="window.location.href='./watch.html'"><span class="emoji">📺</span>Watch & Earn</button>
      <button class="menu-btn" onclick="window.location.href='./referrals.html'"><span class="emoji">🤝</span>Refer & Earn</button>
      <button class="menu-btn" onclick="openGift()"><span class="emoji">🎁</span>Gifts</button>
      <button class="menu-btn" onclick="window.location.href='./more.html'"><span class="emoji">⚙️</span>More</button>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- WALLET POPUP -->
  <div id="walletModal" class="modal">...same as yours... </div>
  <!-- DAILY CHECKIN POPUP -->
  <div id="checkinModal" class="modal">...same as yours... </div>
  <!-- GIFT POPUP -->
  <div id="giftModal" class="modal">...same as yours... </div>

<script>
  let selectedCrypto = 'USDT';
  const RATES = { USDT: 1, BNB: 600, XRP: 0.6, XLM: 0.12 };
  const POINT_RATE = 0.0005;
  const DAILY_REWARD = 20;
  const GIFT_POOL = [4,5,7,0,10,12,0,15,20,22,0,25];
  let currentUser = null;
  let countdownInterval = null;
  let giftCountdownInterval = null;
  let userData = {};

  function getCurrentDateTime() {
    const d = new Date();
    let day = String(d.getDate()).padStart(2, '0');
    let month = String(d.getMonth() + 1).padStart(2, '0');
    let year = d.getFullYear();
    let hours = String(d.getHours()).padStart(2, '0');
    let minutes = String(d.getMinutes()).padStart(2, '0');
    return `${day}/${month}/${year} ${hours}:${minutes}`;
  }

  // GLOBAL: Add history entry and update points
  function addHistory(action, points, desc = "") {
    let history = JSON.parse(localStorage.getItem('earnHistory')) || [];
    let newPoints = parseInt(userData.balance || 0) + points;
    
    history.unshift({
      action: action,
      points: points,
      date: getCurrentDateTime(),
      desc: desc
    });

    userData.balance = newPoints;
    localStorage.setItem('earnHistory', JSON.stringify(history));
    localStorage.setItem('userData', JSON.stringify(userData));
    localStorage.setItem('points', newPoints);
    loadData(userData);
    
    if(currentUser) db.collection("users").doc(currentUser.uid).update({balance: newPoints});
  }

  // GLOBAL: Helper for Watch & Earn
  window.rewardWatchAd = function() {
    addHistory("Watch Ad", 5, "Watched video");
  }
  
  // GLOBAL: Helper for Referrals
  window.rewardReferral = function(name) {
    addHistory("Referral Bonus", 50, `Referred: ${name}`);
  }

  function loadData(data) {
    userData = data;
    document.getElementById('headerText').innerText = `Welcome, ${data.username || 'User'}`;
    document.getElementById('balance').innerText = (data.balance || 0) + ' points';
    document.getElementById('usdBalance').innerText = `≈ $${((data.balance || 0) * POINT_RATE).toFixed(2)} USD`;
  }

  const cachedData = JSON.parse(localStorage.getItem('userData') || '{}');
  if(cachedData.username){
    loadData(cachedData);
  }

  // WALLET, CHECKIN, GIFT CODE... same as your code above...
  // CHECKIN
  window.openCheckin = function() {
    document.getElementById('successMsg').style.display = 'none';
    checkClaimStatus();
    document.getElementById('checkinModal').style.display = 'flex';
  }
  window.closeCheckin = function() {
    document.getElementById('checkinModal').style.display = 'none';
    clearInterval(countdownInterval);
  }
  function getToday() { return new Date().toISOString().split('T')[0]; }
  function getNextClaimTime() { const now = new Date(); const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1); tomorrow.setHours(0, 0, 0, 0); return tomorrow; }
  function updateCountdown() {
    const diff = getNextClaimTime() - new Date();
    if(diff <= 0) { clearInterval(countdownInterval); checkClaimStatus(); return; }
    const h = Math.floor(diff / 1000 / 60 / 60);
    const m = Math.floor(diff / 1000 / 60) % 60;
    const s = Math.floor(diff / 1000) % 60;
    document.getElementById('countdown').innerText = `Next claim in: ${h}h ${m}m ${s}s`;
  }
  function checkClaimStatus() {
    const today = getToday();
    const lastClaim = userData.lastCheckin;
    clearInterval(countdownInterval);
    if(lastClaim === today) {
      document.getElementById('claimBtn').disabled = true;
      document.getElementById('claimBtn').innerText = "Already Claimed Today";
      document.getElementById('checkinNote').innerHTML = "✓ Claimed! Come back tomorrow";
      document.getElementById('countdown').style.display = 'block';
      updateCountdown();
      countdownInterval = setInterval(updateCountdown, 1000);
    } else {
      document.getElementById('claimBtn').disabled = false;
      document.getElementById('claimBtn').innerText = `Claim ${DAILY_REWARD} Points`;
      document.getElementById('checkinNote').innerText = "Tap to claim your daily reward";
      document.getElementById('countdown').style.display = 'none';
    }
  }
  window.claimDaily = async function() {
    const today = getToday();
    if(userData.lastCheckin === today) return;
    addHistory("Daily Login", DAILY_REWARD);
    userData.lastCheckin = today;
    localStorage.setItem('userData', JSON.stringify(userData));
    document.getElementById('successMsg').style.display = 'block';
    checkClaimStatus();
    if(currentUser) db.collection("users").doc(currentUser.uid).update({balance: userData.balance, lastCheckin: today});
  }

  // GIFT CODE... same as your code above...
  function getRotatedPool() {
    const startDate = new Date('2026-01-01');
    const today = new Date();
    const diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
    const shift = diffDays % 12;
    return [...GIFT_POOL.slice(shift),...GIFT_POOL.slice(0, shift)];
  }
  window.openGift = function() {
    document.getElementById('giftResultPopup').style.display = 'none';
    buildGiftGrid();
    checkGiftStatus();
    document.getElementById('giftModal').style.display = 'flex';
  }
  window.closeGift = function() {
    document.getElementById('giftModal').style.display = 'none';
    clearInterval(giftCountdownInterval);
  }
  function buildGiftGrid() {
    const pool = getRotatedPool();
    const grid = document.getElementById('giftGrid');
    grid.innerHTML = '';
    pool.forEach((pts, i) => {
      const box = document.createElement('div');
      box.className = 'gift-box';
      box.innerHTML = '📦';
      box.onclick = () => pickGift(i, pts, box);
      grid.appendChild(box);
    });
  }
  function checkGiftStatus() {
    const today = getToday();
    const lastClaim = userData.lastGiftClaim;
    clearInterval(giftCountdownInterval);
    if(lastClaim === today) {
      document.querySelectorAll('.gift-box').forEach(b => b.classList.add('disabled'));
      document.getElementById('giftNote').innerText = "Already picked today. Come back tomorrow";
      document.getElementById('giftHistory').innerText = `Last gift: ${userData.lastGiftPoints} points`;
      document.getElementById('giftCountdown').style.display = 'block';
      updateGiftCountdown();
      giftCountdownInterval = setInterval(updateGiftCountdown, 1000);
    } else {
      document.querySelectorAll('.gift-box').forEach(b => b.classList.remove('disabled'));
      document.getElementById('giftNote').innerText = "Pick 1 mystery box. Resets at midnight";
      document.getElementById('giftHistory').innerText = userData.lastGiftPoints? `Last gift: ${userData.lastGiftPoints} points` : 'No gifts claimed yet';
      document.getElementById('giftCountdown').style.display = 'none';
    }
  }
  function updateGiftCountdown() {
    const diff = getNextClaimTime() - new Date();
    if(diff <= 0) { clearInterval(giftCountdownInterval); checkGiftStatus(); return; }
    const h = Math.floor(diff / 1000 / 60 / 60);
    const m = Math.floor(diff / 1000 / 60) % 60;
    const s = Math.floor(diff / 1000) % 60;
    document.getElementById('giftCountdown').innerText = `Next gift in: ${h}h ${m}m ${s}s`;
  }
  window.pickGift = async function(index, points, el) {
    if(userData.lastGiftClaim === getToday()) return;
    el.classList.add('burst');
    addHistory("Gift Box", points, `Mystery Box Reward`);
    userData.lastGiftClaim = getToday();
    userData.lastGiftPoints = points;
    localStorage.setItem('userData', JSON.stringify(userData));
    const popup = document.getElementById('giftResultPopup');
    document.getElementById('resultEmoji').innerText = points === 0? '💀' : '🎉';
    document.getElementById('resultPoints').innerText = `${points} points`;
    popup.style.display = 'block';
    setTimeout(() => { popup.style.display = 'none'; }, 1800);
    el.innerHTML = '📦';
    document.querySelectorAll('.gift-box').forEach(b => b.classList.add('disabled'));
    if(currentUser) db.collection("users").doc(currentUser.uid).update({
      balance: userData.balance,
      lastGiftClaim: userData.lastGiftClaim,
      lastGiftPoints: points
    });
    setTimeout(checkGiftStatus, 1000);
  }

  document.getElementById('walletModal').addEventListener('click', function(e){ if(e.target.id === 'walletModal') closeWallet(); })
  document.getElementById('checkinModal').addEventListener('click', function(e){ if(e.target.id === 'checkinModal') closeCheckin(); })
  document.getElementById('giftModal').addEventListener('click', function(e){ if(e.target.id === 'giftModal') closeGift(); })

  const firebaseConfig = {
    apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      const doc = await db.collection("users").doc(user.uid).get();
      if (doc.exists) {
        const data = doc.data();
        localStorage.setItem('userData', JSON.stringify(data));
        localStorage.setItem('points', data.balance || 0);
        loadData(data);
      }
    } else {
      localStorage.clear();
      window.location.replace('./index.html');
    }
  });

  window.logout = async function() {
    try { await auth.signOut(); } catch(e) {}
    localStorage.clear();
    window.location.replace('./index.html');
  }
</script>
</body>
</html>
