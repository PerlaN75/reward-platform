<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevApp Home</title>
<style>
  body { background:#0a0a0a; color:#fff; font-family:Arial; margin:0; padding:15px; }
.container { max-width:500px; margin:auto; }
.card { background:#1a1a1a; padding:15px; border-radius:12px; margin-bottom:15px; }
.btn { background:#00ff88; color:#000; border:none; padding:12px; border-radius:10px; width:100%; font-weight:bold; cursor:pointer; margin-top:8px; font-size:15px; }
.btn:disabled { background:#333; color:#777; }
.btn-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.checkin-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; text-align:center; }
.day { padding:6px; border-radius:8px; background:#222; font-size:10px; }
.day.active { background:#00ff88; color:#000; font-weight:bold; }
  #points { font-size:28px; font-weight:bold; color:#00ff88; }
  #welcome { font-size:20px; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2 id="welcome">Loading...</h2>
    <p>Points: <span id="points">0</span></p>
  </div>

  <div class="card">
    <h3>Daily Check-in</h3>
    <div class="checkin-grid" id="checkinGrid"></div>
    <button class="btn" id="checkinBtn" onclick="doCheckin()">Check In Now</button>
  </div>

  <div class="card">
    <h3>Earn</h3>
    <div class="btn-row">
      <button class="btn" onclick="watchAd()">Watch Ad</button>
      <button class="btn" onclick="referFriend()">Refer</button>
    </div>
  </div>

  <div class="card">
    <h3>Wallet</h3>
    <p>USDT: <span id="usdt">0</span></p>
    <p>BNB: <span id="bnb">0</span></p>
    <p>XRP: <span id="xrp">0</span></p>
    <p>XLM: <span id="xlm">0</span></p>
    <div class="btn-row">
      <button class="btn" onclick="redeem()">Redeem</button>
      <button class="btn" onclick="withdraw()">Withdraw</button>
    </div>
    <button class="btn" onclick="deposit()">Deposit</button>
  </div>

  <div class="card">
    <h3>History</h3>
    <div id="history">Loading...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let userData = { points:0, streak:0, lastCheckin:"", usdt:0, bnb:0, xrp:0, xlm:0, watchCount:0, lastWatchDate:"" };
  let currentUser = null;

  const CHECKIN_REWARDS = [10, 20, 30, 40, 50, 60, 100];

  onAuthStateChanged(auth, (user) => {
    if(user) {
      currentUser = user;
      loadHome(user.uid);
    } else {
      window.location.href = 'login.html';
    }
  });

  async function loadHome(uid) {
    const docSnap = await getDoc(doc(db, "users", uid));
    if(docSnap.exists()) {
      const data = docSnap.data();
      userData = data; // READ FIREBASE FIRST

      document.getElementById('welcome').innerText = "Welcome back " + (data.username || "User");
      document.getElementById('points').innerText = data.points || 0;
      document.getElementById('usdt').innerText = data.usdt || 0;
      document.getElementById('bnb').innerText = data.bnb || 0;
      document.getElementById('xrp').innerText = data.xrp || 0;
      document.getElementById('xlm').innerText = data.xlm || 0;

      renderCheckin();
    }
  }

  function renderCheckin(){
    const grid = document.getElementById('checkinGrid');
    const today = new Date().toISOString().split('T')[0];
    const streak = userData.streak || 0;
    grid.innerHTML = '';
    for(let i=1; i<=7; i++){
      const div = document.createElement('div');
      div.className = 'day' + (i <= streak? ' active' : '');
      div.innerText = 'Day ' + i + '\n+' + CHECKIN_REWARDS[i-1];
      grid.appendChild(div);
    }
    document.getElementById('checkinBtn').disabled = userData.lastCheckin === today;
  }

  window.doCheckin = async function() {
    const today = new Date().toISOString().split('T')[0];
    const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];

    const docSnap = await getDoc(doc(db, "users", currentUser.uid));
    if(docSnap.exists()) userData = docSnap.data();

    if(userData.lastCheckin === today) return alert("Already checked in today!");

    let oldStreak = userData.streak || 0;
    let newStreak = 1;
    if(userData.lastCheckin === yesterday) {
      newStreak = oldStreak + 1;
      if(newStreak > 7) newStreak = 1;
    }

    let reward = CHECKIN_REWARDS[newStreak - 1];
    const newPoints = (userData.points || 0) + reward;

    await setDoc(doc(db, "users", currentUser.uid), {
      points: newPoints,
      streak: newStreak,
      lastCheckin: today
    }, {merge: true});

    userData.points = newPoints;
    userData.streak = newStreak;
    userData.lastCheckin = today;

    document.getElementById('points').innerText = userData.points;
    alert(`Check-in Complete! +${reward} Points. Streak: ${newStreak} Days`);
    renderCheckin();
  }

  // YOUR 6 BUTTONS - KEEP YOUR OLD LOGIC HERE
  window.watchAd = function(){ alert("Watch Ad clicked") }
  window.referFriend = function(){ alert("Refer clicked") }
  window.redeem = function(){ alert("Redeem clicked") }
  window.withdraw = function(){ alert("Withdraw clicked") }
  window.deposit = function(){ alert("Deposit clicked") }

</script>
</body>
</html>
