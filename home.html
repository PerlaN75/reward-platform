<!DOCTYPE html>
<html>
<head>
<title>Home - Rewards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="monetag" content="b671b8351bfc48ed0161f6bd0b6a5340">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f1508;min-height:100vh;padding:20px;color:#fff}
.container{max-width:500px;margin:0 auto}
.header{text-align:center;margin:40px 0 30px}
.header h2{font-size:34px}.header h2 span{color:#fbbf24}
.balance-card{background:#2f3e1a;border:2px solid #fbbf24;border-radius:20px;padding:25px;text-align:center;margin-bottom:30px}
.balance-card.label{font-size:14px;color:#ccc}
.balance-card.amount{font-size:32px;font-weight:bold;color:#fbbf24;margin-top:5px}
.balance-card.usd{font-size:16px;color:#aaa;margin-top:8px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:30px}
.menu-btn{background:linear-gradient(180deg,#fff,#e8e8e8);color:#000;border:none;border-radius:15px;padding:20px 10px;font-size:15px;font-weight:bold;cursor:pointer;text-align:center;box-shadow:0 6px 0 #bbb,0 8px 15px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:8px}
.menu-btn:active{transform:translateY(6px);box-shadow:0 0 0 #bbb}
.menu-btn.emoji{font-size:40px;line-height:1;display:block;margin-bottom:4px}
.logout-btn{width:40%;height:48px;margin:30px auto 0;display:block;background:#f59e0b;color:#000;border:none;border-radius:999px;font-weight:bold;font-size:16px;cursor:pointer}
.modal{display:none;position:fixed;z-index:999;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.85);justify-content:center;align-items:center;padding:15px}
.modal-content{background:#2f3e1a;border:3px solid #fbbf24;border-radius:20px;padding:18px;width:100%;max-width:420px;color:#fff;max-height:95vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-header h2{font-size:20px;color:#fbbf24}
.close-btn{font-size:24px;color:#fff;cursor:pointer;font-weight:bold}
.input-box{width:100%;padding:14px;margin:8px 0;background:#000;border:2px solid #444;border-radius:12px;color:#fff;font-size:15px;outline:none}
</style>
</head>
<body>
<div class="container">
<div class="header"><h2>Hello <span id="userName">User</span></h2></div>
<div class="balance-card">
<div class="label">Your Balance</div>
<div class="amount" id="bal">0 pts</div>
<div class="usd" id="usdBal">$0.00</div>
</div>
<div class="menu-grid">
<button class="menu-btn" onclick="location.href='./watch.html'"><span class="emoji">▶️</span>Watch & Earn</button>
<button class="menu-btn" onclick="location.href='./bonus.html'"><span class="emoji">🎁</span>Bonus</button>
<button class="menu-btn" onclick="openWithdraw()"><span class="emoji">💸</span>Withdraw</button>
<button class="menu-btn" onclick="openHistory()"><span class="emoji">📜</span>History</button>
</div>
<button class="logout-btn" onclick="logOut()">Logout</button>
</div>
<!-- Withdraw Modal -->
<div id="withdrawModal" class="modal">
<div class="modal-content">
<div class="modal-header"><h2>💸 Withdraw</h2><span class="close-btn" onclick="closeWithdraw()">&times;</span></div>
<input id="withdrawAmount" class="input-box" type="number" placeholder="Amount pts (min 5000)">
<select id="withdrawMethod" class="input-box"><option>MTN Mobile Money</option><option>Airtel Money</option></select>
<input id="withdrawPhone" class="input-box" placeholder="Phone 078...">
<button class="logout-btn" style="width:100%" onclick="requestWithdraw()">Submit</button>
</div>
</div>

<!-- History Modal -->
<div id="historyModal" class="modal">
<div class="modal-content">
<div class="modal-header"><h2>📜 History</h2><span class="close-btn" onclick="closeHistory()">&times;</span></div>
<div id="historyList">Loading...</div>
</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null,bal=0;

auth.onAuthStateChanged(async(u)=>{
if(!u){location.href='./index.html';return;}
currentUser=u;
const s=await db.collection('users').doc(u.uid).get();
if(s.exists){
const d=s.data();
bal=d.balance||d.points||0;
document.getElementById('bal').textContent=bal+' pts';
document.getElementById('usdBal').textContent='$'+(bal/5000).toFixed(2);
if(d.name) document.getElementById('userName').textContent=d.name.split(' ')[0];
}
});

function openWithdraw(){document.getElementById('withdrawModal').style.display='flex';}
function closeWithdraw(){document.getElementById('withdrawModal').style.display='none';}
function openHistory(){document.getElementById('historyModal').style.display='flex';loadHistory();}
function closeHistory(){document.getElementById('historyModal').style.display='none';}
async function loadHistory(){
const q=await db.collection('users').doc(currentUser.uid).collection('earnHistory').orderBy('timestamp','desc').limit(20).get();
let h='';q.forEach(doc=>{const d=doc.data();h+=`<div style="background:#000;padding:10px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between"><span>${d.desc||d.action}</span><span style="color:#fbbf24">+${d.points}</span></div>`});
document.getElementById('historyList').innerHTML=h||'No history yet';
}
function logOut(){auth.signOut().then(()=>location.href='./index.html');}
async function requestWithdraw(){
const amt=parseInt(document.getElementById('withdrawAmount').value);
if(amt<5000||amt>bal){alert('Min 5000 pts and max your balance');return;}
alert('Withdraw request sent for '+amt+' pts');
closeWithdraw();
}
</script>
</body>
</html>
