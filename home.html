<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevApp Home</title>
<style>
  body { background:#0a0a0a; color:#fff; font-family:Arial; margin:0; padding:15px; }
 .container { max-width:500px; margin:auto; }
 .card { background:#1a1a1a; padding:15px; border-radius:12px; margin-bottom:15px; }
 .btn { background:#00ff88; color:#000; border:none; padding:12px; border-radius:10px; width:100%; font-weight:bold; cursor:pointer; margin-top:8px; }
 .btn:disabled { background:#333; color:#777; }
 .checkin-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; text-align:center; }
 .day { padding:8px; border-radius:8px; background:#222; font-size:12px; }
 .day.active { background:#00ff88; color:#000; }
  #points { font-size:24px; font-weight:bold; color:#00ff88; }
 .restore-btn { background:#ff9800;color:#fff;border:none;padding:8px 12px;border-radius:8px;margin-top:10px;font-size:13px;width:100%; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2 id="welcome">Welcome</h2>
    <p>Points: <span id="points">0</span></p>
    <button class="restore-btn" onclick="restorePriya()">Restore 230 Points</button>
  </div>

  <div class="card">
    <h3>Daily Check-in</h3>
    <div class="checkin-grid" id="checkinGrid"></div>
    <button class="btn" id="checkinBtn" onclick="doCheckin()">Check In Now</button>
  </div>

  <div class="card">
    <h3>Wallet</h3>
    <p>USDT: <span id="usdt">0</span></p>
    <p>BNB: <span id="bnb">0</span></p>
    <p>XRP: <span id="xrp">0</span></p>
    <p>XLM: <span id="xlm">0</span></p>
  </div>

  <div class="card">
    <h3>History</h3>
    <div id="history"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { /* YOUR CONFIG HERE */ };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let userData = { points:0, streak:0, lastCheckin:"", usdt:0, bnb:0, xrp:0, xlm:0, watchCount:0, lastWatchDate:"" };
  let currentUser = null;
  let dataLoaded = false;

  const CHECKIN_REWARDS = [10, 20, 30, 40, 50, 60, 100];
  const welcomeEl = document.getElementById('welcome');
  const pointsEl = document.getElementById('points');
  const usdtEl = document.getElementById('usdt');
  const bnbEl = document.getElementById('bnb');
  const xrpEl = document.getElementById('xrp');
  const xlmEl = document.getElementById('xlm');

  onAuthStateChanged(auth, (user) => {
    if(user) {
      currentUser = user;
      loadHome(user.uid);
    } else {
      window.location.href = 'login.html';
    }
  });

  async function loadHome(uid) {
    try {
      const docSnap = await getDoc(doc(db, "users", uid));
      if(docSnap.exists()) {
        const data = docSnap.data();
        userData = {...userData,...data };
        welcomeEl.innerText = "Welcome back " + data.username;
        pointsEl.innerText = data.points || 0;
        localStorage.setItem('username', data.username);
        localStorage.setItem('points', data.points || 0);
        localStorage.setItem('streak', data.streak || 0);
        localStorage.setItem('lastCheckin', data.lastCheckin || "");
        localStorage.setItem('usdt', data.usdt || 0);
        localStorage.setItem('bnb', data.bnb || 0);
        localStorage.setItem('xrp', data.xrp || 0);
        localStorage.setItem('xlm', data.xlm || 0);
        localStorage.setItem('watchCount', data.watchCount || 0);
        localStorage.setItem('lastWatchDate', data.lastWatchDate || "");
        dataLoaded = true;
        updateWalletUI();
        loadHistory();
        renderCheckin();
      }
    } catch(e) { console.log(e); }
  }

  function updateWalletUI(){
    usdtEl.innerText = userData.usdt || 0;
    bnbEl.innerText = userData.bnb || 0;
    xrpEl.innerText = userData.xrp || 0;
    xlmEl.innerText = userData.xlm || 0;
  }

  function renderCheckin(){
    const grid = document.getElementById('checkinGrid');
    const today = new Date().toISOString().split('T')[0];
    const streak = userData.streak || 0;
    grid.innerHTML = '';
    for(let i=1; i<=7; i++){
      const div = document.createElement('div');
      div.className = 'day' + (i <= streak? ' active' : '');
      div.innerText = 'Day ' + i + '\n+' + CHECKIN_REWARDS[i-1];
      grid.appendChild(div);
    }
    document.getElementById('checkinBtn').disabled = userData.lastCheckin === today;
  }

  window.doCheckin = async function() {
    const today = new Date().toISOString().split('T')[0];
    const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];

    const docSnap = await getDoc(doc(db, "users", currentUser.uid));
    if(docSnap.exists()) userData = docSnap.data();

    if(userData.lastCheckin === today) return alert("You already checked in today!");

    let oldStreak = userData.streak || 0;
    let newStreak = 1;
    if(userData.lastCheckin === yesterday) {
      newStreak = oldStreak + 1;
      if(newStreak > 7) newStreak = 1;
    }

    let reward = CHECKIN_REWARDS[newStreak - 1];
    const newPoints = (userData.points || 0) + reward;

    await setDoc(doc(db, "users", currentUser.uid), {
      points: newPoints,
      streak: newStreak,
      lastCheckin: today
    }, {merge: true});

    userData.points = newPoints;
    userData.streak = newStreak;
    userData.lastCheckin = today;

    pointsEl.innerText = userData.points;
    localStorage.setItem('points', userData.points);
    localStorage.setItem('streak', userData.streak);
    localStorage.setItem('lastCheckin', userData.lastCheckin);

    addHistory(`Daily Checkin Day ${newStreak} +${reward} points`);
    alert(`Check-in Complete! +${reward} Points. Streak: ${newStreak} Days`);
    renderCheckin();
    updateWalletUI();
  }

  window.restorePriya = async function() {
    const correctPoints = 230;
    await updateDoc(doc(db, "users", currentUser.uid), { points: correctPoints });
    userData.points = correctPoints;
    pointsEl.innerText = correctPoints;
    localStorage.setItem('points', correctPoints);
    alert("Points Restored to 230. DELETE THIS BUTTON NOW.");
  }

  function addHistory(text){
    const div = document.getElementById('history');
    const p = document.createElement('p');
    p.innerText = new Date().toLocaleString() + ' - ' + text;
    div.prepend(p);
  }
  function loadHistory(){
    document.getElementById('history').innerHTML = '<p>History loaded</p>';
  }

</script>
</body>
</html>
