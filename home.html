<!DOCTYPE html>
<html>
<head>
  <script src="https://quge5.com/88/tag.min.js" data-zone="286869" async data-cfasync="false"></script>
  <title>Home - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="monetag" content="b671b8351bfc48ed0161f6bd0b6a5340">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; overflow-x: hidden; }
    .container { max-width: 500px; margin: 0 auto; }
    .header { text-align: center; margin: 40px 0 30px 0; }
    .header h2 { font-size: 34px; font-weight: bold; color: #fff; }
    .header h2 span { color: #fbbf24; font-weight: bold; text-transform: capitalize; }
    .balance-card { background: #2f3e1a; border: 2px solid #fbbf24; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px; }
    .balance-card .label { font-size: 14px; color: #ccc; }
    .balance-card .amount { font-size: 32px; font-weight: bold; color: #fbbf24; margin-top: 5px; }
    .balance-card .usd { font-size: 16px; color: #aaa; margin-top: 8px; }
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    .menu-btn { background: linear-gradient(180deg, #ffffff, #e8e8e8); color: #000; border: none; border-radius: 15px; padding: 20px 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; box-shadow: 0 6px 0 #bbbbbb, 0 8px 15px rgba(0,0,0,0.3); transition: all 0.1s ease; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .menu-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #bbbbbb; }
    .menu-btn .emoji { font-size: 35px; }
    .logout-btn { width: 35%; height: 60px; margin: 30px auto 0 auto; display: block; padding: 0; background: #f59e0b; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #d97706; }
    .logout-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #d97706; }
    .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
    .modal-content { background: #2f3e1a; border: 3px solid #fbbf24; border-radius: 20px; padding: 18px; width: 100%; max-width: 420px; color: white; max-height: 95vh; overflow-y: auto; position: relative; }
    #maintenanceOverlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0f1508;z-index:99999;align-items:center;justify-content:center;padding:20px;text-align:center}
  </style>
</head>
<body>

<!-- MAINTENANCE OVERLAY - BLOCKS EVERYTHING -->
<div id="maintenanceOverlay">
  <div style="max-width:400px;width:100%">
    <div style="font-size:40px;margin-bottom:10px">🛠️</div>
    <h1 style="color:#fbbf24;font-size:34px;margin-bottom:20px;font-weight:bold">Under Maintenance</h1>
    <div style="background:#1e2f15;border:2px solid #fbbf24;border-radius:15px;padding:20px;margin-bottom:15px">
      <p id="maintenanceMsg" style="color:white;font-size:18px;line-height:1.4">Maintainance for 20 min.</p>
    </div>
    <p style="color:#ccc;font-size:14px;margin-bottom:25px">Reward RW • App Config - Crypto</p>
    <button onclick="window.location.href='index.html'" style="background:#fbbf24;color:black;border:none;padding:14px 28px;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;width:80%">← Back</button>
  </div>
</div>

<div class="container">
  <div class="header">
    <h2>Hello, <span id="username">User</span> 👋</h2>
  </div>

  <div class="balance-card">
    <div class="label">Your Points</div>
    <div class="amount" id="balance">0</div>
    <div class="usd" id="usdValue">$0.00</div>
  </div>

  <div class="menu-grid">
    <button class="menu-btn" onclick="window.location.href='wallet.html'"><span class="emoji">💼</span> Wallet</button>
    <button class="menu-btn" onclick="window.location.href='watch.html'"><span class="emoji">🎬</span> Watch</button>
    <button class="menu-btn" onclick="window.location.href='referrals.html'"><span class="emoji">👥</span> Referrals</button>
    <button class="menu-btn" onclick="window.location.href='withdraw.html'"><span class="emoji">💸</span> Withdraw</button>
    <button class="menu-btn" onclick="window.location.href='gifts.html'"><span class="emoji">🎁</span> Gifts</button>
    <button class="menu-btn" onclick="window.location.href='support.html'"><span class="emoji">💬</span> Support</button>
  </div>

  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
const firebaseConfig = { apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d", storageBucket: "reward-platform-rw-2e13d.firebasestorage.app", messagingSenderId: "787550951987", appId: "1:787550951987:web:724b1463e821b99c90a146" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// MAINTENANCE LISTENER - STOPS EVERYTHING IMMEDIATELY
db.collection("appConfig").doc("main").onSnapshot((docSnap)=>{
  if(docSnap.exists){
    const cfg = docSnap.data();
    const overlay = document.getElementById("maintenanceOverlay");
    const msgEl = document.getElementById("maintenanceMsg");
    if(cfg.maintenanceMode === "on"){
      msgEl.innerText = cfg.maintenanceMessage || "Maintainance for 20 min.";
      overlay.style.display = "flex";
      document.body.style.overflow = "hidden";
    } else {
      overlay.style.display = "none";
      document.body.style.overflow = "auto";
    }
  }
});

auth.onAuthStateChanged(async(user)=>{
  if(!user){ window.location.href="index.html"; return; }
  try{
    const uDoc = await db.collection("users").doc(user.uid).get();
    if(uDoc.exists){
      const data = uDoc.data();
      document.getElementById("username").innerText = data.username || "User";
      document.getElementById("balance").innerText = data.balance || data.points || 0;
      // USD calc from config
      const cfgSnap = await db.collection("appConfig").doc("main").get();
      if(cfgSnap.exists){
        const cfg = cfgSnap.data();
        const pts = data.balance || data.points || 0;
        const perDollar = cfg.pointsPerDollar || 2000;
        const usd = pts / perDollar;
        document.getElementById("usdValue").innerText = "$" + usd.toFixed(2);
      }
    }
  }catch(e){ console.log(e); }
});

function logout(){ auth.signOut().then(()=>{ window.location.href="index.html"; }); }
</script>
</body>
</html>
