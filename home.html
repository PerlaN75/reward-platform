<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Reward App</title>
<style>
    body { margin:0; font-family: Arial, sans-serif; background:#1a2e05; color:#fff; text-align:center; }
    h1 { margin-top: 20px; font-size: 24px; }
   .tagline { font-size: 14px; color: #ffc107; margin-bottom: 20px; }
   .points-box { background:#0f1a03; border-radius: 15px; padding: 20px; margin: 0 15px 25px 15px; }
   .points-box h2 { margin: 0; font-size: 14px; color: #aaa; }
   .points-box p { font-size: 48px; font-weight: bold; color: #ffa500; margin: 10px 0 0 0; }
   .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 15px; }
   .card { background:#fff; color:#000; border-radius: 15px; padding: 20px 10px; cursor: pointer; font-weight: bold; }
   .card.icon { font-size: 32px; margin-bottom: 8px; }
   .logout-btn { background: red; color: #fff; border: none; padding: 12px 40px; border-radius: 10px; font-size: 16px; font-weight: bold; margin: 25px 0; cursor: pointer; }
</style>
</head>
<body>

<h1 id="welcomeText">Welcome back</h1>
<p class="tagline">🐒 From Nothing to Something 🍇</p>

<div class="points-box">
    <h2>YOUR POINTS</h2>
    <p id="points">0</p>
</div>

<div class="grid">
    <div class="card" onclick="alert('Coming Soon')"><div class="icon">📅</div>Daily Checkin</div>
    <div class="card" onclick="alert('Coming Soon')"><div class="icon">📺</div>Watch & Earn</div>
    <div class="card" onclick="alert('Coming Soon')"><div class="icon">🧠</div>Daily Quiz</div>
    <div class="card" onclick="alert('Coming Soon')"><div class="icon">👥</div>Refer & Earn</div>
    <div class="card" onclick="alert('Coming Soon')"><div class="icon">💰</div>Wallet</div>
    <div class="card" onclick="alert('Coming Soon')"><div class="icon">⚙️</div>More</div>
</div>

<button class="logout-btn" onclick="logout()">Logout</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
  authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
  projectId: "reward-platform-rw-2e13d",
  storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
  messagingSenderId: "787550951987",
  appId: "1:787550951987:web:724b1463e821b99c90a146"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const welcomeEl = document.getElementById("welcomeText");
const pointsEl = document.getElementById("points");

let userData = {
    username: localStorage.getItem('username') || "",
    points: parseInt(localStorage.getItem('points')) || 0
};

// 1. SHOW INSTANTLY FROM CACHE
if(userData.username) {
    welcomeEl.innerText = "Welcome back " + userData.username;
}
if(userData.points!== null) {
    pointsEl.innerText = userData.points;
}

// 2. THEN VERIFY/UPDATE FROM FIRESTORE
onAuthStateChanged(auth, async (user) => {
  if(!user) {
    window.location.href = "log.html";
    return;
  }
  await loadHome(user.uid, user.email);
});

async function loadHome(uid, email) {
  try {
    const userRef = doc(db, "users", uid);
    let docSnap = await getDoc(userRef);

    if(!docSnap.exists()) {
      // Auto-create user doc on first login
      const newUser = {
        username: email.split('@')[0],
        email: email,
        points: 0,
        balance: 0,
        streak: 0,
        lastCheckin: "",
        usdt: 0,
        bnb: 0,
        xrp: 0,
        xlm: 0,
        referredBy: null,
        createdAt: new Date().toISOString()
      };
      await setDoc(userRef, newUser);
      docSnap = await getDoc(userRef);
    }

    const data = docSnap.data();
    userData = {...userData,...data };

    // 3. UPDATE UI WITH REAL DATA
    welcomeEl.innerText = "Welcome back " + data.username;
    pointsEl.innerText = data.points || 0;

    // Save to cache for instant load next time
    localStorage.setItem('username', data.username);
    localStorage.setItem('points', data.points || 0);
    localStorage.setItem('streak', data.streak || 0);
    localStorage.setItem('lastCheckin', data.lastCheckin || "");
    localStorage.setItem('usdt', data.usdt || 0);
    localStorage.setItem('bnb', data.bnb || 0);
    localStorage.setItem('xrp', data.xrp || 0);
    localStorage.setItem('xlm', data.xlm || 0);

  } catch(e) {
    console.error(e);
    welcomeEl.innerText = "Error loading user";
  }
}

window.logout = function() {
  localStorage.clear();
  signOut(auth).then(() => { window.location.href = "log.html"; });
}
</script>

</body>
</html>
