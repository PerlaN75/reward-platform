<!DOCTYPE html><html><head><title>Home</title><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent!important}
html,body{-webkit-tap-highlight-color:transparent}
button,a,div{-webkit-tap-highlight-color:transparent!important}
button:focus,a:focus,div:focus{outline:none!important}
body{background:#6d28d9;display:flex;justify-content:center;min-height:100vh}
.wrap{
  width:100%;max-width:430px;height:100dvh;height:100svh;
  background-color:#bfe6f7;
  background-image:url('./bg.jpg');
  background-repeat:no-repeat;
  background-size:100% auto;
  background-position:center bottom;
  position:relative;display:flex;flex-direction:column;overflow:hidden
}
.top{position:relative;margin:0;width:100%;background:#ffffff;border-radius:0 0 20px 20px;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:30;box-shadow:0 6px 14px rgba(0,0,0,0.18);flex-shrink:0}
.top h2{font-size:19px;color:#0a5a7a;font-weight:900;flex:1;text-align:center}
#headerText{font-size:20px;color:#6d28d9!important;font-weight:900}
.home-btn{display:flex;align-items:center;gap:4px;cursor:pointer;font-weight:900;font-size:13px;color:#111827;background:none;border:none;padding:4px 6px}
.home-btn span.emoji{font-size:18px}
.home-btn span.txt{font-size:13px;color:#111827;font-weight:900}
.logo{width:28px;height:28px;border-radius:50%;overflow:hidden;border:1.5px solid #d4a95a;background:#fff}
.scene{flex:1;position:relative;z-index:2;overflow:hidden;min-height:0}
.monitor{
  position:absolute;left:4%;top:32%;width:44%;max-width:190px;height:172px;
  background:linear-gradient(135deg, #ffffff 0%, #FFF8F0 18%, #FFE9E3 100%);
  border:2px solid #fecaca;
  border-left:3.5px solid #ffffff;
  border-radius:18px;overflow:hidden;z-index:5;
