<!DOCTYPE html>
<html>
<head>
  <title>Home - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; }
   .container { max-width: 500px; margin: 0 auto; }

   .header { text-align: center; margin: 40px 0 30px 0; }
   .header h2 { font-size: 34px; font-weight: bold; color: #fff; }
   .header h2 span { color: #fbbf24; font-weight: bold; text-transform: capitalize; }

   .balance-card { background: #2f3e1a; border: 2px solid #fbbf24; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px; }
   .balance-card.label { font-size: 14px; color: #ccc; }
   .balance-card.amount { font-size: 32px; font-weight: bold; color: #fbbf24; margin-top: 5px; }
   .balance-card.usd { font-size: 16px; color: #aaa; margin-top: 8px; }

   .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }

   .menu-btn {
      background: linear-gradient(180deg, #ffffff, #e8e8e8);
      color: #000;
      border: none;
      border-radius: 15px;
      padding: 20px 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 6px 0 #bbbbbb, 0 8px 15px rgba(0,0,0,0.3);
      transition: all 0.1s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
   .menu-btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 #bbbbbb, 0 2px 5px rgba(0,0,0,0.2);
    }
   .menu-btn.emoji {
      font-size: 32px;
      margin-right: 0;
      line-height: 1;
    }

   .logout-btn {
      width: 40%;
      margin: 20px auto 0 auto;
      display: block;
      padding: 14px;
      background: #f59e0b;
      color: #000;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d97706;
      transition: all 0.1s ease;
    }
   .logout-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #d97706;
    }

    /* WALLET POPUP STYLE */
   .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
   .modal-content { background: #2f3e1a; border: 3px solid #fbbf24; border-radius: 20px; padding: 25px; width: 100%; max-width: 420px; color: white; }
   .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
   .modal-header h2 { font-size: 22px; color: #fbbf24; }
   .close-btn { font-size: 28px; color: white; cursor: pointer; font-weight: bold; }
   .popup-balance { background: #000; border: 2px solid #fbbf24; border-radius: 15px; padding: 20px; margin: 15px 0; text-align: center; }
   .popup-balance.label { font-size: 14px; color: #ccc; margin-bottom: 8px; }
   .popup-balance.amount { font-size: 36px; color: #f59e0b; font-weight: bold; }
   .popup-balance.usd { font-size: 16px; color: #aaa; margin-top: 5px; }
   .input-box,.select-box { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 2px solid #444; border-radius: 10px; color: white; font-size: 15px; outline: none; }
   .input-box::placeholder { color: #777; }
   .action-btn { width: 100%; padding: 15px; background: linear-gradient(90deg, #fbbf24, #f59e0b); color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top:10px; }
   .note { font-size: 12px; color: #aaa; margin-top: 8px; text-align: center; }

    /* NEW WALLET STYLES */
   .tabs { display: flex; gap: 10px; margin: 15px 0; }
   .tab-btn { flex: 1; padding: 12px; background: #1a2410; border: 2px solid #555; border-radius: 10px; color: #ccc; font-weight: bold; cursor: pointer; }
   .tab-btn.active { background: #fbbf24; color: #000; border-color: #fbbf24; }
   .tab-content { display: none; }
   .tab-content.active { display: block; }
   .crypto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
   .crypto-item { background: #1a2410; padding: 15px; border-radius: 12px; border: 2px solid #444; text-align: center; cursor: pointer; }
   .crypto-item.selected { border-color: #22c55e; background: #1a2e1a; }
   .crypto-item.icon { font-size: 24px; }
   .crypto-item.name { font-weight: bold; margin-top: 5px; font-size: 14px; }
   .info-row { background: #1a2410; padding: 12px; border-radius: 10px; margin: 8px 0; display: flex; justify-content: space-between; font-size: 14px; }
   .convert-result { background: #000; padding: 15px; border-radius: 10px; text-align: center; margin: 10px 0; border: 1px dashed #fbbf24; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Welcome, <span id="headerText"></span></h2>
    </div>

    <div class="balance-card">
      <div class="label">Your Balance</div>
      <div class="amount" id="balance"></div>
      <div class="usd" id="usdBalance"></div>
    </div>

    <div class="menu-grid">
      <button class="menu-btn" onclick="openWallet()"><span class="emoji">💰</span>Wallet</button>
      <button class="menu-btn" onclick="window.location.href='./checkin.html'"><span class="emoji">📅</span>Daily Checkin</button>
      <button class="menu-btn" onclick="window.location.href='./quiz.html'"><span class="emoji">🧠</span>Quiz</button>
      <button class="menu-btn" onclick="window.location.href='./referrals.html'"><span class="emoji">🤝</span>Refer & Earn</button>
      <button class="menu-btn" onclick="alert('Coming Soon')"><span class="emoji">🎁</span>Gifts</button>
      <button class="menu-btn" onclick="window.location.href='./more.html'"><span class="emoji">⚙️</span>More</button>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- WALLET POPUP -->
  <div id="walletModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>💰 My Wallet</h2>
        <span class="close-btn" onclick="closeWallet()">X</span>
      </div>
      <div class="popup-balance">
        <div class="label">Current Balance</div>
        <div class="amount" id="popupPoints">0 points</div>
        <div class="usd" id="popupUSD">≈ $0.00 USD</div>
      </div>

      <!-- TABS -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('convert')">Convert</button>
        <button class="tab-btn" onclick="switchTab('withdraw')">Withdraw</button>
      </div>

      <!-- CONVERT TAB -->
      <div id="convertTab" class="tab-content active">
        <div class="info-row"><span>Rate</span><span>1000 pts = $0.50</span></div>
        <input type="number" class="input-box" id="convertAmount" placeholder="Enter points to convert" oninput="calcConvert()">

        <div class="crypto-grid">
          <div class="crypto-item selected" onclick="selectCrypto('USDT', this)">
            <div class="icon">💵</div><div class="name">USDT</div>
          </div>
          <div class="crypto-item" onclick="selectCrypto('BNB', this)">
            <div class="icon">🟡</div><div class="name">BNB</div>
          </div>
          <div class="crypto-item" onclick="selectCrypto('XRP', this)">
            <div class="icon">💧</div><div class="name">XRP</div>
          </div>
          <div class="crypto-item" onclick="selectCrypto('XLM', this)">
            <div class="icon">⭐</div><div class="name">XLM</div>
          </div>
        </div>

        <div class="convert-result" id="convertResult">
          You will receive: 0.00 USDT
        </div>
        <button class="action-btn" onclick="convertPoints()">Convert Now</button>
        <div class="note">Converted crypto will be added to your withdraw balance</div>
      </div>

      <!-- WITHDRAW TAB -->
      <div id="withdrawTab" class="tab-content">
        <div class="info-row"><span>Username</span><span id="wUsername">-</span></div>
        <div class="info-row"><span>Email</span><span id="wEmail">-</span></div>

        <label style="font-size:14px; color:#ccc;">Select Crypto</label>
        <select class="select-box" id="withdrawCrypto">
          <option value="USDT">USDT - Tether</option>
          <option value="BNB">BNB - Binance Coin</option>
          <option value="XRP">XRP - Ripple</option>
          <option value="XLM">XLM - Stellar</option>
        </select>

        <input type="number" class="input-box" id="withdrawAmount" placeholder="Amount in Crypto">
        <input type="text" class="input-box" id="walletAddress" placeholder="Your Wallet Address">

        <button class="action-btn" onclick="requestWithdraw()">Request Withdraw</button>
        <div class="note">Min: USDT 10 | BNB 0.01 | XRP 20 | XLM 100</div>
      </div>
    </div>
  </div>

<script>
  let selectedCrypto = 'USDT';
  const RATES = { USDT: 1, BNB: 600, XRP: 0.6, XLM: 0.12 };
  const POINT_RATE = 0.0005;

  const cached = JSON.parse(localStorage.getItem('userData') || '{}');
  const instantName = cached.name || cached.username || "User";
  const instantPoints = cached.balance!== undefined? cached.balance : 0;
  const instantUSD = (instantPoints * POINT_RATE).toFixed(2);

  document.getElementById('headerText').innerText = instantName;
  document.getElementById('balance').innerText = instantPoints + ' points';
  document.getElementById('usdBalance').innerText = `≈ $${instantUSD} USD`;

  // WALLET POPUP FUNCTIONS
  window.openWallet = function() {
    const cached = JSON.parse(localStorage.getItem('userData') || '{}');
    const points = cached.balance || 0;
    const usd = (points * POINT_RATE).toFixed(2);
    document.getElementById('popupPoints').innerText = points + ' points';
    document.getElementById('popupUSD').innerText = `≈ $${usd} USD`;
    document.getElementById('wUsername').innerText = cached.name || cached.username || '-';
    document.getElementById('wEmail').innerText = cached.email || '-';
    document.getElementById('walletModal').style.display = 'flex';
  }
  window.closeWallet = function() {
    document.getElementById('walletModal').style.display = 'none';
  }

  window.switchTab = function(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(tab + 'Tab').classList.add('active');
  }

  window.selectCrypto = function(crypto, el) {
    selectedCrypto = crypto;
    document.querySelectorAll('.crypto-item').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    calcConvert();
  }

  window.calcConvert = function() {
    const points = parseFloat(document.getElementById('convertAmount').value) || 0;
    const usd = points * POINT_RATE;
    const cryptoAmount = usd / RATES[selectedCrypto];
    document.getElementById('convertResult').innerText = `You will receive: ${cryptoAmount.toFixed(6)} ${selectedCrypto}`;
  }

  window.convertPoints = function() {
    const points = parseFloat(document.getElementById('convertAmount').value);
    const data = JSON.parse(localStorage.getItem('userData') || '{}');
    if(!points || points < 1000) {
      alert('Minimum convert: 1000 points');
      return;
    }
    if(points > data.balance) {
      alert('Not enough points');
      return;
    }
    alert(`Conversion request: ${points} points -> ${selectedCrypto}\nAdmin will process this.`);
    document.getElementById('convertAmount').value = '';
    calcConvert();
  }

  window.requestWithdraw = function() {
    const amount = parseFloat(document.getElementById('withdrawAmount').value);
    const address = document.getElementById('walletAddress').value.trim();
    const crypto = document.getElementById('withdrawCrypto').value;

    if(!amount || amount <= 0) {
      alert('Enter valid amount');
      return;
    }
    if(!address) {
      alert('Enter wallet address');
      return;
    }

    const mins = {USDT: 10, BNB: 0.01, XRP: 20, XLM: 100};
    if(amount < mins[crypto]) {
      alert(`Minimum withdraw: ${mins[crypto]} ${crypto}`);
      return;
    }

    alert(`Withdraw Request Sent!\n${amount} ${crypto}\nTo: ${address}\nStatus: Pending Approval`);
    document.getElementById('withdrawAmount').value = '';
    document.getElementById('walletAddress').value = '';
  }

  // close if click outside
  document.getElementById('walletModal').addEventListener('click', function(e){
    if(e.target.id === 'walletModal') closeWallet();
  })
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d",
    storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
    messagingSenderId: "787550951987",
    appId: "1:787550951987:web:724b1463e821b99c90a146"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const docSnap = await getDoc(doc(db, "users", user.uid));
      if (docSnap.exists()) {
        const data = docSnap.data();
        localStorage.setItem('userData', JSON.stringify(data));

        const points = data.balance || 0;
        const usd = (points * POINT_RATE).toFixed(2);

        document.getElementById('headerText').innerText = data.name || data.username || user.displayName;
        document.getElementById('balance').innerText = points + ' points';
        document.getElementById('usdBalance').innerText = `≈ $${usd} USD`;
      }
    } else {
      window.location.replace('./log.html');
    }
  });

  window.logout = async function() {
    await signOut(auth);
    localStorage.removeItem('userData');
    window.location.replace('./index.html');
  }
</script>
</body>
</html>
