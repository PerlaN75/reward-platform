<!DOCTYPE html>
<html>
<head>
<title>Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
html,body{height:100%;overflow:hidden!important;overscroll-behavior-y:auto!important}
body{background:#6d28d9;display:flex;justify-content:center}
.wrap{
  width:100%;max-width:430px;height:100dvh;height:100svh;
  background-color:#bfe6f7;
  background-image:url('./bg.jpg');
  background-repeat:no-repeat;
  background-size:100% auto;
  background-position:center bottom;
  position:relative;display:flex;flex-direction:column;
  overflow:hidden!important;
}
/* HEADER - FIXED, NEVER HIDES */
.top{
  position:relative;flex-shrink:0;flex-grow:0;
  width:100%;background:#ffffff;border-radius:0 0 20px 20px;height:54px;min-height:54px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;z-index:50;
  box-shadow:0 6px 14px rgba(0,0,0,0.18)
}
.top h2{font-size:18px;color:#0a5a7a;font-weight:900;flex:1;text-align:center}
#headerText{color:#6d28d9!important;font-size:19px}
.home-btn{display:flex;align-items:center;gap:4px;background:none;border:none;font-weight:900;cursor:pointer;color:#111827}
.home-btn span.emoji{font-size:18px} .home-btn span.txt{font-size:12px}
.logo{width:28px;height:28px;border-radius:50%;overflow:hidden;border:1.5px solid #d4a95a;background:#fff}

/* SCENE - NO SCROLL, FIXED HEIGHT */
.scene{flex:1;position:relative;overflow:hidden;min-height:0}
.monitor{
  position:absolute;left:4%;top:28%;width:44%;max-width:190px;height:172px;
  background:linear-gradient(135deg,#ffffff 0%,#FFF8F0 18%,#FFE9E3 100%);
  border:2px solid #fecaca;border-left:3.5px solid #fff;border-radius:18px;z-index:5;
  box-shadow:inset 5px 0 10px rgba(255,255,255,0.95),0 10px 22px rgba(0,0,0,0.20),0 3px 0 #fca5a5;
  display:flex;flex-direction:column
}
.screen{flex:1;padding:12px 8px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px}
.right-stack{position:absolute;right:3%;top:76px;width:60%;display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:10}
.r-item{
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12px;font-weight:900;color:#111827;white-space:nowrap;
  height:42px;min-width:150px;padding:0 15px;border-radius:18px;
  border:2px solid rgba(255,255,255,0.9);border-left:3px solid #fff;border-bottom:3px solid rgba(0,0,0,0.08);
  box-shadow:inset 3px 0 6px rgba(255,255,255,0.9),0 5px 0 rgba(0,0,0,0.06),0 8px 16px rgba(0,0,0,0.12);
  cursor:pointer;transition:transform 0.08s
}
.r-item:active{transform:translateY(3px)}
.r1{background:linear-gradient(135deg,#fff 0%,#e3f2fd 100%)}
.r2{background:linear-gradient(135deg,#fff 0%,#e8f5e9 100%)}
.r3{background:linear-gradient(135deg,#fff 0%,#fff8e1 100%)}
.r4{background:linear-gradient(135deg,#fff 0%,#e0f7fa 100%)}
.r5{background:linear-gradient(135deg,#fff 0%,#fce4ec 100%)}
.r6{background:linear-gradient(135deg,#fff 0%,#f3e5f5 100%)}
.r7{background:linear-gradient(135deg,#fff 0%,#fff3e0 100%)}

/* BOTTOM - FIXED, NEVER HIDES */
.bottom{
  flex-shrink:0;flex-grow:0;
  width:84%;height:48px;min-height:48px;
  background:rgba(255,255,255,0.98);border-radius:20px;
  display:flex;justify-content:space-around;align-items:center;
  margin:6px auto 10px;box-shadow:0 6px 14px rgba(0,0,0,0.22),0 3px 0 rgba(0,0,0,0.08);
  z-index:20;border:2px solid #fff;border-left:3px solid #fff
}
.bottom button{background:none;border:none;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:900;cursor:pointer;padding:6px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2f3e1a;border:2px solid #fbbf24;color:#fff;padding:10px 14px;border-radius:10px;font-weight:bold;z-index:99999;display:none}
#maint{display:none;position:fixed;inset:0;background:#0f1508;z-index:999999;align-items:center;justify-content:center;padding:20px;text-align:center}
</style>
</head>
<body>
<div id="maint"><div><h1 style="color:#fbbf24">Under Maintenance</h1><button onclick="location.href='index.html'" style="margin-top:20px;padding:12px 24px;border-radius:10px;border:none;font-weight:900">Back</button></div></div>
<div id="toast"></div>
<div class="wrap">
<div class="top">
  <button class="home-btn" onclick="location.href='./index.html'"><span class="emoji">🏠</span><span class="txt">Home</span></button>
  <h2>Welcome <span id="headerText">Ineza</span></h2>
  <div class="logo"><img src="./logo.jpg"></div>
</div>
<div class="scene">
<div class="monitor"><div class="screen">
<div style="color:#6d28d9;font-size:11.5px;font-weight:900">Your Balance</div>
<div style="display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;margin-top:6px">
<div style="text-align:center"><div style="font-size:10.5px;color:#92400e;font-weight:900">⭐ COINS</div><div id="balance" style="font-size:20px;color:#111827;font-weight:900">0 coins</div><div id="usdBalance" style="font-size:10.5px;color:#6b7280;font-weight:800">= $0.0000</div></div>
<div style="width:78%;height:1.5px;background:linear-gradient(90deg,transparent,rgba(251,191,36,0.35),transparent)"></div>
<div style="text-align:center"><div style="font-size:10.5px;color:#0e7490;font-weight:900">💎 USDT</div><div id="usdtBalanceDisplay" style="font-size:20px;color:#059669;font-weight:900">0.8815 USDT</div></div>
</div>
</div></div>
<div class="right-stack">
<button class="r-item r1" onclick="location.href='./watch.html'"><span>Watch & Earn</span><span>📺</span></button>
<button class="r-item r2" onclick="location.href='./survey.html'"><span>Surveys</span><span>📋</span></button>
<button class="r-item r3" onclick="location.href='./bonus.html'"><span>Daily Bonus</span><span>🎁</span></button>
<button class="r-item r4" onclick="location.href='./ads_earn.html'"><span>Ads Earn</span><span>📢</span></button>
<button class="r-item r5" onclick="location.href='./checkin.html'"><span>Daily Checkin</span><span>📅</span></button>
<button class="r-item r6" onclick="location.href='./articles_earn.html'"><span>Articles Earn</span><span>📖</span></button>
<button class="r-item r7" onclick="location.href='./referrals.html'"><span>Refer & Earn</span><span>🤝</span></button>
</div>
</div>
<div class="bottom">
<button onclick="location.href='./quiz_earn.html'">🧠 <span>Quiz</span></button>
<button onclick="location.href='./wallet.html'">💰 <span>Wallet</span></button>
<button onclick="location.href='./more.html'">❄️ <span>More</span></button>
<button onclick="location.href='./offers.html'">💎 <span>Offers</span></button>
</div>
</div>
<script>
(function(){try{var c=JSON.parse(localStorage.getItem('userData')||'{}');if(c&&(c.balance!=null||c.points!=null||c.username)){var bal=c.balance??c.points??0;var usdt=c.usdtBalance??0;document.getElementById('balance').textContent=bal+' coins';document.getElementById('usdBalance').textContent='= $'+(bal*0.0005).toFixed(4);document.getElementById('usdtBalanceDisplay').textContent=Number(usdt).toFixed(4)+' USDT';if(c.username)document.getElementById('headerText').textContent=c.username;}}catch(e){}})();
</script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};firebase.initializeApp(firebaseConfig);
try{const appCheck=firebase.appCheck();appCheck.activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);}catch(e){}
const auth=firebase.auth(),db=firebase.firestore();
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}window.alert=showToast;
const POINT_RATE=0.0005;
function loadData(d){if(!d)return;if(d.usdtBalance==null)d.usdtBalance=0;if(d.balance==null)d.balance=d.points||0;document.getElementById('headerText').innerText=d.username||'';document.getElementById('balance').innerText=(d.balance??d.points??0)+' coins';document.getElementById('usdBalance').innerText='= $'+((d.balance??d.points??0)*POINT_RATE).toFixed(4);document.getElementById('usdtBalanceDisplay').innerText=Number(d.usdtBalance||0).toFixed(4)+' USDT';localStorage.setItem('userData',JSON.stringify(d));}
db.collection("appConfig").doc("main").onSnapshot(s=>{if(s.exists&&s.data().maintenanceMode==="on"){document.getElementById('maint').style.display='flex';}else{document.getElementById('maint').style.display='none';}});
auth.onAuthStateChanged(u=>{if(u){db.collection('users').doc(u.uid).onSnapshot(doc=>{if(doc.exists)loadData(doc.data());});}else{location.href='./index.html';}});
</script>
</body>
</html>
