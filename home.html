<!DOCTYPE html>
<html><head><title>Home - Rewards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;-webkit-tap-highlight-color:transparent}
*:focus{outline:none}
html,body{height:100%;overflow:hidden}
body{background:#ffffff !important;color:#000}
.container{max-width:500px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0 14px;overflow:hidden}
/* TOP BAR LIKE WALLET */
.top-header{display:flex;align-items:center;gap:12px;padding:14px 0 8px;flex-shrink:0}
.back{width:42px;height:38px;background:linear-gradient(180deg,#fef2f2,#ffe4e6);border:2px solid #ef4444;color:#991b1b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 2px 0 #fca5a5;flex-shrink:0}
.back:active{transform:scale(0.96);box-shadow:0 1px 0 #fca5a5}
.header-text{flex:1;text-align:center;font-size:20px;font-weight:800;color:#000;margin-right:42px}
.header-text span{color:#fbbf24}
.balance-card{background:#2f3e1a;border:2px solid #fbbf24;border-radius:16px;padding:6px 8px;text-align:center;margin:0 auto 10px auto;width:88%;max-width:315px;flex-shrink:0}
.balance-row{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.balance-side{flex:1;text-align:center;padding:2px 4px}
.balance-divider{width:1px;height:38px;background:rgba(251,191,36,0.35)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px;flex-shrink:0;justify-items:center;padding:0 10px}
.menu-btn{background:linear-gradient(180deg,#fff,#e8e8e8);color:#000;border:none;border-radius:14px;padding:8px 4px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #bbb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;width:88%;max-width:150px;margin:0 auto;outline:none;user-select:none}
.menu-btn:active{transform:scale(0.98)}
.menu-btn .emoji{font-size:22px;display:block;line-height:1}
#customToast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2f3e1a;border:2px solid #fbbf24;color:#fff;padding:14px 22px;border-radius:12px;font-weight:bold;z-index:99999;display:none;max-width:90%;text-align:center}
#maintenanceOverlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0f1508;z-index:999999;align-items:center;justify-content:center;padding:20px;text-align:center}
</style>
</head><body>
<div id="maintenanceOverlay"><div style="max-width:400px;width:100%"><div style="font-size:40px">🛠️</div><h1 style="color:#fbbf24;font-size:34px;margin-bottom:20px">Under Maintenance</h1><div style="background:#1e2f15;border:2px solid #fbbf24;border-radius:15px;padding:20px"><p style="color:white;font-size:18px">Maintenance for 20 min.</p></div><button onclick="location.href='index.html'" style="background:white;color:black;border:none;padding:14px 28px;border-radius:12px;font-weight:bold;margin-top:20px">Back</button></div></div>
<div id="customToast"></div>
<div class="container">

<div class="top-header">
  <div class="back" onclick="logout()">‹</div>
  <div class="header-text">Welcome, <span id="headerText"></span> 👋</div>
</div>

<div class="balance-card">
<div style="color:#ccc;font-size:11px">Your Balance</div>
<div class="balance-row">
  <div class="balance-side"><div style="font-size:10px;color:#aaa">⭐ COINS</div><div id="balance" style="font-size:22px;color:#fbbf24;font-weight:bold">-- coins</div><div id="usdBalance" style="color:#888;font-size:10px">≈ $--</div></div>
  <div class="balance-divider"></div>
  <div class="balance-side"><div style="font-size:10px;color:#aaa">💵 USDT</div><div id="usdtBalanceDisplay" style="font-size:20px;color:#22c55e;font-weight:bold">-- USDT</div><div style="color:#6b8f5a;font-size:9px">Available</div></div>
</div>
</div>

<script>(function(){try{var c=JSON.parse(localStorage.getItem('userData')||'{}');if(c&&(c.balance!=null||c.points!=null||c.username)){var bal=c.balance??c.points??0;var usdt=c.usdtBalance??0;document.getElementById('balance').textContent=bal+' coins';document.getElementById('usdBalance').textContent='≈ $'+(bal*0.0005).toFixed(4);document.getElementById('usdtBalanceDisplay').textContent=Number(usdt).toFixed(4)+' USDT';if(c.username)document.getElementById('headerText').textContent=c.username;}}catch(e){}})();</script>

<div class="menu-grid">
<button class="menu-btn" onclick="location.href='./wallet.html'" style="border:2px solid #f59e0b; background: linear-gradient(180deg,#fffbeb,#fde68a);"><span class="emoji">💰</span>Wallet</button>
<button class="menu-btn" onclick="location.href='./checkin.html'" style="border:2px solid #ef4444; background: linear-gradient(180deg,#fef2f2,#fecaca);"><span class="emoji">📅</span>Daily Checkin</button>
<button class="menu-btn" onclick="location.href='./watch.html'" style="border:2px solid #3b82f6; background: linear-gradient(180deg,#eff6ff,#bfdbfe);"><span class="emoji">📺</span>Watch & Earn</button>
<button class="menu-btn" onclick="location.href='./articles_earn.html'" style="border:2px solid #a855f7; background: linear-gradient(180deg,#f3e8ff,#d8b4fe);"><span class="emoji">📰</span>Articles Earn</button>
<button class="menu-btn" onclick="location.href='./survey.html'" style="border:2px solid #22c55e; background: linear-gradient(180deg,#dcfce7,#bbf7d0);"><span class="emoji">📝</span>Surveys</button>
<button class="menu-btn" onclick="location.href='./referrals.html'" style="border:2px solid #f97316; background: linear-gradient(180deg,#ffedd5,#fed7aa);"><span class="emoji">🤝</span>Refer & Earn</button>
<button class="menu-btn" onclick="location.href='./bonus.html'" style="border:2px solid #eab308; background: linear-gradient(180deg,#fefce8,#fef08a);"><span class="emoji">🎁</span>Daily Bonus</button>
<button class="menu-btn" onclick="location.href='./more.html'" style="border:2px solid #6366f1; background: linear-gradient(180deg,#eef2ff,#c7d2fe);"><span class="emoji">⚙️</span>More</button>
<button class="menu-btn" onclick="location.href='./ads_earn.html'" style="border:2px solid #06b6d4; background: linear-gradient(180deg,#ecfeff,#a5f3fc);"><span class="emoji">📢</span>Ads Earn</button>
<button class="menu-btn" onclick="location.href='./offers.html'" style="border:2px solid #d946ef; background: linear-gradient(180deg,#fdf4ff,#f5d0fe);"><span class="emoji">💎</span>Offers</button>
</div>

</div>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try{const appCheck=firebase.appCheck();appCheck.activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);}catch(e){}
const auth=firebase.auth(),db=firebase.firestore();
function showToast(m){const t=document.getElementById('customToast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}window.alert=showToast;
const POINT_RATE=0.0005;
function loadData(d){if(!d)return;if(d.usdtBalance==null)d.usdtBalance=0;if(d.balance==null)d.balance=d.points||0;document.getElementById('headerText').innerText=d.username||'';document.getElementById('balance').innerText=(d.balance??d.points??0)+' coins';document.getElementById('usdBalance').innerText=`≈ $${((d.balance??d.points??0)*POINT_RATE).toFixed(4)}`;document.getElementById('usdtBalanceDisplay').innerText=Number(d.usdtBalance||0).toFixed(4)+' USDT';localStorage.setItem('userData',JSON.stringify(d));}
db.collection("appConfig").doc("main").onSnapshot(s=>{if(s.exists&&s.data().maintenanceMode==="on"){document.getElementById('maintenanceOverlay').style.display='flex';}else{document.getElementById('maintenanceOverlay').style.display='none';}});
auth.onAuthStateChanged(u=>{if(u){db.collection('users').doc(u.uid).onSnapshot(doc=>{if(doc.exists)loadData(doc.data());});}else{location.href='./index.html';}});
window.logout=async function(){await auth.signOut();localStorage.clear();location.href='./index.html';}
</script></body></html>
