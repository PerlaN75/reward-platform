<!DOCTYPE html>
<html>
<head>
  <title>Home - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; }
.container { max-width: 500px; margin: 0 auto; }

.header { text-align: center; margin: 40px 0 30px 0; }
.header h2 { font-size: 34px; font-weight: bold; color: #fff; }
.header h2 span { color: #fbbf24; font-weight: bold; text-transform: capitalize; }

.balance-card { background: #2f3e1a; border: 2px solid #fbbf24; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px; }
.balance-card.label { font-size: 14px; color: #ccc; }
.balance-card.amount { font-size: 32px; font-weight: bold; color: #fbbf24; margin-top: 5px; }
.balance-card.usd { font-size: 16px; color: #aaa; margin-top: 8px; }

.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }

.menu-btn {
      background: linear-gradient(180deg, #ffffff, #e8e8e8);
      color: #000; border: none; border-radius: 15px; padding: 20px 10px;
      font-size: 15px; font-weight: bold; cursor: pointer; text-align: center;
      box-shadow: 0 6px 0 #bbbbbb, 0 8px 15px rgba(0,0,0,0.3);
      transition: all 0.1s ease; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
.menu-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #bbbbbb; }
.menu-btn.emoji { font-size: 100px; }

.logout-btn {
      width: 40%; margin: 20px auto 0 auto; display: block; padding: 14px;
      background: #f59e0b; color: #000; border: none; border-radius: 12px;
      font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #d97706;
    }

    /* MODAL - CENTERED */
.modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
.modal-content { background: #2f3e1a; border: 3px solid #fbbf24; border-radius: 20px; padding: 18px; width: 100%; max-width: 400px; color: white; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.modal-header h2 { font-size: 20px; color: #fbbf24; display: flex; align-items: center; gap: 8px; }
.close-btn { font-size: 24px; color: white; cursor: pointer; font-weight: bold; }
.popup-balance { background: #000; border: 2px solid #fbbf24; border-radius: 15px; padding: 15px; margin: 10px 0; text-align: center; }
.popup-balance.label { font-size: 13px; color: #ccc; margin-bottom: 6px; }
.popup-balance.amount { font-size: 28px; color: #f59e0b; font-weight: bold; }
.input-box { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 2px solid #444; border-radius: 10px; color: white; font-size: 14px; outline: none; }
.action-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #fbbf24, #f59e0b); color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top:8px; }
.action-btn:disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: none; }
.note { font-size: 12px; color: #aaa; margin-top: 6px; text-align: center; }

    /* WALLET STYLES */
.tabs { display: flex; gap: 8px; margin: 10px 0; }
.tab-btn { flex: 1; padding: 10px; background: #1a2410; border: 2px solid #555; border-radius: 10px; color: #ccc; font-weight: bold; cursor: pointer; font-size: 13px; }
.tab-btn.active { background: #fbbf24; color: #000; border-color: #fbbf24; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.crypto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.crypto-item { background: #1a2410; padding: 12px; border-radius: 12px; border: 2px solid #444; text-align: center; cursor: pointer; }
.crypto-item.selected { border-color: #22c55e; background: #1a2e1a; }
.crypto-item.icon { font-size: 20px; }
.crypto-item.name { font-weight: bold; margin-top: 4px; font-size: 13px; }
.info-row { background: #1a2410; padding: 10px; border-radius: 10px; margin: 6px 0; display: flex; justify-content: space-between; font-size: 13px; }
.convert-result { background: #000; padding: 12px; border-radius: 10px; text-align: center; margin: 8px 0; border: 1px dashed #fbbf24; font-size: 13px; }
.crypto-balances { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
.crypto-balance-card { background: #000; border: 1px solid #444; padding: 10px; border-radius: 10px; text-align: center; }
.crypto-balance-card.name { font-size: 11px; color: #aaa; }
.crypto-balance-card.value { font-size: 16px; font-weight: bold; color: #fbbf24; margin-top: 3px; }

    /* CUSTOM DROPDOWN */
.custom-select { position: relative; margin: 8px 0; }
.select-selected {
    background: #000; border: 2px solid #444; border-radius: 10px;
    padding: 12px; color: white; cursor: pointer; display: flex;
    align-items: center; gap: 8px; font-size: 14px; position: relative;
  }
.select-selected:after {
    content: ""; position: absolute; right: 12px; top: 16px;
    border: 6px solid transparent; border-color: #fbbf24 transparent transparent transparent;
  }
.select-items {
    position: absolute; background: #1a2410; border: 2px solid #fbbf24;
    border-radius: 10px; top: 100%; left: 0; right: 0; z-index: 99;
    max-height: 180px; overflow-y: auto; display: none;
  }
.select-items div {
    padding: 12px; color: white; cursor: pointer; display: flex;
    align-items: center; gap: 8px; border-bottom: 1px solid #333;
  }
.select-items div:last-child { border-bottom: none; }
.select-items div:hover { background: #2f3e1a; }
.select-items div.active { background: #fbbf24; color: #000; font-weight: bold; }

    /* DAILY CHECKIN STYLES - CENTERED CARD */
.checkin-card { background: #000; border: 2px dashed #fbbf24; border-radius: 15px; padding: 20px; text-align: center; margin: 10px 0; }
.checkin-card.big-emoji { font-size: 50px; margin-bottom: 8px; }
.checkin-card h3 { font-size: 20px; color: #fbbf24; margin-bottom: 6px; }
.checkin-card p { font-size: 14px; color: #ccc; margin-bottom: 12px; }
.claimed-text { color: #22c55e; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.countdown { font-size: 18px; color: #fbbf24; font-weight: bold; margin-top: 8px; }
.success-msg { background: #1a2e1a; border: 1px solid #22c55e; color: #22c55e; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 14px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Welcome, <span id="headerText">Manzi</span></h2>
    </div>

    <div class="balance-card">
      <div class="label">Your Balance</div>
      <div class="amount" id="balance"></div>
      <div class="usd" id="usdBalance"></div>
    </div>

    <div class="menu-grid">
      <button class="menu-btn" onclick="openWallet()"><span class="emoji">💰</span>Wallet</button>
      <button class="menu-btn" onclick="openCheckin()"><span class="emoji">📅</span>Daily Checkin</button>
      <button class="menu-btn" onclick="window.location.href='./quiz.html'"><span class="emoji">🧠</span>Quiz</button>
      <button class="menu-btn" onclick="window.location.href='./referrals.html'"><span class="emoji">🤝</span>Refer & Earn</button>
      <button class="menu-btn" onclick="alert('Coming Soon')"><span class="emoji">🎁</span>Gifts</button>
      <button class="menu-btn" onclick="window.location.href='./more.html'"><span class="emoji">⚙️</span>More</button>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- WALLET POPUP -->
  <div id="walletModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>💰 My Wallet</h2>
        <span class="close-btn" onclick="closeWallet()">X</span>
      </div>
      <div class="popup-balance">
        <div class="label">Points Balance</div>
        <div class="amount" id="popupPoints">0 points</div>
        <div class="usd" id="popupUSD">≈ $0.00 USD</div>
      </div>
      <!-- wallet tabs same as before -->
    </div>
  </div>

  <!-- DAILY CHECKIN POPUP -->
  <div id="checkinModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><span>📅</span> Daily Checkin</h2>
        <span class="close-btn" onclick="closeCheckin()">X</span>
      </div>

      <div class="checkin-card">
        <div class="big-emoji">🎁</div>
        <h3>Claim Your Daily Reward</h3>
        <p>Get <b style="color:#fbbf24">20 Points</b> every day!</p>

        <button class="action-btn" id="claimBtn" onclick="claimDaily()">Claim 20 Points</button>
        <div class="note" id="checkinNote"></div>
        <div class="countdown" id="countdown"></div>
        <div class="success-msg" id="successMsg">+20 Points Added to Your Balance! 🎉</div>
      </div>
    </div>
  </div>

<script>
  let selectedCrypto = 'USDT';
  const RATES = { USDT: 1, BNB: 600, XRP: 0.6, XLM: 0.12 };
  const POINT_RATE = 0.0005;
  const DAILY_REWARD = 20;
  let currentUser = null;
  let countdownInterval = null;

  function loadData() {
    const data = JSON.parse(localStorage.getItem('userData') || '{}');
    document.getElementById('headerText').innerText = data.name || "Manzi";
    document.getElementById('balance').innerText = (data.balance || 0) + ' points';
    document.getElementById('usdBalance').innerText = `≈ $${((data.balance || 0) * POINT_RATE).toFixed(2)} USD`;
  }
  loadData();

  // WALLET
  window.openWallet = async function() {
    const data = JSON.parse(localStorage.getItem('userData') || '{}');
    const points = data.balance || 0;
    document.getElementById('popupPoints').innerText = points + ' points';
    document.getElementById('popupUSD').innerText = `≈ $${(points * POINT_RATE).toFixed(2)} USD`;
    document.getElementById('walletModal').style.display = 'flex';
  }
  window.closeWallet = function() { document.getElementById('walletModal').style.display = 'none'; }

  // DAILY CHECKIN
  window.openCheckin = function() {
    document.getElementById('successMsg').style.display = 'none';
    checkClaimStatus();
    document.getElementById('checkinModal').style.display = 'flex';
  }
  window.closeCheckin = function() {
    document.getElementById('checkinModal').style.display = 'none';
    clearInterval(countdownInterval);
  }

  function getNextClaimTime() {
    const now = new Date();
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setHours(0, 0, 0, 0);
    return tomorrow;
  }

  function updateCountdown() {
    const nextClaim = getNextClaimTime();
    const now = new Date();
    const diff = nextClaim - now;

    if(diff <= 0) {
      clearInterval(countdownInterval);
      checkClaimStatus();
      return;
    }

    const hours = Math.floor(diff / 1000 / 60 / 60);
    const minutes = Math.floor(diff / 1000 / 60) % 60;
    const seconds = Math.floor(diff / 1000) % 60;

    document.getElementById('countdown').innerText = `Next claim in: ${hours}h ${minutes}m ${seconds}s`;
  }

  function checkClaimStatus() {
    const today = new Date().toISOString().split('T')[0];
    const lastClaim = localStorage.getItem('lastCheckin');
    const btn = document.getElementById('claimBtn');
    const note = document.getElementById('checkinNote');
    const countdown = document.getElementById('countdown');

    clearInterval(countdownInterval);

    if(lastClaim === today) {
      btn.disabled = true;
      btn.innerText = "Already Claimed Today";
      note.innerHTML = `<span class="claimed-text">✓ Claimed! Come back tomorrow</span>`;
      countdown.style.display = 'block';
      updateCountdown();
      countdownInterval = setInterval(updateCountdown, 1000);
    } else {
      btn.disabled = false;
      btn.innerText = `Claim ${DAILY_REWARD} Points`;
      note.innerText = "Tap to claim your daily reward";
      countdown.style.display = 'none';
      countdown.innerText = '';
    }
  }

  window.claimDaily = async function() {
    const today = new Date().toISOString().split('T')[0];
    const lastClaim = localStorage.getItem('lastCheckin');

    if(lastClaim === today) return; // no alert

    let data = JSON.parse(localStorage.getItem('userData') || '{}');
    data.balance = (data.balance || 0) + DAILY_REWARD;
    localStorage.setItem('userData', JSON.stringify(data));
    localStorage.setItem('lastCheckin', today);

    // Update Firebase
    if(currentUser) {
      await db.collection("users").doc(currentUser.uid).update({
        balance: data.balance,
        lastCheckin: today
      });
    }

    document.getElementById('successMsg').style.display = 'block';
    loadData();
    checkClaimStatus();
  }

  // Close modal on background click
  document.getElementById('walletModal').addEventListener('click', function(e){
    if(e.target.id === 'walletModal') closeWallet();
  })
  document.getElementById('checkinModal').addEventListener('click', function(e){
    if(e.target.id === 'checkinModal') closeCheckin();
  })
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      const doc = await db.collection("users").doc(user.uid).get();
      if (doc.exists) {
        localStorage.setItem('userData', JSON.stringify(doc.data()));
        loadData();
      }
    } else {
      window.location.replace('./log.html');
    }
  });

  window.logout = async function() {
    await auth.signOut();
    localStorage.removeItem('userData');
    localStorage.removeItem('lastCheckin');
    window.location.replace('./index.html');
  }
</script>
</body>
</html>
