<!DOCTYPE html>
<html>
<head>
  <title>Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; flex-direction: column; }
    .container { background: #3a4a22; padding: 30px 20px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; }
    h2 { color: white; font-size: 24px; margin-bottom: 10px; font-weight: bold; }
    .tagline { color: #fbbf24; font-size: 13px; margin-bottom: 20px; }
    .balance-box { background: #000; padding: 20px; border-radius: 15px; margin: 20px 0; }
    .balance-label { color: #ccc; font-size: 13px; margin-bottom: 5px; }
    .balance { color: #22c55e; font-size: 32px; font-weight: bold; }
    .btn { width: 100%; padding: 13px; margin: 8px 0; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-primary { background: #22c55e; color: black; }
    .btn-secondary { background: #3b82f6; color: white; }
    .btn-logout { background: #ef4444; color: white; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="welcome">Loading...</h2> <!-- CHANGED: was "Welcome back User" -->
    <div class="tagline">🐒 From Nothing to Something 🍇</div>
    
    <div class="balance-box">
      <div class="balance-label">Your Balance</div>
      <div class="balance" id="points">0</div> <!-- CHANGED: added id -->
    </div>

    <button class="btn btn-primary" onclick="alert('Daily Checkin coming soon')">Daily Checkin</button>
    <button class="btn btn-secondary" onclick="alert('Referrals coming soon')">My Referrals</button>
    <button class="btn btn-logout" onclick="logout()">Logout</button>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { 
    apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", 
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com", 
    projectId: "reward-platform-rw-2e13d"
  };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app);
  const db = getFirestore(app);

  const welcomeEl = document.getElementById('welcome');
  const pointsEl = document.getElementById('points');
  
  // Start with Loading so we don't flash "User"
  welcomeEl.innerText = "Loading...";

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      try {
        const docRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(docRef);
        
        if (docSnap.exists()) {
          const data = docSnap.data();
          welcomeEl.innerText = `Welcome back ${data.username}`; // Shows Priya
          pointsEl.innerText = data.balance || 0;
        } else {
          welcomeEl.innerText = "Welcome back";
          console.log("No user data in Firestore");
        }
      } catch(e) {
        console.error("Error getting user data:", e);
        welcomeEl.innerText = "Welcome back";
      }
    } else {
      // Not logged in, send to login
      window.location.href = "log.html";
    }
  });

  window.logout = function() {
    signOut(auth).then(() => {
      window.location.href = "log.html";
    }).catch((error) => {
      alert(error.message);
    });
  }
</script>
</body>
</html>
