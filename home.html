<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reward Platform - Home</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffe6f0;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 { color: #d63384; }
    .welcome { font-size: 18px; margin-bottom: 20px; }
    .points { font-size: 22px; font-weight: bold; color: #28a745; margin-bottom: 30px; }
    .referral-box {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 30px;
      border: 2px dashed #d63384;
    }
    .referral-box input {
      width: 90%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-top: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
    .btn {
      padding: 20px;
      background: #d63384;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover { background: #b52a6e; }
    .logout { margin-top: 30px; background: #6c757d; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 Reward Platform</h1>
    <div class="welcome" id="welcomeText">Welcome!</div>
    <div class="points" id="pointsText">Points: 0</div>

    <div class="referral-box">
      <h3>🔗 Your Referral Link</h3>
      <p>Share this and both get 100 points!</p>
      <input type="text" id="referralLink" readonly>
      <button class="btn" onclick="copyLink()" style="margin-top:10px; padding:10px;">Copy Link</button>
    </div>

    <div class="grid">
      <button class="btn">Watch Ads</button>
      <button class="btn">Complete Tasks</button>
      <button class="btn">Daily Bonus</button>
      <button class="btn">Withdraw</button>
      <button class="btn">Referrals</button>
      <button class="btn">Profile</button>
    </div>

    <button class="btn logout" onclick="logout()">Logout</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          const data = userDoc.data();
          const username = data.username;
          const points = data.points || 0;

          document.getElementById("welcomeText").innerText = `Welcome, ${username}!`;
          document.getElementById("pointsText").innerText = `Points: ${points}`;

          // FIXED: Added /reward-platform/ to the link
          const referralLink = `https://perlan75.github.io/reward-platform/reg.html?ref=${username}`;
          document.getElementById("referralLink").value = referralLink;
        }
      } else {
        window.location.href = "login.html";
      }
    });

    function copyLink() {
      const link = document.getElementById("referralLink");
      link.select();
      document.execCommand("copy");
      alert("Referral link copied!");
    }

    function logout() {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    }
  </script>
</body>
</html>
