<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;-webkit-tap-highlight-color:transparent}

.back-rect{width:110px;height:38px;border:2px solid #ef7a7a;border-radius:20px;display:flex;align-items:center;justify-content:flex-start;padding-left:18px;font-size:22px;color:#ef7a7a;font-weight:900;cursor:pointer;background:#fffaf3}
.top-bar h2{font-size:28px;color:#8b4513;font-weight:800}
.top-bar .logo{display:flex;align-items:center;gap:8px;font-size:12px;color:#8b4513;font-weight:700;letter-spacing:1px}
.gold-circles{position:absolute;top:50%;left:50%;transform:translate(-50%,-45%);width:780px;height:780px;border-radius:50%;border:2px solid #f5c542;z-index:1}
.gold-circles::before{content:'';position:absolute;top:18px;left:18px;right:18px;bottom:18px;border:2px solid #f7d16a;border-radius:50%}
.podium{position:absolute;bottom:95px;left:50%;transform:translateX(-50%);width:680px;height:120px;background:#fffefc;border-radius:50% / 30%;box-shadow:0 18px 0 #f5d5c3, 0 10px 30px rgba(0,0,0,0.1);z-index:2}
.computer-wrap{position:absolute;bottom:165px;left:50%;transform:translateX(-50%);z-index:3;width:420px}
.computer-screen{width:420px;height:240px;background:#123d25;border:8px solid #111;border-radius:14px 14px 6px 6px;padding:12px;text-align:center;position:relative}
.computer-screen::after{content:'📡';position:absolute;top:-48px;right:-10px;font-size:42px}
.screen-base{width:120px;height:30px;background:#c0c0c0;margin:0 auto;border-radius:0 0 8px 8px}
.keyboard{width:360px;height:32px;background:linear-gradient(#e5e5e5,#b5b5b5);margin:8px auto 0;border-radius:6px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #999}
.kbd-lines{width:90%;height:18px;background:repeating-linear-gradient(90deg,#333 0 14px,#777 14px 16px)}
.side-pill{position:absolute;width:175px;height:46px;border-radius:22px;display:flex;align-items:center;padding:0 12px;gap:8px;font-size:15px;font-weight:900;color:#000;cursor:pointer;z-index:4;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
.side-pill:active{transform:scale(0.97)}
.side-pill .emoji{font-size:22px}
.left-1{left:28px;top:150px;background:#ffec5c;border:2px solid #f5c200}
.left-2{left:28px;top:212px;background:#a9d6ff;border:2px solid #5aa8ff}
.left-3{left:28px;top:274px;background:#7dff9a;border:2px solid #22c55e}
.left-4{left:28px;top:336px;background:#ffeb4d;border:2px solid #f5c200}
.left-5{left:28px;top:398px;background:#7ef8ff;border:2px solid #06b6d4}
.right-1{right:28px;top:150px;background:#ff9aa2;border:2px solid #ef4444}
.right-2{right:28px;top:212px;background:#ff9ecf;border:2px solid #ec4899}
.right-3{right:28px;top:274px;background:#b07cff;border:2px solid #7c3aed}
.right-4{right:28px;top:336px;background:#ffb86a;border:2px solid #f97316}
.right-5{right:28px;top:398px;background:#b8b6ff;border:2px solid #8b5cf6}
.bottom-nav{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:520px;height:52px;background:#fffaf0;border-radius:26px;display:flex;align-items:center;justify-content:space-around;padding:0 18px;box-shadow:0 6px 18px rgba(0,0,0,0.12);z-index:10}
.bottom-nav div{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:900;color:#000;cursor:pointer}
.bottom-nav .b-emoji{font-size:22px}
#customToast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2f3e1a;border:2px solid #fbbf24;color:#fff;padding:14px 22px;border-radius:12px;font-weight:bold;z-index:99999;display:none;max-width:90%;text-align:center}
#maintenanceOverlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0f1508;z-index:999999;align-items:center;justify-content:center;padding:20px;text-align:center}
.bal-title{color:#d4e8a0;font-size:16px;margin-bottom:12px}
.bal-row{display:flex;justify-content:space-between;text-align:left}
.bal-side{flex:1}
.bal-divider{width:1px;background:rgba(251,191,36,0.35);margin:0 10px}

<script>
(function(){
  try{
    var c = JSON.parse(localStorage.getItem('userData')||'{}');
    if(c && (c.balance!=null || c.points!=null || c.username)){
      var bal = c.balance ?? c.points ?? 0;
      var usdt = c.usdtBalance ?? 0;
      document.getElementById('balance').textContent = bal + ' coins';
      document.getElementById('usdBalance').textContent = '≈ $' + (bal*0.0005).toFixed(4);
      document.getElementById('usdtBalanceDisplay').textContent = Number(usdt).toFixed(4) + ' USDT';
      if(c.username) document.getElementById('headerText').textContent = c.username;
    }
  }catch(e){}
})();
</script>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try { const appCheck = firebase.appCheck(); appCheck.activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', true); } catch(e) {}
const auth=firebase.auth(),db=firebase.firestore();
function showToast(m){const t=document.getElementById('customToast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);} window.alert=showToast;
const POINT_RATE=0.0005;
function loadData(d){
  if(!d) return;
  if(d.usdtBalance==null) d.usdtBalance=0;
  if(d.balance==null) d.balance=d.points||0;
  document.getElementById('headerText').innerText=d.username||'';
  document.getElementById('balance').innerText=(d.balance ?? d.points ?? 0)+' coins';
  document.getElementById('usdBalance').innerText=`≈ $${((d.balance ?? d.points ?? 0)*POINT_RATE).toFixed(4)}`;
  document.getElementById('usdtBalanceDisplay').innerText=Number(d.usdtBalance||0).toFixed(4)+' USDT';
  localStorage.setItem('userData', JSON.stringify(d));
}
db.collection("appConfig").doc("main").onSnapshot(s=>{if(s.exists&&s.data().maintenanceMode==="on"){document.getElementById('maintenanceOverlay').style.display='flex';}else{document.getElementById('maintenanceOverlay').style.display='none';}});
auth.onAuthStateChanged(u=>{
  if(u){
    db.collection('users').doc(u.uid).onSnapshot(doc=>{
      if(doc.exists) loadData(doc.data());
    });
  }else{
    location.href='./index.html';
  }
});
</script></body></html>
