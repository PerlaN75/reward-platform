<!DOCTYPE html>
<html>
<head>
  <title>Home - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; overflow-x: hidden; }
.container { max-width: 500px; margin: 0 auto; }
.header { text-align: center; margin: 40px 0 30px 0; }
.header h2 { font-size: 34px; font-weight: bold; color: #fff; }
.header h2 span { color: #fbbf24; font-weight: bold; text-transform: capitalize; }
.balance-card { background: #2f3e1a; border: 2px solid #fbbf24; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px; }
.balance-card.label { font-size: 14px; color: #ccc; }
.balance-card.amount { font-size: 32px; font-weight: bold; color: #fbbf24; margin-top: 5px; }
.balance-card.usd { font-size: 16px; color: #aaa; margin-top: 8px; }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
.menu-btn { background: linear-gradient(180deg, #ffffff, #e8e8e8); color: #000; border: none; border-radius: 15px; padding: 20px 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; box-shadow: 0 6px 0 #bbbbbb, 0 8px 15px rgba(0,0,0,0.3); transition: all 0.1s ease; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.menu-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #bbbbbb; }
.menu-btn.emoji { font-size: 40px; }
.logout-btn { width: 40%; margin: 20px auto 0 auto; display: block; padding: 14px; background: #f59e0b; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #d97706; }
.modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
.modal-content { background: #2f3e1a; border: 3px solid #fbbf24; border-radius: 20px; padding: 18px; width: 100%; max-width: 420px; color: white; max-height: 95vh; overflow-y: auto; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.modal-header h2 { font-size: 20px; color: #fbbf24; display: flex; align-items: center; gap: 8px; }
.close-btn { font-size: 24px; color: white; cursor: pointer; font-weight: bold; }
.note { font-size: 12px; color: #aaa; margin-top: 6px; text-align: center; }
.checkin-card { background: #000; border: 2px dashed #fbbf24; border-radius: 15px; padding: 20px; text-align: center; margin: 10px 0; }
.checkin-card.big-emoji { font-size: 50px; margin-bottom: 8px; }
.checkin-card h3 { font-size: 20px; color: #fbbf24; margin-bottom: 6px; }
.checkin-card p { font-size: 14px; color: #ccc; margin-bottom: 12px; }
.action-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #fbbf24, #f59e0b); color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top:8px; }
.action-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
.countdown { font-size: 18px; color: #fbbf24; font-weight: bold; margin-top: 8px; text-align: center; }
.success-msg { background: #1a2e1a; border: 1px solid #22c55e; color: #22c55e; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 14px; display: none; text-align: center; }

.gift-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
.gift-box { background: #1a2410; border: 2px solid #fbbf24; border-radius: 15px; font-size: 55px; text-align: center; padding: 15px 0; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; }
.gift-box:hover { transform: scale(1.05); border-color: #f59e0b; }
.gift-box.disabled { opacity: 0.3; pointer-events: none; }
.gift-box.burst { animation: burst 0.6s ease; }
@keyframes burst { 0% { transform: scale(1); } 50% { transform: scale(1.3) rotate(10deg); } 100% { transform: scale(1); }
.gift-points { font-size: 14px; color: #22c55e; font-weight: bold; margin-top: 4px; }
.gift-history { background: #000; padding: 10px; border-radius: 10px; font-size: 13px; margin-top: 10px; text-align: center; }

.confetti { position: absolute; width: 8px; height: 8px; background: #fbbf24; animation: confetti-fall 1.2s ease-out forwards; pointer-events: none; z-index: 1000; }
@keyframes confetti-fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(200px) rotate(720deg); opacity: 0; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Welcome, <span id="headerText">Manzi</span></h2>
    </div>
    <div class="balance-card">
      <div class="label">Your Balance</div>
      <div class="amount" id="balance"></div>
      <div class="usd" id="usdBalance"></div>
    </div>
    <div class="menu-grid">
      <button class="menu-btn" onclick="openWallet()"><span class="emoji">💰</span>Wallet</button>
      <button class="menu-btn" onclick="openCheckin()"><span class="emoji">📅</span>Daily Checkin</button>
      <button class="menu-btn" onclick="window.location.href='./quiz.html'"><span class="emoji">🧠</span>Quiz</button>
      <button class="menu-btn" onclick="window.location.href='./referrals.html'"><span class="emoji">🤝</span>Refer & Earn</button>
      <button class="menu-btn" onclick="openGift()"><span class="emoji">🎁</span>Gifts</button>
      <button class="menu-btn" onclick="window.location.href='./more.html'"><span class="emoji">⚙️</span>More</button>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- GIFT POPUP -->
  <div id="giftModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><span>🎁</span> Gift Center</h2>
        <span class="close-btn" onclick="closeGift()">X</span>
      </div>
      <p class="note" id="giftNote">Pick 1 mystery box. Resets at midnight</p>
      <div class="gift-grid" id="giftGrid"></div>
      <div class="countdown" id="giftCountdown"></div>
      <div class="gift-history" id="giftHistory">No gifts claimed yet</div>
      <div class="success-msg" id="giftSuccessMsg"></div>
    </div>
  </div>

  <!-- CHECKIN POPUP -->
  <div id="checkinModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><span>📅</span> Daily Checkin</h2>
        <span class="close-btn" onclick="closeCheckin()">X</span>
      </div>
      <div class="checkin-card">
        <div class="big-emoji">🎁</div>
        <h3>Claim Your Daily Reward</h3>
        <p>Get <b style="color:#fbbf24">20 Points</b> every day!</p>
        <button class="action-btn" id="claimBtn" onclick="claimDaily()">Claim 20 Points</button>
        <div class="note" id="checkinNote"></div>
        <div class="countdown" id="countdown"></div>
        <div class="success-msg" id="successMsg">+20 Points Added to Your Balance! 🎉</div>
      </div>
    </div>
  </div>

<script>
  const GIFT_POOL = [4,5,7,0,10,12,0,15,20,22,0,25];
  const POINT_RATE = 0.0005;
  const DAILY_REWARD = 20;
  let userData = {};
  let giftCountdownInterval = null;
  let countdownInterval = null;

  function loadData() {
    userData = JSON.parse(localStorage.getItem('userData') || '{}');
    document.getElementById('headerText').innerText = userData.name || "Manzi";
    document.getElementById('balance').innerText = (userData.balance || 0) + ' points';
    document.getElementById('usdBalance').innerText = `≈ $${((userData.balance || 0) * POINT_RATE).toFixed(2)} USD`;
  }
  loadData();

  function getToday() { return new Date().toISOString().split('T')[0]; }
  function getNextClaimTime() { const now = new Date(); const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1); tomorrow.setHours(0, 0, 0, 0); return tomorrow; }

  // CONFETTI
  function shootConfetti(element) {
    const colors = ['#fbbf24', '#f59e0b', '#22c55e', '#3b82f6', '#ec4899'];
    const rect = element.getBoundingClientRect();
    for(let i = 0; i < 30; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.left = rect.left + rect.width/2 + 'px';
      confetti.style.top = rect.top + rect.height/2 + 'px';
      confetti.style.transform = `translateX(${Math.random()*100-50}px)`;
      confetti.style.animationDelay = Math.random() * 0.2 + 's';
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 1200);
    }
  }

  // GIFT
  function getRotatedPool() {
    const startDate = new Date('2026-01-01');
    const today = new Date();
    const diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
    const shift = diffDays % 12;
    return [...GIFT_POOL.slice(shift),...GIFT_POOL.slice(0, shift)];
  }
  window.openGift = function() {
    document.getElementById('giftSuccessMsg').style.display = 'none';
    buildGiftGrid();
    checkGiftStatus();
    document.getElementById('giftModal').style.display = 'flex';
  }
  window.closeGift = function() {
    document.getElementById('giftModal').style.display = 'none';
    clearInterval(giftCountdownInterval);
  }
  function buildGiftGrid() {
    const pool = getRotatedPool();
    const grid = document.getElementById('giftGrid');
    grid.innerHTML = '';
    pool.forEach((pts, i) => {
      const box = document.createElement('div');
      box.className = 'gift-box';
      box.innerHTML = '📦';
      box.onclick = () => pickGift(i, pts, box);
      grid.appendChild(box);
    });
  }
  function checkGiftStatus() {
    const today = getToday();
    const lastClaim = userData.lastGiftClaim;
    clearInterval(giftCountdownInterval);
    if(lastClaim === today) {
      document.querySelectorAll('.gift-box').forEach(b => b.classList.add('disabled'));
      document.getElementById('giftNote').innerText = "Already picked today. Come back tomorrow";
      document.getElementById('giftHistory').innerText = `Last gift: ${userData.lastGiftPoints} points`;
      document.getElementById('giftCountdown').style.display = 'block';
      updateGiftCountdown();
      giftCountdownInterval = setInterval(updateGiftCountdown, 1000);
    } else {
      document.querySelectorAll('.gift-box').forEach(b => b.classList.remove('disabled'));
      document.getElementById('giftNote').innerText = "Pick 1 mystery box. Resets at midnight";
      document.getElementById('giftHistory').innerText = userData.lastGiftPoints? `Last gift: ${userData.lastGiftPoints} points` : 'No gifts claimed yet';
      document.getElementById('giftCountdown').style.display = 'none';
    }
  }
  function updateGiftCountdown() {
    const diff = getNextClaimTime() - new Date();
    if(diff <= 0) { clearInterval(giftCountdownInterval); checkGiftStatus(); return; }
    const h = Math.floor(diff / 1000 / 60 / 60);
    const m = Math.floor(diff / 1000 / 60) % 60;
    const s = Math.floor(diff / 1000) % 60;
    document.getElementById('giftCountdown').innerText = `Next gift in: ${h}h ${m}m ${s}s`;
  }
  window.pickGift = async function(index, points, el) {
    if(userData.lastGiftClaim === getToday()) return;
    el.classList.add('burst');
    if(points > 0) shootConfetti(el);
    el.innerHTML = points === 0? '💀<div class="gift-points">0 pts</div>' : `+${points}<div class="gift-points">pts</div>`;
    userData.balance = (userData.balance || 0) + points;
    userData.lastGiftClaim = getToday();
    userData.lastGiftPoints = points;
    localStorage.setItem('userData', JSON.stringify(userData));
    document.querySelectorAll('.gift-box').forEach(b => b.classList.add('disabled'));
    document.getElementById('giftSuccessMsg').innerText = points === 0? 'Better luck tomorrow! 💀' : `+${points} Points Added! 🎉`;
    document.getElementById('giftSuccessMsg').style.display = 'block';
    loadData();
    setTimeout(checkGiftStatus, 1000);
  }

  // CHECKIN - basic version
  window.openCheckin = function() { document.getElementById('checkinModal').style.display = 'flex'; }
  window.closeCheckin = function() { document.getElementById('checkinModal').style.display = 'none'; clearInterval(countdownInterval); }
  window.claimDaily = function() {
    if(userData.lastCheckin === getToday()) return;
    userData.balance = (userData.balance || 0) + DAILY_REWARD;
    userData.lastCheckin = getToday();
    localStorage.setItem('userData', JSON.stringify(userData));
    loadData();
    document.getElementById('successMsg').style.display = 'block';
  }
  window.openWallet = function() { alert('Wallet coming') }
  window.logout = function() { localStorage.removeItem('userData'); window.location.replace('./index.html'); }
</script>
</body>
</html>
