<!DOCTYPE html>
<html>
<head>
  <script src="https://quge5.com/88/tag.min.js" data-zone="286869" async data-cfasync="false"></script>
  <script src="https://al5sm.com/tag.min.js" data-zone="286677" async data-cfasync="false"></script>
  <title>Home - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="monetag" content="b671b8351bfc48ed0161f6bd0b6a5340">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; overflow-x: hidden; }
    .container { max-width: 500px; margin: 0 auto; }
    .header { text-align: center; margin: 40px 0 30px 0; }
    .header h2 { font-size: 34px; font-weight: bold; color: #fff; }
    .header h2 span { color: #fbbf24; font-weight: bold; text-transform: capitalize; }
    .balance-card { background: #2f3e1a; border: 2px solid #fbbf24; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px; }
    .balance-card .label { font-size: 14px; color: #ccc; }
    .balance-card .amount { font-size: 32px; font-weight: bold; color: #fbbf24; margin-top: 5px; }
    .balance-card .usd { font-size: 16px; color: #aaa; margin-top: 8px; }
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    .menu-btn { background: linear-gradient(180deg, #ffffff, #e8e8e8); color: #000; border: none; border-radius: 15px; padding: 20px 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; box-shadow: 0 6px 0 #bbbbbb, 0 8px 15px rgba(0,0,0,0.3); transition: all 0.1s ease; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .menu-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #bbbbbb; }
    .menu-btn .emoji { font-size: 35px; }
    .logout-btn { width: 35%; height: 60px; margin: 30px auto 0 auto; display: block; padding: 0; background: #f59e0b; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #d97706; }
    .logout-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #d97706; }
    .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
    .modal-content { background: #2f3e1a; border: 3px solid #fbbf24; border-radius: 20px; padding: 18px; width: 100%; max-width: 420px; color: white; max-height: 95vh; overflow-y: auto; position: relative; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-header h2 { font-size: 20px; color: #fbbf24; display: flex; align-items: center; gap: 8px; }
    .close-btn { font-size: 24px; color: white; cursor: pointer; font-weight: bold; }
    .popup-balance { background: #000; border: 2px solid #fbbf24; border-radius: 15px; padding: 15px; margin: 10px 0; text-align: center; }
    .input-box { width: 100%; padding: 14px; margin: 8px 0; background: #000; border: 2px solid #444; border-radius: 12px; color: white; font-size: 15px; outline: none; }
    .input-box:focus { border-color: #fbbf24; }
    .claim-btn { width: 100%; padding: 14px; background: #fbbf24; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .gift-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 15px; }
    .gift-box { background: #000; border: 2px solid #fbbf24; border-radius: 15px; padding: 20px 10px; text-align: center; font-size: 30px; cursor: pointer; }
    .gift-box:active { transform: scale(0.95); }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div class="container">
  <div class="header"><h2>Hello, <span id="uname">User</span> 👋</h2></div>
  
  <div class="balance-card">
    <div class="label">Your Balance</div>
    <div class="amount" id="bal">0 pts</div>
    <div class="usd" id="usd">$0.00 USD</div>
  </div>

  <div class="menu-grid">
    <button class="menu-btn" onclick="location.href='./watch.html'"><span class="emoji">▶️</span>Watch & Earn</button>
    <button class="menu-btn" onclick="openDaily()"><span class="emoji">📅</span>Daily Check-in</button>
    <button class="menu-btn" onclick="openGifts()"><span class="emoji">🎁</span>Gifts</button>
    <button class="menu-btn" onclick="openModal('profileModal')"><span class="emoji">👤</span>Profile</button>
  </div>

  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<!-- Daily Checkin Modal -->
<div id="dailyModal" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h2>📅 Daily Check-in</h2><span class="close-btn" onclick="closeModal('dailyModal')">&times;</span></div>
    <div class="popup-balance"><div class="label">Daily Reward</div><div class="amount">+20 pts</div></div>
    <p style="text-align:center; font-size:13px; color:#aaa; margin:10px 0;">Watch a short ad to claim your daily bonus!</p>
    <button class="claim-btn" id="dailyBtn" onclick="claimDaily()">Watch Ad & Claim 20 pts</button>
  </div>
</div>

<!-- Gifts Modal -->
<div id="giftsModal" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h2>🎁 Pick a Gift</h2><span class="close-btn" onclick="closeModal('giftsModal')">&times;</span></div>
    <p style="text-align:center; font-size:13px; color:#aaa;">Pick one box - ad will show - you win points!</p>
    <div class="gift-grid">
      <div class="gift-box" onclick="pickGift(this)">🎁</div>
      <div class="gift-box" onclick="pickGift(this)">🎁</div>
      <div class="gift-box" onclick="pickGift(this)">🎁</div>
      <div class="gift-box" onclick="pickGift(this)">🎁</div>
      <div class="gift-box" onclick="pickGift(this)">🎁</div>
      <div class="gift-box" onclick="pickGift(this)">🎁</div>
    </div>
  </div>
</div>

<!-- Profile Modal -->
<div id="profileModal" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h2>👤 Profile</h2><span class="close-btn" onclick="closeModal('profileModal')">&times;</span></div>
    <div class="popup-balance"><div class="label">Username</div><div class="amount" style="font-size:20px" id="puser">User</div></div>
    <input class="input-box" id="pemail" disabled>
  </div>
</div>

<script>
const firebaseConfig = {apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain: "reward-platform-rw-2e13d.firebaseapp.com",projectId: "reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let currentUser=null, bal=0;

auth.onAuthStateChanged(async (user)=>{
  if(!user){ location.href='./index.html'; return; }
  currentUser=user;
  const snap = await db.collection('users').doc(user.uid).get();
  if(snap.exists){
    const d=snap.data();
    bal = d.balance||0;
    document.getElementById('bal').textContent=bal+' pts';
    document.getElementById('usd').textContent='$'+(bal/1000).toFixed(2)+' USD';
    document.getElementById('uname').textContent=d.username||'User';
    document.getElementById('puser').textContent=d.username||'User';
    document.getElementById('pemail').value=d.email||user.email;
    localStorage.setItem('points', bal.toString());
  }
});

function openDaily(){ document.getElementById('dailyModal').style.display='flex'; }
function openGifts(){ document.getElementById('giftsModal').style.display='flex'; }
function openModal(id){ document.getElementById(id).style.display='flex'; }
function closeModal(id){ document.getElementById(id).style.display='none'; }
function logout(){ auth.signOut().then(()=>{ location.href='./index.html'; }); }

async function claimDaily(){
  if(!currentUser) return;
  const btn=document.getElementById('dailyBtn');
  btn.textContent='Opening Ad... Please wait 5s';
  btn.disabled=true;
  // Monetag ad will open automatically on click (OnClick)
  setTimeout(async ()=>{
    bal+=20;
    await db.collection('users').doc(currentUser.uid).set({balance:bal, points:bal, lastDaily: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
    document.getElementById('bal').textContent=bal+' pts';
    document.getElementById('usd').textContent='$'+(bal/1000).toFixed(2)+' USD';
    btn.textContent='✅ Claimed 20 pts!';
    setTimeout(()=>{ closeModal('dailyModal'); btn.textContent='Watch Ad & Claim 20 pts'; btn.disabled=false; }, 1500);
  }, 5000);
}

async function pickGift(el){
  if(!currentUser) return;
  el.textContent='⏳';
  // Monetag ad opens on click automatically - you earn!
  setTimeout(async ()=>{
    const win = Math.floor(Math.random()*50)+10; // 10-60 pts
    el.textContent='💰 '+win;
    bal+=win;
    await db.collection('users').doc(currentUser.uid).set({balance:bal, points:bal}, {merge:true});
    document.getElementById('bal').textContent=bal+' pts';
    document.getElementById('usd').textContent='$'+(bal/1000).toFixed(2)+' USD';
    setTimeout(()=>{ closeModal('giftsModal'); el.textContent='🎁'; }, 2000);
  }, 4000);
}
</script>
</body>
</html>
