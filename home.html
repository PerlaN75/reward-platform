<!DOCTYPE html>
<html>
<head>
  <title>Home - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; }
    .container { max-width: 500px; margin: 0 auto; }
    
    /* a. BIGGER ABEZA + b. MOVE ALL DOWN */
    .header { text-align: center; margin: 40px 0 30px 0; } /* was 15px 0 20px */
    .header h2 { font-size: 34px; font-weight: bold; color: #fff; } /* was 22px 500 */
    .header h2 span { color: #fbbf24; font-weight: bold; text-transform: capitalize; }
    
    .balance-card { background: #2f3e1a; border: 2px solid #fbbf24; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px; } /* was 25px */
    .balance-card .label { font-size: 14px; color: #ccc; }
    .balance-card .amount { font-size: 32px; font-weight: bold; color: #fbbf24; margin-top: 5px; }
    
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; } /* was 25px */

    .menu-btn { 
      background: linear-gradient(180deg, #ffffff, #e8e8e8); 
      color: #000; 
      border: none; 
      border-radius: 15px; 
      padding: 20px 10px; 
      font-size: 15px; 
      font-weight: bold; 
      cursor: pointer; 
      text-align: center; 
      box-shadow: 0 6px 0 #bbbbbb, 0 8px 15px rgba(0,0,0,0.3); 
      transition: all 0.1s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .menu-btn:active { 
      transform: translateY(6px); 
      box-shadow: 0 0 0 #bbbbbb, 0 2px 5px rgba(0,0,0,0.2); 
    }
    .menu-btn .emoji { 
      font-size: 32px;
      margin-right: 0;
      line-height: 1;
    }
    
    /* c. MOVE LOGOUT DOWN ONLY */
    .logout-btn { 
      width: 40%; 
      margin: 20px auto 0 auto; /* added top margin 20px */
      display: block; 
      padding: 14px; 
      background: #f59e0b; 
      color: #000; 
      border: none; 
      border-radius: 12px; 
      font-weight: bold; 
      font-size: 16px; 
      cursor: pointer; 
      box-shadow: 0 4px 0 #d97706;
      transition: all 0.1s ease;
    }
    .logout-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #d97706;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2><span id="headerText"></span></h2>
    </div>

    <div class="balance-card">
      <div class="label">Your Balance</div>
      <div class="amount" id="balance"></div>
    </div>

    <div class="menu-grid">
      <button class="menu-btn" onclick="window.location.href='./wallet.html'"><span class="emoji">💰</span>Wallet</button>
      <button class="menu-btn" onclick="window.location.href='./checkin.html'"><span class="emoji">📅</span>Daily Checkin</button>
      <button class="menu-btn" onclick="window.location.href='./quiz.html'"><span class="emoji">🧠</span>Quiz</button>
      <button class="menu-btn" onclick="window.location.href='./referrals.html'"><span class="emoji">🤝</span>Refer & Earn</button>
      <button class="menu-btn" onclick="alert('Coming Soon')"><span class="emoji">🎁</span>Gifts</button>
      <button class="menu-btn" onclick="alert('Coming Soon')"><span class="emoji">⚙️</span>More</button>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

<script>
  const cached = JSON.parse(localStorage.getItem('userData') || '{}');
  const instantName = cached.name || cached.username || "";
  const instantBalance = cached.balance !== undefined ? cached.balance + ' RWF' : '0 RWF';
  
  document.getElementById('headerText').innerText = instantName;
  document.getElementById('balance').innerText = instantBalance;
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d",
    storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
    messagingSenderId: "787550951987",
    appId: "1:787550951987:web:724b1463e821b99c90a146"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const docSnap = await getDoc(doc(db, "users", user.uid));
      if (docSnap.exists()) {
        const data = docSnap.data();
        localStorage.setItem('userData', JSON.stringify(data));
        document.getElementById('headerText').innerText = data.name || data.username || user.displayName;
        document.getElementById('balance').innerText = (data.balance || 0) + ' RWF';
      }
    } else {
      window.location.replace('./log.html');
    }
  });

  window.logout = async function() {
    await signOut(auth);
    localStorage.removeItem('userData');
    window.location.replace('./index.html');
  }
</script>
</body>
</html>
