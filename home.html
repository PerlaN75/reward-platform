<!DOCTYPE html>
<html>
<head>
  <title>Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; padding: 20px; color: white; text-align: center; }
    
    h1 { font-size: 26px; margin-top: 10px; }
    .tagline { color: #fbbf24; font-size: 13px; margin: 8px 0 20px 0; }
    
    .points-box { background: #1a2410; padding: 20px; border-radius: 15px; margin-bottom: 25px; }
    .points-box h3 { font-size: 14px; color: #ccc; margin-bottom: 8px; }
    .points-box h2 { font-size: 48px; color: #f59e0b; font-weight: bold; }
    
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .menu-btn { 
      background: white; padding: 20px 10px; border-radius: 15px; 
      text-align: center; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: 0.2s;
    }
    .menu-btn:active { transform: scale(0.95); }
    .menu-icon { font-size: 35px; margin-bottom: 8px; }
    .menu-text { font-size: 14px; font-weight: bold; color: #2f3e1a; }
    
    .logout-btn { width: 60%; padding: 12px; margin-top: 25px; background: #ef4444; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; }
  </style>
</head>
<body>
  <h1 id="welcomeText">Welcome back User</h1>
  <div class="tagline">🐒 From Nothing to Something 🍇</div>
  
  <div class="points-box">
    <h3>YOUR POINTS</h3>
    <h2 id="points">0</h2>
  </div>

  <div class="menu-grid">
    <div class="menu-btn" onclick="goTo('checkin.html')">
      <div class="menu-icon">📅</div>
      <div class="menu-text">Daily Checkin</div>
    </div>
    <div class="menu-btn" onclick="goTo('watch.html')">
      <div class="menu-icon">📺</div>
      <div class="menu-text">Watch & Earn</div>
    </div>
    <div class="menu-btn" onclick="goTo('quiz.html')">
      <div class="menu-icon">🧠</div>
      <div class="menu-text">Daily Quiz</div>
    </div>
    <div class="menu-btn" onclick="goTo('referral.html')">
      <div class="menu-icon">👥</div>
      <div class="menu-text">Refer & Earn</div>
    </div>
    <div class="menu-btn" onclick="goTo('wallet.html')">
      <div class="menu-icon">💰</div>
      <div class="menu-text">Wallet</div>
    </div>
    <div class="menu-btn" onclick="goTo('more.html')">
      <div class="menu-icon">⚙️</div>
      <div class="menu-text">More</div>
    </div>
  </div>

  <button class="logout-btn" onclick="logout()">Logout</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { 
    apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", 
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com", 
    projectId: "reward-platform-rw-2e13d"
  };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const docSnap = await getDoc(doc(db, "users", user.uid));
      if(docSnap.exists()) {
        const data = docSnap.data();
        document.getElementById('welcomeText').innerText = "Welcome back " + data.username;
        document.getElementById('points').innerText = data.balance; // using balance as points
      }
    } else {
      window.location.href = "log.html"; 
    }
  });

  window.goTo = function(page) {
    // For now just alert. Later we will make these pages
    if(page === 'referral.html') window.location.href = page;
    else alert(page.replace('.html','') + " page coming soon!");
  }

  window.logout = function() {
    signOut(auth).then(() => {
      window.location.href = "index.html";
    });
  }
</script>
</body>
</html>
