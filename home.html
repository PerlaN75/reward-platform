<script>
const WINDOW=30*60*1000, DAY=24*60*60*1000;
function getChain(){try{return JSON.parse(localStorage.getItem('chain_v2')||'{}')}catch(e){return {}}}
function saveChain(c){localStorage.setItem('chain_v2',JSON.stringify(c))}
function fmtShort(ms){if(ms<=0) return "0m"; const m=Math.floor(ms/60000); const s=Math.floor((ms%60000)/1000); if(m>=60){const h=Math.floor(m/60); const mm=m%60; return h+"h "+mm+"m";} if(m>0) return m+"m "+s+"s"; return s+"s";}
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
window.alert=showToast;
const btnWatch=document.getElementById('btnWatch'), btnQuiz=document.getElementById('btnQuiz'), btnArticles=document.getElementById('btnArticles');
function setBtnState(btn, state, countdownText){
  let old=btn.querySelector('.badge'); if(old) old.remove();
  btn.classList.remove('open');
  if(state==='locked'){
    const b=document.createElement('span'); b.className='badge padlock'; b.textContent='🔒'; btn.appendChild(b);
  } else if(state==='open'){
    btn.classList.add('open');
    const b=document.createElement('span'); b.className='badge green'; b.textContent='Open'; btn.appendChild(b);
  } else if(state==='live'){
    btn.classList.add('open');
    const b=document.createElement('span'); b.className='badge live'; b.textContent='Live '+countdownText; btn.appendChild(b);
  } else if(state==='soon'){
    const b=document.createElement('span'); b.className='badge padlock'; b.textContent='🔒 '+countdownText; btn.appendChild(b);
  }
}
function localDayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}

function evaluateChain(){
  const c=getChain(); const now=Date.now(); let changed=false;

  // 1. If Watch Live expired -> LOCK Watch, OPEN Quiz
  if(c.watch_open && now >= c.watch_expiry && !c.watch_nextAvail){
    c.watch_nextAvail = now + DAY;
    c.watch_finishedToday = localDayKey();
    if(!c.quiz_open || c.quiz_open < c.watch_open){
      c.quiz_open = now;
      c.quiz_expiry = now + WINDOW;
    }
    changed=true;
  }

  // 2. If Watch was finished by count (from watch.html), ensure Quiz is open
  if(c.watch_finishedToday && !c.quiz_open){
    c.quiz_open = now; c.quiz_expiry = now + WINDOW; changed=true;
  }

  // 3. If Quiz window expired -> OPEN Articles
  if(c.quiz_open && c.quiz_expiry && now > c.quiz_expiry && !c.quiz_doneToday && c.quiz_finishedToday!==localDayKey()){
    if(!c.articles_open || c.articles_open < c.quiz_expiry){
      c.articles_open = c.quiz_expiry; c.articles_expiry = c.articles_open + WINDOW;
      c.quiz_nextAvail = c.quiz_open + DAY; c.quiz_skippedToday = localDayKey(); changed=true;
    }
  }

  if(changed) saveChain(c);

  // RENDER WATCH
  if(c.watch_nextAvail && now < c.watch_nextAvail){
    setBtnState(btnWatch,'locked','');
  } else if(c.watch_open && now < c.watch_expiry && !c.watch_finishedToday){
    setBtnState(btnWatch,'live', fmtShort(c.watch_expiry-now));
  } else if(c.watch_finishedToday && c.watch_nextAvail && now < c.watch_nextAvail){
    setBtnState(btnWatch,'locked','');
  } else {
    // No lock, no live -> Open (first time)
    setBtnState(btnWatch,'open','');
  }

  // RENDER QUIZ
  if(!c.quiz_open){
    setBtnState(btnQuiz,'locked','');
  } else if(now < c.quiz_open){
    setBtnState(btnQuiz,'soon', fmtShort(c.quiz_open-now));
  } else if(now >= c.quiz_open && now <= c.quiz_expiry && !c.quiz_doneToday){
    setBtnState(btnQuiz,'live', fmtShort(c.quiz_expiry-now));
  } else {
    setBtnState(btnQuiz,'locked','');
  }

  // RENDER ARTICLES
  if(!c.articles_open){
    setBtnState(btnArticles,'locked','');
  } else if(now < c.articles_open){
    setBtnState(btnArticles,'soon', fmtShort(c.articles_open-now));
  } else if(now >= c.articles_open && now <= c.articles_expiry && !c.articles_doneToday){
    setBtnState(btnArticles,'live', fmtShort(c.articles_expiry-now));
  } else {
    setBtnState(btnArticles,'locked','');
  }
}

window.goWatch=()=>{
  const c=getChain(); const now=Date.now();
  if(c.watch_nextAvail && now < c.watch_nextAvail){showToast('Watch locked - Quiz is next'); return;}
  if(!c.watch_open || now > c.watch_expiry){
    c.watch_open = now; c.watch_expiry = now + WINDOW; saveChain(c);
  }
  location.href='./watch.html';
};
window.goQuiz=()=>{
  const c=getChain(); const now=Date.now();
  if(!c.quiz_open){showToast("Finish Watch first"); return;}
  if(now < c.quiz_open){showToast(`Quiz in ${fmtShort(c.quiz_open-now)}`); return;}
  if(now > c.quiz_expiry){showToast("Expired - Articles open"); return;}
  location.href='./quiz_earn.html';
};
window.goArticles=()=>{
  const c=getChain(); const now=Date.now();
  if(!c.articles_open){showToast("Finish previous tasks"); return;}
  if(now < c.articles_open){showToast(`Articles in ${fmtShort(c.articles_open-now)}`); return;}
  if(now > c.articles_expiry){showToast("Expired"); return;}
  location.href='./articles_earn.html';
};

setInterval(evaluateChain,1000); evaluateChain();
</script>
