<!DOCTYPE html>
<html>
<head>
  <title>Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; color: white; padding: 20px; }
   .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
   .welcome { font-size: 18px; }
   .welcome span { color: #fbbf24; font-weight: bold; }
   .balance-card { background: #4a6128; padding: 20px; border-radius: 15px; border: 2px solid #fbbf24; text-align: center; }
   .balance { font-size: 32px; color: #fbbf24; font-weight: bold; }
   .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
   .btn { background: #4a6128; padding: 20px; border-radius: 15px; text-align: center; border: 2px solid #fbbf24; cursor: pointer; font-weight: bold; }
   .btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="header">
    <div class="welcome">Hi, <span id="userName">User</span></div> <!-- INSTANT -->
    <button onclick="logout()" style="background:transparent; color:#fbbf24; border:1px solid #fbbf24; padding:8px 12px; border-radius:8px;">Logout</button>
  </div>

  <div class="balance-card">
    <div>Your Balance</div>
    <div class="balance" id="balance">0 RWF</div> <!-- INSTANT -->
  </div>

  <div class="menu">
    <div class="btn" onclick="window.location.href='./quiz.html'">Quiz</div>
    <div class="btn" onclick="window.location.href='./referrals.html'">Referrals</div>
    <div class="btn" onclick="window.location.href='./wallet.html'">Wallet</div>
    <div class="btn" onclick="window.location.href='./checkin.html'">Daily Checkin</div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d",
    storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
    messagingSenderId: "787550951987",
    appId: "1:787550951987:web:724b1463e821b99c90a146"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 1. SHOW CACHED DATA INSTANTLY - 0 SEC
  const cachedUser = JSON.parse(localStorage.getItem('userData') || '{}');
  document.getElementById('userName').innerText = cachedUser.name || 'User';
  document.getElementById('balance').innerText = (cachedUser.balance || 0) + " RWF";

  // 2. UPDATE IN BACKGROUND
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.replace("./log.html");
      return;
    }

    const docRef = doc(db, "users", user.uid);
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
      const data = docSnap.data();
      document.getElementById('userName').innerText = data.name || user.email.split('@')[0];
      document.getElementById('balance').innerText = (data.balance || 0) + " RWF";

      // SAVE TO CACHE FOR NEXT TIME
      localStorage.setItem('userData', JSON.stringify({name: data.name, balance: data.balance}));
    }
  });

  window.logout = () => {
    localStorage.removeItem('userData'); // clear cache on logout
    signOut(auth);
    window.location.replace("./index.html");
  }
</script>
</body>
</html>
