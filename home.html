<!DOCTYPE html>
<html>
<head>
  <title>Home - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; }
    .container { max-width: 500px; margin: 0 auto; }
    .header { text-align: center; margin: 15px 0 20px 0; }
    .header h2 { font-size: 22px; font-weight: 500; color: #fff; }
    .header h2 span { color: #fbbf24; font-weight: bold; text-transform: capitalize; }
    .balance-card { background: #2f3e1a; border: 2px solid #fbbf24; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 25px; }
    .balance-card .label { font-size: 14px; color: #ccc; }
    .balance-card .amount { font-size: 32px; font-weight: bold; color: #fbbf24; margin-top: 5px; }
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
    .menu-btn { background: linear-gradient(180deg, #ffffff, #e8e8e8); color: #000; border: none; border-radius: 15px; padding: 18px 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; box-shadow: 0 4px 0 #cccccc; }
    .menu-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #cccccc; }
    .menu-btn .emoji { font-size: 24px; display: block; margin-bottom: 6px; }
    .logout-btn { width: 40%; margin: 0 auto; display: block; padding: 14px; background: #f59e0b; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 3px 0 #d97706; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Hi, <span id="username"></span></h2>
    </div>
    <div class="balance-card">
      <div class="label">Your Balance</div>
      <div class="amount" id="balance">0 RWF</div>
    </div>
    <div class="menu-grid">
      <button class="menu-btn" onclick="window.location.href='./wallet.html'"><span class="emoji">💰</span> Wallet</button>
      <button class="menu-btn" onclick="window.location.href='./checkin.html'"><span class="emoji">📅</span> Daily Checkin</button>
      <button class="menu-btn" onclick="window.location.href='./quiz.html'"><span class="emoji">🧠</span> Quiz</button>
      <button class="menu-btn" onclick="window.location.href='./referrals.html'"><span class="emoji">🤝</span> Refer & Earn</button>
      <button class="menu-btn" onclick="alert('Coming Soon')"><span class="emoji">🎁</span> Gifts</button>
      <button class="menu-btn" onclick="alert('Coming Soon')"><span class="emoji">⚙️</span> More</button>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d",
    storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
    messagingSenderId: "787550951987",
    appId: "1:787550951987:web:724b1463e821b99c90a146"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function getUserName(data){ return data.name || data.username || data.fullName || ""; }

  // 1. INSTANT: READ FROM CACHE
  const cached = JSON.parse(localStorage.getItem('userData') || '{}');
  document.getElementById('username').innerText = getUserName(cached);
  if(cached.balance !== undefined) document.getElementById('balance').innerText = cached.balance + ' RWF';

  // 2. BACKGROUND: UPDATE CACHE
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const docSnap = await getDoc(doc(db, "users", user.uid));
      if (docSnap.exists()) {
        const data = docSnap.data();
        localStorage.setItem('userData', JSON.stringify(data));
        document.getElementById('username').innerText = getUserName(data);
        document.getElementById('balance').innerText = (data.balance || 0) + ' RWF';
      }
    } else {
      window.location.replace('./log.html');
    }
  });

  window.logout = async function() {
    await signOut(auth);
    localStorage.removeItem('userData');
    window.location.replace('./index.html');
  }
</script>
</body>
</html>
