<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Reward Platform</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  
  body {
    background: #3a3f2a; /* MILITARY GREEN */
    color: #fff;
    min-height: 100vh;
    padding: 20px;
    text-align: center;
  }

  .welcome {
    margin-top: 10px;
    margin-bottom: 20px;
  }

  .welcome h1 {
    font-size: 26px;
    margin-bottom: 5px;
  }

  .welcome p {
    color: #FFD700; /* gold */
    font-size: 14px;
    font-weight: bold;
  }

  .points-card {
    background: rgba(0,0,0,0.3);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 25px;
  }

  .points-card .label {
    font-size: 14px;
    color: #cbd5e1;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .points-card .points {
    font-size: 48px;
    color: #F59E0B; /* orange */
    font-weight: bold;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 25px;
  }

  .menu-card {
    background: #fff;
    color: #1e293b;
    border-radius: 15px;
    padding: 20px 10px;
    cursor: pointer;
    box-shadow: 0 4px 0 #d1d5db;
    transition: all 0.2s;
  }

  .menu-card:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #d1d5db;
  }

  .menu-card .icon {
    font-size: 32px;
    margin-bottom: 8px;
  }

  .menu-card .title {
    font-size: 14px;
    font-weight: bold;
  }

  .btn-logout {
    padding: 14px 50px;
    border-radius: 12px;
    border: none;
    background: #EF4444; /* red */
    color: #fff;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 0 #DC2626;
    transition: all 0.2s;
  }

  .btn-logout:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #DC2626;
  }
</style>
</head>
<body>
  
  <div class="welcome">
    <h1>Welcome <span id="userName"></span></h1>
    <p>🙊 From Nothing to Something 🍇</p>
  </div>

  <div class="points-card">
    <div class="label">YOUR POINTS</div>
    <div class="points" id="userPoints">0</div> <!-- REMOVED 70, NOW 0 -->
  </div>

  <div class="grid">
    <div class="menu-card" onclick="alert('Daily Checkin')">
      <div class="icon">📅</div>
      <div class="title">Daily Checkin</div>
    </div>

    <div class="menu-card" onclick="alert('Watch & Earn')">
      <div class="icon">📺</div>
      <div class="title">Watch & Earn</div>
    </div>

    <div class="menu-card" onclick="alert('Daily Quiz')">
      <div class="icon">🧠</div>
      <div class="title">Daily Quiz</div>
    </div>

    <div class="menu-card" onclick="alert('Refer & Earn')">
      <div class="icon">👥</div>
      <div class="title">Refer & Earn</div>
    </div>

    <div class="menu-card" onclick="alert('Wallet')">
      <div class="icon">💰</div>
      <div class="title">Wallet</div>
    </div>

    <div class="menu-card" onclick="alert('More')">
      <div class="icon">⚙️</div>
      <div class="title">More</div>
    </div>
  </div>

  <button class="btn-logout" onclick="localStorage.clear(); window.location.href='index.html'">Logout</button>

<script>
  // LOAD USERNAME FROM LOGIN/REGISTER
  document.getElementById('userName').innerText = localStorage.getItem("username") || "";

  // LOAD POINTS - FOR NOW 0. LATER FETCH FROM DATABASE
  // Example: document.getElementById('userPoints').innerText = userPointsFromDB;
  document.getElementById('userPoints').innerText = localStorage.getItem("points") || "0";
</script>

</body>
</html>
