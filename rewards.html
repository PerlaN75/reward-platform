<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rewards - Reward Platform</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

nav {
    background: #182848;
    padding: 14px 10px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 8px;
    font-weight: bold;
}

header {
    background: #182848;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin: 15px 0;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.balance {
    text-align: center;
}

.points-number {
    font-size: 42px;
    font-weight: bold;
    margin: 10px 0;
}

.reward {
    border-top: 1px solid #eee;
    padding-top: 15px;
    margin-top: 15px;
}

.reward h3 {
    margin-bottom: 5px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #182848;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.message {
    text-align: center;
    font-weight: bold;
    margin-top: 12px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #666;
    font-size: 14px;
}
</style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="earn.html">Earn Points</a>
    <a href="watch.html">Watch & Earn</a>
    <a href="spin.html">Daily Spin</a>
    <a href="balance.html">My Balance</a>
    <a href="rewards.html">Rewards</a>
</nav>

<header>
    <h1>Rewards</h1>
    <p>Use your points to unlock rewards.</p>
</header>

<div class="container">

    <div class="card balance">

        <h2>💰 Your Balance</h2>

        <div class="points-number" id="points">
            0
        </div>

        <p>points</p>

    </div>


    <div class="card">

        <h2>🎁 Available Rewards</h2>

        <div class="reward">

            <h3>🎟️ Reward Voucher</h3>

            <p>
                Prototype reward — 50 points
            </p>

            <button onclick="redeemReward(50, 'Reward Voucher')">
                Redeem for 50 Points
            </button>

        </div>


        <div class="reward">

            <h3>⭐ Premium Reward</h3>

            <p>
                Prototype reward — 100 points
            </p>

            <button onclick="redeemReward(100, 'Premium Reward')">
                Redeem for 100 Points
            </button>

        </div>

        <div id="message" class="message"></div>

    </div>

</div>

<footer>
    Reward Platform — Prototype
</footer>


<script>

let points =
    Number(localStorage.getItem("rewardPoints")) || 0;

let history =
    JSON.parse(localStorage.getItem("rewardHistory")) || [];


function updateDisplay() {

    points =
        Number(localStorage.getItem("rewardPoints")) || 0;

    document.getElementById("points").textContent =
        points;
}


function redeemReward(cost, rewardName) {

    const message =
        document.getElementById("message");

    if (points < cost) {

        message.textContent =
            "❌ You do not have enough points.";

        return;
    }

    points -= cost;

    history.push({
        activity: "Redeemed: " + rewardName,
        points: -cost,
        date: new Date().toLocaleString()
    });

    localStorage.setItem(
        "rewardPoints",
        points
    );

    localStorage.setItem(
        "rewardHistory",
        JSON.stringify(history)
    );

    updateDisplay();

    message.textContent =
        "🎉 Reward redeemed successfully!";
}


updateDisplay();

</script>

</body>
</html>
