<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surveys - Reward Platform RW</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
.card-active { border: 2.5px solid #f59e0b !important; box-shadow: 0 4px 15px rgba(245,158,11,0.25); }
</style>
</head>
<body class="bg-gray-100">
<div class="bg-blue-600 p-3 flex items-center justify-between sticky top-0 z-20">
  <a href="home.html" class="w-9 h-9 bg-blue-700 rounded-full flex items-center justify-center text-white"><i class="fa fa-arrow-left"></i></a>
  <div class="bg-white rounded-full px-4 py-1.5 text-sm font-bold">📋 Surveys</div>
  <i class="fa fa-bell text-white"></i>
</div>

<div class="p-3 max-w-2xl mx-auto">
  <!-- 2 CARDS - SAME SIZE AS PLAY.HTML -->
  <div class="grid grid-cols-2 gap-3">
    <button onclick="switchTab('bitlabs')" id="card-bitlabs" class="card-active bg-white rounded-2xl p-4 shadow border-2 border-transparent flex flex-col items-center justify-center h-[90px]">
      <div class="flex items-center gap-1.5 font-black text-[19px]"><span class="bg-blue-600 text-white p-1 rounded"><i class="fa fa-flask text-sm"></i></span> BitLabs</div>
      <div class="text-[13px] text-gray-700 mt-1">Bitlabs</div>
    </button>
    <button onclick="switchTab('adscend')" id="card-adscend" class="bg-white rounded-2xl p-4 shadow border-2 border-transparent flex flex-col items-center justify-center h-[90px]">
      <div class="font-black text-[18px] text-gray-800">Adscend<span class="text-purple-600">Media</span></div>
      <div class="text-[13px] text-gray-700 mt-1">Adscend</div>
    </button>
  </div>

  <!-- CONTENT BELOW -->
  <div class="mt-4 bg-white rounded-xl shadow overflow-hidden">
    <div class="bg-blue-600 p-3 flex items-center justify-between text-white font-bold tracking-wide" id="contentHeader">BITLABS</div>
    
    <!-- BITLABS -->
    <div id="content-bitlabs" class="p-4">
      <div class="border border-gray-100 rounded-xl p-8 text-center min-h-[360px] flex flex-col items-center justify-center bg-gradient-to-b from-white to-gray-50">
        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mb-4 animate-pulse">
          <i class="fa fa-flask text-2xl text-blue-600"></i>
        </div>
        <h3 class="font-bold text-gray-800 text-[16px]">BitLabs Surveys Ready</h3>
        <p class="text-gray-500 text-sm mt-2 leading-5">High paying surveys $0.20 - $2 for Rwanda.<br>Your personal surveys are being matched.</p>
        <div class="mt-5 bg-gray-900 text-white rounded-full px-5 py-2 text-xs"><i class="fa fa-spinner fa-spin mr-2"></i> Matching surveys...</div>
        <div id="bitlabs-iframe-holder" class="hidden w-full mt-4"></div>
      </div>
    </div>

    <!-- ADSCEND -->
    <div id="content-adscend" class="p-4 hidden">
      <div class="border border-gray-100 rounded-xl p-8 text-center min-h-[360px] flex flex-col items-center justify-center bg-gradient-to-b from-white to-gray-50">
        <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mb-4 animate-pulse">
          <i class="fa fa-diamond text-2xl text-purple-600"></i>
        </div>
        <h3 class="font-bold text-gray-800 text-[16px]">Adscend Offers Loading</h3>
        <p class="text-gray-500 text-sm mt-2 leading-5">Best surveys + offers for East Africa.<br>We are activating your account.</p>
        <div class="mt-5 bg-gray-900 text-white rounded-full px-5 py-2 text-xs"><i class="fa fa-spinner fa-spin mr-2"></i> Loading offers...</div>
        <div id="adscend-iframe-holder" class="hidden w-full mt-4"></div>
      </div>
    </div>
  </div>

  <div class="text-center text-xs text-gray-400 mt-3" id="userEmail">loading...</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
  authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
  projectId: "reward-platform-rw-2e13d"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

firebase.auth().onAuthStateChanged(user => {
  if (user) {
    document.getElementById('userEmail').innerText = user.email;
    const uid = encodeURIComponent(user.uid);
    // When approved, paste real links:
    // document.getElementById('bitlabs-iframe-holder').innerHTML = `<iframe src="https://web.bitlabs.io?uid=${uid}" class="w-full h-[600px] border-0 rounded-xl"></iframe>`;
  } else {
    window.location.href = 'index.html';
  }
});

function switchTab(tab) {
  ['bitlabs','adscend'].forEach(t=>{
    document.getElementById('content-'+t).classList.add('hidden');
    document.getElementById('card-'+t).classList.remove('card-active');
  });
  document.getElementById('content-'+tab).classList.remove('hidden');
  document.getElementById('card-'+tab).classList.add('card-active');
  document.getElementById('contentHeader').innerText = tab.toUpperCase();
}
</script>
</body>
</html>
