<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surveys</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:12px 10px 80px 10px;box-sizing:border-box;min-height:100vh}
.card{background:radial-gradient(circle at top,#1a4d1a,#051405);border:2px solid #FFD700;border-radius:22px;padding:16px 14px 18px 14px;width:100%;max-width:360px;text-align:center;box-shadow:0 0 20px rgba(255,215,0,0.3);margin:10px auto 30px;height:auto}
h2{margin:8px 0 6px 0;color:#FFD700;font-size:20px}
.badge{border:1.5px solid #FFD700;border-radius:20px;padding:5px 12px;display:inline-block;margin:8px 0;color:#FFD700;font-weight:bold;font-size:13px}
.bar{height:7px;background:#333;border-radius:10px;margin:10px 0;overflow:hidden}
.fill{height:100%;background:#FFD700;width:0%;transition:0.3s}
.back{background:#fff;color:#000;padding:10px 24px;border-radius:20px;display:inline-block;margin-top:14px;text-decoration:none;font-weight:bold;font-size:14px}
#bitlabs{min-height:420px;background:#0a1a0a;border:1.5px solid #FFD700;border-radius:14px;margin-top:12px;overflow:hidden}
.note{color:#FFD700;font-size:11px;margin-top:12px;line-height:1.4}
#countText{font-size:12px;color:#8f8;margin:4px 0}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div class="card">
<h2>📝 Survey</h2>
<div class="badge" id="ptsBadge">Balance: 0 pts</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="countText">Today: 0 surveys</div>
<div id="bitlabs"></div>
<a class="back" href="home.html">Back Home</a>
<div class="note">You get 50 pts / survey - No daily limit (Do all as available to gain more)<br>Paid by BitLabs</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
const BITLABS_APP_ID="8e2f651a-76eb-4c65-9151-ebf8d2394fdf";
function getToday(){return new Date().toISOString().split('T')[0];}
let userData={}, todayCount=0;
function updateUI(){
 let pts=userData.balance||0;
 document.getElementById("ptsBadge").innerText=`Balance: ${pts} pts = $${(pts*0.0005).toFixed(2)} USDT`;
 document.getElementById("countText").innerText=`Today: ${todayCount} surveys`;
 document.getElementById("fill").style.width=Math.min((pts%1000)/10,100)+"%";
}
auth.onAuthStateChanged(async u=>{
 if(!u){location.href='./index.html';return;}
 const doc=await db.collection('users').doc(u.uid).get();
 if(doc.exists){userData=doc.data(); todayCount=(userData.last_survey_date===getToday())?(userData.surveys_today||0):0;}
 updateUI();
 // DIRECT OFFERWALL IFRAME - most reliable
 document.getElementById("bitlabs").innerHTML=`<iframe src="https://web.bitlabs.ai?uid=${u.uid}&token=${BITLABS_APP_ID}" style="width:100%;height:650px;border:none;background:#0a1a0a" allow="fullscreen"></iframe>`;
 // Also load SDK for points credit
 const s=document.createElement('script'); s.src="https://sdk.bitlabs.ai/bitlabs.js";
 s.onload=()=>{BitLabs.setAppId(BITLABS_APP_ID); BitLabs.setUserId(u.uid); BitLabs.setOnSurveyCompleted(async()=>{let nb=(userData.balance||0)+50; await db.collection('users').doc(u.uid).update({balance:nb,surveys_today:firebase.firestore.FieldValue.increment(1)}); userData.balance=nb; todayCount++; updateUI(); alert("+50 pts added!");});};
 document.head.appendChild(s);
});
</script>
</body>
</html>
