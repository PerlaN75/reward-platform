<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surveys - Reward Platform RW</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
.back-btn-checkin{width:42px;height:38px;border-radius:10px;background:linear-gradient(180deg,#fef2f2,#ffe4e6);border:2px solid #ef4444;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#991b1b;font-weight:900;font-size:22px;cursor:pointer;box-shadow:0 2px 0 #fca5a5;flex-shrink:0}
.back-btn-checkin:active{transform:scale(0.92)}
</style>
</head>
<body class="bg-white">
<div class="bg-blue-600 p-3 flex items-center justify-between sticky top-0 z-20">
  <a href="home.html" class="back-btn-checkin">‹</a>
  <div class="bg-white rounded-full px-4 py-1.5 text-sm font-bold">📋 CPX Surveys</div>
  <i class="fa fa-bell text-white"></i>
</div>

<div class="p-3 max-w-2xl mx-auto">

  <div class="mt-2 bg-white rounded-xl shadow overflow-hidden border border-gray-100">
    <div class="bg-blue-600 p-3 flex items-center justify-between text-white font-bold tracking-wide">
      <span><i class="fa fa-circle-notch text-green-300 mr-2"></i>CPX RESEARCH LIVE</span>
      <span class="bg-white text-blue-600 text-[10px] px-2 py-1 rounded-full">App 37033</span>
    </div>
    
    <div class="p-2">
      <div class="border border-gray-100 rounded-xl p-2 bg-white min-h-[600px]">
        <div id="cpx-loading" class="p-8 text-center">
          <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-4 mx-auto animate-pulse"><i class="fa fa-circle-notch text-2xl text-green-600"></i></div>
          <h3 class="font-bold">CPX Research Live</h3>
          <p class="text-gray-500 text-sm mt-2">Active - Surveys for Rwanda<br>Loading your personal surveys...</p>
        </div>
        <div id="cpx-iframe-holder" class="w-full hidden"></div>
      </div>
    </div>

  </div>
  <div class="text-center text-xs text-gray-400 mt-3" id="userEmail">loading...</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
  authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
  projectId: "reward-platform-rw-2e13d"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

firebase.auth().onAuthStateChanged(user => {
  if (user) {
    document.getElementById('userEmail').innerText = user.email;
    const uid = encodeURIComponent(user.uid);
    const cpxUrl = `https://offers.cpx-research.com/index.php?app_id=37033&ext_user_id=${uid}&subid_1=&subid_2=`;
    document.getElementById('cpx-iframe-holder').innerHTML = `<iframe src="${cpxUrl}" class="w-full h-[700px] border-0 rounded-xl" allow="fullscreen"></iframe>`;
    document.getElementById('cpx-iframe-holder').classList.remove('hidden');
    document.getElementById('cpx-loading').classList.add('hidden');
  } else {
    window.location.href = 'index.html';
  }
});
</script>
</body>
</html>
