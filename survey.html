<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surveys - Reward Platform RW</title>
<style>
body{margin:0;font-family:Arial;background:#0a0a0a;color:#FFD700}
header{background:#000;padding:15px;display:flex;justify-content:space-between;border-bottom:2px solid #FFD700}
.balance{background:#FFD700;color:#000;padding:8px 15px;border-radius:20px;font-weight:bold}
.container{padding:15px;max-width:900px;margin:auto}
.card{background:#1a1a1a;border:1px solid #FFD700;border-radius:12px;padding:15px;margin-bottom:15px}
iframe{width:100%;height:75vh;border:none;border-radius:12px;background:#fff}
.btn{background:#FFD700;color:#000;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;width:100%}
.small{font-size:12px;color:#aaa}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<header>
<div><b>Reward Platform RW</b><br><span class="small">CPX Surveys</span></div>
<div class="balance" id="bal">0 Pts</div>
</header>
<div class="container">
<div class="card">
<h3>💰 Premium Surveys</h3>
<p class="small">Complete surveys → Points auto-credited via postback. 2000 Pts = $1</p>
<div id="userInfo" class="small">Loading...</div>
</div>
<div class="card" style="padding:0;overflow:hidden">
<iframe id="cpxFrame"></iframe>
</div>
<div class="card">
<button class="btn" onclick="location.reload()">🔄 Refresh Balance</button>
<p class="small" style="text-align:center">UserID: <span id="uidSpan"></span><br>Postback: perlan75.github.io/cpx-postback.html</p>
</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.firestore();
const APP_ID="37033";
auth.onAuthStateChanged(user=>{
 if(!user){document.getElementById('userInfo').innerHTML='Login first at <a href="login.html" style="color:#FFD700">login.html</a>';return;}
 const uid=user.uid;
 document.getElementById('uidSpan').innerText=uid;
 document.getElementById('userInfo').innerText='Logged: '+(user.email||uid);
 db.collection('users').doc(uid).onSnapshot(doc=>{
   const d=doc.data(); document.getElementById('bal').innerText=(d&&d.balance?d.balance:0)+' Pts';
 });
 document.getElementById('cpxFrame').src=`https://offers.cpx-research.com/index.php?app_id=${APP_ID}&ext_user_id=${uid}&subid_1=rwanda&subid_2=web`;
});
</script>
</body>
</html>
