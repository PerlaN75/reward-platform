<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:8px 10px 10px 10px;box-sizing:border-box}
.card{background:radial-gradient(circle at top,#1a4d1a,#051405);border:2px solid #FFD700;border-radius:22px;padding:12px 12px 10px 12px;width:100%;max-width:340px;text-align:center;box-shadow:0 0 20px rgba(255,215,0,0.3);margin:6px auto}
h2{margin:4px 0 4px 0;color:#FFD700;font-size:20px}
.badge{border:1.5px solid #FFD700;border-radius:20px;padding:4px 12px;display:inline-block;margin:4px 0;color:#FFD700;font-weight:bold;font-size:12px}
.bar{height:6px;background:#333;border-radius:10px;margin:6px 0;overflow:hidden}
.fill{height:100%;background:#FFD700;width:0%}
#countText{font-size:11px;color:#8f8;margin:2px 0}
#bitlabs{height:260px;background:#0a1a0a;border:1.5px solid #FFD700;border-radius:12px;margin:8px 0;overflow:hidden}
#bitlabs iframe{width:100%;height:260px;border:none;display:block}
.back{background:#fff;color:#000;padding:8px 22px;border-radius:20px;display:inline-block;margin-top:10px;text-decoration:none;font-weight:bold;font-size:13px}
.note{color:#FFD700;font-size:10px;margin-top:6px;line-height:1.2}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div class="card">
<h2>📝 Survey</h2>
<div class="badge" id="ptsBadge">Balance: 0 pts</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="countText">Today: 0 surveys</div>
<div id="bitlabs"></div>
<a class="back" href="home.html">Back Home</a>
<div class="note">You get 50 pts / survey - No daily limit (Do all as available to gain more)<br>Paid by BitLabs</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
const APP="8e2f651a-76eb-4c65-9151-ebf8d2394fdf";
let userData={};
function upd(){let p=userData.balance||0; document.getElementById("ptsBadge").innerText=`Balance: ${p} pts = $${(p*0.0005).toFixed(2)} USDT`; document.getElementById("countText").innerText=`Today: ${userData.surveys_today||0} surveys`; document.getElementById("fill").style.width=Math.min(p/10,100)+"%";}
auth.onAuthStateChanged(async u=>{
 if(!u){location.href='./index.html';return;}
 const d=await db.collection('users').doc(u.uid).get(); if(d.exists) userData=d.data(); upd();
 document.getElementById("bitlabs").innerHTML=`<iframe src="https://web.bitlabs.ai?uid=${u.uid}&token=${APP}"></iframe>`;
});
</script>
</body>
</html>
