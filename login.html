<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Login - Reward Platform</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {

    box-sizing: border-box;

}


body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #182848,
            #3d2075
        );

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card {

    width: 100%;

    max-width: 500px;

    background: white;

    border-radius: 22px;

    padding: 30px 22px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,0.25);

}


.login-icon {

    text-align: center;

    font-size: 55px;

}


h1 {

    margin: 10px 0 5px;

    text-align: center;

    font-size: 32px;

    color: #182848;

}


.subtitle {

    text-align: center;

    color: #777;

    margin-bottom: 25px;

}


/* =====================================================
   FORM
===================================================== */

.form-group {

    margin-bottom: 18px;

}


label {

    display: block;

    margin-bottom: 7px;

    color: #333;

    font-weight: bold;

    font-size: 15px;

}


input {

    width: 100%;

    padding: 14px;

    border:
        1px solid #d8dce5;

    border-radius: 11px;

    font-size: 16px;

    outline: none;

}


input:focus {

    border-color: #7b2cff;

    box-shadow:
        0 0 0 2px
        rgba(123,44,255,0.10);

}


/* =====================================================
   MESSAGE
===================================================== */

.message {

    min-height: 22px;

    margin: 12px 0;

    text-align: center;

    font-size: 14px;

    font-weight: bold;

}


.message.error {

    color: #c62828;

}


.message.success {

    color: #168a3a;

}


/* =====================================================
   ATTEMPTS
===================================================== */

.attempts-message {

    min-height: 20px;

    margin-top: 5px;

    text-align: center;

    color: #777;

    font-size: 13px;

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-button {

    width: 100%;

    border: none;

    border-radius: 13px;

    padding: 15px;

    background:
        linear-gradient(
            90deg,
            #8b25ff,
            #287dff
        );

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}


.login-button:hover {

    transform:
        translateY(-1px);

}


.login-button:disabled {

    opacity: 0.6;

    cursor: not-allowed;

    transform: none;

}


/* =====================================================
   LINKS
===================================================== */

.links-area {

    text-align: center;

    margin-top: 20px;

}


.links-area a {

    color: #7b2cff;

    font-weight: bold;

    text-decoration: none;

}


.links-area a:hover {

    text-decoration: underline;

}


.register-link {

    margin-top: 12px;

    color: #666;

    font-size: 14px;

}


/* =====================================================
   RESET PASSWORD BOX
===================================================== */

.reset-box {

    display: none;

    margin-top: 22px;

    padding: 18px;

    background: #f7f8fc;

    border-radius: 14px;

}


.reset-box h3 {

    margin:
        0 0 15px;

    color: #182848;

    text-align: center;

}


.reset-box input {

    margin-bottom: 10px;

}


.reset-button {

    width: 100%;

    border: none;

    border-radius: 10px;

    padding: 12px;

    background: #182848;

    color: white;

    font-weight: bold;

    cursor: pointer;

}


.reset-cancel {

    width: 100%;

    border: none;

    background: transparent;

    color: #777;

    margin-top: 10px;

    cursor: pointer;

    padding: 8px;

}


/* =====================================================
   PASSWORD RULES
===================================================== */

.password-rules {

    background: white;

    border-radius: 10px;

    padding: 10px;

    margin-top: 8px;

    color: #666;

    font-size: 12px;

    line-height: 1.5;

}


.rule {

    margin: 2px 0;

}


.rule.valid {

    color: #168a3a;

}


.rule.invalid {

    color: #c62828;

}


/* =====================================================
   HOME
===================================================== */

.home-button {

    display: block;

    text-align: center;

    margin-top: 15px;

    color: #555;

    text-decoration: none;

    font-size: 14px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    .login-card {

        padding: 25px 17px;

    }


    h1 {

        font-size: 28px;

    }

}

</style>

</head>


<body>


<div class="login-card">


    <div class="login-icon">

        🔐

    </div>


    <h1>

        Welcome Back

    </h1>


    <div class="subtitle">

        Login to your Reward Platform account

    </div>


    <!-- =================================================
         LOGIN FORM
    ================================================== -->

    <form
        id="loginForm"
        onsubmit="loginUser(event)">


        <div class="form-group">

            <label for="loginIdentifier">

                Username or Email

            </label>


            <input
                type="text"
                id="loginIdentifier"
                autocomplete="username"
                placeholder="Enter username or email"
                required>

        </div>


        <div class="form-group">

            <label for="loginPassword">

                Password

            </label>


            <input
                type="password"
                id="loginPassword"
                autocomplete="current-password"
                placeholder="Enter your password"
                required>

        </div>


        <div
            id="message"
            class="message">

        </div>


        <div
            id="attemptsMessage"
            class="attempts-message">

        </div>


        <button
            type="submit"
            id="loginButton"
            class="login-button">

            🔐 Login

        </button>


    </form>


    <!-- =================================================
         LINKS
    ================================================== -->

    <div class="links-area">

        <a
            href="#"
            onclick="showResetBox(); return false;">

            Forgot Password?

        </a>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">

                Register

            </a>

        </div>

    </div>


    <!-- =================================================
         PASSWORD RESET
    ================================================== -->

    <div
        id="resetBox"
        class="reset-box">


        <h3>

            🔄 Reset Password

        </h3>


        <input
            type="email"
            id="resetEmail"
            placeholder="Registered email">


        <input
            type="password"
            id="newPassword"
            maxlength="15"
            placeholder="New password">


        <div class="password-rules">

            <div
                id="resetLengthRule"
                class="rule invalid">

                ✗ 6–15 characters

            </div>


            <div
                id="resetCapitalRule"
                class="rule invalid">

                ✗ At least one capital letter

            </div>


            <div
                id="resetLowerRule"
                class="rule invalid">

                ✗ At least one lowercase letter

            </div>


            <div
                id="resetSpecialRule"
                class="rule invalid">

                ✗ At least one special character
                (? ! % & $ # =)

            </div>

        </div>


        <input
            type="password"
            id="confirmNewPassword"
            maxlength="15"
            placeholder="Confirm new password">


        <button
            type="button"
            class="reset-button"
            onclick="resetPassword()">

            Reset Password

        </button>


        <button
            type="button"
            class="reset-cancel"
            onclick="hideResetBox()">

            Cancel

        </button>


    </div>


    <a
        href="index.html"
        class="home-button">

        ← Home

    </a>


</div>


<script>

/* =====================================================
   CONSTANTS
===================================================== */

const MAX_ATTEMPTS = 3;

const BLOCK_TIME =
    30 * 60 * 1000;


/* =====================================================
   GET ALL USERS
===================================================== */

function getAllUsers() {

    let users = [];


    try {

        const stored =
            localStorage.getItem(
                "rewardUsers"
            );


        if (stored) {

            const parsed =
                JSON.parse(stored);


            if (
                Array.isArray(parsed)
            ) {

                users =
                    parsed;

            }

        }

    }

    catch (error) {

        users = [];

    }


    /*
       Compatibility with older
       single-user storage.
    */

    if (
        users.length === 0
    ) {

        try {

            const oldUser =
                localStorage.getItem(
                    "rewardUser"
                );


            if (oldUser) {

                const parsedOldUser =
                    JSON.parse(
                        oldUser
                    );


                if (
                    parsedOldUser &&
                    typeof parsedOldUser ===
                    "object"
                ) {

                    if (
                        !parsedOldUser.id
                    ) {

                        parsedOldUser.id =
                            createUserId();

                    }


                    users.push(
                        parsedOldUser
                    );


                    saveAllUsers(
                        users
                    );

                }

            }

        }

        catch (error) {

            users = [];

        }

    }


    return users;

}


/* =====================================================
   SAVE USERS
===================================================== */

function saveAllUsers(users) {

    localStorage.setItem(
        "rewardUsers",
        JSON.stringify(
            users
        )
    );

}


/* =====================================================
   CREATE USER ID
===================================================== */

function createUserId() {

    return (
        "user_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 10)
    );

}


/* =====================================================
   FIND USER
===================================================== */

function findUser(identifier) {

    const users =
        getAllUsers();


    const search =
        identifier
            .trim()
            .toLowerCase();


    return users.find(
        function(user) {

            const username =
                String(
                    user.username || ""
                )
                .trim()
                .toLowerCase();


            const email =
                String(
                    user.email || ""
                )
                .trim()
                .toLowerCase();


            return (
                username === search ||
                email === search
            );

        }
    ) || null;

}


/* =====================================================
   GET USER KEY
===================================================== */

function getUserKey(user) {

    if (!user) {

        return "unknown";

    }


    return (
        user.id ||
        user.userId ||
        user.username ||
        user.email ||
        "unknown"
    );

}


/* =====================================================
   GET ATTEMPT KEY
===================================================== */

function getAttemptKey(user) {

    return (
        "loginAttempts_" +
        getUserKey(user)
    );

}


/* =====================================================
   GET BLOCK KEY
===================================================== */

function getBlockKey(user) {

    return (
        "loginBlockedUntil_" +
        getUserKey(user)
    );

}


/* =====================================================
   GET ATTEMPTS
===================================================== */

function getAttempts(user) {

    return Number(
        localStorage.getItem(
            getAttemptKey(user)
        )
    ) || 0;

}


/* =====================================================
   SET ATTEMPTS
===================================================== */

function setAttempts(
    user,
    attempts
) {

    localStorage.setItem(
        getAttemptKey(user),
        String(attempts)
    );


    /*
       Maintain old keys for
       compatibility with the
       existing prototype user.
    */

    if (
        isCurrentPrototypeUser(user)
    ) {

        localStorage.setItem(
            "loginAttempts",
            String(attempts)
        );

    }

}


/* =====================================================
   GET BLOCK TIME
===================================================== */

function getBlockedUntil(user) {

    return Number(
        localStorage.getItem(
            getBlockKey(user)
        )
    ) || 0;

}


/* =====================================================
   SET BLOCK TIME
===================================================== */

function setBlockedUntil(
    user,
    timestamp
) {

    localStorage.setItem(
        getBlockKey(user),
        String(timestamp)
    );


    if (
        isCurrentPrototypeUser(user)
    ) {

        localStorage.setItem(
            "loginBlockedUntil",
            String(timestamp)
        );

    }

}


/* =====================================================
   CLEAR LOGIN SECURITY
===================================================== */

function clearLoginSecurity(user) {

    localStorage.removeItem(
        getAttemptKey(user)
    );


    localStorage.removeItem(
        getBlockKey(user)
    );


    if (
        isCurrentPrototypeUser(user)
    ) {

        localStorage.removeItem(
            "loginAttempts"
        );

        localStorage.removeItem(
            "loginBlockedUntil"
        );

    }

}


/* =====================================================
   CURRENT PROTOTYPE USER
===================================================== */

function getCurrentPrototypeUser() {

    try {

        const stored =
            localStorage.getItem(
                "rewardUser"
            );


        if (stored) {

            return JSON.parse(
                stored
            );

        }

    }

    catch (error) {

        return null;

    }


    return null;

}


/* =====================================================
   IS CURRENT USER
===================================================== */

function isCurrentPrototypeUser(user) {

    const current =
        getCurrentPrototypeUser();


    if (
        !current ||
        !user
    ) {

        return false;

    }


    return (
        String(
            getUserKey(current)
        )
        ===
        String(
            getUserKey(user)
        )
    );

}


/* =====================================================
   SET ACTIVE USER
===================================================== */

function setActiveUser(user) {

    /*
       Store the complete active user
       in the compatibility key used
       throughout the current platform.
    */

    localStorage.setItem(
        "rewardUser",
        JSON.stringify(
            user
        )
    );


    /*
       Store the active user ID separately.
    */

    localStorage.setItem(
        "activeUserId",
        String(
            getUserKey(user)
        )
    );


    /*
       Load this user's individual
       points into the current
       prototype balance.
    */

    const userKey =
        getUserKey(user);


    const individualPoints =
        localStorage.getItem(
            "rewardPoints_" +
            userKey
        );


    if (
        individualPoints !== null
    ) {

        localStorage.setItem(
            "rewardPoints",
            individualPoints
        );

    }

    else {

        localStorage.setItem(
            "rewardPoints",
            "0"
        );

        localStorage.setItem(
            "rewardPoints_" +
            userKey,
            "0"
        );

    }


    /*
       Load this user's history.
    */

    const individualHistory =
        localStorage.getItem(
            "rewardHistory_" +
            userKey
        );


    if (
        individualHistory !== null
    ) {

        localStorage.setItem(
            "rewardHistory",
            individualHistory
        );

    }

    else {

        localStorage.setItem(
            "rewardHistory",
            JSON.stringify([])
        );

        localStorage.setItem(
            "rewardHistory_" +
            userKey,
            JSON.stringify([])
        );

    }


    /*
       Load this user's account status.
    */

    const individualStatus =
        localStorage.getItem(
            "adminAccountStatus_" +
            userKey
        );


    localStorage.setItem(
        "adminAccountStatus",
        individualStatus ||
        "Active"
    );


    /*
       Mark the user as logged in.
    */

    localStorage.setItem(
        "loggedIn",
        "true"
    );


    /*
       Compatibility with older
       platform code.
    */

    localStorage.setItem(
        "isLoggedIn",
        "true"
    );

}


/* =====================================================
   UPDATE USER RECORD
===================================================== */

function updateUserRecord(user) {

    const users =
        getAllUsers();


    const userKey =
        getUserKey(user);


    const index =
        users.findIndex(
            function(item) {

                return (
                    String(
                        getUserKey(item)
                    )
                    ===
                    String(userKey)
                );

            }
        );


    if (
        index !== -1
    ) {

        users[index] =
            user;


        saveAllUsers(
            users
        );

    }

}


/* =====================================================
   LOGIN
===================================================== */

function loginUser(event) {

    event.preventDefault();


    const identifier =
        document.getElementById(
            "loginIdentifier"
        ).value.trim();


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    const message =
        document.getElementById(
            "message"
        );


    const attemptsMessage =
        document.getElementById(
            "attemptsMessage"
        );


    message.className =
        "message";


    message.textContent =
        "";


    attemptsMessage.textContent =
        "";


    if (
        !identifier ||
        !password
    ) {

        showError(
            "Please enter your username/email and password."
        );

        return;

    }


    /* =================================================
       FIND USER
    ================================================== */

    const user =
        findUser(
            identifier
        );


    /*
       If the user does not exist,
       do not reveal unnecessary account
       information.
    */

    if (
        !user
    ) {

        showError(
            "Invalid username/email or password."
        );

        return;

    }


    /* =================================================
       CHECK BLOCK
    ================================================== */

    const blockedUntil =
        getBlockedUntil(
            user
        );


    if (
        blockedUntil > Date.now()
    ) {

        const minutes =
            Math.ceil(
                (
                    blockedUntil -
                    Date.now()
                ) / 60000
            );


        showError(
            "Account temporarily blocked. Try again in " +
            minutes +
            " minute(s)."
        );


        attemptsMessage.textContent =
            "Too many failed login attempts.";


        return;

    }


    /*
       Clear expired block.
    */

    if (
        blockedUntil > 0 &&
        blockedUntil <= Date.now()
    ) {

        setBlockedUntil(
            user,
            0
        );

        setAttempts(
            user,
            0
        );

    }


    /* =================================================
       CHECK PASSWORD
    ================================================== */

    if (
        String(user.password || "")
        !==
        password
    ) {

        let attempts =
            getAttempts(
                user
            );


        attempts++;


        setAttempts(
            user,
            attempts
        );


        if (
            attempts >=
            MAX_ATTEMPTS
        ) {

            const blockedTime =
                Date.now() +
                BLOCK_TIME;


            setBlockedUntil(
                user,
                blockedTime
            );


            showError(
                "Too many failed attempts. Account blocked for 30 minutes."
            );


            attemptsMessage.textContent =
                "Please try again later.";


            return;

        }


        const remaining =
            MAX_ATTEMPTS -
            attempts;


        showError(
            "Invalid username/email or password."
        );


        attemptsMessage.textContent =
            remaining +
            " attempt(s) remaining.";

        return;

    }


    /* =================================================
       SUCCESSFUL LOGIN
    ================================================== */

    clearLoginSecurity(
        user
    );


    /*
       Make this user the active user.
    */

    setActiveUser(
        user
    );


    /*
       Update last login information.
    */

    user.lastLogin =
        new Date().toISOString();


    updateUserRecord(
        user
    );


    showSuccess(
        "Login successful. Welcome, " +
        (user.username || "User") +
        "!"
    );


    /*
       Determine where the user should go.
    */

    setTimeout(
        function() {

            const returnPage =
                localStorage.getItem(
                    "loginReturnPage"
                );


            if (
                returnPage
            ) {

                localStorage.removeItem(
                    "loginReturnPage"
                );


                window.location.href =
                    returnPage;

                return;

            }


            window.location.href =
                "menu.html";

        },
        700
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(text) {

    const message =
        document.getElementById(
            "message"
        );


    message.className =
        "message error";


    message.textContent =
        text;

}


/* =====================================================
   SUCCESS
===================================================== */

function showSuccess(text) {

    const message =
        document.getElementById(
            "message"
        );


    message.className =
        "message success";


    message.textContent =
        text;

}


/* =====================================================
   RESET PASSWORD BOX
===================================================== */

function showResetBox() {

    document.getElementById(
        "resetBox"
    ).style.display =
        "block";


    document.getElementById(
        "resetEmail"
    ).focus();

}


function hideResetBox() {

    document.getElementById(
        "resetBox"
    ).style.display =
        "none";

}


/* =====================================================
   RESET PASSWORD RULES
===================================================== */

function checkResetPasswordRules() {

    const password =
        document.getElementById(
            "newPassword"
        ).value;


    const lengthValid =
        password.length >= 6 &&
        password.length <= 15;


    const capitalValid =
        /[A-Z]/.test(password);


    const lowerValid =
        /[a-z]/.test(password);


    const specialValid =
        /[?!%&$#=]/.test(password);


    updateResetRule(
        "resetLengthRule",
        lengthValid,
        "6–15 characters"
    );


    updateResetRule(
        "resetCapitalRule",
        capitalValid,
        "At least one capital letter"
    );


    updateResetRule(
        "resetLowerRule",
        lowerValid,
        "At least one lowercase letter"
    );


    updateResetRule(
        "resetSpecialRule",
        specialValid,
        "At least one special character (? ! % & $ # =)"
    );


    return (
        lengthValid &&
        capitalValid &&
        lowerValid &&
        specialValid
    );

}


/* =====================================================
   UPDATE RESET RULE
===================================================== */

function updateResetRule(
    id,
    valid,
    text
) {

    const element =
        document.getElementById(
            id
        );


    if (valid) {

        element.className =
            "rule valid";

        element.textContent =
            "✓ " + text;

    }

    else {

        element.className =
            "rule invalid";

        element.textContent =
            "✗ " + text;

    }

}


/* =====================================================
   RESET PASSWORD
===================================================== */

function resetPassword() {

    const email =
        document.getElementById(
            "resetEmail"
        ).value.trim()
        .toLowerCase();


    const newPassword =
        document.getElementById(
            "newPassword"
        ).value;


    const confirmPassword =
        document.getElementById(
            "confirmNewPassword"
        ).value;


    if (
        !email ||
        !newPassword ||
        !confirmPassword
    ) {

        showError(
            "Please complete all password reset fields."
        );

        return;

    }


    /* =================================================
       FIND USER BY EMAIL
    ================================================== */

    const users =
        getAllUsers();


    const user =
        users.find(
            function(item) {

                return (
                    String(
                        item.email || ""
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    email
                );

            }
        );


    if (
        !user
    ) {

        showError(
            "No registered account was found with that email."
        );

        return;

    }


    /* =================================================
       PASSWORD RULES
    ================================================== */

    if (
        !checkResetPasswordRules()
    ) {

        showError(
            "Please meet all password requirements."
        );

        return;

    }


    if (
        newPassword !==
        confirmPassword
    ) {

        showError(
            "Passwords do not match."
        );

        return;

    }


    /* =================================================
       UPDATE PASSWORD
    ================================================== */

    user.password =
        newPassword;


    updateUserRecord(
        user
    );


    /*
       Reset security counters.
    */

    clearLoginSecurity(
        user
    );


    showSuccess(
        "Password reset successfully. You can now log in."
    );


    document.getElementById(
        "resetEmail"
    ).value = "";


    document.getElementById(
        "newPassword"
    ).value = "";


    document.getElementById(
        "confirmNewPassword"
    ).value = "";


    setTimeout(
        function() {

            hideResetBox();

        },
        900
    );

}


/* =====================================================
   RESET PASSWORD INPUT
===================================================== */

document
    .getElementById(
        "newPassword"
    )
    .addEventListener(
        "input",
        checkResetPasswordRules
    );


/* =====================================================
   INITIALIZE
===================================================== */

checkResetPasswordRules();


</script>


</body>

</html>
