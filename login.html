<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login - Reward Platform</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f4f7fb;

    color: #222;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 100%;

    max-width: 480px;

    margin: 50px auto;

    padding: 20px;

}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card {

    background: white;

    padding: 30px;

    border-radius: 15px;

    box-shadow: 0 4px 18px rgba(0,0,0,0.10);

}


.login-card h1 {

    margin: 0 0 10px 0;

    text-align: center;

    font-size: 28px;

}


.login-card > p {

    text-align: center;

    color: #666;

    margin-bottom: 25px;

}


/* =====================================================
   FORM GROUP
===================================================== */

.form-group {

    margin-bottom: 18px;

}


.form-group label {

    display: block;

    margin-bottom: 7px;

    font-weight: bold;

}


.form-group input {

    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 15px;

    outline: none;

}


.form-group input:focus {

    border-color: #2563eb;

}


/* =====================================================
   BUTTON
===================================================== */

.login-button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


.login-button:hover {

    background: #1d4ed8;

}


.login-button:disabled {

    background: #9ca3af;

    cursor: not-allowed;

}


/* =====================================================
   MESSAGE
===================================================== */

.message {

    display: none;

    padding: 12px;

    border-radius: 8px;

    margin-bottom: 18px;

    font-size: 14px;

    text-align: center;

}


.message.error {

    background: #fff0f0;

    color: #b42318;

    border: 1px solid #f3c2c2;

}


.message.success {

    background: #eefaf1;

    color: #16803c;

    border: 1px solid #b8e0c2;

}


/* =====================================================
   ATTEMPTS
===================================================== */

.attempts {

    text-align: center;

    margin-top: 15px;

    color: #666;

    font-size: 13px;

}


/* =====================================================
   RESET BOX
===================================================== */

.reset-box {

    display: none;

    margin-top: 25px;

    padding: 20px;

    background: #f7f9fc;

    border: 1px solid #e1e5eb;

    border-radius: 10px;

}


.reset-box h3 {

    margin-top: 0;

    margin-bottom: 15px;

    font-size: 18px;

}


.reset-button {

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 8px;

    background: #475569;

    color: white;

    font-weight: bold;

    cursor: pointer;

}


.reset-button:hover {

    background: #334155;

}


/* =====================================================
   LINKS
===================================================== */

.register-link {

    text-align: center;

    margin-top: 22px;

    font-size: 14px;

}


.register-link a {

    color: #2563eb;

    text-decoration: none;

    font-weight: bold;

}


.register-link a:hover {

    text-decoration: underline;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 520px) {

    .container {

        margin: 20px auto;

        padding: 15px;

    }


    .login-card {

        padding: 22px;

    }

}

</style>

</head>


<body>


<div class="container">


    <div class="login-card">


        <h1>Welcome Back</h1>


        <p>
            Login to continue earning rewards.
        </p>


        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form id="loginForm">


            <!-- USERNAME / EMAIL -->

            <div class="form-group">

                <label for="loginIdentifier">
                    Username or Email
                </label>

                <input
                    type="text"
                    id="loginIdentifier"
                    placeholder="Enter username or email"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                Login
            </button>


        </form>


        <!-- =================================================
             ATTEMPTS
        ================================================== -->

        <div
            id="attemptsText"
            class="attempts"
        >
            3 login attempts remaining.
        </div>


        <!-- =================================================
             PASSWORD RESET
        ================================================== -->

        <div
            id="resetBox"
            class="reset-box"
        >

            <h3>
                Reset Password
            </h3>


            <div class="form-group">

                <label for="resetEmail">
                    Registered Email
                </label>

                <input
                    type="email"
                    id="resetEmail"
                    placeholder="Enter registered email"
                >

            </div>


            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                >

            </div>


            <div class="form-group">

                <label for="confirmNewPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="Confirm new password"
                >

            </div>


            <button
                type="button"
                id="resetButton"
                class="reset-button"
            >
                Reset Password
            </button>

        </div>


        <!-- =================================================
             REGISTER
        ================================================== -->

        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>


    </div>


</div>


<script>

/* =====================================================
   CONSTANTS
===================================================== */

const MAX_ATTEMPTS = 3;

const BLOCK_TIME =
    30 * 60 * 1000;


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById("loginForm");

const loginIdentifier =
    document.getElementById("loginIdentifier");

const loginPassword =
    document.getElementById("loginPassword");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const attemptsText =
    document.getElementById("attemptsText");

const resetBox =
    document.getElementById("resetBox");

const resetEmail =
    document.getElementById("resetEmail");

const newPassword =
    document.getElementById("newPassword");

const confirmNewPassword =
    document.getElementById("confirmNewPassword");

const resetButton =
    document.getElementById("resetButton");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


/* =====================================================
   LOAD USERS
===================================================== */

function getUsers() {

    try {

        const storedUsers =
            localStorage.getItem("users");


        if (!storedUsers) {

            return [];

        }


        const users =
            JSON.parse(storedUsers);


        if (!Array.isArray(users)) {

            return [];

        }


        return users;

    }

    catch (error) {

        console.error(
            "Unable to load users:",
            error
        );

        return [];

    }

}


/* =====================================================
   SAVE USERS
===================================================== */

function saveUsers(users) {

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );

}


/* =====================================================
   PASSWORD VALIDATION
===================================================== */

function validPassword(password) {

    return (

        password.length >= 6 &&

        password.length <= 15 &&

        /[A-Z]/.test(password) &&

        /[a-z]/.test(password) &&

        /[?!%&$#=]/.test(password)

    );

}


/* =====================================================
   USER IDENTIFIER
===================================================== */

function findUser(
    identifier,
    users
) {

    const value =
        identifier
            .trim()
            .toLowerCase();


    return users.find(
        function(user) {

            const username =
                String(
                    user.username || ""
                )
                .trim()
                .toLowerCase();


            const email =
                String(
                    user.email || ""
                )
                .trim()
                .toLowerCase();


            return (
                username === value ||
                email === value
            );

        }
    );

}


/* =====================================================
   LOGIN ATTEMPTS
===================================================== */

function getAttemptData() {

    try {

        const stored =
            localStorage.getItem(
                "loginAttempts"
            );


        if (!stored) {

            return {
                attempts: 0,
                blockedUntil: 0
            };

        }


        const data =
            JSON.parse(stored);


        return {

            attempts:
                Number(data.attempts) || 0,

            blockedUntil:
                Number(data.blockedUntil) || 0

        };

    }

    catch (error) {

        return {
            attempts: 0,
            blockedUntil: 0
        };

    }

}


/* =====================================================
   SAVE ATTEMPTS
===================================================== */

function saveAttemptData(data) {

    localStorage.setItem(
        "loginAttempts",
        JSON.stringify(data)
    );

}


/* =====================================================
   CLEAR ATTEMPTS
===================================================== */

function clearAttempts() {

    localStorage.removeItem(
        "loginAttempts"
    );

}


/* =====================================================
   CHECK BLOCK
===================================================== */

function checkBlock() {

    const data =
        getAttemptData();


    const now =
        Date.now();


    if (
        data.blockedUntil &&
        now < data.blockedUntil
    ) {

        const remaining =
            Math.ceil(
                (
                    data.blockedUntil -
                    now
                ) / 60000
            );


        loginButton.disabled =
            true;


        attemptsText.textContent =
            "Login blocked. Try again in "
            + remaining +
            " minute(s).";


        return true;

    }


    if (
        data.blockedUntil &&
        now >= data.blockedUntil
    ) {

        clearAttempts();

    }


    const freshData =
        getAttemptData();


    const remainingAttempts =
        MAX_ATTEMPTS -
        freshData.attempts;


    attemptsText.textContent =
        remainingAttempts +
        (
            remainingAttempts === 1
                ? " login attempt remaining."
                : " login attempts remaining."
        );


    loginButton.disabled =
        false;


    return false;

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        if (checkBlock()) {

            return;

        }


        const identifier =
            loginIdentifier.value
                .trim();


        const password =
            loginPassword.value;


        if (!identifier || !password) {

            showMessage(
                "Please enter your username/email and password.",
                "error"
            );

            return;

        }


        const users =
            getUsers();


        /* =============================================
           FIND USER
        ============================================= */

        const user =
            findUser(
                identifier,
                users
            );


        if (!user) {

            registerFailedAttempt();

            showMessage(
                "Invalid username/email or password.",
                "error"
            );

            return;

        }


        /* =============================================
           PASSWORD CHECK
        ============================================= */

        if (
            String(user.password || "") !==
            password
        ) {

            registerFailedAttempt();

            showMessage(
                "Invalid username/email or password.",
                "error"
            );

            return;

        }


        /* =============================================
           LOGIN SUCCESS
        ============================================= */

        clearAttempts();


        /*
         * Save the complete selected user.
         */

        localStorage.setItem(
            "currentUser",
            JSON.stringify(user)
        );


        /*
         * Compatibility with existing pages.
         */

        localStorage.setItem(
            "rewardUser",
            JSON.stringify(user)
        );


        localStorage.setItem(
            "username",
            user.username || ""
        );


        localStorage.setItem(
            "userEmail",
            user.email || ""
        );


        localStorage.setItem(
            "loggedIn",
            "true"
        );


        localStorage.setItem(
            "isLoggedIn",
            "true"
        );


        showMessage(
            "Login successful. Redirecting...",
            "success"
        );


        /* =============================================
           RETURN PAGE
        ============================================= */

        const returnPage =
            localStorage.getItem(
                "loginReturnPage"
            );


        setTimeout(
            function() {

                if (returnPage) {

                    localStorage.removeItem(
                        "loginReturnPage"
                    );


                    window.location.href =
                        returnPage;

                }

                else {

                    window.location.href =
                        "menu.html";

                }

            },
            800
        );

    }
);


/* =====================================================
   FAILED LOGIN ATTEMPT
===================================================== */

function registerFailedAttempt() {

    const data =
        getAttemptData();


    data.attempts += 1;


    if (
        data.attempts >=
        MAX_ATTEMPTS
    ) {

        data.blockedUntil =
            Date.now() +
            BLOCK_TIME;


        saveAttemptData(
            data
        );


        loginButton.disabled =
            true;


        attemptsText.textContent =
            "Login blocked for 30 minutes.";


        showMessage(
            "Too many failed attempts. Login is temporarily blocked.",
            "error"
        );


        return;

    }


    saveAttemptData(
        data
    );


    const remaining =
        MAX_ATTEMPTS -
        data.attempts;


    attemptsText.textContent =
        remaining +
        (
            remaining === 1
                ? " login attempt remaining."
                : " login attempts remaining."
        );

}


/* =====================================================
   RESET PASSWORD
===================================================== */

resetButton.addEventListener(
    "click",
    function() {

        const email =
            resetEmail.value
                .trim()
                .toLowerCase();


        const password =
            newPassword.value;


        const confirmPassword =
            confirmNewPassword.value;


        if (!email) {

            showMessage(
                "Please enter your registered email.",
                "error"
            );

            return;

        }


        if (!password) {

            showMessage(
                "Please enter a new password.",
                "error"
            );

            return;

        }


        if (!validPassword(password)) {

            showMessage(
                "New password must contain 6–15 characters, a capital letter, a lowercase letter, and one of ? ! % & $ # =.",
                "error"
            );

            return;

        }


        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "New passwords do not match.",
                "error"
            );

            return;

        }


        const users =
            getUsers();


        const userIndex =
            users.findIndex(
                function(user) {

                    return (
                        String(
                            user.email || ""
                        )
                        .trim()
                        .toLowerCase()
                        ===
                        email
                    );

                }
            );


        if (userIndex === -1) {

            showMessage(
                "No account was found with that email.",
                "error"
            );

            return;

        }


        /* =============================================
           UPDATE PASSWORD
        ============================================= */

        users[userIndex].password =
            password;


        saveUsers(
            users
        );


        /*
         * Update current compatibility records
         * only if this is the currently stored user.
         */

        const currentUserText =
            localStorage.getItem(
                "currentUser"
            );


        if (currentUserText) {

            try {

                const currentUser =
                    JSON.parse(
                        currentUserText
                    );


                if (
                    String(
                        currentUser.email || ""
                    )
                    .toLowerCase()
                    ===
                    email
                ) {

                    currentUser.password =
                        password;


                    localStorage.setItem(
                        "currentUser",
                        JSON.stringify(
                            currentUser
                        )
                    );


                    localStorage.setItem(
                        "rewardUser",
                        JSON.stringify(
                            currentUser
                        )
                    );

                }

            }

            catch (error) {

                console.error(error);

            }

        }


        showMessage(
            "Password reset successfully. You can now login.",
            "success"
        );


        resetEmail.value =
            "";

        newPassword.value =
            "";

        confirmNewPassword.value =
            "";


        resetBox.style.display =
            "none";

    }
);


/* =====================================================
   SHOW RESET BOX
===================================================== */

function showResetBox() {

    resetBox.style.display =
        "block";

}


/* =====================================================
   RESET LINK
===================================================== */

const resetLink =
    document.createElement("div");


resetLink.style.textAlign =
    "center";

resetLink.style.marginTop =
    "15px";

resetLink.style.fontSize =
    "14px";


resetLink.innerHTML = `

    <a
        href="#"
        id="forgotPasswordLink"
        style="
            color:#2563eb;
            text-decoration:none;
            font-weight:bold;
        "
    >
        Forgot Password?
    </a>

`;


document
    .querySelector(".login-link")
    .before(resetLink);


document
    .getElementById("forgotPasswordLink")
    .addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            showResetBox();

        }
    );


/* =====================================================
   INITIALIZE
===================================================== */

checkBlock();

</script>


</body>

</html>
