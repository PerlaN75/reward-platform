<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin - Users - Reward Platform</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f4f7fb;

    color: #222;

}


/* =====================================================
   TOP NAVIGATION
===================================================== */

.top-nav {

    background: #172033;

    color: white;

    padding: 15px 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    flex-wrap: wrap;

}


.top-nav h2 {

    margin: 0;

    font-size: 20px;

}


.top-nav a {

    color: white;

    text-decoration: none;

    margin-left: 15px;

    font-size: 14px;

}


.top-nav a:hover {

    text-decoration: underline;

}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container {

    max-width: 1100px;

    margin: 30px auto;

    padding: 0 20px;

}


/* =====================================================
   PAGE HEADER
===================================================== */

.page-header {

    background: white;

    padding: 25px;

    border-radius: 12px;

    box-shadow: 0 3px 12px rgba(0,0,0,0.08);

    margin-bottom: 25px;

}


.page-header h1 {

    margin: 0 0 8px 0;

    font-size: 28px;

}


.page-header p {

    margin: 0;

    color: #666;

}


/* =====================================================
   USER COUNT
===================================================== */

.user-count {

    margin-top: 18px;

    display: inline-block;

    background: #eef4ff;

    color: #2457b8;

    padding: 10px 15px;

    border-radius: 8px;

    font-weight: bold;

}


/* =====================================================
   USERS CARD
===================================================== */

.users-card {

    background: white;

    border-radius: 12px;

    box-shadow: 0 3px 12px rgba(0,0,0,0.08);

    overflow: hidden;

}


/* =====================================================
   CARD HEADER
===================================================== */

.card-header {

    padding: 20px;

    border-bottom: 1px solid #e5e5e5;

}


.card-header h2 {

    margin: 0;

    font-size: 20px;

}


/* =====================================================
   USER ROW
===================================================== */

.user-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    padding: 20px;

    border-bottom: 1px solid #eeeeee;

}


.user-row:last-child {

    border-bottom: none;

}


.user-info {

    display: flex;

    align-items: center;

    gap: 15px;

    min-width: 0;

}


.user-icon {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    background: #e9f0ff;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 24px;

    flex-shrink: 0;

}


.user-text {

    min-width: 0;

}


.username {

    font-size: 17px;

    font-weight: bold;

    margin-bottom: 5px;

}


.email {

    color: #666;

    font-size: 14px;

    word-break: break-word;

}


/* =====================================================
   DETAILS BUTTON
===================================================== */

.details-button {

    display: inline-block;

    background: #2563eb;

    color: white;

    text-decoration: none;

    padding: 10px 16px;

    border-radius: 7px;

    font-size: 14px;

    font-weight: bold;

    border: none;

    cursor: pointer;

    white-space: nowrap;

}


.details-button:hover {

    background: #1d4ed8;

}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty-state {

    padding: 45px 20px;

    text-align: center;

    color: #666;

}


.empty-state .icon {

    font-size: 42px;

    margin-bottom: 12px;

}


.empty-state h3 {

    margin: 0 0 8px 0;

    color: #333;

}


.empty-state p {

    margin: 0;

}


/* =====================================================
   ERROR
===================================================== */

.error-message {

    background: #fff0f0;

    color: #b42318;

    border: 1px solid #f5c2c0;

    padding: 15px;

    border-radius: 8px;

    margin-bottom: 20px;

    display: none;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

    .user-row {

        flex-direction: column;

        align-items: flex-start;

    }


    .details-button {

        width: 100%;

        text-align: center;

    }


    .top-nav {

        gap: 10px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     TOP NAVIGATION
===================================================== -->

<nav class="top-nav">

    <h2>Admin Dashboard</h2>

    <div>

        <a href="admin.html">Dashboard</a>

        <a href="admin-users.html">Users</a>

        <a href="index.html">Platform</a>

    </div>

</nav>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- PAGE HEADER -->

    <section class="page-header">

        <h1>Registered Users</h1>

        <p>
            View and manage all registered users on the platform.
        </p>

        <div
            class="user-count"
            id="userCount"
        >
            0 Registered Users
        </div>

    </section>


    <!-- ERROR MESSAGE -->

    <div
        class="error-message"
        id="errorMessage"
    >
        Unable to load registered users.
    </div>


    <!-- USERS -->

    <section class="users-card">

        <div class="card-header">

            <h2>Users</h2>

        </div>


        <div id="usersList">

            <!-- Users will be loaded here -->

        </div>

    </section>


</main>


<script>

/* =====================================================
   LOAD REGISTERED USERS
===================================================== */

function loadUsers() {

    const usersList =
        document.getElementById("usersList");

    const userCount =
        document.getElementById("userCount");

    const errorMessage =
        document.getElementById("errorMessage");


    usersList.innerHTML = "";

    errorMessage.style.display = "none";


    let users = [];


    try {

        const storedUsers =
            localStorage.getItem("users");


        if (storedUsers) {

            users = JSON.parse(storedUsers);

        }


        if (!Array.isArray(users)) {

            users = [];

        }

    }

    catch (error) {

        console.error(
            "Error loading users:",
            error
        );

        errorMessage.style.display = "block";

        users = [];

    }


    /* =================================================
       USER COUNT
    ================================================= */

    userCount.textContent =
        users.length === 1
            ? "1 Registered User"
            : users.length + " Registered Users";


    /* =================================================
       NO USERS
    ================================================= */

    if (users.length === 0) {

        usersList.innerHTML = `

            <div class="empty-state">

                <div class="icon">
                    👤
                </div>

                <h3>No Registered Users</h3>

                <p>
                    No users have been registered yet.
                </p>

            </div>

        `;

        return;

    }


    /* =================================================
       DISPLAY ALL USERS
    ================================================= */

    users.forEach(function(user, index) {


        const username =
            user.username ||
            user.name ||
            user.email ||
            "Unknown User";


        const email =
            user.email ||
            "No email available";


        /*
         * We use the array index as a fallback identifier.
         * The complete user object is also stored temporarily
         * for the details page.
         */

        const userId =
            user.id ||
            user.userId ||
            username;


        const row =
            document.createElement("div");


        row.className = "user-row";


        row.innerHTML = `

            <div class="user-info">

                <div class="user-icon">
                    👤
                </div>

                <div class="user-text">

                    <div class="username">
                        ${escapeHtml(username)}
                    </div>

                    <div class="email">
                        ${escapeHtml(email)}
                    </div>

                </div>

            </div>


            <button
                class="details-button"
                onclick="openUserDetails(${index})"
            >
                View User Details
            </button>

        `;


        usersList.appendChild(row);

    });

}


/* =====================================================
   OPEN USER DETAILS
===================================================== */

function openUserDetails(index) {

    const storedUsers =
        localStorage.getItem("users");


    if (!storedUsers) {

        return;

    }


    let users;


    try {

        users = JSON.parse(storedUsers);

    }

    catch (error) {

        console.error(error);

        return;

    }


    if (
        !Array.isArray(users) ||
        !users[index]
    ) {

        return;

    }


    const selectedUser =
        users[index];


    /*
     * Store the selected user temporarily.
     * admin-user-details.html can use this information.
     */

    localStorage.setItem(
        "selectedAdminUser",
        JSON.stringify(selectedUser)
    );


    /*
     * Also store useful identifiers separately.
     */

    localStorage.setItem(
        "selectedAdminUserIndex",
        String(index)
    );


    if (selectedUser.id) {

        localStorage.setItem(
            "selectedAdminUserId",
            String(selectedUser.id)
        );

    }

    else if (selectedUser.userId) {

        localStorage.setItem(
            "selectedAdminUserId",
            String(selectedUser.userId)
        );

    }

    else if (selectedUser.username) {

        localStorage.setItem(
            "selectedAdminUserId",
            selectedUser.username
        );

    }


    window.location.href =
        "admin-user-details.html";

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   START
===================================================== */

loadUsers();

</script>


</body>

</html>
