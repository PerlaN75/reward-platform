<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Admin - Users - Reward Platform</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f4f7fb;

    color: #222;

}


/* =====================================================
   TOP NAVIGATION
===================================================== */

.top-nav {

    background:
        linear-gradient(
            90deg,
            #182848,
            #3d2075
        );

    padding: 12px 10px;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


.admin-label {

    color: white;

    font-size: 16px;

    font-weight: bold;

}


.back-button {

    border: none;

    border-radius: 12px;

    padding: 11px 17px;

    background:
        rgba(255,255,255,0.13);

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}


.back-button:hover {

    background:
        rgba(255,255,255,0.22);

}


/* =====================================================
   HEADER
===================================================== */

header {

    background:
        linear-gradient(
            135deg,
            #182848,
            #3d2075
        );

    color: white;

    text-align: center;

    padding: 42px 15px 48px;

}


header h1 {

    margin: 0;

    font-size:
        clamp(40px, 9vw, 62px);

    background:
        linear-gradient(
            90deg,
            #d4ff38,
            #ffd43b,
            #ff4d8d,
            #8a2be2,
            #2196f3,
            #00c9a7
        );

    background-size: 300% 100%;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:
        headingSlide 8s linear infinite;

}


header p {

    margin: 12px 0 0;

    color: #eee;

    font-size:
        clamp(16px, 4vw, 21px);

}


@keyframes headingSlide {

    from {

        background-position: 0% 50%;

    }

    to {

        background-position: 300% 50%;

    }

}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container {

    max-width: 900px;

    margin: auto;

    padding: 25px 15px 45px;

}


/* =====================================================
   SUMMARY CARD
===================================================== */

.summary-card {

    background: white;

    border-radius: 18px;

    padding: 30px 20px;

    text-align: center;

    box-shadow:
        0 4px 16px
        rgba(0,0,0,0.08);

}


.summary-icon {

    font-size: 58px;

}


.summary-number {

    margin-top: 5px;

    font-size: 40px;

    font-weight: bold;

    color: #182848;

}


.summary-label {

    margin-top: 5px;

    color: #666;

    font-size: 18px;

}


/* =====================================================
   SEARCH CARD
===================================================== */

.search-card {

    background: white;

    border-radius: 16px;

    padding: 20px;

    margin-top: 25px;

    box-shadow:
        0 4px 16px
        rgba(0,0,0,0.07);

}


.search-title {

    margin: 0 0 12px;

    color: #182848;

    font-size: 20px;

}


.search-input {

    width: 100%;

    padding: 15px;

    border:
        1px solid #d8dce5;

    border-radius: 12px;

    font-size: 17px;

    outline: none;

}


.search-input:focus {

    border-color: #7b2cff;

}


/* =====================================================
   USERS AREA
===================================================== */

.users-area {

    margin-top: 25px;

}


/* =====================================================
   USER CARD
===================================================== */

.user-card {

    background: white;

    border-radius: 18px;

    padding: 22px;

    margin-bottom: 20px;

    box-shadow:
        0 4px 16px
        rgba(0,0,0,0.08);

}


.user-top {

    display: flex;

    align-items: center;

    gap: 18px;

}


.user-avatar {

    width: 90px;

    height: 90px;

    min-width: 90px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #7b2cff,
            #287dff
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 50px;

}


.user-main {

    min-width: 0;

}


.user-name {

    font-size: 26px;

    font-weight: bold;

    color: #182848;

    word-break: break-word;

}


.user-email {

    margin-top: 5px;

    color: #777;

    font-size: 15px;

    word-break: break-word;

}


/* =====================================================
   USER INFORMATION GRID
===================================================== */

.user-info-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

    margin-top: 22px;

}


.info-box {

    background: #f7f8fc;

    border-radius: 12px;

    padding: 14px;

}


.info-label {

    color: #777;

    font-size: 14px;

    margin-bottom: 6px;

}


.info-value {

    color: #182848;

    font-size: 18px;

    font-weight: bold;

    word-break: break-word;

}


.status-active {

    color: #168a3a;

}


.status-negative {

    color: #c62828;

}


.status-prototype {

    color: #d48b00;

}


/* =====================================================
   VIEW DETAILS BUTTON
===================================================== */

.details-button {

    width: 100%;

    margin-top: 20px;

    padding: 15px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            90deg,
            #8b25ff,
            #287dff
        );

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}


.details-button:hover {

    transform: translateY(-2px);

}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty-state {

    background: white;

    border-radius: 18px;

    padding: 45px 20px;

    text-align: center;

    box-shadow:
        0 4px 16px
        rgba(0,0,0,0.07);

}


.empty-icon {

    font-size: 55px;

}


.empty-state h2 {

    color: #182848;

}


.empty-state p {

    color: #777;

    line-height: 1.5;

}


/* =====================================================
   FOOTER
===================================================== */

footer {

    text-align: center;

    padding: 25px;

    color: #666;

    font-size: 14px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    header {

        padding:
            35px 15px 40px;

    }


    .user-top {

        gap: 12px;

    }


    .user-avatar {

        width: 70px;

        height: 70px;

        min-width: 70px;

        font-size: 38px;

    }


    .user-name {

        font-size: 22px;

    }


    .user-email {

        font-size: 14px;

    }


    .user-info-grid {

        gap: 9px;

    }


    .info-box {

        padding: 12px 9px;

    }


    .info-value {

        font-size: 16px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     ADMIN LOGIN PROTECTION
===================================================== -->

<script>

if (
    localStorage.getItem("adminLoggedIn")
    !== "true"
) {

    window.location.href =
        "admin-login.html";

}

</script>


<!-- =====================================================
     TOP NAVIGATION
===================================================== -->

<nav class="top-nav">

    <div class="admin-label">

        🔐 Administrator

    </div>


    <button
        type="button"
        class="back-button"
        onclick="goBackToDashboard()">

        ← Back

    </button>

</nav>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <h1>

        👥 Users

    </h1>


    <p>

        View and monitor Reward Platform users.

    </p>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- =================================================
         USER SUMMARY
    ================================================== -->

    <section class="summary-card">

        <div class="summary-icon">

            👥

        </div>


        <div
            id="userCount"
            class="summary-number">

            0

        </div>


        <div class="summary-label">

            Registered Users

        </div>

    </section>


    <!-- =================================================
         SEARCH
    ================================================== -->

    <section class="search-card">

        <h2 class="search-title">

            🔎 Search Users

        </h2>


        <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Search by username or email..."
            oninput="searchUsers()">

    </section>


    <!-- =================================================
         USERS
    ================================================== -->

    <section
        id="usersArea"
        class="users-area">

    </section>


</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    Reward Platform — Admin Users

</footer>


<script>

/* =====================================================
   GET USER
===================================================== */

function getUser() {

    let user = null;


    try {

        const stored =
            localStorage.getItem(
                "rewardUser"
            );


        if (!stored) {

            return null;

        }


        user =
            JSON.parse(stored);

    }

    catch (error) {

        return null;

    }


    return user;

}


/* =====================================================
   USERNAME
===================================================== */

function getUsername(user) {

    if (!user) {

        return "Unknown User";

    }


    return (
        user.username ||
        user.name ||
        user.fullName ||
        "Unknown User"
    );

}


/* =====================================================
   EMAIL
===================================================== */

function getEmail(user) {

    if (!user) {

        return "Not available";

    }


    return (
        user.email ||
        "Not available"
    );

}


/* =====================================================
   REGISTERED DATE
===================================================== */

function getRegisteredDate(user) {

    if (!user) {

        return "Not available";

    }


    return (
        user.registeredAt ||
        user.createdAt ||
        user.registrationDate ||
        user.date ||
        "Not available"
    );

}


/* =====================================================
   CURRENT POINTS
===================================================== */

function getPoints() {

    return Number(
        localStorage.getItem(
            "rewardPoints"
        )
    ) || 0;

}


/* =====================================================
   ACCOUNT STATUS
===================================================== */

function getAccountStatus() {

    return (
        localStorage.getItem(
            "adminAccountStatus"
        ) ||
        "Active"
    );

}


/* =====================================================
   DISPLAY USERS
===================================================== */

function displayUsers() {

    const area =
        document.getElementById(
            "usersArea"
        );


    const user =
        getUser();


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    area.innerHTML = "";


    /* =================================================
       NO USER
    ================================================== */

    if (!user) {

        document.getElementById(
            "userCount"
        ).textContent =
            "0";


        area.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">

                    👥

                </div>


                <h2>

                    No Users Found

                </h2>


                <p>

                    No registered user is currently
                    available in the prototype storage.

                </p>

            </div>

        `;

        return;

    }


    const username =
        getUsername(user);


    const email =
        getEmail(user);


    const searchable =
        (
            username +
            " " +
            email
        ).toLowerCase();


    /* =================================================
       SEARCH FILTER
    ================================================== */

    if (
        search &&
        !searchable.includes(search)
    ) {

        document.getElementById(
            "userCount"
        ).textContent =
            "0";


        area.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">

                    🔎

                </div>


                <h2>

                    No Matching User

                </h2>


                <p>

                    No user matches your search.

                </p>

            </div>

        `;

        return;

    }


    document.getElementById(
        "userCount"
    ).textContent =
        "1";


    const points =
        getPoints();


    const registered =
        getRegisteredDate(user);


    const status =
        getAccountStatus();


    const statusClass =
        status === "Suspended"
            ? "status-negative"
            : "status-active";


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "user-card";


    card.innerHTML = `

        <div class="user-top">


            <div class="user-avatar">

                👤

            </div>


            <div class="user-main">

                <div class="user-name">

                    ${escapeHTML(username)}

                </div>


                <div class="user-email">

                    ${escapeHTML(email)}

                </div>

            </div>

        </div>


        <div class="user-info-grid">


            <div class="info-box">

                <div class="info-label">

                    💰 Points

                </div>


                <div class="info-value">

                    ${points}

                </div>

            </div>


            <div class="info-box">

                <div class="info-label">

                    🟢 Status

                </div>


                <div
                    class="info-value ${statusClass}">

                    ${escapeHTML(status)}

                </div>

            </div>


            <div class="info-box">

                <div class="info-label">

                    📅 Registered

                </div>


                <div class="info-value">

                    ${escapeHTML(
                        String(registered)
                    )}

                </div>

            </div>


            <div class="info-box">

                <div class="info-label">

                    🔐 Account

                </div>


                <div class="info-value status-prototype">

                    Prototype

                </div>

            </div>


        </div>


        <button
            type="button"
            class="details-button"
            onclick="viewUserDetails()">

            👁️ View User Details

        </button>

    `;


    area.appendChild(card);

}


/* =====================================================
   VIEW USER DETAILS
===================================================== */

function viewUserDetails() {

    const user =
        getUser();


    if (!user) {

        return;

    }


    /*
       Store the selected user so that
       admin-user-details.html can load it.
    */

    localStorage.setItem(
        "adminSelectedUser",
        JSON.stringify(user)
    );


    window.location.href =
        "admin-user-details.html";

}


/* =====================================================
   SEARCH USERS
===================================================== */

function searchUsers() {

    displayUsers();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   BACK TO ADMIN DASHBOARD
===================================================== */

function goBackToDashboard() {

    window.location.href =
        "admin.html";

}


/* =====================================================
   INITIALIZE
===================================================== */

displayUsers();

</script>


</body>

</html>
