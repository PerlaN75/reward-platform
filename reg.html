<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Reward Platform</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  
  body {
    background: linear-gradient(135deg, #1a0033 0%, #330066 50%, #1a0033 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .card {
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 30px 25px;
    border-radius: 20px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 15px;
  }

  h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 5px;
  }

  .subtitle {
    text-align: center;
    color: #FFD700;
    font-size: 14px;
    margin-bottom: 25px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: #cbd5e1;
  }

  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border-radius: 10px;
    border: none;
    background: #000;
    color: #fff;
    font-size: 15px;
    outline: none;
  }

  input:focus {
    box-shadow: 0 0 0 2px #FFD700;
  }

  .btn-register {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #4b5563;
    color: #000;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 15px;
  }

  .ref-box {
    background: #000;
    padding: 12px;
    border-radius: 10px;
    color: #22c55e; /* green */
    font-size: 14px;
    text-align: center;
    margin-bottom: 15px;
  }

  .login-text {
    text-align: center;
    font-size: 14px;
    color: #cbd5e1;
  }

  .login-text a {
    color: #3B82F6;
    text-decoration: none;
    font-weight: bold;
  }

  .btn-back {
    padding: 14px 40px;
    border-radius: 12px;
    border: none;
    background: #F59E0B;
    color: #000;
    font-weight: bold;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 4px 0 #D97706;
    transition: all 0.2s;
  }

  .btn-back:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #D97706;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Create Account</h1>
    <p class="subtitle">🙊 From Nothing to Something 🍇</p>
    
    <form id="registerForm">
      <label>Username</label>
      <input type="text" id="username" placeholder="John" required>
      
      <label>Password</label>
      <input type="password" id="password" required>
      
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" required>

      <!-- HIDDEN REFERRAL INPUT -->
      <input type="hidden" id="refInput" name="referrer">
      
      <button type="submit" class="btn-register">Register</button>
    </form>

    <div class="ref-box" id="refBox">Ref from URL: null</div>
    
    <p class="login-text">Already have account? <a href="log.html">Login Here</a></p>
  </div>

  <a href="index.html" class="btn-back">← Back</a>

<script>
  // 1. READ REF FROM URL
  const urlParams = new URLSearchParams(window.location.search);
  const ref = urlParams.get('ref');
  const refBox = document.getElementById('refBox');
  const refInput = document.getElementById('refInput');

  if(ref) {
    refBox.innerText = `Referred by: ${ref}`;
    refBox.style.color = '#FBBF24'; // gold if someone referred
    refInput.value = ref; // save it in hidden input
  }

  // 2. HANDLE REGISTER SUBMIT
  document.getElementById('registerForm').addEventListener('submit', function(e){
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const referrer = refInput.value; // this will be "" or "Username"

    if(password !== confirmPassword){
      alert("Passwords do not match!");
      return;
    }

    // HERE YOU SEND DATA TO YOUR BACKEND
    console.log("Registering:", {username, password, referrer});
    
    alert(`Account created!\nUsername: ${username}\nReferred by: ${referrer || 'None'}`);
    
    // Example: redirect to login after
    // window.location.href = "log.html";
  });
</script>

</body>
</html>
