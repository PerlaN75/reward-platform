<!DOCTYPE html>
<html>
<head>
  <title>Register - Rewards</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
  .container { background: #2f3e1a; border: 3px solid #fbbf24; border-radius: 20px; padding: 30px 25px; width: 100%; max-width: 420px; color: white; }
    h1 { text-align: center; font-size: 32px; margin-bottom: 5px; color: #fff; }
  .subtitle { text-align: center; color: #fbbf24; margin-bottom: 20px; font-size: 14px; }
  .ref-banner { background: #0f6b4f; color: white; padding: 12px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 20px; }
    label { font-size: 14px; color: #ccc; margin-top: 12px; display: block; margin-bottom: 5px; }
  .input-box { width: 100%; padding: 14px; margin-bottom: 10px; background: #000; border: 2px solid #444; border-radius: 10px; color: white; font-size: 15px; outline: none; }
  .input-box:focus { border-color: #fbbf24; }
  .btn { width: 100%; padding: 15px; background: linear-gradient(90deg, #fbbf24, #f59e0b); color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
  .btn:disabled { background: #444; color: #888; cursor: not-allowed; }
  .note { text-align: center; margin-top: 15px; font-size: 14px; color: #aaa; }
  .note a { color: #60a5fa; text-decoration: none; font-weight: bold; }
  .error { color: #ef4444; text-align: center; margin-top: 10px; font-size: 13px; }
  .success { color: #22c55e; text-align: center; margin-top: 10px; font-size: 13px; }
  .back-btn { width: 40%; margin: 20px auto 0 auto; display: block; padding: 14px; background: #f59e0b; color: #000; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
  <div class="container">
    <h1>Register</h1>
    <div class="subtitle">🐒 From Nothing to Something 🍇</div>
    <div class="ref-banner" id="refBanner" style="display:none;">Invited by: <span id="refName"></span></div>
    <label>Username</label>
    <input type="text" class="input-box" id="username" placeholder="Choose username" oninput="formatUsername()">
    <label>Email (real email)</label>
    <input type="email" class="input-box" id="email" placeholder="your real gmail">
    <label>Password</label>
    <input type="password" class="input-box" id="password" placeholder="Min 5 chars, 1A, 1#, 1number">
    <button class="btn" id="createBtn" onclick="createAccount()">Create Account & Send Verification Email</button>
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>
    <div class="note">Already have account? <a href="./index.html">Login Here</a></div>
    <button class="back-btn" onclick="window.location.href='./index.html'">Back</button>
  </div>

<script>
  const firebaseConfig = {apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain: "reward-platform-rw-2e13d.firebaseapp.com",projectId: "reward-platform-rw-2e13d"};
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const WHITELIST = ['admin@reward.rw','priyamwiza25@gmail.com','inezarose25@gmail.com'].map(e=>e.toLowerCase());
  function getDeviceId(){ let id=localStorage.getItem('deviceId'); if(!id){ id=Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('deviceId',id);} return id; }

  let referredByCode=null;
  const urlParams=new URLSearchParams(window.location.search);
  referredByCode=urlParams.get('ref');
  if(referredByCode){ document.getElementById('refBanner').style.display='block'; document.getElementById('refName').innerText=referredByCode; }

  window.formatUsername=function(){let v=document.getElementById('username').value; v=v.replace(/[^a-zA-Z]/g,''); v=v.charAt(0).toUpperCase()+v.slice(1).toLowerCase(); document.getElementById('username').value=v;}
  function validatePassword(p){if(p.length<5||p.length>10)return"Password must be 5-10 characters"; if(!/[A-Z]/.test(p))return"Password needs at least 1 capital letter"; if(!/[0-9]/.test(p))return"Password needs at least 1 number"; if(!/[!@#$%^&*(),.?":{}|<>]/.test(p))return"Password needs at least 1 special character"; return null;}

  window.createAccount=async function(){
    const username=document.getElementById('username').value.trim();
    const email=document.getElementById('email').value.trim();
    const emailLow=email.toLowerCase();
    const password=document.getElementById('password').value;
    const errorEl=document.getElementById('errorMsg');
    const successEl=document.getElementById('successMsg');
    const btn=document.getElementById('createBtn');
    errorEl.innerText=''; successEl.innerText=''; btn.disabled=true; btn.innerText="Checking email...";

    if(!username||!email||!password){errorEl.innerText="Fill all fields"; btn.disabled=false; btn.innerText="Create Account & Send Verification Email"; return;}
    const passError=validatePassword(password); if(passError){errorEl.innerText=passError; btn.disabled=false; btn.innerText="Create Account & Send Verification Email"; return;}

    // === EXTRA PROTECTION: BLOCK FAKE EMAILS ===
    const typoDomains=['gmai.com','gmail.con','gmal.com','gmial.com','yaho.com','yahoo.con','hotmai.com','hotmial.com','outlok.com','gmail.cm','gmail.co','gmail.cm','gmaiil.com'];
    if(typoDomains.some(d=>emailLow.endsWith(d))){
      errorEl.innerText="❌ Typo in email, check gmail.com spelling";
      btn.disabled=false; btn.innerText="Create Account & Send Verification Email"; return;
    }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailLow)){
      errorEl.innerText="❌ Invalid email format";
      btn.disabled=false; btn.innerText="Create Account & Send Verification Email"; return;
    }
    try{
      const checkRes=await fetch('https://www.disify.com/api/email/'+encodeURIComponent(emailLow));
      const checkData=await checkRes.json();
      if(!checkData.format){ errorEl.innerText="❌ Invalid email format"; btn.disabled=false; btn.innerText="Create Account & Send Verification Email"; return; }
      if(checkData.disposable){ errorEl.innerText="❌ Temporary/fake emails not allowed. Use real Gmail"; btn.disabled=false; btn.innerText="Create Account & Send Verification Email"; return; }
      if(checkData.dns===false){ errorEl.innerText="❌ Email domain does not exist"; btn.disabled=false; btn.innerText="Create Account & Send Verification Email"; return; }
    }catch(e){ console.log("disify api failed, continue"); }

    try{
      const deviceId=getDeviceId();
      const isWhitelisted=WHITELIST.includes(emailLow);

      if(!isWhitelisted){
        const existing=await db.collection("users").where("deviceId","==",deviceId).get();
        let blocked=false;
        existing.forEach(doc=>{
          const d=doc.data();
          const otherEmail=(d.emailLower||"").toLowerCase();
          // ONLY block if existing account is VERIFIED or is whitelisted - ignore unverified fakes
          const shouldCount = d.emailVerified===true || d.isWhitelisted===true;
          if(otherEmail!==emailLow && shouldCount){ blocked=true; }
        });
        if(blocked){
          errorEl.innerText="❌ 1 device = 1 account. This phone already has an account.";
          btn.disabled=false; btn.innerText="Create Account & Send Verification Email"; return;
        }
      }

      btn.innerText="Creating...";
      const cred=await auth.createUserWithEmailAndPassword(email,password);
      const user=cred.user;

      // === REAL VERIFICATION ===
      await user.sendEmailVerification();

      let referrerDoc=null; let referrerUsername=""; let canReward=false;
      let twentyFourHoursAgo=new Date(Date.now()-24*60*60*1000);
      if(referredByCode){
        const refQuery=await db.collection("users").where("username","==",referredByCode).limit(1).get();
        if(!refQuery.empty){
          referrerDoc=refQuery.docs[0]; referrerUsername=referrerDoc.data().username;
          if(!referrerDoc.data().referralBonusBlocked){
            try{ const recent=await db.collection("users").doc(referrerDoc.id).collection("referralDailyLogs").where("createdAt",">=",twentyFourHoursAgo).get(); canReward=recent.size<10; }catch(e){ canReward=true; }
          }
        }
      }
      const startingPoints=(referrerDoc&&canReward)?50:0;

      await db.collection("users").doc(user.uid).set({
        username: username, usernameLower: username.toLowerCase(),
        email: email, emailLower: emailLow,
        deviceId: deviceId, isWhitelisted: isWhitelisted,
        emailVerified: false,
        balance: startingPoints, points: startingPoints,
        usdt:0,bnb:0,xrp:0,xlm:0,
        invitedBy: referredByCode||"", referredBy: referredByCode||"",
        referralCount:0, totalReferralEarnings:0,
        isBanned:false, isDeactivated:false, referralBonusBlocked:false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      if(startingPoints>0){
        await db.collection("users").doc(user.uid).collection("earnHistory").add({
          action:'Referral Bonus', type:'referral', points:50,
          desc:'Referred by '+referrerUsername, description:'Referred by '+referrerUsername,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(), createdAt: new Date()
        });
      }
      if(referrerDoc&&canReward){
        const already=await db.collection("users").doc(referrerDoc.id).collection("earnHistory").where("desc","==","Invited "+username).get();
        if(already.empty){
          await referrerDoc.ref.update({ balance: firebase.firestore.FieldValue.increment(50), points: firebase.firestore.FieldValue.increment(50), referralCount: firebase.firestore.FieldValue.increment(1), totalReferralEarnings: firebase.firestore.FieldValue.increment(50) });
          await db.collection("users").doc(referrerDoc.id).collection("earnHistory").add({ action:'Referral Bonus', type:'referral', points:50, desc:'Invited '+username, description:'Invited '+username, timestamp: firebase.firestore.FieldValue.serverTimestamp(), createdAt: new Date() });
          await db.collection("users").doc(referrerDoc.id).collection("referralDailyLogs").add({ newUserId:user.uid, newUsername:username, createdAt:new Date(), bonusGiven:50, bonusGivenBool:true });
        }
      }

      successEl.innerText="✅ Verification email sent to "+email+"! Check inbox (and spam) and click the link, then Login.";
      btn.innerText="Email Sent - Check Inbox";
      await auth.signOut();
      setTimeout(()=>window.location.href='./index.html',4000);

    }catch(error){ errorEl.innerText=error.message; btn.disabled=false; btn.innerText="Create Account & Send Verification Email"; console.log(error); }
  }
</script>
</body>
</html>
