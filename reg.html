<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Reward Platform</title>
<style>
body{font-family:Arial;background:#f5f5f5;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.container{background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);width:90%;max-width:400px}
h2{text-align:center;color:#333}
.banner{background:#d4edda;color:#155724;padding:12px;border-radius:8px;margin-bottom:15px;text-align:center;font-weight:bold;display:none}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#28a745;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-weight:bold}
button:hover{background:#218838}
</style>
</head>
<body>
<div class="container">
<div id="refBanner" class="banner"></div>
<h2>Create Account</h2>
<input type="text" id="username" placeholder="Choose Username">
<input type="password" id="password" placeholder="Choose Password">
<button onclick="register()">Sign Up & Get 40 Points</button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const referrer = urlParams.get('ref');
if(referrer){
    document.getElementById('refBanner').style.display = 'block';
    document.getElementById('refBanner').innerText = `🎁 You were referred by ${referrer}! Both get points.`;
    localStorage.setItem('referrer', referrer);
}

function register(){
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    if(!username || !password){ alert('Fill all fields'); return; }
    
    let users = JSON.parse(localStorage.getItem('users') || '[]');
    if(users.find(u => u.username === username)){ alert('Username taken'); return; }
    
    const newUser = {username, password, points: 40, referrals: []};
    users.push(newUser);
    
    const ref = localStorage.getItem('referrer');
    if(ref){
        let referrerUser = users.find(u => u.username === ref);
        if(referrerUser){
            referrerUser.points += 50;
            referrerUser.referrals.push(username);
        }
    }
    
    localStorage.setItem('users', JSON.stringify(users));
    localStorage.setItem('currentUser', username);
    localStorage.removeItem('referrer');
    alert('Account created! +40 points. Redirecting...');
    window.location.href = 'home.html';
}
</script>
</body>
</html>
