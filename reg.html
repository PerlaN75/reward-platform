<!DOCTYPE html>
<html>
<head><title>Register</title></head>
<body>
<h2>Register</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<input id="refCode" placeholder="Referral Code - leave blank if none">
<button onclick="register()">Register</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d",
    storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abc123"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Generate a simple referral code from name + random
  function makeRefCode(name) {
    return name.toUpperCase() + Math.floor(Math.random() * 900 + 100);
  }

  async function register() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const referredBy = document.getElementById('refCode').value;
    
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const uid = userCredential.user.uid;
      const myReferralCode = makeRefCode(email.split('@')[0]); // e.g. PRIYA847

      // Create user doc - every user is a parent
      const userData = {
        email,
        referralCode: myReferralCode,
        referredBy: referredBy, // empty if they joined directly
        referrals: [], // list of UIDs they referred
        balance: 0,
        level: 1
      };
      await setDoc(doc(db, "users", uid), userData);

      // If someone referred this user, add them to that parent's referrals[]
      if(referredBy!== ""){
        // Find parent by referralCode
        const usersRef = doc(db, "users"); // we will query later. For now manual
        // TODO: we’ll add query logic in referrals.html
      }

      alert("Registered! Your referral code: " + myReferralCode);
      window.location.href = "log.html";
    } catch (e) {
      alert(e.message);
    }
  }
</script>
</body>
</html>
