<!DOCTYPE html>
<html>
<head>
  <title>Create Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { 
      background: #2f3e1a; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px;
    }
   .container { 
      background: #3a4a22; 
      padding: 35px 25px; 
      border-radius: 20px; 
      width: 100%; 
      max-width: 380px; 
      text-align: center; 
    }
    h2 { color: white; font-size: 30px; margin-bottom: 8px; font-weight: bold; }
   .tagline { color: #fbbf24; font-size: 14px; margin-bottom: 25px; }
    label { display: block; text-align: left; color: #ddd; margin: 15px 0 5px 5px; font-size: 15px; }
    input { 
      width: 100%; 
      padding: 14px; 
      background: #000; 
      border: 2px solid transparent;
      border-radius: 12px; 
      color: white; 
      font-size: 16px;
      outline: none;
    }
    input::placeholder { color: #666; }
    input:focus { border: 2px solid #f59e0b; }
    
    /* Hidden rules box */
   .rules {
      display: none;
      background: #1a1a1a;
      color: #ccc;
      font-size: 12px;
      text-align: left;
      padding: 10px;
      border-radius: 8px;
      margin-top: 5px;
      line-height: 1.6;
    }
   .rules.show { display: block; }
   .rules span { color: #22c55e; }

    .register-btn { 
      width: 100%; 
      padding: 15px; 
      margin: 20px 0 12px 0;
      background: #555; 
      color: black; 
      border: none; 
      border-radius: 12px; 
      cursor: not-allowed; 
      font-size: 18px; 
      font-weight: bold;
      transition: 0.3s;
    }
    .register-btn.active {
      background: #22c55e; /* green when valid */
      cursor: pointer;
    }
    .back-btn { 
      width: 100%; 
      padding: 14px; 
      background: #f59e0b; 
      color: black; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 16px; 
      font-weight: bold;
      margin-bottom: 15px;
    }
   .ref-box { 
      background: #000; 
      color: #22c55e; 
      padding: 12px; 
      border-radius: 10px; 
      font-size: 14px; 
      text-align: left;
      margin-bottom: 15px;
    }
   .login-link { color: #ccc; font-size: 14px; }
   .login-link a { color: #3b82f6; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <h2>Create Account</h2>
  <div class="tagline">🐒 From Nothing to Something 🍇</div>
  
  <label>Username</label>
  <input id="username" type="text" placeholder="John" onfocus="showRules('userRules')" onblur="hideRules('userRules')" oninput="checkForm()">
  <div id="userRules" class="rules">
    <span>•</span> Starting with capital letter<br>
    <span>•</span> Lowercase letters only<br>
    <span>•</span> No numbers or characters
  </div>
  
  <label>Password</label>
  <input id="password" type="password" onfocus="showRules('passRules')" onblur="hideRules('passRules')" oninput="checkForm()">
  <div id="passRules" class="rules">
    <span>•</span> 4-8 characters<br>
    <span>•</span> At least 1 capital letter<br>
    <span>•</span> At least 1 digit number<br>
    <span>•</span> At least 1 character: $ & # @ ? ! %
  </div>
  
  <label>Confirm Password</label>
  <input id="confirmPassword" type="password" oninput="checkForm()">
  
  <button id="registerBtn" class="register-btn" onclick="register()">Register</button>
  <button class="back-btn" onclick="window.location.href='home.html'">← Back</button>
  
  <div class="ref-box" id="refDisplay">Ref from URL: null</div>
  
  <div class="login-link">Already have account? <a href="log.html">Login Here</a></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, collection, query, where, getDocs, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d",
    storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abc123"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const refFromUrl = urlParams.get('ref');
  document.getElementById('refDisplay').innerText = `Ref from URL: ${refFromUrl || 'null'}`;

  function showRules(id){ document.getElementById(id).classList.add('show'); }
  function hideRules(id){ document.getElementById(id).classList.remove('show'); }

  function makeRefCode(name) {
    return name.toUpperCase() + Math.floor(Math.random() * 900 + 100);
  }

  function validateUsername(u){
    const regex = /^[A-Z][a-z]+$/; // Capital + lowercase only
    return regex.test(u);
  }

  function validatePassword(p){
    const lengthOk = p.length >= 4 && p.length <= 8;
    const hasCapital = /[A-Z]/.test(p);
    const hasDigit = /[0-9]/.test(p);
    const hasSpecial = /[\$&#@?!\%]/.test(p);
    return lengthOk && hasCapital && hasDigit && hasSpecial;
  }

  window.checkForm = function() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('registerBtn');

    const valid = validateUsername(username) && validatePassword(password) && password === confirmPassword && password !== "";
    
    if(valid){
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  }

  window.register = async function() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const referredBy = refFromUrl;
    const btn = document.getElementById('registerBtn');

    if(!btn.classList.contains('active')) return;

    const email = username + "@reward.com";

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const uid = userCredential.user.uid;
      const myReferralCode = makeRefCode(username);

      const userData = {
        username,
        email,
        referralCode: myReferralCode,
        referredBy: referredBy,
        referrals: [],
        balance: 0,
        level: 1
      };
      await setDoc(doc(db, "users", uid), userData);

      if(referredBy){
        const q = query(collection(db, "users"), where("referralCode", "==", referredBy));
        const querySnapshot = await getDocs(q);
        querySnapshot.forEach((parentDoc) => {
          updateDoc(doc(db, "users", parentDoc.id), {
            referrals: arrayUnion(uid),
            balance: parentDoc.data().balance + 50
          });
        });
      }

      alert("Registered! Your referral code: " + myReferralCode + " 🐒");
      window.location.href = "home.html";
    } catch (e) {
      alert(e.message);
    }
  }
</script>
</body>
</html>
