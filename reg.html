<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: white; padding: 30px 25px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    h2 { text-align: center; margin-bottom: 20px; color: #2f3e1a; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    button { width: 100%; padding: 12px; margin-top: 15px; background: #4a5d23; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #3a4a1c; }
    .link { text-align: center; margin-top: 15px; font-size: 14px; }
    .link a { color: #4a5d23; text-decoration: none; font-weight: bold; }
    .error { color: red; text-align: center; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🐒 Create Account 🍇</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="register()">Register</button>
    <div class="error" id="errorMsg"></div>
    <div class="link">Already have account? <a href="log.html">Login</a></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"; // <-- ONLY NEW IMPORT

  const firebaseConfig = { 
    apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", 
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com", 
    projectId: "reward-platform-rw-2e13d"
  };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app);
  const db = getFirestore(app); // <-- ONLY NEW LINE

  window.register = async function() { // <-- CHANGED TO async
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMsg');
    errorDiv.innerText = "";

    try {
      // 1. Create Auth account - YOUR OLD CODE
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // 2. SAVE TO FIRESTORE - ONLY NEW CODE ADDED HERE
      await setDoc(doc(db, "users", user.uid), {
        username: username,
        email: email,
        balance: 0,
        referralCode: username.toUpperCase() + Math.floor(Math.random()*1000),
        createdAt: new Date()
      });

      alert("Registration Success! Welcome " + username + " 🐒");
      window.location.href = "log.html";
    } catch (e) {
      errorDiv.innerText = "Error: " + e.message;
    }
  }
</script>
</body>
</html>
