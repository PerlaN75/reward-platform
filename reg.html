<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; flex-direction: column; }
    
    .container { background: #3a4a22; padding: 60px 20px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; margin-bottom: 15px; }
    
    h2 { color: white; font-size: 28px; margin-bottom: 5px; font-weight: bold; }
    .tagline { color: #fbbf24; font-size: 13px; margin-bottom: 20px; }
    
    label { display: block; text-align: left; color: #ddd; margin: 12px 0 4px 4px; font-size: 14px; }
    input { width: 100%; padding: 11px 14px; background: #000; border: 2px solid transparent; border-radius: 10px; color: white; font-size: 15px; outline: none; }
    input::placeholder { color: #666; }
    input:focus { border: 2px solid #f59e0b; }
    
    .reg-btn { width: 100%; padding: 13px; margin: 16px 0 10px 0; background: linear-gradient(90deg, #fbbf24, #f59e0b, #ec4899); color: black; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; }
    
    .back-btn { width: 40%; max-width: 140px; padding: 11px; background: #f59e0b; color: black; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: bold; }
    
    .login-link { color: #ccc; font-size: 13px; margin-top: 12px; }
    .login-link a { color: #3b82f6; text-decoration: none; font-weight: bold; }
    .error { color: #ef4444; font-size: 12px; margin-top: 8px; }
    
    /* NEW: RULES BOX - MATCHES YOUR DESIGN */
    .rules-box { background: #1a2410; padding: 10px; border-radius: 8px; margin-top: 6px; text-align: left; display: none; }
    .rule { font-size: 12px; color: #aaa; margin: 4px 0; }
    .rule.valid { color: #22c55e; } /* green */
    .rule.valid::before { content: "✓ "; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <h2>Register</h2>
  <div class="tagline">🐒 From Nothing to Something 🍇</div>
  
  <label>Username</label>
  <input id="username" type="text" placeholder="Choose username">
  <div id="userRules" class="rules-box">
    <div id="u_len" class="rule">3-15 characters</div>
  </div>
  
  <label>Email</label>
  <input id="email" type="email" placeholder="you@gmail.com">
  
  <label>Password</label>
  <input id="password" type="password" placeholder="Min 6 characters">
  <div id="passRules" class="rules-box">
    <div id="p_len" class="rule">At least 6 characters</div>
  </div>
  
  <button class="reg-btn" onclick="register()">REGISTER</button>
  
  <div class="login-link">Already have account? <a href="log.html">Login Here</a></div>
  <div id="errorMsg" class="error"></div>
</div>

<button class="back-btn" onclick="window.location.href='index.html'">← Back</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d" };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app);
  const db = getFirestore(app);

  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');

  // LIVE CHECK USERNAME
  usernameInput.addEventListener('input', () => {
    const val = usernameInput.value;
    if(val.length > 0) document.getElementById('userRules').style.display = 'block'; else document.getElementById('userRules').style.display = 'none';
    
    if(val.length >= 3 && val.length <= 15) {
      document.getElementById('u_len').classList.add('valid');
    } else {
      document.getElementById('u_len').classList.remove('valid');
    }
  });
  
  usernameInput.addEventListener('blur', () => {
    const val = usernameInput.value;
    if(val.length >= 3 && val.length <= 15) document.getElementById('userRules').style.display = 'none';
  });

  // LIVE CHECK PASSWORD
  passwordInput.addEventListener('input', () => {
    const val = passwordInput.value;
    if(val.length > 0) document.getElementById('passRules').style.display = 'block'; else document.getElementById('passRules').style.display = 'none';
    
    if(val.length >= 6) {
      document.getElementById('p_len').classList.add('valid');
    } else {
      document.getElementById('p_len').classList.remove('valid');
    }
  });
  
  passwordInput.addEventListener('blur', () => {
    const val = passwordInput.value;
    if(val.length >= 6) document.getElementById('passRules').style.display = 'none';
  });
  
  window.register = async function() {
    const username = usernameInput.value;
    const email = document.getElementById('email').value;
    const password = passwordInput.value;
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.innerText = "";
    
    if(username.length < 3 || username.length > 15) { errorMsg.innerText = "Username must be 3-15 characters"; return; }
    if(password.length < 6) { errorMsg.innerText = "Password must be at least 6 characters"; return; }
    
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "users", userCredential.user.uid), {
        username: username,
        email: email,
        balance: 0
      });
      
      localStorage.setItem('username', username);
      window.location.href = "home.html";
    } catch (e) {
      errorMsg.innerText = e.message;
    }
  }
</script>
</body>
</html>
