<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; flex-direction: column; }
    
    .container { background: #3a4a22; padding: 40px 25px; border-radius: 25px; width: 100%; max-width: 400px; text-align: center; margin-bottom: 20px; }
    
    h2 { color: white; font-size: 32px; margin-bottom: 5px; font-weight: bold; }
    .tagline { color: #fbbf24; font-size: 14px; margin-bottom: 30px; }
    
    label { display: block; text-align: left; color: #ddd; margin: 15px 0 6px 4px; font-size: 15px; font-weight: 500; }
    
    .input-row { display: flex; gap: 8px; align-items: center; }
    input { width: 100%; padding: 14px 16px; background: #000; border: 2px solid transparent; border-radius: 12px; color: white; font-size: 15px; outline: none; }
    input::placeholder { color: #666; }
    input:focus { border: 2px solid #f59e0b; }
    
    .verify-btn { padding: 14px 18px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px; white-space: nowrap; }
    .verify-btn:disabled { background: #555; cursor: not-allowed; }
    
    .register-btn { width: 100%; padding: 16px; margin: 25px 0 15px 0; background: linear-gradient(90deg, #fbbf24, #f59e0b, #ec4899); color: black; border: none; border-radius: 12px; cursor: pointer; font-size: 17px; font-weight: bold; }
    .register-btn:disabled { background: #555; color: #888; cursor: not-allowed; }
    
    .back-btn { width: 40%; max-width: 160px; padding: 14px; background: #f59e0b; color: black; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; }
    
    .login-link { color: #ccc; font-size: 14px; margin-top: 10px; }
    .login-link a { color: #3b82f6; text-decoration: none; font-weight: bold; }
    .referral-banner { background: #065f46; color: #d1fae5; padding: 12px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; font-weight: bold; }
    .error { color: #ef4444; font-size: 13px; margin-top: 10px; }
    .status { font-size: 13px; margin-top: 6px; text-align: left; }
    
    /* HIDDEN RULES - HIDES WHEN ALL VALID */
    .rules { text-align: left; margin-top: 8px; font-size: 12px; display: none; }
    .rules.show { display: block; }
    .rule { color: #888; margin: 4px 0; transition: 0.3s; }
    .rule.valid { color: #22c55e; font-weight: bold; }
    .rule.valid::before { content: "✅ "; }
    .rule::before { content: "⭕ "; }
  </style>
</head>
<body>

<div class="container">
  <h2>Register</h2>
  <div class="tagline">🐒 From Nothing to Something 🍇</div>
  
  <div id="referralBanner" class="referral-banner" style="display:none;"></div>
  
  <label>Username</label>
  <input id="username" type="text" placeholder="Choose username" onfocus="showRules('uRules')" oninput="checkUsername()">
  <div id="uRules" class="rules">
    <div id="u1" class="rule">5-12 characters</div>
    <div id="u2" class="rule">Only letters</div>
    <div id="u3" class="rule">First letter CAPITAL</div>
  </div>
  
  <label>Email</label>
  <div class="input-row">
    <input id="email" type="email" placeholder="your@gmail.com">
    <button class="verify-btn" id="verifyBtn" onclick="sendOTP()">Verify</button>
  </div>
  <input id="otp" type="text" placeholder="Enter 6 digit code" style="margin-top:10px; display:none;" oninput="checkOTP()">
  <div id="emailStatus" class="status"></div>
  
  <label>Password</label>
  <input id="password" type="password" placeholder="Min 6 characters" onfocus="showRules('pRules')" oninput="checkPassword()">
  <div id="pRules" class="rules">
    <div id="p1" class="rule">Min 6 characters</div>
    <div id="p2" class="rule">At least 1 Capital letter</div>
    <div id="p3" class="rule">At least 1 digit</div>
    <div id="p4" class="rule">At least 1 special: $ & # @ + % = ? !</div>
  </div>
  
  <button class="register-btn" id="createBtn" onclick="register()" disabled>Create Account</button>
  
  <div class="login-link">Already have account? <a href="log.html">Login Here</a></div>
  <div id="errorMsg" class="error"></div>
</div>

<button class="back-btn" onclick="window.location.href='index.html'">← Back</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, updateDoc, increment, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { 
    apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", 
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com", 
    projectId: "reward-platform-rw-2e13d" 
  };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app);
  const db = getFirestore(app);

  let emailVerified = false;
  let generatedOTP = "";
  let usernameValid = false;
  let passwordValid = false;

  const params = new URLSearchParams(window.location.search);
  const refUsername = params.get('ref');
  if(refUsername){
    document.getElementById('referralBanner').style.display = 'block';
    document.getElementById('referralBanner').innerText = `🎁 You were referred by ${refUsername}! Both get points.`;
  }

  window.showRules = function(id){
    document.getElementById(id).classList.add('show');
  }

  function checkCanSubmit(){
    document.getElementById('createBtn').disabled = !(usernameValid && passwordValid && emailVerified);
  }

  window.checkUsername = function(){
    const u = document.getElementById('username').value;
    const r1 = u.length >= 5 && u.length <= 12;
    const r2 = /^[A-Za-z]+$/.test(u);
    const r3 = /^[A-Z]/.test(u);
    
    document.getElementById('u1').classList.toggle('valid', r1);
    document.getElementById('u2').classList.toggle('valid', r2);
    document.getElementById('u3').classList.toggle('valid', r3);
    
    usernameValid = r1 && r2 && r3;
    // HIDE RULES IF ALL VALID
    if(usernameValid) document.getElementById('uRules').classList.remove('show');
    checkCanSubmit();
  }

  window.checkPassword = function(){
    const p = document.getElementById('password').value;
    const r1 = p.length >= 6;
    const r2 = /[A-Z]/.test(p);
    const r3 = /[0-9]/.test(p);
    const r4 = /[\$&#@+%=?!]/.test(p);
    
    document.getElementById('p1').classList.toggle('valid', r1);
    document.getElementById('p2').classList.toggle('valid', r2);
    document.getElementById('p3').classList.toggle('valid', r3);
    document.getElementById('p4').classList.toggle('valid', r4);
    
    passwordValid = r1 && r2 && r3 && r4;
    // HIDE RULES IF ALL VALID
    if(passwordValid) document.getElementById('pRules').classList.remove('show');
    checkCanSubmit();
  }

  window.sendOTP = async function(){
    const email = document.getElementById('email').value.trim();
    if(!email.includes('@')){
      document.getElementById('errorMsg').innerText = "Enter valid email first";
      return;
    }
    generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
    document.getElementById('otp').style.display = 'block';
    document.getElementById('emailStatus').innerHTML = `Code sent. Check console: <b>${generatedOTP}</b>`; // REMOVE IN PROD
    console.log("OTP:", generatedOTP);
    document.getElementById('verifyBtn').innerText = "Resend";
  }

  window.checkOTP = function(){
    const entered = document.getElementById('otp').value;
    const status = document.getElementById('emailStatus');
    if(entered.length === 6){
      if(entered === generatedOTP){
        emailVerified = true;
        status.innerHTML = "✅ <span style='color:#22c55e'>Email Verified</span>";
      } else {
        emailVerified = false;
        status.innerHTML = "❌ <span style='color:#ef4444'>Unverified</span>";
      }
    } else {
      emailVerified = false;
      status.innerHTML = "";
    }
    checkCanSubmit();
  }

  window.register = async function() {
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.innerText = "";

    if(!emailVerified){
      errorMsg.innerText = "Please verify email with code first";
      return;
    }

    try {
      const userCred = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCred.user;

      await setDoc(doc(db, "users", user.uid), {
        username: username,
        email: email,
        balance: 0,
        referredBy: refUsername || null,
        createdAt: new Date()
      });

      if(refUsername){
        const usersRef = collection(db, "users");
        const q = query(usersRef, where("username", "==", refUsername));
        const snap = await getDocs(q);
        snap.forEach(async (d) => {
          await updateDoc(doc(db, "users", d.id), { balance: increment(100) });
        });
        await updateDoc(doc(db, "users", user.uid), { balance: increment(100) });
      }

      alert("Account created successfully!");
      window.location.href = "home.html";
      
    } catch (e) {
      errorMsg.innerText = e.message;
    }
  }
</script>
</body>
</html>
