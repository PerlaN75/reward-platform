<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; flex-direction: column; }
    .container { background: #3a4a22; padding: 60px 20px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; margin-bottom: 15px; }
    h2 { color: white; font-size: 28px; margin-bottom: 5px; font-weight: bold; }
    .tagline { color: #fbbf24; font-size: 13px; margin-bottom: 20px; }
    .ref-banner { background: #1a2410; border: 1px solid #22c55e; color: #22c55e; padding: 8px; border-radius: 8px; font-size: 12px; margin-bottom: 15px; display: none; } /* NEW */
    label { display: block; text-align: left; color: #ddd; margin: 12px 0 4px 4px; font-size: 14px; }
    input { width: 100%; padding: 11px 14px; background: #000; border: 2px solid transparent; border-radius: 10px; color: white; font-size: 15px; outline: none; }
    input::placeholder { color: #666; } input:focus { border: 2px solid #f59e0b; }
    .email-row { display: flex; gap: 8px; align-items: center; }
    .email-row input { flex: 1; }
    .verify-btn { padding: 11px 12px; background: #3b82f6; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: bold; white-space: nowrap; }
    .verify-btn:disabled { background: #22c55e; cursor: default; }
    .reg-btn { width: 100%; padding: 13px; margin: 16px 0 10px 0; background: linear-gradient(90deg, #fbbf24, #f59e0b, #ec4899); color: black; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; }
    .reg-btn:disabled { background: #555; color: #999; cursor: not-allowed; }
    .back-btn { width: 40%; max-width: 140px; padding: 11px; background: #f59e0b; color: black; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: bold; }
    .login-link { color: #ccc; font-size: 13px; margin-top: 12px; }
    .login-link a { color: #3b82f6; text-decoration: none; font-weight: bold; }
    .error { color: #ef4444; font-size: 12px; margin-top: 8px; }
    .success { color: #22c55e; font-size: 12px; margin-top: 8px; }
    .rules-box { background: #1a2410; padding: 10px; border-radius: 8px; margin-top: 6px; text-align: left; display: none; }
    .rule { font-size: 12px; color: #aaa; margin: 4px 0; }
    .rule.valid { color: #22c55e; }
    .rule.valid::before { content: "✓ "; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <h2>Register</h2>
  <div class="tagline">🐒 From Nothing to Something 🍇</div>
  <div id="refBanner" class="ref-banner"></div> <!-- NEW -->
  
  <label>Username</label>
  <input id="username" type="text" placeholder="Choose username">
  <div id="userRules" class="rules-box">
    <div id="u_len" class="rule">3-15 characters</div>
    <div id="u_cap" class="rule">First letter capital</div>
    <div id="u_low" class="rule">Remaining letters lowercase</div>
  </div>
  
  <label>Email</label>
  <div class="email-row">
    <input id="email" type="email" placeholder="you@gmail.com">
    <button class="verify-btn" id="verifyBtn" onclick="sendOTP()">Verify</button>
  </div>
  
  <label>Verification Code</label>
  <input id="otp" type="text" placeholder="Enter 6 digit code" maxlength="6">
  
  <label>Password</label>
  <input id="password" type="password" placeholder="Min 6 characters">
  <div id="passRules" class="rules-box">
    <div id="p_len" class="rule">4-12 characters</div>
    <div id="p_cap" class="rule">1 Capital letter</div>
    <div id="p_num" class="rule">1 Number</div>
    <div id="p_char" class="rule">1 Special character !@#$%</div>
  </div>
  
  <button class="reg-btn" id="createBtn" onclick="register()" disabled>Create Account</button>
  
  <div class="login-link">Already have account? <a href="log.html">Login Here</a></div>
  <div id="msg" class="error"></div>
</div>

<button class="back-btn" onclick="window.location.href='index.html'">← Back</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, collection, query, where, getDocs, addDoc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"; // NEW IMPORTS

  const firebaseConfig = { apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d" };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app);
  const db = getFirestore(app);

  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const emailInput = document.getElementById('email');
  const otpInput = document.getElementById('otp');
  const verifyBtn = document.getElementById('verifyBtn');
  const createBtn = document.getElementById('createBtn');
  const msg = document.getElementById('msg');
  
  let generatedOTP = "";
  let isEmailVerified = false;
  let referrerName = null; // NEW

  // NEW: READ REFERRER FROM URL
  const urlParams = new URLSearchParams(window.location.search);
  referrerName = urlParams.get('ref');
  if(referrerName){
    document.getElementById('refBanner').innerText = `You were referred by ${referrerName}!`;
    document.getElementById('refBanner').style.display = 'block';
  }

  // YOUR CODE STARTS HERE - UNCHANGED
  usernameInput.addEventListener('input', () => {
    const val = usernameInput.value;
    if(val.length > 0) document.getElementById('userRules').style.display = 'block'; else document.getElementById('userRules').style.display = 'none';
    document.getElementById('u_len').classList.toggle('valid', val.length >= 3 && val.length <= 15);
    document.getElementById('u_cap').classList.toggle('valid', /^[A-Z]/.test(val));
    document.getElementById('u_low').classList.toggle('valid', /^[A-Z][a-z]*$/.test(val) && val.length > 0);
  });
  usernameInput.addEventListener('blur', () => { if(/^[A-Z][a-z]{2,14}$/.test(usernameInput.value)) document.getElementById('userRules').style.display = 'none'; });

  passwordInput.addEventListener('input', () => {
    const val = passwordInput.value;
    if(val.length > 0) document.getElementById('passRules').style.display = 'block'; else document.getElementById('passRules').style.display = 'none';
    document.getElementById('p_len').classList.toggle('valid', val.length >= 4 && val.length <= 12);
    document.getElementById('p_cap').classList.toggle('valid', /[A-Z]/.test(val));
    document.getElementById('p_num').classList.toggle('valid', /[0-9]/.test(val));
    document.getElementById('p_char').classList.toggle('valid', /[!@#$%^&*]/.test(val));
  });
  passwordInput.addEventListener('blur', () => { 
    const val = passwordInput.value;
    if(val.length >= 4 && val.length <= 12 && /[A-Z]/.test(val) && /[0-9]/.test(val) && /[!@#$%^&*]/.test(val)) 
      document.getElementById('passRules').style.display = 'none';
  });

  otpInput.addEventListener('input', () => {
    if(otpInput.value === generatedOTP && generatedOTP !== ""){
      isEmailVerified = true;
      createBtn.disabled = false;
      msg.innerText = "Email verified! You can now Create Account";
      msg.className = "success";
      verifyBtn.innerText = "Verified ✓";
      verifyBtn.disabled = true;
    }
  });

  window.sendOTP = function() {
    const email = emailInput.value;
    if(!email) { msg.innerText = "Enter email first"; return; }
    generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
    msg.innerText = `OTP: ${generatedOTP} - Sent to ${email}. Check email.`;
    msg.className = "success";
    verifyBtn.innerText = "Resend";
    alert(`Your verification code is: ${generatedOTP}`); 
  }
  
  window.register = async function() {
    const username = usernameInput.value;
    const email = emailInput.value;
    const password = passwordInput.value;
    msg.innerText = "";
    
    if(!isEmailVerified) { msg.innerText = "Please enter correct OTP first"; return; }
    if(!/^[A-Z][a-z]{2,14}$/.test(username)) { msg.innerText = "Username: First capital, rest lowercase, 3-15 chars"; return; }
    if(!(password.length >= 4 && password.length <= 12 && /[A-Z]/.test(password) && /[0-9]/.test(password) && /[!@#$%^&*]/.test(password))) { 
      msg.innerText = "Password must have: 4-12 chars, 1 capital, 1 number, 1 special char"; return; 
    }
    
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const uid = userCredential.user.uid;
      
      await setDoc(doc(db, "users", uid), { username: username, email: email, balance: 0, referredBy: referrerName || null, createdAt: serverTimestamp() }); // NEW: added referredBy
      
      if(referrerName){ // NEW: GIVE POINTS
        await addDoc(collection(db, "referrals"), { referrer: referrerName, referee: username, refereeUID: uid, status: "active", createdAt: serverTimestamp() });
        const q = query(collection(db, "users"), where("username", "==", referrerName));
        const querySnapshot = await getDocs(q);
        querySnapshot.forEach(async (docSnap) => { await updateDoc(doc(db, "users", docSnap.id), { balance: increment(50) }); });
      }
      
      localStorage.setItem('username', username);
      msg.innerText = "Account Created!";
      msg.className = "success";
      setTimeout(() => window.location.href = "home.html", 1500);
    } catch (e) {
      msg.innerText = e.message;
    }
  }
</script>
</body>
</html>
