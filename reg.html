<!DOCTYPE html>
<html>
<head>
<title>Register - Protected</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.google.com/recaptcha/enterprise.js?render=6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#2f3e1a;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:60px 20px 20px}
.register-card{background:#4a6128;padding:30px 25px;border-radius:20px;width:100%;max-width:400px;text-align:center;border:3px solid #fbbf24}
.logo{font-size:60px;margin-bottom:10px;filter:drop-shadow(0 0 8px #fbbf24)}
h1{color:#fbbf24;font-size:28px;margin-bottom:8px}
.tagline{color:#fff;font-size:13px;margin-bottom:25px}
input{width:100%;padding:15px;margin:10px 0;background:#1a2410;border:1px solid #333;border-radius:10px;color:white;font-size:15px}
input::placeholder{color:#888}
.btn-register{width:100%;padding:16px;background:linear-gradient(180deg,#fbbf24,#f59e0b);color:#000;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:15px;box-shadow:0 4px 0 #d97706}
.btn-register:active{transform:translateY(2px);box-shadow:0 2px 0 #d97706}
.btn-register:disabled{opacity:0.6;cursor:not-allowed}
.link-login{color:#fbbf24;margin-top:15px;font-size:14px;cursor:pointer}
.error{color:#ef4444;font-size:13px;margin-top:10px}
.success{color:#22c55e;font-size:14px;margin-top:10px;font-weight:bold}
.btn-back-outside{width:40%;padding:14px;background:white;color:black;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:40px;box-shadow:0 3px 0 #ccc}
.recaptcha-note{font-size:10px;color:#aaa;margin-top:12px}
.pass-hint{font-size:11px;color:#fbbf24;text-align:left;margin:-5px 0 5px 5px}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div class="register-card">
<div class="logo">📝</div>
<h1>Register</h1>
<div class="tagline">Create Account - Secured & Verified</div>
<input type="text" id="username" placeholder="Username (letters only)" oninput="formatUsername()">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password (5-10 chars)">
<div class="pass-hint">Needs: 1 Capital, 1 Number, 1 Special (!@#)</div>
<input type="password" id="confirmPassword" placeholder="Confirm Password">
<input type="text" id="referral" placeholder="Referral Code (optional)">
<button class="btn-register" id="regBtn" onclick="register()">Create Account</button>
<div class="link-login" onclick="window.location.href='./log.html'">Already have account? Login</div>
<div class="recaptcha-note">Protected by reCAPTCHA Enterprise + App Check (Score 0.5)</div>
<div class="error" id="error"></div>
<div class="success" id="success"></div>
</div>
<button class="btn-back-outside" onclick="window.location.href='./index.html'">Back</button>

<script>
async function getRecaptchaToken(action){
  return new Promise((resolve)=>{
    if(!window.grecaptcha ||!grecaptcha.enterprise){ resolve(null); return; }
    grecaptcha.enterprise.ready(async ()=>{
      try{
        const t = await grecaptcha.enterprise.execute('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', {action: action});
        resolve(t);
      }catch(e){ resolve(null); }
    });
  });
}

const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d",storageBucket:"reward-platform-rw-2e13d.firebasestorage.app",messagingSenderId:"787550951987",appId:"1:787550951987:web:724b1463e821b99c90a146"};
firebase.initializeApp(firebaseConfig);
// APP CHECK ACTIVATION - FREE BACKEND
const appCheck = firebase.appCheck();
appCheck.activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', true);

const auth=firebase.auth();
const db=firebase.firestore();

function getDeviceId(){
  let id=localStorage.getItem('deviceId');
  if(!id){ id=Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('deviceId',id); }
  return id;
}
function formatUsername(){
  let el=document.getElementById('username');
  let val=el.value.replace(/[^a-zA-Z]/g,'');
  el.value=val.charAt(0).toUpperCase()+val.slice(1).toLowerCase();
}
function validatePassword(p){
  if(p.length<5||p.length>10) return "Password must be 5-10 chars";
  if(!/[A-Z]/.test(p)) return "Need 1 capital letter";
  if(!/[0-9]/.test(p)) return "Need 1 number";
  if(!/[!@#$%^&*(),.?\":{}|<>]/.test(p)) return "Need 1 special char";
  return null;
}
let isRegistering=false;
async function register(){
  if(isRegistering) return;
  const username=document.getElementById('username').value.trim();
  const email=document.getElementById('email').value.trim();
  const emailLow=email.toLowerCase();
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirmPassword').value;
  const referral=document.getElementById('referral').value.trim();
  const errEl=document.getElementById('error');
  const sucEl=document.getElementById('success');
  const btn=document.getElementById('regBtn');
  errEl.innerText=""; sucEl.innerText="";
  if(!username||!email||!password||!confirm){ errEl.innerText="Fill all fields"; return; }
  if(username.length<3){ errEl.innerText="Username min 3 letters"; return; }
  const passErr=validatePassword(password);
  if(passErr){ errEl.innerText=passErr; return; }
  if(password!==confirm){ errEl.innerText="Passwords don't match"; return; }

  isRegistering=true;
  btn.disabled=true;
  btn.innerText="Checking security...";

  const token=await getRecaptchaToken('REGISTER');
  if(!token){
    errEl.innerText="Security check failed. Reload.";
    isRegistering=false; btn.disabled=false; btn.innerText="Create Account";
    return;
  }
  btn.innerText="Creating...";
  try{
    // check username exists
    const userSnap=await db.collection("users").where("username","==",username).get();
    if(!userSnap.empty) throw new Error("Username taken");

    const cred=await auth.createUserWithEmailAndPassword(email,password);
    const uid=cred.user.uid;

    try{ await cred.user.sendEmailVerification(); }catch(e){}

    const deviceId=getDeviceId();
    const userData={
      username:username,
      email:email,
      emailLower:emailLow,
      balance:0,
      referralCount:0,
      referralCode:username.toUpperCase()+Math.floor(100+Math.random()*900),
      referredBy:referral||null,
      deviceId:deviceId,
      emailVerified:false,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    await db.collection("users").doc(uid).set(userData);

    if(referral){
      try{
        const refSnap=await db.collection("users").where("referralCode","==",referral).get();
        if(!refSnap.empty){
          const refDoc=refSnap.docs[0];
          await db.collection("users").doc(refDoc.id).update({
            referralCount: firebase.firestore.FieldValue.increment(1),
            balance: firebase.firestore.FieldValue.increment(50)
          });
        }
      }catch(e){}
    }

    sucEl.innerText="✅ Account created! Verify email then login.";
    await auth.signOut();
    setTimeout(()=>{ window.location.href='./log.html'; },2000);
  }catch(e){
    if(e.code==='auth/email-already-in-use') errEl.innerText="Email already registered";
    else errEl.innerText=e.message;
  }finally{
    isRegistering=false; btn.disabled=false; btn.innerText="Create Account";
  }
}
</script>
</body>
</html>
