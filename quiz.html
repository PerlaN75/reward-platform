<!DOCTYPE html>
<html>
<head>
  <title>Daily Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; padding: 20px; color: white; text-align: center; }
  .quiz-box { background: #4a6128; border: 3px solid #fbbf24; border-radius: 20px; padding: 25px; max-width: 500px; margin: 40px auto; }
  .quiz-title { font-size: 24px; color: #fbbf24; margin-bottom: 10px; }
  .quiz-subtitle { color: #ccc; font-size: 13px; margin-bottom: 20px; }
  .timer-box { font-size: 32px; color: #fbbf24; font-weight: bold; margin-bottom: 15px; }
  .timer-box.danger { color: #ef4444; }
  .question-num { font-size: 14px; color: #fbbf24; margin-bottom: 15px; }
  .question-text { font-size: 18px; font-weight: bold; margin-bottom: 20px; line-height: 1.4; }
  .option-btn { width: 100%; padding: 15px; margin: 8px 0; background: #1a2410; color: white; border: 2px solid #333; border-radius: 12px; font-size: 15px; cursor: pointer; text-align: left; transition: 0.2s; }
  .option-btn:hover { border-color: #fbbf24; }
  .option-btn.correct { background: #22c55e; border-color: #4ade80; }
  .option-btn.wrong { background: #ef4444; border-color: #f87171; }
  .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }
  .result-box { font-size: 18px; margin: 15px 0; font-weight: bold; }
  .result-box.correct { color: #4ade80; }
  .result-box.wrong { color: #f87171; }
  .back-btn { width: 100%; padding: 16px; background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #d97706; margin-top: 15px; }
  .back-btn:active { transform: translateY(2px); }
  .done-msg { font-size: 20px; color: #4ade80; margin: 20px 0; font-weight: bold; }
  .done-sub { color: #ccc; font-size: 14px; }
  </style>
</head>
<body>
  <div class="quiz-box">

    <div class="quiz-subtitle">1 Question Per Day • 1 Minute • +10 Points</div>

      <div>Loading...</div>
    </div>
  </div>

  const firebaseConfig = { apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d" };
  const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

    {q: "What year did man land on moon?", a: "1969", options: ["1968", "1969", "1970", "1971"]},

    {q: "How many bits in a byte?", a: "8", options: ["4", "8", "16", "32"]},
    {q: "What is the main gas in natural gas?", a: "Methane", options: ["Ethane", "Methane", "Propane", "Butane"]},
    {q: "Who painted The Starry Night?", a: "Van Gogh", options: ["Picasso", "Van Gogh", "Monet", "Rembrandt"]},
    {q: "What is the derivative of x^2?", a: "2x", options: ["x", "2x", "x^2", "2"]},
    {q: "Which country is landlocked?", a: "Switzerland", options: ["Spain", "Switzerland", "Portugal", "Greece"]},
    {q: "What is the symbol for Potassium?", a: "K", options: ["P", "K", "Po", "Pt"]},

    {q: "What is capital of Egypt?", a: "Cairo", options: ["Alexandria", "Cairo", "Luxor", "Giza"]},
    {q: "What is 1000 / 25?", a: "40", options: ["25", "40", "50", "100"]},
    {q: "Which is not a programming paradigm?", a: "Quantum", options: ["OOP", "Functional", "Quantum", "Procedural"]},
    {q: "What is the largest organ?", a: "Skin", options: ["Liver", "Skin", "Brain", "Heart"]},
    {q: "Who wrote 'Pride and Prejudice'?", a: "Austen", options: ["Bronte", "Austen", "Eliot", "Woolf"]},
    {q: "What is 2 + 2 x 2?", a: "6", options: ["4", "6", "8", "10"]},
    {q: "Capital of Turkey?", a: "Ankara", options: ["Istanbul", "Ankara", "Izmir", "Bursa"]},
    {q: "How many feet in mile?", a: "5280", options: ["5280", "4840", "6080", "4000"]},
    {q: "What is H2O2 called?", a: "Hydrogen Peroxide", options: ["Water", "Hydrogen Peroxide", "Ozone", "Acid"]},
    {q: "Who discovered gravity?", a: "Newton", options: ["Newton", "Einstein", "Galileo", "Kepler"]},
    {q: "What is the 5th Fibonacci number?", a: "5", options: ["3", "5", "8", "13"]},
    {q: "Capital of Argentina?", a: "Buenos Aires", options: ["Lima", "Buenos Aires", "Santiago", "Bogota"]},
    {q: "How many valence electrons in Carbon?", a: "4", options: ["2", "4", "6", "8"]},
    {q: "What is π to 2 decimal places?", a: "3.14", options: ["3.12", "3.14", "3.16", "3.18"]},
    {q: "Who wrote 'Hamlet'?", a: "Shakespeare", options: ["Marlowe", "Shakespeare", "Chaucer", "Spenser"]},
    {q: "What is the capital of Norway?", a: "Oslo", options: ["Stockholm", "Oslo", "Copenhagen", "Helsinki"]},
    {q: "How many keys on piano?", a: "88", options: ["76", "88", "104", "120"]},
    {q: "What is NaCl?", a: "Salt", options: ["Sugar", "Salt", "Water", "Acid"]},
    {q: "Who founded Microsoft?", a: "Bill Gates", options: ["Steve Jobs", "Bill Gates", "Mark Zuckerberg", "Elon Musk"]},
    {q: "What is 9 x 9?", a: "81", options: ["72", "81", "90", "99"]},
    {q: "Capital of New Zealand?", a: "Wellington", options: ["Auckland", "Wellington", "Christchurch", "Sydney"]},
    {q: "How many protons in Helium?", a: "2", options: ["1", "2", "3", "4"]},
    {q: "What is the main component of glass?", a: "Silica", options: ["Carbon", "Silica", "Iron", "Calcium"]},
    {q: "Who wrote 'Don Quixote'?", a: "Cervantes", options: ["Cervantes", "Dante", "Petrarch", "Boccaccio"]},
    {q: "What is 2/3 + 1/3?", a: "1", options: ["1/2", "2/3", "1", "4/3"]},

    {q: "How many days in Venus year?", a: "225", options: ["365", "225", "687", "4333"]},
    {q: "What is the symbol for Silver?", a: "Ag", options: ["Si", "Ag", "Sv", "Sr"]},
    {q: "Who painted The Scream?", a: "Munch", options: ["Munch", "Picasso", "Dali", "Klimt"]},
    {q: "What is 5^3?", a: "125", options: ["25", "125", "625", "15"]},
    {q: "Capital of Morocco?", a: "Rabat", options: ["Casablanca", "Rabat", "Marrakech", "Fes"]},
    {q: "How many bits in kilobyte?", a: "8192", options: ["1024", "8000", "8192", "10000"]},
    {q: "What is the study of fungi?", a: "Mycology", options: ["Botany", "Mycology", "Zoology", "Ecology"]},
    {q: "Who invented World Wide Web?", a: "Tim Berners-Lee", options: ["Bill Gates", "Tim Berners-Lee", "Steve Jobs", "Larry Page"]},
    {q: "What is 144 / 12?", a: "12", options: ["10", "12", "14", "16"]},
    {q: "Capital of Vietnam?", a: "Hanoi", options: ["Ho Chi Minh", "Hanoi", "Da Nang", "Hue"]},
    {q: "How many neurons in human brain approx?", a: "86 billion", options: ["10 billion", "86 billion", "200 billion", "1 trillion"]},
    {q: "What is the pH of stomach acid?", a: "2", options: ["1", "2", "3", "4"]},
    {q: "Who wrote 'The Great Gatsby'?", a: "Fitzgerald", options: ["Hemingway", "Fitzgerald", "Faulkner", "Steinbeck"]}
  ];

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const docSnap = await getDoc(doc(db, "users", user.uid));
      if(docSnap.exists()) userData = docSnap.data();
      loadQuiz();
    } else { window.location.href = "log.html"; }
  });

  function getTodayKey() {
    return new Date().toISOString().split('T')[0];
  }

  function getQuestionOfDay() {
    const today = getTodayKey();
    const seed = today.split('-').join('');
    const index = parseInt(seed) % quizBank.length;
    return quizBank[index];
  }

  function loadQuiz() {
    const today = getTodayKey();
    const lastQuizDate = localStorage.getItem('last_quiz_date');

    // INSTANT DONE MESSAGE ON REFRESH
    if(lastQuizDate === today) {
      document.getElementById('quizContent').innerHTML = `
        <div class="done-msg">Done! ✅</div>
        <div class="done-sub">See you tomorrow for new question</div>
        <button class="back-btn" onclick="goHome()">Back Home</button>
      `;
      return;
    }

    // SHOW QUESTION WITH TIMER
    const question = getQuestionOfDay();
    correctAnswer = question.a;
    timeLeft = 60;

    let optionsHTML = question.options.map(opt =>
      `<button class="option-btn" onclick="selectAnswer('${opt}', this)">${opt}</button>`
    ).join('');

    document.getElementById('quizContent').innerHTML = `
      <div class="timer-box" id="timer">60s</div>
      <div class="question-num">Question 1/1</div>
      <div class="question-text">${question.q}</div>
      <div id="options">${optionsHTML}</div>
      <div id="result"></div>
      <button class="back-btn" onclick="goHome()">Back Home</button>
    `;

    startTimer();
  }

  function startTimer() {
    quizTimer = setInterval(() => {
      timeLeft--;
      const timerEl = document.getElementById('timer');
      timerEl.innerText = timeLeft + 's';
      if(timeLeft <= 10) timerEl.classList.add('danger');

      if(timeLeft <= 0) {
        clearInterval(quizTimer);
        timeoutAnswer();
      }
    }, 1000);
  }

  async function timeoutAnswer() {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.disabled = true);

    document.getElementById('result').innerHTML =
      `<div class="result-box wrong">Time's up! Correct answer: ${correctAnswer}</div>`;

    saveResult(0, "Timeout");
  }

  window.selectAnswer = async function(answer, btn) {
    if(selectedAnswer) return;
    clearInterval(quizTimer);
    selectedAnswer = answer;

    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.disabled = true);

    let points = 0;
    let resultHTML = '';

    if(answer === correctAnswer) {
      btn.classList.add('correct');
      points = 10;
      resultHTML = `<div class="result-box correct">Correct! +10 Points 🎉</div>`;
    } else {
      btn.classList.add('wrong');
      buttons.forEach(b => { if(b.innerText === correctAnswer) b.classList.add('correct'); });
      resultHTML = `<div class="result-box wrong">Wrong! Correct answer: ${correctAnswer}</div>`;
    }

    document.getElementById('result').innerHTML = resultHTML;
    saveResult(points, answer);
  }

  async function saveResult(points, answer) {
    const today = getTodayKey();
    userData.points += points;
    await updateDoc(doc(db, "users", currentUser.uid), { points: userData.points });

    localStorage.setItem('last_quiz_date', today);
    localStorage.setItem('last_quiz_score', points);
    localStorage.setItem('last_quiz_answer', answer);
  }

  window.goHome = function() {
    window.location.href = "home.html";
  }
</script>
</body>
</html>
