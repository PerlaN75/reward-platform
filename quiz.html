<!DOCTYPE html>
<html>
<head>
  <title>Daily Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; padding: 20px; color: white; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { font-size: 24px; color: #fbbf24; }
    .back-btn { padding: 10px 18px; background: #fbbf24; color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .quiz-card { background: #4a6128; border: 2px solid #fbbf24; border-radius: 20px; padding: 20px; }
    .question { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option { background: #1a2410; padding: 15px; border-radius: 12px; cursor: pointer; border: 2px solid #333; transition: 0.2s; }
    .option:hover { border-color: #fbbf24; }
    .option.selected { background: #fbbf24; color: #000; border-color: #fbbf24; }
    .submit-btn { width: 100%; padding: 16px; background: #22c55e; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 0 #16a34a; }
    .submit-btn:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; }
    .done-box { text-align: center; padding: 40px 20px; }
    .done-box h2 { color: #22c55e; font-size: 24px; margin-bottom: 10px; }
    .done-box p { color: #ccc; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧠 Daily Quiz</h1>
    <button class="back-btn" onclick="window.location.href='home.html'">Back</button>
  </div>

  <div id="quizContainer" class="quiz-card"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d" };
  const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

  let currentUser = null;
  let userData = {};
  let selectedAnswer = null;
  const QUIZ_REWARD = 20;

  const QUESTIONS = [
    { q: "What is the capital of Rwanda?", options: ["Kigali", "Nairobi", "Kampala", "Bujumbura"], answer: "Kigali" },
    { q: "How many points = $1 USDT?", options: ["1000", "2000", "500", "1500"], answer: "2000" },
    { q: "Max videos per day in Watch & Earn?", options: ["3", "5", "10", "7"], answer: "5" }
  ];

  function getTodayString() {
    return new Date().toISOString().split('T')[0];
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) { 
      currentUser = user; 
      const docSnap = await getDoc(doc(db, "users", user.uid));
      if(docSnap.exists()) userData = docSnap.data();
      renderQuiz();
    }
    else { window.location.href = "log.html"; }
  });

  function renderQuiz() {
    const today = getTodayString();
    const quizDate = userData.lastQuizDate || "";

    const container = document.getElementById('quizContainer');

    // HARD LOCK: If already done today
    if(quizDate === today) {
      container.innerHTML = `
        <div class="done-box">
          <h2>✅ Quiz Completed</h2>
          <p>You already did today's quiz. Come back tomorrow for +${QUIZ_REWARD} points</p>
        </div>
      `;
      return;
    }

    // Pick random question for today
    const randomQ = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];

    let optionsHtml = randomQ.options.map(opt => 
      `<div class="option" onclick="selectOption(this, '${opt}')">${opt}</div>`
    ).join('');

    container.innerHTML = `
      <div class="question">${randomQ.q}</div>
      <div class="options" id="options">${optionsHtml}</div>
      <button class="submit-btn" id="submitBtn" onclick="submitAnswer('${randomQ.answer}')">Submit Answer</button>
    `;
  }

  window.selectOption = function(el, val) {
    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    selectedAnswer = val;
  }

  window.submitAnswer = async function(correctAnswer) {
    if(!selectedAnswer) return alert("Please select an answer");
    document.getElementById('submitBtn').disabled = true;

    const today = getTodayString();
    let pointsEarned = 0;

    if(selectedAnswer === correctAnswer) {
      pointsEarned = QUIZ_REWARD;
      userData.points = (userData.points || 0) + pointsEarned;
      alert(`Correct! +${pointsEarned} Points 🎉`);
    } else {
      alert(`Wrong! Correct answer: ${correctAnswer}`);
    }

    // SAVE TO FIREBASE - THIS STOPS RE-DO AFTER LOGOUT
    userData.lastQuizDate = today;
    await setDoc(doc(db, "users", currentUser.uid), {
      points: userData.points,
      lastQuizDate: userData.lastQuizDate
    }, {merge: true});

    renderQuiz(); // Show "completed" screen
  }

</script>
</body>
</html>
