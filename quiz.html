<!DOCTYPE html>
<html>
<head>
  <title>Daily Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; padding: 20px; color: white; display: flex; flex-direction: column; align-items: center; }
    .header { width: 100%; max-width: 420px; text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 24px; color: #fbbf24; }
    .quiz-card { width: 100%; max-width: 420px; background: #4a6128; border: 2px solid #fbbf24; border-radius: 20px; padding: 20px; margin-bottom: 20px; min-height: 200px; }
    .question { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option { background: #1a2410; padding: 15px; border-radius: 12px; cursor: pointer; border: 2px solid #333; transition: 0.2s; }
    .option:hover { border-color: #fbbf24; }
    .option.selected { background: #fbbf24; color: #000; border-color: #fbbf24; }
    .option.correct { background: #22c55e; color: #000; border-color: #22c55e; }
    .option.wrong { background: #ef4444; color: #fff; border-color: #ef4444; }
    .submit-btn { width: 100%; padding: 16px; background: #22c55e; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 0 #16a34a; }
    .submit-btn:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; }
    .done-box { text-align: center; padding: 20px 10px; }
    .done-box h2 { color: #22c55e; font-size: 24px; margin-bottom: 10px; }
    .done-box p { color: #ccc; margin-bottom: 8px; }
    .back-btn-bottom { width: 40%; padding: 15px; background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #d97706; }
    .back-btn-bottom:active { transform: translateY(2px); box-shadow: 0 2px 0 #d97706; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧠 Daily Quiz</h1>
  </div>

  <div id="quizContainer" class="quiz-card"></div> <!-- NO "Loading..." HERE -->

  <button class="back-btn-bottom" onclick="window.location.href='home.html'">Back Home</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d" };
  const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

  let currentUser = null;
  let userData = {};
  let selectedAnswer = null;
  const QUIZ_REWARD = 20;

  const QUESTIONS = [
    { q: "What is the capital of Rwanda?", options: ["Kigali", "Nairobi", "Kampala", "Bujumbura"], answer: "Kigali" },
    { q: "How many points = $1 USDT?", options: ["1000", "2000", "500", "1500"], answer: "2000" },
    { q: "Max videos per day in Watch & Earn?", options: ["3", "5", "10", "7"], answer: "5" },
    { q: "Which coin is used for gas fees on BSC?", options: ["USDT", "BNB", "XRP", "BTC"], answer: "BNB" },
    { q: "What does 'Streak' mean in Daily Checkin?", options: ["Total Points", "Consecutive Days", "Referrals", "Videos"], answer: "Consecutive Days" },
    { q: "1 Day = How many hours?", options: ["12", "24", "48", "36"], answer: "24" },
    { q: "Which is a stablecoin?", options: ["BNB", "XRP", "USDT", "DOGE"], answer: "USDT" }
  ];

  function getTodayString() {
    return new Date().toISOString().split('T')[0];
  }

  function getQuestionForToday() {
    const today = getTodayString();
    let hash = 0;
    for (let i = 0; i < today.length; i++) {
      hash = ((hash << 5) - hash) + today.charCodeAt(i);
      hash = hash & hash;
    }
    const index = Math.abs(hash) % QUESTIONS.length;
    return QUESTIONS[index];
  }

  // RENDER INSTANTLY ON PAGE LOAD USING CACHE
  function renderInstant() {
    const today = getTodayString();
    const cachedDate = localStorage.getItem('lastQuizDate') || "";
    const cachedPoints = localStorage.getItem('points') || 0;
    const todaysQuestion = getQuestionForToday();
    const container = document.getElementById('quizContainer');

    userData.points = parseInt(cachedPoints);
    userData.lastQuizDate = cachedDate;

    if(cachedDate === today) {
      container.innerHTML = `
        <div class="done-box">
          <h2>✅ Quiz Completed</h2>
          <p>You already did today's quiz. Come back tomorrow for +${QUIZ_REWARD} points</p>
          <p style="margin-top:15px; font-size:14px;">Today's Question: ${todaysQuestion.q}</p>
        </div>
      `;
    } else {
      renderQuizUI(todaysQuestion);
    }
  }

  function renderQuizUI(todaysQuestion) {
    const container = document.getElementById('quizContainer');
    selectedAnswer = null;
    let optionsHtml = todaysQuestion.options.map(opt => 
      `<div class="option" onclick="selectOption(this, '${opt}')">${opt}</div>`
    ).join('');

    container.innerHTML = `
      <div class="question">${todaysQuestion.q}</div>
      <div class="options" id="options">${optionsHtml}</div>
      <button class="submit-btn" id="submitBtn" onclick="submitAnswer('${todaysQuestion.answer}')">Submit Answer</button>
    `;
  }

  // Run instantly
  renderInstant();

  onAuthStateChanged(auth, async (user) => {
    if (user) { 
      currentUser = user; 
      // Sync with Firebase in background, no visual delay
      const docSnap = await getDoc(doc(db, "users", user.uid));
      if(docSnap.exists()) {
        userData = docSnap.data();
        localStorage.setItem('lastQuizDate', userData.lastQuizDate || "");
        localStorage.setItem('points', userData.points || 0);
        
        // If Firebase disagrees with cache, correct it silently
        renderInstant();
      }
    }
    else { window.location.href = "log.html"; }
  });

  window.selectOption = function(el, val) {
    if(selectedAnswer) return;
    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    selectedAnswer = val;
  }

  window.submitAnswer = async function(correctAnswer) {
    if(!selectedAnswer) return alert("Please select an answer");
    document.getElementById('submitBtn').disabled = true;
    document.querySelectorAll('.option').forEach(o => o.style.pointerEvents = 'none');

    const today = getTodayString();
    let pointsEarned = 0;

    document.querySelectorAll('.option').forEach(o => {
      if(o.innerText === correctAnswer) o.classList.add('correct');
      if(o.innerText === selectedAnswer && selectedAnswer !== correctAnswer) o.classList.add('wrong');
    });

    if(selectedAnswer === correctAnswer) {
      pointsEarned = QUIZ_REWARD;
      userData.points = (userData.points || 0) + pointsEarned;
      setTimeout(() => alert(`Correct! +${pointsEarned} Points 🎉`), 500);
    } else {
      setTimeout(() => alert(`Wrong! Correct answer: ${correctAnswer}`), 500);
    }

    userData.lastQuizDate = today;
    await setDoc(doc(db, "users", currentUser.uid), {
      points: userData.points,
      lastQuizDate: userData.lastQuizDate
    }, {merge: true});

    localStorage.setItem('lastQuizDate', today);
    localStorage.setItem('points', userData.points);

    setTimeout(() => renderInstant(), 1500);
  }

</script>
</body>
</html>
