<!DOCTYPE html>
<html>
<head>
  <title>Daily Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; padding: 20px; color: white; }
    
   .header { text-align: center; margin-bottom: 20px; padding-top: 30px; }
   .header h1 { font-size: 28px; color: #fbbf24; font-weight: bold; }
   .header p { color: #d1fae5; font-size: 14px; margin-top: 5px; }
    
   .quiz-card { background: #1a2410; padding: 20px; border-radius: 15px; margin-bottom: 15px; }
   .quiz-card h3 { font-size: 14px; color: #f97316; margin-bottom: 10px; }
   .quiz-card p { font-size: 16px; font-weight: bold; margin-bottom: 15px; }
    
   .option { 
      background: #2f3e1a; padding: 12px; border-radius: 10px; margin-bottom: 10px; 
      cursor: pointer; border: 2px solid #2f3e1a;
    }
   .option.selected { border-color: #3b82f6; background: #1e293b; }
   .option.correct { border-color: #22c55e; background: #052e16; }
   .option.wrong { border-color: #ef4444; background: #450a0a; }
    
   .fill-input { 
      width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #2f3e1a; 
      background: #0f1408; color: white; font-size: 16px;
    }
    
   .submit-btn { 
      width: 100%; padding: 16px; background: linear-gradient(90deg, #3b82f6, #06b6d4); 
      color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; 
      font-size: 18px; margin-top: 10px; box-shadow: 0 5px 0 #1d4ed8;
    }
   .submit-btn:disabled { background: #555; box-shadow: 0 5px 0 #333; cursor: not-allowed; }
    
   .back-btn { 
      width: 40%; margin: 20px auto 0 auto; display: block; padding: 14px; 
      background: linear-gradient(90deg, #fbbf24, #f97316); color: #000; 
      border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; 
      box-shadow: 0 4px 0 #b45309;
    }
   .back-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b45309; }
    
   .completed-msg { text-align: center; padding: 30px 20px; background: #1a2410; border-radius: 15px; }
   .completed-msg h2 { font-size: 20px; color: #22c55e; margin-bottom: 8px; }
    
   .popup-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 9999; }
   .popup-box { background: #1a2410; padding: 25px; border-radius: 20px; text-align: center; width: 85%; max-width: 320px; border: 2px solid #3b82f6; }
   .popup-box h2 { color: #3b82f6; font-size: 20px; margin-bottom: 10px; }
   .popup-box p { color: #ddd; font-size: 14px; margin-bottom: 20px; }
   .popup-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #3b82f6, #06b6d4); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="popup-overlay" id="popup">
    <div class="popup-box">
      <h2 id="popupTitle">✓ Quiz Complete!</h2>
      <p id="popupText">+20 Points Added</p>
      <button class="popup-btn" onclick="closePopup()">OK</button>
    </div>
  </div>
  
  <div class="header">
    <h1>🧠 Daily Quiz</h1>
    <p>Answer 2 questions. Earn 20 points</p>
  </div>
  
  <div id="quizSection"></div>
  <button class="submit-btn" id="submitBtn" onclick="submitQuiz()" style="display:none;">Submit Answers</button>
  <button class="back-btn" onclick="window.location.href='home.html'">Back Home</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc, increment, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d" };
  const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});
  
  let currentUser = null;
  let todayQuestions = [];
  let userAnswers = {};

  // QUESTION POOL - Add 50+ questions here
  const QUESTION_POOL = {
    general: [
      {type: "mcq", q: "What is the capital of Rwanda?", options: ["Kigali","Nairobi","Kampala","Bujumbura"], answer: "Kigali"},
      {type: "fill", q: "The currency of Rwanda is _____", answer: "franc"},
      {type: "mcq", q: "How many continents are there?", options: ["5","6","7","8"], answer: "7"},
    ],
    biology: [
      {type: "mcq", q: "What is the powerhouse of the cell?", options: ["Nucleus","Mitochondria","Ribosome","Chloroplast"], answer: "Mitochondria"},
      {type: "fill", q: "Humans have _____ pairs of chromosomes", answer: "23"},
      {type: "mcq", q: "Which gas do plants absorb?", options: ["Oxygen","Nitrogen","CO2","Hydrogen"], answer: "CO2"},
    ],
    english: [
      {type: "mcq", q: "Synonym of 'Happy'?", options: ["Sad","Joyful","Angry","Tired"], answer: "Joyful"},
      {type: "fill", q: "Complete: She _____ to school every day", answer: "goes"},
      {type: "mcq", q: "Opposite of 'Expand'?", options: ["Grow","Contract","Increase","Spread"], answer: "Contract"},
    ],
    math: [
      {type: "mcq", q: "What is 15 x 4?", options: ["40","50","60","70"], answer: "60"},
      {type: "fill", q: "Square root of 144 is _____", answer: "12"},
      {type: "mcq", q: "What is 25% of 200?", options: ["25","50","75","100"], answer: "50"},
    ]
    general: [
    {type: "mcq", q: "What is the capital of Rwanda?", options: ["Kigali","Nairobi","Kampala","Bujumbura"], answer: "Kigali"},
    {type: "fill", q: "The currency of Rwanda is _____", answer: "franc"},
    {type: "mcq", q: "How many continents are there?", options: ["5","6","7","8"], answer: "7"},
    {type: "mcq", q: "Which is the largest ocean?", options: ["Atlantic","Indian","Arctic","Pacific"], answer: "Pacific"},
    {type: "fill", q: "The internet was invented in _____", answer: "1969"},
   ],
   biology: [
    {type: "mcq", q: "What is the powerhouse of the cell?", options: ["Nucleus","Mitochondria","Ribosome","Chloroplast"], answer: "Mitochondria"},
    {type: "fill", q: "Humans have _____ pairs of chromosomes", answer: "23"},
    {type: "mcq", q: "Which gas do plants absorb?", options: ["Oxygen","Nitrogen","CO2","Hydrogen"], answer: "CO2"},
    {type: "fill", q: "The study of animals is called _____", answer: "zoology"},
  ],
  english: [
    {type: "mcq", q: "Synonym of 'Happy'?", options: ["Sad","Joyful","Angry","Tired"], answer: "Joyful"},
    {type: "fill", q: "Complete: She _____ to school every day", answer: "goes"},
    {type: "mcq", q: "Opposite of 'Expand'?", options: ["Grow","Contract","Increase","Spread"], answer: "Contract"},
    {type: "fill", q: "Plural of 'child' is _____", answer: "children"},
  ],
  math: [
    {type: "mcq", q: "What is 15 x 4?", options: ["40","50","60","70"], answer: "60"},
    {type: "fill", q: "Square root of 144 is _____", answer: "12"},
    {type: "mcq", q: "What is 25% of 200?", options: ["25","50","75","100"], answer: "50"},
    {type: "fill", q: "10 squared is _____", answer: "100"},
  ]
};
onAuthStateChanged(auth, async (user) => {
    if (!user) return window.location.href = "log.html";
    currentUser = user;
    loadData();
  });

  function getTodayString() {
    const now = new Date();
    return now.getFullYear() + "-" + (now.getMonth()+1) + "-" + now.getDate();
  }
  
  // Simple seed random based on user + date
  function seededRandom(seed) {
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
  }
  function shuffleArray(array, seed) {
    return array.sort(() => seededRandom(seed++) - 0.5);
  }

  function showPopup(title, text) {
    document.getElementById('popupTitle').innerText = title;
    document.getElementById('popupText').innerText = text;
    document.getElementById('popup').style.display = 'flex';
  }
  window.closePopup = function() {
    document.getElementById('popup').style.display = 'none';
    loadData();
  }

  async function loadData() {
    const today = getTodayString();
    const cacheKey = 'quiz_' + currentUser.uid + '_' + today;
    const cached = localStorage.getItem(cacheKey);
    
    if(cached){
      const data = JSON.parse(cached);
      if(data.completed){
        showCompleted();
        return;
      }
    }
    
    const snap = await getDoc(doc(db, "users", currentUser.uid));
    if(!snap.exists()) return;
    const data = snap.data();
    
    if(data.lastQuizDate === today){
      localStorage.setItem(cacheKey, JSON.stringify({completed: true}));
      showCompleted();
      return;
    }
    
    // Generate 2 questions for today using seed
    const seed = currentUser.uid.length + today.length;
    let allQuestions = [...QUESTION_POOL.general,...QUESTION_POOL.biology,...QUESTION_POOL.english,...QUESTION_POOL.math];
    todayQuestions = shuffleArray(allQuestions, seed).slice(0, 2);
    
    renderQuiz();
  }
  
  function showCompleted() {
    document.getElementById('quizSection').innerHTML = `
      <div class="completed-msg">
        <h2>✓ Already Completed</h2>
        <p>You finished today's quiz.<br>Come back tomorrow</p>
      </div>
    `;
    document.getElementById('submitBtn').style.display = 'none';
  }

  function renderQuiz() {
    const section = document.getElementById('quizSection');
    section.innerHTML = '';
    todayQuestions.forEach((q, i) => {
      let html = `<div class="quiz-card"><h3>Question ${i+1}</h3><p>${q.q}</p>`;
      if(q.type === "mcq"){
        q.options.forEach(opt => {
          html += `<div class="option" onclick="selectOption(${i}, '${opt}', this)">${opt}</div>`;
        });
      } else {
        html += `<input type="text" class="fill-input" id="input${i}" placeholder="Type your answer">`;
      }
      html += `</div>`;
      section.innerHTML += html;
    });
    document.getElementById('submitBtn').style.display = 'block';
  }
  
  window.selectOption = function(index, value, el) {
    userAnswers[index] = value;
    el.parentElement.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
  }

  window.submitQuiz = async function() {
    let score = 0;
    todayQuestions.forEach((q, i) => {
      let userAns = q.type === "mcq"? userAnswers[i] : document.getElementById('input'+i).value.trim().toLowerCase();
      if(userAns === q.answer.toLowerCase()) score++;
    });
    
    const points = score * 10;
    const today = getTodayString();
    const cacheKey = 'quiz_' + currentUser.uid + '_' + today;
    
    localStorage.setItem(cacheKey, JSON.stringify({completed: true}));
    
    await updateDoc(doc(db, "users", currentUser.uid), {
      balance: increment(points),
      lastQuizDate: today
    });
    
    showPopup("✓ Quiz Complete!", `You got ${score}/2 correct. +${points} Points Added`);
    showCompleted();
  }
</script>
</body>
</html>
