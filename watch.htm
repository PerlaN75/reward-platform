<!DOCTYPE html>
<html>
<head>
  <title>Watch & Earn - Rewards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; }
    .container { max-width: 500px; margin: 0 auto; }
    .header { text-align: center; margin: 20px 0; color: #fbbf24; font-size: 28px; font-weight: bold; }
    .video-card { background: #1a2410; border: 2px solid #fbbf24; border-radius: 15px; padding: 20px; text-align: center; }
    .video-frame { width: 100%; height: 220px; background: #000; border-radius: 10px; margin-bottom: 15px; }
    .btn { width: 100%; padding: 15px; background: #ef4444; color: #fff; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
    .btn:disabled { background: #444; color: #888; }
    .timer { font-size: 20px; font-weight: bold; color: #22c55e; margin: 10px 0; }
    .back-btn { width: 40%; margin: 20px auto 0 auto; display: block; padding: 14px; background: #f59e0b; color: #000; border: none; border-radius: 12px; font-weight: bold; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 14px 20px; border-radius: 12px; font-weight: bold; z-index: 9999; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">📺 Watch & Earn</div>
    <div class="video-card">
      <div id="status">Loading video...</div>
      <iframe id="videoFrame" class="video-frame" src="" frameborder="0" allowfullscreen style="display:none;"></iframe>
      <div class="timer" id="timer"></div>
      <button class="btn" id="watchBtn" onclick="startWatch()" style="display:none;">Watch Video +5 pts</button>
      <p style="font-size:12px;color:#aaa;margin-top:10px;">Watch full 30s to earn. 1 video per hour.</p>
    </div>
    <button class="back-btn" onclick="window.location.href='./home.html'">Back</button>
  </div>
<script>
  const firebaseConfig = { apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co", authDomain: "reward-platform-rw-2e13d.firebaseapp.com", projectId: "reward-platform-rw-2e13d" };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ADD YOUR AD/YOUTUBE VIDEO LINKS HERE
  const videos = [
    "https://www.youtube.com/embed/dQw4w9WgXcQ",
    "https://www.youtube.com/embed/9bZkp7q19f0",
  ];
  let timerInterval;
  let seconds = 30;

  auth.onAuthStateChanged(async (user) => {
    if(!user) return window.location.replace('./index.html');
    const doc = await db.collection("users").doc(user.uid).get();
    const lastWatch = doc.data().lastWatchTime?.toDate();
    const now = new Date();
    
    if(lastWatch && (now - lastWatch) < 3600000){
      const wait = Math.ceil((3600000 - (now - lastWatch)) / 60000);
      document.getElementById('status').innerText = `Come back in ${wait} minutes`;
      return;
    }
    document.getElementById('status').innerText = "Ready to watch!";
    document.getElementById('watchBtn').style.display = 'block';
  });

  window.startWatch = function(){
    const randomVideo = videos[Math.floor(Math.random() * videos.length)];
    document.getElementById('videoFrame').src = randomVideo;
    document.getElementById('videoFrame').style.display = 'block';
    document.getElementById('watchBtn').style.display = 'none';
    document.getElementById('status').innerText = "Watch full 30 seconds...";
    
    timerInterval = setInterval(() => {
      seconds--;
      document.getElementById('timer').innerText = `00:${seconds < 10 ? '0' : ''}${seconds}`;
      if(seconds <= 0){
        clearInterval(timerInterval);
        rewardUser();
      }
    }, 1000);
  }

  async function rewardUser(){
    const user = auth.currentUser;
    await db.collection("users").doc(user.uid).update({
      balance: firebase.firestore.FieldValue.increment(5),
      lastWatchTime: firebase.firestore.FieldValue.serverTimestamp()
    })
    showToast("+5 points added!");
    setTimeout(() => { window.location.reload(); }, 2000);
  }

  function showToast(msg) { const toast = document.createElement('div'); toast.className = 'toast'; toast.innerText = msg; document.body.appendChild(toast); setTimeout(() => { toast.remove(); }, 2000); }
</script>
</body>
</html>
