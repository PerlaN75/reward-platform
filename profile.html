<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>My Profile - Reward Platform</title>


<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f4f7fb;

    color: #222;

}


/* =========================
   TOP NAVIGATION
========================= */

.top-nav {

    background: #182848;

    padding: 12px 10px;

    display: flex;

    align-items: center;

    gap: 10px;

    overflow-x: auto;

}


/* =========================
   NAVIGATION BUTTONS
========================= */

.nav-button {

    display: inline-block;

    padding: 11px 16px;

    background: rgba(255,255,255,0.12);

    color: white;

    text-decoration: none;

    border: none;

    border-radius: 10px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    white-space: nowrap;

}


.nav-button:hover {

    background: rgba(255,255,255,0.22);

}


/* =========================
   HEADER
========================= */

header {

    background: #182848;

    color: white;

    padding: 28px 15px;

    text-align: center;

}


header h1 {

    margin: 0;

    animation:
        headingColor 3s infinite alternate;

}


header p {

    margin: 8px 0 0;

}


/* =========================
   HEADING ANIMATION
========================= */

@keyframes headingColor {

    0% {

        color: white;

    }

    100% {

        color: #00bfff;

    }

}


/* =========================
   MAIN CONTAINER
========================= */

.container {

    max-width: 700px;

    margin: auto;

    padding: 15px;

}


/* =========================
   CARD
========================= */

.card {

    background: white;

    border-radius: 14px;

    padding: 20px;

    margin: 15px 0;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

}


/* =========================
   PROFILE ICON
========================= */

.profile-icon {

    width: 90px;

    height: 90px;

    margin: 0 auto 15px;

    border-radius: 50%;

    background: #182848;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;

    text-align: center;

}


/* =========================
   PROFILE NAME
========================= */

.profile-name {

    text-align: center;

    font-size: 24px;

    font-weight: bold;

    margin-bottom: 5px;

}


.profile-email {

    text-align: center;

    color: #666;

    margin-bottom: 10px;

}


/* =========================
   INFORMATION ROW
========================= */

.info-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    padding: 14px 0;

    border-bottom: 1px solid #eee;

}


.info-row:last-child {

    border-bottom: none;

}


.info-label {

    font-weight: bold;

}


.info-value {

    text-align: right;

    color: #555;

    word-break: break-word;

}


/* =========================
   ACCOUNT STATUS
========================= */

.status-active {

    color: #168a3a;

    font-weight: bold;

}


/* =========================
   POINTS CARD
========================= */

.points-card {

    text-align: center;

}


.points-title {

    font-size: 18px;

    font-weight: bold;

}


.points-number {

    font-size: 42px;

    font-weight: bold;

    color: #182848;

    margin: 10px 0;

}


.points-label {

    color: #666;

}


/* =========================
   FORM
========================= */

.form-group {

    margin-bottom: 18px;

}


.form-group label {

    display: block;

    font-weight: bold;

    margin-bottom: 8px;

}


.form-group input {

    width: 100%;

    padding: 14px;

    border: 1px solid #d7dce5;

    border-radius: 10px;

    font-size: 16px;

    outline: none;

}


.form-group input:focus {

    border-color: #2196f3;

}


/* =========================
   ACTION BUTTON
========================= */

.action-button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #182848;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 10px;

}


.action-button:hover {

    opacity: 0.9;

}


/* =========================
   CANCEL BUTTON
========================= */

.cancel-button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #777;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 10px;

}


.cancel-button:hover {

    opacity: 0.9;

}


/* =========================
   MESSAGE
========================= */

.message {

    text-align: center;

    font-weight: bold;

    margin-top: 12px;

    line-height: 1.5;

}


/* =========================
   FOOTER
========================= */

footer {

    text-align: center;

    padding: 25px;

    color: #666;

    font-size: 14px;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .info-row {

        align-items: flex-start;

    }


    .info-value {

        max-width: 55%;

    }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN PROTECTION
========================= -->

<script>

if (
    localStorage.getItem("loggedIn")
    !== "true"
) {

    window.location.href =
        "login.html";

}

</script>


<!-- =========================
     TOP NAVIGATION
========================= -->

<nav class="top-nav">


    <button
        class="nav-button"
        onclick="goBack()">

        ← Back

    </button>


    <a
        href="profile.html"
        class="nav-button">

        👤 Profile

    </a>


</nav>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>👤 My Profile</h1>

    <p>
        Manage and view your account information.
    </p>

</header>


<!-- =========================
     MAIN
========================= -->

<div class="container">


<!-- =========================
     PROFILE SUMMARY
========================= -->

<div class="card">

    <div class="profile-icon">

        👤

    </div>


    <div
        class="profile-name"
        id="profileName">

        User

    </div>


    <div
        class="profile-email"
        id="profileEmail">

        Not provided

    </div>

</div>


<!-- =========================
     ACCOUNT INFORMATION
========================= -->

<div class="card">

    <h2>Account Information</h2>


    <div class="info-row">

        <div class="info-label">

            👤 Username

        </div>


        <div
            class="info-value"
            id="username">

            -

        </div>

    </div>


    <div class="info-row">

        <div class="info-label">

            📧 Email

        </div>


        <div
            class="info-value"
            id="email">

            -

        </div>

    </div>


    <div class="info-row">

        <div class="info-label">

            🟢 Status

        </div>


        <div class="info-value status-active">

            Active

        </div>

    </div>


    <div class="info-row">

        <div class="info-label">

            📅 Member Since

        </div>


        <div
            class="info-value"
            id="memberSince">

            -

        </div>

    </div>

</div>


<!-- =========================
     POINTS
========================= -->

<div class="card points-card">

    <div class="points-title">

        💰 Current Points

    </div>


    <div
        class="points-number"
        id="points">

        0

    </div>


    <div class="points-label">

        points available

    </div>

</div>


<!-- =========================
     EDIT PROFILE
========================= -->

<div
    class="card"
    id="editCard">


    <h2>✏️ Edit Profile</h2>


    <p>

        Update your username or email address.

    </p>


    <form
        onsubmit="saveProfile(event)">


        <!-- USERNAME -->

        <div class="form-group">

            <label for="editUsername">

                Username

            </label>


            <input
                type="text"
                id="editUsername"
                minlength="3"
                required>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="editEmail">

                Email

            </label>


            <input
                type="email"
                id="editEmail"
                required>

        </div>


        <!-- SAVE -->

        <button
            type="submit"
            class="action-button">

            💾 Save Changes

        </button>


        <!-- CANCEL -->

        <button
            type="button"
            class="cancel-button"
            onclick="cancelEdit()">

            ❌ Cancel

        </button>


    </form>


    <div
        class="message"
        id="message">

    </div>


</div>


</div>


<!-- =========================
     FOOTER
========================= -->

<footer>

    Reward Platform — Prototype

</footer>


<script>

/* =====================================================
   GET REGISTERED USER
===================================================== */

let savedUser = null;


try {

    savedUser =
        JSON.parse(
            localStorage.getItem(
                "rewardUser"
            )
        );

} catch (error) {

    savedUser = null;

}


/* =====================================================
   CHECK USER DATA
===================================================== */

if (!savedUser) {

    document.getElementById(
        "profileName"
    ).textContent = "User";


    document.getElementById(
        "profileEmail"
    ).textContent = "Not provided";

}


/* =====================================================
   USERNAME
===================================================== */

const username =
    savedUser &&
    savedUser.username
        ? savedUser.username
        : "User";


document.getElementById(
    "profileName"
).textContent = username;


document.getElementById(
    "username"
).textContent = username;


/* =====================================================
   EMAIL
===================================================== */

const email =
    savedUser &&
    savedUser.email
        ? savedUser.email
        : "Not provided";


document.getElementById(
    "profileEmail"
).textContent = email;


document.getElementById(
    "email"
).textContent = email;


/* =====================================================
   MEMBER SINCE
===================================================== */

let memberSince =
    localStorage.getItem(
        "memberSince"
    );


if (!memberSince) {

    memberSince =
        new Date().toLocaleDateString();

    localStorage.setItem(
        "memberSince",
        memberSince
    );

}


document.getElementById(
    "memberSince"
).textContent =
    memberSince;


/* =====================================================
   POINTS
===================================================== */

const points =
    Number(
        localStorage.getItem(
            "rewardPoints"
        )
    ) || 0;


document.getElementById(
    "points"
).textContent =
    points;


/* =====================================================
   LOAD EDIT FORM
===================================================== */

document.getElementById(
    "editUsername"
).value = username;


document.getElementById(
    "editEmail"
).value = email;


/* =====================================================
   SAVE PROFILE
===================================================== */

function saveProfile(event) {

    event.preventDefault();


    const newUsername =
        document.getElementById(
            "editUsername"
        ).value.trim().toLowerCase();


    const newEmail =
        document.getElementById(
            "editEmail"
        ).value.trim().toLowerCase();


    const message =
        document.getElementById(
            "message"
        );


    /* =========================
       USERNAME CHECK
    ========================= */

    if (
        newUsername.length < 3
    ) {

        message.textContent =
            "❌ Username must contain at least 3 characters.";

        return;

    }


    /* =========================
       EMAIL CHECK
    ========================= */

    if (
        !newEmail.includes("@")
    ) {

        message.textContent =
            "❌ Please enter a valid email address.";

        return;

    }


    /* =========================
       GET CURRENT ACCOUNT
    ========================= */

    let currentUser;


    try {

        currentUser =
            JSON.parse(
                localStorage.getItem(
                    "rewardUser"
                )
            );

    } catch (error) {

        currentUser = null;

    }


    if (!currentUser) {

        message.textContent =
            "❌ Account information could not be found.";

        return;

    }


    /* =========================
       UPDATE USER
    ========================= */

    currentUser.username =
        newUsername;


    currentUser.email =
        newEmail;


    /* =========================
       SAVE UPDATED USER
    ========================= */

    localStorage.setItem(
        "rewardUser",
        JSON.stringify(
            currentUser
        )
    );


    /* =========================
       UPDATE DISPLAY
    ========================= */

    document.getElementById(
        "profileName"
    ).textContent =
        newUsername;


    document.getElementById(
        "username"
    ).textContent =
        newUsername;


    document.getElementById(
        "profileEmail"
    ).textContent =
        newEmail;


    document.getElementById(
        "email"
    ).textContent =
        newEmail;


    /* =========================
       SUCCESS MESSAGE
    ========================= */

    message.textContent =
        "✅ Profile updated successfully.";

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit() {

    document.getElementById(
        "editUsername"
    ).value =
        document.getElementById(
            "username"
        ).textContent;


    document.getElementById(
        "editEmail"
    ).value =
        document.getElementById(
            "email"
        ).textContent;


    document.getElementById(
        "message"
    ).textContent = "";

}


/* =====================================================
   BACK BUTTON
===================================================== */

function goBack() {

    window.history.back();

}

</script>


</body>

</html>
