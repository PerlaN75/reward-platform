<!DOCTYPE html>
<html>
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0e1a0e;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.card{width:100%;max-width:400px;background:#1d331d;border:3px solid #fbbf24;border-radius:24px;padding:20px 18px}
h1{color:#facc15;text-align:center;font-size:28px;margin-bottom:12px}
.balance-box{background:#0a120a;border:2px solid #fbbf24;border-radius:16px;padding:12px;text-align:center;color:#fff;margin-bottom:14px}
.video-box{background:#000;border-radius:16px;overflow:hidden;border:2px solid #2a4a2a}
.player{aspect-ratio:16/9;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#000}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.92);color:#fff;text-align:center;padding:14px;flex-direction:column;z-index:2;font-weight:800;font-size:15px}
.progress{height:10px;background:#2a4a2a}.progress-bar{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);width:0%;transition:width .3s}
.btn{width:100%;background:#fbbf24;color:#000;border:none;border-radius:12px;padding:14px;font-weight:900;font-size:16px;cursor:pointer;margin:14px 0 0}
.btn:disabled{background:#5a4a1a;color:#aaa}
.vtitle{font-size:12px;color:#facc15;margin-top:6px}
.bubble{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fbbf24;color:#000;padding:14px 22px;border-radius:999px;font-weight:900;z-index:10000;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.err{font-size:12px;color:#ff8a8a;margin-top:8px}
</style>

<body>
<canvas id="confetti" style="position:fixed;inset:0;pointer-events:none;z-index:9999;display:none"></canvas>
<div id="bubble" class="bubble"></div>
<div class="card">
<h1>Watch & Earn</h1>
<div class="balance-box">Balance: <b id="bal">Loading...</b><br><span style="font-size:13px"><span id="today">0/10</span> today</span><div class="vtitle" id="vt">Loading LIVE...</div><div id="err" class="err"></div></div>
<div class="video-box">
<div class="player"><video id="v" playsinline controls preload="metadata" crossorigin="anonymous" loop></video><div class="overlay" id="ov">Loading videos...</div></div>
<div class="progress"><div class="progress-bar" id="pbar"></div></div>
<div style="padding:0 12px 12px"><button class="btn" id="btn" disabled>Loading...</button></div>
</div>
<button style="display:block;margin:16px auto 0;background:#f59e0b;border:0;padding:10px 24px;border-radius:999px;font-weight:700" onclick="location.href='./home.html'">Back</button>
</div>
<script>
const DIRECT_LINK="https://omg10.com/4/11905870";
const LIVE_API="https://steep-mountain-1ce5.silntr235.workers.dev";
const REQUIRED_WATCH_SEC = 15;
const ALL_VIDEOS_FALLBACK=[
{src:"https://cdn.videy.co/4KScO3m11.mp4",title:"Video 1"},
{src:"https://cdn.videy.co/qwwV5liZ1.mp4",title:"Video 2"},
{src:"https://cdn.videy.co/SNuocZec1.mp4",title:"Video 3"},
{src:"https://cdn.videy.co/4Zqqtaia1.mp4",title:"Video 4"},
{src:"https://cdn.videy.co/Gjvd5XCv1.mp4",title:"Video 5"},
{src:"https://cdn.videy.co/ID5Yult41.mp4",title:"Video 6"},
{src:"https://cdn.videy.co/D2phmwCi1.mp4",title:"Video 7"},
{src:"https://cdn.videy.co/XibFgqY31.mp4",title:"Video 8"},
{src:"https://cdn.videy.co/YxatrGBT1.mp4",title:"Video 9"},
{src:"https://cdn.videy.co/8a7z5Gnt1.mp4",title:"Video 10"},
{src:"https://cdn.videy.co/nxGIoUIv1.mp4",title:"Video 11"},
{src:"https://cdn.videy.co/Y7sBjXCy1.mp4",title:"Video 12"},
{src:"https://cdn.videy.co/CWMR0s9c1.mp4",title:"Video 13"},
{src:"https://cdn.videy.co/qKROYUIW1.mp4",title:"Video 14"},
{src:"https://cdn.videy.co/RF0mt4bh1.mp4",title:"Video 15"},
{src:"https://cdn.videy.co/f4Do13Yy1.mp4",title:"Video 16"},
{src:"https://cdn.videy.co/VZSZ7vKz1.mp4",title:"Video 17"},
{src:"https://cdn.videy.co/ZEbftTDj1.mp4",title:"Video 18"},
{src:"https://www.w3schools.com/html/mov_bbb.mp4",title:"Video 19"},
{src:"https://files.catbox.moe/lzrb1b.mp4",title:"Video 20"}
];
let ALL_VIDEOS=[...ALL_VIDEOS_FALLBACK];
async function loadLiveVideos(){
  try{ const res = await fetch(LIVE_API); const data = await res.json(); if(Array.isArray(data) && data.length >= 5){ ALL_VIDEOS = data; return true; } }catch(e){}
  return false;
}
function getRandomPlaylist(){ let arr=[...ALL_VIDEOS]; for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr.slice(0,10); }
function showBubble(t){const b=document.getElementById('bubble'); b.textContent=t; b.style.display='block'; setTimeout(()=>b.style.display='none',2200);}
function BLAST(){ const c=document.getElementById('confetti'); c.style.display='block'; const ctx=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight; let p=[]; const col=['#fbbf24','#f59e0b','#22c55e','#ef4444','#3b82f6','#ec4899','#fff']; for(let i=0;i<180;i++) p.push({x:c.width/2,y:c.height/2.5,vx:(Math.random()-0.5)*26,vy:(Math.random()-0.5)*26-8,r:Math.random()*9+4,color:col[Math.floor(Math.random()*col.length)],rot:Math.random()*360,vr:(Math.random()-0.5)*30}); let f=0; (function anim(){ctx.clearRect(0,0,c.width,c.height); p.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.vy+=0.38;o.rot+=o.vr;o.vx*=0.99;ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot*Math.PI/180);ctx.fillStyle=o.color; ctx.fillRect(-o.r/2,-o.r/2,o.r,o.r); ctx.restore();}); f++; if(f<160) requestAnimationFrame(anim); else c.style.display='none';})(); if(navigator.vibrate) navigator.vibrate([80,40,80,40,150]);}
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
let bal=0,today=0,currentUser=null,timer=null,dailyPlaylist=[],failCount=0, loadChecker=null, adWindowOpened=false, currentVideo=null;
const ov=document.getElementById('ov'),vid=document.getElementById('v'),btn=document.getElementById('btn'),pbar=document.getElementById('pbar'),balEl=document.getElementById('bal'),todayEl=document.getElementById('today'),vtEl=document.getElementById('vt'),errEl=document.getElementById('err');
function updateUI(){ let displayToday = Math.min(today,10); balEl.textContent=bal+' pts'; todayEl.textContent=displayToday+'/10'; if(dailyPlaylist.length && today<10 && dailyPlaylist[today]){vtEl.textContent=`Next: ${dailyPlaylist[today].title}`;} }
auth.onAuthStateChanged(async(u)=>{
  if(!u){location.href='./index.html';return;} currentUser=u; 
  ov.innerHTML='📡 Loading LIVE videos...'; await loadLiveVideos(); dailyPlaylist=getRandomPlaylist();
  db.collection('users').doc(u.uid).onSnapshot(s=>{ if(s.exists){ const d=s.data(); bal=d.balance ?? d.points ?? 0; today=d.todayCount ?? d.today ?? 0; const last=d.lastWatchDate?d.lastWatchDate.toDate?d.lastWatchDate.toDate():new Date(d.lastWatchDate):null; if(last && new Date().toDateString()!==last.toDateString()){today=0;} updateUI(); if(today>=10){ ov.style.display='flex'; ov.innerHTML='🎉 10/10 Done!<br>New tomorrow'; btn.disabled=true; btn.textContent='Limit Reached'; pbar.style.width='100%'; BLAST(); } else if(dailyPlaylist.length){ ov.style.display='flex'; if(!timer) ov.innerHTML=`<div>${dailyPlaylist[today]?.title||'Ready'}</div><small>Tap Start - ${ALL_VIDEOS.length} videos (15s loop)</small>`; btn.disabled=false; btn.textContent='Start & Earn'; } } });
});
function doAd(){ if(today>=10){ov.style.display='flex'; ov.innerHTML='🎉 10/10 Done!<br>💥 New tomorrow'; btn.disabled=true; btn.textContent='Limit Reached'; BLAST(); return;} adWindowOpened=false; const win=window.open(DIRECT_LINK,'_blank'); if(!win || win.closed || typeof win.closed=='undefined'){ errEl.textContent='⚠️ Allow popups!'; ov.innerHTML='⚠️ Popup blocked!<br><small>Allow & tap again</small>'; btn.textContent='Tap Again'; btn.disabled=false; return; } adWindowOpened=true; errEl.textContent=''; btn.disabled=true; ov.style.display='flex'; ov.innerHTML='Verifying ad...<br><small>3s</small>'; pbar.style.width='0%'; vid.pause(); let ad=3; let adInt=setInterval(()=>{ ad--; ov.innerHTML=`📢 Ad check ${ad}s...`; if(ad<=0){clearInterval(adInt); startVideo();} },1000); }
function startVideo(){
  if(today>=10) return; currentVideo = dailyPlaylist[today]; if(!currentVideo) return;
  vtEl.textContent=`Playing: ${currentVideo.title} (loop 15s)`; errEl.textContent=''; ov.style.display='none';
  vid.loop = true; vid.removeAttribute('src'); vid.load(); vid.src=currentVideo.src; vid.load(); 
  btn.textContent=`🔄 Loading ${currentVideo.title}...`; pbar.style.width='5%'; let secondsWaiting=0; clearInterval(loadChecker);
  loadChecker=setInterval(()=>{ secondsWaiting++; const stuck = (vid.readyState < 2 || vid.duration === 0 || isNaN(vid.duration) || vid.networkState === 3); if(secondsWaiting >= 4 && stuck){ clearInterval(loadChecker); handleVideoError(`Dead: ${currentVideo.title}`); return; } if(vid.readyState >= 2){ clearInterval(loadChecker); vid.play().catch(()=>{}); let sec=0; btn.textContent=`💰 Earning... ${REQUIRED_WATCH_SEC}s`; btn.disabled=true; pbar.style.width='0%'; clearInterval(timer); timer=setInterval(()=>{ sec++; pbar.style.width=(sec/REQUIRED_WATCH_SEC*100)+'%'; btn.textContent=`💰 ${sec}/${REQUIRED_WATCH_SEC}s`; if(sec>=REQUIRED_WATCH_SEC){ clearInterval(timer); timer=null; vid.pause(); btn.textContent='🎉 Claim 2 pts!'; btn.disabled=false; btn.onclick=claim; ov.style.display='flex'; ov.innerHTML=`✅ 15s Done!<br>Tap to claim`; if(navigator.vibrate) navigator.vibrate(100); } },1000); } },1000);
  vid.onerror=()=>{ clearInterval(loadChecker); handleVideoError(`Error: ${currentVideo.title}`); };
}
function handleVideoError(msg){ clearInterval(timer); timer=null; clearInterval(loadChecker); failCount++; errEl.textContent=`${msg} - skipping...`; ov.style.display='flex'; ov.innerHTML=`⚠️ ${currentVideo?.title||'Video'} DEAD<br><small>Skipping...</small>`; setTimeout(()=>{ today++; if(today>=10){ ov.innerHTML='🎉 10/10 Done!'; btn.textContent='Limit Reached'; btn.disabled=true; BLAST(); updateUI(); return; } if(today>=dailyPlaylist.length){ dailyPlaylist=getRandomPlaylist(); today=0; } updateUI(); ov.innerHTML=`<div>Next: ${dailyPlaylist[today]?.title||'Ready'}</div><small>Tap Start</small>`; btn.textContent='Start & Earn'; btn.disabled=false; btn.onclick=doAd; pbar.style.width='0%'; vid.removeAttribute('src'); vid.load(); },2000); }
async function claim(){
  if(!currentUser) return; if(today>=10){ ov.innerHTML='🎉 10/10 Done!'; btn.textContent='Limit Reached'; btn.disabled=true; return; } if(!adWindowOpened){errEl.textContent='Ad not opened'; return;} if(!currentVideo){ errEl.textContent='No video'; return; }
  btn.disabled=true; btn.textContent='Saving...'; const videoTitleToSave = currentVideo.title;
  try{ await db.collection('users').doc(currentUser.uid).set({ balance: firebase.firestore.FieldValue.increment(2), points: firebase.firestore.FieldValue.increment(2), todayCount: firebase.firestore.FieldValue.increment(1), today: firebase.firestore.FieldValue.increment(1), lastWatchDate: firebase.firestore.FieldValue.serverTimestamp() },{merge:true}); await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({ action:'Watch & Earn',type:'watch',points:2,desc:videoTitleToSave, timestamp:firebase.firestore.FieldValue.serverTimestamp() }); showBubble(`+2 coins!`); currentVideo=null; }catch(e){ errEl.textContent='Save failed: '+e.message; btn.disabled=false; btn.textContent='Try Again - Claim'; return; }
  adWindowOpened=false; vid.removeAttribute('src'); vid.load(); pbar.style.width='0%'; btn.textContent='Start & Earn'; btn.disabled=false; btn.onclick=doAd;
}
btn.onclick=doAd;
</script>
