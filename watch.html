<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

.video-box{background:#000;border-radius:14px;overflow:hidden;border:2px solid #111827;width:100%;margin-top:6px}
.player{background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:14px 10px;text-align:center}

/* === EXPLOIT WHITE SPACE + FORCE HILLTOPADS FULL === */
.ad-exploit{
  width:100%;max-width:500px;flex:1;
  min-height:45vh;display:flex;align-items:flex-end;justify-content:center;
  margin-top:8px;padding-bottom:56px; /* space for nav */
}
/* Force HilltopAds container to be FULL WIDTH not half */
div[id*="quarrelsome"], div[id*="bSXIV"], iframe[src*="quarrelsomebitter.com"],
div[style*="position: fixed"][style*="bottom"]{
  width:100% !important;max-width:500px !important;

<body>
<div id="bubble" class="bubble"></div>
<div class="header"><div class="back" onclick="location.href='./home.html'">‹</div><h2 style="font-size:17px;font-weight:800">📺 Watch Ads & Earn</h2></div>
<div class="main-card">
<div class="balance-box">
<div style="color:#d1d5db;font-size:10px">Your Balance</div>
<div style="margin-top:1px"><span style="font-size:18px;color:#fbbf24;font-weight:900" id="bal">-- 🪙</span> <span style="font-size:11px;color:#e5e7eb">• <span id="today">0/20</span> today</span></div>
<div style="font-size:10px;color:#facc15;margin-top:2px" id="vt">Ready</div>
</div>
<div class="video-box">
<div class="player" id="ov"><div style="color:#fff;font-weight:800;font-size:13px">Watch 20 sec to earn 5 🪙</div></div>
<div class="progress"><div class="progress-bar" id="pbar"></div></div>
<div style="padding:6px;background:#000"><button class="btn" id="btn">Start & Earn</button></div>
</div>
</div>

<!-- THIS DIV EXPLOITS YOUR WHITE SPACE -->
<div class="ad-exploit" id="adExploit">
  <!-- HilltopAds will be forced to fill here as FULL -->
  <div style="color:#9ca3af;font-size:11px;text-align:center;padding:20px">Ad loading full...</div>
</div>

<script>
const DIRECT_LINK="https://omg10.com/4/11905870";
const REQUIRED_WATCH_SEC = 20;
function showBubble(t){const b=document.getElementById('bubble'); b.textContent=t; b.style.display='block'; setTimeout(()=>b.style.display='none',2000);}
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
let bal=0,today=0,currentUser=null,timer=null,adWindowOpened=false,isOwnerMode=false;
const ov=document.getElementById('ov'),btn=document.getElementById('btn'),pbar=document.getElementById('pbar'),balEl=document.getElementById('bal'),todayEl=document.getElementById('today'),vtEl=document.getElementById('vt');

function updateUI(){ 
  let d=Math.min(today,20); 
  balEl.textContent=bal+' 🪙 coins'; 
  todayEl.textContent=d+'/20'; 
  vtEl.textContent=today>=20?'🎉 20/20 done!':`${d}/20 done`;
  btn.textContent=today>=20?'Continue watching freely':'Start & Earn';
  isOwnerMode=today>=20;
}
auth.onAuthStateChanged(u=>{
  if(!u){location.href='./index.html';return;} currentUser=u; 
  db.collection('users').doc(u.uid).onSnapshot(async s=>{ 
    if(s.exists){ 
      const data=s.data(); bal=data.balance ?? data.coins ?? 0; 
      let serverCount = data.todayCount ?? 0;
      const last=data.lastWatchDate?data.lastWatchDate.toDate?data.lastWatchDate.toDate():new Date(data.lastWatchDate):null; 
      if(last && new Date().toDateString() !== last.toDateString() && serverCount !== 0){
        serverCount=0;
        try{ await db.collection('users').doc(u.uid).set({todayCount:0, today:0, lastWatchDate: firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }catch(e){}
      }
      today = serverCount; updateUI(); 
    } 
  });
});
function doAd(){ 
  adWindowOpened=false; 
  const win=window.open(DIRECT_LINK,'_blank'); 
  if(!win || win.closed || typeof win.closed=='undefined'){ btn.disabled=false; return; } 
  adWindowOpened=true; btn.disabled=true; 
  ov.innerHTML='<div style="color:#fff;font-weight:800;font-size:13px">Verifying... 3s</div>'; 
  pbar.style.width='0%'; 
  let ad=3; let adInt=setInterval(()=>{ ad--; ov.innerHTML=`<div style="color:#fff;font-weight:800;font-size:13px">📢 Check ${ad}s</div>`; if(ad<=0){clearInterval(adInt); startTimer();} },1000); 
}
function startTimer(){
  ov.innerHTML='<div style="color:#fbbf24;font-weight:800;font-size:13px">💰 Earning... Stay here</div>';
  let sec=0; btn.textContent=`💰 ${sec}/${REQUIRED_WATCH_SEC}s`; clearInterval(timer); 
  timer=setInterval(()=>{
    sec++; pbar.style.width=(sec/REQUIRED_WATCH_SEC*100)+'%'; btn.textContent=`💰 ${sec}/${REQUIRED_WATCH_SEC}s`; 
    if(sec>=REQUIRED_WATCH_SEC){ 
      clearInterval(timer); timer=null; pbar.style.width='100%';
      if(isOwnerMode){
        ov.innerHTML='<div style="color:#fff;font-weight:800;font-size:13px">✅ Thanks! Owner profit</div>';
        btn.textContent='Continue watching freely'; btn.disabled=false; 
        btn.onclick=()=>{ adWindowOpened=false; pbar.style.width='0%'; ov.innerHTML='<div style="color:#fff;font-weight:800;font-size:13px">Watch 20 sec to earn 5 🪙</div>'; btn.textContent='Continue watching freely'; btn.onclick=doAd; };
      } else {
        ov.innerHTML='<div style="color:#fff;font-weight:800;font-size:13px">✅ 20s Done! Claim</div>';
        btn.textContent='🎉 Claim 5 🪙!'; btn.disabled=false; btn.onclick=claim; 
      }
    } 
  },1000);
}
async function claim(){
  if(!currentUser || !adWindowOpened) return;
  if(isOwnerMode){ adWindowOpened=false; pbar.style.width='0%'; ov.innerHTML='<div style="color:#fff;font-weight:800;font-size:13px">Watch 20 sec to earn 5 🪙</div>'; btn.textContent='Continue watching freely'; btn.onclick=doAd; return; }
  btn.disabled=true; btn.textContent='Saving...'; 
  try{ 
    await db.collection('users').doc(currentUser.uid).set({ balance: firebase.firestore.FieldValue.increment(5), coins: firebase.firestore.FieldValue.increment(5), todayCount: firebase.firestore.FieldValue.increment(1), lastWatchDate: firebase.firestore.FieldValue.serverTimestamp() },{merge:true}); 
    await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({ action:'Watch & Earn',type:'watch',coins:5, timestamp:firebase.firestore.FieldValue.serverTimestamp() }); 
    showBubble(`+5 🪙!`); 
  }catch(e){ btn.disabled=false; btn.textContent='Try Again'; return; }
  adWindowOpened=false; pbar.style.width='0%'; ov.innerHTML='<div style="color:#fff;font-weight:800;font-size:13px">Watch 20 sec to earn 5 🪙</div>'; updateUI(); btn.disabled=false; btn.onclick=doAd;
}
btn.onclick=doAd;

/* FORCE HILLTOPADS TO FULL - 2 sec after load */
setTimeout(()=>{
  document.querySelectorAll('div, iframe').forEach(el=>{
    const s = el.getAttribute('style') || '';
    if(s.includes('fixed') && s.includes('bottom')){
      el.style.width='100%';
      el.style.maxWidth='500px';
      el.style.left='50%';
      el.style.transform='translateX(-50%)';
      el.style.right='auto';
      if(el.tagName==='IFRAME'){ el.style.height='52vh'; el.style.minHeight='340px'; }
    }
  });
  const exploit = document.getElementById('adExploit');
  if(exploit) exploit.innerHTML='';
}, 2500);
setInterval(()=>{
  document.querySelectorAll('iframe[src*="quarrelsomebitter"]').forEach(el=>{
    el.style.width='100% !important';
    el.style.height='52vh';
  });
}, 5000);
</script>
</body>
