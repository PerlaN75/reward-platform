<!DOCTYPE html>
<html>
<head>
<title>Watch Ads & Earn</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(s){s.dataset.zone='12211617',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f7f7fb;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 14px}
.header{display:flex;align-items:center;gap:10px;margin:10px 0;width:100%;max-width:500px}
.back-btn-checkin{width:45px;height:30px;border-radius:12px;background:linear-gradient(180deg,#fff5f5,#fecaca);border:2px solid #f87171;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#991b1b;font-weight:900;font-size:22px;cursor:pointer;box-shadow:0 2px 0 #fca5a5;flex-shrink:0}
.main-card{width:100%;max-width:500px;background:#fff;border:1px solid #eef2f7;border-radius:20px;padding:10px;box-shadow:0 4px 20px rgba(0,0,0,0.05)}
.balance-box{background:#2f3e1a;border:2px solid #fbbf24;border-radius:16px;padding:10px;text-align:center;color:#fff}
.video-box{background:#000;border-radius:16px;overflow:hidden;border:2px solid #111827;width:100%;margin-top:10px}
.player{background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:22px 14px 16px;text-align:center;min-height:auto}
.progress{height:6px;background:#1f2937;width:100%}.progress-bar{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);width:0%;transition:width .3s}
.btn{width:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:none;border-radius:12px;padding:12px;font-weight:900;font-size:14px;cursor:pointer;margin:8px 0 0;box-shadow:0 2px 0 #d97706}
.bubble{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fbbf24;color:#000;padding:10px 18px;border-radius:999px;font-weight:900;z-index:10000;display:none}
</style>
</head>
<body>
<div id="bubble" class="bubble"></div>
<div class="header"><a href="home.html" class="back-btn-checkin">‹</a><h2 style="font-size:18px;font-weight:800">📺 Watch Ads & Earn</h2></div>
<div class="main-card">
<div class="balance-box">
<div style="color:#d1d5db;font-size:11px">Your Balance</div>
<div style="margin-top:2px"><span style="font-size:20px;color:#fbbf24;font-weight:900" id="bal">-- 🪙</span> <span style="font-size:12px;color:#e5e7eb">• <span id="today">0/20</span> today</span></div>
<div style="font-size:11px;color:#facc15;margin-top:3px" id="vt">Ready</div>
</div>
<div class="video-box">
<div class="player" id="ov"><div style="color:#fff;font-weight:800;font-size:14px">Watch 20 sec to earn 5 🪙</div></div>
<div class="progress"><div class="progress-bar" id="pbar"></div></div>
<div style="padding:8px;background:#000"><button class="btn" id="btn">Start & Earn</button></div>
</div>
</div>
<script>
const DIRECT_LINK="REPLACE_WITH_VIDEOS_LATER";
const REQUIRED_WATCH_SEC=20;
function showBubble(t){const b=document.getElementById('bubble');b.textContent=t;b.style.display='block';setTimeout(()=>b.style.display='none',2000);}
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
let bal=0,today=0,currentUser=null,timer=null,adWindowOpened=false,isOwnerMode=false,resetDone=false;
const ov=document.getElementById('ov'),btn=document.getElementById('btn'),pbar=document.getElementById('pbar'),balEl=document.getElementById('bal'),todayEl=document.getElementById('today'),vtEl=document.getElementById('vt');
function updateUI(){let d=Math.min(today,20);balEl.textContent=bal+' 🪙 coins';todayEl.textContent=d+'/20';if(today>=20){isOwnerMode=true;vtEl.textContent='🎉 20/20 rewarded done!';btn.textContent='Continue watching freely';}else{isOwnerMode=false;vtEl.textContent=today>0?`${today}/20 done`:'Ready to earn';btn.textContent='Start & Earn';}}
auth.onAuthStateChanged(u=>{
  if(!u){location.href='./index.html';return;}
  currentUser=u;
  db.collection('users').doc(u.uid).onSnapshot(async s=>{
    if(!s.exists)return;
    const data=s.data();
    bal=data.balance??data.coins??0;
    let serverCount=data.todayCount??0;
    const lastRaw=data.lastWatchDate;
    const last=lastRaw? (lastRaw.toDate? lastRaw.toDate(): new Date(lastRaw)) : null;
    if(last && new Date().toDateString()!==last.toDateString() && serverCount!==0 && !resetDone){
      resetDone=true;serverCount=0;
      try{await db.collection('users').doc(u.uid).update({todayCount:0,lastWatchDate: firebase.firestore.FieldValue.serverTimestamp(),lastEarnAt: firebase.firestore.FieldValue.serverTimestamp()});}catch(e){}
      today=0;updateUI();return;
    }
    today=serverCount;updateUI();
  });
});
function doAd(){btn.disabled=true;ov.innerHTML='<div style="color:#fff;font-weight:800">▶️ Video placeholder - will be replaced</div>';pbar.style.width='0%';startTimer();}
function startTimer(){ov.innerHTML='<div style="color:#fbbf24;font-weight:800">💰 Earning... Stay 20s</div>';let sec=0;btn.textContent='💰 '+sec+'/'+REQUIRED_WATCH_SEC+'s';clearInterval(timer);timer=setInterval(()=>{sec++;pbar.style.width=(sec/REQUIRED_WATCH_SEC*100)+'%';btn.textContent='💰 '+sec+'/'+REQUIRED_WATCH_SEC+'s';if(sec>=REQUIRED_WATCH_SEC){clearInterval(timer);timer=null;pbar.style.width='100%';ov.innerHTML='<div style="color:#fff;font-weight:800">✅ 20s Done! Tap to claim</div>';btn.textContent='🎉 Claim 5 🪙!';btn.disabled=false;btn.onclick=claim;}},1000);}
async function claim(){
  if(!currentUser)return;
  btn.disabled=true;btn.textContent='Saving...';
  try{
    await db.collection('users').doc(currentUser.uid).update({balance: firebase.firestore.FieldValue.increment(5),coins: firebase.firestore.FieldValue.increment(5),todayCount: firebase.firestore.FieldValue.increment(1),lastWatchDate: firebase.firestore.FieldValue.serverTimestamp(),lastEarnAt: firebase.firestore.FieldValue.serverTimestamp()});
    await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({action:'Watch & Earn',type:'watch',coins:5,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
    showBubble('+5 🪙!');
  }catch(e){btn.disabled=false;btn.textContent='Try again';return;}
  pbar.style.width='0%';ov.innerHTML='<div style="color:#fff;font-weight:800">Watch 20 sec to earn 5 🪙</div>';btn.disabled=false;btn.onclick=doAd;
}
btn.onclick=doAd;
</script>
</body>
</html>
