function getAllVideos(){

 return BASE_POOL.concat(extra);

function seededShuffle(arr,seed){
 let a=arr.slice(); let s=seed;
 function rand(){s=(s*9301+49297)%233280; return s/233280;}
 for(let i=a.length-1;i>0;i--){let j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
 return a;
}
function getDayOfYear(){return Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/86400000);}
function getTodayPlaylist(){
 const all=getAllVideos(); const day=getDayOfYear();
 const shuffled=seededShuffle(all, day);
 return {playlist: shuffled.slice(0,10), poolSize: all.length, day};
}

async function claim(){

 try{const ref=db.collection('users').doc(currentUser.uid);

 }catch(e){bal++;today++;}
 vid.style.display='none';pbar.style.width='0%';btn.textContent='Start & Earn 1 🪙';btn.disabled=false;btn.onclick=doAd;updateUI();
 if(today>=10){ov.innerHTML='🎉 10/10 DONE! 🎊<br>New mix tomorrow!';btn.textContent='Limit Reached';btn.disabled=true;BLAST();}
