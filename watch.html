<!DOCTYPE html>
<html>
<head>
<title>Watch & Earn</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f3f4f6;min-height:100vh;display:flex;justify-content:center;padding:14px 10px 90px 10px}
.card{width:100%;max-width:380px;background:#fff;border:2px solid #e5e7eb;border-radius:24px;padding:16px 14px}
.top-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back-square{width:42px;height:38px;background:#fef2f2;border:2px solid #ef4444;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#991b1b;font-weight:900;font-size:22px;cursor:pointer}
h1{font-size:22px;font-weight:900;flex:1}
.balance-box{background:#fffbeb;border:2px solid #fde68a;border-radius:16px;padding:12px;text-align:center;margin-bottom:10px}
.tip-box{background:#f0fdf4;border:1px solid #bbf7d0;border-left:4px solid #22c55e;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#166534;line-height:1.4}
.video-box{background:#000;border-radius:16px;overflow:hidden;border:2px solid #e5e7eb}
.player{aspect-ratio:16/10;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;display:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.85);color:#fff;text-align:center;padding:12px;flex-direction:column;z-index:2;font-weight:700}
.progress{height:8px;background:#e5e7eb}.progress-bar{height:100%;background:#f59e0b;width:0%;transition:width .3s}
.btn{width:100%;background:#f59e0b;color:#000;border:none;border-radius:12px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;margin:12px 0 0}
.btn:disabled{background:#9ca3af;color:#fff}
.sponsored{font-size:9px;color:#9ca3af;font-weight:bold;text-align:center;margin:10px 0 4px}
.ad-box{min-height:250px;display:flex;justify-content:center;align-items:center;background:#fafafa;border-radius:12px;border:1px dashed #e5e7eb}
</style>
</head>
<body>
<div class="card">
<div class="top-header"><div class="back-square" onclick="location.href='home.html'">‹</div><h1>📺 Watch & Earn</h1></div>

<div class="balance-box">Balance: <b id="bal">Loading...</b><br><span style="font-size:13px;color:#6b7280"><span id="today">0/10</span> today • 1 Coin per video</span><div style="font-size:11px;color:#d97706;margin-top:6px" id="vt"></div></div>

<div class="tip-box">💡 <i>Press on Start, watch and Claim. But also those offers might be useful to You</i></div>

<div class="sponsored">SPONSORED - TOP</div>
<div class="ad-box" id="adTop"></div>

<div class="video-box" style="margin-top:12px">
<div class="player"><video id="v" playsinline></video><div class="overlay" id="ov">Tap Start</div></div>
<div class="progress"><div class="progress-bar" id="pbar"></div></div>
<div style="padding:0 12px 12px"><button class="btn" id="btn">Start & Earn 1 🪙</button></div>
</div>

<div class="sponsored">SPONSORED - BOTTOM</div>
<div class="ad-box" id="adBottom" style="margin-bottom:8px"></div>
<div id="container-23e1e60b5d9d8473949f8c3ca250759b"></div>
<script async data-cfasync="false" src="https://bicea.org/21/23e1e60b5d9d8473949f8c3ca250759b"></script>
</div>

<script>
function loadAdsterra(containerId, key){
  var c=document.getElementById(containerId); if(!c) return;
  var s1=document.createElement('script'); s1.innerHTML="atOptions={'key':'"+key+"','format':'iframe','height':250,'width':300,'params':{}};"; c.appendChild(s1);
  var s2=document.createElement('script'); s2.src='https://bicea.org/22/'+key; c.appendChild(s2);
}
loadAdsterra('adTop','bf10cacdbe9f50d0c5d66a94e0785f29');
setTimeout(function(){loadAdsterra('adBottom','bf10cacdbe9f50d0c5d66a94e0785f29');},1500);
function canShowV(){var l=localStorage.getItem('v_last');return !l||Date.now()-parseInt(l)>30*60*1000}
function canShowP(){var l=localStorage.getItem('p_last');return !l||Date.now()-parseInt(l)>60*60*1000}
function loadV(){if(!canShowV())return; if(document.querySelector('script[data-zone="12083688"]'))return; var s=document.createElement('script');s.dataset.zone='12083688';s.src='https://n6wxm.com/vignette.min.js';document.body.appendChild(s);localStorage.setItem('v_last',Date.now())}
function loadP(){if(!canShowP())return; if(document.querySelector('script[data-zone="12083693"]'))return; var s=document.createElement('script');s.dataset.zone='12083693';s.src='https://al5sm.com/tag.min.js';document.body.appendChild(s);localStorage.setItem('p_last',Date.now())}
const ALL_VIDEOS=[{src:"https://www.w3schools.com/html/mov_bbb.mp4",title:"Big Buck Bunny"},{src:"https://test-videos.co.uk/vids/sintel/mp4/h264/720/Sintel_720_10s_1MB.mp4",title:"Morning Motivation"},{src:"https://test-videos.co.uk/vids/flower/mp4/h264/720/Flower_720_10s_1MB.mp4",title:"Peaceful Flowers"}];
function getDayOfYear(){return Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/86400000);}
function getTodayPlaylist(){const off=getDayOfYear()%ALL_VIDEOS.length;let pl=[];for(let i=0;i<10;i++)pl.push(ALL_VIDEOS[(off+i)%ALL_VIDEOS.length]);return{playlist:pl}}
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);firebase.appCheck().activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);
const auth=firebase.auth(),db=firebase.firestore();
let bal=0,today=0,currentUser=null,timer=null,dailyData=null;
const ov=document.getElementById('ov'),vid=document.getElementById('v'),btn=document.getElementById('btn'),pbar=document.getElementById('pbar'),balEl=document.getElementById('bal'),todayEl=document.getElementById('today'),vtEl=document.getElementById('vt');
function getCoins(d){return d.balance??d.coins??0;}
function updateUI(){balEl.textContent=bal+' 🪙';todayEl.textContent=Math.min(today,10)+'/10';if(dailyData&&today<10)vtEl.textContent='Next: '+dailyData.playlist[today].title;else if(today>=10)vtEl.textContent='All done!';}
auth.onAuthStateChanged(async(u)=>{if(!u){location.href='./index.html';return;}currentUser=u;dailyData=getTodayPlaylist();const ref=db.collection('users').doc(u.uid);const s=await ref.get();if(s.exists){const d=s.data();bal=getCoins(d);today=d.todayCount??0;const last=d.lastWatchDate?d.lastWatchDate.toDate?d.lastWatchDate.toDate():new Date(d.lastWatchDate):null;if(last&&last.toDateString()!==new Date().toDateString()){today=0;await ref.set({today:0,todayCount:0},{merge:true});}}updateUI();if(today>=10){ov.innerHTML='🎉 10/10 Done!';btn.disabled=true;}else{ov.innerHTML=`<div>${dailyData.playlist[today].title}</div><small>Tap Start</small>`;}});
function doAd(){if(today>=10)return;loadV();btn.disabled=true;ov.innerHTML='Loading...';pbar.style.width='0%';setTimeout(()=>startVideo(),500);}
function startVideo(){const cur=dailyData.playlist[Math.min(today,9)];ov.style.display='none';vid.src=cur.src;vid.load();vid.style.display='block';vid.play().catch(()=>{});let sec=0;btn.textContent='⏳ Earning...';timer=setInterval(()=>{sec++;pbar.style.width=(sec/15*100)+'%';if(sec>=15){clearInterval(timer);vid.pause();btn.textContent='🎉 Claim 1 🪙!';btn.disabled=false;btn.onclick=claim;ov.style.display='flex';ov.innerHTML='✅ Done! Tap to claim';}},1000);}
async function claim(){if(today>=10)return;loadP();btn.disabled=true;btn.textContent='Saving...';try{const ref=db.collection('users').doc(currentUser.uid);await ref.update({balance:firebase.firestore.FieldValue.increment(1),coins:firebase.firestore.FieldValue.increment(1),todayCount:firebase.firestore.FieldValue.increment(1),today:firebase.firestore.FieldValue.increment(1),lastWatchDate:firebase.firestore.FieldValue.serverTimestamp()});const doc=await ref.get();bal=getCoins(doc.data());today=doc.data().todayCount??0;}catch(e){bal++;today++;}vid.style.display='none';pbar.style.width='0%';btn.textContent='Start & Earn 1 🪙';btn.disabled=false;btn.onclick=doAd;updateUI();if(today>=10){ov.innerHTML='🎉 10/10 Done!';btn.disabled=true;}else{ov.innerHTML=`<div>${dailyData.playlist[today].title}</div><small>Tap Start</small>`;ov.style.display='flex';}}
btn.onclick=doAd;
</script>
</body>
</html>
