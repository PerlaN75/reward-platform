<!DOCTYPE html>
<html>
<head>
  <title>Watch & Earn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#0f1508;min-height:100vh;padding:15px 15px 40px 15px;color:white;display:flex;justify-content:center}
   .container{background:#2f3e1a;border:3px solid #fbbf24;border-radius:20px;padding:20px 20px 35px 20px;width:95%;max-width:360px;height:auto;min-height:560px}
    h1{text-align:center;color:#fbbf24;font-size:26px}
   .balance{background:#0f1508;border:2px solid #fbbf24;border-radius:14px;padding:12px;text-align:center;margin:12px 0}
    #tasks{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:8px 2px 15px 2px;margin-top:18px;margin-bottom:10px;scrollbar-width:none}
    #tasks::-webkit-scrollbar{display:none}
   .task{background:#000;border:2px solid #444;border-radius:14px;padding:12px 10px 18px 10px;min-width:265px;max-width:265px;flex:0 0 80%;scroll-snap-align:center;flex-shrink:0;min-height:305px}
   .task.active{border-color:#22c55e}
   .task.done{opacity:0.6;border-color:#22c55e}
   .video-box{background:#111;border-radius:10px;height:155px;display:flex;justify-content:center;align-items:center;margin:12px 0 14px 0;overflow:hidden;position:relative}
   .video-box iframe{width:100%;height:100%;border:none}
   .btn{width:100%;padding:11px;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:none;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer;margin-top:6px}
   .btn:disabled{background:#444;color:#888}
   .timer{color:#fbbf24;font-weight:bold;text-align:center;margin-top:4px;font-size:11px}
   .back{background:#f59e0b;color:#000;border:none;padding:11px 20px;border-radius:12px;font-weight:bold;width:40%;margin:18px auto 10px auto;display:block;cursor:pointer}
   .note{font-size:11px;color:#aaa;text-align:center;margin-top:14px;line-height:1.3}
   .swipe-hint{text-align:center;color:#fbbf24;font-size:11px;margin:4px 0}
   .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:9999;padding:20px}
   .modal-box{background:#2f3e1a;border:3px solid #fbbf24;border-radius:18px;padding:22px;width:100%;max-width:340px;text-align:center}
   .modal-box h3{color:#fbbf24;margin-bottom:10px;font-size:18px}
   .modal-box p{color:#fff;font-size:14px;margin-bottom:18px;line-height:1.4}
   .modal-ok{background:linear-gradient(90deg,#fbbf24,#f59e0b);border:none;padding:10px 22px;border-radius:10px;font-weight:bold;cursor:pointer}
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div class="container">
  <h1>Watch & Earn</h1>
  <div class="balance">
    Balance: <span id="bal">0</span> pts<br>
    <small>Today: <span id="todayCount">0</span>/10 videos</small>
  </div>
  <div class="swipe-hint">← Swipe left / right to browse →</div>
  <div id="tasks"></div>
  <div class="note">Leave this page = timer resets. Watch full video to claim.<br>Ad partners slot ready.</div>
  <button class="back" onclick="location.href='./home.html'">Back</button>
</div>
<div class="modal-bg" id="customAlert">
  <div class="modal-box">
    <h3 id="alertTitle">Notice</h3>
    <p id="alertMsg"></p>
    <button class="modal-ok" onclick="document.getElementById('customAlert').style.display='none'">OK</button>
  </div>
</div>
<script>
  const firebaseConfig = {apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
  firebase.initializeApp(firebaseConfig);
  const auth=firebase.auth(),db=firebase.firestore();
  const VIDEOS = [
    {id:'v1', title:'Earning Tips (30s)', reward:10, duration:30, youtubeId:'dQw4w9WgXcQ', adLink:''},
    {id:'v2', title:'Partner Promo 1 (30s)', reward:10, duration:30, youtubeId:'jNQXAC9IVRw', adLink:''},
    {id:'v3', title:'Partner Promo 2 (30s)', reward:10, duration:30, youtubeId:'dQw4w9WgXcQ', adLink:''},
    {id:'v4', title:'Daily Motivation (30s)', reward:10, duration:30, youtubeId:'jNQXAC9IVRw', adLink:''},
    {id:'v5', title:'Success Story (30s)', reward:10, duration:30, youtubeId:'dQw4w9WgXcQ', adLink:''},
    {id:'v6', title:'How to Earn More (30s)', reward:10, duration:30, youtubeId:'jNQXAC9IVRw', adLink:''},
    {id:'v7', title:'New Feature Preview (30s)', reward:10, duration:30, youtubeId:'dQw4w9WgXcQ', adLink:''},
    {id:'v8', title:'Community Winner (30s)', reward:10, duration:30, youtubeId:'jNQXAC9IVRw', adLink:''},
    {id:'v9', title:'Quick Tutorial (30s)', reward:10, duration:30, youtubeId:'dQw4w9WgXcQ', adLink:''},
    {id:'v10', title:'Daily Bonus Video (30s)', reward:15, duration:30, youtubeId:'jNQXAC9IVRw', adLink:''},
  ];
  let currentUser=null,userDoc=null,watchData={};
  function showAlert(msg,title='Notice'){document.getElementById('alertTitle').innerText=title;document.getElementById('alertMsg').innerText=msg;document.getElementById('customAlert').style.display='flex';}
  auth.onAuthStateChanged(async (user)=>{
    if(!user){location.href='./index.html';return;}
    currentUser=user;
    const doc=await db.collection('users').doc(user.uid).get();userDoc=doc.data();
    document.getElementById('bal').innerText=userDoc.balance||0;
    const today=new Date().toISOString().slice(0,10);
    const snap=await db.collection('users').doc(user.uid).collection('watchHistory').where('date','==',today).get();
    snap.forEach(d=>watchData[d.id]=true);
    document.getElementById('todayCount').innerText=snap.size;
    renderTasks();
  });
  function renderTasks(){
    const wrap=document.getElementById('tasks');wrap.innerHTML='';
    VIDEOS.forEach(v=>{
      const isDone=!!watchData[v.id];
      const div=document.createElement('div');div.className='task'+(isDone?' done':'');
      div.innerHTML=`<b>${v.title}</b> - ${v.reward} pts ${isDone?'✅':''}<div class="video-box" id="box-${v.id}"><small>Click Start to watch</small></div><div class="timer" id="timer-${v.id}"></div><button class="btn" id="btn-${v.id}" ${isDone?'disabled':''} onclick="startWatch('${v.id}')">${isDone?'Claimed':'Start & Earn'}</button>`;
      wrap.appendChild(div);
    });
  }
  let intervals={};
  window.startWatch=function(videoId){
    const v=VIDEOS.find(x=>x.id===videoId);
    const box=document.getElementById('box-'+videoId),btn=document.getElementById('btn-'+videoId),timerEl=document.getElementById('timer-'+videoId);
    if(v.adLink){window.open(v.adLink,'_blank');box.innerHTML=`<div style="padding:20px;text-align:center;color:#22c55e">Ad opened!<br>Reward after ${v.duration}s</div>`;}else{box.innerHTML=`<iframe src="https://www.youtube.com/embed/${v.youtubeId}?autoplay=1&mute=1&controls=0&rel=0" allow="autoplay"></iframe>`;}
    let left=v.duration;btn.disabled=true;btn.innerText='Watching...';document.querySelectorAll('.task').forEach(t=>t.classList.remove('active'));document.getElementById('box-'+videoId).parentElement.classList.add('active');
    intervals[videoId]=setInterval(()=>{if(document.hidden){timerEl.innerText=`Paused - return!`;return;}left--;timerEl.innerText=`Claim in ${left}s`;if(left<=0){clearInterval(intervals[videoId]);btn.disabled=false;btn.innerText=`Claim ${v.reward} pts`;btn.onclick=()=>claimReward(videoId);timerEl.innerText=`✅ Ready!`;timerEl.style.color='#22c55e';}},1000);
  }
  async function claimReward(videoId){
    const v=VIDEOS.find(x=>x.id===videoId),today=new Date().toISOString().slice(0,10),btn=document.getElementById('btn-'+videoId);btn.disabled=true;btn.innerText='Claiming...';
    try{
      const check=await db.collection('users').doc(currentUser.uid).collection('watchHistory').doc(videoId+'_'+today).get();
      if(check.exists){showAlert('Already claimed today!','Oops!');btn.innerText='Claimed ✅';return;}
      await db.collection('users').doc(currentUser.uid).collection('watchHistory').doc(videoId+'_'+today).set({videoId,reward:v.reward,date:today,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
      await db.collection('users').doc(currentUser.uid).update({balance:firebase.firestore.FieldValue.increment(v.reward)});
      const newBal=parseInt(document.getElementById('bal').innerText)+v.reward;document.getElementById('bal').innerText=newBal;localStorage.setItem('points',newBal);
      document.getElementById('todayCount').innerText=parseInt(document.getElementById('todayCount').innerText)+1;watchData[videoId]=true;btn.innerText='Claimed ✅';document.getElementById('box-'+videoId).innerHTML='<b style="color:#22c55e">+'+v.reward+' pts</b>';
    }catch(e){showAlert(e.message,'Error');btn.disabled=false;}
  }
</script>
</body>
</html>
