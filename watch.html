<!DOCTYPE html>
<html>
<head>
  <title>Watch & Earn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; color: white; padding: 20px; text-align: center; }
    h1 { color: #fbbf24; margin-bottom: 20px; font-size: 28px; }
    .video-box { background: #4a6128; padding: 20px; border-radius: 20px; border: 3px solid #fbbf24; max-width: 500px; margin: 0 auto; }
    video { width: 100%; border-radius: 12px; background: #000; }
    .timer { font-size: 20px; font-weight: bold; color: #fbbf24; margin: 15px 0; }
   .btn-claim { width: 100%; padding: 16px; background: linear-gradient(180deg, #22c55e, #16a34a); color: #fff; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; display: none; box-shadow: 0 4px 0 #15803d; }
   .cooldown { color: #ef4444; font-weight: bold; margin-top: 15px; font-size: 15px; }
    .success { color: #22c55e; font-weight: bold; margin-top: 15px; font-size: 16px; }
    .btn-back { width: 40%; padding: 14px; background: white; color: black; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px; box-shadow: 0 3px 0 #ccc; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>📺 Watch & Earn</h1>
  
  <div id="cooldownBox" class="hidden">
    <div class="cooldown" id="cooldownMsg"></div>
    <button class="btn-back" onclick="window.location.href='./home.html'">Back</button>
  </div>

  <div class="video-box" id="videoBox">
    <video id="videoPlayer" controls playsinline>
      <!-- WORKING VIDEO LINK -->
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
      Your browser does not support video.
    </video>
    <div class="timer" id="timer">Tap play and watch 30s to claim</div>
    <button class="btn-claim" id="claimBtn" onclick="claimReward()">Claim +10 Points</button>
    <div class="success" id="successMsg"></div>
  </div>
  
  <button class="btn-back" id="backBtn" onclick="window.location.href='./home.html'">Back</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d",
    storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
    messagingSenderId: "787550951987",
    appId: "1:787550951987:web:724b1463e821b99c90a146"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const video = document.getElementById('videoPlayer');
  const timerEl = document.getElementById('timer');
  const claimBtn = document.getElementById('claimBtn');
  const videoBox = document.getElementById('videoBox');
  const cooldownBox = document.getElementById('cooldownBox');
  const cooldownMsg = document.getElementById('cooldownMsg');
  const successMsg = document.getElementById('successMsg');

  let currentUid = null;
  const WATCH_REQUIRED = 30;

  onAuthStateChanged(auth, async (user) => {
    if (!user) return window.location.href = './log.html';
    currentUid = user.uid;
    await checkCooldown();
  });

  async function checkCooldown(){
    const userRef = doc(db, "users", currentUid);
    const snap = await getDoc(userRef);
    if(!snap.exists()) return;
    const data = snap.data();
    const lastWatch = data.lastWatchClaim?.toDate();
    if(lastWatch){
      const diff = Date.now() - lastWatch.getTime();
      const cooldown = 60 * 60 * 1000;
      if(diff < cooldown){
        const remaining = Math.ceil((cooldown - diff) / 60000);
        videoBox.classList.add('hidden');
        document.getElementById('backBtn').classList.add('hidden');
        cooldownBox.classList.remove('hidden');
        cooldownMsg.innerText = `Come back in ${remaining} minutes to watch again`;
        return;
      }
    }
  }

  video.addEventListener('timeupdate', () => {
    let current = Math.floor(video.currentTime);
    let remaining = Math.max(0, WATCH_REQUIRED - current);
    timerEl.innerText = `Watch ${remaining}s to claim`;
    if(current >= WATCH_REQUIRED){
      video.pause();
      claimBtn.style.display = 'block';
      timerEl.innerText = 'Done! Claim your reward';
    }
  });

  window.claimReward = async function(){
    claimBtn.disabled = true;
    try {
      const userRef = doc(db, "users", currentUid);
      await updateDoc(userRef, {
        balance: increment(10),
        lastWatchClaim: serverTimestamp()
      });
      let currentPoints = parseInt(localStorage.getItem('points') || '0');
      currentPoints += 10;
      localStorage.setItem('points', currentPoints.toString());
      successMsg.innerText = '+10 Points Added';
      videoBox.classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
      cooldownBox.classList.remove('hidden');
      cooldownMsg.innerText = 'Come back in 60 minutes to watch again';
    } catch(e){
      alert("Error: " + e.message);
      claimBtn.disabled = false;
    }
  }
</script>
</body>
</html>
