<!DOCTYPE html>
<html>
<head>
<title>Watch & Earn</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://quge5.com/88/tag.min.js" data-zone="286869" async data-cfasync="false"></script>
<script src="https://al5sm.com/tag.min.js" data-zone="286677" async data-cfasync="false"></script>
<meta name="monetag" content="b671b8351bfc48ed0161f6bd0b6a5340">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0e1a0e;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:380px;background:#1d331d;border:3px solid #fbbf24;border-radius:24px;padding:20px 18px}
h1{color:#facc15;text-align:center;font-size:28px;margin-bottom:12px}
.balance-box{background:#0a120a;border:2px solid #fbbf24;border-radius:16px;padding:12px;text-align:center;color:#fff;margin-bottom:14px;line-height:1.4}
.video-box{background:#000;border-radius:16px;overflow:hidden;border:2px solid #2a4a2a}
.player{aspect-ratio:16/10;background:#000;position:relative;display:flex;align-items:center;justify-content:center;color:#fff}
video{width:100%;height:100%;display:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.85);color:#fff;text-align:center;padding:10px}
.progress{height:4px;background:#2a4a2a}.progress-bar{height:100%;background:#fbbf24;width:0%;transition:width .2s}
.btn{width:100%;background:#fbbf24;color:#000;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:16px;cursor:pointer;margin:14px 0 0}
.btn:disabled{background:#8a6d1a}
.info{text-align:center;color:#8fbc8f;font-size:11px;margin-top:14px;line-height:1.5}
.back{display:block;margin:18px auto 0;background:#f59e0b;color:#000;border:none;padding:10px 26px;border-radius:999px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>Watch & Earn</h1>
<div class="balance-box">Balance: <b id="bal">Loading...</b><br><span style="font-size:13px">Today: <span id="today">0/10</span> videos. Watch & Earn</span></div>
<div class="video-box">
<div class="player"><video id="v" playsinline><source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4"></video><div class="overlay" id="ov">Click Start to watch</div></div>
<div class="progress"><div class="progress-bar" id="pbar"></div></div>
<div style="padding:0 12px 12px"><button class="btn" id="btn">Start & Earn</button></div>
</div>
<div class="info">Watch ad → Watch video 30s → Claim 10 pts<br>Leave page = timer resets</div>
<button class="back" onclick="location.href='./home.html'">Back</button>
</div>
<script>
const firebaseConfig = {apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain: "reward-platform-rw-2e13d.firebaseapp.com",projectId: "reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let bal=0, today=0, currentUser=null, timer=null;
const ov=document.getElementById('ov'), vid=document.getElementById('v'), btn=document.getElementById('btn'), pbar=document.getElementById('pbar'), balEl=document.getElementById('bal'), todayEl=document.getElementById('today');

function updateUI(){ balEl.textContent=bal+' pts'; todayEl.textContent=today+'/10'; }

auth.onAuthStateChanged(async (user)=>{
  if(!user){ window.location.href='./index.html'; return; }
  currentUser=user;
  const snap = await db.collection('users').doc(user.uid).get();
  if(snap.exists){
    const d=snap.data();
    bal = d.balance || d.points || 0;
    today = d.todayCount || d.today || 0;
    const last = d.lastWatchDate ? d.lastWatchDate.toDate ? d.lastWatchDate.toDate() : new Date(d.lastWatchDate) : null;
    if(last){ const isSameDay = new Date().toDateString() === last.toDateString(); if(!isSameDay){ today=0; } }
  }
  updateUI();
});

function doAd(){
  if(today>=10){ ov.style.display='flex'; ov.innerHTML='Daily limit 10/10 reached!<br>Come back tomorrow'; btn.disabled=true; return; }
  btn.disabled=true;
  ov.style.display='flex'; 
  ov.innerHTML='Opening ad...<br><small>Please wait 10s - We earn from this</small>'; 
  vid.style.display='none'; pbar.style.width='0%';
  let ad=10;
  let adInt=setInterval(()=>{
    ov.innerHTML=`Ad playing ${ad}s...<br>Don't close - Earning $$$`;
    ad--;
    if(ad<0){ clearInterval(adInt); startVideo(); }
  },1000);
}

function startVideo(){
  ov.style.display='none'; vid.style.display='block'; vid.currentTime=0; vid.play();
  let sec=0;
  timer=setInterval(()=>{
    sec++; pbar.style.width=(sec/30*100)+'%'; btn.textContent=`Watching: ${sec}/30s`;
    if(sec>=30){
      clearInterval(timer); vid.pause();
      btn.textContent='Claim 10 pts'; btn.disabled=false; btn.onclick=claim;
      ov.style.display='flex'; ov.innerHTML='✅ Done! Click Claim';
    }
  },1000);
}

async function claim(){
  if(!currentUser) return;
  btn.disabled=true; btn.textContent='Saving to Wallet...';
  bal+=10; today++;
  try{
    await db.collection('users').doc(currentUser.uid).set({
      balance: bal,
      points: bal,
      todayCount: today,
      today: today,
      lastWatchDate: firebase.firestore.FieldValue.serverTimestamp(),
      lastWatch: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
    await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({
      action:'Watch & Earn', type:'watch', points:10,
      desc:'Watched video', description:'Watched video 30s',
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      createdAt: new Date()
    });
  }catch(e){ console.log(e); }
  updateUI();
  ov.style.display='flex'; ov.innerHTML='Click Start for next video'; vid.style.display='none'; pbar.style.width='0%'; btn.textContent='Start & Earn'; btn.disabled=false; btn.onclick=doAd;
  if(today>=10){ ov.innerHTML='🎉 10/10 Done today!'; btn.textContent='Limit Reached'; btn.disabled=true; }
}

btn.onclick=doAd;
</script>
</body>
</html>
