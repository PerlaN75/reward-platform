<!DOCTYPE html>
<html>
<head>
<title>Watch & Earn</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="monetag" content="b671b8351bfc48ed0161f6bd0b6a5340">
<!-- KEEP ONLY THIS ONE MONETAG TAG - Pause all other zones in dashboard -->
<script src="https://quge5.com/88/tag.min.js" data-zone="286869" async data-cfasync="false"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0e1a0e;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.card{width:100%;max-width:380px;background:#1d331d;border:3px solid #fbbf24;border-radius:24px;padding:20px 18px;position:relative;z-index:1}
h1{color:#facc15;text-align:center;font-size:28px;margin-bottom:12px}
.balance-box{background:#0a120a;border:2px solid #fbbf24;border-radius:16px;padding:12px;text-align:center;color:#fff;margin-bottom:14px}
.video-box{background:#000;border-radius:16px;overflow:hidden;border:2px solid #2a4a2a}
.player{aspect-ratio:16/10;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
video,iframe{width:100%;height:100%;display:none;border:0}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.9);color:#fff;text-align:center;padding:12px;flex-direction:column;z-index:2;font-weight:700}
.progress{height:8px;background:#2a4a2a}.progress-bar{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);width:0%;transition:width.3s}
.btn{width:100%;background:#fbbf24;color:#000;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;margin:14px 0 0}
.btn:disabled{background:#5a4a1a;color:#aaa}
.vtitle{font-size:11px;color:#facc15;margin-top:6px}
.support-box{display:none;background:#fff8e1;border:2px dashed #fbbf24;border-radius:12px;padding:10px;margin-top:12px;text-align:center}
</style>
</head>
<body>
<canvas id="confetti" style="position:fixed;inset:0;pointer-events:none;z-index:9999;display:none"></canvas>
<div class="card">
<h1>Watch & Earn</h1>
<div class="balance-box">Balance: <b id="bal">Loading...</b><br><span style="font-size:13px"><span id="today">0/10</span> today</span><div class="vtitle" id="vt">Loading...</div></div>
<div class="video-box">
<div class="player"><video id="v" playsinline></video><iframe id="yt" allow="autoplay; encrypted-media" allowfullscreen></iframe><div class="overlay" id="ov">Tap Start</div></div>
<div class="progress"><div class="progress-bar" id="pbar"></div></div>
<div style="padding:0 12px 12px"><button class="btn" id="btn">Start & Earn</button></div>
</div>
<div id="supportBox" class="support-box">
<p style="color:#000;font-size:12px;font-weight:bold;margin-bottom:6px;">❤️ Support us for +2 pts? (Optional)</p>
<button onclick="openSupportAd()" style="background:#f59e0b;border:none;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:13px;">Watch Sponsored</button>
<button onclick="this.parentElement.style.display='none'" style="background:none;border:none;color:#666;font-size:12px;margin-left:8px;cursor:pointer;">Skip</button>
</div>
<button class="back" style="display:block;width:40%;height:48px;margin:16px auto 0;background:#f59e0b;border:0;border-radius:999px;font-weight:700;font-size:16px;" onclick="location.href='./home.html'">Back</button>
</div>
<script>
const DIRECT_LINK="https://omg10.com/4/11905870";
const ALL_VIDEOS=[
{src:"https://www.w3schools.com/html/mov_bbb.mp4",title:"Big Buck Bunny"},
{src:"yt:dQw4w9WgXcQ",title:"Funny Cats Compilation"},
{src:"https://test-videos.co.uk/vids/sintel/mp4/h264/720/Sintel_720_10s_1MB.mp4",title:"Motivation"},
{src:"yt:jNQXAC9IVRw",title:"Nature Relax - First Video"},
{src:"https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4",title:"Cats"},
{src:"yt:9bZkp7q19f0",title:"Top Music"},
{src:"https://test-videos.co.uk/vids/flower/mp4/h264/720/Flower_720_10s_1MB.mp4",title:"Flower"},
{src:"yt:kJQP7kiw5Fk",title:"Despacito"},
{src:"https://test-videos.co.uk/vids/tide/mp4/h264/720/Tide_720_10s_1MB.mp4",title:"Ocean"},
{src:"yt:OPf0YbXqDm0",title:"Uptown Funk"},
{src:"https://test-videos.co.uk/vids/sintel/mp4/h264/720/Sintel_720_10s_2MB.mp4",title:"Inspire"},
{src:"yt:RgKAFK5djSk",title:"See You Again"},
{src:"https://test-videos.co.uk/vids/jellyfish/mp4/h264/720/Jellyfish_720_10s_2MB.mp4",title:"Jellyfish"},
{src:"yt:09R8_2nJtjg",title:"Sugar"},
{src:"https://test-videos.co.uk/vids/eswb/mp4/h264/720/Elephants_Dream_720_10s_2MB.mp4",title:"Dream"},
{src:"yt:QcIy9NiNbmo",title:"Let Me Love You"},
{src:"https://test-videos.co.uk/vids/sunflower/mp4/h264/720/Sunflower_720_10s_1MB.mp4",title:"Sunflower"},
{src:"yt:hT_nvWreIhg",title:"Counting Stars"},
{src:"https://www.w3schools.com/html/mov_bbb.mp4",title:"Bunny Returns"},
{src:"https://www.w3schools.com/html/movie.mp4",title:"Bear"}
];
function getDayOfYear(){return Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/86400000);}
function getTodayPlaylist(){const off=getDayOfYear()%ALL_VIDEOS.length;let pl=[];for(let i=0;i<10;i++)pl.push(ALL_VIDEOS[(off+i)%ALL_VIDEOS.length]);return{playlist:pl,offset:off}}
function BLAST(){
  const c=document.getElementById('confetti');c.style.display='block';const ctx=c.getContext('2d');
  c.width=window.innerWidth;c.height=window.innerHeight;let pieces=[];const colors=['#fbbf24','#f59e0b','#22c55e','#ef4444','#3b82f6','#ec4899','#fff'];
  for(let i=0;i<150;i++){pieces.push({x:c.width/2,y:c.height/2.5,vx:(Math.random()-0.5)*24,vy:(Math.random()-0.5)*24-8,r:Math.random()*9+3,color:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*360,vr:(Math.random()-0.5)*30});}
  let frame=0;function anim(){ctx.clearRect(0,0,c.width,c.height);pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.35;p.rot+=p.vr;p.vx*=0.99;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;if(Math.random()>0.5)ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);else{ctx.beginPath();ctx.arc(0,0,p.r/2,0,Math.PI*2);ctx.fill();}ctx.restore();});frame++;if(frame<240)requestAnimationFrame(anim);else c.style.display='none';}anim();if(navigator.vibrate)navigator.vibrate([80,40,80,40,150]);
}
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
let bal=0,today=0,currentUser=null,timer=null,dailyData=null;
const ov=document.getElementById('ov'),vid=document.getElementById('v'),yt=document.getElementById('yt'),btn=document.getElementById('btn'),pbar=document.getElementById('pbar'),balEl=document.getElementById('bal'),todayEl=document.getElementById('today'),vtEl=document.getElementById('vt');

function openSupportAd(){
  const lastSupport = localStorage.getItem('support_day');
  const todayStr = new Date().toDateString();
  if(lastSupport === todayStr){
    document.getElementById('supportBox').style.display='none';
    return;
  }
  localStorage.setItem('support_day', todayStr);
  window.open(DIRECT_LINK,'_blank'); // USER CLICKED = SAFE FOR MONETAG
  document.getElementById('supportBox').style.display='none';
  bal+=2; balEl.textContent=bal+' pts';
  if(currentUser) db.collection('users').doc(currentUser.uid).set({balance:bal,points:bal},{merge:true});
}

function updateUI(){balEl.textContent=bal+' pts';todayEl.textContent=today+'/10';if(dailyData&&today<10){vtEl.textContent=`Next: ${dailyData.playlist[today].title}`;ov.innerHTML=`<div>${dailyData.playlist[today].title}</div><small style="opacity:.7;margin-top:6px">Tap Start</small>`;}}
auth.onAuthStateChanged(async(u)=>{if(!u){location.href='./index.html';return;}currentUser=u;dailyData=getTodayPlaylist();const s=await db.collection('users').doc(u.uid).get();if(s.exists){const d=s.data();bal=d.balance||d.points||0;today=d.todayCount||d.today||0;const last=d.lastWatchDate?d.lastWatchDate.toDate?d.lastWatchDate.toDate():new Date(d.lastWatchDate):null;if(last&&new Date().toDateString()!==last.toDateString())today=0;}updateUI();if(today>=10){ov.style.display='flex';ov.innerHTML='🎉 10/10 Done!<br>New order tomorrow';btn.disabled=true;btn.textContent='Limit Reached';}});
function doAd(){
  if(today>=10){ov.style.display='flex';ov.innerHTML='🎉 10/10 Done!<br>New order tomorrow';btn.disabled=true;btn.textContent='Limit Reached';BLAST();return;}
  btn.disabled=true;ov.style.display='flex';ov.innerHTML='Loading video...';vid.style.display='none';yt.style.display='none';pbar.style.width='0%';
  setTimeout(()=>{startVideo();},800);
}
function startVideo(){
  if(!dailyData)dailyData=getTodayPlaylist();const cur=dailyData.playlist[today];vtEl.textContent=`Playing: ${cur.title}`;ov.style.display='none';
  if(cur.src.startsWith('yt:')){yt.src=`https://www.youtube.com/embed/${cur.src.slice(3)}?autoplay=1&controls=1&rel=0`;yt.style.display='block';vid.style.display='none';}
  else{vid.src=cur.src;vid.load();vid.style.display='block';yt.style.display='none';yt.src='';vid.play().catch(()=>{});}
  const msgs=[`🔥 Enjoying ${cur.title}?`,`💰 Earning 5 pts...`,`👀 Keep watching!`,`⭐ Great video!`,`🎬 Best part coming`];
  let sec=0,mi=0;btn.textContent=msgs[0];btn.disabled=true;
  timer=setInterval(()=>{
    sec++;pbar.style.width=(sec/30*100)+'%';
    if(sec%5===0){mi=(mi+1)%msgs.length;btn.textContent=msgs[mi];}
    if(sec>=30){
      clearInterval(timer);vid.pause();
      btn.textContent='🎉 Claim 5 pts!';btn.disabled=false;btn.onclick=claim;
      ov.style.display='flex';ov.innerHTML=`✅ Done!<br>Tap to claim`;if(navigator.vibrate)navigator.vibrate(100);
    }
  },1000);
}
async function claim(){
  if(!currentUser)return;btn.disabled=true;btn.textContent='Saving...';bal+=5;today++;
  try{
    await db.collection('users').doc(currentUser.uid).set({balance:bal,points:bal,todayCount:today,today:today,lastWatchDate:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({action:'Watch & Earn',type:'watch',points:5,desc:dailyData.playlist[today-1].title,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
  }catch(e){}
  yt.src='';vid.style.display='none';yt.style.display='none';pbar.style.width='0%';btn.textContent='Start & Earn';btn.disabled=false;btn.onclick=doAd;updateUI();
  // Show support ONLY once per day and ONLY after claim
  const lastSupport = localStorage.getItem('support_day');
  if(lastSupport!== new Date().toDateString()){
    document.getElementById('supportBox').style.display='block';
  }
  if(today>=10){
    ov.style.display='flex';ov.innerHTML='🎉 10/10 Done!<br>💥 BLAST! New order tomorrow';btn.textContent='Limit Reached';btn.disabled=true;BLAST();
  }
}
btn.onclick=doAd;
</script>
</body>
</html>
