<script>
// Monetag - Managed, no double popup
function canShowV(){var l=localStorage.getItem('v_last');return !l||Date.now()-parseInt(l)>30*60*1000}
function canShowP(){var l=localStorage.getItem('p_last');return !l||Date.now()-parseInt(l)>60*60*1000}
function loadV(){if(!canShowV())return; if(document.querySelector('script[data-zone="12083688"]'))return; var s=document.createElement('script');s.dataset.zone='12083688';s.src='https://n6wxm.com/vignette.min.js';document.body.appendChild(s);localStorage.setItem('v_last',Date.now())}
function loadP(){if(!canShowP())return; if(document.querySelector('script[data-zone="12083693"]'))return; var s=document.createElement('script');s.dataset.zone='12083693';s.src='https://al5sm.com/tag.min.js';document.body.appendChild(s);localStorage.setItem('p_last',Date.now())}

// Videos + Firebase
const ALL_VIDEOS=[{src:"https://www.w3schools.com/html/mov_bbb.mp4",title:"Big Buck Bunny"},{src:"https://test-videos.co.uk/vids/sintel/mp4/h264/720/Sintel_720_10s_1MB.mp4",title:"Morning Motivation"},{src:"https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4",title:"Funny Bunny"},{src:"https://test-videos.co.uk/vids/flower/mp4/h264/720/Flower_720_10s_1MB.mp4",title:"Peaceful Flowers"},{src:"https://test-videos.co.uk/vids/tide/mp4/h264/720/Tide_720_10s_1MB.mp4",title:"Ocean Waves"},{src:"https://test-videos.co.uk/vids/sintel/mp4/h264/720/Sintel_720_10s_2MB.mp4",title:"Inspire"},{src:"https://test-videos.co.uk/vids/jellyfish/mp4/h264/720/Jellyfish_720_10s_2MB.mp4",title:"Deep Sea"},{src:"https://test-videos.co.uk/vids/eswb/mp4/h264/720/Elephants_Dream_720_10s_2MB.mp4",title:"Dream Big"},{src:"https://test-videos.co.uk/vids/sunflower/mp4/h264/720/Sunflower_720_10s_1MB.mp4",title:"Sunshine"},{src:"https://www.w3schools.com/html/movie.mp4",title:"Nature Bear"}];
function getDayOfYear(){return Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/86400000);}
function getTodayPlaylist(){const off=getDayOfYear()%ALL_VIDEOS.length;let pl=[];for(let i=0;i<10;i++)pl.push(ALL_VIDEOS[(off+i)%ALL_VIDEOS.length]);return{playlist:pl}}
function BLAST(){const c=document.getElementById('confetti');c.style.display='block';const ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let pieces=[];const colors=['#f59e0b','#22c55e','#ef4444','#fbbf24'];for(let i=0;i<120;i++)pieces.push({x:c.width/2,y:c.height/2.5,vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*20-6,r:Math.random()*8+3,color:colors[Math.floor(Math.random()*4)],rot:Math.random()*360,vr:(Math.random()-0.5)*20});let f=0;(function anim(){ctx.clearRect(0,0,c.width,c.height);pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);ctx.restore();});if(++f<200)requestAnimationFrame(anim);else c.style.display='none';})();}
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);firebase.appCheck().activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);
const auth=firebase.auth(),db=firebase.firestore();
let bal=0,today=0,currentUser=null,timer=null,dailyData=null;
const ov=document.getElementById('ov'),vid=document.getElementById('v'),yt=document.getElementById('yt'),btn=document.getElementById('btn'),pbar=document.getElementById('pbar'),balEl=document.getElementById('bal'),todayEl=document.getElementById('today'),vtEl=document.getElementById('vt');
function getCoins(d){return d.balance??d.coins??d.points??0;}
function updateUI(){const capped=Math.min(today,10);balEl.textContent=bal+' 🪙';todayEl.textContent=capped+'/10';if(dailyData&&capped<10)vtEl.textContent='Next: '+dailyData.playlist[capped].title;else if(capped>=10)vtEl.textContent='All done today!';}
auth.onAuthStateChanged(async(u)=>{if(!u){location.href='./index.html';return;}currentUser=u;dailyData=getTodayPlaylist();const ref=db.collection('users').doc(u.uid);const s=await ref.get();if(s.exists){const d=s.data();bal=getCoins(d);today=d.todayCount??d.today??0;const last=d.lastWatchDate?d.lastWatchDate.toDate?d.lastWatchDate.toDate():new Date(d.lastWatchDate):null;if(last&&last.toDateString()!==new Date().toDateString()){today=0;await ref.set({today:0,todayCount:0},{merge:true});}if(today>10){today=10;await ref.set({today:10,todayCount:10},{merge:true});}}updateUI();if(today>=10){ov.style.display='flex';ov.innerHTML='🎉 10/10 Done!<br>New tomorrow';btn.disabled=true;btn.textContent='Limit Reached';pbar.style.width='100%';}else{ov.style.display='flex';ov.innerHTML=`<div>${dailyData.playlist[today].title}</div><small>Tap Start - 1 Coin</small>`;}});
function doAd(){if(today>=10)return;loadV();btn.disabled=true;ov.style.display='flex';ov.innerHTML='Loading...';vid.style.display='none';yt.style.display='none';pbar.style.width='0%';setTimeout(()=>startVideo(),600);}
function startVideo(){const idx=Math.min(today,9);const cur=dailyData.playlist[idx];vtEl.textContent='Playing: '+cur.title;ov.style.display='none';vid.src=cur.src;vid.load();vid.style.display='block';vid.play().catch(()=>{});let sec=0;btn.textContent='⏳ Earning...';btn.disabled=true;timer=setInterval(()=>{sec++;pbar.style.width=(sec/15*100)+'%';if(sec>=15){clearInterval(timer);vid.pause();btn.textContent='🎉 Claim 1 🪙!';btn.disabled=false;btn.onclick=claim;ov.style.display='flex';ov.innerHTML='✅ Done! Tap to claim';}},1000);}
async function claim(){if(today>=10)return;loadP();btn.disabled=true;btn.textContent='Saving...';try{const ref=db.collection('users').doc(currentUser.uid);await ref.update({balance:firebase.firestore.FieldValue.increment(1),coins:firebase.firestore.FieldValue.increment(1),points:firebase.firestore.FieldValue.increment(1),todayCount:firebase.firestore.FieldValue.increment(1),today:firebase.firestore.FieldValue.increment(1),lastWatchDate:firebase.firestore.FieldValue.serverTimestamp()});await ref.collection('earnHistory').add({action:'Watch & Earn',points:1,coins:1,desc:dailyData.playlist[Math.min(today,9)].title,timestamp:firebase.firestore.FieldValue.serverTimestamp()});const doc=await ref.get();if(doc.exists){bal=getCoins(doc.data());today=doc.data().todayCount??0;if(today>10)today=10;}}catch(e){bal+=1;today+=1;}yt.src='';vid.style.display='none';pbar.style.width='0%';btn.textContent='Start & Earn 1 🪙';btn.disabled=false;btn.onclick=doAd;updateUI();if(today>=10){ov.style.display='flex';ov.innerHTML='🎉 10/10 Done!<br>New tomorrow';btn.textContent='Limit Reached';btn.disabled=true;BLAST();}else{ov.style.display='flex';ov.innerHTML=`<div>${dailyData.playlist[today].title}</div><small>Tap Start</small>`;}}
btn.onclick=doAd;
</script>
