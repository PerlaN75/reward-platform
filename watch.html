<!DOCTYPE html>
<html>
<head>
<title>Admin - Upload Videos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
<style>
body{background:#0e1a0e;color:#fff;font-family:Arial;padding:16px}
.card{max-width:500px;margin:0 auto;background:#1d331d;border:2px solid #fbbf24;border-radius:16px;padding:16px}
h2{color:#facc15;text-align:center;margin-bottom:12px}
input,button{width:100%;padding:12px;border-radius:10px;border:none;margin:8px 0;font-weight:700}
button{background:#fbbf24;cursor:pointer}
.log{background:#000;border-radius:10px;padding:10px;font-size:12px;max-height:400px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:12px}
.progress{height:8px;background:#2a4a2a;border-radius:4px;overflow:hidden;margin:4px 0}
.bar{height:100%;background:#fbbf24;width:0%}
</style>
</head>
<body>
<div class="card">
<h2>Upload 20 Videos to Firebase</h2>
<p style="font-size:13px;opacity:.8;text-align:center">Select all 20 videos from phone. Will upload one by one and give permanent links.</p>
<input type="file" id="files" multiple accept="video/mp4,video/*">
<button onclick="uploadAll()">Start Upload</button>
<div id="status"></div>
<div class="log" id="log">Waiting...</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d",storageBucket:"reward-platform-rw-2e13d.appspot.com"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), storage=firebase.storage();
auth.signInAnonymously().catch(()=>{});

let links=[];
async function uploadAll(){
  const input=document.getElementById('files');
  if(!input.files.length){alert('Select videos first');return;}
  const files=[...input.files];
  const logEl=document.getElementById('log'), statusEl=document.getElementById('status');
  logEl.textContent=''; links=[];
  for(let i=0;i<files.length;i++){
    const file=files[i];
    const safeName=file.name.replace(/[^a-z0-9.]/gi,'_');
    const path=`videos/video_${i+1}_${safeName}`;
    statusEl.innerHTML=`<p>Uploading ${i+1}/${files.length}: ${file.name}</p><div class="progress"><div class="bar" id="bar"></div></div>`;
    try{
      const ref=storage.ref(path);
      const task=ref.put(file);
      await new Promise((res,rej)=>{
        task.on('state_changed',snap=>{
          const pct=(snap.bytesTransferred/snap.totalBytes*100).toFixed(0);
          document.getElementById('bar').style.width=pct+'%';
        },rej,async()=>{
          const url=await task.snapshot.ref.getDownloadURL();
          links.push(`{src:"${url}",title:"Video ${i+1}"},`);
          logEl.textContent+=`✅ Video ${i+1} DONE\n${url}\n\n`;
          res();
        });
      });
    }catch(e){ logEl.textContent+=`❌ Failed ${file.name}: ${e.message}\n`; }
  }
  logEl.textContent+=`\n\n--- COPY THIS ARRAY FOR watch.html ---\nconst ALL_VIDEOS=[\n${links.join('\n')}\n];\n`;
  statusEl.innerHTML+=`<p style="color:#facc15">All done! Scroll down, copy the array.</p>`;
}
</script>
</body>
</html>
