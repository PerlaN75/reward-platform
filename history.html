<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>History - Reward Platform</title>


<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f4f7fb;

    color: #222;

}


/* =========================
   TOP NAVIGATION
========================= */

.top-nav {

    background: #182848;

    padding: 12px 10px;

    display: flex;

    align-items: center;

}


.back-button {

    border: none;

    border-radius: 10px;

    padding: 11px 16px;

    background:
        rgba(255,255,255,0.12);

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


.back-button:hover {

    background:
        rgba(255,255,255,0.22);

}


/* =========================
   HEADER
========================= */

header {

    background: #182848;

    color: white;

    text-align: center;

    padding: 28px 15px;

}


header h1 {

    margin: 0;

    background: linear-gradient(
        90deg,
        #ffb300,
        #ff4d8d,
        #8a2be2,
        #2196f3,
        #00c9a7,
        #ffb300
    );

    background-size: 300% 100%;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:
        headingSlide 8s linear infinite;

}


header p {

    margin: 8px 0 0;

}


@keyframes headingSlide {

    from {

        background-position: 0% 50%;

    }

    to {

        background-position: 300% 50%;

    }

}


/* =========================
   MAIN CONTAINER
========================= */

.container {

    max-width: 800px;

    margin: auto;

    padding: 20px 15px 35px;

}


/* =========================
   SUMMARY CARD
========================= */

.summary-card {

    background: white;

    border-radius: 15px;

    padding: 20px;

    margin: 15px 0;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

    text-align: center;

}


.summary-title {

    font-size: 17px;

    font-weight: bold;

    color: #666;

}


.summary-points {

    font-size: 38px;

    font-weight: bold;

    color: #182848;

    margin: 8px 0;

}


.summary-label {

    color: #777;

}


/* =========================
   HISTORY CARD
========================= */

.history-card {

    background: white;

    border-radius: 14px;

    margin: 15px 0;

    padding: 18px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

}


/* =========================
   HISTORY ITEM
========================= */

.history-item {

    display: flex;

    align-items: center;

    gap: 15px;

    padding: 16px 0;

    border-bottom:
        1px solid #eeeeee;

}


.history-item:last-child {

    border-bottom: none;

}


/* =========================
   ACTIVITY ICON
========================= */

.activity-icon {

    width: 48px;

    height: 48px;

    min-width: 48px;

    border-radius: 12px;

    background: #eef5ff;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 25px;

}


/* =========================
   ACTIVITY INFORMATION
========================= */

.activity-info {

    flex: 1;

    min-width: 0;

}


.activity-name {

    font-size: 16px;

    font-weight: bold;

    color: #182848;

}


.activity-date {

    margin-top: 5px;

    color: #777;

    font-size: 13px;

    line-height: 1.4;

}


/* =========================
   POINT CHANGE
========================= */

.points-change {

    font-size: 17px;

    font-weight: bold;

    white-space: nowrap;

}


.points-positive {

    color: #168a3a;

}


.points-negative {

    color: #c62828;

}


/* =========================
   EMPTY STATE
========================= */

.empty-state {

    background: white;

    border-radius: 14px;

    padding: 40px 20px;

    margin-top: 15px;

    text-align: center;

    color: #777;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

}


.empty-icon {

    font-size: 50px;

    margin-bottom: 10px;

}


.empty-state h2 {

    color: #182848;

}


/* =========================
   CLEAR HISTORY BUTTON
========================= */

.clear-area {

    text-align: center;

    margin-top: 25px;

}


.clear-button {

    border: none;

    border-radius: 10px;

    padding: 13px 22px;

    background: #c62828;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}


.clear-button:hover {

    background: #b71c1c;

}


/* =========================
   MESSAGE
========================= */

.message {

    text-align: center;

    font-weight: bold;

    margin-top: 12px;

    color: #168a3a;

    min-height: 20px;

}


/* =========================
   FOOTER
========================= */

footer {

    text-align: center;

    padding: 25px;

    color: #666;

    font-size: 14px;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .history-item {

        gap: 10px;

    }


    .activity-icon {

        width: 42px;

        height: 42px;

        min-width: 42px;

        font-size: 21px;

    }


    .activity-name {

        font-size: 15px;

    }


    .points-change {

        font-size: 15px;

    }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN PROTECTION
========================= -->

<script>

if (
    localStorage.getItem("loggedIn")
    !== "true"
) {

    window.location.href =
        "login.html";

}

</script>


<!-- =========================
     TOP NAVIGATION
========================= -->

<nav class="top-nav">

    <button
        type="button"
        class="back-button"
        onclick="goBackToMenu()">

        ← Back

    </button>

</nav>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>📜 History</h1>

    <p>
        View your points and platform activity.
    </p>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


    <!-- =========================
         CURRENT BALANCE
    ========================= -->

    <div class="summary-card">

        <div class="summary-title">

            💰 Current Balance

        </div>


        <div
            id="currentBalance"
            class="summary-points">

            0

        </div>


        <div class="summary-label">

            points available

        </div>

    </div>


    <!-- =========================
         HISTORY
    ========================= -->

    <div
        id="historyContainer"
        class="history-card">

    </div>


    <!-- =========================
         CLEAR HISTORY
    ========================= -->

    <div
        id="clearArea"
        class="clear-area"
        style="display:none;">

        <button
            type="button"
            class="clear-button"
            onclick="clearHistory()">

            🗑️ Clear History

        </button>


        <div
            id="message"
            class="message">
        </div>

    </div>


</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    Reward Platform — Prototype

</footer>


<script>

/* =====================================================
   GET CURRENT BALANCE
===================================================== */

function updateBalance() {

    const points =
        Number(
            localStorage.getItem(
                "rewardPoints"
            )
        ) || 0;


    document.getElementById(
        "currentBalance"
    ).textContent =
        points;

}


/* =====================================================
   GET HISTORY
===================================================== */

function getHistory() {

    let history = [];


    try {

        history =
            JSON.parse(
                localStorage.getItem(
                    "rewardHistory"
                )
            ) || [];

    }

    catch (error) {

        history = [];

    }


    return history;

}


/* =====================================================
   GET ACTIVITY ICON
===================================================== */

function getActivityIcon(
    activity
) {

    const name =
        String(
            activity
        ).toLowerCase();


    if (
        name.includes("watch")
    ) {

        return "📺";

    }


    if (
        name.includes("spin")
    ) {

        return "🎡";

    }


    if (
        name.includes("challenge")
    ) {

        return "🏆";

    }


    if (
        name.includes("quiz")
    ) {

        return "🧠";

    }


    if (
        name.includes("game")
    ) {

        return "🎮";

    }


    if (
        name.includes("check")
    ) {

        return "📅";

    }


    if (
        name.includes("reward")
    ) {

        return "🎁";

    }


    if (
        name.includes("buy")
    ) {

        return "💳";

    }


    if (
        name.includes("withdraw")
    ) {

        return "💸";

    }


    return "💰";

}


/* =====================================================
   GET ACTIVITY NAME
===================================================== */

function getActivityName(
    item
) {

    if (
        item.activity
    ) {

        return item.activity;

    }


    if (
        item.title
    ) {

        return item.title;

    }


    if (
        item.name
    ) {

        return item.name;

    }


    return "Points Activity";

}


/* =====================================================
   GET POINT VALUE
===================================================== */

function getPointValue(
    item
) {

    if (
        typeof item.points === "number"
    ) {

        return item.points;

    }


    if (
        typeof item.amount === "number"
    ) {

        return item.amount;

    }


    const value =
        Number(
            item.points
        );


    if (
        !Number.isNaN(value)
    ) {

        return value;

    }


    return 0;

}


/* =====================================================
   GET DATE
===================================================== */

function getActivityDate(
    item
) {

    return (
        item.date ||
        item.time ||
        item.timestamp ||
        "Date not available"
    );

}


/* =====================================================
   DISPLAY HISTORY
===================================================== */

function displayHistory() {

    const container =
        document.getElementById(
            "historyContainer"
        );


    const clearArea =
        document.getElementById(
            "clearArea"
        );


    const history =
        getHistory();


    container.innerHTML = "";


    /* =========================
       EMPTY HISTORY
    ========================= */

    if (
        history.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    📜
                </div>

                <h2>
                    No Activity Yet
                </h2>

                <p>
                    Your earning and points activity
                    will appear here.
                </p>

            </div>

        `;

        clearArea.style.display =
            "none";

        return;

    }


    clearArea.style.display =
        "block";


    /* =========================
       SHOW NEWEST FIRST
    ========================= */

    const orderedHistory =
        [...history].reverse();


    orderedHistory.forEach(
        function(item) {

            const points =
                getPointValue(
                    item
                );


            const activityName =
                getActivityName(
                    item
                );


            const activityDate =
                getActivityDate(
                    item
                );


            const icon =
                getActivityIcon(
                    activityName
                );


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "history-item";


            const pointClass =
                points >= 0
                    ? "points-positive"
                    : "points-negative";


            const pointText =
                points > 0
                    ? "+" + points
                    : points;


            row.innerHTML = `

                <div class="activity-icon">

                    ${icon}

                </div>


                <div class="activity-info">

                    <div class="activity-name">

                        ${activityName}

                    </div>


                    <div class="activity-date">

                        ${activityDate}

                    </div>

                </div>


                <div class="points-change ${pointClass}">

                    ${pointText}

                </div>

            `;


            container.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   CLEAR HISTORY
===================================================== */

function clearHistory() {

    const history =
        getHistory();


    if (
        history.length === 0
    ) {

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to clear your activity history?"
        );


    if (!confirmed) {

        return;

    }


    localStorage.removeItem(
        "rewardHistory"
    );


    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        "✅ History cleared successfully.";


    displayHistory();


    updateBalance();

}


/* =====================================================
   BACK TO MENU
===================================================== */

function goBackToMenu() {

    window.location.href =
        "menu.html";

}


/* =====================================================
   START PAGE
===================================================== */

updateBalance();

displayHistory();

</script>


</body>

</html>
