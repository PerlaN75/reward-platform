<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Balance - Reward Platform</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f4f7fb;

    color: #222;

}


/* =====================================================
   TOP NAVIGATION
===================================================== */

.top-nav {

    background: #182848;

    padding: 12px 10px;

    display: flex;

    align-items: center;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button {

    width: auto;

    margin: 0;

    padding: 11px 16px;

    background: rgba(255,255,255,0.12);

    color: white;

    border: none;

    border-radius: 10px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

.back-button:hover {

    background: rgba(255,255,255,0.22);

}


/* =====================================================
   HEADER
===================================================== */

header {

    background: #182848;

    color: white;

    padding: 25px 15px;

    text-align: center;

}

header h1 {

    margin: 0;

    animation: headingAnimation 3s infinite alternate;

}

header p {

    margin: 8px 0 0;

}


/* =====================================================
   HEADING ANIMATION
===================================================== */

@keyframes headingAnimation {

    0% {

        color: white;

    }

    100% {

        color: #00bfff;

    }

}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container {

    max-width: 700px;

    margin: auto;

    padding: 15px;

}


/* =====================================================
   CARDS
===================================================== */

.card {

    background: white;

    border-radius: 14px;

    padding: 20px;

    margin: 15px 0;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);

}

.card h2 {

    margin-top: 0;

    animation: cardHeadingAnimation 3s infinite alternate;

}

@keyframes cardHeadingAnimation {

    0% {

        color: #182848;

    }

    100% {

        color: #00bfff;

    }

}


/* =====================================================
   MAIN BALANCE
===================================================== */

.balance-card {

    text-align: center;

}

.balance-number {

    font-size: 48px;

    font-weight: bold;

    margin: 15px 0;

    color: #182848;

}

.balance-label {

    color: #666;

    font-size: 16px;

}


/* =====================================================
   SUMMARY
===================================================== */

.summary {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

}

.summary-box {

    background: #f4f7fb;

    border-radius: 12px;

    padding: 18px;

    text-align: center;

}

.summary-box h3 {

    margin: 0;

    font-size: 15px;

    color: #555;

}

.summary-number {

    font-size: 28px;

    font-weight: bold;

    margin-top: 8px;

    color: #182848;

}


/* =====================================================
   HISTORY
===================================================== */

.history-item {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    padding: 14px 0;

    border-bottom:
        1px solid #e5e5e5;

}

.history-item:last-child {

    border-bottom: none;

}

.history-activity {

    font-weight: bold;

}

.history-date {

    font-size: 12px;

    color: #777;

    margin-top: 4px;

}

.history-points {

    font-weight: bold;

    white-space: nowrap;

}


/* =====================================================
   POSITIVE POINTS
===================================================== */

.positive {

    color: #168a45;

}


/* =====================================================
   EMPTY HISTORY
===================================================== */

.empty-history {

    text-align: center;

    color: #777;

    padding: 20px 0;

}


/* =====================================================
   BUTTONS
===================================================== */

button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #182848;

    color: white;

    font-size: 16px;

    cursor: pointer;

    margin-top: 10px;

}

button:hover {

    opacity: 0.9;

}


/* =====================================================
   FOOTER
===================================================== */

footer {

    text-align: center;

    padding: 25px;

    color: #666;

    font-size: 14px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    .summary {

        grid-template-columns: 1fr;

    }

    .balance-number {

        font-size: 42px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN PROTECTION
===================================================== -->

<script>

if (
    localStorage.getItem("loggedIn")
    !== "true"
) {

    window.location.href = "login.html";

}

</script>


<!-- =====================================================
     TOP NAVIGATION
===================================================== -->

<nav class="top-nav">

    <button
        class="back-button"
        onclick="goBack()">

        ← Back

    </button>

</nav>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <h1>💰 My Balance</h1>

    <p>
        View your points balance and activity history.
    </p>

</header>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<div class="container">


    <!-- =================================================
         CURRENT BALANCE
    ================================================== -->

    <div class="card balance-card">

        <h2>💰 Current Balance</h2>

        <div
            class="balance-number"
            id="balance">

            0

        </div>

        <div class="balance-label">

            Points Available

        </div>

    </div>


    <!-- =================================================
         SUMMARY
    ================================================== -->

    <div class="card">

        <h2>📊 Points Summary</h2>

        <div class="summary">


            <div class="summary-box">

                <h3>Total Earned</h3>

                <div
                    class="summary-number"
                    id="totalEarned">

                    0

                </div>

            </div>


            <div class="summary-box">

                <h3>Total Activities</h3>

                <div
                    class="summary-number"
                    id="totalActivities">

                    0

                </div>

            </div>


        </div>

    </div>


    <!-- =================================================
         ACTIVITY HISTORY
    ================================================== -->

    <div class="card">

        <h2>📜 Activity History</h2>

        <div id="history">

        </div>

    </div>


</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    Reward Platform — Prototype

</footer>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   GET CURRENT BALANCE
===================================================== */

function getBalance() {

    return Number(
        localStorage.getItem(
            "rewardPoints"
        )
    ) || 0;

}


/* =====================================================
   GET HISTORY
===================================================== */

function getHistory() {

    try {

        const storedHistory =
            JSON.parse(
                localStorage.getItem(
                    "rewardHistory"
                )
            );

        if (
            Array.isArray(storedHistory)
        ) {

            return storedHistory;

        }

        return [];

    }

    catch (error) {

        return [];

    }

}


/* =====================================================
   DISPLAY BALANCE
===================================================== */

function displayBalance() {

    const balance =
        getBalance();

    document.getElementById(
        "balance"
    ).textContent =
        balance;

}


/* =====================================================
   DISPLAY SUMMARY
===================================================== */

function displaySummary() {

    const history =
        getHistory();


    let totalEarned = 0;


    history.forEach(
        function(item) {

            const amount =
                Number(item.points) || 0;


            if (amount > 0) {

                totalEarned += amount;

            }

        }
    );


    document.getElementById(
        "totalEarned"
    ).textContent =
        totalEarned;


    document.getElementById(
        "totalActivities"
    ).textContent =
        history.length;

}


/* =====================================================
   DISPLAY HISTORY
===================================================== */

function displayHistory() {

    const history =
        getHistory();


    const historyContainer =
        document.getElementById(
            "history"
        );


    historyContainer.innerHTML = "";


    if (
        history.length === 0
    ) {

        historyContainer.innerHTML =

            '<div class="empty-history">' +

            'No activities yet.' +

            '</div>';

        return;

    }


    /* Show newest activity first */

    const reversedHistory =
        [...history].reverse();


    reversedHistory.forEach(
        function(item) {


            const activity =
                item.activity ||
                "Activity";


            const points =
                Number(item.points) || 0;


            const date =
                item.date ||
                "";


            const itemElement =
                document.createElement(
                    "div"
                );


            itemElement.className =
                "history-item";


            const leftSide =
                document.createElement(
                    "div"
                );


            leftSide.innerHTML =

                '<div class="history-activity">' +

                activity +

                '</div>' +

                '<div class="history-date">' +

                date +

                '</div>';


            const rightSide =
                document.createElement(
                    "div"
                );


            rightSide.className =
                "history-points positive";


            rightSide.textContent =
                "+" + points;


            itemElement.appendChild(
                leftSide
            );


            itemElement.appendChild(
                rightSide
            );


            historyContainer.appendChild(
                itemElement
            );

        }
    );

}


/* =====================================================
   BACK BUTTON
===================================================== */

function goBack() {

    window.history.back();

}


/* =====================================================
   INITIAL LOAD
===================================================== */

displayBalance();

displaySummary();

displayHistory();


</script>


</body>

</html>
