<!DOCTYPE html>
<html>
<head>
<title>Support - Rewards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f8fafc;min-height:100vh;color:#111827;padding-bottom:90px}
.container{max-width:500px;margin:0 auto;padding:14px}
.card{background:#ffffff;border:2px solid #f1f5f9;border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,0.06);margin-bottom:14px;position:relative}
.card-title{font-size:19px;font-weight:900;color:#111827;margin-bottom:6px}
.card-sub{font-size:12px;color:#9ca3af;margin-bottom:14px;line-height:1.4}
.input{width:100%;background:#f9fafb;border:2px solid #e5e7eb;border-radius:12px;padding:13px 14px;font-size:14px;color:#111827;margin-bottom:12px;outline:none;transition:0.2s}
.input:focus{border-color:#fbbf24;background:#ffffff}
.textarea{width:100%;background:#f9fafb;border:2px solid #e5e7eb;border-radius:12px;padding:13px 14px;font-size:14px;color:#111827;min-height:110px;resize:vertical;outline:none;transition:0.2s}
.textarea:focus{border-color:#fbbf24;background:#ffffff}
.btn-send{width:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:none;border-radius:12px;padding:14px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #d97706;margin-top:12px;transition:0.1s}
.btn-send:active{transform:translateY(3px);box-shadow:0 1px 0 #d97706}
/* X BUTTON TOP RIGHT LIKE PROFILE */
.close-x{position:absolute;top:14px;right:14px;width:34px;height:34px;background:#f3f4f6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#111827;cursor:pointer;text-decoration:none;border:2px solid #e5e7eb;z-index:10}
.close-x:active{transform:scale(0.92);background:#e5e7eb}
.ticket-item{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:8px}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900}
.badge-pending{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.badge-replied{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
</style>
</head>
<body>

<div class="container">

<!-- CARD 1 - CONTACT SUPPORT WITH X -->
<div class="card">
  <a href="more.html" class="close-x">×</a>
  <div class="card-title">Contact Support</div>
  <div class="card-sub">No email needed - message goes directly to admin</div>
  
  <input id="nameInput" class="input" type="text" placeholder="Your name" readonly>
  <input id="emailInput" class="input" type="text" placeholder="Your email" readonly>
  <textarea id="issueInput" class="textarea" placeholder="Describe your issue..."></textarea>
  
  <button class="btn-send" onclick="sendTicket()">Send Message</button>
  <div id="sendStatus" style="text-align:center;font-size:12px;margin-top:10px;color:#6b7280"></div>
</div>

<!-- CARD 2 - TICKETS & REPLIES -->
<div class="card">
  <div class="card-title">Your Tickets & Replies</div>
  <div id="ticketsList" style="margin-top:12px">
    <p style="color:#9ca3af;font-size:13px;text-align:center;padding:20px 0">Loading tickets...</p>
  </div>
</div>

</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();

let cachedUser=null;

// INSTANT FROM CACHE LIKE MORE.HTML
(function(){
  try{
    var c=JSON.parse(localStorage.getItem('userData')||'{}');
    if(c.username) document.getElementById('nameInput').value=c.username;
    if(c.email) document.getElementById('emailInput').value=c.email;
  }catch(e){}
})();

auth.onAuthStateChanged(u=>{
  if(!u){ location.href='./index.html'; return; }
  cachedUser=u;
  db.collection('users').doc(u.uid).onSnapshot(snap=>{
    if(snap.exists){
      var d=snap.data();
      localStorage.setItem('userData', JSON.stringify({...d, uid:u.uid}));
      document.getElementById('nameInput').value=d.username||'';
      document.getElementById('emailInput').value=d.email||u.email||'';
    }
  });
  loadTickets();
});

async function sendTicket(){
  var issue=document.getElementById('issueInput').value.trim();
  if(!issue){ document.getElementById('sendStatus').innerText='Please describe your issue'; return; }
  if(issue.length<10){ document.getElementById('sendStatus').innerText='Message too short (min 10 chars)'; return; }
  document.getElementById('sendStatus').innerText='Sending...';
  try{
    var user=auth.currentUser||cachedUser;
    var userData=JSON.parse(localStorage.getItem('userData')||'{}');
    await db.collection('supportTickets').add({
      uid:user.uid,
      username:userData.username||document.getElementById('nameInput').value||'User',
      email:userData.email||document.getElementById('emailInput').value||user.email||'',
      message:issue,
      status:'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      adminReply:''
    });
    document.getElementById('issueInput').value='';
    document.getElementById('sendStatus').style.color='#16a34a';
    document.getElementById('sendStatus').innerText='✓ Sent! Admin will reply soon.';
    setTimeout(()=>{ document.getElementById('sendStatus').innerText=''; document.getElementById('sendStatus').style.color='#6b7280'; },3000);
    loadTickets();
  }catch(e){
    document.getElementById('sendStatus').style.color='#ef4444';
    document.getElementById('sendStatus').innerText='Error: '+e.message;
  }
}

function loadTickets(){
  var user=auth.currentUser||cachedUser; if(!user) return;
  var list=document.getElementById('ticketsList');
  db.collection('supportTickets').where('uid','==',user.uid).orderBy('createdAt','desc').limit(20).onSnapshot(snap=>{
    if(snap.empty){
      list.innerHTML='<p style="color:#9ca3af;font-size:13px;text-align:center;padding:15px">No tickets yet<br><span style="font-size:11px">Your messages will appear here with admin replies</span></p>';
      return;
    }
    var html='';
    snap.forEach(doc=>{
      var d=doc.data();
      var date=d.createdAt?.toDate?d.createdAt.toDate().toLocaleDateString():'Just now';
      var status=d.status||'pending';
      var badgeClass=status==='replied'?'badge-replied':'badge-pending';
      html+=`<div class="ticket-item">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span class="badge ${badgeClass}">${status.toUpperCase()}</span>
          <span style="font-size:11px;color:#9ca3af">${date}</span>
        </div>
        <div style="font-size:13px;color:#111827;font-weight:700;margin-bottom:4px">You: ${d.message||''}</div>
        ${d.adminReply?`<div style="background:#ffffff;border:1.5px solid #bbf7d0;border-radius:10px;padding:10px;margin-top:8px"><div style="font-size:11px;color:#16a34a;font-weight:900">Admin Reply:</div><div style="font-size:13px;color:#065f46;margin-top:3px">${d.adminReply}</div></div>`:'<div style="font-size:11px;color:#9ca3af;margin-top:6px">⏳ Waiting for admin reply...</div>'}
      </div>`;
    });
    list.innerHTML=html;
  }, err=>{
    list.innerHTML=`<p style="color:#ef4444;font-size:12px">Error: ${err.message}</p><p style="font-size:12px;margin-top:8px;color:#6b7280">👉 Go to Firebase Console → Firestore → Rules → Publish the rules I gave you (with supportTickets section). Then refresh.</p>`;
  });
}
</script>
</body>
</html>
