<!DOCTYPE html>
<html>
<head>
<title>Help - Rewards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f3ff;min-height:100vh;color:#111827}
.top-bar{background:#fff;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;border-bottom:2px solid #f1f5f9}
.top-pill{font-weight:900;font-size:14px;color:#4c1d95;background:linear-gradient(180deg,#eff6ff,#dbeafe);border:2px solid #bfdbfe;border-radius:999px;padding:7px 18px}
.close-profile{width:34px;height:34px;background:#f3f4f6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#111827;text-decoration:none;border:2px solid #e5e7eb}
.container{max-width:500px;margin:0 auto;padding:16px 14px 90px}
.card{background:#fff;border:2px solid #ede9fe;border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,0.06);margin-bottom:14px}
.faq-item{border:2px solid #f1f5f9;border-radius:12px;margin-bottom:8px;overflow:hidden}
.faq-q{padding:12px 14px;font-weight:900;font-size:13px;display:flex;justify-content:space-between;cursor:pointer;background:#f9fafb}
.faq-a{display:none;padding:12px 14px;font-size:12px;line-height:1.5;color:#4b5563;background:#fff}
.faq-item.open .faq-a{display:block}
.input{width:100%;background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:13px 14px;font-size:14px;margin-bottom:12px;outline:none}
.area{width:100%;background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:13px 14px;font-size:14px;min-height:100px;outline:none;resize:vertical}
.btn{width:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:none;border-radius:13px;padding:14px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #d97706}
.offer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.offer-btn{background:linear-gradient(180deg,#eff6ff,#dbeafe);border:2px solid #bfdbfe;border-radius:12px;padding:12px;text-align:center;font-weight:900;font-size:12px;cursor:pointer}
#adGate{position:fixed;inset:0;background:rgba(17,12,34,0.65);backdrop-filter:blur(8px);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
.gate-box{background:#fff;border:2px solid #fbbf24;border-radius:24px;padding:22px 20px;text-align:center;max-width:360px;width:100%}
.gate-btn{width:100%;height:50px;border-radius:14px;border:2px solid #ede9fe;font-weight:900;font-size:14px;cursor:pointer}
.gate-btn.watch{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000}
.gate-btn.continue{background:linear-gradient(180deg,#dcfce7,#22c55e);color:#fff;border-color:#16a34a;display:none;margin-top:10px}
</style>
</head>
<body>
<div class="top-bar"><div class="top-pill">💬 Help / Support</div><a href="more.html" class="close-profile">×</a></div>
<div class="container">
<div class="card">
<div style="font-weight:900;font-size:16px;color:#4c1d95;margin-bottom:10px">❓ Quick Answers (Tap to unlock)</div>
<div id="faqList"></div>
</div>
<div class="card" style="background:linear-gradient(180deg,#fffbeb,#fef3c7);border-color:#fbbf24">
<div style="font-weight:900;font-size:14px;color:#92400e">🚀 Need Coins Faster?</div>
<div class="offer-grid">
<div class="offer-btn" onclick="location.href='./offers.html'">💎 High Pay Offers</div>
<div class="offer-btn" onclick="location.href='./referrals.html'">🤝 Refer & Earn 10%</div>
<div class="offer-btn" onclick="location.href='./bonus.html'">🎁 Hourly Bonus</div>
<div class="offer-btn" onclick="location.href='./survey.html'">📋 Paid Surveys</div>
</div>
</div>
<div class="card">
<div style="font-weight:900;font-size:15px;margin-bottom:12px">📩 Contact Support (Free)</div>
<input id="nameInput" class="input" placeholder="Your name" readonly>
<input id="emailInput" class="input" placeholder="Your email" readonly>
<textarea id="issueInput" class="area" placeholder="Describe your issue... min 10 chars"></textarea>
<button class="btn" id="sendBtn" onclick="doSendTicket()">Send Message</button>
<div id="status" style="text-align:center;font-size:13px;margin-top:12px;color:#6b7280;font-weight:700"></div>
</div>
<div class="card"><div style="font-weight:900;font-size:15px">Your Tickets & Replies</div><div id="ticketsList" style="margin-top:10px"><p style="color:#9ca3af;text-align:center;padding:20px 0">Loading...</p></div></div>
</div>
<div id="adGate"><div class="gate-box"><div style="font-size:32px">🎁</div><div style="font-weight:900;font-size:18px;color:#4c1d95;margin:6px 0">Unlock Answer</div><div style="font-size:12px;color:#6b7280;font-weight:600;margin-bottom:12px">Watch ad 10s to view</div><button id="watchAdBtn" class="gate-btn watch">▶️ Watch Ad (10s)</button><div id="gateTimer" style="font-weight:900;margin-top:10px;color:#92400e"></div><button id="continueBtn" class="gate-btn continue">✅ View Answer</button></div></div>
<script>
const FAQS=[
{q:"💰 How to withdraw?",a:"Go to Wallet > Withdraw. Minimum 5000 coins = $2.5. USDT BEP20, 24-48h. Complete Watch, Quiz, Articles daily."},
{q:"🪙 Coins not added?",a:"Watch full 35s without skipping. Wait for +1 circle, then watch 10s ad and claim. Clear cache if needed."},
{q:"📺 Video not playing?",a:"Videos are 30-50MB. Use WiFi/4G. Click Next Video. We have 32 videos."},
{q:"❓ Quiz locked?",a:"Finish Watch first. Chain: Watch -> Quiz -> Articles. 30 min window each."},
{q:"🎁 Bonus?",a:"Watch 10 videos = +5 bonus. Claim same day. Resets midnight."},
{q:"🤝 Referral?",a:"Friend must sign up with your link + complete 1 Watch. You get 10% lifetime."},
{q:"⏳ Pending withdraw?",a:"Manual review 12h. If 48h+, send ticket with wallet address."},
{q:"📧 Contact?",a:"Use form below. Reply within 24h. One ticket per issue."}
];
let vignetteLoaded=false;
function loadCleanVignette(){if(vignetteLoaded) return; vignetteLoaded=true; const old=document.querySelector('script[src*="vignette.min.js"]'); if(old) old.remove(); (function(s){s.dataset.zone='12270633',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script'))); setTimeout(()=>{vignetteLoaded=false;},60000);}
let pendingFaqIdx=null;
const faqList=document.getElementById('faqList');
FAQS.forEach((f,i)=>{
const div=document.createElement('div'); div.className='faq-item'; div.innerHTML=`<div class="faq-q"><span>${f.q}</span><span>🔒</span></div><div class="faq-a">${f.a}</div>`;
div.querySelector('.faq-q').onclick=()=>{
 if(div.classList.contains('open')){div.classList.remove('open'); return;}
 pendingFaqIdx=i; document.getElementById('adGate').style.display='flex'; document.getElementById('watchAdBtn').style.display='block'; document.getElementById('continueBtn').style.display='none'; document.getElementById('watchAdBtn').disabled=false; document.getElementById('gateTimer').innerText=''; document.getElementById('watchAdBtn').innerText='▶️ Watch Ad (10s)';
};
faqList.appendChild(div);
});
document.getElementById('watchAdBtn').onclick=function(){this.innerText='⏳ Please wait...';this.disabled=true; let sec=10; const timerEl=document.getElementById('gateTimer'); timerEl.innerText='⏳ Wait '+sec+'s...'; const interval=setInterval(()=>{sec--; if(sec>0){timerEl.innerText='⏳ Wait '+sec+'s...';} else{clearInterval(interval); document.getElementById('watchAdBtn').style.display='none'; timerEl.innerText='✅ Unlocked!'; document.getElementById('continueBtn').style.display='block';}},1000);};
document.getElementById('continueBtn').onclick=function(){document.getElementById('adGate').style.display='none'; loadCleanVignette(); const items=document.querySelectorAll('.faq-item'); items.forEach(it=>it.classList.remove('open')); items[pendingFaqIdx].classList.add('open'); items[pendingFaqIdx].querySelector('.faq-q span:last-child').innerText='✅';};
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore(); let cachedUser=null;
(function(){try{var c=JSON.parse(localStorage.getItem('userData')||'{}'); if(c.username) document.getElementById('nameInput').value=c.username; if(c.email) document.getElementById('emailInput').value=c.email;}catch(e){}})();
auth.onAuthStateChanged(u=>{ if(!u){location.href='./index.html';return;} cachedUser=u; db.collection('users').doc(u.uid).get().then(s=>{ if(s.exists){ var d=s.data(); localStorage.setItem('userData', JSON.stringify({...d,uid:u.uid})); document.getElementById('nameInput').value=d.username||''; document.getElementById('emailInput').value=d.email||u.email||''; }}); loadTickets(); });
async function doSendTicket(){ var issue=document.getElementById('issueInput').value.trim(); var el=document.getElementById('status'); if(!issue||issue.length<10){ el.style.color='#ef4444'; el.innerText='Min 10 characters'; return;} el.style.color='#6b7280'; el.innerText='Sending...'; try{ var user=auth.currentUser||cachedUser; if(!user) throw new Error('Not logged in'); var ud=JSON.parse(localStorage.getItem('userData')||'{}'); var ticketData={uid:user.uid,userId:user.uid,username:ud.username||document.getElementById('nameInput').value,email:ud.email||document.getElementById('emailInput').value||user.email,message:issue,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp(),adminReply:'',reply:''}; await db.collection('users').doc(user.uid).collection('supportTickets').add(ticketData); try{ await db.collection('supportTickets').add(ticketData); }catch(e){} document.getElementById('issueInput').value=''; el.style.color='#16a34a'; el.innerText='✓ Sent! Admin will reply within 24h.'; setTimeout(()=>{el.innerText=''},3000);}catch(e){ el.style.color='#ef4444'; el.innerText='Error: '+e.message;} }
function loadTickets(){ var user=auth.currentUser||cachedUser; if(!user) return; var list=document.getElementById('ticketsList'); db.collection('users').doc(user.uid).collection('supportTickets').orderBy('createdAt','desc').limit(20).onSnapshot(snap=>{ if(snap.empty){ list.innerHTML='<div style="text-align:center;padding:20px"><div style="font-size:28px">📭</div><p style="color:#9ca3af;font-size:13px;margin-top:6px">No tickets yet</p></div>'; return;} var h=''; snap.forEach(doc=>{ var v=doc.data(); var date=v.createdAt?.toDate?v.createdAt.toDate().toLocaleDateString():'Now'; var replyText = v.adminReply || v.reply || ''; var hasReply = !!replyText; var badge = hasReply ? `<span style="background:#dcfce7;border:2px solid #bbf7d0;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900;color:#166534">REPLIED</span>` : `<span style="background:#fffbeb;border:2px solid #fde68a;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900;color:#92400e">PENDING</span>`; h+=`<div style="background:${hasReply?'#f0fdf4':'#f9fafb'};border:2px solid ${hasReply?'#bbf7d0':'#f1f5f9'};border-radius:14px;padding:12px;margin-bottom:10px"><div style="display:flex;justify-content:space-between">${badge}<span style="font-size:11px;color:#9ca3af">${date}</span></div><div style="font-weight:700;margin-top:6px;font-size:13px;line-height:1.4">${v.message}</div>${hasReply?`<div style="background:#ffffff;border:2px solid #bbf7d0;border-radius:10px;padding:8px;margin-top:8px"><b style="color:#16a34a;font-size:11px">Admin Reply:</b><div style="font-size:13px;color:#065f46;margin-top:2px">${replyText}</div></div>`:'<div style="font-size:11px;color:#9ca3af;margin-top:6px">⏳ Waiting for admin reply...</div>'}</div>`; }); list.innerHTML=h; }, err=>{ list.innerHTML=`<p style="color:#991b1b;font-weight:700;font-size:12px">Error: ${err.message}</p>`; }); }
</script>
</body>
</html>
