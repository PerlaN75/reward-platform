<!DOCTYPE html>
<html>
<head>
<title>Help - Rewards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f3ff;min-height:100vh;color:#111827}
.top-bar{background:#fff;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;border-bottom:2px solid #f1f5f9}
.top-pill{font-weight:900;font-size:14px;color:#4c1d95;background:linear-gradient(180deg,#eff6ff,#dbeafe);border:2px solid #bfdbfe;border-radius:999px;padding:7px 18px}
.close-profile{width:34px;height:34px;background:#f3f4f6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#111827;text-decoration:none;border:2px solid #e5e7eb}
.container{max-width:500px;margin:0 auto;padding:16px 14px 90px}
.card{background:#fff;border:2px solid #ede9fe;border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,0.06);margin-bottom:14px}
.faq-item{border:2px solid #f1f5f9;border-radius:12px;margin-bottom:8px;overflow:hidden}
.faq-item.open{border-color:#bbf7d0;background:#f0fdf4}
.faq-q{padding:13px 14px;font-weight:900;font-size:13px;cursor:pointer;background:#f9fafb}
.faq-item.open .faq-q{background:#f0fdf4}
.faq-a{display:none;padding:12px 14px;font-size:12px;line-height:1.6;color:#374151;background:#fff}
.faq-item.open .faq-a{display:block}
.input{width:100%;background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:13px 14px;font-size:14px;margin-bottom:12px;outline:none}
.area{width:100%;background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:13px 14px;font-size:14px;min-height:100px;outline:none;resize:vertical}
.btn{width:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;border:none;border-radius:13px;padding:14px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #d97706}
.offer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.offer-btn{background:linear-gradient(180deg,#eff6ff,#dbeafe);border:2px solid #bfdbfe;border-radius:12px;padding:12px;text-align:center;font-weight:900;font-size:12px;cursor:pointer}
.wrapper{text-align:center;padding:0 14px 22px}
.back-link{display:inline-block;text-align:center;background:#fff;color:#111827 !important;text-decoration:none;font-size:13px;font-weight:700;border:1.5px solid #e5e7eb;border-radius:20px;padding:10px 20px;box-shadow:0 2px 0 #e5e7eb}
.back-link:active{transform:scale(0.98)}
#adGate{position:fixed;inset:0;background:rgba(17,12,34,0.6);backdrop-filter:blur(8px);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
.gate-box{background:#fff;border:2px solid #fde68a;border-radius:26px;padding:26px 22px 22px;text-align:center;max-width:340px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
.gate-icon{font-size:36px}
.gate-title{font-weight:900;font-size:20px;color:#4c1d95;margin:6px 0 2px}
.gate-sub{font-size:12px;color:#6b7280;font-weight:700;margin-bottom:14px}
.gate-wait-text{font-weight:900;font-size:18px;color:#92400e;background:linear-gradient(90deg,#78350f,#92400e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:4px;letter-spacing:0.2px}
</style>
</head>
<body>
<div class="top-bar"><div class="top-pill">💬 Help / Support</div><a href="home.html" class="close-profile">×</a></div>
<div class="container">
<div class="card"><div style="font-weight:900;font-size:16px;color:#4c1d95;margin-bottom:10px">❓ Quick Answers</div><div id="faqList"></div></div>
<div class="card" style="background:linear-gradient(180deg,#fffbeb,#fef3c7);border-color:#fbbf24"><div style="font-weight:900;font-size:14px;color:#92400e">🚀 Need Coins Faster?</div><div class="offer-grid"><div class="offer-btn" onclick="location.href='./offers.html'">💎 High Pay Offers</div><div class="offer-btn" onclick="location.href='./referrals.html'">🤝 Refer & Earn 10%</div><div class="offer-btn" onclick="location.href='./bonus.html'">🎁 Hourly Bonus</div><div class="offer-btn" onclick="location.href='./survey.html'">📋 Paid Surveys</div></div></div>
<div class="card"><div style="font-weight:900;font-size:15px;margin-bottom:12px">📩 Contact Support (Free)</div><input id="nameInput" class="input" placeholder="Your name" readonly><input id="emailInput" class="input" placeholder="Your email" readonly><textarea id="issueInput" class="area" placeholder="Describe your issue... min 10 chars"></textarea><button class="btn" onclick="doSendTicket()">Send Message</button><div id="status" style="text-align:center;font-size:13px;margin-top:12px;color:#6b7280;font-weight:700"></div></div>
<div class="card"><div style="font-weight:900;font-size:15px">Your Tickets & Replies</div><div id="ticketsList" style="margin-top:10px"><p style="color:#9ca3af;text-align:center;padding:20px 0">Loading...</p></div></div>
</div>
<div class="wrapper"><a href="home.html" class="back-link">Back to Home</a></div>
<div id="adGate"><div class="gate-box"><div class="gate-icon">🎁</div><div class="gate-title">Unlock Answer</div><div class="gate-sub">Please wait to view</div><div id="waitText" class="gate-wait-text">Wait for... 10s</div></div></div>
<script>
const FAQS=[
{q:"💰 How to withdraw?",a:"Go to Wallet > Withdraw. Minimum is <b>3000 coins = $1.5</b>. Payout in USDT (BEP20) within 24-48h. Complete Watch, Quiz, Articles daily."},
{q:"🪙 Coins not added?",a:"Watch full 35s without skipping. Wait for +1 circle, then watch 10s ad and claim. Clear cache if needed."},
{q:"📺 Video not playing?",a:"Videos are 30-50MB. Use WiFi or 4G. Click Next Video. 32 videos available."},
{q:"❓ Quiz locked?",a:"Finish Watch first. Chain: Watch -> Quiz -> Articles. 30 min window each."},
{q:"🎁 Bonus?",a:"Watch 10 videos = +5 bonus. Claim same day. Resets midnight."},
{q:"🤝 Referral?",a:"Friend must sign up with your link + complete 1 Watch. You get 10% lifetime."},
{q:"⏳ Pending withdraw?",a:"Manual review within 12h. If 48h+, send ticket with wallet address."},
{q:"📧 Contact?",a:"Use form below. Reply within 24h. One ticket per issue."}
];
let vignetteLoaded=false;
function loadCleanVignette(){if(vignetteLoaded) return; vignetteLoaded=true; const old=document.querySelector('script[src*="vignette.min.js"]'); if(old) old.remove(); (function(s){s.dataset.zone='12270633',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script'))); setTimeout(()=>{vignetteLoaded=false;},60000);}
function getOpened(){try{return JSON.parse(localStorage.getItem('faq_opened_v2')||'{}')}catch(e){return {}}}
function saveOpened(o){localStorage.setItem('faq_opened_v2',JSON.stringify(o))}
let pendingIdx=null, timerInterval=null;
const faqList=document.getElementById('faqList');
FAQS.forEach((f,i)=>{
  const div=document.createElement('div'); div.className='faq-item'; div.id='faq-'+i;
  div.innerHTML=`<div class="faq-q">${f.q}</div><div class="faq-a">${f.a}</div>`;
  div.querySelector('.faq-q').onclick=()=>{
    const opened=getOpened(); const now=Date.now(); const last=opened[i]||0; const threeMin=3*60*1000;
    if(div.classList.contains('open')){div.classList.remove('open'); return;}
    if(last && (now-last)<threeMin){
      document.querySelectorAll('.faq-item').forEach(el=>el.classList.remove('open'));
      div.classList.add('open');
      return;
    }
    pendingIdx=i;
    document.getElementById('adGate').style.display='flex';
    startWait();
  };
  faqList.appendChild(div);
});
function startWait(){
  let sec=10;
  const waitText=document.getElementById('waitText');
  waitText.innerText=`Wait for... ${sec}s`;
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    sec--;
    if(sec>0){
      waitText.innerText=`Wait for... ${sec}s`;
    }else{
      clearInterval(timerInterval);
      document.getElementById('adGate').style.display='none';
      loadCleanVignette();
      if(pendingIdx!==null){
        const opened=getOpened(); opened[pendingIdx]=Date.now(); saveOpened(opened);
        document.querySelectorAll('.faq-item').forEach(el=>el.classList.remove('open'));
        document.getElementById('faq-'+pendingIdx).classList.add('open');
      }
    }
  },1000);
}
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore(); let cachedUser=null;
(function(){try{var c=JSON.parse(localStorage.getItem('userData')||'{}'); if(c.username) document.getElementById('nameInput').value=c.username; if(c.email) document.getElementById('emailInput').value=c.email;}catch(e){}})();
auth.onAuthStateChanged(u=>{ if(!u){location.href='./index.html';return;} cachedUser=u; db.collection('users').doc(u.uid).get().then(s=>{ if(s.exists){ var d=s.data(); localStorage.setItem('userData', JSON.stringify({...d,uid:u.uid})); document.getElementById('nameInput').value=d.username||''; document.getElementById('emailInput').value=d.email||u.email||''; }}); loadTickets(); });
async function doSendTicket(){ var issue=document.getElementById('issueInput').value.trim(); var el=document.getElementById('status'); if(!issue||issue.length<10){ el.style.color='#ef4444'; el.innerText='Min 10 characters'; return;} el.style.color='#6b7280'; el.innerText='Sending...'; try{ var user=auth.currentUser||cachedUser; if(!user) throw new Error('Not logged in'); var ud=JSON.parse(localStorage.getItem('userData')||'{}'); var ticketData={uid:user.uid,userId:user.uid,username:ud.username||document.getElementById('nameInput').value,email:ud.email||document.getElementById('emailInput').value||user.email,message:issue,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp(),adminReply:'',reply:''}; await db.collection('users').doc(user.uid).collection('supportTickets').add(ticketData); try{ await db.collection('supportTickets').add(ticketData); }catch(e){} document.getElementById('issueInput').value=''; el.style.color='#16a34a'; el.innerText='✓ Sent!'; setTimeout(()=>{el.innerText=''},3000);}catch(e){ el.style.color='#ef4444'; el.innerText='Error: '+e.message;} }
function loadTickets(){ var user=auth.currentUser||cachedUser; if(!user) return; var list=document.getElementById('ticketsList'); db.collection('users').doc(user.uid).collection('supportTickets').orderBy('createdAt','desc').limit(20).onSnapshot(snap=>{ if(snap.empty){ list.innerHTML='<div style="text-align:center;padding:20px"><div style="font-size:28px">📭</div><p style="color:#9ca3af;font-size:13px;margin-top:6px">No tickets yet</p></div>'; return;} var h=''; snap.forEach(doc=>{ var v=doc.data(); var date=v.createdAt?.toDate?v.createdAt.toDate().toLocaleDateString():'Now'; var replyText = v.adminReply || v.reply || ''; var hasReply = !!replyText; var badge = hasReply ? `<span style="background:#dcfce7;border:2px solid #bbf7d0;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900;color:#166534">REPLIED</span>` : `<span style="background:#fffbeb;border:2px solid #fde68a;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900;color:#92400e">PENDING</span>`; h+=`<div style="background:${hasReply?'#f0fdf4':'#f9fafb'};border:2px solid ${hasReply?'#bbf7d0':'#f1f5f9'};border-radius:14px;padding:12px;margin-bottom:10px"><div style="display:flex;justify-content:space-between">${badge}<span style="font-size:11px;color:#9ca3af">${date}</span></div><div style="font-weight:700;margin-top:6px;font-size:13px;line-height:1.4">${v.message}</div>${hasReply?`<div style="background:#fff;border:2px solid #bbf7d0;border-radius:10px;padding:8px;margin-top:8px"><b style="color:#16a34a;font-size:11px">Admin Reply:</b><div style="font-size:13px;color:#065f46;margin-top:2px">${replyText}</div></div>`:'<div style="font-size:11px;color:#9ca3af;margin-top:6px">⏳ Waiting for reply...</div>'}</div>`; }); list.innerHTML=h; }); }
</script>
</body>
</html>
