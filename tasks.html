<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsored Tasks</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<!-- PASTE YOUR MONETAG MULTITAG / VIGNETTE CODE HERE -->
<!-- Example: <script src="https://.../multitag.js"></script> -->
<!-- Keep only Vignette enabled for this page in Monetag dashboard -->

<style>
body{font-family:Inter,sans-serif;background:#f5f3ff}
.task-card{background:#fff;border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.btn-start{background:#7c3aed;color:#fff;padding:8px 18px;border-radius:20px;font-weight:700;font-size:13px;border:none}
.btn-verify{background:#10b981;color:#fff;padding:8px 18px;border-radius:20px;font-weight:700;font-size:13px;border:none}
.btn-claimed{background:#e5e7eb;color:#6b7280;padding:8px 18px;border-radius:20px;font-weight:700;font-size:12px;border:none}
</style>
</head>
<body>
<div class="bg-gradient-to-r from-purple-600 to-indigo-600 p-4 text-white flex items-center gap-3">
  <a href="home.html"><i class="fas fa-arrow-left"></i></a>
  <b>Sponsored Tasks • Max 20 pts/day</b>
</div>

<div class="p-4" id="list"></div>
<p class="text-center text-xs text-gray-500 pb-6">Watch ad fully to verify. Resets every 24h.</p>

<script>
// 1. PASTE YOUR DIRECT LINK HERE
const DIRECT_LINK = "PASTE_YOUR_DIRECT_LINK_HERE";

const TASKS = [
  {id:1, name:"Quick Ad View", icon:"fa-bolt", pts:1},
  {id:2, name:"Premium Brand Offer", icon:"fa-crown", pts:3},
  {id:3, name:"Sponsor Clip", icon:"fa-play", pts:2},
  {id:4, name:"Daily Sponsor", icon:"fa-eye", pts:1},
  {id:5, name:"Special Promo", icon:"fa-gift", pts:2},
  {id:6, name:"Gold Sponsor", icon:"fa-star", pts:3},
  {id:7, name:"Mini Ad", icon:"fa-film", pts:1},
  {id:8, name:"Partner Spot", icon:"fa-handshake", pts:2},
  {id:9, name:"High Value Ad", icon:"fa-fire", pts:3},
  {id:10, name:"Bonus Clip", icon:"fa-check-circle", pts:2},
];

let states = JSON.parse(localStorage.getItem('perlan_tasks_v2')||'{}');

function render(){
  let html=''; let earned=0;
  TASKS.forEach(t=>{
    let s = states[t.id]||{status:'idle', at:0};
    let diffH = (Date.now() - s.at)/3600000;
    if(s.status==='claimed' && diffH < 24){
      earned+=t.pts;
      let rem=24-diffH; let h=Math.floor(rem); let m=Math.floor((rem-h)*60);
      html+=`<div class="task-card opacity-60"><div class="flex gap-3 items-center"><div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center"><i class="fas ${t.icon} text-purple-600"></i></div><div><b class="text-sm">${t.name}</b><br><span class="text-xs text-gray-500">${t.pts} pts • done</span></div></div><button class="btn-claimed">${h}h ${m}m</button></div>`;
    } else {
      let btn='';
      if(s.status==='waiting') btn=`<button class="btn-start" style="background:#f59e0b">Wait ${s.count}s</button>`;
      else if(s.status==='ready') btn=`<button class="btn-verify" onclick="verifyTask(${t.id})">Verify</button>`;
      else btn=`<button class="btn-start" onclick="startTask(${t.id})">Start • ${t.pts}pts</button>`;
      html+=`<div class="task-card"><div class="flex gap-3 items-center"><div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center"><i class="fas ${t.icon} text-purple-600"></i></div><div><b class="text-sm">${t.name}</b><br><span class="text-xs text-gray-500">${t.pts} pt${t.pts>1?'s':''}</span></div></div>${btn}</div>`;
    }
  });
  document.getElementById('list').innerHTML = html + `<div class="text-center mt-3 text-sm font-bold">Today: ${earned}/20 pts</div>`;
}

window.startTask=(id)=>{
  if(DIRECT_LINK.includes("PASTE_YOUR")){ alert("Add your Direct Link in code first"); return; }
  window.open(DIRECT_LINK, '_blank');
  states[id]={status:'waiting', count:10, at:0};
  localStorage.setItem('perlan_tasks_v2', JSON.stringify(states));
  render();
  let c=10;
  let iv=setInterval(()=>{
    c--;
    states[id].count=c;
    localStorage.setItem('perlan_tasks_v2', JSON.stringify(states));
    if(c<=0){
      clearInterval(iv);
      states[id].status='ready';
      localStorage.setItem('perlan_tasks_v2', JSON.stringify(states));
      render();
    } else {
      render();
    }
  },1000);
}

window.verifyTask=(id)=>{
  let t = TASKS.find(x=>x.id===id);
  states[id]={status:'claimed', at:Date.now()};
  localStorage.setItem('perlan_tasks_v2', JSON.stringify(states));
  // TODO: add to Firebase: increment user points by t.pts
  alert("Verified! +"+t.pts+" pts added. Next in 24h");
  render();
}
render();
</script>
</body>
</html>
