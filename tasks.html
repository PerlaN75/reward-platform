<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsored Tasks</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<!-- PASTE YOUR MONETAG VIGNETTE MULTITAG HERE -->
</head>
<body class="bg-gray-50">
<div class="bg-gradient-to-r from-purple-600 to-indigo-600 p-4 text-white flex gap-3 items-center">
  <a href="home.html"><i class="fas fa-arrow-left"></i></a><b>Sponsored Tasks • 20 pts/day</b>
</div>
<div class="p-4" id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

// YOUR FIREBASE CONFIG - paste from your home.html
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  //...
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const DIRECT_LINK = "PASTE_YOUR_DIRECT_LINK_HERE";

const TASKS = [
  {id:1, name:"Quick Ad View", icon:"fa-bolt", pts:1},
  {id:2, name:"Premium Brand Offer", icon:"fa-crown", pts:3},
  {id:3, name:"Sponsor Clip", icon:"fa-play", pts:2},
  {id:4, name:"Daily Sponsor", icon:"fa-eye", pts:1},
  {id:5, name:"Special Promo", icon:"fa-gift", pts:2},
  {id:6, name:"Gold Sponsor", icon:"fa-star", pts:3},
  {id:7, name:"Mini Ad", icon:"fa-film", pts:1},
  {id:8, name:"Partner Spot", icon:"fa-handshake", pts:2},
  {id:9, name:"High Value Ad", icon:"fa-fire", pts:3},
  {id:10, name:"Bonus Clip", icon:"fa-check-circle", pts:2},
];

let currentUser=null;
let states=JSON.parse(localStorage.getItem('perlan_tasks_v2')||'{}');

onAuthStateChanged(auth, (user)=>{
  if(user) currentUser=user;
  render();
});

function render(){
  let html=''; let earned=0;
  TASKS.forEach(t=>{
    let s=states[t.id]||{status:'idle', at:0};
    let diffH=(Date.now()-s.at)/3600000;
    if(s.status==='claimed' && diffH<24){
      earned+=t.pts;
      let rem=24-diffH; let h=Math.floor(rem); let m=Math.floor((rem-h)*60);
      html+=`<div class="bg-white rounded-xl p-3 flex justify-between items-center mb-2 opacity-60"><div class="flex gap-2 items-center"><i class="fas ${t.icon} text-purple-600"></i><div><b class="text-sm">${t.name}</b><br><span class="text-xs">${t.pts} pts done</span></div></div><span class="text-xs bg-gray-200 px-3 py-1 rounded-full">${h}h ${m}m</span></div>`;
    } else {
      let btn=s.status==='waiting'?`<span class="text-xs bg-amber-400 text-white px-3 py-2 rounded-full">${s.count}s</span>`:s.status==='ready'?`<button onclick="window.verifyTask(${t.id})" class="bg-green-500 text-white px-4 py-2 rounded-full text-xs font-bold">Verify</button>`:`<button onclick="window.startTask(${t.id})" class="bg-purple-600 text-white px-4 py-2 rounded-full text-xs font-bold">Start • ${t.pts}pts</button>`;
      html+=`<div class="bg-white rounded-xl p-3 flex justify-between items-center mb-2"><div class="flex gap-2 items-center"><i class="fas ${t.icon} text-purple-600"></i><div><b class="text-sm">${t.name}</b><br><span class="text-xs text-gray-500">${t.pts} pts</span></div></div>${btn}</div>`;
    }
  });
  document.getElementById('list').innerHTML=html+`<div class="text-center mt-4 font-bold text-sm">Today: ${earned}/20 pts</div>`;
}

window.startTask=(id)=>{
  if(!currentUser){ alert("Login first"); return; }
  window.open(DIRECT_LINK,'_blank');
  states[id]={status:'waiting', count:10, at:0}; localStorage.setItem('perlan_tasks_v2', JSON.stringify(states)); render();
  let c=10; let iv=setInterval(()=>{ c--; states[id].count=c; localStorage.setItem('perlan_tasks_v2', JSON.stringify(states)); if(c<=0){clearInterval(iv); states[id].status='ready'; localStorage.setItem('perlan_tasks_v2', JSON.stringify(states)); render();} else render(); },1000);
}

window.verifyTask=async(id)=>{
  if(!currentUser) return;
  let t=TASKS.find(x=>x.id===id);
  try{
    // 1. Add points to user
    const userRef = doc(db, "users", currentUser.uid);
    await updateDoc(userRef, { points: increment(t.pts), balance: increment(t.pts) });
    // 2. Add history record
    await addDoc(collection(db, "users", currentUser.uid, "history"), {
      type: "task",
      taskName: t.name,
      points: t.pts,
      createdAt: serverTimestamp()
    });
    // 3. Lock for 24h
    states[id]={status:'claimed', at:Date.now()}; localStorage.setItem('perlan_tasks_v2', JSON.stringify(states));
    alert("+"+t.pts+" pts added!");
    render();
  }catch(e){ console.error(e); alert("Error: "+e.message); }
}
window.render=render;
render();
</script>
</body>
</html>
