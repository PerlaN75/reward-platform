<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Register - Reward Platform</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f4f7fb;

    color: #222;

}


/* =====================================================
   TOP NAVIGATION
===================================================== */

.top-nav {

    width: 100%;

    background: #ffffff;

    padding: 15px 20px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.08);

}


.top-nav a {

    text-decoration: none;

    color: #333;

    font-weight: bold;

}


/* =====================================================
   REGISTER CONTAINER
===================================================== */

.register-container {

    max-width: 450px;

    margin: 50px auto;

    padding: 30px;

    background: #ffffff;

    border-radius: 12px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.08);

}


.register-container h1 {

    text-align: center;

    margin-bottom: 10px;

}


.register-container p {

    text-align: center;

    color: #666;

    margin-bottom: 25px;

}


/* =====================================================
   FORM
===================================================== */

.form-group {

    margin-bottom: 18px;

}


.form-group label {

    display: block;

    margin-bottom: 7px;

    font-weight: bold;

}


.form-group input {

    width: 100%;

    padding: 12px;

    border: 1px solid #ccc;

    border-radius: 7px;

    font-size: 16px;

}


.form-group input:focus {

    outline: none;

    border-color: #007bff;

}


/* =====================================================
   PASSWORD RULES
===================================================== */

.password-rules {

    margin-top: 8px;

    padding: 10px;

    background: #f8f9fa;

    border-radius: 7px;

    font-size: 13px;

    color: #555;

}


.password-rules div {

    margin: 4px 0;

}


/* =====================================================
   BUTTON
===================================================== */

.register-button {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 7px;

    background: #007bff;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}


.register-button:hover {

    background: #0056b3;

}


/* =====================================================
   MESSAGE
===================================================== */

.message {

    margin-top: 15px;

    text-align: center;

    font-weight: bold;

}


/* =====================================================
   LOGIN LINK
===================================================== */

.login-link {

    margin-top: 20px;

    text-align: center;

}


.login-link a {

    color: #007bff;

    text-decoration: none;

    font-weight: bold;

}

</style>

</head>


<body>


<!-- =====================================================
     TOP NAVIGATION
===================================================== -->

<nav class="top-nav">

    <a href="index.html">Home</a>

</nav>



<!-- =====================================================
     REGISTER FORM
===================================================== -->

<div class="register-container">

    <h1>Create Account</h1>

    <p>Register to start earning rewards.</p>


    <form id="registerForm">


        <!-- USERNAME -->

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                required
                autocomplete="username"
            >

        </div>



        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                required
                autocomplete="email"
            >

        </div>



        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
                autocomplete="new-password"
            >


            <div class="password-rules">

                <div>
                    • 6–15 characters
                </div>

                <div>
                    • At least one capital letter
                </div>

                <div>
                    • At least one lowercase letter
                </div>

                <div>
                    • At least one special character:
                    ? ! % & $ # =
                </div>

            </div>

        </div>



        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                required
                autocomplete="new-password"
            >

        </div>



        <!-- BUTTON -->

        <button
            type="submit"
            class="register-button"
        >
            Register
        </button>


    </form>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- LOGIN -->

    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>



<script>

/* =====================================================
   REGISTER SYSTEM - MULTIPLE USERS
===================================================== */

document
    .getElementById("registerForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        /* =================================================
           GET FORM VALUES
        ================================================= */

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();

        const password =
            document
                .getElementById("password")
                .value;

        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;

        const message =
            document.getElementById("message");


        /* =================================================
           PASSWORD RULES
        ================================================= */

        const passwordPattern =
            /^(?=.*[A-Z])(?=.*[a-z])(?=.*[?!%&$#=]).{6,15}$/;


        /* =================================================
           CHECK PASSWORD
        ================================================= */

        if (!passwordPattern.test(password)) {

            message.style.color = "red";

            message.textContent =
                "Password must be 6–15 characters and contain at least one capital letter, one lowercase letter, and one special character (? ! % & $ # =).";

            return;

        }


        /* =================================================
           CONFIRM PASSWORD
        ================================================= */

        if (password !== confirmPassword) {

            message.style.color = "red";

            message.textContent =
                "Passwords do not match.";

            return;

        }


        /* =================================================
           GET EXISTING USERS
           
           IMPORTANT:
           We use rewardUsers[].

           We DO NOT replace the existing users.
        ================================================= */

        let users =
            JSON.parse(
                localStorage.getItem("rewardUsers")
            );


        /* =================================================
           CREATE USERS ARRAY IF IT DOES NOT EXIST
        ================================================= */

        if (!Array.isArray(users)) {

            users = [];

        }


        /* =================================================
           CHECK DUPLICATE USERNAME
        ================================================= */

        const usernameExists =
            users.some(function(user) {

                return (
                    user.username &&
                    user.username.toLowerCase() ===
                    username.toLowerCase()
                );

            });


        if (usernameExists) {

            message.style.color = "red";

            message.textContent =
                "This username is already registered.";

            return;

        }


        /* =================================================
           CHECK DUPLICATE EMAIL
        ================================================= */

        const emailExists =
            users.some(function(user) {

                return (
                    user.email &&
                    user.email.toLowerCase() ===
                    email
                );

            });


        if (emailExists) {

            message.style.color = "red";

            message.textContent =
                "This email is already registered.";

            return;

        }


        /* =================================================
           CREATE NEW USER
        ================================================= */

        const newUser = {

            username: username,

            email: email,

            password: password,

            points: 0,

            createdAt: new Date().toISOString()

        };


        /* =================================================
           ADD NEW USER TO USERS ARRAY
           
           THIS IS THE CRITICAL FIX.
           
           We use push().
           
           The previous accounts remain in the array.
        ================================================= */

        users.push(newUser);


        /* =================================================
           SAVE ALL USERS
        ================================================= */

        localStorage.setItem(
            "rewardUsers",
            JSON.stringify(users)
        );


        /* =================================================
           SUCCESS MESSAGE
        ================================================= */

        message.style.color = "green";

        message.textContent =
            "Registration successful. Redirecting to login...";


        /* =================================================
           REDIRECT TO LOGIN
        ================================================= */

        setTimeout(function() {

            window.location.href =
                "login.html";

        }, 1000);

    });

</script>


</body>

</html>
