<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Register - Reward Platform</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f4f7fb;

    color: #222;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 100%;

    max-width: 480px;

    margin: 50px auto;

    padding: 20px;

}


/* =====================================================
   REGISTER CARD
===================================================== */

.register-card {

    background: white;

    padding: 30px;

    border-radius: 15px;

    box-shadow: 0 4px 18px rgba(0,0,0,0.10);

}


.register-card h1 {

    margin: 0 0 10px 0;

    text-align: center;

    font-size: 28px;

}


.register-card p {

    text-align: center;

    color: #666;

    margin-bottom: 25px;

}


/* =====================================================
   FORM GROUP
===================================================== */

.form-group {

    margin-bottom: 18px;

}


.form-group label {

    display: block;

    margin-bottom: 7px;

    font-weight: bold;

}


.form-group input {

    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 15px;

    outline: none;

}


.form-group input:focus {

    border-color: #2563eb;

}


/* =====================================================
   PASSWORD RULES
===================================================== */

.password-rules {

    background: #f7f9fc;

    border: 1px solid #e1e5eb;

    border-radius: 8px;

    padding: 12px;

    margin-top: 8px;

    font-size: 13px;

    color: #555;

}


.password-rules div {

    margin: 4px 0;

}


.rule-valid {

    color: #16803c;

}


.rule-invalid {

    color: #b42318;

}


/* =====================================================
   BUTTON
===================================================== */

.register-button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


.register-button:hover {

    background: #1d4ed8;

}


/* =====================================================
   MESSAGE
===================================================== */

.message {

    display: none;

    padding: 12px;

    border-radius: 8px;

    margin-bottom: 18px;

    font-size: 14px;

    text-align: center;

}


.message.error {

    background: #fff0f0;

    color: #b42318;

    border: 1px solid #f3c2c2;

}


.message.success {

    background: #eefaf1;

    color: #16803c;

    border: 1px solid #b8e0c2;

}


/* =====================================================
   LOGIN LINK
===================================================== */

.login-link {

    text-align: center;

    margin-top: 22px;

    font-size: 14px;

}


.login-link a {

    color: #2563eb;

    text-decoration: none;

    font-weight: bold;

}


.login-link a:hover {

    text-decoration: underline;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 520px) {

    .container {

        margin: 20px auto;

        padding: 15px;

    }


    .register-card {

        padding: 22px;

    }

}

</style>

</head>


<body>


<div class="container">


    <div class="register-card">


        <h1>Create Account</h1>


        <p>
            Register to start earning rewards.
        </p>


        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- =================================================
             REGISTER FORM
        ================================================== -->

        <form id="registerForm">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create password"
                    autocomplete="new-password"
                    required
                >


                <div class="password-rules">

                    <div id="lengthRule">
                        ❌ 6–15 characters
                    </div>

                    <div id="capitalRule">
                        ❌ At least one capital letter
                    </div>

                    <div id="lowercaseRule">
                        ❌ At least one lowercase letter
                    </div>

                    <div id="specialRule">
                        ❌ At least one special character:
                        ? ! % & $ # =
                    </div>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="register-button"
            >
                Create Account
            </button>


        </form>


        <!-- =================================================
             LOGIN
        ================================================== -->

        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


    </div>


</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const registerForm =
    document.getElementById("registerForm");

const usernameInput =
    document.getElementById("username");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const message =
    document.getElementById("message");


/* =====================================================
   PASSWORD RULE ELEMENTS
===================================================== */

const lengthRule =
    document.getElementById("lengthRule");

const capitalRule =
    document.getElementById("capitalRule");

const lowercaseRule =
    document.getElementById("lowercaseRule");

const specialRule =
    document.getElementById("specialRule");


/* =====================================================
   PASSWORD VALIDATION
===================================================== */

function validatePassword(password) {

    const lengthValid =
        password.length >= 6 &&
        password.length <= 15;


    const capitalValid =
        /[A-Z]/.test(password);


    const lowercaseValid =
        /[a-z]/.test(password);


    const specialValid =
        /[?!%&$#=]/.test(password);


    updateRule(
        lengthRule,
        lengthValid,
        "6–15 characters"
    );


    updateRule(
        capitalRule,
        capitalValid,
        "At least one capital letter"
    );


    updateRule(
        lowercaseRule,
        lowercaseValid,
        "At least one lowercase letter"
    );


    updateRule(
        specialRule,
        specialValid,
        "At least one special character: ? ! % & $ # ="
    );


    return (
        lengthValid &&
        capitalValid &&
        lowercaseValid &&
        specialValid
    );

}


/* =====================================================
   UPDATE PASSWORD RULE
===================================================== */

function updateRule(
    element,
    valid,
    text
) {

    if (valid) {

        element.textContent =
            "✅ " + text;

        element.className =
            "rule-valid";

    }

    else {

        element.textContent =
            "❌ " + text;

        element.className =
            "rule-invalid";

    }

}


/* =====================================================
   PASSWORD LIVE CHECK
===================================================== */

passwordInput.addEventListener(
    "input",
    function() {

        validatePassword(
            passwordInput.value
        );

    }
);


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


/* =====================================================
   NORMALIZE EMAIL
===================================================== */

function normalizeEmail(email) {

    return email
        .trim()
        .toLowerCase();

}


/* =====================================================
   NORMALIZE USERNAME
===================================================== */

function normalizeUsername(username) {

    return username
        .trim();

}


/* =====================================================
   LOAD USERS
===================================================== */

function getUsers() {

    let users = [];


    try {

        const storedUsers =
            localStorage.getItem("users");


        if (storedUsers) {

            const parsedUsers =
                JSON.parse(storedUsers);


            if (Array.isArray(parsedUsers)) {

                users =
                    parsedUsers;

            }

        }

    }

    catch (error) {

        console.error(
            "Unable to read users:",
            error
        );

        users = [];

    }


    return users;

}


/* =====================================================
   SAVE USERS
===================================================== */

function saveUsers(users) {

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );

}


/* =====================================================
   GENERATE USER ID
===================================================== */

function generateUserId() {

    return (
        "USER-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase()
    );

}


/* =====================================================
   REGISTER
===================================================== */

registerForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        /* =============================================
           GET VALUES
        ============================================= */

        const username =
            normalizeUsername(
                usernameInput.value
            );


        const email =
            normalizeEmail(
                emailInput.value
            );


        const password =
            passwordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;


        /* =============================================
           BASIC VALIDATION
        ============================================= */

        if (!username) {

            showMessage(
                "Please enter a username.",
                "error"
            );

            return;

        }


        if (!email) {

            showMessage(
                "Please enter your email address.",
                "error"
            );

            return;

        }


        /* =============================================
           PASSWORD VALIDATION
        ============================================= */

        if (!validatePassword(password)) {

            showMessage(
                "Please satisfy all password requirements.",
                "error"
            );

            return;

        }


        /* =============================================
           CONFIRM PASSWORD
        ============================================= */

        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }


        /* =============================================
           LOAD ALL USERS
        ============================================= */

        const users =
            getUsers();


        /* =============================================
           CHECK USERNAME
        ============================================= */

        const usernameExists =
            users.some(function(user) {

                return (
                    String(
                        user.username || ""
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    username.toLowerCase()
                );

            });


        if (usernameExists) {

            showMessage(
                "This username is already registered.",
                "error"
            );

            return;

        }


        /* =============================================
           CHECK EMAIL
        ============================================= */

        const emailExists =
            users.some(function(user) {

                return (
                    String(
                        user.email || ""
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    email
                );

            });


        if (emailExists) {

            showMessage(
                "This email is already registered.",
                "error"
            );

            return;

        }


        /* =============================================
           CREATE NEW USER
        ============================================= */

        const newUser = {

            id:
                generateUserId(),

            username:
                username,

            email:
                email,

            password:
                password,

            points:
                0,

            rewardPoints:
                0,

            rewardHistory:
                [],

            activityHistory:
                [],

            completedActivities:
                {},

            dailyCheckIn:
                null,

            lastCheckIn:
                null,

            quizHistory:
                [],

            gameHistory:
                [],

            watchHistory:
                [],

            spinHistory:
                [],

            challengeProgress:
                0,

            withdrawals:
                [],

            notifications:
                [],

            createdAt:
                new Date().toISOString()

        };


        /* =============================================
           ADD USER TO USERS ARRAY
        ============================================= */

        users.push(
            newUser
        );


        /* =============================================
           SAVE ALL USERS
        ============================================= */

        saveUsers(
            users
        );


        /* =============================================
           SAVE CURRENT USER
           
           This keeps the registration compatible
           with the rest of the platform while we
           transition everything to the multi-user
           structure.
        ============================================= */

        localStorage.setItem(
            "currentUser",
            JSON.stringify(newUser)
        );


        localStorage.setItem(
            "rewardUser",
            JSON.stringify(newUser)
        );


        /* =============================================
           SAVE CURRENT USERNAME / EMAIL
        ============================================= */

        localStorage.setItem(
            "username",
            username
        );


        localStorage.setItem(
            "userEmail",
            email
        );


        /* =============================================
           DO NOT LOG USER IN AUTOMATICALLY
           
           The account is created first.
           Login remains responsible for authentication.
        ============================================= */

        localStorage.removeItem(
            "loggedIn"
        );


        localStorage.removeItem(
            "isLoggedIn"
        );


        /* =============================================
           SUCCESS MESSAGE
        ============================================= */

        showMessage(
            "Account created successfully. Redirecting to login...",
            "success"
        );


        /* =============================================
           REDIRECT TO LOGIN
        ============================================= */

        setTimeout(
            function() {

                window.location.href =
                    "login.html";

            },
            1000
        );

    }
);


/* =====================================================
   INITIAL PASSWORD DISPLAY
===================================================== */

validatePassword("");


</script>


</body>

</html>
