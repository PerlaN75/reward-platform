<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Register - Reward Platform</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #182848,
            #3d2075
        );

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

}


/* =====================================================
   REGISTER CARD
===================================================== */

.register-card {

    width: 100%;

    max-width: 500px;

    background: white;

    border-radius: 22px;

    padding: 30px 22px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,0.25);

}


.register-icon {

    text-align: center;

    font-size: 55px;

}


h1 {

    margin: 10px 0 5px;

    text-align: center;

    font-size: 32px;

    color: #182848;

}


.subtitle {

    text-align: center;

    color: #777;

    margin-bottom: 25px;

}


/* =====================================================
   FORM
===================================================== */

.form-group {

    margin-bottom: 18px;

}


label {

    display: block;

    margin-bottom: 7px;

    color: #333;

    font-weight: bold;

    font-size: 15px;

}


input {

    width: 100%;

    padding: 14px;

    border:
        1px solid #d8dce5;

    border-radius: 11px;

    font-size: 16px;

    outline: none;

}


input:focus {

    border-color: #7b2cff;

    box-shadow:
        0 0 0 2px
        rgba(123,44,255,0.10);

}


/* =====================================================
   PASSWORD RULES
===================================================== */

.password-rules {

    background: #f7f8fc;

    border-radius: 12px;

    padding: 13px;

    margin-top: 8px;

    color: #666;

    font-size: 13px;

    line-height: 1.6;

}


.password-rules strong {

    color: #182848;

}


.rule {

    margin: 2px 0;

}


.rule.valid {

    color: #168a3a;

}


.rule.invalid {

    color: #c62828;

}


/* =====================================================
   MESSAGE
===================================================== */

.message {

    min-height: 22px;

    margin: 12px 0;

    text-align: center;

    font-size: 14px;

    font-weight: bold;

}


.message.error {

    color: #c62828;

}


.message.success {

    color: #168a3a;

}


/* =====================================================
   REGISTER BUTTON
===================================================== */

.register-button {

    width: 100%;

    border: none;

    border-radius: 13px;

    padding: 15px;

    background:
        linear-gradient(
            90deg,
            #8b25ff,
            #287dff
        );

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}


.register-button:hover {

    transform:
        translateY(-1px);

}


/* =====================================================
   LOGIN LINK
===================================================== */

.login-area {

    text-align: center;

    margin-top: 20px;

    color: #666;

    font-size: 14px;

}


.login-area a {

    color: #7b2cff;

    font-weight: bold;

    text-decoration: none;

}


.login-area a:hover {

    text-decoration: underline;

}


/* =====================================================
   HOME
===================================================== */

.home-button {

    display: block;

    text-align: center;

    margin-top: 15px;

    color: #555;

    text-decoration: none;

    font-size: 14px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    .register-card {

        padding: 25px 17px;

    }


    h1 {

        font-size: 28px;

    }

}

</style>

</head>


<body>


<div class="register-card">


    <div class="register-icon">

        👤

    </div>


    <h1>

        Create Account

    </h1>


    <div class="subtitle">

        Join the Reward Platform

    </div>


    <!-- =================================================
         REGISTER FORM
    ================================================== -->

    <form
        id="registerForm"
        onsubmit="registerUser(event)">


        <div class="form-group">

            <label for="username">

                Username

            </label>


            <input
                type="text"
                id="username"
                maxlength="30"
                autocomplete="username"
                placeholder="Enter your username"
                required>

        </div>


        <div class="form-group">

            <label for="email">

                Email

            </label>


            <input
                type="email"
                id="email"
                autocomplete="email"
                placeholder="Enter your email"
                required>

        </div>


        <div class="form-group">

            <label for="password">

                Password

            </label>


            <input
                type="password"
                id="password"
                maxlength="15"
                autocomplete="new-password"
                placeholder="Create a password"
                required>


            <div class="password-rules">

                <strong>Password must contain:</strong>

                <div
                    id="lengthRule"
                    class="rule invalid">

                    ✗ 6–15 characters

                </div>


                <div
                    id="capitalRule"
                    class="rule invalid">

                    ✗ At least one capital letter

                </div>


                <div
                    id="lowerRule"
                    class="rule invalid">

                    ✗ At least one lowercase letter

                </div>


                <div
                    id="specialRule"
                    class="rule invalid">

                    ✗ At least one special character
                    (? ! % & $ # =)

                </div>

            </div>

        </div>


        <div class="form-group">

            <label for="confirmPassword">

                Confirm Password

            </label>


            <input
                type="password"
                id="confirmPassword"
                maxlength="15"
                autocomplete="new-password"
                placeholder="Confirm your password"
                required>

        </div>


        <div
            id="message"
            class="message">

        </div>


        <button
            type="submit"
            class="register-button">

            🚀 Create Account

        </button>


    </form>


    <div class="login-area">

        Already have an account?

        <a href="login.html">

            Login

        </a>

    </div>


    <a
        href="index.html"
        class="home-button">

        ← Home

    </a>


</div>


<script>

/* =====================================================
   PASSWORD RULES
===================================================== */

function checkPasswordRules() {

    const password =
        document.getElementById(
            "password"
        ).value;


    const lengthValid =
        password.length >= 6 &&
        password.length <= 15;


    const capitalValid =
        /[A-Z]/.test(password);


    const lowerValid =
        /[a-z]/.test(password);


    const specialValid =
        /[?!%&$#=]/.test(password);


    updateRule(
        "lengthRule",
        lengthValid,
        "6–15 characters"
    );


    updateRule(
        "capitalRule",
        capitalValid,
        "At least one capital letter"
    );


    updateRule(
        "lowerRule",
        lowerValid,
        "At least one lowercase letter"
    );


    updateRule(
        "specialRule",
        specialValid,
        "At least one special character (? ! % & $ # =)"
    );


    return (
        lengthValid &&
        capitalValid &&
        lowerValid &&
        specialValid
    );

}


/* =====================================================
   UPDATE PASSWORD RULE
===================================================== */

function updateRule(
    id,
    valid,
    text
) {

    const element =
        document.getElementById(id);


    if (valid) {

        element.className =
            "rule valid";

        element.textContent =
            "✓ " + text;

    }

    else {

        element.className =
            "rule invalid";

        element.textContent =
            "✗ " + text;

    }

}


/* =====================================================
   PASSWORD INPUT
===================================================== */

document
    .getElementById("password")
    .addEventListener(
        "input",
        checkPasswordRules
    );


/* =====================================================
   GET ALL USERS
===================================================== */

function getAllUsers() {

    let users = [];


    try {

        const stored =
            localStorage.getItem(
                "rewardUsers"
            );


        if (stored) {

            const parsed =
                JSON.parse(stored);


            if (
                Array.isArray(parsed)
            ) {

                users =
                    parsed;

            }

        }

    }

    catch (error) {

        users = [];

    }


    /*
       IMPORTANT:

       If an older version of the platform
       has one user stored as "rewardUser",
       preserve that user by migrating it
       into the new users array.
    */

    if (
        users.length === 0
    ) {

        try {

            const oldUser =
                localStorage.getItem(
                    "rewardUser"
                );


            if (oldUser) {

                const parsedOldUser =
                    JSON.parse(
                        oldUser
                    );


                if (
                    parsedOldUser &&
                    typeof parsedOldUser ===
                    "object"
                ) {

                    if (
                        !parsedOldUser.id
                    ) {

                        parsedOldUser.id =
                            createUserId();

                    }


                    users.push(
                        parsedOldUser
                    );


                    localStorage.setItem(
                        "rewardUsers",
                        JSON.stringify(
                            users
                        )
                    );

                }

            }

        }

        catch (error) {

            console.log(
                "Legacy user migration failed."
            );

        }

    }


    return users;

}


/* =====================================================
   SAVE ALL USERS
===================================================== */

function saveAllUsers(users) {

    localStorage.setItem(
        "rewardUsers",
        JSON.stringify(
            users
        )
    );

}


/* =====================================================
   CREATE USER ID
===================================================== */

function createUserId() {

    return (
        "user_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 10)
    );

}


/* =====================================================
   REGISTER USER
===================================================== */

function registerUser(event) {

    event.preventDefault();


    const username =
        document.getElementById(
            "username"
        ).value.trim();


    const email =
        document.getElementById(
            "email"
        ).value.trim()
        .toLowerCase();


    const password =
        document.getElementById(
            "password"
        ).value;


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;


    const message =
        document.getElementById(
            "message"
        );


    message.className =
        "message";


    message.textContent =
        "";


    /* =================================================
       BASIC VALIDATION
    ================================================== */

    if (
        !username ||
        !email ||
        !password ||
        !confirmPassword
    ) {

        showError(
            "Please complete all fields."
        );

        return;

    }


    /* =================================================
       PASSWORD VALIDATION
    ================================================== */

    if (
        !checkPasswordRules()
    ) {

        showError(
            "Please meet all password requirements."
        );

        return;

    }


    /* =================================================
       CONFIRM PASSWORD
    ================================================== */

    if (
        password !==
        confirmPassword
    ) {

        showError(
            "Passwords do not match."
        );

        return;

    }


    /* =================================================
       GET USERS
    ================================================== */

    const users =
        getAllUsers();


    /* =================================================
       DUPLICATE USERNAME
    ================================================== */

    const usernameExists =
        users.some(
            function(user) {

                return (
                    String(
                        user.username || ""
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    username.toLowerCase()
                );

            }
        );


    if (
        usernameExists
    ) {

        showError(
            "This username is already registered."
        );

        return;

    }


    /* =================================================
       DUPLICATE EMAIL
    ================================================== */

    const emailExists =
        users.some(
            function(user) {

                return (
                    String(
                        user.email || ""
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    email
                );

            }
        );


    if (
        emailExists
    ) {

        showError(
            "This email is already registered."
        );

        return;

    }


    /* =================================================
       CREATE NEW USER
    ================================================== */

    const newUser = {

        id:
            createUserId(),

        username:
            username,

        email:
            email,

        password:
            password,

        registeredAt:
            new Date().toLocaleString(),

        createdAt:
            new Date().toISOString(),

        accountStatus:
            "Active"

    };


    /* =================================================
       ADD USER TO USERS ARRAY
    ================================================== */

    users.push(
        newUser
    );


    saveAllUsers(
        users
    );


    /* =================================================
       CURRENT USER COMPATIBILITY
    =================================================

       The existing user pages still use
       "rewardUser".

       Therefore we keep this key for
       the newly registered user.

    */

    localStorage.setItem(
        "rewardUser",
        JSON.stringify(
            newUser
        )
    );


    /* =================================================
       INITIAL USER DATA
    ================================================= */

    localStorage.setItem(
        "rewardPoints_" +
        newUser.id,
        "0"
    );


    localStorage.setItem(
        "rewardHistory_" +
        newUser.id,
        JSON.stringify([])
    );


    localStorage.setItem(
        "adminAccountStatus_" +
        newUser.id,
        "Active"
    );


    /* =================================================
       ALSO INITIALIZE CURRENT USER KEYS
    ================================================= */

    localStorage.setItem(
        "rewardPoints",
        "0"
    );


    localStorage.setItem(
        "rewardHistory",
        JSON.stringify([])
    );


    localStorage.setItem(
        "adminAccountStatus",
        "Active"
    );


    /* =================================================
       SUCCESS
    ================================================= */

    showSuccess(
        "Account created successfully."
    );


    /*
       Give the user a moment to see
       the success message.
    */

    setTimeout(
        function() {

            window.location.href =
                "login.html";

        },
        800
    );

}


/* =====================================================
   ERROR MESSAGE
===================================================== */

function showError(text) {

    const message =
        document.getElementById(
            "message"
        );


    message.className =
        "message error";


    message.textContent =
        text;

}


/* =====================================================
   SUCCESS MESSAGE
===================================================== */

function showSuccess(text) {

    const message =
        document.getElementById(
            "message"
        );


    message.className =
        "message success";


    message.textContent =
        text;

}


/* =====================================================
   INITIALIZE
===================================================== */

checkPasswordRules();

</script>


</body>

</html>
