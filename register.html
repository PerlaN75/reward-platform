<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - Reward Platform</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

/* =========================
   TOP NAVIGATION
========================= */

.top-nav {
    background: #182848;
    padding: 12px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.top-nav a {
    color: white;
    text-decoration: none;
    padding: 11px 14px;
    font-weight: bold;
    border-radius: 10px;
}

.home-button {
    background: rgba(255,255,255,0.12);
}

/* =========================
   HEADER
========================= */

header {
    background: #182848;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
}

/* =========================
   CONTAINER
========================= */

.container {
    max-width: 650px;
    margin: auto;
    padding: 20px 15px;
}

/* =========================
   CARD
========================= */

.card {
    background: white;
    border-radius: 16px;
    padding: 25px;
    margin-top: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

/* =========================
   HEADINGS
========================= */

h1,
h2 {
    background: linear-gradient(
        90deg,
        #ffb300,
        #ff4d8d,
        #8a2be2,
        #2196f3,
        #ffb300
    );

    background-size: 300% 100%;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation: headingSlide 8s linear infinite;
}

@keyframes headingSlide {

    from {
        background-position: 0% 50%;
    }

    to {
        background-position: 300% 50%;
    }
}

/* =========================
   NOTICE
========================= */

.notice {
    background: #fff8e1;
    border-left: 5px solid #ffb300;
    padding: 14px;
    border-radius: 8px;
    line-height: 1.5;
    margin-bottom: 22px;
}

/* =========================
   FORM
========================= */

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 17px;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #d7dce5;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #2196f3;
}

/* =========================
   BUTTON
========================= */

.create-button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #182848;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}

.create-button:hover {
    opacity: 0.9;
}

/* =========================
   MESSAGE
========================= */

.message {
    text-align: center;
    font-weight: bold;
    margin-top: 18px;
    line-height: 1.5;
}

/* =========================
   LOGIN
========================= */

.login-link {
    text-align: center;
    margin-top: 22px;
    font-size: 17px;
}

.login-link a {
    color: #182848;
    font-weight: bold;
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    padding: 25px;
    color: #666;
    font-size: 14px;
}

</style>
</head>


<body>

<!-- =========================
     TOP NAVIGATION
========================= -->

<nav class="top-nav">

    <a
        href="index.html"
        class="home-button">
        🏠 Home
    </a>

</nav>


<!-- =========================
     PAGE HEADER
========================= -->

<header>

    <h1>👤 Create Account</h1>

    <p>
        Join the Reward Platform
    </p>

</header>


<!-- =========================
     PAGE CONTENT
========================= -->

<div class="container">

    <div class="card">

        <h2>📝 Register</h2>

        <div class="notice">

            <strong>Prototype:</strong>
            This registration system is currently
            for testing. Do not enter sensitive
            information or real passwords.

        </div>


        <!-- REGISTRATION FORM -->

        <form
            id="registerForm"
            onsubmit="registerUser(event)">

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required>

            </div>


            <button
                type="submit"
                class="create-button">

                🚀 Create Account

            </button>

        </form>


        <div
            id="message"
            class="message">
        </div>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<footer>

    Reward Platform — Prototype

</footer>


<script>

/* =========================
   REGISTER USER
========================= */

function registerUser(event) {

    event.preventDefault();


    const fullName =
        document.getElementById(
            "fullName"
        ).value.trim();


    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const username =
        document.getElementById(
            "username"
        ).value.trim()
        .toLowerCase();


    const password =
        document.getElementById(
            "password"
        ).value;


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;


    const message =
        document.getElementById(
            "message"
        );


    /* =========================
       VALIDATION
    ========================= */

    if (
        !fullName ||
        !email ||
        !username ||
        !password ||
        !confirmPassword
    ) {

        message.textContent =
            "❌ Please complete all fields.";

        return;

    }


    if (password.length < 6) {

        message.textContent =
            "❌ Password must contain at least 6 characters.";

        return;

    }


    if (password !== confirmPassword) {

        message.textContent =
            "❌ Passwords do not match.";

        return;

    }


    /* =========================
       CHECK EXISTING ACCOUNT
    ========================= */

    const existingUser =
        JSON.parse(
            localStorage.getItem(
                "rewardUser"
            )
        );


    if (
        existingUser &&
        existingUser.username === username
    ) {

        message.textContent =
            "❌ This username is already registered.";

        return;

    }


    /* =========================
       SAVE PROTOTYPE ACCOUNT
    ========================= */

    const user = {

        fullName: fullName,

        email: email,

        username: username,

        password: password,

        registeredAt:
            new Date()
            .toLocaleString()

    };


    localStorage.setItem(
        "rewardUser",
        JSON.stringify(user)
    );


    /* =========================
       INITIAL ACCOUNT STATE
    ========================= */

    if (
        !localStorage.getItem(
            "rewardPoints"
        )
    ) {

        localStorage.setItem(
            "rewardPoints",
            "0"
        );

    }


    /* =========================
       SUCCESS
    ========================= */

    message.textContent =
        "🎉 Account created successfully!";

    
    /*
       Give the browser a moment to
       display the success message,
       then open Earn Points.
    */

    setTimeout(
        function() {

            window.location.href =
                "earn.html";

        },
        800
    );

}

</script>

</body>
</html>
