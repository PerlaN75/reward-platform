<!DOCTYPE html>
<html>
<head>
  <title>Refer & Earn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f3e1a; min-height: 100vh; padding: 20px; color: white; text-align: center; }
    h1 { font-size: 24px; margin-bottom: 10px; }
    
    .referral-box { 
      background: #1a2410; 
      padding: 20px; 
      border-radius: 15px; 
      margin: 20px 0; 
      border: 2px dashed #fbbf24;
    }
    .referral-box h3 { font-size: 18px; color: #fbbf24; margin-bottom: 8px; }
    .referral-box p { font-size: 13px; color: #ccc; margin-bottom: 15px; }
    .referral-box input { 
      width: 90%; 
      padding: 12px; 
      border: 1px solid #444; 
      border-radius: 8px; 
      background: #2f3e1a;
      color: white;
      text-align: center;
      margin-bottom: 15px;
      font-size: 12px;
    }
    .copy-btn {
      width: 60%;
      padding: 12px;
      background: #f59e0b;
      color: #2f3e1a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    .back-btn {
      margin-top: 20px;
      padding: 12px 30px;
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>👥 Refer & Earn</h1>
  <p>Invite friends and both get 100 points!</p>

  <div class="referral-box">
    <h3>🔗 Your Referral Link</h3>
    <p>Share this and both get 100 points!</p>
    <input type="text" id="referralLink" readonly>
    <button class="copy-btn" onclick="copyLink()">Copy Link</button>
  </div>

  <button class="back-btn" onclick="window.location.href='home.html'">Back to Home</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { 
    apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", 
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com", 
    projectId: "reward-platform-rw-2e13d"
  };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app);
  const db = getFirestore(app);
  const referralInput = document.getElementById('referralLink');

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const docSnap = await getDoc(doc(db, "users", user.uid));
      if(docSnap.exists()) {
        const username = docSnap.data().username;
        // THE FIX YOU WANTED
        const referralLink = `https://perlan75.github.io/reward-platform/reg.html?ref=${username}`;
        referralInput.value = referralLink;
      }
    } else {
      window.location.href = "log.html"; 
    }
  });

  window.copyLink = function() {
    referralInput.select();
    document.execCommand("copy");
    alert("Referral link copied!");
  }
</script>
</body>
</html>
