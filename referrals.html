<!DOCTYPE html>
<html>
<head>
  <title>Refer & Earn</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; -webkit-tap-highlight-color:transparent }
    *:focus{outline:none !important}
    body { background: #f3f4f6; min-height: 100vh; padding: 14px 14px 90px 14px; color: #111827; }
    .container { max-width: 500px; margin: 0 auto; }
    .header { display:flex; align-items:center; gap:10px; margin: 14px 0 18px 0; }
    .header h2 { font-size: 22px; font-weight: 900; color: #111827; display: flex; align-items: center; gap: 8px; flex:1 }
    .back-btn-checkin{width:42px;height:38px;border-radius:12px;background:linear-gradient(180deg,#fff5f5,#fecaca);border:2px solid #f87171;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#991b1b;font-weight:900;font-size:22px;cursor:pointer;box-shadow:0 2px 0 #fca5a5;flex-shrink:0}
    .back-btn-checkin:active{transform:scale(0.92)}
    .link-card { background: #ffffff; border: 2px solid #e5e7eb; border-radius: 20px; padding: 18px; margin-bottom: 14px; box-shadow:0 8px 24px rgba(0,0,0,0.06); }
    .link-label { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 900; margin-bottom: 12px; color:#111827 }
    .link-box { background: #f9fafb; border: 1.5px dashed #e5e7eb; border-radius: 12px; padding: 12px; font-size: 12.5px; word-break: break-all; margin-bottom: 14px; color:#111827 }
    .btn-row { display: flex; gap: 10px; }
    .btn { padding: 13px; border: none; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; outline:none }
    .btn-copy { width: 40%; background: #2563eb; color: #fff; box-shadow:0 3px 0 #1d4ed8 }
    .btn-copy:active{transform:translateY(2px);box-shadow:0 1px 0 #1d4ed8}
    .btn-whatsapp { flex: 1; background: #22c55e; color: #fff; box-shadow:0 3px 0 #16a34a }
    .btn-whatsapp:active{transform:translateY(2px);box-shadow:0 1px 0 #16a34a}
    .referrals-card { background: #ffffff; border:2px solid #e5e7eb; border-radius:20px; padding: 18px; box-shadow:0 8px 24px rgba(0,0,0,0.06); }
    .referral-item { display: flex; justify-content: space-between; align-items: center; background: #f9fafb; border:1.5px solid #e5e7eb; padding: 12px; border-radius: 12px; margin-bottom: 8px; font-size: 14px; color:#111827 }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: bold; z-index: 9999; box-shadow:0 8px 24px rgba(0,0,0,0.12); }
    .empty { text-align: center; color: #9ca3af; padding: 16px 0; font-size:13px }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><a href="home.html" class="back-btn-checkin">‹</a><h2>💰 Refer & Earn</h2></div>
    <div class="link-card">
      <div class="link-label">🔗 Your Referral Link</div>
      <div class="link-box" id="referralLink">Loading...</div>
      <div style="font-size:12px;color:#2563eb;margin-bottom:12px;text-align:center;font-weight:700">💎 5 pts per referral • Max 10/day • <span id="countBadge">-- referrals</span></div>
      <div class="btn-row">
        <button class="btn btn-copy" onclick="copyLink()">Copy Link</button>
        <button class="btn btn-whatsapp" onclick="shareWhatsApp()">WhatsApp</button>
      </div>
    </div>

    <div class="referrals-card">
      <div class="link-label">👥 Your Referrals</div>
      <div id="referralsList"><div class="empty">Loading...</div></div>
    </div>
  </div>

<!-- ULTRA INSTANT CACHE -->
<script>
(function(){
  try{
    var c = JSON.parse(localStorage.getItem('userData')||'{}');
    if(c && c.username){
      var link = `https://reward-platform-rw-2e13d.web.app/reg.html?ref=${c.username}`;
      document.getElementById('referralLink').innerText = link;
      window.myLinkInstant = link;
      window.myUsernameInstant = c.username;
    }
    var cachedRefs = JSON.parse(localStorage.getItem('myReferrals')||'null');
    if(cachedRefs){
      document.getElementById('countBadge').innerText = `${cachedRefs.length} referrals`;
      if(cachedRefs.length>0){
        var html='';
        cachedRefs.forEach(function(d){
          html+=`<div class="referral-item"><div><div style="font-weight:bold;">${d.username||'User'}</div><div style="font-size:12px;color:#9ca3af;">${d.joined||'Recently'}</div></div><span style="color:#22c55e; font-weight:bold;">+5 pts</span></div>`;
        });
        document.getElementById('referralsList').innerHTML=html;
      }
    }
  }catch(e){}
})();
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script>
  const firebaseConfig = {apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain: "reward-platform-rw-2e13d.firebaseapp.com",projectId: "reward-platform-rw-2e13d"};
  firebase.initializeApp(firebaseConfig);
  try { firebase.appCheck().activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', true); } catch(e) {}
  const auth = firebase.auth();
  const db = firebase.firestore();
  let myLink = "";
  let myUsername = "";

  function renderReferrals(snapshot){
    const listEl = document.getElementById('referralsList');
    document.getElementById('countBadge').innerText = `${snapshot.size} referrals`;
    if(snapshot.empty){ 
      listEl.innerHTML = '<div class="empty">No referrals yet<br>Share your link to earn 5 pts each!</div>';
      localStorage.setItem('myReferrals', JSON.stringify([]));
      return; 
    }
    let html = '';
    let cacheArr = [];
    snapshot.forEach(doc => {
      const d = doc.data();
      const joined = d.createdAt ? d.createdAt.toDate().toLocaleDateString('en-GB', {day: '2-digit', month: 'short'}) : 'Recently';
      cacheArr.push({username: d.username||'User', joined: joined});
      html += `<div class="referral-item">
        <div><div style="font-weight:bold;">${d.username || 'User'}</div><div style="font-size:12px;color:#9ca3af;">${joined}</div></div>
        <span style="color:#22c55e; font-weight:bold;">+5 pts</span>
      </div>`;
    })
    listEl.innerHTML = html;
    // save for instant next time
    localStorage.setItem('myReferrals', JSON.stringify(cacheArr));
  }

  auth.onAuthStateChanged((user) => {
    if(user){
      // LIVE USER DATA
      db.collection("users").doc(user.uid).onSnapshot(doc=>{
        if(doc.exists){
          const data=doc.data();
          localStorage.setItem('userData', JSON.stringify(data));
          myUsername = data.username || window.myUsernameInstant || user.uid.substring(0,8);
          if(!myUsername) return;
          myLink = `https://reward-platform-rw-2e13d.web.app/reg.html?ref=${myUsername}`;
          document.getElementById('referralLink').innerText = myLink;

          // LIVE REFERRALS - INSTANT FROM FIREBASE
          db.collection("users").where("referredBy", "==", myUsername).onSnapshot(snapshot=>{
            renderReferrals(snapshot);
          });
        }
      });
    } else { window.location.replace('./index.html'); }
  });

  window.copyLink = function(){ 
    const linkToCopy = myLink || window.myLinkInstant || document.getElementById('referralLink').innerText;
    if(!linkToCopy || linkToCopy==='Loading...') return;
    navigator.clipboard.writeText(linkToCopy).then(()=>showToast("Link Copied!")).catch(()=>{ 
      const ta=document.createElement('textarea'); ta.value=linkToCopy; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showToast("Link Copied!"); 
    }); 
  }
  window.shareWhatsApp = function(){ 
    const linkToShare = myLink || window.myLinkInstant || document.getElementById('referralLink').innerText;
    if(!linkToShare || linkToShare==='Loading...') return;
    const msg = `🔥 Join me on Rewards Rwanda and earn money! 💰\n\nUse my link:\n${linkToShare}`; 
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank'); 
  }
  function showToast(msg) { const t=document.createElement('div'); t.className='toast'; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }
</script>
</body>
</html>
