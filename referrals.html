<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade" />
<title>Refer & Earn</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f3ff;min-height:100vh;color:#111827}
.top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;box-shadow:0 4px 12px rgba(109,40,217,0.3)}
.back-btn{width:45px;height:30px;border-radius:10px;background:#ffffff;border:2px solid #fecaca;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#991b1b;font-weight:900;font-size:22px;cursor:pointer;box-shadow:0 2px 0 #fca5a5}
.center-pill{background:#ffffff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.card{background:#ffffff;border:2px solid #ede9fe;border-radius:22px;padding:16px 14px 18px;margin:14px auto;max-width:380px;box-shadow:0 8px 30px rgba(109,40,217,0.08)}
.label{font-weight:900;font-size:13px;color:#4c1d95;margin-bottom:10px}
.linkBox{border:2px dashed #a78bfa;border-radius:12px;padding:12px;font-size:13px;word-break:break-all;background:#f5f3ff;min-height:44px;font-weight:700;color:#111827}
.info{background:#fffbeb;color:#92400e;border:1.5px solid #fbbf24;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900;text-align:center;margin:12px 0}
.btns{display:flex;gap:10px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:900;cursor:pointer;font-size:13px}
.btn-copy{background:linear-gradient(180deg,#dbeafe,#bfdbfe);color:#1e40af;border:2px solid #60a5fa;box-shadow:0 2px 0 #93c5fd}
.btn-wa{background:linear-gradient(180deg,#dcfce7,#bbf7d0);color:#166534;border:2px solid #22c55e;box-shadow:0 2px 0 #86efac}
.refItem{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1.5px solid #ede9fe;border-radius:12px;margin-bottom:8px;background:#f9fafb}
.ad-label{font-size:8px;color:#8b5cf6;text-align:center;letter-spacing:0.8px;font-weight:900;margin:10px 0 4px;text-transform:uppercase}
.ad-box{display:flex;justify-content:center;align-items:center;background:#fff;border:2px solid #ede9fe;border-radius:12px;overflow:hidden;min-height:60px}
</style>
</head>
<body>
<div class="top-bar"><a class="back-btn" href="home.html">‹</a><div class="center-pill">💰 Refer & Earn</div><div style="width:45px"></div></div>
<div class="card">
  <div class="label">🔗 Your Referral Link</div>
  <div class="linkBox" id="link">Loading...</div>
  <div class="info">💎 5 coins per referral • Max 10/day</div>
  <div class="btns"><button class="btn btn-copy" onclick="copy()">Copy</button><button class="btn btn-wa" onclick="shareWA()">WhatsApp</button></div>
  <div class="ad-label">ADVERTISEMENT</div>
  <div id="refBanner" class="ad-box"></div>
</div>
<div class="card"><div class="label">👥 Your Referrals</div><div id="list"><div style="text-align:center;color:#9ca3af;padding:20px;font-size:13px">Loading...</div></div></div>
<script>
function injectBanner(id,key,w,h){
  const c=document.getElementById(id); if(!c) return; c.innerHTML='';
  const s1=document.createElement('script'); s1.text=`atOptions={'key':'${key}','format':'iframe','height':${h},'width':${w},'params':{}};`; c.appendChild(s1);
  const s2=document.createElement('script'); s2.src=`https://bicea.org/22/${key}`; s2.async=true; c.appendChild(s2);
  setTimeout(()=>{ if(!c.querySelector('iframe')){ c.style.display='none'; const l=c.previousElementSibling; if(l&&l.classList.contains('ad-label')) l.style.display='none'; } },3500);
}
setTimeout(()=>injectBanner('refBanner','fe25c5bd01f4bc5e60243e36cd83277c',320,50),800);
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();const db=firebase.firestore();
let refLink="";let username="";
auth.onAuthStateChanged(async(user)=>{
 if(!user){location.href='log.html';return;}
 const doc=await db.collection('users').doc(user.uid).get();if(!doc.exists) return;
 const data=doc.data();username=data.username||user.uid.slice(0,6);refLink=`https://reward-platform-rw-2e13d.web.app/reg.html?ref=${username}`;
 document.getElementById('link').textContent=refLink;loadReferrals(username);
});
async function loadReferrals(uname){
 try{
  const snap=await db.collection('users').where('referredBy','==',uname).get();const list=document.getElementById('list');
  if(snap.empty){list.innerHTML='<div style="text-align:center;color:#9ca3af;padding:20px;font-size:13px">No referrals yet</div>';return;}
  let html='';snap.forEach(d=>{const u=d.data();const name=u.username||'User';const date=u.createdAt?new Date(u.createdAt.toDate?u.createdAt.toDate():u.createdAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):'';html+=`<div class="refItem"><div><div style="font-weight:900;font-size:13px">${name}</div><div style="font-size:11px;color:#9ca3af">${date}</div></div><div style="color:#16a34a;font-weight:900">+5 🪙</div></div>`;});list.innerHTML=html;
 }catch(e){document.getElementById('list').innerHTML='<div style="color:red;padding:10px;font-size:12px">'+e.message+'</div>';}
}
function copy(){if(!refLink)return;navigator.clipboard.writeText(refLink).then(()=>alert('Copied!'));}
function shareWA(){if(!refLink)return;const t=encodeURIComponent(`Join and earn! ${refLink}`);window.open(`https://wa.me/?text=${t}`,'_blank');}
</script>
</body>
</html>
