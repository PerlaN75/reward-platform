<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade" />
<title>Refer & Earn</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f3ff;min-height:100vh;color:#111827}
.top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;box-shadow:0 4px 12px rgba(109,40,217,0.3)}
.back-btn-checkin{width:45px;height:30px;border-radius:10px;background:#fff;border:2px solid #fecaca;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.back-btn-checkin .lines{display:flex;flex-direction:column;gap:3px}
.back-btn-checkin .lines i{display:block;width:18px;height:2.5px;background:#000;border-radius:2px}
.center-pill{background:#ffffff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.card{background:#ffffff;border:2px solid #ede9fe;border-radius:22px;padding:16px 14px 18px;margin:14px auto;max-width:380px;box-shadow:0 8px 30px rgba(109,40,217,0.08)}
.label{font-weight:900;font-size:13px;color:#4c1d95;margin-bottom:10px}
.linkBox{border:2px dashed #a78bfa;border-radius:12px;padding:12px;font-size:13px;word-break:break-all;background:#f5f3ff;min-height:44px;font-weight:700;color:#111827}
.info{background:#fffbeb;color:#92400e;border:1.5px solid #fbbf24;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900;text-align:center;margin:12px 0}
.btns{display:flex;gap:10px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:900;cursor:pointer;font-size:13px}
.btn-copy{background:linear-gradient(180deg,#dbeafe,#bfdbfe);color:#1e40af;border:2px solid #60a5fa;box-shadow:0 2px 0 #93c5fd}
.btn-wa{background:linear-gradient(180deg,#dcfce7,#bbf7d0);color:#166534;border:2px solid #22c55e;box-shadow:0 2px 0 #86efac}
.refItem{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1.5px solid #ede9fe;border-radius:12px;margin-bottom:8px;background:#f9fafb}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#ffffff;color:#4c1d95;padding:14px 20px;border-radius:14px;font-weight:900;font-size:13px;z-index:99999;display:none;border:2px solid #ede9fe;box-shadow:0 8px 24px rgba(109,40,217,0.15);text-align:center;max-width:90%}
/* NEW GATE - SAME DESIGN AS OFFERS */
#adGate{position:fixed;inset:0;background:rgba(17,12,34,0.65);backdrop-filter:blur(8px);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
.gate-box{background:linear-gradient(180deg,#ffffff,#fbf7ff);border:2px solid #fbbf24;border-radius:24px;padding:22px 20px 18px;text-align:center;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(109,40,217,0.35), 0 0 0 6px rgba(251,191,36,0.12);position:relative;overflow:hidden}
.gate-box:before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#fbbf24,#f59e0b,#a78bfa)}
.gate-icon{width:64px;height:64px;margin:0 auto 10px;background:linear-gradient(180deg,#fef3c7,#fbbf24);border:3px solid #f59e0b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 18px rgba(245,158,11,0.3)}
.gate-title{font-weight:900;font-size:18px;color:#4c1d95;letter-spacing:-0.2px}
.gate-sub{font-size:12px;color:#6b7280;margin:8px 0 16px;line-height:1.4;font-weight:600}
.gate-btn{width:100%;height:50px;border-radius:14px;border:2px solid #ede9fe;font-weight:900;font-size:14px;cursor:pointer;transition:0.2s}
.gate-btn.watch{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;box-shadow:0 4px 0 #d97706, 0 8px 20px rgba(245,158,11,0.25);border-color:#f59e0b}
.gate-btn.watch:disabled{background:#f3f4f6;color:#9ca3af;box-shadow:none;border-color:#e5e7eb;cursor:not-allowed}
.gate-btn.continue{background:linear-gradient(180deg,#dcfce7,#22c55e);color:#fff;border-color:#16a34a;box-shadow:0 4px 0 #15803d, 0 8px 20px rgba(34,197,94,0.3);display:none;margin-top:10px}
.gate-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,0.2)}
#gateTimer{font-size:13px;font-weight:900;color:#92400e;margin-top:12px;background:#fffbeb;border:1.5px solid #fde68a;padding:8px 12px;border-radius:999px;display:inline-block;min-width:140px}
</style>
</head>
<body>
<div id="toast"></div>
<div class="top-bar"><a class="back-btn-checkin" href="home.html"><span class="lines"><i></i><i></i><i></i></span></a><div class="center-pill">💰 Refer & Earn</div><div style="width:45px"></div></div>
<div class="card">
  <div class="label">🔗 Your Referral Link</div>
  <div class="linkBox" id="link">Loading...</div>
  <div class="info">💎 5 coins per referral • Max 10/day</div>
  <div class="btns"><button class="btn btn-copy" onclick="copy()">Copy</button><button class="btn btn-wa" onclick="shareWA()">WhatsApp</button></div>
</div>
<div class="card"><div class="label">👥 Your Referrals</div><div id="list"><div style="text-align:center;color:#9ca3af;padding:20px;font-size:13px">Loading...</div></div></div>

<div id="adGate"><div class="gate-box"><div class="gate-icon">💰</div><div id="gateTitle" class="gate-title"></div><div id="gateSub" class="gate-sub"></div><button id="watchAdBtn" class="gate-btn watch"></button><div id="gateTimer"></div><button id="continueBtn" class="gate-btn continue">✅ Continue</button><div style="font-size:9px;color:#9ca3af;margin-top:10px;font-weight:700">Clean & safe ads • Better Ads Standards</div></div></div>

<script>
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',4000);}

// CLEAN VIGNETTE 12269980 - DIFFERENT FROM 12268552 - SAFE
let vignetteLoaded=false;
function loadCleanVignette(){
  if(vignetteLoaded) return;
  vignetteLoaded=true;
  const old=document.querySelector('script[src*="vignette.min.js"]');
  if(old) old.remove();
  (function(s){s.dataset.zone='12269980',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
  setTimeout(()=>{vignetteLoaded=false;}, 3*60*1000);
}

const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();const db=firebase.firestore();
let refLink="";let username="";
let pendingAction=null;

auth.onAuthStateChanged(async(user)=>{
 if(!user){location.href='log.html';return;}
 const doc=await db.collection('users').doc(user.uid).get();if(!doc.exists) return;
 const data=doc.data();username=data.username||user.uid.slice(0,6);refLink=`https://reward-platform-rw-2e13d.web.app/reg.html?ref=${username}`;
 document.getElementById('link').textContent=refLink;loadReferrals(username);
});

async function loadReferrals(uname){
 try{
  const snap=await db.collection('users').where('referredBy','==',uname).get();const list=document.getElementById('list');
  if(snap.empty){list.innerHTML='<div style="text-align:center;color:#9ca3af;padding:20px;font-size:13px">No referrals yet</div>';return;}
  let html='';snap.forEach(d=>{const u=d.data();const name=u.username||'User';const date=u.createdAt?new Date(u.createdAt.toDate?u.createdAt.toDate():u.createdAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):'';html+=`<div class="refItem"><div><div style="font-weight:900;font-size:13px">${name}</div><div style="font-size:11px;color:#9ca3af">${date}</div></div><div style="color:#16a34a;font-weight:900">+5 🪙</div></div>`;});list.innerHTML=html;
 }catch(e){document.getElementById('list').innerHTML='<div style="color:red;padding:10px;font-size:12px">'+e.message+'</div>';}
}

function openGate(action){
  const COOLDOWN=3*60*1000;
  const last=parseInt(localStorage.getItem('ref_'+action+'_last')||'0');
  if(last && (Date.now()-last)<COOLDOWN){
    // Skip ad within 3 min - keep logic alive
    if(action==='copy'){ doCopy(); } else { doShareWA(); }
    return;
  }
  pendingAction=action;
  document.getElementById('adGate').style.display='flex';
  document.getElementById('watchAdBtn').style.display='block';
  document.getElementById('continueBtn').style.display='none';
  document.getElementById('watchAdBtn').disabled=false;
  document.getElementById('gateTimer').innerText='';
  if(action==='copy'){
    document.getElementById('gateTitle').innerText='🔗 Unlock Copy';
    document.getElementById('gateSub').innerText='Watch clean ad 10s to copy your link';
    document.getElementById('watchAdBtn').innerText='▶️ Watch Ad (10s)';
  }else{
    document.getElementById('gateTitle').innerText='💬 Unlock WhatsApp Share';
    document.getElementById('gateSub').innerText='Watch clean ad 10s to share on WhatsApp';
    document.getElementById('watchAdBtn').innerText='▶️ Watch Ad (10s)';
  }
}

document.getElementById('watchAdBtn').onclick=function(){
  this.innerText='⏳ Please wait...';this.disabled=true;
  let sec=10;
  const timerEl=document.getElementById('gateTimer');
  timerEl.innerText='⏳ Wait '+sec+'s...';
  const interval=setInterval(()=>{
    sec--;
    if(sec>0){timerEl.innerText='⏳ Wait '+sec+'s...';}
    else{clearInterval(interval);
      document.getElementById('watchAdBtn').style.display='none';
      timerEl.innerText='✅ Unlocked!';
      document.getElementById('continueBtn').style.display='block';
    }
  },1000);
};

document.getElementById('continueBtn').onclick=function(){
  document.getElementById('adGate').style.display='none';
  if(!pendingAction) return;
  loadCleanVignette();
  localStorage.setItem('ref_'+pendingAction+'_last', String(Date.now()));
  if(pendingAction==='copy'){ doCopy(); } else { doShareWA(); }
  pendingAction=null;
};

function doCopy(){
  if(!refLink) return;
  navigator.clipboard.writeText(refLink).then(()=>showToast('✅ Link copied!')).catch(()=>showToast('✅ '+refLink));
}
function doShareWA(){
  if(!refLink) return;
  const t=encodeURIComponent(`Join and earn! ${refLink}`);
  window.open(`https://wa.me/?text=${t}`,'_blank');
}
function copy(){ openGate('copy'); }
function shareWA(){ openGate('wa'); }
</script>
</body>
</html>
