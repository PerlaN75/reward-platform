<!DOCTYPE html>
<html>
<head>
  <title>Refer & Earn - Reward Platform RW</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
    body{background:#f3f4f6;min-height:100vh;padding:14px 14px 90px 14px;color:#111827}
    .container{max-width:500px;margin:0 auto}
    .header{display:flex;align-items:center;gap:10px;margin:14px 0 18px 0}
    .header h2{font-size:16px!important;font-weight:800!important;flex:1}
    .back-btn{width:45px;height:30px;border-radius:10px;background:#fff;border:2px solid #e5e7eb;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#111827;font-weight:900;font-size:20px}
    .card{background:#fff;border:2px solid #e5e7eb;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,0.05)}
    .label{font-size:12px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .link-box{background:#f9fafb;border:1.5px dashed #cbd5e1;border-radius:10px;padding:11px;font-size:12px;word-break:break-all;margin-bottom:12px;font-weight:600;color:#0f172a}
    .badge{text-align:center;font-size:11px;font-weight:800;background:#eff6ff;color:#1d4ed8;padding:7px;border-radius:10px;border:1px solid #dbeafe;margin-bottom:12px}
    .btn-row{display:flex;gap:8px}
    .btn{padding:12px;border:none;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;flex:1}
    .btn-copy{background:#2563eb;color:#fff}
    .btn-wa{background:#22c55e;color:#fff}
    .referral-item{display:flex;justify-content:space-between;align-items:center;background:#f9fafb;border:1.5px solid #e5e7eb;padding:11px 12px;border-radius:10px;margin-bottom:8px}
    .empty{text-align:center;color:#9ca3af;padding:20px 0;font-size:12.5px;line-height:1.5}
    .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:9999;font-size:12px}
  </style>
</head>
<body>
<div class="container">
  <div class="header"><a href="home.html" class="back-btn">‹</a><h2>💰 Refer & Earn</h2></div>
  
  <div class="card">
    <div class="label">🔗 Your Referral Link</div>
    <div class="link-box" id="referralLink">Loading...</div>
    <div class="badge" id="countBadge">💎 5 coins per referral • Max 10/day • 0 referrals</div>
    <div class="btn-row">
      <button class="btn btn-copy" onclick="copyLink()">Copy</button>
      <button class="btn btn-wa" onclick="shareWhatsApp()">WhatsApp</button>
    </div>
  </div>

  <div class="card">
    <div class="label">👥 Your Referrals</div>
    <div id="referralsList"><div class="empty">Loading referrals...</div></div>
    <div id="err" style="font-size:10px;color:#ef4444;margin-top:6px"></div>
  </div>
</div>

<script>
(function(){
  try{
    var c=JSON.parse(localStorage.getItem('userData')||'{}');
    var uname=c.username||localStorage.getItem('username')||'';
    if(uname){
      var link=`https://reward-platform-rw-2e13d.web.app/reg.html?ref=${encodeURIComponent(uname)}`;
      document.getElementById('referralLink').innerText=link;
      window._uname=uname; window._link=link;
    }
  }catch(e){}
})();
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
let myUsername=window._uname||"", myLink=window._link||"";

function render(snap){
  const list=document.getElementById('referralsList');
  const badge=document.getElementById('countBadge');
  badge.innerText=`💎 5 coins per referral • Max 10/day • ${snap.size} referrals`;
  if(snap.empty){
    list.innerHTML='<div class="empty">No referrals yet<br>Share your link to earn 5 coins each!</div>';
    return;
  }
  let html='';
  snap.forEach(doc=>{
    const d=doc.data();
    const joined=d.createdAt ? d.createdAt.toDate().toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) : 'Recently';
    html+=`<div class="referral-item">
      <div><div style="font-weight:800;font-size:13px">${d.username||'User'}</div><div style="font-size:11px;color:#9ca3af">${joined}</div></div>
      <span style="color:#16a34a;font-weight:800;font-size:13px">+5 🪙</span>
    </div>`;
  });
  list.innerHTML=html;
}

auth.onAuthStateChanged(user=>{
  if(!user){ location.replace('./index.html'); return; }
  db.collection("users").doc(user.uid).onSnapshot(doc=>{
    if(!doc.exists) return;
    const data=doc.data();
    myUsername=data.username||myUsername;
    myLink=`https://reward-platform-rw-2e13d.web.app/reg.html?ref=${encodeURIComponent(myUsername)}`;
    document.getElementById('referralLink').innerText=myLink;
    
    // CLEAN QUERY - 5 coins
    db.collection("users").where("referredBy","==",myUsername)
      .onSnapshot(s=>render(s), e=>{
        document.getElementById('err').innerText=e.message;
        document.getElementById('referralsList').innerHTML=`<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:8px;padding:10px;font-size:11px;color:#991b1b">Permission error: ${e.message}<br>Publish new Firestore Rules</div>`;
      });
  });
});

function copyLink(){
  const l=myLink||document.getElementById('referralLink').innerText;
  if(!l||l==='Loading...')return;
  navigator.clipboard.writeText(l).then(()=>toast("✅ Copied")).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=l; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast("✅ Copied");
  });
}
function shareWhatsApp(){
  const l=myLink||document.getElementById('referralLink').innerText;
  if(!l||l==='Loading...')return;
  window.open(`https://wa.me/?text=${encodeURIComponent(`Earn with me! 💰\n${l}`)}`,'_blank');
}
function toast(m){const t=document.createElement('div');t.className='toast';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
</script>
</body>
</html>
