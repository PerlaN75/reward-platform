<!DOCTYPE html>
<html>
<head>
  <title>Refer & Earn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; background: #1a1a1a; color: white; text-align: center; padding: 20px; margin:0; }
    .box { background: #2d2d1a; border: 2px solid #ffaa00; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; }
    .points { color: #ffaa00; font-weight: bold; }
    .link-box { background: black; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
    .link { color: #ffaa00; font-size: 14px; word-break: break-all; }
    button { background: #3399ff; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1a8cff; }
    input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #555; font-size: 16px; background:#333; color:white; }
    #msg { color:#4caf50; font-weight:bold; }
    .count { color: #4caf50; font-size: 24px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="box">
    <h2>👥 Refer & Earn</h2>
    <p>Earn <span class="points">+50 Points</span> after your friend is active for 48 hours!</p>

    <p><b>Your Referral Link:</b></p>
    <div class="link-box">
      <span id="refLink" class="link">loading...</span>
      <button onclick="copyLink()">Copy</button>
    </div>

    <hr style="border-color:#444;">
    <p>Your Referrals: <span id="refCount" class="count">0</span></p>
    <p id="noRefText">No referrals yet. Share your link!</p>

    <hr style="border-color:#444;">
    <h3>Claim Reward Manually</h3>
    <input id="name" placeholder="Friend's Name" required>
    <input id="phone" placeholder="Friend's Phone Number" required>
    <button onclick="saveData()">Claim Reward</button>
    <p id="msg"></p>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d",
    storageBucket: "reward-platform-rw-2e13d.firebasestorage.app",
    messagingSenderId: "787550951987",
    appId: "1:787550951987:web:724b1463e821b99c90a146"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 1. GET WHO IS LOGGED IN FROM URL ?user=Manzi
  const urlParams = new URLSearchParams(window.location.search);
  const referrer = urlParams.get('user') || "Guest"; 

  // 2. BUILD THEIR UNIQUE REFERRAL LINK
  const myLink = `https://perlan75.github.io/rev/reg.html?ref=${referrer}`;
  document.getElementById('refLink').innerText = myLink;

  // 3. COUNT THEIR REFERRALS FROM FIREBASE
  async function loadReferrals() {
    const q = query(collection(db, "referrals"), where("referrer", "==", referrer));
    const querySnapshot = await getDocs(q);
    const count = querySnapshot.size;
    document.getElementById('refCount').innerText = count;
    if(count > 0) document.getElementById('noRefText').style.display = 'none';
  }
  loadReferrals();

  // 4. COPY BUTTON
  window.copyLink = function() {
    navigator.clipboard.writeText(myLink);
    alert("Referral link copied!");
  }

  // 5. SAVE REFERRAL TO FIREBASE
  window.saveData = async function() {
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    if(!name || !phone){ alert("Please fill both Name and Phone"); return; }
    
    try {
      await addDoc(collection(db, "referrals"), {
        referrer: referrer,  // KEY: Separates Manzi from Amina
        refereeName: name,
        refereePhone: phone,
        createdAt: serverTimestamp()
      });
      document.getElementById('msg').innerText = "Thank you! We got your referral 🎉";
      document.getElementById('name').value = "";
      document.getElementById('phone').value = "";
      loadReferrals(); // refresh count
    } catch(e) {
      alert("Error: " + e.message)
    }
  }
</script>
</body>
</html>
