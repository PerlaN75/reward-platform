<!DOCTYPE html>
<html>
<head>
  <title>Refer & Earn</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f1508; min-height: 100vh; padding: 20px; color: white; }
    .container { max-width: 500px; margin: 0 auto; }
    .header { text-align: center; margin: 20px 0 30px 0; }
    .header h2 { font-size: 28px; font-weight: bold; color: #fbbf24; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .link-card { background: #1a2410; border: 2px solid #fbbf24; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
    .link-label { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: bold; margin-bottom: 12px; }
    .link-box { background: #000; border: 1px dashed #555; border-radius: 10px; padding: 12px; font-size: 13px; word-break: break-all; margin-bottom: 15px; }
    .btn-row { display: flex; gap: 10px; }
    .btn { padding: 14px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
    .btn-copy { width: 40%; background: #fbbf24; color: #000; }
    .btn-whatsapp { flex: 1; background: #22c55e; color: #000; }
    .referrals-card { background: #1a2410; border-radius: 15px; padding: 20px; }
    .referral-item { display: flex; justify-content: space-between; background: #000; padding: 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
    .back-btn { width: 40%; margin: 20px auto 0 auto; display: block; padding: 14px; background: #f59e0b; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 14px 20px; border-radius: 12px; font-weight: bold; z-index: 9999; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
  <div class="container">
    <div class="header"><h2>💰 Refer & Earn</h2></div>

    <div class="link-card">
      <div class="link-label">🔗 Your Referral Link</div>
      <div class="link-box" id="referralLink">Loading...</div>
      <div class="btn-row">
        <button class="btn btn-copy" onclick="copyLink()">Copy Link</button>
        <button class="btn btn-whatsapp" onclick="shareWhatsApp()">WhatsApp</button>
      </div>
    </div>

    <div class="referrals-card">
      <div class="link-label">👥 Your Referrals</div>
      <div id="referralsList" style="color:#aaa; font-size:14px;">Loading...</div>
    </div>

    <button class="back-btn" onclick="window.location.href='./home.html'">Back</button>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
    projectId: "reward-platform-rw-2e13d"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let myLink = "";
  let myUsername = "";
  let loadedReferrals = []; // track to prevent double reward

  auth.onAuthStateChanged(async (user) => {
    if(user){
      const doc = await db.collection("users").doc(user.uid).get();
      if(doc.exists){
        const data = doc.data();
        myUsername = data.username;
        myLink = `https://perlan75.github.io/reward-platform/reg.html?ref=${myUsername}`;
        document.getElementById('referralLink').innerText = myLink;
        loadReferrals(data.username);
      }
    } else {
      window.location.replace('./index.html');
    }
  });

  async function loadReferrals(username) {
    const snapshot = await db.collection("users").where("referredBy", "==", username).get();
    const listEl = document.getElementById('referralsList');
    if(snapshot.empty){
      listEl.innerHTML = 'No referrals yet';
      return;
    }
    let html = '';
    snapshot.forEach(doc => {
      const d = doc.data();
      const refUsername = d.username;
      
      // NEW: Add to history only if this is a new referral
      if(!loadedReferrals.includes(refUsername)){
        loadedReferrals.push(refUsername);
        
        // Call history function from home.html if available
        if(window.opener && window.opener.addReferralHistory) {
          window.opener.addReferralHistory(refUsername); // +50 pts + history
        } else if(window.addReferralHistory) {
          window.addReferralHistory(refUsername); // if same tab
        }
      }

      html += `<div class="referral-item">
        <span>${d.username}</span>
        <span style="color:#22c55e;">+50 pts</span>
      </div>`;
    })
    listEl.innerHTML = html;
  }

  window.copyLink = function(){ navigator.clipboard.writeText(myLink); showToast("Link Copied!"); }
  window.shareWhatsApp = function(){ const msg = `Join me on Rewards and earn points! Use my link: ${myLink}`; window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank'); }
  function showToast(msg) { const toast = document.createElement('div'); toast.className = 'toast'; toast.innerText = msg; document.body.appendChild(toast); setTimeout(() => { toast.remove(); }, 2000); }
</script>
</body>
</html>
