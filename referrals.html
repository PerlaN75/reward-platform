<!DOCTYPE html>
<html>
<head>
  <title>Refer & Earn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #2f5e1a; min-height: 100vh; padding: 20px; color: white; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { 
      font-size: 32px; 
      background: linear-gradient(90deg, #fbbf24, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .header p { color: #d1fae5; font-size: 14px; }
    
    .card { 
      background: rgba(0,0,0,0.2); 
      padding: 20px; 
      border-radius: 20px; 
      margin-bottom: 20px;
    }
    
    /* BALANCE GRADIENT BOX */
    .balance-box { 
      background: linear-gradient(135deg, #fbbf24, #ec4899); 
      padding: 20px; 
      border-radius: 15px; 
      text-align: center; 
      margin-bottom: 15px;
    }
    .balance-box h3 { color: #1a1a1a; font-size: 14px; margin-bottom: 5px; }
    .balance-box h2 { color: #000; font-size: 48px; font-weight: bold; }
    
    /* STATS GRID */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-box { 
      background: rgba(0,0,0,0.3); 
      padding: 15px; 
      border-radius: 12px; 
      text-align: center;
    }
    .stat-box h2 { color: #fbbf24; font-size: 24px; font-weight: bold; }
    .stat-box p { color: #ccc; font-size: 12px; margin-top: 5px; }
    
    /* REFERRAL LINK BOX */
    .link-box { border: 2px dashed #fbbf24; border-radius: 12px; padding: 15px; }
    .link-box h3 { margin-bottom: 12px; font-size: 16px; }
    .link-box input { 
      width: 100%; 
      padding: 12px; 
      border: none; 
      border-radius: 8px; 
      background: #1a2e0f;
      color: #fbbf24;
      text-align: center;
      margin-bottom: 12px;
      font-size: 12px;
      word-break: break-all;
    }
    .copy-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    
    /* PEOPLE REFERRED */
    .referred-list h3 { margin-bottom: 10px; font-size: 16px; }
    .referred-list p { color: #aaa; text-align: center; padding: 20px 0; }
    
    /* BACK BUTTON */
    .back-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(90deg, #fbbf24, #f97316);
      color: #000;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>💰 Refer & Earn</h1>
    <p>Invite friends. Both get 100 points!</p>
  </div>

  <div class="card">
    <div class="balance-box">
      <h3>YOUR BALANCE</h3>
      <h2 id="balance">0</h2>
    </div>
    <div class="stats-grid">
      <div class="stat-box">
        <h2 id="totalReferred">0</h2>
        <p>Total Referred</p>
      </div>
      <div class="stat-box">
        <h2 id="pointsEarned">0</h2>
        <p>Points Earned</p>
      </div>
    </div>
  </div>

  <div class="card link-box">
    <h3>Your Referral Link</h3>
    <input type="text" id="referralLink" readonly>
    <button class="copy-btn" onclick="copyLink()">📋 Copy Link</button>
  </div>

  <div class="card referred-list">
    <h3>People You Referred</h3>
    <p id="referredList">No referrals yet. Share your link!</p>
  </div>

  <button class="back-btn" onclick="window.location.href='home.html'">← Back to Home</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { 
    apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", 
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com", 
    projectId: "reward-platform-rw-2e13d"
  };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app);
  const db = getFirestore(app);

  const balanceEl = document.getElementById('balance');
  const referredEl = document.getElementById('totalReferred');
  const pointsEl = document.getElementById('pointsEarned');
  const referralInput = document.getElementById('referralLink');
  const listEl = document.getElementById('referredList');

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const docSnap = await getDoc(doc(db, "users", user.uid));
      if(docSnap.exists()) {
        const data = docSnap.data();
        const username = data.username;
        
        balanceEl.innerText = data.balance || 0;
        
        // Generate referral link - UPDATE PATH HERE
        const referralLink = `https://perlan75.github.io/reward-platform/reg.html?ref=${username}`;
        referralInput.value = referralLink;
        
        // Get people who referred by this user
        const q = query(collection(db, "users"), where("referredBy", "==", username));
        const querySnapshot = await getDocs(q);
        
        referredEl.innerText = querySnapshot.size;
        pointsEl.innerText = querySnapshot.size * 100; // 100 points per referral
        
        if(querySnapshot.size > 0) {
          let listHTML = "";
          querySnapshot.forEach((doc) => {
            listHTML += `<div style="padding:8px 0; border-bottom:1px solid #333;">${doc.data().username}</div>`;
          });
          listEl.innerHTML = listHTML;
        }
      }
    } else {
      window.location.href = "log.html"; 
    }
  });

  window.copyLink = function() {
    referralInput.select();
    document.execCommand("copy");
    alert("Referral link copied! 🔥");
  }
</script>
</body>
</html>
