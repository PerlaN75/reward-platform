<!DOCTYPE html>
<html>
<head>
  <title>Referrals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    
    body { 
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c1a 0%, #2d5016 25%, #3a6b1f 50%, #2d5016 75%, #1e3c1a 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      padding: 20px;
      color: white;
    }
    
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 36px;
      background: linear-gradient(90deg, #fbbf24, #f59e0b, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .header p { color: #d1fae5; font-size: 15px; }
    
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    .balance-box {
      text-align: center;
      background: linear-gradient(135deg, #fbbf24, #ec4899);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }
    .balance-box .label { font-size: 14px; color: rgba(0,0,0,0.7); font-weight: bold; }
    .balance-box .amount { font-size: 40px; color: black; font-weight: 900; }
    
    .referral-link-box {
      background: rgba(0,0,0,0.4);
      border: 2px dashed #f59e0b;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }
    .referral-link-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fbbf24;
      font-size: 14px;
      text-align: center;
      outline: none;
      margin: 10px 0;
    }
    .copy-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    .copy-btn:hover { transform: scale(1.02); }
    
    .stats {
      display: flex;
      gap: 12px;
      margin: 20px 0;
    }
    .stat-item {
      flex: 1;
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-item .num { font-size: 24px; font-weight: 900; color: #fbbf24; }
    .stat-item .txt { font-size: 12px; color: #ccc; }
    
    .referred-list {
      max-height: 300px;
      overflow-y: auto;
    }
    .referred-item {
      background: rgba(0,0,0,0.25);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .referred-item .name { font-weight: bold; }
    .referred-item .reward { color: #22c55e; font-weight: bold; }
    
    .back-btn { 
      width: 100%;
      padding: 16px; 
      background: linear-gradient(90deg, #f59e0b, #ef4444); 
      color: black; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 16px; 
      font-weight: bold; 
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>💰 Refer & Earn</h1>
    <p>Invite friends. Both get 100 points!</p>
  </div>

  <div class="card">
    <div class="balance-box">
      <div class="label">YOUR BALANCE</div>
      <div class="amount" id="balance">0</div>
    </div>
    
    <div class="stats">
      <div class="stat-item">
        <div class="num" id="totalRef">0</div>
        <div class="txt">Total Referred</div>
      </div>
      <div class="stat-item">
        <div class="num" id="totalEarned">0</div>
        <div class="txt">Points Earned</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom: 12px;">Your Referral Link</h3>
    <div class="referral-link-box">
      <input type="text" id="refLink" readonly>
      <button class="copy-btn" onclick="copyLink()">📋 Copy Link</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom: 15px;">People You Referred</h3>
    <div class="referred-list" id="referredList">
      <p style="text-align:center; color:#888;">Loading...</p>
    </div>
  </div>

  <button class="back-btn" onclick="window.location.href='home.html'">← Back to Home</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { 
    apiKey: "AIzaSyBdvTVt5wGMueeos9Pg5FJf4y7f6lZZbqE", 
    authDomain: "reward-platform-rw-2e13d.firebaseapp.com", 
    projectId: "reward-platform-rw-2e13d" 
  };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentUsername = "";

  onAuthStateChanged(auth, async (user) => {
    if(user){
      currentUser = user;
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if(userDoc.exists()){
        const data = userDoc.data();
        currentUsername = data.username;
        document.getElementById('balance').innerText = data.balance || 0;
        document.getElementById('refLink').value = `${window.location.origin}/reg.html?ref=${currentUsername}`;
        loadReferredUsers(currentUsername);
      }
    } else {
      window.location.href = 'log.html';
    }
  });

  async function loadReferredUsers(username){
    const q = query(collection(db, "users"), where("referredBy", "==", username));
    const snap = await getDocs(q);
    const list = document.getElementById('referredList');
    list.innerHTML = "";
    let count = 0;
    
    if(snap.empty){
      list.innerHTML = "<p style='text-align:center; color:#888;'>No referrals yet. Share your link!</p>";
    } else {
      snap.forEach(docSnap => {
        count++;
        const d = docSnap.data();
        list.innerHTML += `
          <div class="referred-item">
            <div class="name">${d.username}</div>
            <div class="reward">+100 pts</div>
          </div>
        `;
      });
    }
    document.getElementById('totalRef').innerText = count;
    document.getElementById('totalEarned').innerText = count * 100;
  }

  window.copyLink = function(){
    const link = document.getElementById('refLink');
    link.select();
    document.execCommand('copy');
    alert("Referral link copied!");
  }
</script>

</body>
</html>
