<!DOCTYPE html>
<html>
<head>
  <title>Refer & Earn</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; -webkit-tap-highlight-color:transparent }
    *:focus{outline:none !important}
    body { background: #f3f4f6; min-height: 100vh; padding: 14px 14px 90px 14px; color: #111827; }
    .container { max-width: 500px; margin: 0 auto; }
    .header { text-align: center; margin: 14px 0 18px 0; }
    .header h2 { font-size: 24px; font-weight: 900; color: #111827; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .link-card { background: #ffffff; border: 2px solid #e5e7eb; border-radius: 20px; padding: 18px; margin-bottom: 14px; box-shadow:0 8px 24px rgba(0,0,0,0.06); }
    .link-label { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 900; margin-bottom: 12px; color:#111827 }
    .link-box { background: #f9fafb; border: 1.5px dashed #e5e7eb; border-radius: 12px; padding: 12px; font-size: 12.5px; word-break: break-all; margin-bottom: 14px; color:#111827 }
    .btn-row { display: flex; gap: 10px; }
    .btn { padding: 13px; border: none; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; outline:none }
    .btn-copy { width: 40%; background: #2563eb; color: #fff; box-shadow:0 3px 0 #1d4ed8 }
    .btn-copy:active{transform:translateY(2px);box-shadow:0 1px 0 #1d4ed8}
    .btn-whatsapp { flex: 1; background: #22c55e; color: #fff; box-shadow:0 3px 0 #16a34a }
    .btn-whatsapp:active{transform:translateY(2px);box-shadow:0 1px 0 #16a34a}
    .referrals-card { background: #ffffff; border:2px solid #e5e7eb; border-radius:20px; padding: 18px; box-shadow:0 8px 24px rgba(0,0,0,0.06); }
    .referral-item { display: flex; justify-content: space-between; align-items: center; background: #f9fafb; border:1.5px solid #e5e7eb; padding: 12px; border-radius: 12px; margin-bottom: 8px; font-size: 14px; color:#111827 }
    .back-btn { width: 42%; margin: 20px auto 0 auto; display: block; padding: 13px; background: #fff; color: #111827; border: 1.5px solid #e5e7eb; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow:0 2px 0 #e5e7eb }
    .back-btn:active{transform:scale(0.98)}
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: bold; z-index: 9999; box-shadow:0 8px 24px rgba(0,0,0,0.12); }
    .empty { text-align: center; color: #9ca3af; padding: 16px 0; font-size:13px }
    .airtel-card { background: #ffffff; border: 2px solid #e5e7eb; border-radius: 20px; padding: 18px; margin-bottom: 14px; box-shadow:0 8px 24px rgba(0,0,0,0.06); }
    .airtel-title { color: #111827; font-weight: 900; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; margin-bottom: 12px; }
    .airtel-list { color: #6b7280; font-size: 13.5px; line-height: 1.9; }
    .airtel-list b { color: #111827; }
    .airtel-highlight { color: #2563eb !important; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
  <div class="container">
    <div class="header"><h2>💰 Refer & Earn</h2></div>
    <div class="link-card">
      <div class="link-label">🔗 Your Referral Link</div>
      <div class="link-box" id="referralLink">Loading...</div>
      <div style="font-size:12px;color:#2563eb;margin-bottom:12px;text-align:center;font-weight:700">💎 5 pts per referral • Max 10/day • <span id="countBadge">0 referrals</span></div>
      <div class="btn-row">
        <button class="btn btn-copy" onclick="copyLink()">Copy Link</button>
        <button class="btn btn-whatsapp" onclick="shareWhatsApp()">WhatsApp</button>
      </div>
    </div>
    <div class="airtel-card">
      <div class="airtel-title">⚠️ Notice: Airtel Rwanda Users Only</div>
      <div class="airtel-list">
        <div>. Open <b>Play Store</b></div>
        <div>. Install app <b class="airtel-highlight">1.1.1.1 Faster Internet</b></div>
        <div>. Install it</div>
        <div>. <b>Connect</b></div>
        <div>. Open the link above to enjoy earnings ✅</div>
      </div>
    </div>
    <div class="referrals-card">
      <div class="link-label">👥 Your Referrals</div>
      <div id="referralsList"><div class="empty">Loading...</div></div>
    </div>
    <button class="back-btn" onclick="window.location.href='./home.html'">Back</button>
  </div>
<script>
  const firebaseConfig = {apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain: "reward-platform-rw-2e13d.firebaseapp.com",projectId: "reward-platform-rw-2e13d"};
  firebase.initializeApp(firebaseConfig);
  try {
    const appCheck = firebase.appCheck();
    appCheck.activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', true);
  } catch(e) {}
  const auth = firebase.auth();
  const db = firebase.firestore();
  let myLink = "";
  let myUsername = "";
  auth.onAuthStateChanged(async (user) => {
    if(user){
      const doc = await db.collection("users").doc(user.uid).get();
      if(doc.exists){
        myUsername = doc.data().username;
        if(!myUsername){ 
          myUsername = user.uid.substring(0,8);
        }
        myLink = `https://reward-platform-rw-2e13d.web.app/reg.html?ref=${myUsername}`;
        document.getElementById('referralLink').innerText = myLink;
        loadReferrals(myUsername);
      }
    } else { window.location.replace('./index.html'); }
  });
  async function loadReferrals(username) {
    try {
      const snapshot = await db.collection("users").where("referredBy", "==", username).get();
      const listEl = document.getElementById('referralsList');
      document.getElementById('countBadge').innerText = `${snapshot.size} referrals`;
      if(snapshot.empty){ listEl.innerHTML = '<div class="empty">No referrals yet<br>Share your link to earn 5 pts each!</div>'; return; }
      let html = '';
      snapshot.forEach(doc => {
        const d = doc.data();
        const joined = d.createdAt ? d.createdAt.toDate().toLocaleDateString('en-GB', {day: '2-digit', month: 'short'}) : 'Recently';
        html += `<div class="referral-item">
          <div><div style="font-weight:bold;">${d.username || 'User'}</div><div style="font-size:12px;color:#9ca3af;">${joined}</div></div>
          <span style="color:#22c55e; font-weight:bold;">+5 pts</span>
        </div>`;
      })
      listEl.innerHTML = html;
    } catch(e){
      document.getElementById('referralsList').innerHTML = `<div class="empty">Error loading: ${e.message}</div>`;
    }
  }
  window.copyLink = function(){ 
    if(!myLink) return;
    navigator.clipboard.writeText(myLink).then(()=>showToast("Link Copied!")).catch(()=>{ 
      const ta=document.createElement('textarea'); ta.value=myLink; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showToast("Link Copied!"); 
    }); 
  }
  window.shareWhatsApp = function(){ 
    if(!myLink) return;
    const msg = `🔥 Join me on Rewards Rwanda and earn money! 💰\n\nUse my link:\n${myLink}`; 
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank'); 
  }
  function showToast(msg) { const t=document.createElement('div'); t.className='toast'; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }
</script>
</body>
</html>
