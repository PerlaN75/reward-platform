<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Admin Login - Reward Platform</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #182848,
            #3d2075
        );

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

}


/* =====================================================
   LOGIN CONTAINER
===================================================== */

.login-container {

    width: 100%;

    max-width: 430px;

}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card {

    background: white;

    border-radius: 20px;

    padding: 30px 25px;

    box-shadow:
        0 12px 40px
        rgba(0,0,0,0.25);

}


/* =====================================================
   HEADER
===================================================== */

.login-header {

    text-align: center;

    margin-bottom: 25px;

}


.login-icon {

    font-size: 65px;

    margin-bottom: 10px;

}


.login-header h1 {

    margin: 0;

    font-size:
        clamp(28px, 7vw, 38px);

    background:
        linear-gradient(
            90deg,
            #182848,
            #7b2cff,
            #287dff,
            #00a884
        );

    background-size: 300% 100%;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:
        headingSlide 8s linear infinite;

}


.login-header p {

    margin: 10px 0 0;

    color: #777;

    font-size: 15px;

}


@keyframes headingSlide {

    from {

        background-position: 0% 50%;

    }

    to {

        background-position: 300% 50%;

    }

}


/* =====================================================
   FORM GROUP
===================================================== */

.form-group {

    margin-bottom: 18px;

}


.form-group label {

    display: block;

    margin-bottom: 7px;

    color: #182848;

    font-size: 14px;

    font-weight: bold;

}


.form-group input {

    width: 100%;

    padding: 14px;

    border:
        1px solid #d8dce5;

    border-radius: 11px;

    font-size: 16px;

    outline: none;

}


.form-group input:focus {

    border-color: #7b2cff;

    box-shadow:
        0 0 0 3px
        rgba(123,44,255,0.10);

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-button {

    width: 100%;

    border: none;

    border-radius: 12px;

    padding: 15px;

    background:
        linear-gradient(
            90deg,
            #7b2cff,
            #287dff
        );

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

}


.login-button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 6px 16px
        rgba(40,125,255,0.25);

}


.login-button:active {

    transform:
        scale(0.98);

}


/* =====================================================
   MESSAGE
===================================================== */

.message {

    min-height: 22px;

    margin-top: 15px;

    text-align: center;

    font-size: 14px;

    font-weight: bold;

}


.message.error {

    color: #c62828;

}


.message.success {

    color: #168a3a;

}


/* =====================================================
   SECURITY NOTICE
===================================================== */

.security-notice {

    margin-top: 20px;

    padding: 14px;

    background: #f7f8fc;

    border-radius: 11px;

    color: #666;

    font-size: 13px;

    line-height: 1.5;

    text-align: center;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button {

    width: 100%;

    margin-top: 12px;

    padding: 13px;

    border: none;

    border-radius: 11px;

    background: #eeeeee;

    color: #333;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}


.back-button:hover {

    background: #e2e2e2;

}


/* =====================================================
   FOOTER
===================================================== */

.login-footer {

    margin-top: 18px;

    text-align: center;

    color: rgba(255,255,255,0.75);

    font-size: 13px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    body {

        padding: 15px;

    }


    .login-card {

        padding: 25px 18px;

    }


    .login-icon {

        font-size: 55px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN CONTAINER
===================================================== -->

<div class="login-container">


    <!-- =================================================
         LOGIN CARD
    ================================================== -->

    <div class="login-card">


        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="login-header">


            <div class="login-icon">

                🔐

            </div>


            <h1>

                Admin Login

            </h1>


            <p>

                Reward Platform Administration

            </p>

        </div>


        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form
            id="adminLoginForm"
            onsubmit="adminLogin(event)">


            <!-- USERNAME -->

            <div class="form-group">

                <label
                    for="adminUsername">

                    Admin Username

                </label>


                <input
                    type="text"
                    id="adminUsername"
                    autocomplete="username"
                    placeholder="Enter admin username"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label
                    for="adminPassword">

                    Admin Password

                </label>


                <input
                    type="password"
                    id="adminPassword"
                    autocomplete="current-password"
                    placeholder="Enter admin password"
                    required>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button">

                🔓 Login to Admin Panel

            </button>


            <!-- MESSAGE -->

            <div
                id="loginMessage"
                class="message">

            </div>


        </form>


        <!-- =================================================
             SECURITY NOTICE
        ================================================== -->

        <div class="security-notice">

            🔒

            <strong>
                Administrator Access
            </strong>

            <br>

            This area is restricted to authorized
            platform administrators.

        </div>


        <!-- =================================================
             BACK
        ================================================== -->

        <button
            type="button"
            class="back-button"
            onclick="goBack()">

            ← Back to Admin Welcome

        </button>


    </div>


    <!-- =================================================
         FOOTER
    ================================================== -->

    <div class="login-footer">

        Reward Platform — Admin Panel

    </div>


</div>


<script>

/* =====================================================
   ADMIN LOGIN
===================================================== */

function adminLogin(event) {

    event.preventDefault();


    const username =
        document.getElementById(
            "adminUsername"
        ).value.trim();


    const password =
        document.getElementById(
            "adminPassword"
        ).value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    /* =================================================
       CLEAR PREVIOUS MESSAGE
    ================================================== */

    message.textContent = "";

    message.className =
        "message";


    /* =================================================
       ADMIN CREDENTIALS
    ================================================== */

    const ADMIN_USERNAME =
        "admin";


    const ADMIN_PASSWORD =
        "Admin@123";


    /* =================================================
       CHECK LOGIN
    ================================================== */

    if (
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ) {


        /* =============================================
           SAVE ADMIN LOGIN STATUS
        ============================================== */

        localStorage.setItem(
            "adminLoggedIn",
            "true"
        );


        /* =============================================
           CLEAR POSSIBLE OLD ADMIN LOGIN DATA
        ============================================== */

        localStorage.removeItem(
            "adminLoginAttempts"
        );


        localStorage.removeItem(
            "adminBlockedUntil"
        );


        /* =============================================
           SUCCESS MESSAGE
        ============================================== */

        message.textContent =
            "✓ Login successful. Opening Admin Dashboard...";


        message.className =
            "message success";


        /* =============================================
           OPEN ADMIN DASHBOARD
        ============================================== */

        setTimeout(
            function() {

                window.location.href =
                    "admin.html";

            },
            500
        );


        return;

    }


    /* =================================================
       INVALID LOGIN
    ================================================== */

    message.textContent =
        "✕ Invalid administrator username or password.";


    message.className =
        "message error";


    document.getElementById(
        "adminPassword"
    ).value = "";


}


/* =====================================================
   BACK TO ADMIN WELCOME
===================================================== */

function goBack() {

    window.location.href =
        "admin-welcome.html";

}


/* =====================================================
   ALLOW ENTER KEY
===================================================== */

document
    .getElementById("adminPassword")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                document
                    .getElementById(
                        "adminLoginForm"
                    )
                    .requestSubmit();

            }

        }
    );

</script>


</body>

</html>
