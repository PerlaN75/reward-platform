<!DOCTYPE html>
<html>
<head>
<title>Offers - Coins</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade" />
<meta name="monetag" content="b671b8351bfc48ed0161f6bd0b6a5340">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f3ff;min-height:100vh;color:#111827}
.top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;box-shadow:0 4px 12px rgba(109,40,217,0.3)}
.back-btn{width:45px;height:30px;border-radius:10px;background:#ffffff;border:2px solid #fecaca;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#991b1b;font-weight:900;font-size:22px;cursor:pointer;box-shadow:0 2px 0 #fca5a5}
.center-pill{background:#ffffff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.container{max-width:500px;margin:0 auto;padding:14px 14px 90px}
.balance-card{background:linear-gradient(180deg,#1a2e0a,#12230a);border:2px solid #fbbf24;border-radius:18px;padding:14px;display:flex;justify-content:space-around;text-align:center;color:#fff;box-shadow:0 8px 24px rgba(251,191,36,0.18)}
.balance-card b{color:#fbbf24;font-size:18px}.usdt{color:#22f59b;font-weight:900;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{background:#ffffff;border:2px solid #ede9fe;border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(109,40,217,0.06);transition:0.2s}
.card:active{transform:scale(0.97)}
.card.free{border-color:#22c55e}.card.coins{border-color:#ede9fe}
.emoji{font-size:28px}.name{font-weight:900;font-size:12px;color:#111827}.sub{font-size:10px;color:#6b7280;margin-top:2px}
.badge{display:inline-block;margin-top:6px;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900;border:1.5px solid}
.badge.free{background:#dcfce7;color:#166534;border-color:#86efac}.badge.coins{background:#fef3c7;color:#92400e;border-color:#fbbf24}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#ffffff;color:#4c1d95;padding:14px 20px;border-radius:14px;font-weight:900;font-size:13px;z-index:99999;display:none;border:2px solid #ede9fe;box-shadow:0 8px 24px rgba(109,40,217,0.15);text-align:center;max-width:90%}
#adGate{position:fixed;inset:0;background:rgba(76,29,149,0.55);backdrop-filter:blur(3px);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
.gate-box{background:#ffffff;border:2px solid #ede9fe;border-radius:20px;padding:20px;text-align:center;max-width:340px;width:100%;box-shadow:0 12px 32px rgba(109,40,217,0.2)}
.gate-title{font-weight:900;font-size:16px;color:#4c1d95}.gate-sub{font-size:12px;color:#6b7280;margin:8px 0 14px}
.gate-btn{width:100%;height:48px;border-radius:12px;border:2px solid #ede9fe;font-weight:900;font-size:14px;cursor:pointer}
.gate-btn.watch{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;box-shadow:0 3px 0 #d97706;border-color:#f59e0b}.gate-btn.continue{background:linear-gradient(180deg,#dcfce7,#bbf7d0);color:#166534;border-color:#22c55e;display:none;margin-top:10px}
#gateTimer{font-size:12px;font-weight:900;color:#ea580c;margin-top:8px}
</style>
</head>
<body>
<div id="toast"></div>
<div class="top-bar"><a href="home.html" class="back-btn">‹</a><div class="center-pill">💎 Offers</div><div style="width:45px"></div></div>
<div class="container">
<div class="balance-card"><div><b id="balCoins">0 coins</b><div style="font-size:10px;color:#9ca3af">≈ $<span id="balUsd">0</span></div></div><div style="width:1px;background:#2a3a1a"></div><div><div class="usdt" id="balUsdt">0 USDT</div><div style="font-size:10px;color:#9ca3af">Withdrawable</div></div></div>
<div class="grid" id="grid"></div>
</div>
<div id="adGate"><div class="gate-box"><div id="gateTitle" class="gate-title"></div><div id="gateSub" class="gate-sub"></div><button id="watchAdBtn" class="gate-btn watch"></button><div id="gateTimer"></div><button id="continueBtn" class="gate-btn continue">✅ Continue</button></div></div>
<script>
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',5000);}
function loadMonetagTag(zone, src){const s=document.createElement('script');s.dataset.zone=zone;s.src=src;document.body.appendChild(s);}
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try{firebase.appCheck().activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);}catch(e){}
const auth=firebase.auth(), db=firebase.firestore();
let cachedUser=null;
const OFFERS=[
  {id:'bnb_faucet', emoji:'💧', name:'BNB Faucet', sub:'FREE BNB hourly', link:'https://bnbpick.io/?ref=SilasN75', type:'free'},
  {id:'telegram_join', emoji:'✈️', name:'Telegram', sub:'Daily bonus', link:'https://t.me/formrw_earning', type:'free'},
  {id:'play_game', emoji:'🎮', name:'Play Game', sub:'Games upload soon', link:'', type:'play'},
  {id:'install_app', emoji:'📲', name:'Install App', sub:'Apps available soon', link:'', type:'install'},
];
function renderInstant(){
  const grid=document.getElementById('grid');grid.innerHTML='';
  OFFERS.forEach(o=>{
    const isFree=o.type==='free';const badge=isFree?'FREE LINK':'SOON';const cls=isFree?'free':'coins';
    grid.innerHTML+='<div class="card '+cls+'" onclick="clickOffer(\''+o.id+'\')"><div class="emoji">'+o.emoji+'</div><div class="name">'+o.name+'</div><div class="sub">'+o.sub+'</div><div class="badge '+cls+'">'+badge+'</div></div>';
  });
}
let pendingOffer=null;
function clickOffer(id){
  const o=OFFERS.find(x=>x.id===id);if(!cachedUser||!o) return;
  if(o.type==='free'){window.open(o.link,'_blank');return;}
  pendingOffer=o;
  document.getElementById('adGate').style.display='flex';
  document.getElementById('watchAdBtn').style.display='block';
  document.getElementById('continueBtn').style.display='none';
  document.getElementById('watchAdBtn').disabled=false;
  document.getElementById('gateTimer').innerText='';
  if(o.type==='play'){
    document.getElementById('gateTitle').innerText='🔓 Unlock Play Game';
    document.getElementById('gateSub').innerText='Watch ad 10s to unlock';
    document.getElementById('watchAdBtn').innerText='▶️ Watch Ad (10s)';
    loadMonetagTag('12211617','https://n6wxm.com/vignette.min.js');
    loadMonetagTag('12211613','https://al5sm.com/tag.min.js');
  }else if(o.type==='install'){
    document.getElementById('gateTitle').innerText='🔓 Unlock Install App';
    document.getElementById('gateSub').innerText='Watch ad 10s to unlock';
    document.getElementById('watchAdBtn').innerText='▶️ Watch Ad (10s)';
    loadMonetagTag('12211617','https://n6wxm.com/vignette.min.js');
    loadMonetagTag('12083693','https://al5sm.com/tag.min.js');
  }
}
document.getElementById('watchAdBtn').onclick=function(){
  this.innerText='⏳ Please wait...';this.disabled=true;
  let sec=10;
  const timerEl=document.getElementById('gateTimer');
  timerEl.innerText='⏳ Wait '+sec+'s... - ads loading';
  const interval=setInterval(()=>{
    sec--;
    if(sec>0){timerEl.innerText='⏳ Wait '+sec+'s... - ads loading';}
    else{clearInterval(interval);
      document.getElementById('watchAdBtn').style.display='none';
      timerEl.innerText='✅ Unlocked!';
      document.getElementById('continueBtn').style.display='block';
    }
  },1000);
};
document.getElementById('continueBtn').onclick=function(){
  document.getElementById('adGate').style.display='none';
  if(!pendingOffer) return;
  const o=pendingOffer;
  if(o.type==='play'){showToast('🎮 Games upload soon!');}
  else{showToast('📲 Apps available soon!');}
  pendingOffer=null;
};
function loadBalance(){
  const c=JSON.parse(localStorage.getItem('userData')||'{}');
  document.getElementById('balCoins').innerText=(c.balance??c.coins??0)+' coins';
  document.getElementById('balUsd').innerText=((c.balance??0)*0.0005).toFixed(4);
  document.getElementById('balUsdt').innerText=Number(c.usdtBalance||0).toFixed(4)+' USDT';
  if(cachedUser) db.collection('users').doc(cachedUser.uid).onSnapshot(s=>{
    if(!s.exists) return;const d=s.data();localStorage.setItem('userData',JSON.stringify({...d,uid:s.id}));
    document.getElementById('balCoins').innerText=(d.balance||d.coins||0)+' coins';
    document.getElementById('balUsd').innerText=((d.balance||0)*0.0005).toFixed(4);
    document.getElementById('balUsdt').innerText=Number(d.usdtBalance||0).toFixed(4)+' USDT';
  });
}
renderInstant();
auth.onAuthStateChanged(u=>{if(!u){location.href='index.html';return;}cachedUser=u;renderInstant();loadBalance();});
</script>
</body>
</html>
