<!DOCTYPE html>
<html>
<head>
<title>Offers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5;min-height:100vh}
.top-bar{background:#fff;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:2px solid #f1f5f9;position:sticky;top:0;z-index:10}
.back-btn{width:42px;height:38px;border-radius:10px;background:linear-gradient(180deg,#fef2f2,#ffe4e6);border:2px solid #ef4444;display:flex;align-items:center;justify-content:center;color:#991b1b;font-weight:900;font-size:22px;text-decoration:none}
.center-pill{background:#f8fafc;border:2px solid #e5e7eb;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px}
.container{max-width:500px;margin:0 auto;padding:14px 14px 90px}
.balance-card{background:#12230a;border:2px solid #fbbf24;border-radius:18px;padding:14px;display:flex;justify-content:space-around;text-align:center;color:#fff}
.balance-card b{color:#fbbf24;font-size:18px}.usdt{color:#22f59b;font-weight:900;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card:active{transform:scale(0.97);border-color:#fbbf24}
.emoji{font-size:28px;margin-bottom:6px}
.name{font-weight:900;font-size:12px;color:#111827}
.sub{font-size:10px;color:#6b7280;margin-top:3px}
.badge{display:inline-block;margin-top:6px;background:#fffbeb;border:1.5px solid #fde68a;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900;color:#92400e}
</style>
</head>
<body>
<div class="top-bar">
<a href="home.html" class="back-btn">‹</a>
<div class="center-pill">💎 Offers</div>
<div style="width:42px"></div>
</div>
<div class="container">
<div class="balance-card">
<div><b id="balCoins">0 coins</b><div style="font-size:10px;color:#9ca3af">≈ $<span id="balUsd">0</span></div></div>
<div style="width:1px;background:#2a3a1a"></div>
<div><div class="usdt" id="balUsdt">0 USDT</div><div style="font-size:10px;color:#9ca3af">Withdrawable</div></div>
</div>

<div class="grid" id="grid"></div>
<div style="font-size:11px;color:#9ca3af;text-align:center;margin-top:16px">Postback-ready • Resets daily • Tap to open</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
let cachedUser=null;

const MY_BNB = "https://bnbpick.io/?ref=SilasN75";

// POSTBACK-READY OFFERS YOU ASKED - No prices, only coins
const OFFERS=[
  {id:'bnb_faucet', emoji:'💧', name:'BNB Faucet', sub:'Gold Level', coins:100, link:MY_BNB, postback:true},
  {id:'install_game', emoji:'🎮', name:'Play Game', sub:'Play & Earn', coins:150, link:'https://play.google.com/store', postback:true},
  {id:'daily_survey', emoji:'📝', name:'Daily Survey', sub:'30 Sec', coins:120, link:'#', postback:true},
  {id:'telegram_join', emoji:'✈️', name:'Telegram', sub:'Join Channel', coins:80, link:'https://t.me', postback:false},
  {id:'install_app', emoji:'📲', name:'Install App', sub:'Install & Open', coins:150, link:'https://play.google.com', postback:true},
  {id:'invite_friend', emoji:'👥', name:'Invite Friend', sub:'Share Link', coins:200, link:'home.html', postback:false},
];

function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const today=new Date().toISOString().split('T')[0];
  OFFERS.forEach(o=>{
    const done=localStorage.getItem(`offer_done_${o.id}_${cachedUser?.uid}`)===today;
    grid.innerHTML+=`
    <div class="card" style="${done?'opacity:0.6':''}" onclick="clickOffer('${o.id}',${o.coins},'${o.link}',${o.postback})">
      <div class="emoji">${o.emoji}</div>
      <div class="name">${o.name}</div>
      <div class="sub">${o.sub}</div>
      <div class="badge">${done?'✓ Done Today':'+'+o.coins+' 🪙'}</div>
    </div>`;
  });
}

async function clickOffer(offerId, coins, link, isPostback){
  const user=auth.currentUser||cachedUser; if(!user) return;
  const today=new Date().toISOString().split('T')[0];
  const doneKey=`offer_done_${offerId}_${user.uid}`;
  if(localStorage.getItem(doneKey)===today){ alert('Already claimed today. Tomorrow resets!'); return; }

  const subid=`${user.uid}_${offerId}_${Date.now()}`;
  const clickRef=db.collection('users').doc(user.uid).collection('offerClicks').doc(subid);

  // 1. Create pending click (postback-ready)
  await clickRef.set({offerId, subid, coins, status:'pending', postback:isPostback, createdAt:firebase.firestore.FieldValue.serverTimestamp()});

  if(link && link!=='#' ) window.open(link,'_blank');

  // NOW MODE (no Visa): instant pay. LATER: if postback=true, keep pending until postback.html called by network
  const forceInstant = true; // set false when you have Visa + real postback

  if(forceInstant || !isPostback){
    try{
      const userRef=db.collection('users').doc(user.uid);
      await db.runTransaction(async t=>{
        const d=await t.get(userRef);
        t.update(userRef,{balance:(d.data().balance||0)+coins});
        t.update(clickRef,{status:'completed', completedAt:firebase.firestore.FieldValue.serverTimestamp()});
        t.set(userRef.collection('earnHistory').doc(),{action:'Offers', desc:offerId, coins, timestamp:firebase.firestore.FieldValue.serverTimestamp()});
      });
      localStorage.setItem(doneKey, today);
      render(); loadBalance();
    }catch(e){ alert(e.message); }
  } else {
    alert('Offer pending - coins will come after completion (postback)');
  }
}

function loadBalance(){
  const c=JSON.parse(localStorage.getItem('userData')||'{}');
  const coins=c.balance??0, usdt=c.usdtBalance??0;
  document.getElementById('balCoins').innerText=coins+' coins';
  document.getElementById('balUsd').innerText=(coins*0.0005).toFixed(4);
  document.getElementById('balUsdt').innerText=Number(usdt).toFixed(4)+' USDT';
  if(cachedUser) db.collection('users').doc(cachedUser.uid).onSnapshot(s=>{
    if(!s.exists) return;
    const d=s.data(); localStorage.setItem('userData', JSON.stringify({...d,uid:s.id}));
    document.getElementById('balCoins').innerText=(d.balance||0)+' coins';
    document.getElementById('balUsd').innerText=((d.balance||0)*0.0005).toFixed(4);
    document.getElementById('balUsdt').innerText=Number(d.usdtBalance||0).toFixed(4)+' USDT';
  });
}
auth.onAuthStateChanged(u=>{ if(!u){location.href='index.html';return;} cachedUser=u; loadBalance(); render(); });
</script>
</body>
</html>
