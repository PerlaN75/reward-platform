<!DOCTYPE html>
<html>
<head>
<title>Offers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="monetag" content="b671b8351bfc48ed0161f6bd0b6a5340">
<script src="https://quge5.com/88/tag.min.js" data-zone="286869" async data-cfasync="false"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5;min-height:100vh}
.top-bar{background:#fff;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:2px solid #f1f5f9;position:sticky;top:0;z-index:10}
.back-btn{width:45px;height:30px;border-radius:10px;background:linear-gradient(180deg,#fef2f2,#ffe4e6);border:2px solid #ef4444;display:flex;align-items:center;justify-content:center;color:#991b1b;font-weight:900;font-size:22px;text-decoration:none}
.center-pill{background:#f8fafc;border:2px solid #e5e7eb;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px}
.container{max-width:500px;margin:0 auto;padding:14px 14px 90px}
.balance-card{background:#12230a;border:2px solid #fbbf24;border-radius:18px;padding:14px;display:flex;justify-content:space-around;text-align:center;color:#fff}
.balance-card b{color:#fbbf24;font-size:18px}.usdt{color:#22f59b;font-weight:900;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.06);position:relative}
.card.free{border-color:#22c55e}
.emoji{font-size:28px;margin-bottom:6px}.name{font-weight:900;font-size:12px}.sub{font-size:10px;color:#6b7280}.badge{display:inline-block;margin-top:6px;background:#fffbeb;border:1.5px solid #fde68a;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900;color:#92400e}
.badge.free{background:#dcfce7;border-color:#86efac;color:#166534}
.badge.coins{background:#fef08a}
.sponsored{font-size:9px;color:#a8a29e;margin:10px 0 4px;text-align:center;font-weight:900;letter-spacing:1px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111827;color:#facc15;padding:12px 20px;border-radius:99px;font-weight:900;z-index:9999;display:none;border:2px solid #facc15}
</style>
</head>
<body>
<div id="toast"></div>
<div class="top-bar">
<a href="home.html" class="back-btn">‹</a>
<div class="center-pill">💎 Offers</div>
<div style="width:42px"></div>
</div>
<div class="container">
<div class="balance-card">
<div><b id="balCoins">0 coins</b><div style="font-size:10px;color:#9ca3af">≈ $<span id="balUsd">0</span></div></div>
<div style="width:1px;background:#2a3a1a"></div>
<div><div class="usdt" id="balUsdt">0 USDT</div><div style="font-size:10px;color:#9ca3af">Withdrawable</div></div>
</div>

<div class="sponsored">ADVERTISEMENT</div>
<div id="topBanner" style="display:flex;justify-content:center;min-height:62px;margin:6px 0"></div>

<div class="grid" id="grid"></div>

<div id="midBannerWrap" style="display:none"><div class="sponsored">SPONSORED</div><div id="midBanner" style="display:flex;justify-content:center;min-height:262px;margin:6px 0"></div></div>
</div>

<script>
function canShowVignette(){const l=localStorage.getItem('vignette_last');return !l||(Date.now()-parseInt(l))>1800000;}
function canShowPop(){const l=localStorage.getItem('pop_last');return !l||(Date.now()-parseInt(l))>3600000;}
function loadVignette(){if(!canShowVignette())return false;var s=document.createElement('script');s.dataset.zone='12083688';s.src='https://n6wxm.com/vignette.min.js';document.body.appendChild(s);localStorage.setItem('vignette_last',Date.now().toString());return true;}
function loadPop(){if(!canShowPop())return false;var s=document.createElement('script');s.dataset.zone='12083693';s.src='https://al5sm.com/tag.min.js';document.body.appendChild(s);localStorage.setItem('pop_last',Date.now().toString());return true;}
function injectBanner(id,key,w,h){const c=document.getElementById(id);if(!c)return;c.innerHTML='';const at=document.createElement('script');at.innerHTML=`atOptions={'key':'${key}','format':'iframe','height':${h},'width':${w},'params':{}};`;c.appendChild(at);const s=document.createElement('script');s.src=`https://bicea.org/22/${key}`;c.appendChild(s);}
function loadAllBanners(){injectBanner('topBanner','fe25c5bd01f4bc5e60243e36cd83277c',60,468);injectBanner('midBanner','bf10cacdbe9f50d0c5d66a94e0785f29',250,300);document.getElementById('midBannerWrap').style.display='block';}
loadAllBanners(); setInterval(()=>{loadAllBanners();},40000);
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}

const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try{const appCheck=firebase.appCheck();appCheck.activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);}catch(e){}
const auth=firebase.auth(), db=firebase.firestore();
let cachedUser=null;

const OFFERS=[
  {id:'bnb_faucet', emoji:'💧', name:'BNB Faucet', sub:'Free faucet link', coins:0, link:'https://bnbpick.io/?ref=SilasN75', type:'free'},
  {id:'telegram_join', emoji:'✈️', name:'Telegram', sub:'Join Channel', coins:0, link:'https://t.me/formrw_earning', type:'free'},
  {id:'play_game', emoji:'🎮', name:'Play Game', sub:'Play 2 min', coins:25, link:'https://your-game-offer-link.com', type:'coins'},
  {id:'install_app', emoji:'📲', name:'Install App', sub:'Install + open', coins:20, link:'https://your-app-offer-link.com', type:'coins'},
];

function renderInstant(){
  const grid=document.getElementById('grid');
  if(!grid) return;
  grid.innerHTML='';
  OFFERS.forEach(o=>{
    const isFree=o.coins===0;
    const badgeClass=isFree?'free':'coins';
    const badgeText=isFree?'FREE LINK':' +'+o.coins+' 🪙';
    grid.innerHTML+=`<div class="card ${isFree?'free':''}" onclick="clickOffer('${o.id}')"><div class="emoji">${o.emoji}</div><div class="name">${o.name}</div><div class="sub">${o.sub}</div><div class="badge ${badgeClass}">${badgeText}</div></div>`;
  });
}

function clickOffer(id){
  const o=OFFERS.find(x=>x.id===id);
  if(!cachedUser) return;
  // FREE LINKS - open immediately, no coins
  if(o.type==='free'){
    window.open(o.link,'_blank');
    return;
  }
  // COINS OFFERS - Install games + Play games
  doCoinsOffer(o);
}

async function doCoinsOffer(o){
  const user=auth.currentUser||cachedUser;
  const uid=user.uid;
  // check if already claimed this game/app today
  const today=new Date().toISOString().split('T')[0];
  const claimKey=`claimed_${uid}_${o.id}_${today}`;
  if(localStorage.getItem(claimKey)){
    showToast('Already claimed today, come tomorrow');
    window.open(o.link,'_blank');
    return;
  }
  // open offer link immediately
  window.open(o.link,'_blank');
  loadVignette();
  try{
    const subid=`${uid}_${o.id}_${Date.now()}`;
    const clickRef=db.collection('users').doc(uid).collection('offerClicks').doc(subid);
    await db.runTransaction(async t=>{
      const snap=await t.get(db.collection('users').doc(uid));
      if(!snap.exists) throw "no user";
      t.set(clickRef,{offerId:o.id, coins:o.coins, status:'waiting_postback', createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      // coins will be added after postback verification, for now we give instant for testing - remove if you want postback only
      t.set(db.collection('users').doc(uid),{
        balance: firebase.firestore.FieldValue.increment(o.coins),
        coins: firebase.firestore.FieldValue.increment(o.coins),
        points: firebase.firestore.FieldValue.increment(o.coins),
        lastEarnAt: firebase.firestore.FieldValue.serverTimestamp()
      },{merge:true});
      t.set(db.collection('users').doc(uid).collection('earnHistory').doc(),{action:'Offers - '+o.id, desc:o.name+' +'+o.coins, coins:o.coins, points:o.coins, timestamp:firebase.firestore.FieldValue.serverTimestamp()});
      t.set(db.collection('users').doc(uid).collection('claimed').doc(o.id+'_'+today),{uid:uid, offerId:o.id, coins:o.coins, status:'approved', createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
    localStorage.setItem(claimKey,'1');
    loadBalance(); showToast(`✓ +${o.coins} 🪙 from ${o.name}!`); loadPop();
  }catch(e){ showToast(e.message); }
}

function loadBalance(){
  const c=JSON.parse(localStorage.getItem('userData')||'{}');
  document.getElementById('balCoins').innerText=(c.balance??c.coins??0)+' coins';
  document.getElementById('balUsd').innerText=((c.balance??0)*0.0005).toFixed(4);
  document.getElementById('balUsdt').innerText=Number(c.usdtBalance||0).toFixed(4)+' USDT';
  if(cachedUser) db.collection('users').doc(cachedUser.uid).onSnapshot(s=>{
    if(!s.exists) return;
    const d=s.data(); localStorage.setItem('userData', JSON.stringify({...d,uid:s.id}));
    document.getElementById('balCoins').innerText=(d.balance||d.coins||0)+' coins';
    document.getElementById('balUsd').innerText=((d.balance||0)*0.0005).toFixed(4);
    document.getElementById('balUsdt').innerText=Number(d.usdtBalance||0).toFixed(4)+' USDT';
  });
}

renderInstant();
auth.onAuthStateChanged(u=>{ if(!u){location.href='index.html';return;} cachedUser=u; renderInstant(); loadBalance(); });
</script>
</body>
</html>
