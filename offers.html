<!DOCTYPE html>
<html>
<head>
<title>Offers - Postback Ready</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff;min-height:100vh}
.top-bar{background:#fff;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:2px solid #f1f5f9;position:sticky;top:0;z-index:10}
.back-btn{width:42px;height:38px;border-radius:10px;background:linear-gradient(180deg,#fef2f2,#ffe4e6);border:2px solid #ef4444;display:flex;align-items:center;justify-content:center;color:#991b1b;font-weight:900;font-size:22px;text-decoration:none}
.center-pill{background:#f8fafc;border:2px solid #e5e7eb;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px}
.container{max-width:500px;margin:0 auto;padding:14px 14px 90px}
.balance-card{background:#12230a;border:2px solid #fbbf24;border-radius:18px;padding:14px;display:flex;justify-content:space-around;text-align:center;color:#fff}
.balance-card b{color:#fbbf24;font-size:18px}.usdt{color:#22f59b;font-weight:900;font-size:18px}
.offer{background:#fff;border:2px solid #f1f5f9;border-radius:16px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,0.05)}
.offer-left{display:flex;gap:12px;align-items:center}
.offer-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#fffbeb;border:2px solid #fde68a}
.offer-title{font-weight:900;font-size:13px}.offer-desc{font-size:11px;color:#6b7280;margin-top:2px}
.offer-right{text-align:right}
.reward{font-weight:900;font-size:12px;color:#92400e;background:#fffbeb;border:1.5px solid #fde68a;border-radius:999px;padding:4px 8px;display:inline-block;margin-bottom:6px}
.btn{border:none;border-radius:10px;padding:9px 14px;font-weight:900;font-size:12px;cursor:pointer;background:linear-gradient(90deg,#fbbf24,#f59e0b);box-shadow:0 3px 0 #d97706}
.btn:disabled{background:#f3f4f6;color:#9ca3af;box-shadow:none}
.status{font-size:10px;color:#16a34a;font-weight:800;margin-top:4px}
</style>
</head>
<body>
<div class="top-bar">
<a href="home.html" class="back-btn">‹</a>
<div class="center-pill">💎 Offers - Postback Ready</div>
<div style="width:42px"></div>
</div>
<div class="container">
<div class="balance-card">
<div><b id="balCoins">0 coins</b><div style="font-size:10px;color:#9ca3af">≈ $<span id="balUsd">0</span></div></div>
<div style="width:1px;background:#2a3a1a"></div>
<div><div class="usdt" id="balUsdt">0 USDT</div><div style="font-size:10px;color:#9ca3af">Withdrawable</div></div>
</div>
<div id="offersList" style="margin-top:16px"></div>
<div style="font-size:11px;color:#9ca3af;text-align:center;margin-top:12px">Postback Status: <span id="pbStatus">Instant Pay (No Card) - Ready to switch</span></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
let cachedUser=null;

// CONFIG - You can edit coins here, later from Firebase appConfig/offers
const OFFERS=[
  {id:'offer_install_1', title:'Install TikTok Lite', desc:'Install & open', coins:150, icon:'📲', link:'https://play.google.com/store/apps/details?id=com.zhiliaoapp.musically.go', payout:'$0.40', postback:false},
  {id:'offer_survey_1', title:'Quick Survey - 2 min', desc:'Answer 3 questions', coins:120, icon:'📝', link:'#', payout:'$0.30', postback:false},
  {id:'offer_telegram', title:'Join Telegram Channel', desc:'Join & stay', coins:80, icon:'✈️', link:'https://t.me', payout:'$0.15', postback:false},
  {id:'offer_cpa_1', title:'CPA Offer - Game', desc:'Install game & reach Lvl 5', coins:300, icon:'🎮', link:'https://example.com/cpa?subid={SUBID}', payout:'$1.20', postback:true}, // This one will use postback later
];

function render(){
  const list=document.getElementById('offersList');
  list.innerHTML='';
  OFFERS.forEach(o=>{
    const subid=cachedUser?`${cachedUser.uid}_${o.id}_${Date.now()}`:'';
    const doneKey=`offer_done_${o.id}_${cachedUser?.uid}`;
    const isDone=localStorage.getItem(doneKey)===new Date().toDateString();
    list.innerHTML+=`
    <div class="offer">
      <div class="offer-left">
        <div class="offer-icon">${o.icon}</div>
        <div><div class="offer-title">${o.title}</div><div class="offer-desc">${o.desc} • Pays ${o.payout} to you</div></div>
      </div>
      <div class="offer-right">
        <div class="reward">+${o.coins} 🪙</div><br>
        <button class="btn" ${isDone?'disabled':''} onclick="clickOffer('${o.id}',${o.coins},'${o.link}','${subid}',${o.postback})">${isDone?'✓ Done':'Claim'}</button>
        ${o.postback?'<div class="status">Postback Ready</div>':''}
      </div>
    </div>`;
  });
}

async function clickOffer(offerId, coins, linkTemplate, subid, isPostbackOffer){
  const user=auth.currentUser||cachedUser; if(!user) return;
  const finalLink=linkTemplate.replace('{SUBID}', subid);
  // 1. Save click as pending
  const clickRef=db.collection('users').doc(user.uid).collection('offerClicks').doc(subid);
  await clickRef.set({offerId, subid, coins, link:finalLink, status:'pending', createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  
  if(finalLink!=='#') window.open(finalLink,'_blank');

  const btn=event.target; btn.innerText='Checking...'; btn.disabled=true;

  // NOW MODE: Instant pay (because no Visa / no Functions)
  // LATER MODE: If isPostbackOffer=true, we keep pending and wait for postback.html call from OGAds
  if(!isPostbackOffer || localStorage.getItem('force_instant')==='1'){
    // Instant pay now
    try{
      await db.runTransaction(async t=>{
        const userRef=db.collection('users').doc(user.uid);
        const doc=await t.get(userRef);
        const newBal=(doc.data().balance||0)+coins;
        t.update(userRef,{balance:newBal});
        t.update(clickRef,{status:'completed', completedAt:firebase.firestore.FieldValue.serverTimestamp()});
        const histRef=userRef.collection('earnHistory').doc();
        t.set(histRef,{action:'Offers Earn', desc:offerId, coins:coins, timestamp:firebase.firestore.FieldValue.serverTimestamp()});
      });
      localStorage.setItem(`offer_done_${offerId}_${user.uid}`, new Date().toDateString());
      btn.innerText='✓ Completed +'+coins;
      loadBalance(); render();
    }catch(e){ alert(e.message); btn.innerText='Claim'; btn.disabled=false; }
  } else {
    // Postback mode - wait
    btn.innerText='⏳ Pending Postback';
    alert('Offer clicked! You will get coins when OGAds confirms install. Keep app open. (For now instant because force_instant=1)');
    // For demo, still pay instantly, but in real postback, OGAds will call postback.html?subid=...
  }
}

function loadBalance(){
  const c=JSON.parse(localStorage.getItem('userData')||'{}');
  const coins=c.balance??0, usdt=c.usdtBalance??0;
  document.getElementById('balCoins').innerText=coins+' coins';
  document.getElementById('balUsd').innerText=(coins*0.0005).toFixed(4);
  document.getElementById('balUsdt').innerText=Number(usdt).toFixed(4)+' USDT';
  if(cachedUser) db.collection('users').doc(cachedUser.uid).onSnapshot(s=>{
    if(!s.exists) return;
    const d=s.data(); localStorage.setItem('userData', JSON.stringify({...d,uid:s.id}));
    document.getElementById('balCoins').innerText=(d.balance||0)+' coins';
    document.getElementById('balUsd').innerText=((d.balance||0)*0.0005).toFixed(4);
    document.getElementById('balUsdt').innerText=Number(d.usdtBalance||0).toFixed(4)+' USDT';
  });
}

auth.onAuthStateChanged(u=>{ if(!u){location.href='index.html';return;} cachedUser=u; loadBalance(); render(); localStorage.setItem('force_instant','1'); });
</script>
</body>
</html>
