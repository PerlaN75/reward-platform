<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5;min-height:100vh}
.top-bar{background:#fff;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:2px solid #f1f5f9;position:sticky;top:0;z-index:10}
.back-btn{width:45px;height:30px;border-radius:10px;background:linear-gradient(180deg,#fef2f2,#ffe4e6);border:2px solid #ef4444;display:flex;align-items:center;justify-content:center;color:#991b1b;font-weight:900;font-size:22px;text-decoration:none}
.center-pill{background:#f8fafc;border:2px solid #e5e7eb;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px}
.container{max-width:500px;margin:0 auto;padding:14px 14px 90px}
.balance-card{background:#12230a;border:2px solid #fbbf24;border-radius:18px;padding:14px;display:flex;justify-content:space-around;text-align:center;color:#fff}
.balance-card b{color:#fbbf24;font-size:18px}.usdt{color:#22f59b;font-weight:900;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;position:relative}
.card.free{border-color:#22c55e}.card.coins{border-color:#111827}
.emoji{font-size:28px;margin-bottom:6px}.name{font-weight:900;font-size:12px}.sub{font-size:10px;color:#6b7280}
.badge{display:inline-block;margin-top:6px;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900;border:1.5px solid}
.badge.free{background:#dcfce7;color:#166534;border-color:#86efac}.badge.coins{background:#fef08a;color:#854d0e;border-color:#facc15}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111827;color:#facc15;padding:12px 20px;border-radius:99px;font-weight:900;z-index:9999;display:none;border:2px solid #facc15}
.bnb-timer{font-size:10px;font-weight:900;color:#ea580c;background:#fff7ed;border:1px dashed #fb923c;border-radius:999px;padding:3px 8px;margin-top:7px;display:inline-block}
.bnb-timer.ready{color:#166534;background:#dcfce7;border-color:#86efac}
#adGate{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
.gate-box{background:#fff;border:3px solid #111827;border-radius:20px;padding:20px;text-align:center;max-width:340px;width:100%;box-shadow:6px 6px 0 #111827}
.gate-title{font-weight:900;font-size:16px}.gate-sub{font-size:12px;color:#6b7280;margin:8px 0 14px}
.gate-btn{width:100%;height:48px;border-radius:12px;border:2px solid #111827;font-weight:900;font-size:14px;cursor:pointer}
.gate-btn.watch{background:#facc15;box-shadow:3px 3px 0 #111827}.gate-btn.continue{background:#dcfce7;display:none;margin-top:10px}
</style>

<body>
<div id="toast"></div>
<div class="top-bar"><a href="home.html" class="back-btn">‹</a><div class="center-pill">💎 Offers</div><div style="width:42px"></div></div>
<div class="container">
<div class="balance-card">
<div><b id="balCoins">0 coins</b><div style="font-size:10px;color:#9ca3af">≈ $<span id="balUsd">0</span></div></div>
<div style="width:1px;background:#2a3a1a"></div>
<div><div class="usdt" id="balUsdt">0 USDT</div><div style="font-size:10px;color:#9ca3af">Withdrawable</div></div>
</div>
<div class="grid" id="grid"></div>
</div>

<div id="adGate">
  <div class="gate-box">
    <div class="gate-title">🔓 Unlock Offer</div>
    <div class="gate-sub">Watch a short ad to unlock and earn coins. Free for you.</div>
    <button id="watchAdBtn" class="gate-btn watch">▶️ Watch Ad to Unlock</button>
    <button id="continueBtn" class="gate-btn continue">✅ Continue to Offer</button>
    <div style="font-size:10px;color:#9ca3af;margin-top:10px">Ad by Monetag • Vignette + Popunder</div>
  </div>
</div>

<script>
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try{const appCheck=firebase.appCheck();appCheck.activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);}catch(e){}
const auth=firebase.auth(), db=firebase.firestore();
let cachedUser=null;
const OFFERS=[
  {id:'bnb_faucet', emoji:'💧', name:'BNB Faucet', sub:'FREE BNB hourly', coins:0, link:'https://bnbpick.io/?ref=SilasN75', type:'free'},
  {id:'telegram_join', emoji:'✈️', name:'Telegram', sub:'Daily bonus', coins:0, link:'https://t.me/formrw_earning', type:'free'},
  {id:'play_game', emoji:'🎮', name:'Play Game', sub:'Play 2 min', coins:25, link:'https://t.me/formrw_earning', type:'coins'},
  {id:'install_app', emoji:'📲', name:'Install App', sub:'Install + open', coins:20, link:'https://t.me/formrw_earning', type:'coins'},
];
function renderInstant(){
  const grid=document.getElementById('grid');grid.innerHTML='';
  OFFERS.forEach(o=>{
    const isFree=o.coins===0;
    const badge=isFree?'FREE LINK':' +'+o.coins+' 🪙';
    const cls=isFree?'free':'coins';
    const timer=o.id==='bnb_faucet'?'<div id="bnbTimer" class="bnb-timer"></div>':'';
    grid.innerHTML+='<div class="card '+cls+'" onclick="clickOffer(\''+o.id+'\')"><div class="emoji">'+o.emoji+'</div><div class="name">'+o.name+'</div><div class="sub">'+o.sub+'</div><div class="badge '+cls+'">'+badge+'</div>'+timer+'</div>';
  });
  startBnbTimer();
}
let pendingOffer=null;
function clickOffer(id){
  const o=OFFERS.find(x=>x.id===id);
  if(!cachedUser||!o) return;
  if(o.type==='free'){localStorage.setItem('bnb_last_claim',Date.now().toString());window.open(o.link,'_blank');showToast('Opened!');return;}
  pendingOffer=o;
  document.getElementById('adGate').style.display='flex';
  document.getElementById('watchAdBtn').style.display='block';
  document.getElementById('continueBtn').style.display='none';
  document.getElementById('watchAdBtn').innerText='▶️ Watch Ad to Unlock';
}
document.getElementById('watchAdBtn').onclick=function(){
  this.innerText='⏳ Showing ad...';
  // This click will naturally trigger your Monetag Popunder 12211613
  setTimeout(unlockGate,6000);
};
function unlockGate(){
  document.getElementById('watchAdBtn').style.display='none';
  document.getElementById('continueBtn').style.display='block';
  showToast('Ad watched! Now continue');
}
document.getElementById('continueBtn').onclick=function(){
  document.getElementById('adGate').style.display='none';
  if(pendingOffer) doCoinsOffer(pendingOffer);
  pendingOffer=null;
};
let timerInterval=null;
function startBnbTimer(){
  const el=document.getElementById('bnbTimer');if(!el) return;
  const last=parseInt(localStorage.getItem('bnb_last_claim')||'0');
  if(!last){el.style.display='none';return;}
  el.style.display='inline-block';
  if(timerInterval) clearInterval(timerInterval);
  function update(){
    const diff=3600000-(Date.now()-last);
    if(diff<=0){el.innerText='✅ Ready again!';el.className='bnb-timer ready';clearInterval(timerInterval);return;}
    const m=Math.floor(diff/60000);const s=Math.floor((diff%60000)/1000);
    el.innerText='⏳ Next: '+m+'m '+s+'s';el.className='bnb-timer';
  }
  update();timerInterval=setInterval(update,1000);
}
async function doCoinsOffer(o){
  const uid=(auth.currentUser||cachedUser).uid;
  const today=new Date().toISOString().split('T')[0];
  const key='claimed_'+uid+'_'+o.id+'_'+today;
  if(localStorage.getItem(key)){showToast('Already claimed today');window.open(o.link,'_blank');return;}
  window.open(o.link,'_blank');
  try{
    await db.runTransaction(async t=>{
      const snap=await t.get(db.collection('users').doc(uid));
      if(!snap.exists) throw "no user";
      t.set(db.collection('users').doc(uid),{balance:firebase.firestore.FieldValue.increment(o.coins),coins:firebase.firestore.FieldValue.increment(o.coins),points:firebase.firestore.FieldValue.increment(o.coins)},{merge:true});
    });
    localStorage.setItem(key,'1');loadBalance();showToast('✓ +'+o.coins+' coins!');
  }catch(e){showToast(e.message);}
}
function loadBalance(){
  const c=JSON.parse(localStorage.getItem('userData')||'{}');
  document.getElementById('balCoins').innerText=(c.balance??c.coins??0)+' coins';
  document.getElementById('balUsd').innerText=((c.balance??0)*0.0005).toFixed(4);
  document.getElementById('balUsdt').innerText=Number(c.usdtBalance||0).toFixed(4)+' USDT';
  if(cachedUser) db.collection('users').doc(cachedUser.uid).onSnapshot(s=>{
    if(!s.exists) return;const d=s.data();localStorage.setItem('userData',JSON.stringify({...d,uid:s.id}));
    document.getElementById('balCoins').innerText=(d.balance||d.coins||0)+' coins';
    document.getElementById('balUsd').innerText=((d.balance||0)*0.0005).toFixed(4);
    document.getElementById('balUsdt').innerText=Number(d.usdtBalance||0).toFixed(4)+' USDT';
  });
}
renderInstant();
auth.onAuthStateChanged(u=>{if(!u){location.href='index.html';return;}cachedUser=u;renderInstant();loadBalance();});
</script>
