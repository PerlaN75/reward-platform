<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offers</title>
<style>
*{ -webkit-tap-highlight-color:transparent }
*:focus{outline:none !important}
body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:12px 10px 80px 10px;box-sizing:border-box;min-height:100vh}
.card{background:#ffffff;border:2px solid #e5e7eb;border-radius:22px;padding:16px 14px 18px 14px;width:100%;max-width:340px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.06);margin:10px auto 30px;height:auto}
h2{margin:8px 0 6px 0;color:#111827;font-size:22px;font-weight:900}
.badge{border:1.5px solid #2563eb;border-radius:20px;padding:6px 12px;display:inline-block;margin:8px 0;color:#2563eb;background:#eff6ff;font-weight:bold;font-size:13px}
.bar{height:7px;background:#e5e7eb;border-radius:10px;margin:10px 0;overflow:hidden}
.fill{height:100%;background:#2563eb;width:0%;transition:0.3s}
.offer-btn{display:block;width:100%;background:#2563eb;color:#fff;font-weight:bold;padding:12px;border-radius:12px;margin:8px 0;text-decoration:none;border:none;font-size:14px;cursor:pointer;box-sizing:border-box;box-shadow:0 3px 0 #1d4ed8}
.offer-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1d4ed8}
.offer-btn.done{background:#e5e7eb;color:#9ca3af;box-shadow:none}
#countText{font-size:12px;color:#6b7280;margin:4px 0}
.note{color:#6b7280;font-size:11px;margin-top:12px;line-height:1.3}
.back{background:#fff;color:#111827;padding:10px 24px;border-radius:20px;display:inline-block;margin-top:14px;text-decoration:none;font-weight:bold;font-size:14px;border:1.5px solid #e5e7eb;box-shadow:0 2px 0 #e5e7eb}
.modal{display:none;position:fixed;z-index:999;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.45);justify-content:center;align-items:center;padding:8px;box-sizing:border-box}
.modal-content{background:#ffffff;border:2px solid #e5e7eb;border-radius:14px;padding:14px 12px;width:88%;max-width:280px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,0.12)}
.modal-content h3{margin:6px 0 4px 0;font-size:16px;color:#111827;font-weight:900}
.modal-content p{margin:2px 0;font-size:11px;color:#6b7280}
.timer{font-size:32px;color:#2563eb;font-weight:bold;margin:6px 0}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#ffffff;border:2px solid #e5e7eb;color:#111827;padding:12px 18px;border-radius:12px;font-weight:bold;z-index:9999;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.1)}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-check.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div id="toast"></div>
<div class="card">
<h2>🔥 Offers</h2>
<div class="badge" id="ptsBadge">Total Today: 0/10 pts</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="countText">0/5 done - Resets midnight</div>
<div id="offersList" style="margin-top:10px"></div>
<a class="back" href="home.html">Back Home</a>
<div class="note">Rewards for watching. Open offers for own interest.<br>Points added after 12 sec verification.</div>
</div>
<div id="timerModal" class="modal"><div class="modal-content">
<div style="font-size:26px">⏳</div>
<h3>Verifying...</h3>
<p>Keep offer tab open for 12 seconds</p>
<div class="timer" id="timerNum">12</div>
<div style="font-size:10px;color:#9ca3af">Do not close this window</div>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try {
  const appCheck = firebase.appCheck();
  appCheck.activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1', true);
} catch(e) { console.log("AppCheck skipped"); }
const auth=firebase.auth(), db=firebase.firestore();
const DIRECT_LINK = "https://asiafilm.org/4/fea14e9f802d182828ceef74e57a3a5b";
const LIMIT = 5; const PER_OFFER = 2; const WAIT_SEC = 12;
function getToday(){return new Date().toISOString().split('T')[0];}
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
let currentUser=null, userData={}, stat={date:getToday(),count:0,pts:0}, curOffer=0, sec=WAIT_SEC, timerInt=null;
function render(){
  document.getElementById("ptsBadge").innerText = `Total Today: ${stat.pts}/10 pts`;
  document.getElementById("countText").innerText = `${stat.count}/${LIMIT} done - Resets midnight`;
  document.getElementById("fill").style.width = (stat.count/LIMIT*100)+"%";
  let html=""; for(let i=1;i<=LIMIT;i++){
    let isDone = i <= stat.count;
    html += `<button class="offer-btn ${isDone?'done':''}" onclick="clickOffer(${i})" ${isDone?'disabled':''}>${isDone?'✅ Done':'🔥 Offer '+i+' - +'+PER_OFFER+' pts'}</button>`;
  } document.getElementById("offersList").innerHTML = html;
}
function clickOffer(n){
  if(stat.count >= LIMIT){ showToast("Daily limit reached!"); return; }
  if(document.getElementById('timerModal').style.display==='flex') return;
  curOffer=n; window.open(DIRECT_LINK, "_blank");
  sec=WAIT_SEC; document.getElementById('timerNum').innerText=sec;
  document.getElementById('timerModal').style.display='flex';
  timerInt=setInterval(async ()=>{
    sec--; document.getElementById('timerNum').innerText=sec;
    if(sec<=0){ clearInterval(timerInt); document.getElementById('timerModal').style.display='none'; await rewardOffer(); }
  },1000);
}
async function rewardOffer(){
  if(stat.count >= LIMIT) return;
  stat.count++; stat.pts += PER_OFFER;
  localStorage.setItem("bonus_offers", JSON.stringify(stat)); render();
  if(currentUser){
    try{
      let newBal = (userData.balance||0) + PER_OFFER;
      userData.balance=newBal; userData.bonus_offers_date=getToday(); userData.bonus_offers_count=stat.count; userData.bonus_offers_pts=stat.pts;
      localStorage.setItem('userData', JSON.stringify(userData));
      await db.collection('users').doc(currentUser.uid).update({balance:newBal,bonus_offers_date:getToday(),bonus_offers_count:stat.count,bonus_offers_pts:stat.pts});
      await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({action:'Bonus Offer', points:PER_OFFER, desc:`Offer ${curOffer} +${PER_OFFER} pts`, timestamp:firebase.firestore.FieldValue.serverTimestamp()});
      showToast(`✓ +${PER_OFFER} pts added!`);
    }catch(e){ showToast(e.message); }
  }
}
auth.onAuthStateChanged(async u=>{
  if(!u){ location.href='./index.html'; return; }
  currentUser=u; const doc=await db.collection('users').doc(u.uid).get();
  if(doc.exists){
    userData=doc.data(); localStorage.setItem('userData', JSON.stringify(userData));
    const fbDate=userData.bonus_offers_date||'';
    if(fbDate===getToday()){ stat.count=userData.bonus_offers_count||0; stat.pts=userData.bonus_offers_pts||0; stat.date=getToday(); }
    else{ stat={date:getToday(),count:0,pts:0}; await db.collection('users').doc(u.uid).update({bonus_offers_date:getToday(),bonus_offers_count:0,bonus_offers_pts:0}); }
    localStorage.setItem("bonus_offers", JSON.stringify(stat));
  } render();
}); render();
</script>
</body>
</html>
