<!DOCTYPE html>
<html>
<head>
<title>Offers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5;min-height:100vh}
.top-bar{background:#fff;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:2px solid #f1f5f9;position:sticky;top:0;z-index:10}
.back-btn{width:42px;height:38px;border-radius:10px;background:linear-gradient(180deg,#fef2f2,#ffe4e6);border:2px solid #ef4444;display:flex;align-items:center;justify-content:center;color:#991b1b;font-weight:900;font-size:22px;text-decoration:none}
.center-pill{background:#f8fafc;border:2px solid #e5e7eb;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px}
.container{max-width:500px;margin:0 auto;padding:14px 14px 90px}
.balance-card{background:#12230a;border:2px solid #fbbf24;border-radius:18px;padding:14px;display:flex;justify-content:space-around;text-align:center;color:#fff}
.balance-card b{color:#fbbf24;font-size:18px}.usdt{color:#22f59b;font-weight:900;font-size:18px}

/* GRID LIKE BNBPICK SCREENSHOT */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:18px 10px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.06);transition:0.15s}
.card:active{transform:scale(0.97);border-color:#fbbf24}
.card-logo{height:32px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;font-weight:900;font-size:16px}
.card-name{font-size:13px;font-weight:600;color:#333;margin-top:4px}
.card.active{border-color:#fbbf24;background:#fffbeb}

.cpx{font-family:Arial;letter-spacing:-0.5px}
.cpx span{font-weight:900}
.timewall{font-weight:800}.timewall span{background:#4ade80;color:#fff;padding:1px 6px;border-radius:4px;margin-left:2px}
.monlix{font-weight:900;font-size:20px;letter-spacing:-1px}.monlix b{color:#111}.monlix x{color:#22c55e}
.bitlabs{font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;gap:6px}
.theorem{font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px}
.bnbpick{font-weight:900;color:#f0b90b;font-size:16px}
</style>
</head>
<body>
<div class="top-bar">
<a href="home.html" class="back-btn">‹</a>
<div class="center-pill">💎 Offers Wall</div>
<div style="width:42px"></div>
</div>
<div class="container">
<div class="balance-card">
<div><b id="balCoins">0 coins</b><div style="font-size:10px;color:#9ca3af">≈ $<span id="balUsd">0</span></div></div>
<div style="width:1px;background:#2a3a1a"></div>
<div><div class="usdt" id="balUsdt">0 USDT</div><div style="font-size:10px;color:#9ca3af">Withdrawable</div></div>
</div>

<div class="grid" id="grid"></div>

<div style="font-size:11px;color:#9ca3af;text-align:center;margin-top:18px">Tap any wall to open • Resets daily • +Coins auto added</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
let cachedUser=null;

const MY_LINK = "https://bnbpick.io/?ref=SilasN75";

const WALLS=[
  {id:'cpx', name:'CPX-Research', html:'<div class="cpx"><span>◍ CPX RESEARCH</span></div>', coins:100},
  {id:'timewall', name:'TimeWall', html:'<div class="timewall">time<span>wall</span></div>', coins:100},
  {id:'monlix', name:'Monlix', html:'<div class="monlix"><b>Monli</b><x>x</x></div>', coins:80},
  {id:'bitlabs', name:'Bitlabs', html:'<div class="bitlabs">🧪 Bitlabs</div>', coins:80},
  {id:'theorem', name:'Theoremreach', html:'<div class="theorem">📱 theoremreach</div>', coins:80},
  {id:'bnbpick', name:'Bnbpick.io', html:'<div class="bnbpick">💧 Bnbpick.io - Faucet</div>', coins:120},
];

function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  WALLS.forEach(w=>{
    grid.innerHTML+=`
    <div class="card" onclick="openWall('${w.id}',${w.coins})">
      <div class="card-logo">${w.html}</div>
      <div class="card-name">${w.name}</div>
    </div>`;
  });
}

async function openWall(wallId, coins){
  const user=auth.currentUser||cachedUser; if(!user) return;
  // open your link for ALL walls (so referral counts)
  window.open(MY_LINK, '_blank');
  
  // Give coins (once per wall per day)
  const today=new Date().toISOString().split('T')[0];
  const doneKey=`wall_done_${wallId}_${user.uid}_${today}`;
  if(localStorage.getItem(doneKey)===today){ return; }

  try{
    const userRef=db.collection('users').doc(user.uid);
    const subid=`${user.uid}_${wallId}_${Date.now()}`;
    await db.runTransaction(async t=>{
      const d=await t.get(userRef);
      t.update(userRef,{balance:(d.data().balance||0)+coins});
      t.set(userRef.collection('offerClicks').doc(subid),{offerId:wallId, coins, status:'completed', createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      t.set(userRef.collection('earnHistory').doc(),{action:'Offers Wall', desc:wallId, coins, timestamp:firebase.firestore.FieldValue.serverTimestamp()});
    });
    localStorage.setItem(doneKey, today);
    loadBalance();
  }catch(e){ console.log(e); }
}

function loadBalance(){
  const c=JSON.parse(localStorage.getItem('userData')||'{}');
  const coins=c.balance??0, usdt=c.usdtBalance??0;
  document.getElementById('balCoins').innerText=coins+' coins';
  document.getElementById('balUsd').innerText=(coins*0.0005).toFixed(4);
  document.getElementById('balUsdt').innerText=Number(usdt).toFixed(4)+' USDT';
  if(cachedUser) db.collection('users').doc(cachedUser.uid).onSnapshot(s=>{
    if(!s.exists) return;
    const d=s.data(); localStorage.setItem('userData', JSON.stringify({...d,uid:s.id}));
    document.getElementById('balCoins').innerText=(d.balance||0)+' coins';
    document.getElementById('balUsd').innerText=((d.balance||0)*0.0005).toFixed(4);
    document.getElementById('balUsdt').innerText=Number(d.usdtBalance||0).toFixed(4)+' USDT';
  });
}
auth.onAuthStateChanged(u=>{ if(!u){location.href='index.html';return;} cachedUser=u; loadBalance(); render(); });
</script>
</body>
</html>
