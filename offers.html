<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonus Offers</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:12px 10px 80px 10px;box-sizing:border-box;min-height:100vh}
.card{background:radial-gradient(circle at top,#1a4d1a,#051405);border:2px solid #FFD700;border-radius:22px;padding:16px 14px 18px 14px;width:100%;max-width:340px;text-align:center;box-shadow:0 0 20px rgba(255,215,0,0.3);margin:10px auto 30px;height:auto}
h2{margin:8px 0 6px 0;color:#FFD700;font-size:20px}
.badge{border:1.5px solid #FFD700;border-radius:20px;padding:5px 12px;display:inline-block;margin:8px 0;color:#FFD700;font-weight:bold;font-size:13px}
.bar{height:7px;background:#333;border-radius:10px;margin:10px 0;overflow:hidden}
.fill{height:100%;background:#FFD700;width:0%;transition:0.3s}
.offer-btn{display:block;width:100%;background:linear-gradient(#FFD700,#FFA500);color:#000;font-weight:bold;padding:12px;border-radius:10px;margin:8px 0;text-decoration:none;border:none;font-size:14px;cursor:pointer;box-sizing:border-box}
.offer-btn.done{background:#333;color:#888}
#countText{font-size:12px;color:#8f8;margin:4px 0}
.note{color:#FFD700;font-size:11px;margin-top:12px;line-height:1.3}
.back{background:#fff;color:#000;padding:10px 24px;border-radius:20px;display:inline-block;margin-top:14px;text-decoration:none;font-weight:bold;font-size:14px}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div class="card">
<h2>🔥 Bonus Offers</h2>
<div class="badge" id="ptsBadge">Total Today: 0/10 pts</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="countText">0/5 done - Resets midnight</div>
<div id="offersList" style="margin-top:10px"></div>
<a class="back" href="home.html">Back Home</a>
<div class="note">Rewards for watching. Open offers for own interest.<br>Points added automatically to your balance.</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();

const DIRECT_LINK = "https://asiafilm.org/4/fea14e9f802d182828ceef74e57a3a5b";
const LIMIT = 5; 
const PER_OFFER = 2;

const todayKey = new Date().toDateString();
let stat = JSON.parse(localStorage.getItem("bonus_offers")||"{}");
if(stat.date !== todayKey){ stat = {date:todayKey,count:0,pts:0}; localStorage.setItem("bonus_offers", JSON.stringify(stat)); }

let currentUser=null, userData={};

function save(){ localStorage.setItem("bonus_offers", JSON.stringify(stat)); }

function render(){
  document.getElementById("ptsBadge").innerText = `Total Today: ${stat.pts}/10 pts`;
  document.getElementById("countText").innerText = `${stat.count}/${LIMIT} done - Resets midnight`;
  document.getElementById("fill").style.width = (stat.count/LIMIT*100)+"%";
  let html=""; 
  for(let i=1;i<=LIMIT;i++){
    let isDone = i <= stat.count;
    html += `<button class="offer-btn ${isDone?'done':''}" onclick="clickOffer(${i})" ${isDone?'disabled':''}>${isDone?'✅ Done':'🔥 Offer '+i+' - +'+PER_OFFER+' pts'}</button>`;
  } 
  document.getElementById("offersList").innerHTML = html;
}

async function clickOffer(n){
  if(stat.count >= LIMIT){ alert("Daily limit reached. Come tomorrow!"); return; }
  
  // Open Adsterra DirectLink - this is your money
  window.open(DIRECT_LINK, "_blank");

  // Update local counter - this is DAILY and will reset if user clears browser
  stat.count++; 
  stat.pts += PER_OFFER; 
  save(); 
  render();

  // Add points to Firebase so balance stays even after clear
  if(currentUser){
    try{
      let newBal = (userData.balance||0) + PER_OFFER;
      userData.balance = newBal;
      localStorage.setItem('userData', JSON.stringify(userData));
      await db.collection('users').doc(currentUser.uid).update({balance:newBal});
      await db.collection('users').doc(currentUser.uid).collection('earnHistory').add({
        action:'Bonus Offer', points:PER_OFFER, desc:`Offer ${n} +${PER_OFFER} pts`, timestamp:firebase.firestore.FieldValue.serverTimestamp()
      });
    }catch(e){ console.log(e); }
  } else {
    // fallback for old users without login - keep old local method
    let mainPts = parseInt(localStorage.getItem("points")||"0");
    mainPts += PER_OFFER; localStorage.setItem("points", mainPts);
  }

  setTimeout(()=>{ alert("+"+PER_OFFER+" pts added!"); }, 500);
}

auth.onAuthStateChanged(async u=>{
  if(u){
    currentUser=u;
    const doc=await db.collection('users').doc(u.uid).get();
    if(doc.exists){ userData=doc.data(); }
  }
  render();
});

render();
</script>
</body>
</html>
