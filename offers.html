<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f3ff;min-height:100vh;color:#111827}
.top-bar{background:#6d28d9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;box-shadow:0 4px 12px rgba(109,40,217,0.3)}
.back-btn-checkin{width:45px;height:30px;border-radius:10px;background:#fff;border:2px solid #fecaca;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.back-btn-checkin .lines{display:flex;flex-direction:column;gap:3px}
.back-btn-checkin .lines i{display:block;width:18px;height:2.5px;background:#000;border-radius:2px}
.center-pill{background:#ffffff;border:2px solid #ede9fe;border-radius:999px;padding:6px 18px;font-weight:900;font-size:14px;color:#4c1d95;position:absolute;left:50%;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.container{max-width:500px;margin:0 auto;padding:14px 14px 10px}
.balance-card{background:linear-gradient(180deg,#1a2e0a,#12230a);border:2px solid #fbbf24;border-radius:18px;padding:14px;display:flex;justify-content:space-around;text-align:center;color:#fff;box-shadow:0 8px 24px rgba(251,191,36,0.18)}
.balance-card b{color:#fbbf24;font-size:18px}.usdt{color:#22f59b;font-weight:900;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{background:#ffffff;border:2px solid #ede9fe;border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(109,40,217,0.06);transition:0.2s;position:relative;overflow:hidden}
.card:active{transform:scale(0.97)}
.card.free{border-color:#22c55e}.card.coins{border-color:#ede9fe}
.emoji{font-size:28px}.name{font-weight:900;font-size:12px;color:#111827}.sub{font-size:10px;color:#6b7280;margin-top:2px}
.badge{display:inline-block;margin-top:6px;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900;border:1.5px solid}
.badge.free{background:#dcfce7;color:#166534;border-color:#86efac}.badge.coins{background:#fef3c7;color:#92400e;border-color:#fbbf24}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#ffffff;color:#4c1d95;padding:14px 20px;border-radius:14px;font-weight:900;font-size:13px;z-index:99999;display:none;border:2px solid #ede9fe;box-shadow:0 8px 24px rgba(109,40,217,0.15);text-align:center;max-width:90%}
#adGate{position:fixed;inset:0;background:rgba(17,12,34,0.65);backdrop-filter:blur(8px);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
.gate-box{background:linear-gradient(180deg,#ffffff,#fbf7ff);border:2px solid #fbbf24;border-radius:24px;padding:22px 20px 18px;text-align:center;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(109,40,217,0.35), 0 0 0 6px rgba(251,191,36,0.12);position:relative;overflow:hidden}
.gate-box:before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#fbbf24,#f59e0b,#a78bfa)}
.gate-icon{width:64px;height:64px;margin:0 auto 10px;background:linear-gradient(180deg,#fef3c7,#fbbf24);border:3px solid #f59e0b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 18px rgba(245,158,11,0.3)}
.gate-title{font-weight:900;font-size:18px;color:#4c1d95;letter-spacing:-0.2px}
.gate-sub{font-size:12px;color:#6b7280;margin:8px 0 16px;line-height:1.4;font-weight:600}
.gate-btn{width:100%;height:50px;border-radius:14px;border:2px solid #ede9fe;font-weight:900;font-size:14px;cursor:pointer;transition:0.2s}
.gate-btn.watch{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000;box-shadow:0 4px 0 #d97706, 0 8px 20px rgba(245,158,11,0.25);border-color:#f59e0b}
.gate-btn.watch:disabled{background:#f3f4f6;color:#9ca3af;box-shadow:none;border-color:#e5e7eb;cursor:not-allowed}
.gate-btn.open{background:linear-gradient(180deg,#dcfce7,#22c55e);color:#fff;border-color:#16a34a;box-shadow:0 4px 0 #15803d, 0 8px 20px rgba(34,197,94,0.3);display:none;margin-top:10px}
#gateTimer{font-size:13px;font-weight:900;color:#92400e;margin-top:12px;background:#fffbeb;border:1.5px solid #fde68a;padding:8px 12px;border-radius:999px;display:inline-block;min-width:140px}
#gateTimer:empty{display:none}
</style>

<body>
<div id="toast"></div>
<div class="top-bar"><a href="home.html" class="back-btn-checkin"><span class="lines"><i></i><i></i><i></i></span></a><div class="center-pill">💎 Offers</div><div style="width:45px"></div></div>
<div class="container">
<div class="balance-card"><div><b id="balCoins">0 coins</b><div style="font-size:10px;color:#9ca3af">≈ $<span id="balUsd">0</span></div></div><div style="width:1px;background:#2a3a1a"></div><div><div class="usdt" id="balUsdt">0 USDT</div><div style="font-size:10px;color:#9ca3af">Withdrawable</div></div></div>
<div class="grid" id="grid"></div>
</div>

<!-- AD BELOW - BOTTOM - 12320757 ONLY -->
<div style="max-width:500px;margin:0 auto;padding:0 14px 90px">
  <div style="font-size:10px;color:#9ca3af;font-weight:700;text-align:center;margin-bottom:6px;letter-spacing:0.5px">Advertisement</div>
  <a id="offersAdLink" href="https://uplcm.com/4/12320757" target="_blank" rel="sponsored noopener" style="text-decoration:none;display:flex;align-items:center;gap:8px;background:#FFD700;border-radius:12px;padding:12px">
    <div style="flex:1"><div id="offersAdTitle" style="font-weight:900;color:#000;font-size:13px">🎁 Claim Your $100 Bonus</div><div id="offersAdSub" style="font-size:11px;color:#333">Limited offer • Sponsored</div></div>
    <div id="offersAdBtn" style="background:#000;color:#fff;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap">Visit →</div>
  </a>
</div>

<div id="adGate"><div class="gate-box"><button onclick="closeGate()" style="position:absolute;top:10px;right:12px;border:none;background:none;font-size:18px;font-weight:900;cursor:pointer;color:#6b7280">✕</button><div class="gate-icon" id="gateIcon">🪙</div><div id="gateTitle" class="gate-title"></div><div id="gateSub" class="gate-sub"></div><button id="watchAdBtn" class="gate-btn watch"></button><div id="gateTimer"></div><button id="openBtn" class="gate-btn open">✅ Open</button><div style="font-size:10px;color:#9ca3af;margin-top:12px;font-weight:700">Advertisement</div></div></div>
<script>
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',5000);}
function closeGate(){document.getElementById('adGate').style.display='none';}

let vignetteLoaded=false;
function loadCleanVignette(){
  if(vignetteLoaded) return;
  vignetteLoaded=true;
  const old=document.querySelector('script[src*="vignette.min.js"]');
  if(old) old.remove();
  (function(s){s.dataset.zone='12268552',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
  setTimeout(()=>{vignetteLoaded=false;}, 3*60*1000);
}

const OFFERS_ADS=[
  {title:"🎁 Claim Your $100 Bonus",sub:"Limited offer • Sponsored",btn:"Visit →",bg:"#FFD700",link:"https://uplcm.com/4/12320757"},
  {title:"💰 Earn $50 Daily - Easy Tasks",sub:"New users • Sponsored",btn:"Visit →",bg:"#7CFC00",link:"https://uplcm.com/4/12320757"},
  {title:"📱 Win Free Airtime Today",sub:"MTN • Airtel • Sponsored",btn:"Visit →",bg:"#00D4FF",link:"https://uplcm.com/4/12320757"},
  {title:"🔥 Hot Offer - Double Your Coins",sub:"Today only • Sponsored",btn:"Visit →",bg:"#FF9F43",link:"https://uplcm.com/4/12320757"}
];
const OFFERS_AD_TIME=2*60*1000;
const OFFERS_AD_KEY='offersAd_state_v1';
let offersAdIndex=0;
function saveOffersAd(){ try{ localStorage.setItem(OFFERS_AD_KEY, JSON.stringify({index:offersAdIndex, changedAt:Date.now()})); }catch(e){} }
function showOffersAd(i){
  const a=OFFERS_ADS[i];
  const link=document.getElementById('offersAdLink');
  if(!link) return;
  link.href=a.link; link.style.background=a.bg;
  document.getElementById('offersAdTitle').textContent=a.title;
  document.getElementById('offersAdSub').textContent=a.sub;
  document.getElementById('offersAdBtn').textContent=a.btn;
}
function nextOffersAd(){ offersAdIndex=(offersAdIndex+1)%OFFERS_ADS.length; showOffersAd(offersAdIndex); saveOffersAd(); }
(function initOffersAd(){
  try{
    const raw=localStorage.getItem(OFFERS_AD_KEY);
    if(!raw){ showOffersAd(0); saveOffersAd(); setTimeout(function(){ nextOffersAd(); setInterval(nextOffersAd, OFFERS_AD_TIME); }, OFFERS_AD_TIME); return; }
    const saved=JSON.parse(raw);
    const elapsed=Date.now() - (saved.changedAt||Date.now());
    const steps=Math.floor(elapsed / OFFERS_AD_TIME);
    offersAdIndex=((saved.index||0)+steps)%OFFERS_ADS.length;
    const remain=OFFERS_AD_TIME - (elapsed % OFFERS_AD_TIME);
    showOffersAd(offersAdIndex);
    try{ localStorage.setItem(OFFERS_AD_KEY, JSON.stringify({index:offersAdIndex, changedAt:Date.now()-(elapsed%OFFERS_AD_TIME)})); }catch(e){}
    setTimeout(function(){ nextOffersAd(); setInterval(nextOffersAd, OFFERS_AD_TIME); }, remain);
  }catch(e){ showOffersAd(0); saveOffersAd(); setInterval(nextOffersAd, OFFERS_AD_TIME); }
})();

const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
try{firebase.appCheck().activate('6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1',true);}catch(e){}
const auth=firebase.auth(), db=firebase.firestore();
let cachedUser=null;

const OFFERS=[
  {id:'bnb_faucet', emoji:'💧', name:'BNB Faucet', sub:'FREE BNB hourly', link:'https://bnbpick.io/?ref=SilasN75', type:'free'},
  {id:'telegram_join', emoji:'✈️', name:'Telegram', sub:'Daily bonus', link:'https://t.me/formrw_earning', type:'free'},
  {id:'play_game', emoji:'🎮', name:'Play Game', sub:'Games upload soon', link:'', type:'play'},
  {id:'install_app', emoji:'📲', name:'Install App', sub:'Apps available soon', link:'', type:'install'},
];

function renderInstant(){
  const grid=document.getElementById('grid');grid.innerHTML='';
  OFFERS.forEach(o=>{
    let cls='coins', badge='SOON + AD';
    if(o.type==='free'){cls='free'; badge='FREE + AD';}
    grid.innerHTML+='<div class="card '+cls+'" onclick="clickOffer(\''+o.id+'\')"><div class="emoji">'+o.emoji+'</div><div class="name">'+o.name+'</div><div class="sub">'+o.sub+'</div><div class="badge '+cls+'">'+badge+'</div></div>';
  });
}

let pendingOffer=null;

function clickOffer(id){
  const o=OFFERS.find(x=>x.id===id);if(!cachedUser||!o) return;
  const COOLDOWN=3*60*1000;
  const last=parseInt(localStorage.getItem('offer_'+o.id+'_last')||'0');
  pendingOffer=o;

  if(last && (Date.now()-last)<COOLDOWN){
    if(o.type==='free' && o.link){ window.open(o.link,'_blank'); }
    else if(o.type==='play'){ showToast('🎮 Games upload soon!'); }
    else { showToast('📲 Apps available soon!'); }
    return;
  }
  document.getElementById('adGate').style.display='flex';
  document.getElementById('watchAdBtn').style.display='block';
  document.getElementById('openBtn').style.display='none';
  document.getElementById('watchAdBtn').disabled=false;
  document.getElementById('gateTimer').innerText='';
  document.getElementById('gateIcon').innerText=o.emoji;
  if(o.id==='bnb_faucet'){
    document.getElementById('gateTitle').innerText='💧 Open BNB Faucet';
    document.getElementById('gateSub').innerText='Please wait 10s to open';
    document.getElementById('watchAdBtn').innerText='Open BNB Faucet';
  }else if(o.id==='telegram_join'){
    document.getElementById('gateTitle').innerText='✈️ Open Telegram';
    document.getElementById('gateSub').innerText='Please wait 10s to open';
    document.getElementById('watchAdBtn').innerText='Open Telegram';
  }else if(o.type==='play'){
    document.getElementById('gateTitle').innerText='🎮 Open Play Game';
    document.getElementById('gateSub').innerText='Please wait 10s to open';
    document.getElementById('watchAdBtn').innerText='Open Play Game';
  }else{
    document.getElementById('gateTitle').innerText='📲 Open Install App';
    document.getElementById('gateSub').innerText='Please wait 10s to open';
    document.getElementById('watchAdBtn').innerText='Open Install App';
  }
}

document.getElementById('watchAdBtn').onclick=function(){
  this.innerText='⏳ Please wait...';this.disabled=true;
  let sec=10;
  const timerEl=document.getElementById('gateTimer');
  timerEl.innerText='⏳ Wait '+sec+'s...';
  const interval=setInterval(()=>{
    sec--;
    if(sec>0){timerEl.innerText='⏳ Wait '+sec+'s...';}
    else{clearInterval(interval);
      document.getElementById('watchAdBtn').style.display='none';
      timerEl.innerText='✅ Ready!';
      document.getElementById('openBtn').style.display='block';
    }
  },1000);
};

document.getElementById('openBtn').onclick=function(){
  document.getElementById('adGate').style.display='none';
  if(!pendingOffer) return;
  const o=pendingOffer;
  loadCleanVignette();
  localStorage.setItem('offer_'+o.id+'_last', String(Date.now()));

  if(o.type==='free' && o.link){
    window.open(o.link,'_blank');
    showToast('✅ '+o.name+' Ready!');
  }else if(o.type==='play'){
    showToast('🎮 Games upload soon!');
  }else{
    showToast('📲 Apps available soon!');
  }
  pendingOffer=null;
};

function loadBalance(){
  const c=JSON.parse(localStorage.getItem('userData')||'{}');
  document.getElementById('balCoins').innerText=(c.balance??c.coins??0)+' coins';
  document.getElementById('balUsd').innerText=((c.balance??0)*0.0005).toFixed(4);
  document.getElementById('balUsdt').innerText=Number(c.usdtBalance||0).toFixed(4)+' USDT';
  if(cachedUser) db.collection('users').doc(cachedUser.uid).onSnapshot(s=>{
    if(!s.exists) return;const d=s.data();localStorage.setItem('userData',JSON.stringify({...d,uid:s.id}));
    document.getElementById('balCoins').innerText=(d.balance||d.coins||0)+' coins';
    document.getElementById('balUsd').innerText=((d.balance||0)*0.0005).toFixed(4);
    document.getElementById('balUsdt').innerText=Number(d.usdtBalance||0).toFixed(4)+' USDT';
  });
}
renderInstant();
auth.onAuthStateChanged(u=>{
  if(!u){location.href='index.html';return;}
  cachedUser=u;
  renderInstant();
  loadBalance();
});
</script>
