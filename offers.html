<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonus Offers</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:15px;box-sizing:border-box}
.card{background:radial-gradient(circle at top,#1a4d1a,#051405);border:2px solid #FFD700;border-radius:24px;padding:22px;width:100%;max-width:380px;text-align:center;box-shadow:0 0 20px rgba(255,215,0,0.3)}
h2{margin:5px 0;color:#FFD700}
.badge{border:1.5px solid #FFD700;border-radius:20px;padding:6px 14px;display:inline-block;margin:10px 0;color:#FFD700;font-weight:bold;font-size:14px}
.bar{height:8px;background:#333;border-radius:10px;margin:12px 0;overflow:hidden}
.fill{height:100%;background:#FFD700;width:0%;transition:0.3s}
.offer-btn{display:block;width:100%;background:linear-gradient(#FFD700,#FFA500);color:#000;font-weight:bold;padding:14px;border-radius:12px;margin:10px 0;text-decoration:none;border:none;font-size:15px;cursor:pointer}
.offer-btn.done{background:#333;color:#888}
.note{color:#FFD700;font-size:12px;margin-top:10px;line-height:1.4}
.back{background:#fff;color:#000;padding:10px 24px;border-radius:20px;display:inline-block;margin-top:15px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>🔥 Bonus Offers</h2>
<div class="badge" id="ptsBadge">Total Today: 0/10 pts</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="countText" style="font-size:13px;color:#8f8">0/5 done - Resets midnight</div>
<div id="offersList" style="margin-top:15px"></div>
<a class="back" href="index.html">Back Home</a>
<div class="note">Rewards for watching. Open offers for own interest.<br>Points added automatically to your balance.</div>
</div>

<script>
const DIRECT_LINK = "https://asiafilm.org/4/fea14e9f802d182828ceef74e57a3a5b";
const LIMIT = 5;
const PER_OFFER = 2;
const todayKey = new Date().toDateString();
let stat = JSON.parse(localStorage.getItem("bonus_offers")||"{}");
if(stat.date !== todayKey){ stat = {date:todayKey,count:0,pts:0}; }
function save(){ localStorage.setItem("bonus_offers", JSON.stringify(stat)); }

function addPointsToMain(p){
  let mainPts = parseInt(localStorage.getItem("points")||"0");
  mainPts += p;
  localStorage.setItem("points", mainPts);
  let mainTotal = parseInt(localStorage.getItem("totalPoints")||"0");
  mainTotal += p;
  localStorage.setItem("totalPoints", mainTotal);
}

function render(){
  document.getElementById("ptsBadge").innerText = `Total Today: ${stat.pts}/10 pts`;
  document.getElementById("countText").innerText = `${stat.count}/${LIMIT} done - Resets midnight`;
  document.getElementById("fill").style.width = (stat.count/LIMIT*100)+"%";
  let html="";
  for(let i=1;i<=LIMIT;i++){
    let isDone = i <= stat.count;
    html += `<button class="offer-btn ${isDone?'done':''}" onclick="clickOffer(${i})" ${isDone?'disabled':''}>${isDone?'✅ Done':'🔥 Offer '+i+' - +'+PER_OFFER+' pts'}</button>`;
  }
  document.getElementById("offersList").innerHTML = html;
}
function clickOffer(n){
  if(stat.count >= LIMIT){ alert("Daily limit reached. Come tomorrow!"); return; }
  window.open(DIRECT_LINK, "_blank");
  stat.count++;
  stat.pts += PER_OFFER;
  save();
  addPointsToMain(PER_OFFER);
  render();
  setTimeout(()=>{ alert("+"+PER_OFFER+" pts added!"); }, 500);
}
render();
</script>
</body>
</html>
