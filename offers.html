<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px}
.box{background:#0f2a0f;border:2px solid gold;border-radius:20px;padding:20px;max-width:400px;width:100%;text-align:center}
.btn{background:#ffd700;color:#000;padding:12px;border-radius:10px;margin:10px 0;display:block;text-decoration:none;font-weight:bold}
.small{color:gold;font-size:13px;margin:10px}
</style></head><body>
<div class="box">
<h2>🔥 Bonus Offers</h2>
<div class="small" id="stat">Total Today: 0/10 pts<br><span id="done">0/5 done - Resets midnight</span></div>
<div id="list"></div>
<a href="index.html" class="btn" style="background:white">Back Home</a>
<div class="small">Rewards for watching. Open others for own interest.</div>
</div>
<script>
const DIRECT_LINK="https://asiafilm.org/4/fea14e9f802d182828ceef74e57a3a5b";
const DAILY_LIMIT=5; const PTS=2;
let today=new Date().toDateString();
let data=JSON.parse(localStorage.getItem("offers_stat")||"{}");
if(data.date!==today){data={date:today,count:0,pts:0};}
function save(){localStorage.setItem("offers_stat",JSON.stringify(data));update()}
function update(){
 document.getElementById("stat").innerHTML=`Total Today: ${data.pts}/10 pts<br>`;
 document.getElementById("done").innerHTML=`${data.count}/${DAILY_LIMIT} done - Resets midnight`;
 let h=""; for(let i=1;i<=DAILY_LIMIT;i++){
  let done=i<=data.count;
  h+=`<a class="btn" ${done?"style='opacity:0.4'":""} href="#" onclick="doOffer(${i});return false">${done?"✅ Done":"🔥 Offer "+i+" - +"+PTS+" pts"}</a>`;
 } document.getElementById("list").innerHTML=h;
}
function doOffer(n){
 if(data.count>=DAILY_LIMIT){alert("Limit reached today");return;}
 window.open(DIRECT_LINK,"_blank");
 data.count++; data.pts+=PTS; save();
 setTimeout(()=>{alert("+"+PTS+" pts added!");},800);
}
update();
</script></body></html>
