<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Platform</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  
  body {
    background: linear-gradient(135deg, #1a0033 0%, #330066 50%, #1a0033 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }

  .container { max-width: 400px; width: 100%; }

  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    padding: 8px 20px;
    border-radius: 20px;
    color: #FFD700;
    font-weight: bold;
    margin-bottom: 20px;
    border: 1px solid rgba(255,215,0,0.3);
  }

  h1 {
    font-size: 32px;
    margin-bottom: 15px;
    line-height: 1.2;
  }

  .gradient-text {
    background: linear-gradient(90deg, #FFD700, #FF6B9D, #C44DFF, #4D9DFF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  p {
    color: #cbd5e1;
    margin-bottom: 30px;
    font-size: 15px;
  }

  .btn-group {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
  }

.btn {
    flex: 1;
    padding: 8px 20px; /* ← WAS 14px 8px. Less height, more width */
    border-radius: 12px;
    font-weight: bold;
    font-size: 14px;
    text-decoration: none;
    color: #000;
    background: #fff;
    transition: all 0.2s;
    border: none;
    box-shadow: 0 6px 0 #ccc, 0 0 20px rgba(255,255,255,0.3);
    transform: translateY(0);
    min-width: 130px; /* ← ADDED: makes them wider */
  }

  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #ccc;
  }

  .icons {
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .icon-box {
    width: 50px;
    height: 50px;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    border: 1px solid rgba(255,255,255,0.2);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="badge">⭐ WELCOME</div>
    
    <h1>Welcome to<br><span class="gradient-text">Reward Platform</span></h1>
    
    <p>Complete activities, earn points, and<br>discover exciting rewards.</p>
    
    <div class="btn-group">
      <a href="log.html" class="btn">🚀 Login</a>
      <a href="reg.html" class="btn">📝 Register</a>
    </div>
    
    <div class="icons">
      <div class="icon-box">💰</div>
      <div class="icon-box">⭐</div>
      <div class="icon-box">🏆</div>
      <div class="icon-box">🎁</div>
    </div>
  </div>
</body>
</html>
