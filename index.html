<!DOCTYPE html>
<html>
<head>
<title>Maintenance Mode</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff}
.card{width:100%;max-width:480px;background:#fff;color:#111;border-radius:24px;padding:28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.icon{font-size:56px;margin-bottom:12px}h1{font-size:22px;font-weight:900;margin-bottom:8px}
.badge{display:inline-block;background:#fef3c7;border:1px solid #fbbf24;color:#92400e;padding:6px 14px;border-radius:999px;font-weight:900;font-size:12px;margin:12px 0}
p{color:#4b5563;font-size:14px;line-height:1.6;margin:12px 0}
.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:16px 0}
.progress-bar{height:100%;width:70%;background:linear-gradient(90deg,#fbbf24,#f59e0b);animation:load 2s infinite}
@keyframes load{0%{width:20%}50%{width:80%}100%{width:20%}}
.small{font-size:11px;color:#9ca3af;margin-top:16px}.btn{width:100%;background:#111827;color:#fff;border:none;border-radius:12px;padding:12px;font-weight:800;margin-top:12px;cursor:pointer}
.hidden{display:none}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #d1d5db;margin-bottom:6px}
</style>
</head>
<body>
<div class="card">
<div class="icon">🛠️</div>
<div class="badge">🚧 SYSTEM UPGRADE</div>
<h1>We are in Maintenance</h1>
<p><strong>Your balance & coins are 100% safe.</strong><br>We paused earning to rebuild ad system.</p>
<div class="progress"><div class="progress-bar"></div></div>
<p><strong>Back in:</strong> <span id="countdown">24h 00m</span></p>

<div id="loginBox" style="margin-top:16px;text-align:left;background:#f9fafb;padding:12px;border-radius:12px;border:1px solid #e5e7eb">
<div style="font-size:12px;font-weight:800;margin-bottom:6px">Admin / Tester Login</div>
<input id="email" type="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="adminLogin()" style="width:100%;margin-top:8px;background:#111827;color:#fff;border:none;border-radius:8px;padding:10px;font-weight:800;cursor:pointer">Login to Test</button>
<div id="loginMsg" style="font-size:11px;color:red;margin-top:4px"></div>
</div>

<button id="adminBtn" class="btn hidden" onclick="location.href='home.html'">Enter App → Home</button>
<div class="small">Allowed testers: rewardplatformrw@gmail.com, inezarose25@gmail.com<br>Thank you for patience 🙏</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",authDomain:"reward-platform-rw-2e13d.firebaseapp.com",projectId:"reward-platform-rw-2e13d"};
firebase.initializeApp(firebaseConfig);
const ADMIN_EMAILS=["rewardplatformrw@gmail.com","inezarose25@gmail.com"];
const MAINTENANCE_UNTIL = new Date(Date.now()+24*60*60*1000);

setInterval(()=>{
  const diff = MAINTENANCE_UNTIL - new Date();
  if(diff<=0){document.getElementById('countdown').textContent="Almost ready...";return;}
  const h=Math.floor(diff/3600000);
  const m=Math.floor((diff%3600000)/60000);
  document.getElementById('countdown').textContent=h+"h "+m+"m";
},1000);

function adminLogin(){
  const e=document.getElementById('email').value.trim();
  const p=document.getElementById('pass').value;
  firebase.auth().signInWithEmailAndPassword(e,p).then(u=>{
    if(!ADMIN_EMAILS.includes(u.user.email.toLowerCase())){
      document.getElementById('loginMsg').textContent="You are not in tester list. Maintenance mode.";
      return;
    }
    location.href='home.html';
  }).catch(err=>{document.getElementById('loginMsg').textContent=err.message;});
}

firebase.auth().onAuthStateChanged(user=>{
  if(user && ADMIN_EMAILS.includes(user.email.toLowerCase())){
    document.getElementById('adminBtn').classList.remove('hidden');
    document.getElementById('loginBox').classList.add('hidden');
  }
});
</script>
</body>
</html>
