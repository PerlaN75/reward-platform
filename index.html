<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reward Platform</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 50% 35%,
            #5b218f 0%,
            #241044 35%,
            #09071c 75%
        );

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================
   HOME
========================= */

.home {
    width: 100%;
    max-width: 850px;
    padding: 30px 20px;
    text-align: center;
}


/* Small welcome label */

.welcome-label {
    display: inline-block;

    padding: 9px 20px;
    margin-bottom: 25px;

    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 30px;

    background: rgba(255,255,255,0.07);

    color: #ffd84d;

    font-size: 14px;
    font-weight: bold;

    letter-spacing: 1px;
}


/* Main heading */

h1 {
    margin: 0;

    font-size: clamp(42px, 9vw, 76px);

    line-height: 1.05;
}


h1 span {

    background:
        linear-gradient(
            90deg,
            #ffd52f,
            #ff8a3d,
            #d53cff,
            #6b7cff
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}


/* Description */

.description {

    max-width: 600px;

    margin: 25px auto 35px;

    color: #dedbea;

    font-size: clamp(17px, 4vw, 21px);

    line-height: 1.6;
}


/* =========================
   START BUTTON
========================= */

.start-button {

    display: inline-block;

    padding: 17px 32px;

    border-radius: 15px;

    background:
        linear-gradient(
            90deg,
            #8b25ff,
            #287dff
        );

    color: white;

    text-decoration: none;

    font-size: 18px;
    font-weight: bold;

    box-shadow:
        0 10px 35px rgba(74,45,255,0.45);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


.start-button:hover {

    transform: translateY(-3px);

    box-shadow:
        0 14px 40px rgba(74,45,255,0.65);
}


/* =========================
   DECORATIVE REWARD SYMBOLS
========================= */

.reward-symbols {

    margin-top: 55px;

    display: flex;

    justify-content: center;

    gap: 25px;

    font-size: 34px;

    opacity: 0.9;
}


.reward-symbols span {

    width: 65px;
    height: 65px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 8px 25px rgba(0,0,0,0.25);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .home {
        padding: 25px 18px;
    }

    .welcome-label {
        font-size: 12px;
    }

    .description {
        margin-top: 20px;
        margin-bottom: 30px;
    }

    .start-button {
        width: 100%;
        max-width: 330px;
    }

    .reward-symbols {
        gap: 12px;
        margin-top: 45px;
    }

    .reward-symbols span {
        width: 55px;
        height: 55px;
        font-size: 27px;
    }

}

</style>

</head>


<body>

<main class="home">

    <div class="welcome-label">
        ⭐ WELCOME
    </div>


    <h1>
        Welcome to<br>
        <span>Reward Platform</span>
    </h1>


    <p class="description">
        Complete activities, earn points,
        and discover exciting rewards.
    </p>


    <a
        class="start-button"
        href="register.html">

        🚀 Start Earning Now

    </a>


    <!-- Temporary reward-themed visual.
         We can replace this with a proper
         illustration later. -->

    <div class="reward-symbols">

        <span>💰</span>

        <span>⭐</span>

        <span>🏆</span>

        <span>🎁</span>

    </div>

</main>

</body>

</html>
