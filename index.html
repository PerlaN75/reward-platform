<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Platform</title>

<!-- Silent Push Only - No visible ads on login -->
<script src="https://3nbf4.com/pfe/current/tag.min.js?z=11894084" data-cfasync="false" async></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body {
    background: linear-gradient(135deg, #1a0033 0%, #330066 50%, #1a0033 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 60px 20px 20px 20px;
    text-align: center;
  }
  .hero-emoji {
    font-size: 100px;
    margin-bottom: 15px;
    animation: bounce 1.8s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.5));
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-15px) scale(1.05); }
  }
  h1 { font-size: 32px; margin-bottom: 10px; line-height: 1.3; }
  .gradient-text {
    background: linear-gradient(90deg, #FFD700, #FF69B4, #3B82F6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: bold;
  }
  .subtitle { color: #cbd5e1; font-size: 15px; margin-bottom: 30px; max-width: 300px; }

  /* === NEW RECTANGLE LIKE YOUR DRAWING === */
  .start-rect{
    width:88%; max-width:320px;
    background:#ffffff;
    border-radius:18px;
    padding:18px 15px 16px 15px;
    text-align:center;
    box-shadow:0 6px 0 #d1d5db, 0 10px 25px rgba(0,0,0,0.4);
    margin-bottom:25px;
  }
  .start-rect .title{
    font-size:20px; font-weight:bold; color:#000; letter-spacing:0.3px;
  }
  .hamburger{
    margin:12px auto 0 auto;
    width:36px; cursor:pointer;
    display:flex; flex-direction:column; gap:5px; align-items:center;
  }
  .hamburger span{
    display:block; width:26px; height:3px; background:#000; border-radius:3px;
  }
  .start-popup{
    display:none; position:fixed; z-index:9999;
    left:0; top:0; width:100%; height:100%;
    background:rgba(0,0,0,0.75);
    justify-content:center; align-items:center;
    padding:20px;
  }
  .start-popup-box{
    background:#ffffff; border-radius:18px; padding:22px;
    width:100%; max-width:300px; text-align:center;
  }
  .start-popup-box h3{ color:#000; margin-bottom:14px; font-size:18px; }
  .popup-btn{
    width:100%; padding:15px; margin:8px 0;
    background:#f3f4f6; border:none; border-radius:12px;
    font-weight:bold; font-size:16px; cursor:pointer; color:#000;
  }
  .popup-btn:active{ transform:scale(0.97); }

  .icons { display: flex; gap: 20px; justify-content: center; }
  .icon-box {
    width: 55px; height: 55px; background: rgba(255,255,255,0.1);
    border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 26px;
  }
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
  <div class="hero-emoji">💰</div>
  <h1>Welcome to<br><span class="gradient-text">Reward Platform</span></h1>
  <p class="subtitle">Complete activities, earn points, and discover exciting rewards.</p>

  <!-- REPLACED BUTTONS WITH YOUR DRAWING -->
  <div class="start-rect">
    <div class="title">Start Now</div>
    <div class="hamburger" onclick="openStartPopup()">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <div class="icons">
    <div class="icon-box">⭐</div>
    <div class="icon-box">🏆</div>
    <div class="icon-box">🎁</div>
  </div>

<!-- POPUP WITH LOGIN / REGISTER -->
<div id="startPopup" class="start-popup" onclick="this.style.display='none'">
  <div class="start-popup-box" onclick="event.stopPropagation()">
    <h3>Choose</h3>
    <button class="popup-btn" onclick="location.href='log.html'">🚀 Login</button>
    <button class="popup-btn" onclick="location.href='reg.html'">📝 Register</button>
    <div style="margin-top:12px; font-size:12px; color:#888; cursor:pointer;" onclick="document.getElementById('startPopup').style.display='none'">Close</div>
  </div>
</div>

<script>
function openStartPopup(){ document.getElementById('startPopup').style.display='flex'; }

const firebaseConfig = {
  apiKey: "AIzaSyCm5GiSMg1puUQpteguN5GE34C76M-a0co",
  authDomain: "reward-platform-rw-2e13d.firebaseapp.com",
  projectId: "reward-platform-rw-2e13d"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
async function loadUserToLocal(uid) {
  const userDoc = await db.collection("users").doc(uid).get();
  if(userDoc.exists){
    const data = userDoc.data();
    localStorage.setItem('username', data.username || 'Guest');
    localStorage.setItem('email', data.email || '');
    localStorage.setItem('points', (data.balance || 0).toString());
    localStorage.setItem('referrals', (data.referralCount || 0).toString());
    let joined = data.createdAt ? data.createdAt.toDate() : new Date();
    let joinedDate = joined.toLocaleDateString('en-GB', {day: '2-digit', month: 'short', year: 'numeric'});
    localStorage.setItem('dateJoined', joinedDate);
  }
}
auth.onAuthStateChanged((user) => {
  if (user) {
    loadUserToLocal(user.uid);
  }
});
</script>
</body>
</html>
