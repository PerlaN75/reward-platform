<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Platform</title>
<script src="https://www.google.com/recaptcha/enterprise.js?render=6LdX8O4tAAAAAIFy3dIGD1YbLbjrIeJIMnJv86r1"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:linear-gradient(135deg,#1a0033 0%,#330066 50%,#1a0033 100%);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:60px 20px 90px;text-align:center}
.hero-emoji{font-size:100px;margin-bottom:15px;animation:bounce 1.8s infinite;filter:drop-shadow(0 0 25px rgba(255,215,0,0.5))}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
  h1{font-size:32px;margin-bottom:10px;line-height:1.3}
.gradient-text{background:linear-gradient(90deg,#FFD700,#FF69B4,#3B82F6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:bold}
.subtitle{color:#cbd5e1;font-size:15px;margin-bottom:30px;max-width:300px}
.start-rect{width:55%;max-width:200px;background:linear-gradient(180deg,#fef2f2,#fecaca);border:2px solid #ef4444;border-radius:18px;padding:16px 15px 14px;text-align:center;box-shadow:0 4px 0 #fff,0 10px 25px rgba(0,0,0,0.4);margin-bottom:25px;display:flex;flex-direction:column;align-items:center}
.start-rect .title{font-size:18px;font-weight:800;color:#7f1d1d!important;letter-spacing:0.3px}
.hamburger{margin-top:10px;width:32px;cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center}
.hamburger span{display:block;width:24px;height:3px;background:#000;border-radius:3px}
.start-popup{display:none;position:fixed;z-index:9999;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.65)}
.start-popup-box{background:#1a0033;width:70%;max-width:270px;height:100%;border-radius:0 20px 20px 0;padding:28px 18px;display:flex;flex-direction:column;gap:14px;animation:slideIn.3s ease}
  @keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.popup-btn{width:100%;padding:15px;background:#fff;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;color:#000;text-align:center;box-shadow:0 4px 0 #d1d5db}
.close-btn{width:40%;margin-top:auto;background:#4B5320;color:#fff;padding:13px;border-radius:12px;border:none;font-weight:bold;cursor:pointer;align-self:center}
.icons{display:flex;gap:15px;justify-content:center}
.icon-box{width:55px;height:55px;background:rgba(255,255,255,0.1);border-radius:15px;display:flex;justify-content:center;align-items:center;font-size:26px;position:relative;cursor:pointer}
.notif-count{position:absolute;top:-6px;right:-6px;background:#ff0000;color:#fff;min-width:22px;height:22px;padding:0 6px;border-radius:11px;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.notif-modal{display:none;position:fixed;z-index:10000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;padding:15px}
.notif-modal-box{background:#fff;width:100%;max-width:380px;border-radius:18px;padding:18px;max-height:80vh;overflow-y:auto;color:#000;text-align:left}
.notif-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.notif-close{font-size:26px;cursor:pointer;font-weight:bold}
.notif-item{background:#f3f4f6;border-radius:12px;padding:12px 40px 12px 12px;margin-bottom:10px;position:relative;font-size:14px;color:#111;line-height:1.4}
.notif-del{position:absolute;right:8px;top:8px;width:28px;height:28px;background:#ff0000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold;font-size:14px}
.notif-empty{text-align:center;color:#777;padding:20px 0;font-size:14px}
</style>
