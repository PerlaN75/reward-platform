<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Notifications - Reward Platform</title>


<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}


/* =========================
   TOP NAVIGATION
========================= */

.top-nav {
    background: #182848;
    padding: 12px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    overflow-x: auto;
}

.nav-button {
    display: inline-block;
    padding: 11px 16px;
    background: rgba(255,255,255,0.12);
    color: white;
    text-decoration: none;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
}

.nav-button:hover {
    background: rgba(255,255,255,0.22);
}


/* =========================
   HEADER
========================= */

header {
    background: #182848;
    color: white;
    padding: 28px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    animation: headingColor 3s infinite alternate;
}

header p {
    margin: 8px 0 0;
}

@keyframes headingColor {

    0% {
        color: white;
    }

    100% {
        color: #00bfff;
    }

}


/* =========================
   MAIN CONTAINER
========================= */

.container {
    max-width: 750px;
    margin: auto;
    padding: 15px;
}


/* =========================
   CONTROL CARD
========================= */

.control-card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin: 15px 0;
    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

.notification-count {
    text-align: center;
    font-weight: bold;
    margin-bottom: 15px;
    color: #182848;
}

.control-buttons {
    display: flex;
    gap: 10px;
}

.control-button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #182848;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.control-button:hover {
    opacity: 0.9;
}

.clear-button {
    background: #c62828;
}


/* =========================
   NOTIFICATION CARD
========================= */

.notification-card {
    position: relative;

    background: white;

    border-radius: 14px;

    padding: 18px;

    margin: 15px 0;

    padding-right: 55px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);

    border-left: 5px solid #2196f3;
}

.notification-card.unread {
    background: #eef7ff;
    border-left-color: #182848;
}


/* =========================
   DELETE X BUTTON
========================= */

.delete-x {
    position: absolute;

    top: 10px;

    right: 10px;

    width: 34px;

    height: 34px;

    border: none;

    border-radius: 50%;

    background: #eeeeee;

    color: #555;

    font-size: 20px;

    font-weight: bold;

    line-height: 34px;

    text-align: center;

    cursor: pointer;

    padding: 0;
}

.delete-x:hover {
    background: #c62828;
    color: white;
}


/* =========================
   NOTIFICATION HEADER
========================= */

.notification-header {
    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 10px;
}

.notification-title {
    font-size: 17px;
    font-weight: bold;
}

.notification-time {
    font-size: 13px;
    color: #777;
    white-space: nowrap;
}


/* =========================
   NOTIFICATION MESSAGE
========================= */

.notification-message {
    margin-top: 10px;
    line-height: 1.5;
    color: #444;
}


/* =========================
   NOTIFICATION ACTION
========================= */

.notification-actions {
    margin-top: 14px;
}

.small-button {
    padding: 9px 12px;
    border: none;
    border-radius: 8px;
    background: #182848;
    color: white;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.small-button:hover {
    opacity: 0.9;
}


/* =========================
   EMPTY STATE
========================= */

.empty-state {
    background: white;
    border-radius: 14px;
    padding: 35px 20px;
    margin-top: 15px;
    text-align: center;
    color: #777;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 10px;
}


/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    padding: 25px;
    color: #666;
    font-size: 14px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .control-buttons {
        flex-direction: column;
    }

    .notification-header {
        flex-direction: column;
    }

    .notification-time {
        white-space: normal;
    }

    .notification-card {
        padding-right: 50px;
    }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN PROTECTION
========================= -->

<script>

if (
    localStorage.getItem("loggedIn")
    !== "true"
) {

    window.location.href =
        "login.html";

}

</script>


<!-- =========================
     TOP NAVIGATION
========================= -->

<nav class="top-nav">

    <button
        type="button"
        class="nav-button"
        onclick="goBack()">

        ← Back

    </button>


    <a
        href="notifications.html"
        class="nav-button">

        🔔 Notifications

    </a>

</nav>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>🔔 Notifications</h1>

    <p>
        Important updates and activity from
        Reward Platform.
    </p>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


    <!-- =========================
         CONTROLS
    ========================= -->

    <div class="control-card">

        <div
            class="notification-count"
            id="notificationCount">

            0 unread notifications

        </div>


        <div class="control-buttons">


            <button
                type="button"
                class="control-button"
                onclick="markAllAsRead()">

                ✅ Mark All as Read

            </button>


            <button
                type="button"
                class="control-button clear-button"
                onclick="clearAllNotifications()">

                🗑️ Clear All

            </button>


        </div>

    </div>


    <!-- =========================
         NOTIFICATION LIST
    ========================= -->

    <div id="notificationList">

    </div>


</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    Reward Platform — Prototype

</footer>


<script>

/* =====================================================
   GET NOTIFICATIONS
===================================================== */

function getNotifications() {

    let notifications = [];


    try {

        notifications =
            JSON.parse(
                localStorage.getItem(
                    "rewardNotifications"
                )
            ) || [];

    } catch (error) {

        notifications = [];

    }


    return notifications;

}


/* =====================================================
   SAVE NOTIFICATIONS
===================================================== */

function saveNotifications(
    notifications
) {

    localStorage.setItem(
        "rewardNotifications",
        JSON.stringify(
            notifications
        )
    );

}


/* =====================================================
   DISPLAY NOTIFICATIONS
===================================================== */

function displayNotifications() {

    const list =
        document.getElementById(
            "notificationList"
        );


    const count =
        document.getElementById(
            "notificationCount"
        );


    const notifications =
        getNotifications();


    list.innerHTML = "";


    /* =========================
       COUNT UNREAD
    ========================= */

    const unread =
        notifications.filter(
            function(notification) {

                return !notification.read;

            }
        ).length;


    count.textContent =
        unread +
        (
            unread === 1
                ? " unread notification"
                : " unread notifications"
        );


    /* =========================
       EMPTY STATE
    ========================= */

    if (
        notifications.length === 0
    ) {

        list.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    🔔
                </div>

                <h2>
                    No Notifications
                </h2>

                <p>
                    You don't have any notifications
                    yet.
                </p>

            </div>

        `;

        return;

    }


    /* =========================
       DISPLAY EACH NOTIFICATION
    ========================= */

    notifications.forEach(
        function(notification, index) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "notification-card";


            if (
                !notification.read
            ) {

                card.classList.add(
                    "unread"
                );

            }


            card.innerHTML = `

                <!-- DELETE X -->

                <button
                    type="button"
                    class="delete-x"
                    onclick="deleteNotification(${index})"
                    aria-label="Delete notification">

                    ×

                </button>


                <!-- NOTIFICATION HEADER -->

                <div class="notification-header">

                    <div class="notification-title">

                        ${notification.title}

                    </div>

                    <div class="notification-time">

                        ${notification.time}

                    </div>

                </div>


                <!-- MESSAGE -->

                <div class="notification-message">

                    ${notification.message}

                </div>


                <!-- MARK AS READ -->

                ${
                    !notification.read
                    ?
                    `
                    <div class="notification-actions">

                        <button
                            type="button"
                            class="small-button"
                            onclick="markAsRead(${index})">

                            ✅ Mark as Read

                        </button>

                    </div>
                    `
                    :
                    ""
                }

            `;


            list.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   MARK ONE AS READ
===================================================== */

function markAsRead(index) {

    const notifications =
        getNotifications();


    if (
        notifications[index]
    ) {

        notifications[index].read =
            true;

    }


    saveNotifications(
        notifications
    );


    displayNotifications();

}


/* =====================================================
   MARK ALL AS READ
===================================================== */

function markAllAsRead() {

    const notifications =
        getNotifications();


    notifications.forEach(
        function(notification) {

            notification.read =
                true;

        }
    );


    saveNotifications(
        notifications
    );


    displayNotifications();

}


/* =====================================================
   DELETE ONE NOTIFICATION
===================================================== */

function deleteNotification(index) {

    const notifications =
        getNotifications();


    if (
        index < 0 ||
        index >= notifications.length
    ) {

        return;

    }


    notifications.splice(
        index,
        1
    );


    saveNotifications(
        notifications
    );


    displayNotifications();

}


/* =====================================================
   CLEAR ALL NOTIFICATIONS
===================================================== */

function clearAllNotifications() {

    const notifications =
        getNotifications();


    if (
        notifications.length === 0
    ) {

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to clear all notifications?"
        );


    if (!confirmed) {

        return;

    }


    localStorage.removeItem(
        "rewardNotifications"
    );


    displayNotifications();

}


/* =====================================================
   BACK BUTTON
===================================================== */

function goBack() {

    window.history.back();

}


/* =====================================================
   START PAGE
===================================================== */

displayNotifications();

</script>


</body>

</html>
